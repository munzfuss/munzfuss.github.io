# The German-lands site: munzfuss.github.io
#
# The landing grid, pages mounted under /<loc>/<lang>/. This is the profile
# the build uses when --site is not given.
#
# Denmark is excluded: it publishes as its own site, danskmoent.github.io,
# from this same data. Keeping it here too would put the identical page on
# two hosts competing with each other in search. The DATA stays — the Danish
# entity files still feed schleswig_holstein, which shares royal_slesvig,
# royal_holstein and gottorp_duchy with it.
id: munzfuss
origin: https://munzfuss.github.io
out_dir: site
all_except: [denmark]
languages: [de, en, uk]
root_lang: en
landing: true
mount: tree
# Google Search Console token for munzfuss.github.io lives here.
static_dir: static
# The site's own name, in the <title> and the footer. The kicker above the
# <h1> is left to the localised `hero.eyebrow` in data/i18n/ui.yml, where it
# is a generic descriptor («Монетні стандарти» in uk) and so does translate.
brand: Müntzfüße
