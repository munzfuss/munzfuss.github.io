# The German-lands site: munzfuss.github.io
#
# Every location in data/v2/locations/, the landing grid, pages mounted
# under /<loc>/<lang>/. This is the profile the build uses when --site is
# not given, so its output must stay byte-identical to the pre-profile
# build.
#
# `all_except: []` means «every location»; the Denmark page is removed
# from this list on the day danskmoent.github.io is confirmed serving
# content, not before (a redirect pointing at a dead host is worse than
# a duplicate page).
id: munzfuss
origin: https://munzfuss.github.io
out_dir: site
all_except: []
languages: [de, en, uk]
root_lang: en
landing: true
mount: tree
# Google Search Console token for munzfuss.github.io lives here.
static_dir: static
# The site's own name, in the <title> and the footer. The kicker above the
# <h1> is left to the localised `hero.eyebrow` in data/i18n/ui.yml, where it
# is a generic descriptor («Монетні стандарти» in uk) and so does translate.
brand: Müntzfüße
