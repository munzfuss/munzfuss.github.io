# The Danish site: danskmoent.github.io
#
# One page — Denmark — mounted at the site root, so <host>/ IS the
# Denmark page and there is no landing grid to click through. The data is
# not duplicated: this profile renders the same
# data/v2/locations/denmark.yml and the same Danish entity finals that
# munzfuss reads.
#
# `languages` is the ONE place the Danish language is switched on; adding
# `da` here is the whole of that change on the build side (the prose then
# needs `da:` keys, which is a separate body of work).
id: danskmoent
origin: https://danskmoent.github.io
out_dir: site-danskmoent
locations: [denmark]
languages: [de, en, uk]
root_lang: en
landing: false
mount: root
# Its own root-served files, NOT munzfuss's: a Search Console token proves
# ownership of ONE host, and a CNAME would name ONE domain. The directory
# does not exist yet and does not need to until there is a token to put in it.
static_dir: static-danskmoent
# A Danish site brands itself in Danish. «Møntfod» is the Danish term for a
# Müntzfuß and is attested on danskmoent.dk itself (scripts/cache/danskmoent:
# «møntfod», «møntfoden»), so it is a real term, not a coinage. Being a
# -fod standard name it is the same string in every language (§2 tier 2),
# which is also why the eyebrow is overridden rather than left to the
# translated `hero.eyebrow`.
brand: Møntfod
eyebrow: Møntfod
