name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # NOTE: scripts/cache/ is a private submodule (munzfuss-harvest).
        # The build doesn't read it — `python scripts/build.py` works only
        # from data/ + templates/ + config/. So `submodules: false` (the
        # default) is correct here: the Pages deploy stays unaffected by
        # the harvest split. If a future step needs cache (e.g. nightly
        # audit), add:
        #   with:
        #     submodules: true
        #     token: ${{ secrets.HARVEST_DEPLOY_KEY }}
        # plus a read-only deploy key configured on the harvest repo.

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate data
        run: python scripts/build.py --validate-only

      - name: Setup Pages
        uses: actions/configure-pages@v5
        id: pages

      - name: Build site
        # base_path is provided by configure-pages: "/repo-name" for project pages,
        # "/" for user/org pages and custom domains. We strip a lone "/" so it
        # doesn't produce double slashes when prefixed to asset URLs.
        # CONTACT_EMAIL: optional GitHub Actions secret; if unset, the landing
        # footer simply omits the «Contact» link (no error).
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: |
          BASE_URL="${PAGES_BASE_PATH%/}"
          python scripts/build.py \
            --clean \
            --base-url "$BASE_URL" \
            --repo-url https://github.com/${{ github.repository }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ---------------------------------------------------------------------------
  # danskmoent.github.io — the Danish site, built from THIS repository's data
  # by the `danskmoent` site profile (config/sites/danskmoent.yml) and pushed
  # to a separate repository that serves it.
  #
  # Independent of the `build` job above rather than `needs:`-chained: it runs
  # the same schema validation itself (build.py validates before rendering), so
  # broken data fails this job too — and in parallel, not after a 4-minute wait.
  # ---------------------------------------------------------------------------
  danskmoent:
    runs-on: ubuntu-latest
    permissions:
      contents: read        # pushes via the deploy key below, not GITHUB_TOKEN
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # No submodule here either — see the note in the `build` job.

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build the Danish site
        # --base-url is EMPTY on purpose: the target is an org-pages root
        # (danskmoent.github.io), not a project sub-path, so asset and
        # canonical URLs are absolute from «/». The profile supplies the
        # origin, the output tree, the languages and the root mount.
        # --repo-url stays THIS repository: the footer's source link points at
        # where the data actually lives, which is here.
        run: |
          python scripts/build.py \
            --clean \
            --site danskmoent \
            --base-url "" \
            --repo-url https://github.com/${{ github.repository }}

      - name: Publish to danskmoent.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          # Repository-scoped SSH key: write access to that one repository and
          # nothing else. Public half sits in its Deploy keys, private half in
          # this repository's secrets.
          deploy_key: ${{ secrets.DANSKMOENT_DEPLOY_KEY }}
          external_repository: danskmoent/danskmoent.github.io
          publish_branch: gh-pages
          publish_dir: ./site-danskmoent
          # The rendered site is ~58 MB. Without force_orphan the branch would
          # keep every snapshot ever published; with it, the branch holds only
          # the latest commit.
          force_orphan: true
          # NOTE on «only publish when something changed»: it does NOT happen
          # here, and the first two runs proved it. `allow_empty_commit`
          # defaults to false, but `force_orphan` rewrites the branch
          # unconditionally, so the empty-commit check never gets a say — an
          # unchanged rerun produced a NEW commit (9db21fe → d53db0e) around
          # the very same tree object (6f0f913 both). Kept as-is, because the
          # two settings solve the same problem and force_orphan solves it
          # better: the branch holds one commit, and an identical tree
          # transfers no new objects. The residual cost is a needless ~30 s
          # Pages rebuild when a push touches nothing Danish. Dropping
          # force_orphan would restore the gate but let the branch accumulate
          # a full ~58 MB snapshot per change.
          #
          # There is deliberately no path filter on the trigger either: this
          # page depends on data/shared/**, data/i18n/**, eight entity finals,
          # templates/** and scripts/** — nearly everything — and GitHub's
          # `paths-ignore` has no glob negation, so an enumerated filter would
          # go stale as entities are added and silently freeze the site.
          full_commit_message: "site: rebuild from munzfuss@${{ github.sha }}"
