# HELD-OUT set for the kb measurement (scripts/kb/measure.py --set b).
#
# Written 2026-10-19 AFTER the first measurement (eval_set.yml) but BEFORE the
# second round of normaliser changes (æ/e fold, compound splitting), which
# were motivated by eval_set.yml's failures. This set was never used to design
# those changes, so it shows whether they generalise or only fit set A.
# Same format as eval_set.yml; a case without `printed` / `path` lets the
# quote pick its gold passage anywhere in the work.

cases:
- key: secher-ccd-3-487-1618-soelvkrone
  query: sølvkrone 13¾ lod fint sølv halvanden rigsdaler
  grep: sølvkrone
  work: secher-ccd
  printed: ['529']
  probe: halfanden

- key: secher-ccd-3-541-1619-rigsdaler-96-sk
  query: rigsdaler spansk matte otte realer skilling danske
  grep: spansk matte
  work: secher-ccd
  printed: ['599']
  probe: realer

- key: secher-ccd-4-20-1622-tarif
  query: rosenobel ungersk dukat guldgylden mark danske
  grep: rosenobel
  work: secher-ccd
  printed: ['21']
  probe: rosenobel

- key: secher-ccd-1-210-1564-laan-klippinge
  query: låne klipping lensmænd rund mønt
  grep: klippinge
  work: secher-ccd
  printed: ['244', '245']
  probe: klippinge

- key: secher-ccd-3-309-1609-fremmed-smaamoent
