# Go/no-go measurement for the kb pilot (scripts/kb/measure.py).
#
# Each case is a passage already quoted in data/shared/refs_pool.yml whose
# source is in the pilot corpus. `query` is what a researcher would type —
# a concept or keywords in MODERN spelling, not the quoted string. `grep` is
# the single keyword or phrase the same researcher would grep for today.
# The target is where the quoted passage actually sits in the cache:
#   printed: [...]   printed page(s) of the passage (a quote may cross a page)
#   path:            substring of the text-layer path (unpaginated works)
# `probe` is a word of the quote in the SOURCE's spelling; measure.py checks it
# is present in the target passage, so a wrong gold location fails loudly.
#
# Written before the first measurement run and NOT tuned afterwards: a query
# changed to make kb win would measure nothing.

