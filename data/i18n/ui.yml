landing.gf.subheading:
  de: "Übersicht der Reichsmünzfüße, der süd- und norddeutschen Courantfüße, der Hansestadt-Bancovaluten und der Vereins- bzw. Reichsgoldmünzfüße — von der Augsburger Reichsmüntzordnung 1559/1566 biß zur Reichsmark 1871/1875."
  en: "Overview of the imperial standards, the South- and North-German Courant standards, the Hanseatic Banco currencies and the Vereinsmünzfuß / Reichsgoldmünzfuß — from the Augsburg Imperial Mint Ordinance of 1559/1566 to the Reichsmark of 1871/1875."
  uk: "Огляд імперських стандартів, південно- та північно-німецьких курант-стандартів, ганзейських Banco-валют та Vereinsmünzfuß / Reichsgoldmünzfuß — від Аугсбурзького імператорського монетного регламенту 1559/1566 до Reichsmark 1871/1875."
  da: "Oversigt over rigsmøntfødderne, de syd- og nordtyske kurantfødder, hansestædernes Banco-valutaer og Vereinsmünzfuß / Reichsgoldmünzfuß — fra den augsburgske rigsmøntordning 1559/1566 til Reichsmark 1871/1875."

