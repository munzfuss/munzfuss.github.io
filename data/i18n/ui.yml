# pair: «1640—1646 · Монет: 7» / «Coins: 7» / «Münzen: 7». Putting the
# noun before a colon and the count after sidesteps Ukrainian/German
# pluralisation entirely — the genitive-plural form is grammatically
# valid for any count when used as a label («Of coins: 1»).
tl.coin_year.coins:
  de: "Münzen"
  en: "Coins"
  uk: "Монет"
  da: "Mønter"

# Master «select all» chip in the timeline filter strip; sits to the
# LEFT of the per-entity checkboxes and (once wired up interactively)
# toggles every entity chip in one click.
tl.filter.all:
  de: "Alle"
  en: "All"
  uk: "Усі"
  da: "Alle"

# Metal names for the «Metall» column. These lived as two literal maps inside
# location.html.j2, indexed directly by `lang` — which rendered an empty cell
# for any language the maps did not list. Here they pick up every language the
# site renders, like every other string on the page.
metal.silver:
  de: Silber
  en: Silver
  uk: Срібло
  da: Sølv

metal.gold:
  de: Gold
  en: Gold
  uk: Золото
  da: Guld

metal.billon:
  de: Billon
  en: Billon
  uk: Білон
  da: Billon

metal.copper:
  de: Kupfer
  en: Copper
  uk: Мідь
  da: Kobber

metal.lead:
  de: Blei
  en: Lead
  uk: Свинець
  da: Bly

metal.bronze:
  de: Bronze
  en: Bronze
  uk: Бронза
