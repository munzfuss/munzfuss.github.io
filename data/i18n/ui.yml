  de: "Übersicht der Reichsmünzfüße, der süd- und norddeutschen Courantfüße, der Hansestadt-Bancovaluten und der Vereins- bzw. Reichsgoldmünzfüße — von der Augsburger Reichsmüntzordnung 1559/1566 biß zur Reichsmark 1871/1875."
