  da: "Oversigt over rigsmøntfødderne, de syd- og nordtyske kurantfødder, hansestædernes Banco-valutaer og Vereinsmünzfuß / Reichsgoldmünzfuß — fra den augsburgske rigsmøntordning 1559/1566 til Reichsmark 1871/1875."

