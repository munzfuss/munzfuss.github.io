# Replaced with the count of DISTINCT `nominal` strings across all coins
# in this Fuss on the current page — a denomination-type tally, not a
# Grundwerte-row tally. Singular form for n == 1, plural otherwise. The
# Ukrainian plural follows the «1 / 2-4 / 5+» rule but the «5+» genitive
# form («номіналів») reads naturally for «1 номінал»-edge cases too — we
# split _one / _many anyway for parity with `phase_one / phase_many`.
