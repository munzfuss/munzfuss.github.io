danskmoent-f2h7f-gavesaet-guldkrone:
  de: '<b>danskmoent.dk</b>: <i>Frederik 2., Hede 7 — Guldkrone 1584, Frederiksborg</i> — <a href="https://www.danskmoent.dk/fr/f2h7f.htm" target="_blank">danskmoent.dk/fr/f2h7f.htm</a>. «<i>Forside: sammenslynget FS, bagside: værdiangivelse. Del af Dronning Sophies gavesæt. (Hede 7F, Schou 5, Sieg 29) Vægt: 3,38g</i>». Probe nicht überliefert. Weiterführende Literatur der Seite: Wilcke, Julius: <i>Frederik II.s Guldmønt 1584</i>, in: Daler, Mark og Kroner 1481-1914 (København 1931), S. 85-90.'
  en: '<b>danskmoent.dk</b>: <i>Frederik 2, Hede 7 — Guldkrone 1584, Frederiksborg</i> — <a href="https://www.danskmoent.dk/fr/f2h7f.htm" target="_blank">danskmoent.dk/fr/f2h7f.htm</a>. «<i>Forside: sammenslynget FS, bagside: værdiangivelse. Del af Dronning Sophies gavesæt. (Hede 7F, Schou 5, Sieg 29) Vægt: 3,38g</i>». Fineness not transmitted. Further literature given on the page: Wilcke, Julius: <i>Frederik II.s Guldmønt 1584</i>, in: Daler, Mark og Kroner 1481-1914 (Copenhagen 1931), pp. 85-90.'
  uk: '<b>danskmoent.dk</b>: <i>Frederik 2., Hede 7 — Guldkrone 1584, Frederiksborg</i> — <a href="https://www.danskmoent.dk/fr/f2h7f.htm" target="_blank">danskmoent.dk/fr/f2h7f.htm</a>. «<i>Forside: sammenslynget FS, bagside: værdiangivelse. Del af Dronning Sophies gavesæt. (Hede 7F, Schou 5, Sieg 29) Vægt: 3,38g</i>». Пробу в джерелі не зафіксовано. Додаткова література, наведена на сторінці: Wilcke, Julius: <i>Frederik II.s Guldmønt 1584</i>, у: Daler, Mark og Kroner 1481-1914 (Копенгаген 1931), с. 85-90.'
  da: '<b>danskmoent.dk</b>: <i>Frederik 2., Hede 7 — Guldkrone 1584, Frederiksborg</i> — <a href="https://www.danskmoent.dk/fr/f2h7f.htm" target="_blank">danskmoent.dk/fr/f2h7f.htm</a>. «<i>Forside: sammenslynget FS, bagside: værdiangivelse. Del af Dronning Sophies gavesæt. (Hede 7F, Schou 5, Sieg 29) Vægt: 3,38g</i>». Lødigheden er ikke overleveret. Sidens videre litteratur: Wilcke, Julius: <i>Frederik II.s Guldmønt 1584</i>, i: Daler, Mark og Kroner 1481-1914 (København 1931), s. 85-90.'

wilcke1-moentordning-1602-guld:
  de: '<b>Galster, Georg</b>, leicht bearbeitete Fassung des Schemas von <b>Wilcke, Julius</b>: <i>Christian IV.s Møntpolitik 1588-1625</i> (København 1919), S. 69 — Anmerkung der Seite: «<i>Nedenstående er vist Galsters let bearbejdede version af Wilckes skema</i>» — via danskmoent.dk — <a href="https://www.danskmoent.dk/wilcke/w1d.htm" target="_blank">danskmoent.dk/wilcke/w1d.htm</a>. Karbungstabelle der Møntanordning af 8. September 1602, Spalte «<i>Lovbestemt Værdi</i>»: Portugaløser = 17 Dlr. (6¾ Stück je Marck, 23½ Karat), Ungersk Gylden = 1⅝ Dlr. (67 Stück, 23⅓ Karat), 8 Daler Klipping 13¼ Stück / 22½ Karat, 6 Daler 17¾ / 22⅙, 4 Daler 24 / 20. Zum Verhältnis Gold-Silber ebenda: «<i>Sammenholdes Daleren derimod med 4 Daler Guldklipping af Finvægt 8,119 gr., bliver Tallet 12,80</i>». Zur 3 Daler: «<i>3 Daler Guldklipping er efter de foreliggende Oplysninger udmøntet som halv 6 Daler Klipping</i>» (S. 81).'
  en: '<b>Galster, Georg</b>, lightly reworked version of the scheme in <b>Wilcke, Julius</b>: <i>Christian IV''s Møntpolitik 1588-1625</i> (Copenhagen 1919), p. 69 — the page''s own note: «<i>Nedenstående er vist Galsters let bearbejdede version af Wilckes skema</i>» — via danskmoent.dk — <a href="https://www.danskmoent.dk/wilcke/w1d.htm" target="_blank">danskmoent.dk/wilcke/w1d.htm</a>. Minting table of the ordinance of 8 September 1602, column «<i>Lovbestemt Værdi</i>» (statutory value): Portugaløser = 17 dlr. (6¾ pieces per mark, 23½ carats), Ungersk Gylden = 1⅝ dlr. (67 pieces, 23⅓ carats), 8 daler klipping 13¼ pieces / 22½ carats, 6 daler 17¾ / 22⅙, 4 daler 24 / 20. On the gold-silver ratio, same page: «<i>Sammenholdes Daleren derimod med 4 Daler Guldklipping af Finvægt 8,119 gr., bliver Tallet 12,80</i>». On the 3 daler: «<i>3 Daler Guldklipping er efter de foreliggende Oplysninger udmøntet som halv 6 Daler Klipping</i>» (p. 81).'
  uk: '<b>Galster, Georg</b>, злегка перероблена версія схеми з <b>Wilcke, Julius</b>: <i>Christian IV.s Møntpolitik 1588-1625</i> (Копенгаген 1919), с. 69 — примітка самої сторінки: «<i>Nedenstående er vist Galsters let bearbejdede version af Wilckes skema</i>» — через danskmoent.dk — <a href="https://www.danskmoent.dk/wilcke/w1d.htm" target="_blank">danskmoent.dk/wilcke/w1d.htm</a>. Таблиця карбування ордонансу 8 вересня 1602, колонка «<i>Lovbestemt Værdi</i>» (установлена законом вартість): Portugaløser = 17 dlr. (6¾ штуки з марки, 23½ карата), Ungersk Gylden = 1⅝ dlr. (67 штук, 23⅓ карата), 8 daler klipping 13¼ штуки / 22½ карата, 6 daler 17¾ / 22⅙, 4 daler 24 / 20. Про співвідношення золота й срібла там само: «<i>Sammenholdes Daleren derimod med 4 Daler Guldklipping af Finvægt 8,119 gr., bliver Tallet 12,80</i>». Про 3 daler: «<i>3 Daler Guldklipping er efter de foreliggende Oplysninger udmøntet som halv 6 Daler Klipping</i>» (с. 81).'
  da: '<b>Galster, Georg</b>, i en let bearbejdet udgave af skemaet hos <b>Wilcke, Julius</b>: <i>Christian IV.s Møntpolitik 1588-1625</i> (København 1919), s. 69 — sidens egen note: «<i>Nedenstående er vist Galsters let bearbejdede version af Wilckes skema</i>» — via danskmoent.dk — <a href="https://www.danskmoent.dk/wilcke/w1d.htm" target="_blank">danskmoent.dk/wilcke/w1d.htm</a>. Udmøntningstabellen til Møntanordning af 8. september 1602, spalten «<i>Lovbestemt Værdi</i>»: portugaløser = 17 dlr. (6¾ stykker pr. marck, 23½ karat), ungersk gylden = 1⅝ dlr. (67 stykker, 23⅓ karat), 8 daler klipping 13¼ stykker / 22½ karat, 6 daler 17¾ / 22⅙, 4 daler 24 / 20. Om forholdet mellem guld og sølv sammesteds: «<i>Sammenholdes Daleren derimod med 4 Daler Guldklipping af Finvægt 8,119 gr., bliver Tallet 12,80</i>». Om 3-daleren: «<i>3 Daler Guldklipping er efter de foreliggende Oplysninger udmøntet som halv 6 Daler Klipping</i>» (s. 81).'

wilcke1-moentordning-1604-nedsaettelse:
  de: '<b>Wilcke, Julius</b>: <i>Christian IV.s Møntpolitik 1588-1625</i> (København 1919), S. 74, via danskmoent.dk — <a href="https://www.danskmoent.dk/wilcke/w1d.htm" target="_blank">danskmoent.dk/wilcke/w1d.htm</a>. Zu den Änderungen vom 20. November 1604: «<i>4 Daler Guldklipping skrodedes 24½ Stkr. i Stedet for 24 Stkr. paa den 20⅓ Karat i Stedet for 20 Karat fine Mark til 115½ Dlr.</i>», jedes Stück danach «<i>en Finvægt af 8,087 gr.</i>»; Portugaløser auf 16 Daler herabgesetzt, Ungersk Gylden auf 1 9/16 Daler, «<i>medens 4 Daler Guldklipping vedblev at have en Værdi af 4 Daler</i>». Zur Geltung: «<i>Guldmøntens Værdi er beregnet efter den oprindelige Møntanordning af 8. September 1602 uanset det i 1604 gjorte Forsøg paa en Nedsættelse, der … næppe har haft varig Betydning</i>» (S. 81).'
  en: '<b>Wilcke, Julius</b>: <i>Christian IV''s Møntpolitik 1588-1625</i> (Copenhagen 1919), p. 74, via danskmoent.dk — <a href="https://www.danskmoent.dk/wilcke/w1d.htm" target="_blank">danskmoent.dk/wilcke/w1d.htm</a>. On the ordinance of 20 November 1604: «<i>4 Daler Guldklipping skrodedes 24½ Stkr. i Stedet for 24 Stkr. paa den 20⅓ Karat i Stedet for 20 Karat fine Mark til 115½ Dlr.</i>», each piece thereafter «<i>en Finvægt af 8,087 gr.</i>»; the Portugaløser reduced to 16 daler, the Ungersk Gylden to 1 9/16 daler, «<i>medens 4 Daler Guldklipping vedblev at have en Værdi af 4 Daler</i>». On which ordinance governs: «<i>Guldmøntens Værdi er beregnet efter den oprindelige Møntanordning af 8. September 1602 uanset det i 1604 gjorte Forsøg paa en Nedsættelse, der … næppe har haft varig Betydning</i>» (p. 81).'
  uk: '<b>Wilcke, Julius</b>: <i>Christian IV.s Møntpolitik 1588-1625</i> (Копенгаген 1919), с. 74, через danskmoent.dk — <a href="https://www.danskmoent.dk/wilcke/w1d.htm" target="_blank">danskmoent.dk/wilcke/w1d.htm</a>. Про ордонанс 20 листопада 1604: «<i>4 Daler Guldklipping skrodedes 24½ Stkr. i Stedet for 24 Stkr. paa den 20⅓ Karat i Stedet for 20 Karat fine Mark til 115½ Dlr.</i>», кожна штука після того «<i>en Finvægt af 8,087 gr.</i>»; Portugaløser знижено до 16 далерів, Ungersk Gylden до 1 9/16 далера, «<i>medens 4 Daler Guldklipping vedblev at have en Værdi af 4 Daler</i>». Про чинність: «<i>Guldmøntens Værdi er beregnet efter den oprindelige Møntanordning af 8. September 1602 uanset det i 1604 gjorte Forsøg paa en Nedsættelse, der … næppe har haft varig Betydning</i>» (с. 81).'
  da: '<b>Wilcke, Julius</b>: <i>Christian IV.s Møntpolitik 1588-1625</i> (København 1919), s. 74, via danskmoent.dk — <a href="https://www.danskmoent.dk/wilcke/w1d.htm" target="_blank">danskmoent.dk/wilcke/w1d.htm</a>. Om ændringerne af 20. november 1604: «<i>4 Daler Guldklipping skrodedes 24½ Stkr. i Stedet for 24 Stkr. paa den 20⅓ Karat i Stedet for 20 Karat fine Mark til 115½ Dlr.</i>», hvorefter hvert stykke har «<i>en Finvægt af 8,087 gr.</i>»; portugaløseren blev sat ned til 16 daler, den ungerske gylden til 1 9/16 daler, «<i>medens 4 Daler Guldklipping vedblev at have en Værdi af 4 Daler</i>». Om rækkevidden: «<i>Guldmøntens Værdi er beregnet efter den oprindelige Møntanordning af 8. September 1602 uanset det i 1604 gjorte Forsøg paa en Nedsættelse, der … næppe har haft varig Betydning</i>» (s. 81).'

wilcke1-guldmoent-skuemoent:
  de: '<b>Wilcke, Julius</b>: <i>Christian IV.s Møntpolitik 1588-1625</i> (København 1919), S. 73, via danskmoent.dk — <a href="https://www.danskmoent.dk/wilcke/w1d.htm" target="_blank">danskmoent.dk/wilcke/w1d.htm</a>. Über das Gold der Ordnung von 1602: «<i>De Guldmønter, der fremkom, kunde ikke spille nogen virkelig Rolle for Handelssamkvemmet. Deres Forskelligartethed og indbyrdes afvigende Forholdstal til Sølv viser ogsaa, at de snarere var at anse for Skuemønt til festlig Lejlighed end som en konstant Handelsmønt</i>». Ebenda die gleichzeitigen Verhältniszahlen: England 11,90, Holland 11,29-11,64, Frankreich 11,88, Süddeutschland 12,22-12,24, Schweden nach der Møntordning 1604 13,35.'
  en: '<b>Wilcke, Julius</b>: <i>Christian IV''s Møntpolitik 1588-1625</i> (Copenhagen 1919), p. 73, via danskmoent.dk — <a href="https://www.danskmoent.dk/wilcke/w1d.htm" target="_blank">danskmoent.dk/wilcke/w1d.htm</a>. On the gold of the 1602 ordinance: «<i>De Guldmønter, der fremkom, kunde ikke spille nogen virkelig Rolle for Handelssamkvemmet. Deres Forskelligartethed og indbyrdes afvigende Forholdstal til Sølv viser ogsaa, at de snarere var at anse for Skuemønt til festlig Lejlighed end som en konstant Handelsmønt</i>». Same page, the contemporary ratios: England 11.90, Holland 11.29-11.64, France 11.88, southern Germany 12.22-12.24, Sweden after the 1604 ordinance 13.35.'
  uk: '<b>Wilcke, Julius</b>: <i>Christian IV.s Møntpolitik 1588-1625</i> (Копенгаген 1919), с. 73, через danskmoent.dk — <a href="https://www.danskmoent.dk/wilcke/w1d.htm" target="_blank">danskmoent.dk/wilcke/w1d.htm</a>. Про золото ордонансу 1602: «<i>De Guldmønter, der fremkom, kunde ikke spille nogen virkelig Rolle for Handelssamkvemmet. Deres Forskelligartethed og indbyrdes afvigende Forholdstal til Sølv viser ogsaa, at de snarere var at anse for Skuemønt til festlig Lejlighed end som en konstant Handelsmønt</i>». Там само тогочасні співвідношення: Англія 11,90, Голландія 11,29-11,64, Франція 11,88, Південна Німеччина 12,22-12,24, Швеція після Møntordning 1604 — 13,35.'
  da: '<b>Wilcke, Julius</b>: <i>Christian IV.s Møntpolitik 1588-1625</i> (København 1919), s. 73, via danskmoent.dk — <a href="https://www.danskmoent.dk/wilcke/w1d.htm" target="_blank">danskmoent.dk/wilcke/w1d.htm</a>. Om guldet i ordningen af 1602: «<i>De Guldmønter, der fremkom, kunde ikke spille nogen virkelig Rolle for Handelssamkvemmet. Deres Forskelligartethed og indbyrdes afvigende Forholdstal til Sølv viser ogsaa, at de snarere var at anse for Skuemønt til festlig Lejlighed end som en konstant Handelsmønt</i>». Sammesteds de samtidige forholdstal: England 11,90, Holland 11,29-11,64, Frankrig 11,88, Sydtyskland 12,22-12,24, Sverige efter møntordningen 1604 13,35.'

bundesbank-goldmuenzen-mittelalter:
  de: '<b>Deutsche Bundesbank</b>: <i>Gold Coins of the Middle Ages</i> (Sammlungskatalog Bd. II, englische Einleitung) — <a href="https://www.bundesbank.de/resource/blob/607696/c4709b50d047eca7b2690233d8e76dd1/472B63F073F071307366337C94F8C870/gold-coins-of-the-middle-ages-data.pdf" target="_blank">bundesbank.de</a>. Zum Ursprung der europäischen Goldmüntze: «<i>The progenitor of many European gold coins was the fiorino d''oro or florenus aureus of Florence … The gold coins thus weighed 3.53 g</i>» (S. XV); zur Venedig-Linie «<i>the most important was that of Venice, which was worth the same as the florin. Under the name ducat, this became one of the most popular gold coins ever</i>» (S. XVI); zum rheinischen Vertrag «<i>The slightly modified treaty of 1386 prescribed a fineness of 23 carats (958/1000) and a weight of 3.54 g, or 66 pieces to the Cologne Mark of 233.856 g</i>» (S. XIX).'
  en: '<b>Deutsche Bundesbank</b>: <i>Gold Coins of the Middle Ages</i> (collection catalogue vol. II, English introduction) — <a href="https://www.bundesbank.de/resource/blob/607696/c4709b50d047eca7b2690233d8e76dd1/472B63F073F071307366337C94F8C870/gold-coins-of-the-middle-ages-data.pdf" target="_blank">bundesbank.de</a>. On the origin of European gold coinage: «<i>The progenitor of many European gold coins was the fiorino d''oro or florenus aureus of Florence … The gold coins thus weighed 3.53 g</i>» (p. XV); on the Venetian line «<i>the most important was that of Venice, which was worth the same as the florin. Under the name ducat, this became one of the most popular gold coins ever</i>» (p. XVI); on the Rhenish treaty «<i>The slightly modified treaty of 1386 prescribed a fineness of 23 carats (958/1000) and a weight of 3.54 g, or 66 pieces to the Cologne Mark of 233.856 g</i>» (p. XIX).'
  uk: '<b>Deutsche Bundesbank</b>: <i>Gold Coins of the Middle Ages</i> (каталог колекції, т. II, англійська передмова) — <a href="https://www.bundesbank.de/resource/blob/607696/c4709b50d047eca7b2690233d8e76dd1/472B63F073F071307366337C94F8C870/gold-coins-of-the-middle-ages-data.pdf" target="_blank">bundesbank.de</a>. Про походження європейського золота: «<i>The progenitor of many European gold coins was the fiorino d''oro or florenus aureus of Florence … The gold coins thus weighed 3.53 g</i>» (с. XV); про венеційську лінію «<i>the most important was that of Venice, which was worth the same as the florin. Under the name ducat, this became one of the most popular gold coins ever</i>» (с. XVI); про рейнський договір «<i>The slightly modified treaty of 1386 prescribed a fineness of 23 carats (958/1000) and a weight of 3.54 g, or 66 pieces to the Cologne Mark of 233.856 g</i>» (с. XIX).'
  da: '<b>Deutsche Bundesbank</b>: <i>Gold Coins of the Middle Ages</i> (samlingskatalog bd. II, den engelske indledning) — <a href="https://www.bundesbank.de/resource/blob/607696/c4709b50d047eca7b2690233d8e76dd1/472B63F073F071307366337C94F8C870/gold-coins-of-the-middle-ages-data.pdf" target="_blank">bundesbank.de</a>. Om den europæiske guldmønts oprindelse: «<i>The progenitor of many European gold coins was the fiorino d''oro or florenus aureus of Florence … The gold coins thus weighed 3.53 g</i>» (s. XV); om den venetianske linje: «<i>the most important was that of Venice, which was worth the same as the florin. Under the name ducat, this became one of the most popular gold coins ever</i>» (s. XVI); om den rhinske traktat: «<i>The slightly modified treaty of 1386 prescribed a fineness of 23 carats (958/1000) and a weight of 3.54 g, or 66 pieces to the Cologne Mark of 233.856 g</i>» (s. XIX).'

jesse-wendischer-muenzverein-goldgulden:
  de: '<b>Jesse, Wilhelm</b>: <i>Der Wendische Münzverein</i> (1927), Volltext bei <a href="https://www.coingallery.de/stadt/ostsee/_jesse_wend_muenzverein.htm" target="_blank">coingallery.de</a>. Zum Korn der frühen rheinischen Florene: «<i>Schon seit einiger Zeit prägten die einzelnen rheinischen Kurfürsten Florene … 23⅔karätig und 3,5 g schwer</i>»; zum Schrot des Goldguldens: «<i>Ein Reichsgesetz Ruprechts von 1402 setzte den Gulden auf 22½ Karat fein und zu 66 Stück aus der Mark fest</i>» und 1417 «<i>bei altem Schrot (66 aus der Mark)</i>»; zur letzten Minderung «<i>eine weitere Minderung des Gehalts auf 18½ Karat erst 1490</i>».'
  en: '<b>Jesse, Wilhelm</b>: <i>Der Wendische Münzverein</i> (1927), full text at <a href="https://www.coingallery.de/stadt/ostsee/_jesse_wend_muenzverein.htm" target="_blank">coingallery.de</a>. On the fineness of the early Rhenish florins: «<i>Schon seit einiger Zeit prägten die einzelnen rheinischen Kurfürsten Florene … 23⅔karätig und 3,5 g schwer</i>»; on the gulden''s Schrot: «<i>Ein Reichsgesetz Ruprechts von 1402 setzte den Gulden auf 22½ Karat fein und zu 66 Stück aus der Mark fest</i>» and, in 1417, «<i>bei altem Schrot (66 aus der Mark)</i>»; on the last reduction «<i>eine weitere Minderung des Gehalts auf 18½ Karat erst 1490</i>».'
  uk: '<b>Jesse, Wilhelm</b>: <i>Der Wendische Münzverein</i> (1927), повний текст на <a href="https://www.coingallery.de/stadt/ostsee/_jesse_wend_muenzverein.htm" target="_blank">coingallery.de</a>. Про пробу ранніх рейнських флоренів: «<i>Schon seit einiger Zeit prägten die einzelnen rheinischen Kurfürsten Florene … 23⅔karätig und 3,5 g schwer</i>»; про Schrot гульдена: «<i>Ein Reichsgesetz Ruprechts von 1402 setzte den Gulden auf 22½ Karat fein und zu 66 Stück aus der Mark fest</i>» і 1417 р. «<i>bei altem Schrot (66 aus der Mark)</i>»; про останнє зниження «<i>eine weitere Minderung des Gehalts auf 18½ Karat erst 1490</i>».'
  da: '<b>Jesse, Wilhelm</b>: <i>Der Wendische Münzverein</i> (1927), fuldtekst hos <a href="https://www.coingallery.de/stadt/ostsee/_jesse_wend_muenzverein.htm" target="_blank">coingallery.de</a>. Om lødigheden i de tidlige rhinske floriner: «<i>Schon seit einiger Zeit prägten die einzelnen rheinischen Kurfürsten Florene … 23⅔karätig und 3,5 g schwer</i>»; om guldguldenens vægtfod: «<i>Ein Reichsgesetz Ruprechts von 1402 setzte den Gulden auf 22½ Karat fein und zu 66 Stück aus der Mark fest</i>» og 1417 «<i>bei altem Schrot (66 aus der Mark)</i>»; om den sidste forringelse: «<i>eine weitere Minderung des Gehalts auf 18½ Karat erst 1490</i>».'

bobzin-muenzchronik-dukat:
  de: '<b>Bobzin, Hagen</b>: <i>Geschichte einiger europäischer Währungen</i> — <a href="https://www.hagen-bobzin.de/hobby/muenzen.html" target="_blank">hagen-bobzin.de</a>. Zur venezianischen Goldquelle: «<i>Das ungarische Gold nutzt Venedig ab 1284 für die Produktion von Dukaten zu 3,54 g reinen Goldes. Das Gewicht wird erst 1526 auf 3,49 g reduziert</i>»; zur Reichsmüntzordnung von 1559: «<i>Für den Dukaten gilt 67 Dukaten auf die Mark Gold zu 23 Karat 8 Grän oder 67,944 Dukaten auf die feine Mark Gold</i>» bei «<i>3,442 g Gold</i>» und 104 Kreutzer.'
  en: '<b>Bobzin, Hagen</b>: <i>Geschichte einiger europäischer Währungen</i> — <a href="https://www.hagen-bobzin.de/hobby/muenzen.html" target="_blank">hagen-bobzin.de</a>. On Venice''s gold supply: «<i>Das ungarische Gold nutzt Venedig ab 1284 für die Produktion von Dukaten zu 3,54 g reinen Goldes. Das Gewicht wird erst 1526 auf 3,49 g reduziert</i>»; on the imperial ordinance of 1559: «<i>Für den Dukaten gilt 67 Dukaten auf die Mark Gold zu 23 Karat 8 Grän oder 67,944 Dukaten auf die feine Mark Gold</i>» at «<i>3,442 g Gold</i>» and 104 Kreuzer.'
  uk: '<b>Bobzin, Hagen</b>: <i>Geschichte einiger europäischer Währungen</i> — <a href="https://www.hagen-bobzin.de/hobby/muenzen.html" target="_blank">hagen-bobzin.de</a>. Про золоту сировину Венеції: «<i>Das ungarische Gold nutzt Venedig ab 1284 für die Produktion von Dukaten zu 3,54 g reinen Goldes. Das Gewicht wird erst 1526 auf 3,49 g reduziert</i>»; про імперський ордонанс 1559 р.: «<i>Für den Dukaten gilt 67 Dukaten auf die Mark Gold zu 23 Karat 8 Grän oder 67,944 Dukaten auf die feine Mark Gold</i>» при «<i>3,442 g Gold</i>» і 104 крейцерах.'
  da: '<b>Bobzin, Hagen</b>: <i>Geschichte einiger europäischer Währungen</i> — <a href="https://www.hagen-bobzin.de/hobby/muenzen.html" target="_blank">hagen-bobzin.de</a>. Om den venetianske guldkilde: «<i>Das ungarische Gold nutzt Venedig ab 1284 für die Produktion von Dukaten zu 3,54 g reinen Goldes. Das Gewicht wird erst 1526 auf 3,49 g reduziert</i>»; om rigsmøntordningen af 1559: «<i>Für den Dukaten gilt 67 Dukaten auf die Mark Gold zu 23 Karat 8 Grän oder 67,944 Dukaten auf die feine Mark Gold</i>» ved «<i>3,442 g Gold</i>» og 104 kreutzer.'

wikipedia-de-reichsmuenzordnungen-gold:
  de: '<b>Wikipedia (DE)</b>: <i>Reichsmünzordnung</i> und <i>Augsburger Reichsmünzordnung von 1559</i> — <a href="https://de.wikipedia.org/wiki/Reichsm%C3%BCnzordnung" target="_blank">de.wikipedia.org</a>. Die Esslinger Ordnung von 1524 «<i>die kölnische Mark für das allgemeine deutsche Münzgewicht erklärte</i>»; die Augspurgische von 1551 nennt den Dukaten nicht; erst 1559 gilt: «<i>Neue Goldmünze wurde der Dukat</i>», neben dem rheinischen Goldgulden zu 75 Kreutzer.'
  en: '<b>Wikipedia (DE)</b>: <i>Reichsmünzordnung</i> and <i>Augsburger Reichsmünzordnung von 1559</i> — <a href="https://de.wikipedia.org/wiki/Reichsm%C3%BCnzordnung" target="_blank">de.wikipedia.org</a>. The Esslingen ordinance of 1524 «<i>die kölnische Mark für das allgemeine deutsche Münzgewicht erklärte</i>»; the Augsburg ordinance of 1551 does not mention the ducat; only in 1559 «<i>Neue Goldmünze wurde der Dukat</i>», beside the Rhenish gold gulden at 75 Kreuzer.'
  uk: '<b>Wikipedia (DE)</b>: <i>Reichsmünzordnung</i> та <i>Augsburger Reichsmünzordnung von 1559</i> — <a href="https://de.wikipedia.org/wiki/Reichsm%C3%BCnzordnung" target="_blank">de.wikipedia.org</a>. Есслінгенський ордонанс 1524 р. «<i>die kölnische Mark für das allgemeine deutsche Münzgewicht erklärte</i>»; аугсбурзький 1551 р. дуката не називає; лише 1559 р. — «<i>Neue Goldmünze wurde der Dukat</i>», поряд із рейнським золотим гульденом за 75 крейцерів.'
  da: '<b>Wikipedia (DE)</b>: <i>Reichsmünzordnung</i> og <i>Augsburger Reichsmünzordnung von 1559</i> — <a href="https://de.wikipedia.org/wiki/Reichsm%C3%BCnzordnung" target="_blank">de.wikipedia.org</a>. Esslingen-ordningen af 1524 «<i>die kölnische Mark für das allgemeine deutsche Münzgewicht erklärte</i>»; Augsburg-ordningen af 1551 nævner ikke dukaten; først i 1559 gælder: «<i>Neue Goldmünze wurde der Dukat</i>», ved siden af den rhinske guldgylden til 75 kreutzer.'

wikipedia-pt-portugues-moeda:
  de: '<b>Wikipédia (PT)</b>: <i>Português (moeda portuguesa)</i> — <a href="https://pt.wikipedia.org/wiki/Portugu%C3%AAs_(moeda_portuguesa)" target="_blank">pt.wikipedia.org</a>. «<i>Foi mandada cunhar pelo rei D. Manuel I. Circulou de 1499 a 1557</i>»; «<i>Pesava aproximadamente 35 gramas</i>»; «<i>valia cerca de dez cruzados</i>»; zur nordeuropäischen Nachahmung: «<i>A cidade de Hamburgo … cunhou um grande número delas entre 1553 e 1560</i>».'
  en: '<b>Wikipédia (PT)</b>: <i>Português (moeda portuguesa)</i> — <a href="https://pt.wikipedia.org/wiki/Portugu%C3%AAs_(moeda_portuguesa)" target="_blank">pt.wikipedia.org</a>. «<i>Foi mandada cunhar pelo rei D. Manuel I. Circulou de 1499 a 1557</i>»; «<i>Pesava aproximadamente 35 gramas</i>»; «<i>valia cerca de dez cruzados</i>»; on the northern imitation: «<i>A cidade de Hamburgo … cunhou um grande número delas entre 1553 e 1560</i>».'
  uk: '<b>Wikipédia (PT)</b>: <i>Português (moeda portuguesa)</i> — <a href="https://pt.wikipedia.org/wiki/Portugu%C3%AAs_(moeda_portuguesa)" target="_blank">pt.wikipedia.org</a>. «<i>Foi mandada cunhar pelo rei D. Manuel I. Circulou de 1499 a 1557</i>»; «<i>Pesava aproximadamente 35 gramas</i>»; «<i>valia cerca de dez cruzados</i>»; про північне наслідування: «<i>A cidade de Hamburgo … cunhou um grande número delas entre 1553 e 1560</i>».'
  da: '<b>Wikipédia (PT)</b>: <i>Português (moeda portuguesa)</i> — <a href="https://pt.wikipedia.org/wiki/Portugu%C3%AAs_(moeda_portuguesa)" target="_blank">pt.wikipedia.org</a>. «<i>Foi mandada cunhar pelo rei D. Manuel I. Circulou de 1499 a 1557</i>»; «<i>Pesava aproximadamente 35 gramas</i>»; «<i>valia cerca de dez cruzados</i>»; om efterligningen i Nordeuropa: «<i>A cidade de Hamburgo … cunhou um grande número delas entre 1553 e 1560</i>».'

danskmoent-galster46-ungersk-gylden:
  de: '<b>Dansk Mønt</b>: <i>Frederik 1., 1 Ungersk gylden 1531</i> — <a href="https://www.danskmoent.dk/fr/f1g46.htm" target="_blank">danskmoent.dk/fr/f1g46.htm</a>. Zum frühesten dänischen Stück dieses Fußes: «<i>Bruttovægt: 3,49g · Finhed: 0,986 · Finvægt: 3,44g</i>» (Galster 46, Schou 1, Jensen/Skjoldager T-41/45; København oder Malmø), mit Verweis auf <i>Hede side 55</i>.'
  en: '<b>Dansk Mønt</b>: <i>Frederik 1., 1 Ungersk gylden 1531</i> — <a href="https://www.danskmoent.dk/fr/f1g46.htm" target="_blank">danskmoent.dk/fr/f1g46.htm</a>. On the earliest Danish piece on this standard: «<i>Bruttovægt: 3,49g · Finhed: 0,986 · Finvægt: 3,44g</i>» (Galster 46, Schou 1, Jensen/Skjoldager T-41/45; København or Malmø), citing <i>Hede side 55</i>.'
  uk: '<b>Dansk Mønt</b>: <i>Frederik 1., 1 Ungersk gylden 1531</i> — <a href="https://www.danskmoent.dk/fr/f1g46.htm" target="_blank">danskmoent.dk/fr/f1g46.htm</a>. Про найранішу данську монету цієї стопи: «<i>Bruttovægt: 3,49g · Finhed: 0,986 · Finvægt: 3,44g</i>» (Galster 46, Schou 1, Jensen/Skjoldager T-41/45; Копенгаген або Мальме), з відсиланням на <i>Hede side 55</i>.'
  da: '<b>Dansk Mønt</b>: <i>Frederik 1., 1 Ungersk gylden 1531</i> — <a href="https://www.danskmoent.dk/fr/f1g46.htm" target="_blank">danskmoent.dk/fr/f1g46.htm</a>. Om det tidligste danske stykke efter denne fod: «<i>Bruttovægt: 3,49g · Finhed: 0,986 · Finvægt: 3,44g</i>» (Galster 46, Schou 1, Jensen/Skjoldager T-41/45; København eller Malmø), med henvisning til <i>Hede side 55</i>.'

danskmoent-hede-f2h1-ungersk-gylden-1563:
  de: '<b>Dansk Mønt</b>: <i>Frederik 2., Hede 1 — 1 Ungersk Gylden 1563, København</i> — <a href="https://www.danskmoent.dk/fr/f2h1.htm" target="_blank">danskmoent.dk/fr/f2h1.htm</a>. Zum Korn des frühen dänischen Goldes: «<i>Bruttovægt: 3,490g · Finhed: 0,986 · Finvægt: 3,442g</i>» (Hede 1, Schou 1-2, Sieg 27).'
  en: '<b>Dansk Mønt</b>: <i>Frederik 2., Hede 1 — 1 Ungersk Gylden 1563, København</i> — <a href="https://www.danskmoent.dk/fr/f2h1.htm" target="_blank">danskmoent.dk/fr/f2h1.htm</a>. On the fineness of the early Danish gold: «<i>Bruttovægt: 3,490g · Finhed: 0,986 · Finvægt: 3,442g</i>» (Hede 1, Schou 1-2, Sieg 27).'
  uk: '<b>Dansk Mønt</b>: <i>Frederik 2., Hede 1 — 1 Ungersk Gylden 1563, København</i> — <a href="https://www.danskmoent.dk/fr/f2h1.htm" target="_blank">danskmoent.dk/fr/f2h1.htm</a>. Про пробу раннього данського золота: «<i>Bruttovægt: 3,490g · Finhed: 0,986 · Finvægt: 3,442g</i>» (Hede 1, Schou 1-2, Sieg 27).'
  da: '<b>Dansk Mønt</b>: <i>Frederik 2., Hede 1 — 1 Ungersk Gylden 1563, København</i> — <a href="https://www.danskmoent.dk/fr/f2h1.htm" target="_blank">danskmoent.dk/fr/f2h1.htm</a>. Om lødigheden i det tidlige danske guld: «<i>Bruttovægt: 3,490g · Finhed: 0,986 · Finvægt: 3,442g</i>» (Hede 1, Schou 1-2, Sieg 27).'

danskmoent-hede-c4h14-ungersk-gylden-1603:
  de: '<b>Dansk Mønt</b>: <i>Christian 4., Hede 14 — Ungersk gylden, København</i> — <a href="https://www.danskmoent.dk/chr/c4h14.htm" target="_blank">danskmoent.dk/chr/c4h14.htm</a>. Zum abgesenkten Korn nach der Forordning von 1602: «<i>Bruttovægt: 3,490g · Finhed: 0,972 · Finvægt: 3,393g</i>» (1603, 1604, 1607; Hede 14, Sieg 143).'
  en: '<b>Dansk Mønt</b>: <i>Christian 4., Hede 14 — Ungersk gylden, København</i> — <a href="https://www.danskmoent.dk/chr/c4h14.htm" target="_blank">danskmoent.dk/chr/c4h14.htm</a>. On the fineness lowered by the ordinance of 1602: «<i>Bruttovægt: 3,490g · Finhed: 0,972 · Finvægt: 3,393g</i>» (1603, 1604, 1607; Hede 14, Sieg 143).'
  uk: '<b>Dansk Mønt</b>: <i>Christian 4., Hede 14 — Ungersk gylden, København</i> — <a href="https://www.danskmoent.dk/chr/c4h14.htm" target="_blank">danskmoent.dk/chr/c4h14.htm</a>. Про знижену ордонансом 1602 р. пробу: «<i>Bruttovægt: 3,490g · Finhed: 0,972 · Finvægt: 3,393g</i>» (1603, 1604, 1607; Hede 14, Sieg 143).'
  da: '<b>Dansk Mønt</b>: <i>Christian 4., Hede 14 — Ungersk gylden, København</i> — <a href="https://www.danskmoent.dk/chr/c4h14.htm" target="_blank">danskmoent.dk/chr/c4h14.htm</a>. Om den nedsatte lødighed efter forordningen af 1602: «<i>Bruttovægt: 3,490g · Finhed: 0,972 · Finvægt: 3,393g</i>» (1603, 1604, 1607; Hede 14, Sieg 143).'

danskmoent-hede-c4h30-portugaloeser-1629:
  de: '<b>Dansk Mønt</b>: <i>Christian 4., Hede 30 — 1/4 Portugaløser 1629, København</i> — <a href="https://www.danskmoent.dk/chr/c4h30.htm" target="_blank">danskmoent.dk/chr/c4h30.htm</a>. Zum Korn des Portugaløsers, das nie auf 0,972 fiel: «<i>Bruttovægt: 8,661g · Finhed: 0,979 · Nettovægt: 8,481g</i>» (Hede 30, Schou 1, Sieg 155).'
  en: '<b>Dansk Mønt</b>: <i>Christian 4., Hede 30 — 1/4 Portugaløser 1629, København</i> — <a href="https://www.danskmoent.dk/chr/c4h30.htm" target="_blank">danskmoent.dk/chr/c4h30.htm</a>. On the Portugaløser fineness, which never fell to 0.972: «<i>Bruttovægt: 8,661g · Finhed: 0,979 · Nettovægt: 8,481g</i>» (Hede 30, Schou 1, Sieg 155).'
  uk: '<b>Dansk Mønt</b>: <i>Christian 4., Hede 30 — 1/4 Portugaløser 1629, København</i> — <a href="https://www.danskmoent.dk/chr/c4h30.htm" target="_blank">danskmoent.dk/chr/c4h30.htm</a>. Про пробу Portugaløser-а, яка ніколи не падала до 0,972: «<i>Bruttovægt: 8,661g · Finhed: 0,979 · Nettovægt: 8,481g</i>» (Hede 30, Schou 1, Sieg 155).'
  da: '<b>Dansk Mønt</b>: <i>Christian 4., Hede 30 — 1/4 Portugaløser 1629, København</i> — <a href="https://www.danskmoent.dk/chr/c4h30.htm" target="_blank">danskmoent.dk/chr/c4h30.htm</a>. Om portugaløserens lødighed, der aldrig faldt til 0,972: «<i>Bruttovægt: 8,661g · Finhed: 0,979 · Nettovægt: 8,481g</i>» (Hede 30, Schou 1, Sieg 155).'

danskmoent-hede-c4h37-brilledukat-1647:
  de: '<b>Dansk Mønt</b>: <i>Christian 4., Hede 37 — 1 dukat 1647, København</i> — <a href="https://www.danskmoent.dk/chr/c4h37.htm" target="_blank">danskmoent.dk/chr/c4h37.htm</a>. Zum Korn der Kopenhagener Dukatenlinie: «<i>Bruttovægt: 3,490g · Finhed: 0,979 · Finvægt: 3,418g</i>» (Hede 37, Schou 2, Sieg 136).'
  en: '<b>Dansk Mønt</b>: <i>Christian 4., Hede 37 — 1 dukat 1647, København</i> — <a href="https://www.danskmoent.dk/chr/c4h37.htm" target="_blank">danskmoent.dk/chr/c4h37.htm</a>. On the fineness of the Copenhagen ducat line: «<i>Bruttovægt: 3,490g · Finhed: 0,979 · Finvægt: 3,418g</i>» (Hede 37, Schou 2, Sieg 136).'
  uk: '<b>Dansk Mønt</b>: <i>Christian 4., Hede 37 — 1 dukat 1647, København</i> — <a href="https://www.danskmoent.dk/chr/c4h37.htm" target="_blank">danskmoent.dk/chr/c4h37.htm</a>. Про пробу копенгагенської дукатної лінії: «<i>Bruttovægt: 3,490g · Finhed: 0,979 · Finvægt: 3,418g</i>» (Hede 37, Schou 2, Sieg 136).'
  da: '<b>Dansk Mønt</b>: <i>Christian 4., Hede 37 — 1 dukat 1647, København</i> — <a href="https://www.danskmoent.dk/chr/c4h37.htm" target="_blank">danskmoent.dk/chr/c4h37.htm</a>. Om lødigheden i den københavnske dukatlinje: «<i>Bruttovægt: 3,490g · Finhed: 0,979 · Finvægt: 3,418g</i>» (Hede 37, Schou 2, Sieg 136).'

danskmoent-hede-c6h1-dukat-1730:
  de: '<b>Dansk Mønt</b>: <i>Christian 6., Hede 1 — 1 Dukat 1730, København</i> — <a href="https://www.danskmoent.dk/chr/c6h1.htm" target="_blank">danskmoent.dk/chr/c6h1.htm</a>. Zum Fortbestand desselben Korns im 18. Jahrhundert: «<i>Bruttovægt: 3,490g · Finhed: 0,979 · Finvægt: 3,418g</i>» (Hede 1, Schou 1, Sieg 7).'
  en: '<b>Dansk Mønt</b>: <i>Christian 6., Hede 1 — 1 Dukat 1730, København</i> — <a href="https://www.danskmoent.dk/chr/c6h1.htm" target="_blank">danskmoent.dk/chr/c6h1.htm</a>. On the same fineness continuing into the 18th century: «<i>Bruttovægt: 3,490g · Finhed: 0,979 · Finvægt: 3,418g</i>» (Hede 1, Schou 1, Sieg 7).'
  uk: '<b>Dansk Mønt</b>: <i>Christian 6., Hede 1 — 1 Dukat 1730, København</i> — <a href="https://www.danskmoent.dk/chr/c6h1.htm" target="_blank">danskmoent.dk/chr/c6h1.htm</a>. Про збереження тієї самої проби у XVIII ст.: «<i>Bruttovægt: 3,490g · Finhed: 0,979 · Finvægt: 3,418g</i>» (Hede 1, Schou 1, Sieg 7).'
  da: '<b>Dansk Mønt</b>: <i>Christian 6., Hede 1 — 1 Dukat 1730, København</i> — <a href="https://www.danskmoent.dk/chr/c6h1.htm" target="_blank">danskmoent.dk/chr/c6h1.htm</a>. Om at samme lødighed holdt sig gennem 1700-tallet: «<i>Bruttovægt: 3,490g · Finhed: 0,979 · Finvægt: 3,418g</i>» (Hede 1, Schou 1, Sieg 7).'

danskmoent-hede-gluckstadt-dukat-finhed:
  de: '<b>Dansk Mønt</b>: <i>Christian 4., Hede 154 — 1 Dukat, Glückstadt</i> — <a href="https://www.danskmoent.dk/chr/c4h154.htm" target="_blank">danskmoent.dk/chr/c4h154.htm</a>. Zum Korn der Glückstädter Dukaten: «<i>Bruttovægt: 3,490g · Finhed: 0,979 · Finvægt: 3,418g</i>» (1645, 1646; Hede 154, Sieg 185). Gleichlautend für Hede f3h144 (1666-1669) und c5h115 (1672-1676) sowie für Rendsborg, Hede f4h60 (1718-1719).'
  en: '<b>Dansk Mønt</b>: <i>Christian 4., Hede 154 — 1 Dukat, Glückstadt</i> — <a href="https://www.danskmoent.dk/chr/c4h154.htm" target="_blank">danskmoent.dk/chr/c4h154.htm</a>. On the fineness of the Glückstadt ducats: «<i>Bruttovægt: 3,490g · Finhed: 0,979 · Finvægt: 3,418g</i>» (1645, 1646; Hede 154, Sieg 185). Identical for Hede f3h144 (1666-1669) and c5h115 (1672-1676), and for Rendsborg, Hede f4h60 (1718-1719).'
  uk: '<b>Dansk Mønt</b>: <i>Christian 4., Hede 154 — 1 Dukat, Glückstadt</i> — <a href="https://www.danskmoent.dk/chr/c4h154.htm" target="_blank">danskmoent.dk/chr/c4h154.htm</a>. Про пробу глюкштадтських дукатів: «<i>Bruttovægt: 3,490g · Finhed: 0,979 · Finvægt: 3,418g</i>» (1645, 1646; Hede 154, Sieg 185). Так само Hede f3h144 (1666-1669) і c5h115 (1672-1676), а також Рендсборг, Hede f4h60 (1718-1719).'
  da: '<b>Dansk Mønt</b>: <i>Christian 4., Hede 154 — 1 Dukat, Glückstadt</i> — <a href="https://www.danskmoent.dk/chr/c4h154.htm" target="_blank">danskmoent.dk/chr/c4h154.htm</a>. Om lødigheden i de glückstadtske dukater: «<i>Bruttovægt: 3,490g · Finhed: 0,979 · Finvægt: 3,418g</i>» (1645, 1646; Hede 154, Sieg 185). Enslydende for Hede f3h144 (1666-1669) og c5h115 (1672-1676) samt for Rendsborg, Hede f4h60 (1718-1719).'

numismaster-gluckstadt-km70-1-dukat:
  de: '<b>NumisMaster</b> (Krause-Mishler, <i>Standard Catalog of German States</i>, Schleswig-Holstein): <i>GLÜCKSTADT KM# 70.1, Ducat</i> — <a href="https://numismaster.com/MC_93039" target="_blank">numismaster.com/MC_93039</a>. «<i>Composition: Gold · Mass: 3.5 g · Fineness: .986</i>». Dieselbe Angabe trägt der Katalog auf 45 Goldstücken der schleswig-holsteinischen Bände, während seine dänischen und norwegischen Bände 0,979 führen.'
  en: '<b>NumisMaster</b> (Krause-Mishler, <i>Standard Catalog of German States</i>, Schleswig-Holstein): <i>GLÜCKSTADT KM# 70.1, Ducat</i> — <a href="https://numismaster.com/MC_93039" target="_blank">numismaster.com/MC_93039</a>. «<i>Composition: Gold · Mass: 3.5 g · Fineness: .986</i>». The catalogue carries the same figure on 45 gold entries of its Schleswig-Holstein volumes, while its Danish and Norwegian volumes carry 0.979.'
  uk: '<b>NumisMaster</b> (Krause-Mishler, <i>Standard Catalog of German States</i>, Schleswig-Holstein): <i>GLÜCKSTADT KM# 70.1, Ducat</i> — <a href="https://numismaster.com/MC_93039" target="_blank">numismaster.com/MC_93039</a>. «<i>Composition: Gold · Mass: 3.5 g · Fineness: .986</i>». Ту саму величину каталог несе на 45 золотих записах шлезвіг-гольштейнських томів, тоді як його данський і норвезький томи дають 0,979.'
  da: '<b>NumisMaster</b> (Krause-Mishler, <i>Standard Catalog of German States</i>, Schleswig-Holstein): <i>GLÜCKSTADT KM# 70.1, Ducat</i> — <a href="https://numismaster.com/MC_93039" target="_blank">numismaster.com/MC_93039</a>. «<i>Composition: Gold · Mass: 3.5 g · Fineness: .986</i>». Samme angivelse bærer kataloget på 45 guldstykker i de slesvig-holstenske bind, mens dets danske og norske bind anfører 0,979.'

