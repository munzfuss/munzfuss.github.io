# Shared reference pool — bibliographic entries by stable string key.
#
# Used by the inline-refs system (introduced 2026-05-25). Prose anywhere
# in the project can cite an entry by writing `<sup>[ref:KEY]</sup>`;
# the build's post-render pass scans these markers per page, resolves
# the KEY against this pool (or a per-fuss / per-location override),
# numbers them in appearance order, and injects the entries into the
# page's bibliography section.
#
# Adding a new ref:
#   1. Pick a stable key — lowercase-hyphenated identifier that names
#      the source unambiguously (`ernst-axel-kurantdukat`,
#      `wilcke-1950-vol3-altona`, `bobzin-1894`, etc.).
#   2. Add an entry below with DE/EN/UK content following §5a — Wikipedia-
#      style bibliographic citation + concrete page hint + verbatim quote.
#   3. Cite from prose: `<sup>[ref:your-key]</sup>`.
#
# DO NOT renumber existing keys — they are stable identifiers, NOT
# display numbers. The renderer assigns display numbers per page.

ernst-axel-kurantdukat:
  de: '<b>Ernst, Axel</b>: <i>Kurantdukaten — en dansk Dukat</i> — <a href="https://danskmoent.dk/ernst/kuduaxel.htm" target="_blank">danskmoent.dk/ernst/kuduaxel.htm</a>. Hauptquelle für Phase-I-Standard 1714–1717 (81½ Stück / Mark, 21 Karat, 2,511 g fein), Tarifreduktion 9. Juli 1727, Wiedereinziehung 4. Juli 1757, Frederik-V-Reform 1757 (75/Mark, 2,728 g fein), Massenkarbung 1757–1765 (3 030 742 Stück), Christian-VII-Geburtstagsstrich 1771 (131 Stück), Hauptphase 1781–1796 (≈ 237 000 Stück), Subnominale. Belegt ferner das faktische Umlaufende: zum dänischen Dukat, mit dem N. F. S. Grundtvig 1833 zahlte, bemerkt Ernst «<i>Dette er dog næppe noget Udtryk for, at danske Kurantdukater endnu dengang have kurseret i Omsætningen</i>».'
  en: '<b>Ernst, Axel</b>: <i>Kurantdukaten — en dansk Dukat</i> — <a href="https://danskmoent.dk/ernst/kuduaxel.htm" target="_blank">danskmoent.dk/ernst/kuduaxel.htm</a>. Main source for the Phase I standard 1714–1717 (81½ pieces / Mark, 21 carats, 2.511 g fine), the tariff reduction of 9 July 1727, the call-in for melting of 4 July 1757, the Frederik V reform of 1757 (75 / Mark, 2.728 g fine), the mass coinage 1757–1765 (3,030,742 pieces), the Christian VII birthday strike of 1771 (131 pieces), the 1781–1796 main phase (≈ 237,000 pieces) and the sub-denominations. Also documents the de-facto end of circulation: on the Danish ducat N. F. S. Grundtvig paid with in 1833, Ernst remarks «<i>Dette er dog næppe noget Udtryk for, at danske Kurantdukater endnu dengang have kurseret i Omsætningen</i>».'
  uk: '<b>Ernst, Axel</b>: <i>Kurantdukaten — en dansk Dukat</i> — <a href="https://danskmoent.dk/ernst/kuduaxel.htm" target="_blank">danskmoent.dk/ernst/kuduaxel.htm</a>. Головне джерело для стандарту фази I 1714–1717 (81½ штук з марки, 21 карат, 2,511 г чистого), зниження тарифу 9 липня 1727, скликання на переплав 4 липня 1757, реформи Frederik V 1757 (75 з марки, 2,728 г чистого), масового карбування 1757–1765 (3 030 742 шт.), меморіального карбування Christian VII 1771 (131 шт.), головної фази 1781–1796 (≈ 237 000 шт.) та субномінали. Також документує фактичний кінець обігу: про данський дукат, яким N. F. S. Grundtvig заплатив 1833 р., Ернст зауважує «<i>Dette er dog næppe noget Udtryk for, at danske Kurantdukater endnu dengang have kurseret i Omsætningen</i>».'
  da: '<b>Ernst, Axel</b>: <i>Kurantdukaten — en dansk Dukat</i> — <a href="https://danskmoent.dk/ernst/kuduaxel.htm" target="_blank">danskmoent.dk/ernst/kuduaxel.htm</a>. Hovedkilde for fase I-standarden 1714–1717 (81½ stykker pr. mark, 21 karat, 2,511 g fin), tarifnedsættelsen 9. juli 1727, inddragelsen 4. juli 1757, Frederik 5.s reform 1757 (75 pr. mark, 2,728 g fin), massemøntningen 1757–1765 (3 030 742 stykker), Christian 7.s fødselsdagspræg 1771 (131 stykker), hovedfasen 1781–1796 (≈ 237 000 stykker) og subnominalerne. Dokumenterer desuden den faktiske ophørsdato for omløbet: om den danske dukat, som N. F. S. Grundtvig betalte med i 1833, bemærker Ernst «<i>Dette er dog næppe noget Udtryk for, at danske Kurantdukater endnu dengang have kurseret i Omsætningen</i>».'

danskmoent-c7mord-plakat-1782:
  de: '<b>danskmoent.dk</b>: <i>Møntforordninger m.v. under Christian 7. (1766–1808)</i> — <a href="https://www.danskmoent.dk/artikler/c7mord.htm" target="_blank">danskmoent.dk/artikler/c7mord.htm</a>. Beleg für die wörtliche Plakat-Klausel vom 2. Dezember 1782 («guld udmønte til kurantdukater med 75 stykker pr. mark brutto af 21 karat») und die Aufhebung des Plakats 1795.'
  en: '<b>danskmoent.dk</b>: <i>Møntforordninger m.v. under Christian 7. (1766–1808)</i> — <a href="https://www.danskmoent.dk/artikler/c7mord.htm" target="_blank">danskmoent.dk/artikler/c7mord.htm</a>. Source for the verbatim clause of the Plakat of 2 December 1782 («guld udmønte til kurantdukater med 75 stykker pr. mark brutto af 21 karat») and its revocation in 1795.'
  uk: '<b>danskmoent.dk</b>: <i>Møntforordninger m.v. under Christian 7. (1766–1808)</i> — <a href="https://www.danskmoent.dk/artikler/c7mord.htm" target="_blank">danskmoent.dk/artikler/c7mord.htm</a>. Джерело для verbatim-формулювання Plakat 2 грудня 1782 («guld udmønte til kurantdukater med 75 stykker pr. mark brutto af 21 karat») та скасування plakat 1795.'
  da: '<b>danskmoent.dk</b>: <i>Møntforordninger m.v. under Christian 7. (1766–1808)</i> — <a href="https://www.danskmoent.dk/artikler/c7mord.htm" target="_blank">danskmoent.dk/artikler/c7mord.htm</a>. Belæg for den ordrette klausul i Plakat 2. december 1782 («guld udmønte til kurantdukater med 75 stykker pr. mark brutto af 21 karat») og for ophævelsen af plakaten 1795.'

forordning-pengevaesenet-1813:
  de: '<b>danmarkshistorien.lex.dk</b>: <i>Forordning om Forandring i Pengevæsenet, 5. januar 1813</i> — <a href="https://danmarkshistorien.lex.dk/Forordning_om_Forandring_i_Pengev%C3%A6senet,_5._januar_1813" target="_blank">danmarkshistorien.lex.dk</a>. Beleg für den Statsbankerot vom 5. Januar 1813 als reine Silberreform: Kurantdaler durch Rigsbankdaler im Verhältnis 6 : 1 abgelöst; Goldmünzen (Reichsdukaten, Kurantdukaten, Christian d''or) sind von §§1–16 nicht erfaßt.'
  en: '<b>danmarkshistorien.lex.dk</b>: <i>Forordning om Forandring i Pengevæsenet, 5. januar 1813</i> — <a href="https://danmarkshistorien.lex.dk/Forordning_om_Forandring_i_Pengev%C3%A6senet,_5._januar_1813" target="_blank">danmarkshistorien.lex.dk</a>. Source for the Statsbankerot of 5 January 1813 as a purely silver reform: Kurantdaler replaced by Rigsbankdaler at the ratio 6 : 1; gold coins (Reichsdukaten, Kurantdukaten, Christian d''or) are not covered by §§1–16.'
  uk: '<b>danmarkshistorien.lex.dk</b>: <i>Forordning om Forandring i Pengevæsenet, 5. januar 1813</i> — <a href="https://danmarkshistorien.lex.dk/Forordning_om_Forandring_i_Pengev%C3%A6senet,_5._januar_1813" target="_blank">danmarkshistorien.lex.dk</a>. Джерело про Statsbankerot 5 січня 1813 як суто срібну реформу: Kurantdaler замінено Rigsbankdaler у пропорції 6 : 1; золоті монети (Reichsdukaten, Kurantdukaten, Christian d''or) §§1–16 не охоплюють.'
  da: '<b>danmarkshistorien.lex.dk</b>: <i>Forordning om Forandring i Pengevæsenet, 5. januar 1813</i> — <a href="https://danmarkshistorien.lex.dk/Forordning_om_Forandring_i_Pengev%C3%A6senet,_5._januar_1813" target="_blank">danmarkshistorien.lex.dk</a>. Belæg for statsbankerotten 5. januar 1813 som en ren sølvreform: kurantdaleren afløst af rigsbankdaleren i forholdet 6 : 1; guldmønterne (Reichsdukaten, Kurantdukaten, Christian d''or) er ikke omfattet af §§1–16.'

coinvarieties-kurantdukat-tariff:
  de: '<b>CoinVarieties</b>: <i>Denmark 1771-K 12 mark Fr-280</i> — <a href="https://coinvarieties.com/index.php/Denmark_1771-K_12_mark_Fr-280" target="_blank">coinvarieties.com</a>. Beleg für die Tarifformel «<i>Until 1813, one ducat = 2 speciedaler = 12 mark = 192 skilling Danske</i>» und die Charakterisierung des Kurantdukaten als «<i>too light and too low in fineness to qualify as full ducats</i>» — entscheidend für die numerische Abgrenzung Kurantdukat / Reichsdukat.'
  en: '<b>CoinVarieties</b>: <i>Denmark 1771-K 12 mark Fr-280</i> — <a href="https://coinvarieties.com/index.php/Denmark_1771-K_12_mark_Fr-280" target="_blank">coinvarieties.com</a>. Source for the tariff formula «<i>Until 1813, one ducat = 2 speciedaler = 12 mark = 192 skilling Danske</i>» and for the characterisation of the Kurantdukat as «<i>too light and too low in fineness to qualify as full ducats</i>» — decisive for the numerical Kurantdukat / Reichsdukat distinction.'
  uk: '<b>CoinVarieties</b>: <i>Denmark 1771-K 12 mark Fr-280</i> — <a href="https://coinvarieties.com/index.php/Denmark_1771-K_12_mark_Fr-280" target="_blank">coinvarieties.com</a>. Джерело для формули тарифу «<i>Until 1813, one ducat = 2 speciedaler = 12 mark = 192 skilling Danske</i>» і характеристики Kurantdukat як «<i>too light and too low in fineness to qualify as full ducats</i>» — визначальне для нумеричного розмежування Kurantdukat / Reichsdukat.'
  da: '<b>CoinVarieties</b>: <i>Denmark 1771-K 12 mark Fr-280</i> — <a href="https://coinvarieties.com/index.php/Denmark_1771-K_12_mark_Fr-280" target="_blank">coinvarieties.com</a>. Belæg for tarifformlen «<i>Until 1813, one ducat = 2 speciedaler = 12 mark = 192 skilling Danske</i>» og for karakteristikken af kurantdukaten som «<i>too light and too low in fineness to qualify as full ducats</i>» — afgørende for den talmæssige afgrænsning mellem Kurantdukat og Reichsdukat.'

wilcke-1950-renaissance-moent:
  de: "<b>Wilcke, Julius</b>: <i>Renæssancens Mønt- og Pengeforhold 1481–1588</i> (København: Munksgaard, 1950). Kap. 7-4 «Christian IIIs møntreform 1541-1547», pp. 13-26. Verbatim aus der Møntordning vom 20. September 1541: «<i>Allffue Daler aff Hallffemtandeskab Lod (= 14½ Lod) findt Sølff aff en Cølnschk Marck</i>» (S. 13) — Acht Daler aus einer Cölln. Marck fein bei 14½ Lod Probe. Quelle für mf 8,827 (Phase A1 baseline) + mf 9,481 (Phase A2 nach Tillæg 27. September 1544, S. 14-15) + 14¼ Lod Flensborg-Bestalling 22. Januar 1547 (pp. 25-26)."
  en: "<b>Wilcke, Julius</b>: <i>Renæssancens Mønt- og Pengeforhold 1481–1588</i> (Copenhagen: Munksgaard, 1950). Kap. 7-4 «Christian III's møntreform 1541-1547», pp. 13-26. Verbatim from the Møntordning of 20 September 1541: «<i>Allffue Daler aff Hallffemtandeskab Lod (= 14½ Lod) findt Sølff aff en Cølnschk Marck</i>» (p. 13) — eight Daler per Cologne mark fine at 14½ Lod fineness. Source for mf 8.827 (Phase A1 baseline) + mf 9.481 (Phase A2 after the Tillæg of 27 September 1544, pp. 14-15) + 14¼ Lod Flensborg Bestalling of 22 January 1547 (pp. 25-26)."
  uk: "<b>Wilcke, Julius</b>: <i>Renæssancens Mønt- og Pengeforhold 1481–1588</i> (Копенгаген: Munksgaard, 1950). Kap. 7-4 «Christian III's møntreform 1541-1547», pp. 13-26. Дослівно з Møntordning 20 вересня 1541: «<i>Allffue Daler aff Hallffemtandeskab Lod (= 14½ Lod) findt Sølff aff en Cølnschk Marck</i>» (с. 13) — вісім Daler з кельнської марки чистого срібла за пробою 14½ Lod. Джерело для mf 8,827 (фаза A1 baseline) + mf 9,481 (фаза A2 після Tillæg 27 вересня 1544, с. 14-15) + 14¼ Lod Flensborg Bestalling 22 січня 1547 (pp. 25-26)."
  da: '<b>Wilcke, Julius</b>: <i>Renæssancens Mønt- og Pengeforhold 1481–1588</i> (København: Munksgaard, 1950). Kap. 7-4 «Christian IIIs møntreform 1541-1547», s. 13-26. Ordret fra Møntordningen af 20. september 1541: «<i>Allffue Daler aff Hallffemtandeskab Lod (= 14½ Lod) findt Sølff aff en Cølnschk Marck</i>» (s. 13) — otte daler af en Cølnsk Marck fin ved 14½ lods lødighed. Kilde til mf 8,827 (fase A1, udgangspunktet) + mf 9,481 (fase A2 efter tillægget af 27. september 1544, s. 14-15) + 14¼ lod i Flensborg-bestallingen af 22. januar 1547 (s. 25-26).'

wilcke-1950-rentemesterregnskaber:
  de: "<b>Wilcke, Julius</b>: <i>Renæssancens Mønt- og Pengeforhold 1481-1588</i>, Kap. 6 «Rentemesterregnskaber under Frederik 2.» — <a href=\"https://www.danskmoent.dk/wilcke/w6b1.htm\" target=\"_blank\">danskmoent.dk/wilcke/w6b1.htm</a>. Primärquellenauszug aus den Rentmeister-Rechnungen Frederiks II.: «<i>17. Oktbr., af 66 1/2 Marck Kroneguld 4,860 Krone Klippinge.</i>» — direkter archivalischer Beleg für die Karbung der Frederik-II-Guldkrone am 17. Oktober 1563: 66½ Marck Kroneguld-Legierung wurden zu 4860 Krone-Klippingen ausgeprägt. Erste belegfähige Stückzahl + Materialeinsatz der Karbung. Mintmaster Hans de Wüllers (Guldsmeed, 1563), Hans Köppelin (Møntmester, 1564), Laurits Hammer (Bremerholm, 1565). Belegt drei parallele Gold-Linien Frederiks II.: Ungersk Gylden (Reichsdukatenfuß), Rhinsk Gylden (Rhinskgyldenfod), Kroneguld (eigener Müntzfuß)."
  en: "<b>Wilcke, Julius</b>: <i>Renæssancens Mønt- og Pengeforhold 1481-1588</i>, Kap. 6 «Rentemesterregnskaber under Frederik 2.» — <a href=\"https://www.danskmoent.dk/wilcke/w6b1.htm\" target=\"_blank\">danskmoent.dk/wilcke/w6b1.htm</a>. Primary-source excerpt from Frederik II's Rentmeister (treasurer) account records: «<i>17. Oktbr., af 66 1/2 Marck Kroneguld 4,860 Krone Klippinge.</i>» — direct archival attestation of the Frederik II Guldkrone minting on 17 October 1563: 66½ marks of Kroneguld alloy struck into 4,860 Krone clippings. First documented piece count + material input for the coinage. Mintmasters: Hans de Wüllers (goldsmith, 1563), Hans Köppelin (mint-master, 1564), Laurits Hammer (Bremerholm, 1565). Records three parallel Frederik II gold lines: Ungersk Gylden (Reichsdukatenfuß), Rhinsk Gylden (Rhinskgyldenfod), Kroneguld (its own Müntzfuß)."
  uk: "<b>Wilcke, Julius</b>: <i>Renæssancens Mønt- og Pengeforhold 1481-1588</i>, Kap. 6 «Rentemesterregnskaber under Frederik 2.» — <a href=\"https://www.danskmoent.dk/wilcke/w6b1.htm\" target=\"_blank\">danskmoent.dk/wilcke/w6b1.htm</a>. Першоджерельна виписка з рент-майстерських (скарбничих) рахунків Фредеріка II: «<i>17. Oktbr., af 66 1/2 Marck Kroneguld 4,860 Krone Klippinge.</i>» — пряме архівне підтвердження карбування Frederik-II-Guldkrone 17 жовтня 1563: 66½ марки сплаву Kroneguld перекарбовано на 4860 Krone-Klippinge. Перша задокументована кількість штук + матеріальний вклад карбування. Монетмайстри: Hans de Wüllers (золотар, 1563), Hans Köppelin (монетмайстер, 1564), Laurits Hammer (Bremerholm, 1565). Документує три паралельні золоті лінії Frederik II: Ungersk Gylden (Reichsdukatenfuß), Rhinsk Gylden (Rhinskgyldenfod), Kroneguld (власний Müntzfuß)."
  da: '<b>Wilcke, Julius</b>: <i>Renæssancens Mønt- og Pengeforhold 1481-1588</i>, kap. 6 «Rentemesterregnskaber under Frederik 2.» — <a href="https://www.danskmoent.dk/wilcke/w6b1.htm" target="_blank">danskmoent.dk/wilcke/w6b1.htm</a>. Primærkildeuddrag af Frederik 2.s rentemesterregnskaber: «<i>17. Oktbr., af 66 1/2 Marck Kroneguld 4,860 Krone Klippinge.</i>» — direkte arkivalsk belæg for møntningen af Frederik 2.s guldkrone 17. oktober 1563: 66½ marck kroneguld blev udmøntet til 4 860 kroneklippinge. Det første holdbare stykketal og materialeforbrug for møntningen. Møntmestre: Hans de Wüllers (guldsmed, 1563), Hans Köppelin (møntmester, 1564), Laurits Hammer (Bremerholm, 1565). Dokumenterer tre parallelle guldlinjer under Frederik 2.: Ungersk Gylden (Reichsdukatenfuß), Rhinsk Gylden (Rhinskgyldenfod) og Kroneguld (egen møntfod).'

wilcke-1927-kurantmoenten:
  de: "<b>Wilcke, Julius</b>: <i>Kurantmønten 1726–1788</i>. København: G. E. C. Gads Forlag, 1927 — Online: <a href=\"https://www.danskmoent.dk/wilcke/w3b.htm\" target=\"_blank\">danskmoent.dk/wilcke/w3b.htm</a>. Hauptquelle zur faktischen Kurantmøntfod 11⅓ (Feinsilber 20,63435 g je Rigsdaler Courant)."
  en: "<b>Wilcke, Julius</b>: <i>Kurantmønten 1726–1788</i>. Copenhagen: G. E. C. Gads Forlag, 1927 — Online: <a href=\"https://www.danskmoent.dk/wilcke/w3b.htm\" target=\"_blank\">danskmoent.dk/wilcke/w3b.htm</a>. Principal source for the de-facto Kurantmøntfod 11⅓ (fine silver 20.63435 g per Rigsdaler Courant)."
  uk: "<b>Wilcke, Julius</b>: <i>Kurantmønten 1726–1788</i>. Копенгаген: G. E. C. Gads Forlag, 1927 — Онлайн: <a href=\"https://www.danskmoent.dk/wilcke/w3b.htm\" target=\"_blank\">danskmoent.dk/wilcke/w3b.htm</a>. Головне джерело для фактичної Kurantmøntfod 11⅓ (чисте срібло 20,63435 г на Rigsdaler Courant)."
  da: '<b>Wilcke, Julius</b>: <i>Kurantmønten 1726–1788</i>. København: G. E. C. Gads Forlag, 1927 — online: <a href="https://www.danskmoent.dk/wilcke/w3b.htm" target="_blank">danskmoent.dk/wilcke/w3b.htm</a>. Hovedkilde til den faktiske Kurantmøntfod 11⅓ (20,63435 g fint sølv pr. rigsdaler courant).'

wikipedia-de-friedrich-dor:
  de: "Wikipedia (DE): <i>Friedrich d'or</i> — <a href=\"https://de.wikipedia.org/wiki/Friedrich_d%27or\" target=\"_blank\">de.wikipedia.org/wiki/Friedrich d'or</a>. Beleg für Einführungsdatum 1741 (Friedrich II.), Vorgängerprägung Wilhelm d'or 1737, 1770-Reduktion des Feingewichts von 6,05 auf 6,03 g, Mittel-Friedrich d'or 1756–1763 mit nur 4,2 g fein, Subnominale ½ / 1 / 2 Friedrich d'or, Einziehung ab 1855."
  en: "Wikipedia (DE): <i>Friedrich d'or</i> — <a href=\"https://de.wikipedia.org/wiki/Friedrich_d%27or\" target=\"_blank\">de.wikipedia.org/wiki/Friedrich d'or</a>. Source for introduction in 1741 (Friedrich II), the predecessor Wilhelm d'or of 1737, the 1770 fine-weight reduction from 6.05 to 6.03 g, the Mittel-Friedrich d'or of 1756–1763 at only 4.2 g fine, the ½ / 1 / 2 Friedrich d'or sub-denominations, and the withdrawal from 1855."
  uk: "Wikipedia (DE): <i>Friedrich d'or</i> — <a href=\"https://de.wikipedia.org/wiki/Friedrich_d%27or\" target=\"_blank\">de.wikipedia.org/wiki/Friedrich d'or</a>. Джерело про запровадження 1741 р. (Friedrich II), попередник Wilhelm d'or 1737, редукція чистої ваги 1770 р. з 6,05 до 6,03 г, Mittel-Friedrich d'or 1756–1763 з лише 4,2 г чистого, субномінали ½ / 1 / 2 Friedrich d'or, вилучення з 1855 р."
  da: 'Wikipedia (DE): <i>Friedrich d''or</i> — <a href="https://de.wikipedia.org/wiki/Friedrich_d%27or" target="_blank">de.wikipedia.org/wiki/Friedrich d''or</a>. Belæg for indførelsesåret 1741 (Frederik 2. af Preussen), for forgængeren Wilhelm d''or 1737, for nedsættelsen af finvægten fra 6,05 til 6,03 g i 1770, for Mittel-Friedrich d''or 1756–1763 med kun 4,2 g fin, for subnominalerne ½ / 1 / 2 Friedrich d''or og for inddragelsen fra 1855.'

wikipedia-en-pistole:
  de: "Wikipedia (EN): <i>Pistole</i> — <a href=\"https://en.wikipedia.org/wiki/Pistole\" target=\"_blank\">en.wikipedia.org/wiki/Pistole</a>. Beleg für 5-Thaler-Tarif (Friedrich d'or, 1741), Standardvariation «35 to a Cologne Mark of gold 130/144 fine, or 6.032 g fine gold; and at worst 35⅙ to a Mark 129/144 fine, or 5.957 g fine gold», Geltungsdauer norddeutsche Pistole 1741 — 1855, Verbreitung in mehreren Norddt. Staaten unter den Namen August-, Friedrich-August- oder Christian d'or."
  en: "Wikipedia (EN): <i>Pistole</i> — <a href=\"https://en.wikipedia.org/wiki/Pistole\" target=\"_blank\">en.wikipedia.org/wiki/Pistole</a>. Source for the 5-thaler tariff of the Friedrich d'or (1741), the standard variation «35 to a Cologne Mark of gold 130/144 fine, or 6.032 g fine gold; and at worst 35⅙ to a Mark 129/144 fine, or 5.957 g fine gold», the North-German pistole's validity 1741 — 1855, and its spread across several North-German states under the names August-, Friedrich-August- or Christian d'or."
  uk: "Wikipedia (EN): <i>Pistole</i> — <a href=\"https://en.wikipedia.org/wiki/Pistole\" target=\"_blank\">en.wikipedia.org/wiki/Pistole</a>. Джерело для тарифу 5 талерів Friedrich d'or (1741), варіації стандарту «35 to a Cologne Mark of gold 130/144 fine, or 6.032 g fine gold; and at worst 35⅙ to a Mark 129/144 fine, or 5.957 g fine gold», дії північно-німецької пістолі 1741 — 1855 рр. і її поширення в кількох північно-німецьких державах як August d'or, Friedrich-August d'or або Christian d'or."
  da: 'Wikipedia (EN): <i>Pistole</i> — <a href="https://en.wikipedia.org/wiki/Pistole" target="_blank">en.wikipedia.org/wiki/Pistole</a>. Belæg for 5-dalertariffen (Friedrich d''or, 1741), for standardens variation «35 to a Cologne Mark of gold 130/144 fine, or 6.032 g fine gold; and at worst 35⅙ to a Mark 129/144 fine, or 5.957 g fine gold», for den nordtyske pistoles gyldighed 1741–1855 og for dens udbredelse i flere nordtyske stater under navnene August-, Friedrich-August- eller Christian d''or.'

wikipedia-de-krone-vereinsgoldmuenze:
  de: "Wikipedia (DE): <i>Krone (Vereinsgoldmünze)</i> — <a href=\"https://de.wikipedia.org/wiki/Krone_(Vereinsgoldm%C3%BCnze)\" target=\"_blank\">de.wikipedia.org/wiki/Krone (Vereinsgoldmünze)</a>. Hauptquelle für Wiener Münzvertrag 24. Januar 1857 (in Kraft 1. Mai 1857), Standard «50 Krone / Pfund Feingold» bzw. «100 ½ Krone / Pfund», Probe 900 ‰, beide Stückelungen, Mintage pro Vertragsstaat (Hannover 784 296, Österreich 498 657, Preußen 278 491, Sachsen 56 739, Braunschweig 45 298, Bayern 3 867), Demonetisierung 1. April 1874 mit Einlösungsfrist 30. Juni 1874, kein Annahmezwang, Marktkurs 9,3 Taler bei Au:Ag 1:15,5."
  en: "Wikipedia (DE): <i>Krone (Vereinsgoldmünze)</i> — <a href=\"https://de.wikipedia.org/wiki/Krone_(Vereinsgoldm%C3%BCnze)\" target=\"_blank\">de.wikipedia.org/wiki/Krone (Vereinsgoldmünze)</a>. Main source for the Vienna Coin Treaty of 24 January 1857 (in force 1 May 1857), the standard «50 Krone / Pfund of fine gold» and «100 ½ Krone / Pfund», 900‰ fineness, both denominations, mintage by treaty state (Hanover 784,296, Austria 498,657, Prussia 278,491, Saxony 56,739, Brunswick 45,298, Bavaria 3,867), demonetisation 1 April 1874 with redemption deadline 30 June 1874, no compulsory acceptance, market rate 9.3 Taler at Au:Ag 1:15.5."
  uk: "Wikipedia (DE): <i>Krone (Vereinsgoldmünze)</i> — <a href=\"https://de.wikipedia.org/wiki/Krone_(Vereinsgoldm%C3%BCnze)\" target=\"_blank\">de.wikipedia.org/wiki/Krone (Vereinsgoldmünze)</a>. Головне джерело для Wiener Münzvertrag 24 січня 1857 (чинність з 1 травня 1857), стандарт «50 Krone з фунта чистого золота» та «100 ½ Krone з фунта», проба 900 ‰, обидва номінали, обсяги карбування по державах (Ганновер 784 296, Австрія 498 657, Пруссія 278 491, Саксонія 56 739, Брауншвайг 45 298, Баварія 3 867), демонетизація 1 квітня 1874 з терміном викупу 30 червня 1874, відсутність обов'язку прийняття, ринковий курс 9,3 Taler при Au:Ag 1:15,5."
  da: 'Wikipedia (DE): <i>Krone (Vereinsgoldmünze)</i> — <a href="https://de.wikipedia.org/wiki/Krone_(Vereinsgoldm%C3%BCnze)" target="_blank">de.wikipedia.org/wiki/Krone (Vereinsgoldmünze)</a>. Hovedkilde til Wiener Münzvertrag 24. januar 1857 (i kraft 1. maj 1857), til standarden «50 Krone pr. pund fint guld» henholdsvis «100 ½ Krone pr. pund», til lødigheden 900 ‰, til begge stykkestørrelser, til møntningstallene pr. traktatstat (Hannover 784 296, Østrig 498 657, Preussen 278 491, Sachsen 56 739, Braunschweig 45 298, Bayern 3 867) og til demonetiseringen 1. april 1874 med indløsningsfrist 30. juni 1874, uden modtagelsespligt og med en markedskurs på 9,3 daler ved guld : sølv 1 : 15,5.'

wikipedia-de-corona-danica:
  de: "Wikipedia (de): <i>Corona Danica</i> — <a href=\"https://de.wikipedia.org/wiki/Corona_Danica\" target=\"_blank\">de.wikipedia.org/wiki/Corona_Danica</a>. Standardparameter der Christian-IV.-Krone 1618 und Datierung des Tarif-Schnitts 1625."
  en: "Wikipedia (de): <i>Corona Danica</i> — <a href=\"https://de.wikipedia.org/wiki/Corona_Danica\" target=\"_blank\">de.wikipedia.org/wiki/Corona_Danica</a>. Standard parameters for the Christian IV Krone of 1618 and dating of the 1625 tariff cut."
  uk: "Wikipedia (de): <i>Corona Danica</i> — <a href=\"https://de.wikipedia.org/wiki/Corona_Danica\" target=\"_blank\">de.wikipedia.org/wiki/Corona_Danica</a>. Стандартні параметри Krone Кристіана IV 1618 р. та датування зниження тарифу 1625 р."
  da: 'Wikipedia (de): <i>Corona Danica</i> — <a href="https://de.wikipedia.org/wiki/Corona_Danica" target="_blank">de.wikipedia.org/wiki/Corona_Danica</a>. Standardparametrene for Christian 4.s krone 1618 og dateringen af tarifskiftet 1625.'

mgm-handelsdukat:
  de: "<b>MGM Münzlexikon</b>: <i>Handelsdukat</i> — <a href=\"https://www.mgmindex.de/index.php?title=Handelsdukat\" target=\"_blank\">mgmindex.de/index.php?title=Handelsdukat</a>. Beleg für die Rolle der niederländischen Handelsdukaten als maßgebliche Welthandelsmünze des 17.–18. Jh., insbesondere im Ostseehandel."
  en: "<b>MGM Münzlexikon</b>: <i>Handelsdukat</i> — <a href=\"https://www.mgmindex.de/index.php?title=Handelsdukat\" target=\"_blank\">mgmindex.de/index.php?title=Handelsdukat</a>. Source for the role of Dutch Handelsdukaten as the principal world-trade gold coin of the 17th-18th centuries, especially in the Baltic trade."
  uk: "<b>MGM Münzlexikon</b>: <i>Handelsdukat</i> — <a href=\"https://www.mgmindex.de/index.php?title=Handelsdukat\" target=\"_blank\">mgmindex.de/index.php?title=Handelsdukat</a>. Джерело для ролі нідерландських Handelsdukaten як головної світової торговельної монети XVII–XVIII ст., особливо в балтійській торгівлі."
  da: '<b>MGM Münzlexikon</b>: <i>Handelsdukat</i> — <a href="https://www.mgmindex.de/index.php?title=Handelsdukat" target="_blank">mgmindex.de/index.php?title=Handelsdukat</a>. Belæg for de nederlandske handelsdukaters rolle som toneangivende verdenshandelsmønt i 1600- og 1700-tallet, ikke mindst i østersøhandelen.'

museum-rantzau-taler-dukaten:
  de: "<b>Museum der Grafschaft Rantzau, Barmstedt</b>: <i>Taler und Dukaten — das Geld der Neuzeit</i> — <a href=\"https://www.museum-grafschaft-rantzau.de/das-geld-der-grafen/taler-und-dukaten-das-geld-der-neuzeit\" target=\"_blank\">museum-grafschaft-rantzau.de</a>. Regionale schleswig-holsteinische Quelle für das Prinzip, daß umlaufende Goldmünzen «<i>ihren Wert durch den Edelmetallgehalt</i>» erhielten — Annahme fremder Dukaten unabhängig von Prägeort."
  en: "<b>Museum der Grafschaft Rantzau, Barmstedt</b>: <i>Taler und Dukaten — das Geld der Neuzeit</i> — <a href=\"https://www.museum-grafschaft-rantzau.de/das-geld-der-grafen/taler-und-dukaten-das-geld-der-neuzeit\" target=\"_blank\">museum-grafschaft-rantzau.de</a>. Regional Schleswig-Holstein source for the principle that circulating gold coins «<i>derived their value from precious-metal content</i>» — foreign ducats were accepted regardless of mint origin."
  uk: "<b>Museum der Grafschaft Rantzau, Barmstedt</b>: <i>Taler und Dukaten — das Geld der Neuzeit</i> — <a href=\"https://www.museum-grafschaft-rantzau.de/das-geld-der-grafen/taler-und-dukaten-das-geld-der-neuzeit\" target=\"_blank\">museum-grafschaft-rantzau.de</a>. Регіональне шлезвіг-гольштейнське джерело для принципу, що золоті монети в обігу «<i>отримували свою вартість через вміст дорогоцінного металу</i>» — іноземні дукати приймались незалежно від місця карбування."
  da: '<b>Museum der Grafschaft Rantzau, Barmstedt</b>: <i>Taler und Dukaten — das Geld der Neuzeit</i> — <a href="https://www.museum-grafschaft-rantzau.de/das-geld-der-grafen/taler-und-dukaten-das-geld-der-neuzeit" target="_blank">museum-grafschaft-rantzau.de</a>. Regional slesvig-holstensk kilde til det princip, at omløbende guldmønter fik «<i>ihren Wert durch den Edelmetallgehalt</i>» — fremmede dukater blev modtaget uafhængigt af prægestedet.'

schroetter-wb-muenzkunde-1930:
  de: "<b>Schrötter, Friedrich Frhr. v.</b> (Hg.): <i>Wörterbuch der Münzkunde</i> (Berlin: Walter de Gruyter, 1930), Eintrag «Corona Danica», S. 113–114 — <a href=\"https://archive.org/details/worterbuchdermun007491mbp\" target=\"_blank\">archive.org/details/worterbuchdermun007491mbp</a>. Primärquelle für die Christian-IV.-Krone-Parameter und den Tarif-Schnitt 1625."
  en: "<b>Schrötter, Friedrich Frhr. v.</b> (ed.): <i>Wörterbuch der Münzkunde</i> (Berlin: Walter de Gruyter, 1930), entry «Corona Danica», pp. 113–114 — <a href=\"https://archive.org/details/worterbuchdermun007491mbp\" target=\"_blank\">archive.org/details/worterbuchdermun007491mbp</a>. Primary source for the Christian IV Krone parameters and the 1625 tariff cut."
  uk: "<b>Schrötter, Friedrich Frhr. v.</b> (ред.): <i>Wörterbuch der Münzkunde</i> (Берлін: Walter de Gruyter, 1930), стаття «Corona Danica», с. 113–114 — <a href=\"https://archive.org/details/worterbuchdermun007491mbp\" target=\"_blank\">archive.org/details/worterbuchdermun007491mbp</a>. Першоджерело параметрів Krone Кристіана IV та дати зниження тарифу 1625."
  da: '<b>Schrötter, Friedrich Frhr. v.</b> (udg.): <i>Wörterbuch der Münzkunde</i> (Berlin: Walter de Gruyter, 1930), opslaget «Corona Danica», s. 113–114 — <a href="https://archive.org/details/worterbuchdermun007491mbp" target="_blank">archive.org/details/worterbuchdermun007491mbp</a>. Primærkilde til parametrene for Christian 4.s krone og til tarifskiftet 1625.'

bobzin-muenzfuesse:
  de: "<b>Bobzin, Hagen und Gudrun</b>: <i>Münzfüße</i> — <a href=\"http://www.hagen-bobzin.de/hobby/muenzfuesse.html\" target=\"_blank\">hagen-bobzin.de/hobby/muenzfuesse.html</a>. Tabellarische Übersicht der norddeutschen Müntzfüße einschließlich des Altonaer Banco-Fußes 1777 (27¾ Mark Banco = 9¼ Reichsthaler je feine Cöllnische Marck)."
  en: "<b>Bobzin, Hagen and Gudrun</b>: <i>Münzfüße</i> — <a href=\"http://www.hagen-bobzin.de/hobby/muenzfuesse.html\" target=\"_blank\">hagen-bobzin.de/hobby/muenzfuesse.html</a>. Tabular overview of the North German Müntzfuß systems including the Altona Banco-Fuß of 1777 (27¾ Mark Banco = 9¼ Reichsthaler per fine Cologne mark)."
  uk: "<b>Bobzin, Hagen і Gudrun</b>: <i>Münzfüße</i> — <a href=\"http://www.hagen-bobzin.de/hobby/muenzfuesse.html\" target=\"_blank\">hagen-bobzin.de/hobby/muenzfuesse.html</a>. Табличний огляд північнонімецьких Müntzfuß-стандартів, у т.ч. альтонського Banco-Fuß 1777 (27¾ Mark Banco = 9¼ Reichsthaler з чистої кельнської марки)."
  da: '<b>Bobzin, Hagen og Gudrun</b>: <i>Münzfüße</i> — <a href="http://www.hagen-bobzin.de/hobby/muenzfuesse.html" target="_blank">hagen-bobzin.de/hobby/muenzfuesse.html</a>. Tabellarisk oversigt over de nordtyske møntfødder, herunder Altonaer Banco-Fuß 1777 (27¾ Mark Banco = 9¼ rigsdaler pr. fin cølnsk marck).'

hede-c4h25-2-guldkrone:
  de: "<b>Hede c4h25</b>: Christian IV. 2 Guldkrone (Hede 25) — <a href=\"https://www.danskmoent.dk/chr/c4h25.htm\" target=\"_blank\">danskmoent.dk/chr/c4h25.htm</a>. Verbatim Pålydende «<i>2 Guldkrone</i>» · Bruttovægt <b>5,996 g</b> · Finhed <b>0,917</b> · Finvægt <b>5,496 g</b> · København · Jahrgänge 1619, 1621, 1626, 1628, 1630, 1633, 1635, 1637, 1648 — direkter Hede-Beleg, daß die Christian-IV.-Hede-25-Serie metrisch identisch zur späteren Frederik-III.-Guldkrone-Definition ist und in Hedes eigener Klassifikation als «Guldkrone» geführt wird. Schlüsselgrundlage der pre-I-Phase-Placement im Guldkrone-Fuß."
  en: "<b>Hede c4h25</b>: Christian IV 2 Guldkrone (Hede 25) — <a href=\"https://www.danskmoent.dk/chr/c4h25.htm\" target=\"_blank\">danskmoent.dk/chr/c4h25.htm</a>. Verbatim Pålydende «<i>2 Guldkrone</i>» · Bruttovægt <b>5.996 g</b> · Finhed <b>0.917</b> · Finvægt <b>5.496 g</b> · Copenhagen · years 1619, 1621, 1626, 1628, 1630, 1633, 1635, 1637, 1648 — direct Hede attestation that the Christian IV Hede 25 series is metrically identical to the later Frederik III Guldkrone definition and named «Guldkrone» in Hede's own classification. Key basis for the pre-I phase placement under the Guldkrone-Fuß."
  uk: "<b>Hede c4h25</b>: Кристіан IV 2 Guldkrone (Hede 25) — <a href=\"https://www.danskmoent.dk/chr/c4h25.htm\" target=\"_blank\">danskmoent.dk/chr/c4h25.htm</a>. Verbatim Pålydende «<i>2 Guldkrone</i>» · Bruttovægt <b>5,996 г</b> · Finhed <b>0,917</b> · Finvægt <b>5,496 г</b> · Копенгаген · роки 1619, 1621, 1626, 1628, 1630, 1633, 1635, 1637, 1648 — прямий доказ Hede, що серія Кристіана IV Hede 25 метрично ідентична пізнішому означенню Frederik III Guldkrone і у власній класифікації Hede названа «Guldkrone». Ключова основа для розташування у фазі pre-I Guldkrone-Fuß."
  da: '<b>Hede c4h25</b>: Christian 4. 2 Guldkrone (Hede 25) — <a href="https://www.danskmoent.dk/chr/c4h25.htm" target="_blank">danskmoent.dk/chr/c4h25.htm</a>. Ordret pålydende «<i>2 Guldkrone</i>» · bruttovægt <b>5,996 g</b> · finhed <b>0,917</b> · finvægt <b>5,496 g</b> · København · årgangene 1619, 1621, 1626, 1628, 1630, 1633, 1635, 1637, 1648 — direkte belæg hos Hede for, at Christian 4.s Hede 25-serie metrisk er identisk med den senere definition af Frederik 3.s guldkrone, og at den i Hedes egen klassifikation føres som «Guldkrone».'

hede-f3h44-1-guldkrone:
  de: "<b>Hede f3h44</b>: Frederik III. 1 Guldkrone (Hede 44) — <a href=\"https://www.danskmoent.dk/fr/f3h44.htm\" target=\"_blank\">danskmoent.dk/fr/f3h44.htm</a>. Verbatim Pålydende «<i>1 Guldkrone</i>» · Bruttovægt <b>5,590 g</b> · Finhed <b>0,917</b> · Finvægt <b>5,126 g</b> · København 1666 · auf der Seite ausdrücklich «1 og 2 Guldkrone 1666, København» (Hede 45 ist die Doppel-Variante mit 11,181 g rau) — direkter Beleg für die spät-Frederik-III.-Kopenhagener Folgeprägung der Guldkrone-Linie außerhalb der kanonischen Glückstadter Hauptphase 1657–1660."
  en: "<b>Hede f3h44</b>: Frederik III 1 Guldkrone (Hede 44) — <a href=\"https://www.danskmoent.dk/fr/f3h44.htm\" target=\"_blank\">danskmoent.dk/fr/f3h44.htm</a>. Verbatim Pålydende «<i>1 Guldkrone</i>» · Bruttovægt <b>5.590 g</b> · Finhed <b>0.917</b> · Finvægt <b>5.126 g</b> · Copenhagen 1666 · the page states «1 og 2 Guldkrone 1666, København» (Hede 45 is the double variant at 11.181 g rough) — direct attestation for the late Frederik III Copenhagen follow-up issue of the Guldkrone line outside the canonical Glückstadt 1657–1660 main phase."
  uk: "<b>Hede f3h44</b>: Фредерік III 1 Guldkrone (Hede 44) — <a href=\"https://www.danskmoent.dk/fr/f3h44.htm\" target=\"_blank\">danskmoent.dk/fr/f3h44.htm</a>. Verbatim Pålydende «<i>1 Guldkrone</i>» · Bruttovægt <b>5,590 г</b> · Finhed <b>0,917</b> · Finvægt <b>5,126 г</b> · Копенгаген 1666 · сторінка явно зазначає «1 og 2 Guldkrone 1666, København» (Hede 45 — подвійна варіація з 11,181 г повної ваги) — прямий доказ пізнього копенгагенського продовження Frederik III лінії Guldkrone поза канонічною ґлюкштадтською головною фазою 1657–1660."
  da: '<b>Hede f3h44</b>: Frederik 3. 1 Guldkrone (Hede 44) — <a href="https://www.danskmoent.dk/fr/f3h44.htm" target="_blank">danskmoent.dk/fr/f3h44.htm</a>. Ordret pålydende «<i>1 Guldkrone</i>» · bruttovægt <b>5,590 g</b> · finhed <b>0,917</b> · finvægt <b>5,126 g</b> · København 1666 · siden anfører udtrykkeligt «1 og 2 Guldkrone 1666, København» (Hede 45 er dobbeltstykket med 11,181 g brutto) — direkte belæg for den sene københavnske fortsættelse af guldkronelinjen under Frederik 3., uden for den kanoniske glückstadtske hovedfase 1657–1660.'

hede-1957-f3-guldkroner-nnum:
  de: "<b>Hede, Holger</b>: <i>Frederik III's guldkroner</i>, NNUM 1957 — <a href=\"https://www.danskmoent.dk/artikler/f3guldkr.htm\" target=\"_blank\">danskmoent.dk/artikler/f3guldkr.htm</a>. Fußnote (1) verbatim: «<i>Betegnelsen guldkrone dækker under Frederik III den mønt, Christian IV kaldte 2 guldkrone</i>» — direkter Beleg für den nomenklatorischen Wechsel: die unter Frederik III. als «1 Guldkrone» geführte Münze (Hede 44/145, 5,996 g rau) ist physisch dieselbe wie Christian IVs «2 Guldkrone» (Hede 25). Christian IV.'s eigene «1 Guldkrone» (Hede 26, ~3 g) entspricht damit physisch der ½ Guldkrone unter Frederik III.'s Definition."
  en: "<b>Hede, Holger</b>: <i>Frederik III's guldkroner</i>, NNUM 1957 — <a href=\"https://www.danskmoent.dk/artikler/f3guldkr.htm\" target=\"_blank\">danskmoent.dk/artikler/f3guldkr.htm</a>. Footnote (1) verbatim: «<i>Betegnelsen guldkrone dækker under Frederik III den mønt, Christian IV kaldte 2 guldkrone</i>» — direct attestation of the nomenclature shift: the coin called «1 Guldkrone» under Frederik III (Hede 44/145, 5.996 g rough) is physically the same coin Christian IV called «2 Guldkrone» (Hede 25). Christian IV's own «1 Guldkrone» (Hede 26, ~3 g) therefore physically corresponds to ½ Guldkrone under Frederik III's definition."
  uk: "<b>Hede, Holger</b>: <i>Frederik III's guldkroner</i>, NNUM 1957 — <a href=\"https://www.danskmoent.dk/artikler/f3guldkr.htm\" target=\"_blank\">danskmoent.dk/artikler/f3guldkr.htm</a>. Виноска (1) verbatim: «<i>Betegnelsen guldkrone dækker under Frederik III den mønt, Christian IV kaldte 2 guldkrone</i>» — прямий доказ номенклатурного зсуву: монета, яку Фредерік III назвав «1 Guldkrone» (Hede 44/145, 5,996 г повної ваги), фізично та сама, що Кристіан IV називав «2 Guldkrone» (Hede 25). Тому «1 Guldkrone» самого Кристіана IV (Hede 26, ~3 г) фізично відповідає ½ Guldkrone в означенні Фредеріка III."
  da: '<b>Hede, Holger</b>: <i>Frederik III''s guldkroner</i>, NNUM 1957 — <a href="https://www.danskmoent.dk/artikler/f3guldkr.htm" target="_blank">danskmoent.dk/artikler/f3guldkr.htm</a>. Note (1) ordret: «<i>Betegnelsen guldkrone dækker under Frederik III den mønt, Christian IV kaldte 2 guldkrone</i>» — direkte belæg for navneskiftet: den mønt, der under Frederik 3. føres som «1 Guldkrone» (Hede 44/145, 5,996 g brutto), er fysisk den samme som Christian 4.s «2 Guldkrone» (Hede 25). Christian 4.s egen «1 Guldkrone» (Hede 26, ~3 g) svarer dermed fysisk til ½ guldkrone efter Frederik 3.s definition.'

hede-1957-kronemoenten-nnum:
  de: "<b>Hede, Holger</b>: <i>Kronemønten 1618–1771</i>, Nordisk Numismatisk Unions Medlemsblad (NNUM) 1957, S. 129–134 — <a href=\"https://danskmoent.dk/artikler/hedekron.htm\" target=\"_blank\">danskmoent.dk/artikler/hedekron.htm</a>. Kanonische Werte der drei dänischen Krone-Münzformeln (1618, 1671, 1693) auf Grundlage von Wilcke I/II."
  en: "<b>Hede, Holger</b>: <i>Kronemønten 1618–1771</i>, Nordisk Numismatisk Unions Medlemsblad (NNUM) 1957, pp. 129–134 — <a href=\"https://danskmoent.dk/artikler/hedekron.htm\" target=\"_blank\">danskmoent.dk/artikler/hedekron.htm</a>. Canonical values for the three Danish Krone standards (1618, 1671, 1693), drawing on Wilcke I/II."
  uk: "<b>Hede, Holger</b>: <i>Kronemønten 1618–1771</i>, Nordisk Numismatisk Unions Medlemsblad (NNUM) 1957, с. 129–134 — <a href=\"https://danskmoent.dk/artikler/hedekron.htm\" target=\"_blank\">danskmoent.dk/artikler/hedekron.htm</a>. Канонічні значення трьох данських Krone-стандартів (1618, 1671, 1693) за Wilcke I/II."
  da: '<b>Hede, Holger</b>: <i>Kronemønten 1618–1771</i>, Nordisk Numismatisk Unions Medlemsblad (NNUM) 1957, s. 129–134 — <a href="https://danskmoent.dk/artikler/hedekron.htm" target="_blank">danskmoent.dk/artikler/hedekron.htm</a>. De kanoniske værdier for de tre danske kroneformler (1618, 1671, 1693) på grundlag af Wilcke I/II.'

danskmoent-1nobel:
  de: "<b>danskmoent.dk «1 Nobel»</b> — <a href=\"https://www.danskmoent.dk/1nobel.htm\" target=\"_blank\">danskmoent.dk/1nobel.htm</a>. Hede-Übersichtsseite für die dänischen Nobler über drei Regenten: <b>Hans</b> (1496 Malmø/København Galster 24 / Schou 2-3 RRR; 1502 Malmø Galster 24 / Schou 2-3 unik); <b>Christian II.</b> (1516 Malmø Galster 37 / Schou 1 RRR; 1518 Malmø Galster 37 / Schou 1 RRR); <b>Frederik I.</b> (1532 København / Malmø Galster 45 / Schou 1 RRR; undatiert Ribe Galster 68 + Galster 69 unik). Belegt-Mintstätten: Malmø (primär), København, Ribe. Bilddarstellung: «<i>Siddende konge med glorie (Sct. Knud), bagside: våbenskjold</i>» (Hans) / «<i>Siddende konge, bagside: våbenskjold</i>» (Christian II / Frederik I) — Sct. Knud-Glorie ist Hans-spezifisch."
  en: "<b>danskmoent.dk «1 Nobel»</b> — <a href=\"https://www.danskmoent.dk/1nobel.htm\" target=\"_blank\">danskmoent.dk/1nobel.htm</a>. Hede overview page for the Danish Nobler across three rulers: <b>Hans</b> (1496 Malmø/Copenhagen Galster 24 / Schou 2-3 RRR; 1502 Malmø Galster 24 / Schou 2-3 unique); <b>Christian II</b> (1516 Malmø Galster 37 / Schou 1 RRR; 1518 Malmø Galster 37 / Schou 1 RRR); <b>Frederik I</b> (1532 Copenhagen / Malmø Galster 45 / Schou 1 RRR; undated Ribe Galster 68 + Galster 69 unique). Documented mints: Malmø (primary), Copenhagen, Ribe. Image description: «<i>Seated king with halo (Saint Canute), reverse: coat of arms</i>» (Hans) / «<i>Seated king, reverse: coat of arms</i>» (Christian II / Frederik I) — the Saint Canute halo is Hans-specific."
  uk: "<b>danskmoent.dk «1 Nobel»</b> — <a href=\"https://www.danskmoent.dk/1nobel.htm\" target=\"_blank\">danskmoent.dk/1nobel.htm</a>. Hede-оглядова сторінка для данських Nobler через трьох правителів: <b>Hans</b> (1496 Malmø/Копенгаген Galster 24 / Schou 2-3 RRR; 1502 Malmø Galster 24 / Schou 2-3 унікат); <b>Christian II</b> (1516 Malmø Galster 37 / Schou 1 RRR; 1518 Malmø Galster 37 / Schou 1 RRR); <b>Frederik I</b> (1532 Копенгаген / Malmø Galster 45 / Schou 1 RRR; недатовано Ribe Galster 68 + Galster 69 унікат). Задокументовані монетні двори: Malmø (головний), Копенгаген, Ribe. Опис зображення: «<i>Сидячий король з ореолом (Свт. Канут), реверс: гербовий щит</i>» (Hans) / «<i>Сидячий король, реверс: гербовий щит</i>» (Christian II / Frederik I) — ореол Святого Канута специфічний для Hans."
  da: '<b>danskmoent.dk «1 Nobel»</b> — <a href="https://www.danskmoent.dk/1nobel.htm" target="_blank">danskmoent.dk/1nobel.htm</a>. Hede-oversigtsside for de danske nobler under tre regenter: <b>Hans</b> (1496 Malmø/København, Galster 24 / Schou 2-3, RRR; 1502 Malmø, Galster 24 / Schou 2-3, unik); <b>Christian 2.</b> (1516 Malmø, Galster 37 / Schou 1, RRR; 1518 Malmø, Galster 37 / Schou 1, RRR); <b>Frederik 1.</b> (1532 København / Malmø, Galster 45 / Schou 1, RRR; udateret Ribe, Galster 68 + Galster 69, unik). Belagte møntsteder: Malmø (primært), København, Ribe. Billedbeskrivelse: «<i>Siddende konge med glorie (Sct. Knud), bagside: våbenskjold</i>» (Hans) / «<i>Siddende konge, bagside: våbenskjold</i>» (Christian 2. / Frederik 1.) — glorien med Sct. Knud er særegen for Hans.'

danskmoent-1rosenobel:
  de: "<b>danskmoent.dk «1 Rosenobel»</b> — <a href=\"https://www.danskmoent.dk/1rosenob.htm\" target=\"_blank\">danskmoent.dk/1rosenob.htm</a>. Hede-Übersichtsseite für die dänischen Rosenobler: <b>Frederik II.</b> 1584 (Frederiksborg, Hede 7B / Schou 2 / Sieg 29, unik); <b>Christian IV.</b> Typ A (1611-1613 + 1627 + 1629, Hede 23A / Schou 1-5/1-4/1-3/1 / Sieg 149); Typ B (Hede 23B / Schou 2-3 / Sieg 149). Hauptmünzstätte Kopenhagen für Christian IVs Karbung. Verbatim Etymologie: «<i>Navnet Rosenobel stammer fra den engelske mønt Rose noble fra 13-1400-tallet</i>» — die dänische Rosenobel-Karbung ist eine späte Anpassung des englischen Rose-Noble-Modells."
  en: "<b>danskmoent.dk «1 Rosenobel»</b> — <a href=\"https://www.danskmoent.dk/1rosenob.htm\" target=\"_blank\">danskmoent.dk/1rosenob.htm</a>. Hede overview page for the Danish Rosenobler: <b>Frederik II</b> 1584 (Frederiksborg, Hede 7B / Schou 2 / Sieg 29, unique); <b>Christian IV</b> Type A (1611-1613 + 1627 + 1629, Hede 23A / Schou 1-5/1-4/1-3/1 / Sieg 149); Type B (Hede 23B / Schou 2-3 / Sieg 149). Principal mint Copenhagen for Christian IV's coinage. Verbatim etymology: «<i>Navnet Rosenobel stammer fra den engelske mønt Rose noble fra 13-1400-tallet</i>» — the Danish Rosenobel coinage is a late adaptation of the English Rose Noble model."
  uk: "<b>danskmoent.dk «1 Rosenobel»</b> — <a href=\"https://www.danskmoent.dk/1rosenob.htm\" target=\"_blank\">danskmoent.dk/1rosenob.htm</a>. Hede-оглядова сторінка для данських Rosenobler: <b>Frederik II</b> 1584 (Frederiksborg, Hede 7B / Schou 2 / Sieg 29, унікат); <b>Christian IV</b> Тип A (1611-1613 + 1627 + 1629, Hede 23A / Schou 1-5/1-4/1-3/1 / Sieg 149); Тип B (Hede 23B / Schou 2-3 / Sieg 149). Головний монетний двір Копенгаген для карбування Christian IV. Verbatim етимологія: «<i>Navnet Rosenobel stammer fra den engelske mønt Rose noble fra 13-1400-tallet</i>» — данське карбування Rosenobel — пізня адаптація моделі англійського Rose Noble."
  da: '<b>danskmoent.dk «1 Rosenobel»</b> — <a href="https://www.danskmoent.dk/1rosenob.htm" target="_blank">danskmoent.dk/1rosenob.htm</a>. Hede-oversigtsside for de danske rosenobler: <b>Frederik 2.</b> 1584 (Frederiksborg, Hede 7B / Schou 2 / Sieg 29, unik); <b>Christian 4.</b> type A (1611-1613 + 1627 + 1629, Hede 23A / Schou 1-5/1-4/1-3/1 / Sieg 149); type B (Hede 23B / Schou 2-3 / Sieg 149). Hovedmøntsted for Christian 4.s møntning er København. Ordret om navnet: «<i>Navnet Rosenobel stammer fra den engelske mønt Rose noble fra 13-1400-tallet</i>» — den danske rosenobelmøntning er en sen tilpasning af den engelske rose noble.'

danskmoent-1guldkrone:
  de: "<b>danskmoent.dk «1 Guldkrone»</b> — <a href=\"https://www.danskmoent.dk/1guldkro.htm\" target=\"_blank\">danskmoent.dk/1guldkro.htm</a>. Hede-Übersichtsseite für die Frederik-II-Guldkrone-Klippinge: «<i>Hede 2</i>» (1563, unikat) und «<i>Hede 5</i>» (1564), Kopenhagen, Brutto 3,341 g, Lødighed 0,934, Feingewicht 3,120 g. Drei parallele Goldarten dieser Karbung: <b>Ungersk Gylden</b> (ungarisch, Reichsdukatenfuß), <b>Rhinsk Gylden</b> (rheinisch, Rhinskgyldenfod), <b>Kroneguld</b> (eigene Krone-Legierung, dieser Müntzfuß). Reversinschrift verbatim: «<i>I GOLT KRONE</i>» (parallel zu «I GOLT GILDEN» und «I DOK KATE» der Schwester-Goldarten)."
  en: "<b>danskmoent.dk «1 Guldkrone»</b> — <a href=\"https://www.danskmoent.dk/1guldkro.htm\" target=\"_blank\">danskmoent.dk/1guldkro.htm</a>. Hede overview page for the Frederik II Guldkrone Klippinge: «<i>Hede 2</i>» (1563, unique) and «<i>Hede 5</i>» (1564), Copenhagen, brutto 3.341 g, lødighed 0.934, fine weight 3.120 g. Three parallel gold types in this coinage: <b>Ungersk Gylden</b> (Hungarian, Reichsdukatenfuß), <b>Rhinsk Gylden</b> (Rhenish, Rhinskgyldenfod), <b>Kroneguld</b> (own crown-gold alloy, this Müntzfuß). Reverse inscription verbatim: «<i>I GOLT KRONE</i>» (paralleling «I GOLT GILDEN» and «I DOK KATE» of the sister gold types)."
  uk: "<b>danskmoent.dk «1 Guldkrone»</b> — <a href=\"https://www.danskmoent.dk/1guldkro.htm\" target=\"_blank\">danskmoent.dk/1guldkro.htm</a>. Hede-оглядова сторінка для Frederik-II-Guldkrone-Klippinge: «<i>Hede 2</i>» (1563, унікат) і «<i>Hede 5</i>» (1564), Копенгаген, повна вага 3,341 г, проба 0,934, чиста вага 3,120 г. Три паралельні золоті типи цього карбування: <b>Ungersk Gylden</b> (угорський, Reichsdukatenfuß), <b>Rhinsk Gylden</b> (рейнський, Rhinskgyldenfod), <b>Kroneguld</b> (власна Krone-легура, цей Müntzfuß). Реверс-напис verbatim: «<i>I GOLT KRONE</i>» (паралельно «I GOLT GILDEN» та «I DOK KATE» сестринських золотих типів)."
  da: '<b>danskmoent.dk «1 Guldkrone»</b> — <a href="https://www.danskmoent.dk/1guldkro.htm" target="_blank">danskmoent.dk/1guldkro.htm</a>. Hede-oversigtsside for Frederik 2.s guldkroneklippinge: «<i>Hede 2</i>» (1563, unik) og «<i>Hede 5</i>» (1564), København, brutto 3,341 g, lødighed 0,934, finvægt 3,120 g. Tre parallelle guldarter i denne møntning: <b>Ungersk Gylden</b> (ungarsk, Reichsdukatenfuß), <b>Rhinsk Gylden</b> (rhinsk, Rhinskgyldenfod) og <b>Kroneguld</b> (egen kronelegering, denne møntfod). Ordret bagsideindskrift: «<i>I GOLT KRONE</i>» (parallelt med «I GOLT GILDEN» og «I DOK KATE» på søsterguldarterne).'

historyofwar-kalmar-war-1611:
  de: "<b>Historyofwar.org «Kalmar War, 1611-1613»</b> — <a href=\"https://www.historyofwar.org/articles/wars_kalmar.html\" target=\"_blank\">historyofwar.org/articles/wars_kalmar.html</a>. Hintergrundsynthese des Kriegs zwischen Dänemark-Norwegen und Schweden 1611-1613. Christian IV. greift 1611 Schweden an mit dem Hauptziel, Schweden zur Rückkehr in die Kalmarer Union zu zwingen — Ziel verfehlt, aber Schweden zahlt im Frieden von Knäred 1613 eine Kriegsschadensbild von <b>1 Million Riksdaler Silber</b> (sogenanntes Älvsborg-Lösegeld). Der Kriegsfinanzierungs-Bedarf in den Jahren 1611-1613 erklärt die Karbung der Christian-IV-Rosenobler (Hede 23A) als Prestige-Goldemission zur Söldnerbezahlung; die spätere Rosenobel-Karbung 1627 + 1629 fällt in den Beginn der dänischen Beteiligung am Dreißigjährigen Krieg (Kaiserlich-Dänischer Krieg 1625-1629)."
  en: "<b>Historyofwar.org «Kalmar War, 1611-1613»</b> — <a href=\"https://www.historyofwar.org/articles/wars_kalmar.html\" target=\"_blank\">historyofwar.org/articles/wars_kalmar.html</a>. Background synthesis of the war between Denmark-Norway and Sweden 1611-1613. Christian IV attacks Sweden in 1611 with the main aim of forcing Sweden back into the Kalmar Union — the aim fails, but in the Treaty of Knäred 1613 Sweden pays a war indemnity of <b>1 million silver riksdaler</b> (the so-called Älvsborg ransom). The wartime-financing pressure of 1611-1613 explains the coinage of Christian IV's Rosenobler (Hede 23A) as a prestige gold issue for mercenary pay; the later Rosenobel coinage 1627 + 1629 falls within the start of Danish involvement in the Thirty Years' War (Imperial-Danish War 1625-1629)."
  uk: "<b>Historyofwar.org «Kalmar War, 1611-1613»</b> — <a href=\"https://www.historyofwar.org/articles/wars_kalmar.html\" target=\"_blank\">historyofwar.org/articles/wars_kalmar.html</a>. Фонова синтеза війни між Данією-Норвегією та Швецією 1611-1613. Christian IV нападає на Швецію 1611 р. з головною метою примусити Швецію повернутися до Кальмарської унії — мети не досягнуто, але за договором Knäred 1613 Швеція виплачує військову контрибуцію в <b>1 мільйон срібних riksdaler</b> (так званий Älvsborg-викуп). Воєнно-фінансовий тиск 1611-1613 пояснює карбування Rosenobler Кристіана IV (Hede 23A) як престижної золотої емісії для оплати найманцям; пізніше карбування Rosenobel 1627 + 1629 припадає на початок данської участі у Тридцятилітній війні (Імперсько-данська війна 1625-1629)."
  da: '<b>Historyofwar.org «Kalmar War, 1611-1613»</b> — <a href="https://www.historyofwar.org/articles/wars_kalmar.html" target="_blank">historyofwar.org/articles/wars_kalmar.html</a>. Baggrundsfremstilling af krigen mellem Danmark-Norge og Sverige 1611-1613. Christian 4. angreb Sverige i 1611 med det hovedformål at tvinge landet tilbage i Kalmarunionen — formålet blev ikke nået, men ved freden i Knærød 1613 betalte Sverige en krigsskadeserstatning på <b>1 million rigsdaler sølv</b> (Älvsborgs løsepenge). Behovet for krigsfinansiering i årene 1611-1613 forklarer møntningen af Christian 4.s rosenobler (Hede 23A) som en prestigeguldudmøntning til betaling af lejetropper; den senere rosenobelmøntning 1627 + 1629 falder sammen med begyndelsen på Danmarks deltagelse i Trediveårskrigen (Kejserkrigen 1625-1629).'

frantzen-bender-nordiske-syvaarskrig:
  de: "<b>Frantzen, Ole L.</b> / <b>Bender Jørgensen, Lise</b>: <i>Den Nordiske Syvårskrig 1563-1570</i> (Historieforskning, mit Aufsatzbänden in Den Danske Krigshistorie). Hauptkonflikt zwischen Dänemark-Norwegen + Lübeck + Polen vs Schweden 1563-1570 — «<i>den største krise i Frederik II.s regering</i>» («the greatest crisis of Frederik II's reign») per dänischer Historiographie. Direkter wirtschaftlicher Kontext für die Karbung der Klipping-Goldmünzen Frederiks II. 1563-1564: massive Kriegsfinanzierungs-Notwendigkeit erzwingt die parallele Karbung dreier Goldarten (Ungersk + Rhinsk + Krone) in Kopenhagen + Bremerholm. Siehe auch Historyofwar.org «<a href=\"https://www.historyofwar.org/articles/wars_nordic_seven_years.html\" target=\"_blank\">Nordic Seven Years War, 1563-1570</a>» für englischsprachige Synthese der Kriegsverlauf und Finanzierungs-Probleme der dänischen Söldnerarmee."
  en: "<b>Frantzen, Ole L.</b> / <b>Bender Jørgensen, Lise</b>: <i>Den Nordiske Syvårskrig 1563-1570</i> (Danish historical research, with essays in <i>Den Danske Krigshistorie</i>). The main conflict between Denmark-Norway + Lübeck + Poland against Sweden in 1563-1570 — «<i>den største krise i Frederik II's regering</i>» («the greatest crisis of Frederik II's reign») per Danish historiography. Direct economic context for the minting of Frederik II's 1563-1564 Klipping gold coins: massive wartime-financing pressure forced the parallel coining of three gold types (Ungersk + Rhinsk + Krone) at Copenhagen + Bremerholm. See also Historyofwar.org «<a href=\"https://www.historyofwar.org/articles/wars_nordic_seven_years.html\" target=\"_blank\">Nordic Seven Years War, 1563-1570</a>» for an English-language synthesis of the war's course and the Danish mercenary-army financing crisis."
  uk: "<b>Frantzen, Ole L.</b> / <b>Bender Jørgensen, Lise</b>: <i>Den Nordiske Syvårskrig 1563-1570</i> (данська історична розвідка, з нарисами у <i>Den Danske Krigshistorie</i>). Головний конфлікт між Данією-Норвегією + Любеком + Польщею проти Швеції 1563-1570 — «<i>den største krise i Frederik II's regering</i>» («найбільша криза у правлінні Фредеріка II») за данською історіографією. Прямий економічний контекст для карбування Klipping-золотих монет Frederik II 1563-1564: масивна воєнно-фінансова потреба змушує до паралельного карбування трьох золотих типів (Ungersk + Rhinsk + Krone) у Копенгагені + Bremerholm. Див. також Historyofwar.org «<a href=\"https://www.historyofwar.org/articles/wars_nordic_seven_years.html\" target=\"_blank\">Nordic Seven Years War, 1563-1570</a>» — англомовна синтеза перебігу війни та фінансової кризи данської найманської армії."
  da: '<b>Frantzen, Ole L.</b> / <b>Bender Jørgensen, Lise</b>: <i>Den Nordiske Syvårskrig 1563-1570</i> (historisk forskning, med bidrag i Den Danske Krigshistorie). Hovedkonflikten mellem Danmark-Norge + Lübeck + Polen og Sverige 1563-1570 — i dansk historieskrivning «<i>den største krise i Frederik II.s regering</i>». Den direkte økonomiske ramme om møntningen af Frederik 2.s guldklippinge 1563-1564: det store behov for krigsfinansiering fremtvang den parallelle møntning af tre guldarter (Ungersk + Rhinsk + Krone) i København og på Bremerholm. Se også Historyofwar.org «<a href="https://www.historyofwar.org/articles/wars_nordic_seven_years.html" target="_blank">Nordic Seven Years War, 1563-1570</a>» for en engelsksproget fremstilling af krigens forløb og den danske lejehærs finansieringsproblemer.'

danskmoent-1rhinsk-gylden:
  de: "<b>danskmoent.dk «1 Rhinsk Gylden»</b> — <a href=\"https://www.danskmoent.dk/1rhingyl.htm\" target=\"_blank\">danskmoent.dk/1rhingyl.htm</a>. Hede-Übersichtsseite für die dänischen Rhinsk-Gylden-Goldmünzen: Frederik II 1563-1564 (Hede f2h3, f2h6) und Christian IV 1625-1632 (Hede c4h29). Belegt 72-Stück-aus-der-Marck-Standard bei .77 (Phase I) / .76 (Phase II)."
  en: "<b>danskmoent.dk «1 Rhinsk Gylden»</b> — <a href=\"https://www.danskmoent.dk/1rhingyl.htm\" target=\"_blank\">danskmoent.dk/1rhingyl.htm</a>. Hede overview page for the Danish Rhinsk-Gylden gold coins: Frederik II 1563-1564 (Hede f2h3, f2h6) and Christian IV 1625-1632 (Hede c4h29). Attests the 72-pieces-per-mark standard at .77 (Phase I) / .76 (Phase II)."
  uk: "<b>danskmoent.dk «1 Rhinsk Gylden»</b> — <a href=\"https://www.danskmoent.dk/1rhingyl.htm\" target=\"_blank\">danskmoent.dk/1rhingyl.htm</a>. Hede-оглядова сторінка для данських Rhinsk-Gylden золотих монет: Frederik II 1563-1564 (Hede f2h3, f2h6) і Christian IV 1625-1632 (Hede c4h29). Підтверджує стандарт 72 штук з марки за пробою .77 (фаза I) / .76 (фаза II)."
  da: '<b>danskmoent.dk «1 Rhinsk Gylden»</b> — <a href="https://www.danskmoent.dk/1rhingyl.htm" target="_blank">danskmoent.dk/1rhingyl.htm</a>. Hede-oversigtsside for de danske rhinske gylden i guld: Frederik 2. 1563-1564 (Hede f2h3, f2h6) og Christian 4. 1625-1632 (Hede c4h29). Dokumenterer standarden på 72 stykker af marcken ved .77 (fase I) og .76 (fase II).'

danskmoent-c3-rhinsk-gylden-1546:
  de: "<b>danskmoent.dk «Christian 3., Galster 130»</b> — <a href=\"https://www.danskmoent.dk/chr/c3h15.htm\" target=\"_blank\">danskmoent.dk/chr/c3h15.htm</a>. Christian III, 1 und 2 Goldgulden, 1546, Flensborg (Zuschreibung nach Reynold Junges Müntzzeichen). Verbatim: «<i>1 Rhinsk gylden (unik) … Bruttovægt: 3,278g Finhed: 0,750</i>». Quelle: NFM XII, S. 10."
  en: "<b>danskmoent.dk «Christian 3., Galster 130»</b> — <a href=\"https://www.danskmoent.dk/chr/c3h15.htm\" target=\"_blank\">danskmoent.dk/chr/c3h15.htm</a>. Christian III, 1 and 2 Goldgulden, 1546, Flensburg (attributed to Flensburg by Reynold Junge's mintmark). Verbatim: «<i>1 Rhinsk gylden (unik) … Bruttovægt: 3,278g Finhed: 0,750</i>». Source: NFM XII, p. 10."
  uk: "<b>danskmoent.dk «Christian 3., Galster 130»</b> — <a href=\"https://www.danskmoent.dk/chr/c3h15.htm\" target=\"_blank\">danskmoent.dk/chr/c3h15.htm</a>. Christian III, 1 та 2 Goldgulden, 1546, Flensborg (атрибуція за монетним знаком Reynold Junge). Verbatim: «<i>1 Rhinsk gylden (unik) … Bruttovægt: 3,278g Finhed: 0,750</i>». Джерело: NFM XII, с. 10."
  da: '<b>danskmoent.dk «Christian 3., Galster 130»</b> — <a href="https://www.danskmoent.dk/chr/c3h15.htm" target="_blank">danskmoent.dk/chr/c3h15.htm</a>. Christian 3., 1 og 2 guldgylden, 1546, Flensborg (tilskrivningen bygger på Reynold Junges møntmærke). Ordret: «<i>1 Rhinsk gylden (unik) … Bruttovægt: 3,278g Finhed: 0,750</i>». Kilde: NFM XII, s. 10.'

danskmoent-1krone:
  de: "<b>danskmoent.dk</b>: <i>1 Krone / 4 Mark</i> — <a href=\"https://www.danskmoent.dk/1krone.htm\" target=\"_blank\">danskmoent.dk/1krone.htm</a>. Übersicht aller dänischen Krone-Varianten mit Hede/Schou/Sieg-Numerierung; dokumentiert Koexistenz von Kopenhagen- und Glückstadt-Prägungen."
  en: "<b>danskmoent.dk</b>: <i>1 Krone / 4 Mark</i> — <a href=\"https://www.danskmoent.dk/1krone.htm\" target=\"_blank\">danskmoent.dk/1krone.htm</a>. Overview of all Danish Krone varieties with Hede/Schou/Sieg numbering; documents the coexistence of Copenhagen and Glückstadt issues."
  uk: "<b>danskmoent.dk</b>: <i>1 Krone / 4 Mark</i> — <a href=\"https://www.danskmoent.dk/1krone.htm\" target=\"_blank\">danskmoent.dk/1krone.htm</a>. Огляд усіх данських Krone-різновидів за нумерацією Hede/Schou/Sieg; задокументоване співіснування копенгагенських і ґлюкштадтських випусків."
  da: '<b>danskmoent.dk</b>: <i>1 Krone / 4 Mark</i> — <a href="https://www.danskmoent.dk/1krone.htm" target="_blank">danskmoent.dk/1krone.htm</a>. Oversigt over alle danske kronevarianter med Hede/Schou/Sieg-numre; dokumenterer, at københavnske og glückstadtske præg forekommer side om side.'

archive-worterbuchdermun007491mbp:
  de: "<b>Schrötter, Friedrich Frhr. v.</b> (Hg.): <i>Wörterbuch der Münzkunde</i> (Berlin: Walter de Gruyter, 1930), Eintrag «Corona Danica», S. 113–114 — <a href=\"https://archive.org/details/worterbuchdermun007491mbp\" target=\"_blank\">archive.org/details/worterbuchdermun007491mbp</a>. Primärquelle für die Christian-IV.-Krone-Parameter und den Tarif-Schnitt 1625."
  en: "<b>Schrötter, Friedrich Frhr. v.</b> (ed.): <i>Wörterbuch der Münzkunde</i> (Berlin: Walter de Gruyter, 1930), entry «Corona Danica», pp. 113–114 — <a href=\"https://archive.org/details/worterbuchdermun007491mbp\" target=\"_blank\">archive.org/details/worterbuchdermun007491mbp</a>. Primary source for the Christian IV Krone parameters and the 1625 tariff cut."
  uk: "<b>Schrötter, Friedrich Frhr. v.</b> (ред.): <i>Wörterbuch der Münzkunde</i> (Берлін: Walter de Gruyter, 1930), стаття «Corona Danica», с. 113–114 — <a href=\"https://archive.org/details/worterbuchdermun007491mbp\" target=\"_blank\">archive.org/details/worterbuchdermun007491mbp</a>. Першоджерело параметрів Krone Кристіана IV та дати зниження тарифу 1625."
  da: '<b>Schrötter, Friedrich Frhr. v.</b> (udg.): <i>Wörterbuch der Münzkunde</i> (Berlin: Walter de Gruyter, 1930), opslaget «Corona Danica», s. 113–114 — <a href="https://archive.org/details/worterbuchdermun007491mbp" target="_blank">archive.org/details/worterbuchdermun007491mbp</a>. Primærkilde til parametrene for Christian 4.s krone og til tarifskiftet 1625.'

danskmoent-hedekron:
  de: "<b>Hede, Holger</b>: <i>Kronemønten 1618–1771</i>, NNUM 1957, S. 129–134 — <a href=\"https://danskmoent.dk/artikler/hedekron.htm\" target=\"_blank\">danskmoent.dk/artikler/hedekron.htm</a>. Kanonische Werte der drei dänischen Krone-Münzformeln (1618, 1671, 1693) auf Grundlage von Wilcke I/II."
  en: "<b>Hede, Holger</b>: <i>Kronemønten 1618–1771</i>, NNUM 1957, pp. 129–134 — <a href=\"https://danskmoent.dk/artikler/hedekron.htm\" target=\"_blank\">danskmoent.dk/artikler/hedekron.htm</a>. Canonical values for the three Danish Krone standards (1618, 1671, 1693), drawing on Wilcke I/II."
  uk: "<b>Hede, Holger</b>: <i>Kronemønten 1618–1771</i>, NNUM 1957, с. 129–134 — <a href=\"https://danskmoent.dk/artikler/hedekron.htm\" target=\"_blank\">danskmoent.dk/artikler/hedekron.htm</a>. Канонічні значення трьох данських Krone-стандартів (1618, 1671, 1693) за Wilcke I/II."
  da: '<b>Hede, Holger</b>: <i>Kronemønten 1618–1771</i>, NNUM 1957, s. 129–134 — <a href="https://danskmoent.dk/artikler/hedekron.htm" target="_blank">danskmoent.dk/artikler/hedekron.htm</a>. De kanoniske værdier for de tre danske kroneformler (1618, 1671, 1693) på grundlag af Wilcke I/II.'

natmus-christian-4s-svindler-moent-fylder-400-aar:
  de: "<b>Nationalmuseet</b> (Kopenhagen): <i>Christian 4.s svindler-mønt fylder 400 år</i> — <a href=\"https://natmus.dk/webdok/christian-4s-svindler-moent-fylder-400-aar/\" target=\"_blank\">natmus.dk/webdok/christian-4s-svindler-moent-fylder-400-aar</a>. Beleg für die Auflösung «R.F.P» = «regna firmat pietas» und die Volksumdeutung «riget fattes penge» auf der Krone-Münze."
  en: "<b>Nationalmuseet</b> (Copenhagen): <i>Christian 4.s svindler-mønt fylder 400 år</i> — <a href=\"https://natmus.dk/webdok/christian-4s-svindler-moent-fylder-400-aar/\" target=\"_blank\">natmus.dk/webdok/christian-4s-svindler-moent-fylder-400-aar</a>. Source for the «R.F.P» = «regna firmat pietas» abbreviation and the popular reread «riget fattes penge» on the Krone coin."
  uk: "<b>Nationalmuseet</b> (Копенгаген): <i>Christian 4.s svindler-mønt fylder 400 år</i> — <a href=\"https://natmus.dk/webdok/christian-4s-svindler-moent-fylder-400-aar/\" target=\"_blank\">natmus.dk/webdok/christian-4s-svindler-moent-fylder-400-aar</a>. Джерело розшифрування «R.F.P» = «regna firmat pietas» та народної переінтерпретації «riget fattes penge» на Krone-монеті."
  da: '<b>Nationalmuseet</b> (København): <i>Christian 4.s svindler-mønt fylder 400 år</i> — <a href="https://natmus.dk/webdok/christian-4s-svindler-moent-fylder-400-aar/" target="_blank">natmus.dk/webdok/christian-4s-svindler-moent-fylder-400-aar</a>. Belæg for opløsningen «R.F.P» = «regna firmat pietas» og for folkeudlægningen «riget fattes penge» på kronemønten.'

danskmoent-c5mord:
  de: "<i>Møntforordninger m.v. under Christian 5. (1670–1699)</i> · danskmoent.dk (nach Schou) — <a href=\"https://www.danskmoent.dk/artikler/c5mord.htm\" target=\"_blank\">danskmoent.dk/artikler/c5mord.htm</a>. Sammlung der Münzedikte Christians V., einschließlich der Myndt-Ordning af 22. marts 1671 (10½-Krone-Fuß) und Reskript 31. Dezember 1692."
  en: "<i>Møntforordninger m.v. under Christian 5. (1670–1699)</i> · danskmoent.dk (after Schou) — <a href=\"https://www.danskmoent.dk/artikler/c5mord.htm\" target=\"_blank\">danskmoent.dk/artikler/c5mord.htm</a>. Compilation of Christian V's mint edicts including the Mint Ordinance of 22 March 1671 (10½-Krone-Fuß) and the rescript of 31 December 1692."
  uk: "<i>Møntforordninger m.v. under Christian 5. (1670–1699)</i> · danskmoent.dk (за Schou) — <a href=\"https://www.danskmoent.dk/artikler/c5mord.htm\" target=\"_blank\">danskmoent.dk/artikler/c5mord.htm</a>. Зведення монетних едиктів Кристіана V, у т.ч. Монетної постанови 22 березня 1671 (10½-Krone-Fuß) та рескрипту 31 грудня 1692."
  da: '<i>Møntforordninger m.v. under Christian 5. (1670–1699)</i> · danskmoent.dk (efter Schou) — <a href="https://www.danskmoent.dk/artikler/c5mord.htm" target="_blank">danskmoent.dk/artikler/c5mord.htm</a>. Samling af Christian 5.s møntanordninger, heriblandt Myndt-Ordning af 22. marts 1671 (10½-kronefoden) og reskriptet af 31. december 1692.'

danskmoent-aag1:
  de: "<b>Aagaard, Sven</b>: <i>Beskrivelse af Christian IV's hebræermønter 1644–1648</i> — danskmoent.dk: <a href=\"https://www.danskmoent.dk/myst/aag1.htm\" target=\"_blank\">danskmoent.dk/myst/aag1.htm</a>. Quelle für die Glückstädter Hebræermønt 1644–1648 als Kriegsmünze während des Torstensonkrieges."
  en: "<b>Aagaard, Sven</b>: <i>Beskrivelse af Christian IV's hebræermønter 1644–1648</i> — danskmoent.dk: <a href=\"https://www.danskmoent.dk/myst/aag1.htm\" target=\"_blank\">danskmoent.dk/myst/aag1.htm</a>. Source for the Glückstadt Hebræermønt 1644–1648 as war coinage during the Torstenson War."
  uk: "<b>Aagaard, Sven</b>: <i>Beskrivelse af Christian IV's hebræermønter 1644–1648</i> — danskmoent.dk: <a href=\"https://www.danskmoent.dk/myst/aag1.htm\" target=\"_blank\">danskmoent.dk/myst/aag1.htm</a>. Джерело про Hebræermønt Glückstadt 1644–1648 як воєнну монету часів війни Торстенсона."
  da: '<b>Aagaard, Sven</b>: <i>Beskrivelse af Christian IV''s hebræermønter 1644–1648</i> — danskmoent.dk: <a href="https://www.danskmoent.dk/myst/aag1.htm" target="_blank">danskmoent.dk/myst/aag1.htm</a>. Kilde til den glückstadtske hebræermønt 1644–1648 som krigsmønt under Torstenssonkrigen.'

danskmoent-w2ref:
  de: '<b>Wilcke, Julius</b>: <i>Møntvæsenet under Christian IV og Frederik III 1625–1670</i> (Numismatisk Forenings Medlemsblad; København 1924), Kap. I «Tidsrummet 1588–1625» (S. 11–46) — <a href="https://www.danskmoent.dk/wilcke/w2ref.htm" target="_blank">danskmoent.dk/wilcke/w2ref.htm</a>. Wilckes zweiter Band; Kap. I faßt die Münzpolitik Christians IV. biß 1625 zusammen.'
  en: "<b>Wilcke, Julius</b>: <i>Møntvæsenet under Christian IV og Frederik III 1625–1670</i> (Numismatisk Forenings Medlemsblad; Copenhagen 1924), ch. I «Tidsrummet 1588–1625» (pp. 11–46) — <a href=\"https://www.danskmoent.dk/wilcke/w2ref.htm\" target=\"_blank\">danskmoent.dk/wilcke/w2ref.htm</a>. Wilcke's second volume; ch. I summarises Christian IV's coinage policy up to 1625."
  uk: '<b>Wilcke, Julius</b>: <i>Møntvæsenet under Christian IV og Frederik III 1625–1670</i> (Numismatisk Forenings Medlemsblad; Копенгаген 1924), розд. I «Tidsrummet 1588–1625» (с. 11–46) — <a href="https://www.danskmoent.dk/wilcke/w2ref.htm" target="_blank">danskmoent.dk/wilcke/w2ref.htm</a>. Другий том Wilcke; розд. I підсумовує монетну політику Кристіана IV до 1625 р.'
  da: '<b>Wilcke, Julius</b>: <i>Møntvæsenet under Christian IV og Frederik III 1625–1670</i> (Numismatisk Forenings Medlemsblad; København 1924), kap. I «Tidsrummet 1588–1625» (s. 11–46) — <a href="https://www.danskmoent.dk/wilcke/w2ref.htm" target="_blank">danskmoent.dk/wilcke/w2ref.htm</a>. Wilckes andet bind; kap. I sammenfatter Christian 4.s møntpolitik frem til 1625.'

wilcke-1924-kap1-anm53:
  de: '<b>Wilcke, Julius</b>: <i>Møntvæsenet under Christian IV og Frederik III 1625–1670</i> (Numismatisk Forenings Medlemsblad; København 1924), Kap. I «Tidsrummet 1588–1625» (S. 11–46), Text zu Anm. 53 — <a href="https://www.danskmoent.dk/wilcke/w2ref.htm" target="_blank">danskmoent.dk/wilcke/w2ref.htm</a>. «<i>afløstes af ¾-Specien, den saakaldte Halvkrone og 1½-Specien, den saakaldte „corona danica“</i>».'
  en: '<b>Wilcke, Julius</b>: <i>Møntvæsenet under Christian IV og Frederik III 1625–1670</i> (Numismatisk Forenings Medlemsblad; Copenhagen 1924), ch. I «Tidsrummet 1588–1625» (pp. 11–46), text at note 53 — <a href="https://www.danskmoent.dk/wilcke/w2ref.htm" target="_blank">danskmoent.dk/wilcke/w2ref.htm</a>. «<i>afløstes af ¾-Specien, den saakaldte Halvkrone og 1½-Specien, den saakaldte „corona danica“</i>».'
  uk: '<b>Wilcke, Julius</b>: <i>Møntvæsenet under Christian IV og Frederik III 1625–1670</i> (Numismatisk Forenings Medlemsblad; Копенгаген 1924), розд. I «Tidsrummet 1588–1625» (с. 11–46), текст до прим. 53 — <a href="https://www.danskmoent.dk/wilcke/w2ref.htm" target="_blank">danskmoent.dk/wilcke/w2ref.htm</a>. «<i>afløstes af ¾-Specien, den saakaldte Halvkrone og 1½-Specien, den saakaldte „corona danica“</i>».'
  da: '<b>Wilcke, Julius</b>: <i>Møntvæsenet under Christian IV og Frederik III 1625–1670</i> (Numismatisk Forenings Medlemsblad; København 1924), kap. I «Tidsrummet 1588–1625» (s. 11–46), teksten til note 53 — <a href="https://www.danskmoent.dk/wilcke/w2ref.htm" target="_blank">danskmoent.dk/wilcke/w2ref.htm</a>. «<i>afløstes af ¾-Specien, den saakaldte Halvkrone og 1½-Specien, den saakaldte „corona danica“</i>».'

wilcke-1919-kronefod-tabel:
  de: "<b>Wilcke, Julius</b>: <i>Christian IV's Møntpolitik 1588–1625</i> (Numismatisk Forenings Medlemsblad II; København: J. H. Schultz' Universitetsbogtrykkeri, 1919), S. 152 — <a href=\"https://www.danskmoent.dk/pdf2/Wilcke_1.pdf\" target=\"_blank\">danskmoent.dk/pdf2/Wilcke_1.pdf</a>. «<i>Sølv Krone = 1½ Rdlr. … 37,819 … 32,500 · ½ Krone = ¾ Rdlr. … 18,766 … 16,127</i>». Tabelle der Kronemønt 1618 (Jørgensen Nr. 104–108): Tarif, Stück je Marck, Lødighed, Ausbringung, Brutto- und Feingewicht."
  en: "<b>Wilcke, Julius</b>: <i>Christian IV's Møntpolitik 1588–1625</i> (Numismatisk Forenings Medlemsblad II; Copenhagen: J. H. Schultz' Universitetsbogtrykkeri, 1919), p. 152 — <a href=\"https://www.danskmoent.dk/pdf2/Wilcke_1.pdf\" target=\"_blank\">danskmoent.dk/pdf2/Wilcke_1.pdf</a>. «<i>Sølv Krone = 1½ Rdlr. … 37,819 … 32,500 · ½ Krone = ¾ Rdlr. … 18,766 … 16,127</i>». Table of the 1618 kronemønt (Jørgensen nos. 104–108): tariff, pieces per mark, fineness, daler yield, gross and fine weight."
  uk: "<b>Wilcke, Julius</b>: <i>Christian IV's Møntpolitik 1588–1625</i> (Numismatisk Forenings Medlemsblad II; Копенгаген: J. H. Schultz' Universitetsbogtrykkeri, 1919), с. 152 — <a href=\"https://www.danskmoent.dk/pdf2/Wilcke_1.pdf\" target=\"_blank\">danskmoent.dk/pdf2/Wilcke_1.pdf</a>. «<i>Sølv Krone = 1½ Rdlr. … 37,819 … 32,500 · ½ Krone = ¾ Rdlr. … 18,766 … 16,127</i>». Таблиця kronemønt 1618 р. (Jørgensen № 104–108): тариф, штук з марки, проба, вихід у далерах, повна і чиста вага."
  da: "<b>Wilcke, Julius</b>: <i>Christian IV's Møntpolitik 1588–1625</i> (Numismatisk Forenings Medlemsblad II; København: J. H. Schultz' Universitetsbogtrykkeri, 1919), s. 152 — <a href=\"https://www.danskmoent.dk/pdf2/Wilcke_1.pdf\" target=\"_blank\">danskmoent.dk/pdf2/Wilcke_1.pdf</a>. «<i>Sølv Krone = 1½ Rdlr. … 37,819 … 32,500 · ½ Krone = ¾ Rdlr. … 18,766 … 16,127</i>». Tabel over kronemønten 1618 (Jørgensen nr. 104–108): tarif, stykker pr. mark, lødighed, udbringning, brutto- og finvægt."

wilcke-1919-patent-12-juli-1618:
  de: "<b>Wilcke, Julius</b>: <i>Christian IV's Møntpolitik 1588–1625</i> (Numismatisk Forenings Medlemsblad II; København: J. H. Schultz' Universitetsbogtrykkeri, 1919), S. 155–156 — <a href=\"https://www.danskmoent.dk/pdf2/Wilcke_1.pdf\" target=\"_blank\">danskmoent.dk/pdf2/Wilcke_1.pdf</a>. «<i>samme danske kroner geilde … saa høigt … som halfanden rigsdaller in specie … som nu belöber hundrede sex och tiufve skilling danske</i>». Wortlaut von § 1 und der Präambel des åbne Brev af 12. juli 1618 om ny Mønt."
  en: "<b>Wilcke, Julius</b>: <i>Christian IV's Møntpolitik 1588–1625</i> (Numismatisk Forenings Medlemsblad II; Copenhagen: J. H. Schultz' Universitetsbogtrykkeri, 1919), p. 155–156 — <a href=\"https://www.danskmoent.dk/pdf2/Wilcke_1.pdf\" target=\"_blank\">danskmoent.dk/pdf2/Wilcke_1.pdf</a>. «<i>samme danske kroner geilde … saa høigt … som halfanden rigsdaller in specie … som nu belöber hundrede sex och tiufve skilling danske</i>». Wording of § 1 and the preamble of the åbne Brev af 12. juli 1618 om ny Mønt."
  uk: "<b>Wilcke, Julius</b>: <i>Christian IV's Møntpolitik 1588–1625</i> (Numismatisk Forenings Medlemsblad II; Копенгаген: J. H. Schultz' Universitetsbogtrykkeri, 1919), с. 155–156 — <a href=\"https://www.danskmoent.dk/pdf2/Wilcke_1.pdf\" target=\"_blank\">danskmoent.dk/pdf2/Wilcke_1.pdf</a>. «<i>samme danske kroner geilde … saa høigt … som halfanden rigsdaller in specie … som nu belöber hundrede sex och tiufve skilling danske</i>». Текст § 1 і преамбули åbne Brev af 12. juli 1618 om ny Mønt."
  da: "<b>Wilcke, Julius</b>: <i>Christian IV's Møntpolitik 1588–1625</i> (Numismatisk Forenings Medlemsblad II; København: J. H. Schultz' Universitetsbogtrykkeri, 1919), s. 155–156 — <a href=\"https://www.danskmoent.dk/pdf2/Wilcke_1.pdf\" target=\"_blank\">danskmoent.dk/pdf2/Wilcke_1.pdf</a>. «<i>samme danske kroner geilde … saa høigt … som halfanden rigsdaller in specie … som nu belöber hundrede sex och tiufve skilling danske</i>». Ordlyden af § 1 og indledningen til det åbne Brev af 12. juli 1618 om ny Mønt."

wilcke-1919-tarifkaede-1618:
  de: "<b>Wilcke, Julius</b>: <i>Christian IV's Møntpolitik 1588–1625</i> (Numismatisk Forenings Medlemsblad II; København: J. H. Schultz' Universitetsbogtrykkeri, 1919), S. 157 — <a href=\"https://www.danskmoent.dk/pdf2/Wilcke_1.pdf\" target=\"_blank\">danskmoent.dk/pdf2/Wilcke_1.pdf</a>. «<i>var Marken sat til 20 ß, Daleren til 84 ß. Det vil sige, at Kronen som 1½ Daler = 126 ß var lig 6⁶⁄₂₀ ℳ</i>». Tarifkette der Forordning af 1. maj 1618 und Wilckes Silberprobe: 6³⁄₁₀ Marck = 32,400 g gegen 32,500 g der Krone."
  en: "<b>Wilcke, Julius</b>: <i>Christian IV's Møntpolitik 1588–1625</i> (Numismatisk Forenings Medlemsblad II; Copenhagen: J. H. Schultz' Universitetsbogtrykkeri, 1919), p. 157 — <a href=\"https://www.danskmoent.dk/pdf2/Wilcke_1.pdf\" target=\"_blank\">danskmoent.dk/pdf2/Wilcke_1.pdf</a>. «<i>var Marken sat til 20 ß, Daleren til 84 ß. Det vil sige, at Kronen som 1½ Daler = 126 ß var lig 6⁶⁄₂₀ ℳ</i>». Tariff chain of the Forordning af 1. maj 1618 and Wilcke's silver check: 6³⁄₁₀ marks = 32.400 g against the krone's 32.500 g."
  uk: "<b>Wilcke, Julius</b>: <i>Christian IV's Møntpolitik 1588–1625</i> (Numismatisk Forenings Medlemsblad II; Копенгаген: J. H. Schultz' Universitetsbogtrykkeri, 1919), с. 157 — <a href=\"https://www.danskmoent.dk/pdf2/Wilcke_1.pdf\" target=\"_blank\">danskmoent.dk/pdf2/Wilcke_1.pdf</a>. «<i>var Marken sat til 20 ß, Daleren til 84 ß. Det vil sige, at Kronen som 1½ Daler = 126 ß var lig 6⁶⁄₂₀ ℳ</i>». Тарифний ланцюг Forordning af 1. maj 1618 і перевірка срібла у Wilcke: 6³⁄₁₀ марки = 32,400 г проти 32,500 г крони."
  da: "<b>Wilcke, Julius</b>: <i>Christian IV's Møntpolitik 1588–1625</i> (Numismatisk Forenings Medlemsblad II; København: J. H. Schultz' Universitetsbogtrykkeri, 1919), s. 157 — <a href=\"https://www.danskmoent.dk/pdf2/Wilcke_1.pdf\" target=\"_blank\">danskmoent.dk/pdf2/Wilcke_1.pdf</a>. «<i>var Marken sat til 20 ß, Daleren til 84 ß. Det vil sige, at Kronen som 1½ Daler = 126 ß var lig 6⁶⁄₂₀ ℳ</i>». Tarifkæden i Forordning af 1. maj 1618 og Wilckes sølvprøve: 6³⁄₁₀ mark = 32,400 g mod kronens 32,500 g."

wilcke-1919-kroneskilling-1619:
  de: "<b>Wilcke, Julius</b>: <i>Christian IV's Møntpolitik 1588–1625</i> (Numismatisk Forenings Medlemsblad II; København: J. H. Schultz' Universitetsbogtrykkeri, 1919), S. 167 — <a href=\"https://www.danskmoent.dk/pdf2/Wilcke_1.pdf\" target=\"_blank\">danskmoent.dk/pdf2/Wilcke_1.pdf</a>. «<i>½ Krone blev lig 3 Marker à 16 Kronskilling = ¾ Specie, ¼ Krone = 1½ Mark = ⅜ Specie</i>». Forordning af 8. april 1619: Teilung der Krone in Rigsmark und Kroneskilling."
  en: "<b>Wilcke, Julius</b>: <i>Christian IV's Møntpolitik 1588–1625</i> (Numismatisk Forenings Medlemsblad II; Copenhagen: J. H. Schultz' Universitetsbogtrykkeri, 1919), p. 167 — <a href=\"https://www.danskmoent.dk/pdf2/Wilcke_1.pdf\" target=\"_blank\">danskmoent.dk/pdf2/Wilcke_1.pdf</a>. «<i>½ Krone blev lig 3 Marker à 16 Kronskilling = ¾ Specie, ¼ Krone = 1½ Mark = ⅜ Specie</i>». Forordning af 8. april 1619: subdivision of the krone into rigsmark and kroneskilling."
  uk: "<b>Wilcke, Julius</b>: <i>Christian IV's Møntpolitik 1588–1625</i> (Numismatisk Forenings Medlemsblad II; Копенгаген: J. H. Schultz' Universitetsbogtrykkeri, 1919), с. 167 — <a href=\"https://www.danskmoent.dk/pdf2/Wilcke_1.pdf\" target=\"_blank\">danskmoent.dk/pdf2/Wilcke_1.pdf</a>. «<i>½ Krone blev lig 3 Marker à 16 Kronskilling = ¾ Specie, ¼ Krone = 1½ Mark = ⅜ Specie</i>». Forordning af 8. april 1619: поділ крони на rigsmark і kroneskilling."
  da: "<b>Wilcke, Julius</b>: <i>Christian IV's Møntpolitik 1588–1625</i> (Numismatisk Forenings Medlemsblad II; København: J. H. Schultz' Universitetsbogtrykkeri, 1919), s. 167 — <a href=\"https://www.danskmoent.dk/pdf2/Wilcke_1.pdf\" target=\"_blank\">danskmoent.dk/pdf2/Wilcke_1.pdf</a>. «<i>½ Krone blev lig 3 Marker à 16 Kronskilling = ¾ Specie, ¼ Krone = 1½ Mark = ⅜ Specie</i>». Forordning af 8. april 1619: kronens deling i rigsmark og kroneskilling."

wilcke-1919-moentordning-14-feb-1624:
  de: "<b>Wilcke, Julius</b>: <i>Christian IV's Møntpolitik 1588–1625</i> (Numismatisk Forenings Medlemsblad II; København: J. H. Schultz' Universitetsbogtrykkeri, 1919), S. 227 — <a href=\"https://www.danskmoent.dk/pdf2/Wilcke_1.pdf\" target=\"_blank\">danskmoent.dk/pdf2/Wilcke_1.pdf</a>. «<i>Ved Møntordningen af 14. Februar 1624 var der gjort det første Indhug i Kronens Stilling, idet Helkronen sattes til 144 ß, Daleren til 100 ß</i>». Møntordning af 14. februar 1624; die Tarifierung «i ca. 7 Aar» zu 1½ und ¾ Rigsdaler in specie."
  en: "<b>Wilcke, Julius</b>: <i>Christian IV's Møntpolitik 1588–1625</i> (Numismatisk Forenings Medlemsblad II; Copenhagen: J. H. Schultz' Universitetsbogtrykkeri, 1919), p. 227 — <a href=\"https://www.danskmoent.dk/pdf2/Wilcke_1.pdf\" target=\"_blank\">danskmoent.dk/pdf2/Wilcke_1.pdf</a>. «<i>Ved Møntordningen af 14. Februar 1624 var der gjort det første Indhug i Kronens Stilling, idet Helkronen sattes til 144 ß, Daleren til 100 ß</i>». Møntordning af 14. februar 1624; the tariff held «i ca. 7 Aar» at 1½ and ¾ rigsdaler in specie."
  uk: "<b>Wilcke, Julius</b>: <i>Christian IV's Møntpolitik 1588–1625</i> (Numismatisk Forenings Medlemsblad II; Копенгаген: J. H. Schultz' Universitetsbogtrykkeri, 1919), с. 227 — <a href=\"https://www.danskmoent.dk/pdf2/Wilcke_1.pdf\" target=\"_blank\">danskmoent.dk/pdf2/Wilcke_1.pdf</a>. «<i>Ved Møntordningen af 14. Februar 1624 var der gjort det første Indhug i Kronens Stilling, idet Helkronen sattes til 144 ß, Daleren til 100 ß</i>». Møntordning af 14. februar 1624; тариф 1½ і ¾ rigsdaler in specie тримався «i ca. 7 Aar»."
  da: "<b>Wilcke, Julius</b>: <i>Christian IV's Møntpolitik 1588–1625</i> (Numismatisk Forenings Medlemsblad II; København: J. H. Schultz' Universitetsbogtrykkeri, 1919), s. 227 — <a href=\"https://www.danskmoent.dk/pdf2/Wilcke_1.pdf\" target=\"_blank\">danskmoent.dk/pdf2/Wilcke_1.pdf</a>. «<i>Ved Møntordningen af 14. Februar 1624 var der gjort det første Indhug i Kronens Stilling, idet Helkronen sattes til 144 ß, Daleren til 100 ß</i>». Møntordning af 14. februar 1624; tariferingen til 1½ og ¾ rigsdaler in specie «i ca. 7 Aar»."

wilcke-1919-rigsraad-betaenkning-1625:
  de: "<b>Wilcke, Julius</b>: <i>Christian IV's Møntpolitik 1588–1625</i> (Numismatisk Forenings Medlemsblad II; København: J. H. Schultz' Universitetsbogtrykkeri, 1919), S. 227–230 — <a href=\"https://www.danskmoent.dk/pdf2/Wilcke_1.pdf\" target=\"_blank\">danskmoent.dk/pdf2/Wilcke_1.pdf</a>. «<i>Rigsraadets Betænkning om Mønten af 15. Februar 1625, afgivet paa Mødet i København</i>». Wortlaut der Stellungnahme des Reichsraths zur Münze."
  en: "<b>Wilcke, Julius</b>: <i>Christian IV's Møntpolitik 1588–1625</i> (Numismatisk Forenings Medlemsblad II; Copenhagen: J. H. Schultz' Universitetsbogtrykkeri, 1919), p. 227–230 — <a href=\"https://www.danskmoent.dk/pdf2/Wilcke_1.pdf\" target=\"_blank\">danskmoent.dk/pdf2/Wilcke_1.pdf</a>. «<i>Rigsraadets Betænkning om Mønten af 15. Februar 1625, afgivet paa Mødet i København</i>». Wording of the Council of the Realm's opinion on the coinage."
  uk: "<b>Wilcke, Julius</b>: <i>Christian IV's Møntpolitik 1588–1625</i> (Numismatisk Forenings Medlemsblad II; Копенгаген: J. H. Schultz' Universitetsbogtrykkeri, 1919), с. 227–230 — <a href=\"https://www.danskmoent.dk/pdf2/Wilcke_1.pdf\" target=\"_blank\">danskmoent.dk/pdf2/Wilcke_1.pdf</a>. «<i>Rigsraadets Betænkning om Mønten af 15. Februar 1625, afgivet paa Mødet i København</i>». Текст висновку Державної ради щодо монети."
  da: "<b>Wilcke, Julius</b>: <i>Christian IV's Møntpolitik 1588–1625</i> (Numismatisk Forenings Medlemsblad II; København: J. H. Schultz' Universitetsbogtrykkeri, 1919), s. 227–230 — <a href=\"https://www.danskmoent.dk/pdf2/Wilcke_1.pdf\" target=\"_blank\">danskmoent.dk/pdf2/Wilcke_1.pdf</a>. «<i>Rigsraadets Betænkning om Mønten af 15. Februar 1625, afgivet paa Mødet i København</i>». Ordlyden af Rigsrådets betænkning om mønten."

wilcke-1919-krone-tab-16-procent:
  de: "<b>Wilcke, Julius</b>: <i>Christian IV's Møntpolitik 1588–1625</i> (Numismatisk Forenings Medlemsblad II; København: J. H. Schultz' Universitetsbogtrykkeri, 1919), S. 231 — <a href=\"https://www.danskmoent.dk/pdf2/Wilcke_1.pdf\" target=\"_blank\">danskmoent.dk/pdf2/Wilcke_1.pdf</a>. «<i>Sammenligner man 1½ Dalers Finvægt: ca. 38,5 gr. med 1 Krones: 32,5 gr., er Tabet … ca. 16 %</i>». Verlust beim Annehmen der Krone für 1½ Daler; mit Umprägungskosten nach Wilcke «20 % sikkert ikke for højt anslaaet»."
  en: "<b>Wilcke, Julius</b>: <i>Christian IV's Møntpolitik 1588–1625</i> (Numismatisk Forenings Medlemsblad II; Copenhagen: J. H. Schultz' Universitetsbogtrykkeri, 1919), p. 231 — <a href=\"https://www.danskmoent.dk/pdf2/Wilcke_1.pdf\" target=\"_blank\">danskmoent.dk/pdf2/Wilcke_1.pdf</a>. «<i>Sammenligner man 1½ Dalers Finvægt: ca. 38,5 gr. med 1 Krones: 32,5 gr., er Tabet … ca. 16 %</i>». Loss on accepting the krone for 1½ daler; with recoining costs, per Wilcke, «20 % sikkert ikke for højt anslaaet»."
  uk: "<b>Wilcke, Julius</b>: <i>Christian IV's Møntpolitik 1588–1625</i> (Numismatisk Forenings Medlemsblad II; Копенгаген: J. H. Schultz' Universitetsbogtrykkeri, 1919), с. 231 — <a href=\"https://www.danskmoent.dk/pdf2/Wilcke_1.pdf\" target=\"_blank\">danskmoent.dk/pdf2/Wilcke_1.pdf</a>. «<i>Sammenligner man 1½ Dalers Finvægt: ca. 38,5 gr. med 1 Krones: 32,5 gr., er Tabet … ca. 16 %</i>». Втрата при прийнятті крони за 1½ далера; з витратами на перекарбування, за Wilcke, «20 % sikkert ikke for højt anslaaet»."
  da: "<b>Wilcke, Julius</b>: <i>Christian IV's Møntpolitik 1588–1625</i> (Numismatisk Forenings Medlemsblad II; København: J. H. Schultz' Universitetsbogtrykkeri, 1919), s. 231 — <a href=\"https://www.danskmoent.dk/pdf2/Wilcke_1.pdf\" target=\"_blank\">danskmoent.dk/pdf2/Wilcke_1.pdf</a>. «<i>Sammenligner man 1½ Dalers Finvægt: ca. 38,5 gr. med 1 Krones: 32,5 gr., er Tabet … ca. 16 %</i>». Tabet ved at modtage kronen for 1½ daler; med omprægningsomkostninger efter Wilcke «20 % sikkert ikke for højt anslaaet»."

wilcke-1919-forordning-4-maj-1625:
  de: "<b>Wilcke, Julius</b>: <i>Christian IV's Møntpolitik 1588–1625</i> (Numismatisk Forenings Medlemsblad II; København: J. H. Schultz' Universitetsbogtrykkeri, 1919), S. 231–232 — <a href=\"https://www.danskmoent.dk/pdf2/Wilcke_1.pdf\" target=\"_blank\">danskmoent.dk/pdf2/Wilcke_1.pdf</a>. «<i>ophørte Udmøntningen af Kronemønt med Sommeren 1625, og samtidig udstedtes Forordning om Mønten af 4. Maj 1625</i>». Einstellung der Kronenprägung; Rigsdaler zu 96 ß, Krone zu 128 ß, Halbkrone zu 64 ß."
  en: "<b>Wilcke, Julius</b>: <i>Christian IV's Møntpolitik 1588–1625</i> (Numismatisk Forenings Medlemsblad II; Copenhagen: J. H. Schultz' Universitetsbogtrykkeri, 1919), p. 231–232 — <a href=\"https://www.danskmoent.dk/pdf2/Wilcke_1.pdf\" target=\"_blank\">danskmoent.dk/pdf2/Wilcke_1.pdf</a>. «<i>ophørte Udmøntningen af Kronemønt med Sommeren 1625, og samtidig udstedtes Forordning om Mønten af 4. Maj 1625</i>». End of krone minting; rigsdaler at 96 ß, krone at 128 ß, half krone at 64 ß."
  uk: "<b>Wilcke, Julius</b>: <i>Christian IV's Møntpolitik 1588–1625</i> (Numismatisk Forenings Medlemsblad II; Копенгаген: J. H. Schultz' Universitetsbogtrykkeri, 1919), с. 231–232 — <a href=\"https://www.danskmoent.dk/pdf2/Wilcke_1.pdf\" target=\"_blank\">danskmoent.dk/pdf2/Wilcke_1.pdf</a>. «<i>ophørte Udmøntningen af Kronemønt med Sommeren 1625, og samtidig udstedtes Forordning om Mønten af 4. Maj 1625</i>». Припинення карбування крон; rigsdaler — 96 ß, крона — 128 ß, пів крони — 64 ß."
  da: "<b>Wilcke, Julius</b>: <i>Christian IV's Møntpolitik 1588–1625</i> (Numismatisk Forenings Medlemsblad II; København: J. H. Schultz' Universitetsbogtrykkeri, 1919), s. 231–232 — <a href=\"https://www.danskmoent.dk/pdf2/Wilcke_1.pdf\" target=\"_blank\">danskmoent.dk/pdf2/Wilcke_1.pdf</a>. «<i>ophørte Udmøntningen af Kronemønt med Sommeren 1625, og samtidig udstedtes Forordning om Mønten af 4. Maj 1625</i>». Kroneprægningens ophør; rigsdaleren til 96 ß, kronen til 128 ß, halvkronen til 64 ß."

wilcke-1919-kronenavn-1625:
  de: "<b>Wilcke, Julius</b>: <i>Christian IV's Møntpolitik 1588–1625</i> (Numismatisk Forenings Medlemsblad II; København: J. H. Schultz' Universitetsbogtrykkeri, 1919), S. 232 — <a href=\"https://www.danskmoent.dk/pdf2/Wilcke_1.pdf\" target=\"_blank\">danskmoent.dk/pdf2/Wilcke_1.pdf</a>. «<i>Da Helkroner ikke senere udmøntedes, men derimod Halvkroner, antog disse Navnet Kroner, der ogsaa kaldtes Sletdalere eller „IIII Mark danske“</i>». Umbenennung 1625: die Halbkrone wird «Krone», die alte Krone «Dobbeltkrone»; Nachahmung als «Zwey-Dritler»."
  en: "<b>Wilcke, Julius</b>: <i>Christian IV's Møntpolitik 1588–1625</i> (Numismatisk Forenings Medlemsblad II; Copenhagen: J. H. Schultz' Universitetsbogtrykkeri, 1919), p. 232 — <a href=\"https://www.danskmoent.dk/pdf2/Wilcke_1.pdf\" target=\"_blank\">danskmoent.dk/pdf2/Wilcke_1.pdf</a>. «<i>Da Helkroner ikke senere udmøntedes, men derimod Halvkroner, antog disse Navnet Kroner, der ogsaa kaldtes Sletdalere eller „IIII Mark danske“</i>». Renaming of 1625: the half krone becomes the «krone», the old krone the «dobbeltkrone»; imitated abroad as «Zwey-Dritler»."
  uk: "<b>Wilcke, Julius</b>: <i>Christian IV's Møntpolitik 1588–1625</i> (Numismatisk Forenings Medlemsblad II; Копенгаген: J. H. Schultz' Universitetsbogtrykkeri, 1919), с. 232 — <a href=\"https://www.danskmoent.dk/pdf2/Wilcke_1.pdf\" target=\"_blank\">danskmoent.dk/pdf2/Wilcke_1.pdf</a>. «<i>Da Helkroner ikke senere udmøntedes, men derimod Halvkroner, antog disse Navnet Kroner, der ogsaa kaldtes Sletdalere eller „IIII Mark danske“</i>». Перейменування 1625 р.: пів крони стає «кроною», стара крона — «dobbeltkrone»; наслідування за кордоном як «Zwey-Dritler»."
  da: "<b>Wilcke, Julius</b>: <i>Christian IV's Møntpolitik 1588–1625</i> (Numismatisk Forenings Medlemsblad II; København: J. H. Schultz' Universitetsbogtrykkeri, 1919), s. 232 — <a href=\"https://www.danskmoent.dk/pdf2/Wilcke_1.pdf\" target=\"_blank\">danskmoent.dk/pdf2/Wilcke_1.pdf</a>. «<i>Da Helkroner ikke senere udmøntedes, men derimod Halvkroner, antog disse Navnet Kroner, der ogsaa kaldtes Sletdalere eller „IIII Mark danske“</i>». Omdøbningen 1625: halvkronen bliver «krone», den gamle krone «dobbeltkrone»; efterlignet i udlandet som «Zwey-Dritler»."

wilcke-1919-dobbeltkrone-rest-1625:
  de: "<b>Wilcke, Julius</b>: <i>Christian IV's Møntpolitik 1588–1625</i> (Numismatisk Forenings Medlemsblad II; København: J. H. Schultz' Universitetsbogtrykkeri, 1919), S. 233 — <a href=\"https://www.danskmoent.dk/pdf2/Wilcke_1.pdf\" target=\"_blank\">danskmoent.dk/pdf2/Wilcke_1.pdf</a>. «<i>Selv med den forangivne Nedsættelse af Dobbeltkronen fra 1½ Dlr. til 1⅓ forblev Sølvindholdet større i den sidste … ca. 34,4 gr. f. S. mod 32,5 gr.</i>». Silbergehalt der Dobbeltkrone gegenüber 1⅓ Daler nach der Herabsetzung von 1625."
  en: "<b>Wilcke, Julius</b>: <i>Christian IV's Møntpolitik 1588–1625</i> (Numismatisk Forenings Medlemsblad II; Copenhagen: J. H. Schultz' Universitetsbogtrykkeri, 1919), p. 233 — <a href=\"https://www.danskmoent.dk/pdf2/Wilcke_1.pdf\" target=\"_blank\">danskmoent.dk/pdf2/Wilcke_1.pdf</a>. «<i>Selv med den forangivne Nedsættelse af Dobbeltkronen fra 1½ Dlr. til 1⅓ forblev Sølvindholdet større i den sidste … ca. 34,4 gr. f. S. mod 32,5 gr.</i>». Silver content of the dobbeltkrone against 1⅓ daler after the 1625 reduction."
  uk: "<b>Wilcke, Julius</b>: <i>Christian IV's Møntpolitik 1588–1625</i> (Numismatisk Forenings Medlemsblad II; Копенгаген: J. H. Schultz' Universitetsbogtrykkeri, 1919), с. 233 — <a href=\"https://www.danskmoent.dk/pdf2/Wilcke_1.pdf\" target=\"_blank\">danskmoent.dk/pdf2/Wilcke_1.pdf</a>. «<i>Selv med den forangivne Nedsættelse af Dobbeltkronen fra 1½ Dlr. til 1⅓ forblev Sølvindholdet større i den sidste … ca. 34,4 gr. f. S. mod 32,5 gr.</i>». Вміст срібла dobbeltkrone проти 1⅓ далера після зниження 1625 р."
  da: "<b>Wilcke, Julius</b>: <i>Christian IV's Møntpolitik 1588–1625</i> (Numismatisk Forenings Medlemsblad II; København: J. H. Schultz' Universitetsbogtrykkeri, 1919), s. 233 — <a href=\"https://www.danskmoent.dk/pdf2/Wilcke_1.pdf\" target=\"_blank\">danskmoent.dk/pdf2/Wilcke_1.pdf</a>. «<i>Selv med den forangivne Nedsættelse af Dobbeltkronen fra 1½ Dlr. til 1⅓ forblev Sølvindholdet større i den sidste … ca. 34,4 gr. f. S. mod 32,5 gr.</i>». Dobbeltkronens sølvindhold over for 1⅓ daler efter nedsættelsen 1625."

danskmoent-f3guldkr:
  de: "<b>Hede, Holger</b>: <i>Frederik III's guldkroner</i>, NNUM 1957 — <a href=\"https://www.danskmoent.dk/artikler/f3guldkr.htm\" target=\"_blank\">danskmoent.dk/artikler/f3guldkr.htm</a>. Spezialmonographie über die goldene Pendant-Münze der Krone-Mønt-Kategorie unter Frederik III. mit Datierungen Glückstadt 1657–1660 und Kopenhagen 1655–1668."
  en: "<b>Hede, Holger</b>: <i>Frederik III's guldkroner</i>, NNUM 1957 — <a href=\"https://www.danskmoent.dk/artikler/f3guldkr.htm\" target=\"_blank\">danskmoent.dk/artikler/f3guldkr.htm</a>. Specialist monograph on the gold counterpart of the Krone-Mønt category under Frederik III, with datings for Glückstadt 1657–1660 and Copenhagen 1655–1668."
  uk: "<b>Hede, Holger</b>: <i>Frederik III's guldkroner</i>, NNUM 1957 — <a href=\"https://www.danskmoent.dk/artikler/f3guldkr.htm\" target=\"_blank\">danskmoent.dk/artikler/f3guldkr.htm</a>. Спеціалізована монографія про золоту відповідницю Krone-Mønt-категорії за Фредеріка III, з датуваннями Glückstadt 1657–1660 і Копенгаген 1655–1668."
  da: '<b>Hede, Holger</b>: <i>Frederik III''s guldkroner</i>, NNUM 1957 — <a href="https://www.danskmoent.dk/artikler/f3guldkr.htm" target="_blank">danskmoent.dk/artikler/f3guldkr.htm</a>. Særmonografi om kronemøntens guldpendant under Frederik 3., med dateringerne Glückstadt 1657–1660 og København 1655–1668.'

lex-dansk-m-ntv-sen:
  de: "<b>Den Store Danske / lex.dk</b>: <i>dansk møntvæsen</i> — <a href=\"https://lex.dk/dansk_m%C3%B8ntv%C3%A6sen\" target=\"_blank\">lex.dk/dansk møntvæsen</a>. Periodisierungsmarken: 1692 (Übergang Krone-Mønt → Kurantmønt) und Møntloven 23. Mai 1873 (Krone als Goldhauptmünze)."
  en: "<b>Den Store Danske / lex.dk</b>: <i>dansk møntvæsen</i> — <a href=\"https://lex.dk/dansk_m%C3%B8ntv%C3%A6sen\" target=\"_blank\">lex.dk/dansk møntvæsen</a>. Periodisation markers: 1692 (Krone-Mønt → Kurantmønt transition) and Møntlov of 23 May 1873 (Krone as principal gold coin)."
  uk: "<b>Den Store Danske / lex.dk</b>: <i>dansk møntvæsen</i> — <a href=\"https://lex.dk/dansk_m%C3%B8ntv%C3%A6sen\" target=\"_blank\">lex.dk/dansk møntvæsen</a>. Періодизаційні маркери: 1692 (перехід Krone-Mønt → Kurantmønt) і Møntlov 23 травня 1873 (Krone як головна золота монета)."
  da: '<b>Den Store Danske / lex.dk</b>: <i>dansk møntvæsen</i> — <a href="https://lex.dk/dansk_m%C3%B8ntv%C3%A6sen" target="_blank">lex.dk/dansk møntvæsen</a>. Periodiseringsmærker: 1692 (overgangen fra kronemønt til kurantmønt) og Møntloven af 23. maj 1873 (kronen som guldhovedmønt).'

denmark-ref13-no-url:
  de: "<b>Aagaard, Sven</b>: <i>Frederik III Kronemønt København 1651–1670</i> (København 2004). Spezialmonographie zur Frederik-III.-Krone-Phase in Kopenhagen, mit Übergangsperiode 1651–1652 zwischen alter Christian-IV.-Müntzformel und neuem 10½-Krone-Fuß. Nur Druckausgabe."
  en: "<b>Aagaard, Sven</b>: <i>Frederik III Kronemønt København 1651–1670</i> (Copenhagen 2004). Specialist monograph on the Frederik III Krone phase at the Copenhagen mint, covering the 1651–1652 transition between the old Christian IV mint formula and the new 10½-Krone-Fuß. Print only."
  uk: "<b>Aagaard, Sven</b>: <i>Frederik III Kronemønt København 1651–1670</i> (Копенгаген 2004). Спеціалізована монографія про фазу Krone Фредеріка III у Копенгагені, з перехідним періодом 1651–1652 між старою монетною формулою Кристіана IV та новим 10½-Krone-Fuß. Лише друковане видання."
  da: '<b>Aagaard, Sven</b>: <i>Frederik III Kronemønt København 1651–1670</i> (København 2004). Særmonografi om Frederik 3.s kronemøntfase i København, med overgangsperioden 1651–1652 mellem den gamle Christian 4.-formel og den nye 10½-kronefod. Kun i trykt udgave.'

denmark-ref14-no-url:
  de: "<b>Aagaard, Sven</b>: <i>Frederik III Guldmønt og speciemønt 1648–1670</i> (København 2011). Spezialmonographie zu Frederik-III.-Goldprägungen einschließlich der Guldkrone-Tarifserie 1655–1668 und der Speciedukat-Reform vom 2. Januar 1658. Nur Druckausgabe."
  en: "<b>Aagaard, Sven</b>: <i>Frederik III Guldmønt og speciemønt 1648–1670</i> (Copenhagen 2011). Specialist monograph on Frederik III's gold issues including the Guldkrone tariff series 1655–1668 and the Speciedukat reform of 2 January 1658. Print only."
  uk: "<b>Aagaard, Sven</b>: <i>Frederik III Guldmønt og speciemønt 1648–1670</i> (Копенгаген 2011). Спеціалізована монографія про золоті випуски Фредеріка III, у т.ч. тарифну серію Guldkrone 1655–1668 і реформу Speciedukat 2 січня 1658. Лише друковане видання."
  da: '<b>Aagaard, Sven</b>: <i>Frederik III Guldmønt og speciemønt 1648–1670</i> (København 2011). Særmonografi om Frederik 3.s guldpræg, herunder guldkronernes tarifserie 1655–1668 og speciedukatreformen af 2. januar 1658. Kun i trykt udgave.'

denmark-ref15-no-url:
  de: "<b>Aagaard, Sven et al.</b>: <i>Christian V — Kronemønt, speciedalere og dukater — Glückstadt 1671–1696</i> (København 2022). Spezialmonographie zur Glückstadter Krone-Mønt-Phase unter Christian V., einschließlich der formellen 10½-Krone-Fuß-Festschreibung 1671. Nur Druckausgabe."
  en: "<b>Aagaard, Sven et al.</b>: <i>Christian V — Kronemønt, speciedalere og dukater — Glückstadt 1671–1696</i> (Copenhagen 2022). Specialist monograph on the Glückstadt Krone-Mønt phase under Christian V, including the formal codification of the 10½-Krone-Fuß in 1671. Print only."
  uk: "<b>Aagaard, Sven et al.</b>: <i>Christian V — Kronemønt, speciedalere og dukater — Glückstadt 1671–1696</i> (Копенгаген 2022). Спеціалізована монографія про ґлюкштадтську фазу Krone-Mønt за Кристіана V, у т.ч. формальне закріплення 10½-Krone-Fuß 1671 р. Лише друковане видання."
  da: '<b>Aagaard, Sven m.fl.</b>: <i>Christian V — Kronemønt, speciedalere og dukater — Glückstadt 1671–1696</i> (København 2022). Særmonografi om den glückstadtske kronemøntfase under Christian 5., herunder den formelle fastlæggelse af 10½-kronefoden i 1671. Kun i trykt udgave.'

portal-christian-4s-guldm-nt-fra-esrum-m-lleg-rd:
  de: "<b>Ingvardson, Gitte Tarnow &amp; Märcher, Michael</b>: <i>Christian 4.s guldmønt fra Esrum Møllegård</i>, in: M. Andersen &amp; P. O. Nielsen (red.), <i>Danefæ – Skatte fra den danske muld</i> (København: Nationalmuseet, 2010), S. 254–257 — <a href=\"https://portal.research.lu.se/en/publications/christian-4s-guldm%C3%B8nt-fra-esrum-m%C3%B8lleg%C3%A5rd\" target=\"_blank\">portal.research.lu.se</a>. Belegt drei Doppelguldkronen Christians IV. von 1628 (Hede 28) aus dem Esrum-Schatzfund."
  en: "<b>Ingvardson, Gitte Tarnow &amp; Märcher, Michael</b>: <i>Christian 4.s guldmønt fra Esrum Møllegård</i>, in: M. Andersen &amp; P. O. Nielsen (eds.), <i>Danefæ – Skatte fra den danske muld</i> (Copenhagen: Nationalmuseet, 2010), pp. 254–257 — <a href=\"https://portal.research.lu.se/en/publications/christian-4s-guldm%C3%B8nt-fra-esrum-m%C3%B8lleg%C3%A5rd\" target=\"_blank\">portal.research.lu.se</a>. Documents three Christian IV double Guldkroner of 1628 (Hede 28) from the Esrum hoard."
  uk: "<b>Ingvardson, Gitte Tarnow &amp; Märcher, Michael</b>: <i>Christian 4.s guldmønt fra Esrum Møllegård</i>, у: M. Andersen &amp; P. O. Nielsen (ред.), <i>Danefæ – Skatte fra den danske muld</i> (Копенгаген: Nationalmuseet, 2010), с. 254–257 — <a href=\"https://portal.research.lu.se/en/publications/christian-4s-guldm%C3%B8nt-fra-esrum-m%C3%B8lleg%C3%A5rd\" target=\"_blank\">portal.research.lu.se</a>. Документує три подвійні Guldkrone Кристіана IV 1628 (Hede 28) зі скарбу Esrum."
  da: '<b>Ingvardson, Gitte Tarnow &amp; Märcher, Michael</b>: <i>Christian 4.s guldmønt fra Esrum Møllegård</i>, i: M. Andersen &amp; P. O. Nielsen (red.), <i>Danefæ – Skatte fra den danske muld</i> (København: Nationalmuseet, 2010), s. 254–257 — <a href="https://portal.research.lu.se/en/publications/christian-4s-guldm%C3%B8nt-fra-esrum-m%C3%B8lleg%C3%A5rd" target="_blank">portal.research.lu.se</a>. Dokumenterer tre dobbelte guldkroner fra Christian 4. 1628 (Hede 28) i skattefundet fra Esrum.'

danskmoent-aclove3:
  de: "<b>Lov nr. 66 af 23. maj 1873 om Mønten</b> (Møntloven) — dänisches Coinage Act unter Christian IX., wirksam 1. Januar 1875. Definiert den Krone-Gold-Standard: 2480 Kroner aus 1 kg Feingold bei .900 Feingehalt; 100 Øre = 1 Krone. Companion-Regulierungen: <i>Bek. nr. 88 af 26. juni 1873</i> (dänisch-schwedische Münzkonvention), <i>Bek. nr. 115 af 23. august 1873</i> (Stempel für 10-/20-Krone-Goldmünzen), <i>Bek. nr. 156 af 16. december 1873</i> (Festlegung der Goldmünzen als gesetzliches Zahlmittel). Übersicht: <a href=\"https://www.danskmoent.dk/artikler/aclove3.htm\" target=\"_blank\">danskmoent.dk/artikler/aclove3.htm</a>."
  en: "<b>Lov nr. 66 of 23 May 1873 om Mønten</b> (Møntloven) — Danish Coinage Act under Christian IX, effective 1 January 1875. Defines the Krone gold standard: 2,480 Kroner per kg of fine gold at .900 fineness; 100 øre = 1 Krone. Companion regulations: <i>Bek. nr. 88 of 26 June 1873</i> (Danish-Swedish monetary convention), <i>Bek. nr. 115 of 23 August 1873</i> (dies for the 10/20-Krone gold coins), <i>Bek. nr. 156 of 16 December 1873</i> (gold coins established as legal tender). Index: <a href=\"https://www.danskmoent.dk/artikler/aclove3.htm\" target=\"_blank\">danskmoent.dk/artikler/aclove3.htm</a>."
  uk: "<b>Lov nr. 66 від 23 травня 1873 om Mønten</b> (Møntloven) — данський Coinage Act за Кристіана IX, чинний з 1 січня 1875. Визначає Krone-золотий стандарт: 2480 Krone з 1 кг чистого золота за пробою .900; 100 øre = 1 Krone. Супровідні регуляції: <i>Bek. nr. 88 від 26 червня 1873</i> (дансько-шведська монетна конвенція), <i>Bek. nr. 115 від 23 серпня 1873</i> (штемпелі для 10/20-Krone золотих монет), <i>Bek. nr. 156 від 16 грудня 1873</i> (встановлення золотих монет як законного платіжного засобу). Огляд: <a href=\"https://www.danskmoent.dk/artikler/aclove3.htm\" target=\"_blank\">danskmoent.dk/artikler/aclove3.htm</a>."
  da: '<b>Lov nr. 66 af 23. maj 1873 om Mønten</b> (Møntloven) — vedtaget under Christian 9., i kraft 1. januar 1875. Fastlægger kronens guldstandard: 2 480 kroner af 1 kg fint guld ved .900 lødighed; 100 øre = 1 krone. Tilhørende bestemmelser: <i>Bek. nr. 88 af 26. juni 1873</i> (den dansk-svenske møntkonvention), <i>Bek. nr. 115 af 23. august 1873</i> (stemplerne til 10- og 20-kronestykker), <i>Bek. nr. 156 af 16. december 1873</i> (guldmønterne som lovligt betalingsmiddel). Oversigt: <a href="https://www.danskmoent.dk/artikler/aclove3.htm" target="_blank">danskmoent.dk/artikler/aclove3.htm</a>.'

wikipedia-da-den-skandinaviske-m-ntunion:
  de: "<b>Den Skandinaviske Møntunion</b> — Skandinavische Müntzkonvention Stockholm 5. Mai 1873 zwischen Dänemark und Schweden; Norwegen tritt 1875 bei. Gemeinsame Krone-Goldwährung; 1 Krone = 1 Krona = ½ Rigsdaler (DK) = ¼ Speciedaler (NO). Goldkonvertibilität durch Danmarks Nationalbank am 2. August 1914 ausgesetzt (Beginn des Ersten Weltkriegs); die Müntzunion formell aufgelöst 1924. Wikipedia: <a href=\"https://da.wikipedia.org/wiki/Den_Skandinaviske_M%C3%B8ntunion\" target=\"_blank\">da.wikipedia.org</a> · <a href=\"https://en.wikipedia.org/wiki/Scandinavian_Monetary_Union\" target=\"_blank\">en.wikipedia.org</a> · Lex.dk: <a href=\"https://lex.dk/Den_Skandinaviske_M%C3%B8ntunion\" target=\"_blank\">lex.dk/Den_Skandinaviske_Møntunion</a>."
  en: "<b>Den Skandinaviske Møntunion</b> — Scandinavian Monetary Convention of 5 May 1873 (Stockholm) between Denmark and Sweden; Norway accedes in 1875. Common Krone gold currency; 1 Krone = 1 Krona = ½ Rigsdaler (DK) = ¼ Speciedaler (NO). Gold convertibility suspended by Danmarks Nationalbank on 2 August 1914 (outbreak of WWI); the monetary union formally dissolved in 1924. Wikipedia: <a href=\"https://da.wikipedia.org/wiki/Den_Skandinaviske_M%C3%B8ntunion\" target=\"_blank\">da.wikipedia.org</a> · <a href=\"https://en.wikipedia.org/wiki/Scandinavian_Monetary_Union\" target=\"_blank\">en.wikipedia.org</a> · Lex.dk: <a href=\"https://lex.dk/Den_Skandinaviske_M%C3%B8ntunion\" target=\"_blank\">lex.dk/Den_Skandinaviske_Møntunion</a>."
  uk: "<b>Den Skandinaviske Møntunion</b> — Скандинавська монетна конвенція 5 травня 1873 р. (Стокгольм) між Данією та Швецією; Норвегія приєднується 1875 р. Спільна Krone-золота валюта; 1 Krone = 1 Krona = ½ Rigsdaler (DK) = ¼ Speciedaler (NO). Конвертованість у золото призупинено Danmarks Nationalbank 2 серпня 1914 р. (початок Першої світової війни); монетна унія формально розпущена 1924 р. Wikipedia: <a href=\"https://da.wikipedia.org/wiki/Den_Skandinaviske_M%C3%B8ntunion\" target=\"_blank\">da.wikipedia.org</a> · <a href=\"https://en.wikipedia.org/wiki/Scandinavian_Monetary_Union\" target=\"_blank\">en.wikipedia.org</a> · Lex.dk: <a href=\"https://lex.dk/Den_Skandinaviske_M%C3%B8ntunion\" target=\"_blank\">lex.dk/Den_Skandinaviske_Møntunion</a>."
  da: '<b>Den Skandinaviske Møntunion</b> — den skandinaviske møntkonvention i Stockholm 5. maj 1873 mellem Danmark og Sverige; Norge tiltrådte i 1875. Fælles kronevaluta i guld; 1 krone = 1 krona = ½ rigsdaler (DK) = ¼ speciedaler (NO). Guldindløseligheden blev suspenderet af Danmarks Nationalbank 2. august 1914 ved 1. verdenskrigs udbrud; møntunionen blev formelt opløst i 1924. Wikipedia: <a href="https://da.wikipedia.org/wiki/Den_Skandinaviske_M%C3%B8ntunion" target="_blank">da.wikipedia.org</a> · <a href="https://en.wikipedia.org/wiki/Scandinavian_Monetary_Union" target="_blank">en.wikipedia.org</a> · Lex.dk: <a href="https://lex.dk/Den_Skandinaviske_M%C3%B8ntunion" target="_blank">lex.dk/Den_Skandinaviske_Møntunion</a>.'

danskmoent-flugt:
  de: "<b>«Den skandinaviske flugt fra sølvet»</b> — danskmoent.dk-Artikel zur skandinavischen Übergangsdebatte 1872–1873. Dokumentiert das Kopenhagener Konferenz-Protokoll vom Juli 1872, die explizite Ablehnung der Lateinischen Münzunion durch Dänemark («<i>det var både praktisk umuligt og økonomisk ufornuftigt at have et bimetalisk system</i>») und das gewählte Gold-zu-Silber-Verhältnis 1:15.5. <a href=\"https://www.danskmoent.dk/artikler/flugt.htm\" target=\"_blank\">danskmoent.dk/artikler/flugt.htm</a>."
  en: "<b>«Den skandinaviske flugt fra sølvet»</b> — danskmoent.dk article on the 1872-1873 Scandinavian transition debate. Documents the Copenhagen conference protocol of July 1872, Denmark's explicit rejection of the Latin Monetary Union («<i>det var både praktisk umuligt og økonomisk ufornuftigt at have et bimetalisk system</i>»), and the adopted gold:silver ratio of 1:15.5. <a href=\"https://www.danskmoent.dk/artikler/flugt.htm\" target=\"_blank\">danskmoent.dk/artikler/flugt.htm</a>."
  uk: "<b>«Den skandinaviske flugt fra sølvet»</b> — стаття danskmoent.dk про скандинавські перехідні дебати 1872–1873 рр. Документує протокол копенгагенської конференції липня 1872, явну відмову Данії від Латинського монетного союзу («<i>det var både praktisk umuligt og økonomisk ufornuftigt at have et bimetalisk system</i>») та обране співвідношення золота до срібла 1:15,5. <a href=\"https://www.danskmoent.dk/artikler/flugt.htm\" target=\"_blank\">danskmoent.dk/artikler/flugt.htm</a>."
  da: '<b>«Den skandinaviske flugt fra sølvet»</b> — artikel på danskmoent.dk om den skandinaviske overgangsdebat 1872–1873. Dokumenterer protokollen fra Københavnerkonferencen i juli 1872, Danmarks udtrykkelige afvisning af Den Latinske Møntunion («<i>det var både praktisk umuligt og økonomisk ufornuftigt at have et bimetalisk system</i>») og det valgte guld-sølv-forhold 1 : 15,5. <a href="https://www.danskmoent.dk/artikler/flugt.htm" target="_blank">danskmoent.dk/artikler/flugt.htm</a>.'

econstor-386525536:
  de: "<b>Abildgren, Kim</b>: <i>A chronology of Denmark's exchange-rate policy 1875-2003</i> (Danmarks Nationalbank Working Paper Series, 2004) — <a href=\"https://www.econstor.eu/bitstream/10419/82375/2/386525536.pdf\" target=\"_blank\">econstor.eu PDF, 32 S.</a>. Akademische Chronologie der dänischen Wechselkurspolitik von der Krone-Einführung 1875 bis 2003. Goldsuspendierung 2. August 1914 (S. 14: «<i>an Act was passed on 2 August 1914 suspending the Nationalbank's obligation to convert its notes into gold</i>»); Rückkehr zum Goldstandard zur Vorkriegs-Parität 1. Januar 1927 (S. 17: «<i>With effect from 1 January 1927 the Gold Standard was reintroduced in Denmark ... the Danish krone returned to gold at the pre-war parity</i>»)."
  en: "<b>Abildgren, Kim</b>: <i>A chronology of Denmark's exchange-rate policy 1875-2003</i> (Danmarks Nationalbank Working Paper Series, 2004) — <a href=\"https://www.econstor.eu/bitstream/10419/82375/2/386525536.pdf\" target=\"_blank\">econstor.eu PDF, 32 pp.</a>. Academic chronology of Danish exchange-rate policy from the Krone's 1875 introduction to 2003. Gold suspension 2 August 1914 (p. 14: «<i>an Act was passed on 2 August 1914 suspending the Nationalbank's obligation to convert its notes into gold</i>»); return to the Gold Standard at pre-war parity on 1 January 1927 (p. 17: «<i>With effect from 1 January 1927 the Gold Standard was reintroduced in Denmark ... the Danish krone returned to gold at the pre-war parity</i>»)."
  uk: "<b>Abildgren, Kim</b>: <i>A chronology of Denmark's exchange-rate policy 1875-2003</i> (Danmarks Nationalbank Working Paper Series, 2004) — <a href=\"https://www.econstor.eu/bitstream/10419/82375/2/386525536.pdf\" target=\"_blank\">econstor.eu PDF, 32 с.</a>. Академічна хронологія данської політики обмінного курсу від запровадження Krone 1875 до 2003 р. Призупинення золотого стандарту 2 серпня 1914 (с. 14: «<i>an Act was passed on 2 August 1914 suspending the Nationalbank's obligation to convert its notes into gold</i>»); повернення до Gold Standard за довоєнним паритетом 1 січня 1927 (с. 17: «<i>With effect from 1 January 1927 the Gold Standard was reintroduced in Denmark ... the Danish krone returned to gold at the pre-war parity</i>»)."
  da: '<b>Abildgren, Kim</b>: <i>A chronology of Denmark''s exchange-rate policy 1875-2003</i> (Danmarks Nationalbank Working Paper Series, 2004) — <a href="https://www.econstor.eu/bitstream/10419/82375/2/386525536.pdf" target="_blank">econstor.eu PDF, 32 s.</a>. Videnskabelig kronologi over dansk valutakurspolitik fra kronens indførelse i 1875 til 2003. Guldindløseligheden suspenderet 2. august 1914 (s. 14: «<i>an Act was passed on 2 August 1914 suspending the Nationalbank''s obligation to convert its notes into gold</i>»); tilbagevenden til guldfoden i førkrigspariteten 1. januar 1927 (s. 17: «<i>With effect from 1 January 1927 the Gold Standard was reintroduced in Denmark ... the Danish krone returned to gold at the pre-war parity</i>»).'

