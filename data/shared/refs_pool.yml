wilcke6-rhinfyrster-1490-norm:
  de: |
    <b>Wilcke, Julius</b>: <i>Kong Hans' rhinske Guldgylden</i> — <a href="https://www.danskmoent.dk/wilcke/w6a.htm" target="_blank">danskmoent.dk · Wilcke 6</a>.
    Die Norm der vier Rheinischen Kurfürsten von 1490: «<i>De 4 Rhinfyrsters Gylden af 1490 … 71 1/3 … Guld: 18 1/2 … 3,278 … 2,527</i>» — 71⅓ Stück je Cöllnischer Marck bei 18½ Karat.
  en: |
    <b>Wilcke, Julius</b>: <i>Kong Hans' rhinske Guldgylden</i> — <a href="https://www.danskmoent.dk/wilcke/w6a.htm" target="_blank">danskmoent.dk · Wilcke 6</a>.
    The four Rhenish electors' norm of 1490: «<i>De 4 Rhinfyrsters Gylden af 1490 … 71 1/3 … Guld: 18 1/2 … 3,278 … 2,527</i>» — 71⅓ pieces to the Cologne mark at 18½ carats.
  uk: |
    <b>Wilcke, Julius</b>: <i>Kong Hans' rhinske Guldgylden</i> — <a href="https://www.danskmoent.dk/wilcke/w6a.htm" target="_blank">danskmoent.dk · Wilcke 6</a>.
    Норма чотирьох рейнських курфюрстів 1490 р.: «<i>De 4 Rhinfyrsters Gylden af 1490 … 71 1/3 … Guld: 18 1/2 … 3,278 … 2,527</i>» — 71⅓ штуки з кельнської марки за 18½ карата.
  da: '<b>Wilcke, Julius</b>: <i>Kong Hans'' rhinske Guldgylden</i> — <a href="https://www.danskmoent.dk/wilcke/w6a.htm" target="_blank">danskmoent.dk · Wilcke 6</a>. De fire rhinske kurfyrsters norm af 1490: «<i>De 4 Rhinfyrsters Gylden af 1490 … 71 1/3 … Guld: 18 1/2 … 3,278 … 2,527</i>» — 71⅓ stykker pr. cølnsk marck ved 18½ karat.'

wilcke6-valvationstag-1551:
  de: |
    <b>Wilcke, Julius</b>: <i>Kong Hans' rhinske Guldgylden</i> — <a href="https://www.danskmoent.dk/wilcke/w6a.htm" target="_blank">danskmoent.dk · Wilcke 6</a>.
    Der Nürnberger Valvationstag 1551 als Probier-, nicht Verordnungsakt: «<i>De skulde prøve hver enkelt Mønt og beskrive … samt oplyse dens Vægt, Gehalt og det Antal Kreuzer</i>». Die 17 Karat der Valvation gelten der Gylden «<i>darinn ain Stern</i>»; die überlieferte Gylden mit den 2 Bjælker weicht «<i>kun ca. 3/4 Karat</i>» von der Norm ab, also 17¾ Karat.
  en: |
    <b>Wilcke, Julius</b>: <i>Kong Hans' rhinske Guldgylden</i> — <a href="https://www.danskmoent.dk/wilcke/w6a.htm" target="_blank">danskmoent.dk · Wilcke 6</a>.
    The Nürnberg Valvationstag of 1551 as an assay, not a decree: «<i>De skulde prøve hver enkelt Mønt og beskrive … samt oplyse dens Vægt, Gehalt og det Antal Kreuzer</i>». The 17 carats of that valuation belong to the gulden «<i>darinn ain Stern</i>»; the surviving type with the 2 Bjælker departs from the norm by «<i>kun ca. 3/4 Karat</i>», i.e. 17¾ carats.
  uk: |
    <b>Wilcke, Julius</b>: <i>Kong Hans' rhinske Guldgylden</i> — <a href="https://www.danskmoent.dk/wilcke/w6a.htm" target="_blank">danskmoent.dk · Wilcke 6</a>.
    Нюрнберзький Valvationstag 1551 р. як пробірний, а не приписовий акт: «<i>De skulde prøve hver enkelt Mønt og beskrive … samt oplyse dens Vægt, Gehalt og det Antal Kreuzer</i>». 17 карата тієї валвації стосуються гульдена «<i>darinn ain Stern</i>»; збережений тип із 2 Bjælker відхиляється від норми на «<i>kun ca. 3/4 Karat</i>», тобто 17¾ карата.
  da: '<b>Wilcke, Julius</b>: <i>Kong Hans'' rhinske Guldgylden</i> — <a href="https://www.danskmoent.dk/wilcke/w6a.htm" target="_blank">danskmoent.dk · Wilcke 6</a>. Valvationsdagen i Nürnberg 1551 var en prøvning, ikke en anordning: «<i>De skulde prøve hver enkelt Mønt og beskrive … samt oplyse dens Vægt, Gehalt og det Antal Kreuzer</i>». Valvationens 17 karat gælder den gylden, der er «<i>darinn ain Stern</i>»; den overleverede gylden med de 2 bjælker afviger «<i>kun ca. 3/4 Karat</i>» fra normen, altså 17¾ karat.'

wilcke6-normalgylden-ausbringung-1551:
  de: |
    <b>Wilcke, Julius</b>: <i>Kong Hans' rhinske Guldgylden</i> — <a href="https://www.danskmoent.dk/wilcke/w6a.htm" target="_blank">danskmoent.dk · Wilcke 6</a>.
    Der Nürnberger Valvationstag 1551 hält die tatsächliche Ausbringung des rheinischen Normalgyldens fest — als Befund, nicht als Vorschrift: «<i>erkender Raader og Wardeiner, at den rhinske Normalgylden som oftest kun udmøntedes 108 Stkr. af 1½ cølnsk Mark 18⅓ Karat fint Guld</i>» (= 72 Stück je Marck zu 18⅓ Karat).
  en: |
    <b>Wilcke, Julius</b>: <i>Kong Hans' rhinske Guldgylden</i> — <a href="https://www.danskmoent.dk/wilcke/w6a.htm" target="_blank">danskmoent.dk · Wilcke 6</a>.
    The Nürnberg Valvationstag of 1551 records the actual output of the Rhenish Normalgylden — as a finding, not a prescription: «<i>erkender Raader og Wardeiner, at den rhinske Normalgylden som oftest kun udmøntedes 108 Stkr. af 1½ cølnsk Mark 18⅓ Karat fint Guld</i>» (= 72 pieces to the mark at 18⅓ carats).
  uk: |
    <b>Wilcke, Julius</b>: <i>Kong Hans' rhinske Guldgylden</i> — <a href="https://www.danskmoent.dk/wilcke/w6a.htm" target="_blank">danskmoent.dk · Wilcke 6</a>.
    Нюрнберзький Valvationstag 1551 р. фіксує фактичну вибірку рейнського Normalgylden — як виявлення, а не припис: «<i>erkender Raader og Wardeiner, at den rhinske Normalgylden som oftest kun udmøntedes 108 Stkr. af 1½ cølnsk Mark 18⅓ Karat fint Guld</i>» (= 72 штуки з марки за 18⅓ карата).
  da: '<b>Wilcke, Julius</b>: <i>Kong Hans'' rhinske Guldgylden</i> — <a href="https://www.danskmoent.dk/wilcke/w6a.htm" target="_blank">danskmoent.dk · Wilcke 6</a>. Valvationsdagen i Nürnberg 1551 fastholder den faktiske udmøntning af den rhinske normalgylden — som iagttagelse, ikke som forskrift: «<i>erkender Raader og Wardeiner, at den rhinske Normalgylden som oftest kun udmøntedes 108 Stkr. af 1½ cølnsk Mark 18⅓ Karat fint Guld</i>» (= 72 stykker pr. marck ved 18⅓ karat).'

wilcke6-karl-v-moentordning-1551:
  de: |
    <b>Wilcke, Julius</b>: <i>Kong Hans' rhinske Guldgylden</i> — <a href="https://www.danskmoent.dk/wilcke/w6a.htm" target="_blank">danskmoent.dk · Wilcke 6</a>.
    Møntordnung Karls V. vom 28. Juli 1551: «<i>Kejseren opretholdt dog i sin Møntordning af 28. Juli 1551 den rhinske Gylden i den af de 4 Rhinfyrster oprindelig vedtagne Skikkelse</i>»; sie setzt zugleich «<i>en rhinsk Guldgylden (= Sølvgylden) til 72 Kreuzer</i>» bei 1 Specie = 68 Kreuzer.
  en: |
    <b>Wilcke, Julius</b>: <i>Kong Hans' rhinske Guldgylden</i> — <a href="https://www.danskmoent.dk/wilcke/w6a.htm" target="_blank">danskmoent.dk · Wilcke 6</a>.
    Karl V's Møntordning of 28 July 1551: «<i>Kejseren opretholdt dog i sin Møntordning af 28. Juli 1551 den rhinske Gylden i den af de 4 Rhinfyrster oprindelig vedtagne Skikkelse</i>»; it also tariffs «<i>en rhinsk Guldgylden (= Sølvgylden) til 72 Kreuzer</i>» at 1 Specie = 68 Kreuzer.
  uk: |
    <b>Wilcke, Julius</b>: <i>Kong Hans' rhinske Guldgylden</i> — <a href="https://www.danskmoent.dk/wilcke/w6a.htm" target="_blank">danskmoent.dk · Wilcke 6</a>.
    Мøntordning Карла V від 28 липня 1551 р.: «<i>Kejseren opretholdt dog i sin Møntordning af 28. Juli 1551 den rhinske Gylden i den af de 4 Rhinfyrster oprindelig vedtagne Skikkelse</i>»; він же тарифікує «<i>en rhinsk Guldgylden (= Sølvgylden) til 72 Kreuzer</i>» при 1 Specie = 68 крейцерів.
  da: '<b>Wilcke, Julius</b>: <i>Kong Hans'' rhinske Guldgylden</i> — <a href="https://www.danskmoent.dk/wilcke/w6a.htm" target="_blank">danskmoent.dk · Wilcke 6</a>. Karl 5.s møntordning af 28. juli 1551: «<i>Kejseren opretholdt dog i sin Møntordning af 28. Juli 1551 den rhinske Gylden i den af de 4 Rhinfyrster oprindelig vedtagne Skikkelse</i>»; samme ordning sætter «<i>en rhinsk Guldgylden (= Sølvgylden) til 72 Kreuzer</i>», mens 1 specie står i 68 kreutzer.'

wilcke6-ferdinand-moentedikt-1559:
  de: |
    <b>Wilcke, Julius</b>: <i>Kong Hans' rhinske Guldgylden</i> — <a href="https://www.danskmoent.dk/wilcke/w6a.htm" target="_blank">danskmoent.dk · Wilcke 6</a>.
    Müntzedikt Kaiser Ferdinands I. vom 19. August 1559: «<i>Ved Kejser Ferdinand I.s Møntedikt af 19. August 1559 fastsattes endelig Møntens Gehalt til 72 Stkr. af den 18 1/2 Karat fine Mark</i>». Dasselbe Edikt erklärte «<i>med 6 Maaneders Varsel saavel Christian III.s som Kong Hans' Guldgylden … forbudte og erklæret ugyldige</i>».
  en: |
    <b>Wilcke, Julius</b>: <i>Kong Hans' rhinske Guldgylden</i> — <a href="https://www.danskmoent.dk/wilcke/w6a.htm" target="_blank">danskmoent.dk · Wilcke 6</a>.
    Emperor Ferdinand I's coinage edict of 19 August 1559: «<i>Ved Kejser Ferdinand I.s Møntedikt af 19. August 1559 fastsattes endelig Møntens Gehalt til 72 Stkr. af den 18 1/2 Karat fine Mark</i>». The same edict declared «<i>med 6 Maaneders Varsel saavel Christian III.s som Kong Hans' Guldgylden … forbudte og erklæret ugyldige</i>».
  uk: |
    <b>Wilcke, Julius</b>: <i>Kong Hans' rhinske Guldgylden</i> — <a href="https://www.danskmoent.dk/wilcke/w6a.htm" target="_blank">danskmoent.dk · Wilcke 6</a>.
    Монетний едикт імператора Фердинанда I від 19 серпня 1559 р.: «<i>Ved Kejser Ferdinand I.s Møntedikt af 19. August 1559 fastsattes endelig Møntens Gehalt til 72 Stkr. af den 18 1/2 Karat fine Mark</i>». Той самий едикт оголосив «<i>med 6 Maaneders Varsel saavel Christian III.s som Kong Hans' Guldgylden … forbudte og erklæret ugyldige</i>».
  da: '<b>Wilcke, Julius</b>: <i>Kong Hans'' rhinske Guldgylden</i> — <a href="https://www.danskmoent.dk/wilcke/w6a.htm" target="_blank">danskmoent.dk · Wilcke 6</a>. Kejser Ferdinand 1.s møntedikt af 19. august 1559: «<i>Ved Kejser Ferdinand I.s Møntedikt af 19. August 1559 fastsattes endelig Møntens Gehalt til 72 Stkr. af den 18 1/2 Karat fine Mark</i>». Samme edikt erklærede «<i>med 6 Maaneders Varsel saavel Christian III.s som Kong Hans'' Guldgylden … forbudte og erklæret ugyldige</i>».'

wilcke6-hans-150000-gylden-1497:
  de: |
    <b>Wilcke, Julius</b>: <i>Kong Hans' rhinske Guldgylden</i> — <a href="https://www.danskmoent.dk/wilcke/w6a.htm" target="_blank">danskmoent.dk · Wilcke 6</a>.
    Auflage nach Hvitfeldt: «<i>Efter Hvitfeldt skal Kongen have ladet slaa 150,000 rhinske Gylden til Toget mod Sverige 1497</i>».
  en: |
    <b>Wilcke, Julius</b>: <i>Kong Hans' rhinske Guldgylden</i> — <a href="https://www.danskmoent.dk/wilcke/w6a.htm" target="_blank">danskmoent.dk · Wilcke 6</a>.
    Mintage after Hvitfeldt: «<i>Efter Hvitfeldt skal Kongen have ladet slaa 150,000 rhinske Gylden til Toget mod Sverige 1497</i>».
  uk: |
    <b>Wilcke, Julius</b>: <i>Kong Hans' rhinske Guldgylden</i> — <a href="https://www.danskmoent.dk/wilcke/w6a.htm" target="_blank">danskmoent.dk · Wilcke 6</a>.
    Тираж за Hvitfeldt: «<i>Efter Hvitfeldt skal Kongen have ladet slaa 150,000 rhinske Gylden til Toget mod Sverige 1497</i>».
  da: '<b>Wilcke, Julius</b>: <i>Kong Hans'' rhinske Guldgylden</i> — <a href="https://www.danskmoent.dk/wilcke/w6a.htm" target="_blank">danskmoent.dk · Wilcke 6</a>. Oplaget efter Hvitfeldt: «<i>Efter Hvitfeldt skal Kongen have ladet slaa 150,000 rhinske Gylden til Toget mod Sverige 1497</i>».'

wilcke6-worms-1495-reichsabschied:
  de: |
    <b>Wilcke, Julius</b>: <i>Kong Hans' rhinske Guldgylden</i> — <a href="https://www.danskmoent.dk/wilcke/w6a.htm" target="_blank">danskmoent.dk · Wilcke 6</a>.
    Der Wormser Reichsabschied 1495 hebt die Norm der vier Rheinischen Kurfürsten von 1490 auf Reichsebene: «<i>Paa Rigsdagen i Worms 1495 vedtoges denne Møntfod, der atter bekræftedes paa en Herredag i Lindau 1497 og en Rigsdag i Frejburg 1498</i>» — 107 Stück aus 1½ Cöllnischen Marck zu 18½ Karat.
  en: |
    <b>Wilcke, Julius</b>: <i>Kong Hans' rhinske Guldgylden</i> — <a href="https://www.danskmoent.dk/wilcke/w6a.htm" target="_blank">danskmoent.dk · Wilcke 6</a>.
    The Worms Reichsabschied of 1495 raises the four Rhenish electors' norm of 1490 to imperial rank: «<i>Paa Rigsdagen i Worms 1495 vedtoges denne Møntfod, der atter bekræftedes paa en Herredag i Lindau 1497 og en Rigsdag i Frejburg 1498</i>» — 107 pieces from 1½ Cologne marks at 18½ carats.
  uk: |
    <b>Wilcke, Julius</b>: <i>Kong Hans' rhinske Guldgylden</i> — <a href="https://www.danskmoent.dk/wilcke/w6a.htm" target="_blank">danskmoent.dk · Wilcke 6</a>.
    Вормський Reichsabschied 1495 р. підносить норму чотирьох рейнських курфюрстів 1490 р. на імперський рівень: «<i>Paa Rigsdagen i Worms 1495 vedtoges denne Møntfod, der atter bekræftedes paa en Herredag i Lindau 1497 og en Rigsdag i Frejburg 1498</i>» — 107 штук з 1½ кельнської марки за 18½ карата.
  da: '<b>Wilcke, Julius</b>: <i>Kong Hans'' rhinske Guldgylden</i> — <a href="https://www.danskmoent.dk/wilcke/w6a.htm" target="_blank">danskmoent.dk · Wilcke 6</a>. Rigsdagen i Worms 1495 løfter de fire rhinske kurfyrsters norm af 1490 op på rigsplan: «<i>Paa Rigsdagen i Worms 1495 vedtoges denne Møntfod, der atter bekræftedes paa en Herredag i Lindau 1497 og en Rigsdag i Frejburg 1498</i>» — 107 stykker af 1½ cølnsk marck ved 18½ karat.'

wilcke6-hans-moentanordning-1497-sverige:
  de: |
    <b>Wilcke, Julius</b>: <i>Kong Hans' rhinske Guldgylden</i> — <a href="https://www.danskmoent.dk/wilcke/w6a.htm" target="_blank">danskmoent.dk · Wilcke 6</a>.
    Kong Hans' Møntanordning vom 4. Dezember 1497, für Schweden erlassen und nie ausgeführt: «<i>befalede Kong Hans Møntmester Michel Johansson i Stockholm at mynte «guldmynt på Rhenska gulden slag»</i>» — nach Schive 72 Stück auf die 18½ Karat feine Cöllnische Marck; «<i>Nogen svensk Guldmønt blev dog aldrig slaaet</i>».
  en: |
    <b>Wilcke, Julius</b>: <i>Kong Hans' rhinske Guldgylden</i> — <a href="https://www.danskmoent.dk/wilcke/w6a.htm" target="_blank">danskmoent.dk · Wilcke 6</a>.
    Kong Hans' Møntanordning of 4 December 1497, issued for Sweden and never executed: «<i>befalede Kong Hans Møntmester Michel Johansson i Stockholm at mynte «guldmynt på Rhenska gulden slag»</i>» — per Schive, 72 pieces to the 18½-carat Cologne mark; «<i>Nogen svensk Guldmønt blev dog aldrig slaaet</i>».
  uk: |
    <b>Wilcke, Julius</b>: <i>Kong Hans' rhinske Guldgylden</i> — <a href="https://www.danskmoent.dk/wilcke/w6a.htm" target="_blank">danskmoent.dk · Wilcke 6</a>.
    Møntanordning Ганса від 4 грудня 1497 р., видана для Швеції й ніколи не виконана: «<i>befalede Kong Hans Møntmester Michel Johansson i Stockholm at mynte «guldmynt på Rhenska gulden slag»</i>» — за Schive, 72 штуки на кельнську марку 18½ карата; «<i>Nogen svensk Guldmønt blev dog aldrig slaaet</i>».
  da: '<b>Wilcke, Julius</b>: <i>Kong Hans'' rhinske Guldgylden</i> — <a href="https://www.danskmoent.dk/wilcke/w6a.htm" target="_blank">danskmoent.dk · Wilcke 6</a>. Kong Hans'' møntanordning af 4. december 1497, udstedt for Sverige og aldrig ført ud i livet: «<i>befalede Kong Hans Møntmester Michel Johansson i Stockholm at mynte «guldmynt på Rhenska gulden slag»</i>» — efter Schive 72 stykker af den 18½ karat fine cølnske marck; «<i>Nogen svensk Guldmønt blev dog aldrig slaaet</i>».'

harck-c4-rhinsk-gylden-udmoentning:
