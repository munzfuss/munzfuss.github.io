        <b>1 Goldgulden</b> (Rhinsk Gylden) — Hauptnominal über alle Phasen · als Doppelnominal <b>2 Goldgulden</b> (Christian III., 1546, Flensborg)<sup>[ref:danskmoent-c3-rhinsk-gylden-1546]</sup>.<br>Tarif: <b>1 Goldgulden ≈ 0,71-0,73 Reichsdukat</b> (per Feingewicht, kein formaler Tarif) ≈ <b>20 ß lybsk</b> · ≈ <b>1½ Mark Dansk</b> (1620er)<sup>[ref:danskmoent-1rhinsk-gylden]</sup>
