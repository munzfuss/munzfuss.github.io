          en: "Six treaty states 1857–1871: Hanover (784,296 pieces), Austria (498,657), Prussia (278,491), Saxony (56,739), Brunswick (45,298), Bavaria (3,867); Liechtenstein a treaty party, no own issue<sup>[ref:wikipedia-de-krone-vereinsgoldmuenze]</sup>"
          uk: "Шість держав-учасниць договору 1857–1871: Ганновер (784 296 шт.), Австрія (498 657), Пруссія (278 491), Саксонія (56 739), Брауншвайг (45 298), Баварія (3 867); Ліхтенштейн — учасник договору, власних емісій не мав<sup>[ref:wikipedia-de-krone-vereinsgoldmuenze]</sup>"
