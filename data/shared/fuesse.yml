  description:
    de: |
      <b>Reichsdukatenfuß</b> — der Goldstandard des Heiligen Römischen Reiches, gesetzt durch die <b>Augspurgische Reichsmünzordnung vom 19. August 1559</b> unter Kaiser Ferdinand I., die den Dukaten als neue Reichsgoldmüntze neben den rheinischen Goldgulden stellte.<sup>[ref:wikipedia-de-reichsmuenzordnungen-gold]</sup> Die beiden vorangehenden Reichsmüntzordnungen kennen ihn nicht: Eßlingen 1524 erklärt allein die Cöllnische Marck zum allgemeinen Müntzgewicht, Augspurg 1551 tarifiert den Goldgulden und schweigt zum Dukaten.<sup>[ref:wikipedia-de-reichsmuenzordnungen-gold]</sup> Gekarbt wurde er in deutschen Landen gleichwohl schon seit 1497 — die Ordnung von 1559 gab einer umlaufenden Müntze eine Zahl, nicht umgekehrt.

      <b>Herkunft.</b> Der Dukat entstammt der venezianischen Müntze von 1284, die dem Florentiner Fiorino d'oro von 1252 im Werte gleichstand — «<i>the progenitor of many European gold coins</i>» — und deren Nachahmungen im 14. Jahrhundert von Spanien über Frankreich und die Niederlande biß Ungarn reichten; auf dem Rhein wurde daraus der Rheinische Goldgulden.<sup>[ref:bundesbank-goldmuenzen-mittelalter]</sup> Venedig karbte sein Gold aus ungarischem Metall und senkte das Stückgewicht 1526 auf jene Größe, die in der Cöllnischen Marck 67 Stück ergibt.<sup>[ref:bobzin-muenzchronik-dukat]</sup> Auch das Korn kam nicht von außen: die rheinischen Kurfürsten karbten ihre Florene schon vor 1365 «<i>23⅔karätig</i>», ehe der Gulden in 130 Jahren biß auf 18½ Karat sank.<sup>[ref:jesse-wendischer-muenzverein-goldgulden]</sup> Der Dukat trägt also ein wiedergewonnenes Korn auf einem venezianischen Schrot.

      <b>Rolle.</b> Handelsgold — nicht Landeswährung, sondern die Müntze des Fernhandels; im Ostseeraum galten neben den Reichsdukaten die niederländischen Handelsdukaten als maßgebliche Welthandelsmüntze des 17. und 18. Jahrhunderts.<sup>[ref:mgm-handelsdukat]</sup> Ungarische, venezianische und türkische Dukaten desselben Fußes liefen mit und wurden nach Edelmetallgehalt angenommen.<sup>[ref:museum-rantzau-taler-dukaten]</sup> Gegenüber dem rheinischen Goldgulden, den er 1559 an die zweite Stelle verwies, stand er wie 104 zu 75 Kreutzern.<sup>[ref:bobzin-muenzchronik-dukat]</sup>

      <b>Der Portugaløser</b> gehört demselben Fuß an: ein Zehnfach-Multiplus des Dukatens, keine eigene Rechnungsgrundlage. Sein Vorbild ist der portugiesische <i>Português</i> Manuels I., der von 1499 biß 1557 umlief, gegen zehn Cruzados galt und ungefähr 35 g wog; Hamburg karbte seine Nachahmungen zwischen 1553 und 1560.<sup>[ref:wikipedia-pt-portugues-moeda]</sup> Die Bauart bleibt, die Einheit wechselt: zehn Cruzados in Lissabon, zehn Dukaten im Norden.

      <b>Ende.</b> Der Fuß überdauerte jede Silberreform und wurde noch in der Conventionszeit unverändert zitiert.<sup>[ref:bobzin-muenzchronik-dukat]</sup> Erst das Reichsmüntzgesetz vom 4. Dezember 1871 setzte die Goldmark an seine Stelle; die Demonetisation folgte zum 1. Januar 1876.
    en: |
      <b>Reichsdukatenfuß</b> — the gold standard of the Holy Roman Empire, set by the <b>Augsburg Imperial Coinage Ordinance of 19 August 1559</b> under Emperor Ferdinand I, which admitted the ducat as a new imperial gold coin beside the Rhenish gold gulden.<sup>[ref:wikipedia-de-reichsmuenzordnungen-gold]</sup> The two earlier imperial ordinances do not know it: Esslingen 1524 declares only the Cologne mark as the general coin weight, and Augsburg 1551 tariffs the gold gulden while saying nothing of the ducat.<sup>[ref:wikipedia-de-reichsmuenzordnungen-gold]</sup> German territories had nonetheless been striking ducats since 1497 — the ordinance of 1559 gave a figure to a coin already in circulation, not the reverse.

      <b>Descent.</b> The ducat descends from the Venetian coin of 1284, equal in value to the Florentine fiorino d'oro of 1252 — «<i>the progenitor of many European gold coins</i>» — whose fourteenth-century imitations ran from Spain through France and the Netherlands to Hungary, and on the Rhine became the Rhenish gold gulden.<sup>[ref:bundesbank-goldmuenzen-mittelalter]</sup> Venice struck its ducats from Hungarian metal and in 1526 reduced the piece to the size that yields 67 to the Cologne mark.<sup>[ref:bobzin-muenzchronik-dukat]</sup> The fineness was no import either: the Rhenish electors were striking their florins at «<i>23⅔karätig</i>» before 1365, after which the gulden fell over 130 years to 18½ carats.<sup>[ref:jesse-wendischer-muenzverein-goldgulden]</sup> The ducat therefore carries a recovered fineness on a Venetian weight.

      <b>Role.</b> Trade gold — not a territorial currency but the coin of long-distance commerce; in the Baltic the Dutch trade ducats counted alongside the imperial ones as the leading world trade coin of the 17th and 18th centuries.<sup>[ref:mgm-handelsdukat]</sup> Hungarian, Venetian and Turkish ducats of the same standard circulated with them and were taken by metal content.<sup>[ref:museum-rantzau-taler-dukaten]</sup> Against the Rhenish gold gulden it displaced to second place in 1559 it stood as 104 to 75 Kreuzer.<sup>[ref:bobzin-muenzchronik-dukat]</sup>

      <b>The Portugaløser</b> belongs to this same standard: a tenfold multiple of the ducat, not an accounting basis of its own. Its model is the Portuguese <i>português</i> of Manuel I, which circulated from 1499 to 1557, was worth some ten cruzados and weighed about 35 g; Hamburg struck its imitations between 1553 and 1560.<sup>[ref:wikipedia-pt-portugues-moeda]</sup> The construction stays and the unit changes: ten cruzados in Lisbon, ten ducats in the north.

      <b>End.</b> The standard outlasted every silver reform and was still quoted unchanged in the Convention era.<sup>[ref:bobzin-muenzchronik-dukat]</sup> Only the Imperial Coinage Act of 4 December 1871 put the gold Mark in its place; demonetisation followed on 1 January 1876.
    uk: |
      <b>Reichsdukatenfuß</b> — золотий стандарт Священної Римської імперії, встановлений <b>Авґсбурзьким імперським монетним ордонансом від 19 серпня 1559 р.</b> за імператора Фердинанда I, який допустив дукат як нову імперську золоту монету поряд із рейнським золотим гульденом.<sup>[ref:wikipedia-de-reichsmuenzordnungen-gold]</sup> Два попередні імперські ордонанси його не знають: Есслінген 1524 р. оголошує лише Кельнську марку загальною монетною вагою, Авґсбург 1551 р. тарифікує золотий гульден і про дукат мовчить.<sup>[ref:wikipedia-de-reichsmuenzordnungen-gold]</sup> Проте в німецьких землях дукати карбували вже від 1497 р. — ордонанс 1559 р. дав число монеті, що вже була в обігу, а не навпаки.

      <b>Походження.</b> Дукат походить від венеційської монети 1284 р., рівної за вартістю флорентійському fiorino d'oro 1252 р. — «<i>the progenitor of many European gold coins</i>», — чиї наслідування в XIV ст. сягали від Іспанії через Францію й Нідерланди до Угорщини, а на Рейні стали рейнським золотим гульденом.<sup>[ref:bundesbank-goldmuenzen-mittelalter]</sup> Венеція карбувала свої дукати з угорського металу й 1526 р. знизила вагу штуки до тієї величини, що дає 67 штук із Кельнської марки.<sup>[ref:bobzin-muenzchronik-dukat]</sup> Проба теж не була запозиченням ззовні: рейнські курфюрсти карбували свої флорени «<i>23⅔karätig</i>» ще до 1365 р., після чого гульден за 130 років упав до 18½ карата.<sup>[ref:jesse-wendischer-muenzverein-goldgulden]</sup> Отже дукат несе відновлену пробу на венеційській вазі.

      <b>Роль.</b> Торгове золото — не земельна валюта, а монета далекої торгівлі; на Балтиці поряд з імперськими дукатами нідерландські торгові дукати правили за провідну світову торгову монету XVII-XVIII ст.<sup>[ref:mgm-handelsdukat]</sup> Угорські, венеційські й турецькі дукати тієї самої стопи ходили разом і приймалися за вмістом дорогоцінного металу.<sup>[ref:museum-rantzau-taler-dukaten]</sup> Проти рейнського золотого гульдена, який він 1559 р. відсунув на друге місце, він стояв як 104 до 75 крейцерів.<sup>[ref:bobzin-muenzchronik-dukat]</sup>

      <b>Portugaløser</b> належить до тієї самої стопи: десятикратний множник дуката, а не окрема розрахункова основа. Його зразок — португальський <i>português</i> Мануела I, що ходив від 1499 до 1557 р., вартував близько десяти крузадо й важив приблизно 35 г; Гамбург карбував свої наслідування між 1553 і 1560 рр.<sup>[ref:wikipedia-pt-portugues-moeda]</sup> Будова лишається, одиниця змінюється: десять крузадо в Лісабоні, десять дукатів на півночі.

      <b>Кінець.</b> Стопа пережила кожну срібну реформу й ще в конвенційну добу цитувалася незмінно.<sup>[ref:bobzin-muenzchronik-dukat]</sup> Лише Імперський монетний закон від 4 грудня 1871 р. поставив на її місце золоту марку; демонетизація настала 1 січня 1876 р.
    da: '<b>Reichsdukatenfuß</b> — Det Tysk-romerske Riges guldstandard, fastsat ved <b>Augspurgische Reichsmünzordnung af 19. august 1559</b> under kejser Ferdinand 1., som stillede dukaten som ny rigsguldmønt ved siden af den rhinske guldgylden.<sup>[ref:wikipedia-de-reichsmuenzordnungen-gold]</sup> De to forudgående rigsmøntordninger kender den ikke: Esslingen 1524 erklærer alene Cöllnische Marck for almindelig møntvægt, og Augsburg 1551 tariferer guldgyldenen og tier om dukaten.<sup>[ref:wikipedia-de-reichsmuenzordnungen-gold]</sup> Præget blev den i de tyske lande ikke desto mindre allerede fra 1497 — ordningen af 1559 gav et tal til en mønt, der allerede løb, ikke omvendt.


  <b>Oprindelse.</b> Dukaten stammer fra den venetianske mønt fra 1284, der i værdi svarede til den florentinske fiorino d''oro fra 1252 — «<i>the progenitor of many European gold coins</i>» — og hvis efterligninger i 1300-tallet rakte fra Spanien over Frankrig og Nederlandene til Ungarn; ved Rhinen blev den til den rhinske guldgylden.<sup>[ref:bundesbank-goldmuenzen-mittelalter]</sup> Venedig prægede sit guld af ungarsk metal og satte i 1526 stykvægten ned til netop den størrelse, der giver 67 stykker af Cöllnische Marck.<sup>[ref:bobzin-muenzchronik-dukat]</sup> Heller ikke lødigheden kom udefra: de rhinske kurfyrster prægede allerede før 1365 deres floriner «<i>23⅔karätig</i>», før gyldenen i løbet af 130 år sank til 18½ karat.<sup>[ref:jesse-wendischer-muenzverein-goldgulden]</sup> Dukaten bærer altså en genvundet lødighed på et venetiansk skrot.


  <b>Rolle.</b> Handelsguld — ikke landsvaluta, men fjernhandelens mønt; i Østersøområdet gjaldt ved siden af rigsdukaterne de nederlandske handelsdukater som 1600- og 1700-tallets toneangivende verdenshandelsmønt.<sup>[ref:mgm-handelsdukat]</sup> Ungarske, venetianske og tyrkiske dukater af samme fod løb med og blev modtaget efter ædelmetalindhold.<sup>[ref:museum-rantzau-taler-dukaten]</sup> Over for den rhinske guldgylden, som den i 1559 henviste til andenpladsen, stod den som 104 til 75 kreutzer.<sup>[ref:bobzin-muenzchronik-dukat]</sup>


  <b>Portugaløseren</b> hører til samme fod: et tidobbelt multiplum af dukaten, ikke et selvstændigt regningsgrundlag. Forbilledet er den portugisiske <i>Português</i> under Manuel 1., som løb fra 1499 til 1557, gjaldt ti cruzados og vejede omtrent 35 g; Hamborg prægede sine efterligninger mellem 1553 og 1560.<sup>[ref:wikipedia-pt-portugues-moeda]</sup> Bygningen bliver, enheden skifter: ti cruzados i Lissabon, ti dukater i Norden.


  <b>Ophør.</b> Foden overlevede enhver sølvreform og blev endnu i konventionstiden citeret uændret.<sup>[ref:bobzin-muenzchronik-dukat]</sup> Først Münzgesetz vom 4. Dezember 1871 satte guldmarken i dens sted; demonetiseringen fulgte 1. januar 1876.

  '
