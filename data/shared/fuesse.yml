        <b>1 Sølvgylden</b> = <b>2 Mark Danske</b> = <b>24 ß</b> = 72 Hvid (Wilcke 7-2 S. 192-193 Lybsk-aligned subdivision)<br>
        <b>1 Mark</b> (12 ß) = <b>9,301 g</b> fein · <b>½ Mark</b> (6 ß) = 4,650 g · <b>4 ß</b> = 2,625 g · <b>4-Hvid ß</b> (Scheide) = 0,778 g fein<br>
        <em>Frederik I's Lybsk-aligned 12-ß-Mark (24 ß = 1 Sølvgylden) ist ein Übergang in Richtung Hansestädernes Münzgewohnheit — Wilcke 7-2 S. 193 verbatim «<i>Mynten ville udgøre eens og liig ved vores Mynt (o: Hertugdømmets) og udi de Vendiske Stæder</i>» — aber die Fein-Probe bleibt 14 Lod, NICHT die Lybsk-Standard 14½ Lod. Reine Reckoning-Annäherung; volle metrische Konvergenz mit Schleswig-Holstein-Lybsk erst 1547 (Flensborg Bestalling).</em>
      en: |-
        <b>1 Sølvgylden</b> = 29.232 g rough / <b>25.578 g fine</b> at 14 Lod (Wilcke 1950 Kap. 7-2 p. 187)<sup>[ref:wilcke-1950-renaissance-moent]</sup><br><b>1 Sølvgylden</b> = <b>2 Mark Danske</b> = <b>24 ß</b> = 72 Hvid (Wilcke 7-2 pp. 192-193 Lybsk-aligned subdivision)<br><b>1 Mark</b> (12 ß) = <b>9.301 g</b> fine · <b>½ Mark</b> (6 ß) = 4.650 g · <b>4 ß</b> = 2.625 g · <b>4-Hvid ß</b> (Scheide) = 0.778 g fine<br><em>Frederik I's Lybsk-aligned 12-ß-Mark (24 ß = 1 Sølvgylden) is a step toward Hansestädernes coinage habits — Wilcke 7-2 p. 193 verbatim «<i>Mynten ville udgøre eens og liig ved vores Mynt (o: Hertugdømmets) og udi de Vendiske Stæder</i>» — but the fineness stays at 14 Lod, NOT the Lybsk standard 14½ Lod. Pure reckoning convergence; full metric convergence with Schleswig-Holstein-Lybsk only in 1547 (Flensborg Bestalling).</em>
      uk: |-
        <b>1 Sølvgylden</b> = 29,232 г повної / <b>25,578 г чистого</b> за 14 Lod (Wilcke 1950 Kap. 7-2 с. 187)<sup>[ref:wilcke-1950-renaissance-moent]</sup><br><b>1 Sølvgylden</b> = <b>2 Mark Danske</b> = <b>24 ß</b> = 72 Hvid (Wilcke 7-2 с. 192-193 Lybsk-aligned-підструктура)<br><b>1 Mark</b> (12 ß) = <b>9,301 г</b> чистого · <b>½ Mark</b> (6 ß) = 4,650 г · <b>4 ß</b> = 2,625 г · <b>4-Hvid ß</b> (Scheide) = 0,778 г чистого<br><em>Lybsk-aligned 12-ß-Mark Frederik I (24 ß = 1 Sølvgylden) — крок до монетних звичаїв Hansestäder — Wilcke 7-2 с. 193 verbatim «<i>Mynten ville udgøre eens og liig ved vores Mynt (o: Hertugdømmets) og udi de Vendiske Stæder</i>» — але проба залишається 14 Lod, НЕ Lybsk-стандарт 14½ Lod. Виключно reckoning-зближення; повна метрична конвергенція з Schleswig-Holstein-Lybsk лише 1547 р. (Flensborg Bestalling).</em>
      da: '<b>1 sølvgylden</b> = 29,232 g rå / <b>25,578 g fin</b> ved 14 lod (Wilcke 1950 kap. 7-2 s. 187)<sup>[ref:wilcke-1950-renaissance-moent]</sup><br>

  <b>1 sølvgylden</b> = <b>2 mark danske</b> = <b>24 ß</b> = 72 hvid (Wilcke 7-2 s. 192-193, den lybsk-tilpassede underdeling)<br>

  <b>1 mark</b> (12 ß) = <b>9,301 g</b> fin · <b>½ mark</b> (6 ß) = 4,650 g · <b>4 ß</b> = 2,625 g · <b>4-hvids skilling</b> (skillemønt) = 0,778 g fin<br>

  <em>Frederik 1.s lybsk-tilpassede 12-ß-mark (24 ß = 1 sølvgylden) er et skridt i retning af hansestædernes møntskik — Wilcke 7-2 s. 193 ordret «<i>Mynten ville udgøre eens og liig ved vores Mynt (o: Hertugdømmets) og udi de Vendiske Stæder</i>» — men lødigheden bliver 14 lod og IKKE den lybske standard på 14½ lod. En ren regningsmæssig tilnærmelse; fuld metrisk konvergens med det slesvig-holstensk-lybske sker først i 1547 (Flensborg-bestallingen).</em>

  '
  description:
    de: '<b>Frederik Is Müntzfuß-Norm nach der Absetzung Christians II.</b>, etabliert durch die <b>Møntordning vom 25. Februar 1524</b> (København, Wilcke 1950 Kap. 7-2 S. 184-187)<sup>[ref:denmark-ref29-no-url]</sup>. Königliche Verordnung verbatim: «<i>Vi Fr. ... at slaa, i Guld: Nobler (den vegne Mark skal holde 23½ Karat og skraade 16 Stkr.), Rinske Gylden (18 Karat, 72 Stkr.) ...</i>» — und auf der Silber-Seite: <b>acht Sølvgylden</b> aus der Cölln. Marck rauh bei <b>14 Lod (.875)</b>, 29,232 g rauh / 25,578 g fein je Stück, Marken-fin <b>mf 9,143</b>. Gegenüber Christian IIs Lovkompleks 1514 wird die Sølvgylden-Stückzahl von 8½/M auf 8/M gestrafft — Frederik I erhöht das Per-Stück-Gewicht um 6,3 % bei unveränderter 14-Lod-Probe. Innovation: <b>Lybsk-aligned 24-ß-Mark-Subdivision</b> (vs Christian-IIs 32-ß-Tarif) — Wilcke 7-2 S. 193 verbatim «<i>Mynten ville udgøre eens og liig ved vores Mynt (o: Hertugdømmets) og udi de Vendiske Stæder</i>». Vollständiger Sub-Mark-Apparat: 2 Mark Danske / 1 Mark / ½ Mark / 4 ß / 4-Hvid ß / Hvid. Separater Akt 26. Februar 1524 etabliert das <b>14-Penning-Stück</b> («14 %») als Klipping-Indfrielse-Mønt — Christian-IIs Klippinge werden gegen 14-Penning-Stücke umgetauscht. Hauptphase 1524-1531; finale Konsolidierung 1532 (Galster 47-52 Sølvgylden-Serie). Standard endet mit Frederik Is Tod 10. April 1533; der Christian-III-Interregnum 1534-1540 läuft unter [fuss:8_daler_fod] Phase 0, de jure konsolidiert durch Christian IIIs Møntordning von 1541 (14½ Lod, 8 Daler/M).'
    en: '<b>Frederik I''s coinage-standard norm after the deposition of Christian II</b>, established by the <b>Møntordning of 25 February 1524</b> (Copenhagen, Wilcke 1950 Kap. 7-2 pp. 184-187)<sup>[ref:denmark-ref29-no-url]</sup>. Royal decree verbatim: «<i>Vi Fr. ... at slaa, i Guld: Nobler (den vegne Mark skal holde 23½ Karat og skraade 16 Stkr.), Rinske Gylden (18 Karat, 72 Stkr.) ...</i>» — and on the silver side: <b>eight Sølvgylden</b> per Cologne mark rough at <b>14 Lod (.875)</b>, 29.232 g rough / 25.578 g fine per piece, Marken-fin <b>mf 9.143</b>. Compared with Christian II''s Lovkompleks of 1514, the Sølvgylden count is tightened from 8½/M to 8/M — Frederik I raises the per-piece weight by 6.3 % at unchanged 14-Lod fineness. Innovation: <b>Lybsk-aligned 24-ß Mark subdivision</b> (vs Christian II''s 32-ß tariff) — Wilcke 7-2 p. 193 verbatim «<i>Mynten ville udgøre eens og liig ved vores Mynt (o: Hertugdømmets) og udi de Vendiske Stæder</i>». Full sub-Mark apparatus: 2 Mark Danske / 1 Mark / ½ Mark / 4 ß / 4-Hvid ß / Hvid. Separate act of 26 February 1524 establishes the <b>14-Penning piece</b> («14 %») as Klipping redemption coin — Christian II''s Klippinge are exchanged for 14-Penning pieces. Main phase 1524-1531; final consolidation 1532 (Galster 47-52 Sølvgylden series). Standard ends with Frederik I''s death 10 April 1533; the Christian III interregnum 1534-1540 runs under [fuss:8_daler_fod] Phase 0, consolidated de jure by Christian III''s Møntordning of 1541 (14½ Lod, 8 Daler/M).'
    uk: '<b>Норма монетної стопи Frederik I після скинення Кристіана II</b>, запроваджена <b>Møntordning від 25 лютого 1524</b> (Копенгаген, Wilcke 1950 Kap. 7-2 с. 184-187)<sup>[ref:denmark-ref29-no-url]</sup>. Королівський декрет verbatim: «<i>Vi Fr. ... at slaa, i Guld: Nobler (den vegne Mark skal holde 23½ Karat og skraade 16 Stkr.), Rinske Gylden (18 Karat, 72 Stkr.) ...</i>» — а на срібному боці: <b>вісім Sølvgylden</b> з повної кельнської марки за <b>14 Lod (.875)</b>, 29,232 г повної / 25,578 г чистого на штуку, Marken-fin <b>mf 9,143</b>. Порівняно з Lovkompleks Кристіана II 1514, кількість Sølvgylden стиснута з 8½/M до 8/M — Frederik I підвищує вагу на штуку на 6,3 % за незмінної 14-Lod проби. Інновація: <b>Lybsk-aligned 24-ß Mark-підструктура</b> (vs тариф Кристіана II 32 ß) — Wilcke 7-2 с. 193 verbatim «<i>Mynten ville udgøre eens og liig ved vores Mynt (o: Hertugdømmets) og udi de Vendiske Stæder</i>». Повний sub-Mark-апарат: 2 Mark Danske / 1 Mark / ½ Mark / 4 ß / 4-Hvid ß / Hvid. Окремий акт 26 лютого 1524 встановлює <b>14-Penning-штуку</b> («14 %») як Klipping-обмінну монету — Klippinge Кристіана II обмінюються на 14-Penning штуки. Головна фаза 1524-1531; фінальна консолідація 1532 (серія Galster 47-52 Sølvgylden). Стандарт завершується смертю Frederik I 10 квітня 1533; інтеррегнум Кристіана III 1534-1540 проходить під [fuss:8_daler_fod] Phase 0, де-юре консолідований Møntordning Кристіана III 1541 р. (14½ Lod, 8 Daler/M).'
    da: '<b>Frederik 1.s møntfodsnorm efter afsættelsen af Christian 2.</b>, etableret ved <b>Møntordning af 25. februar 1524</b> (København, Wilcke 1950 kap. 7-2 s. 184-187)<sup>[ref:denmark-ref29-no-url]</sup>. Den kongelige forordning ordret: «<i>Vi Fr. ... at slaa, i Guld: Nobler (den vegne Mark skal holde 23½ Karat og skraade 16 Stkr.), Rinske Gylden (18 Karat, 72 Stkr.) ...</i>» — og på sølvsiden: <b>otte sølvgylden</b> af den rå Cölln. Marck ved <b>14 lod (.875)</b>, 29,232 g rå / 25,578 g fin pr. stykke, marken fin <b>mf 9,143</b>. Over for Christian 2.s lovkompleks af 1514 strammes sølvgyldenens styktal fra 8½ til 8 pr. mark — Frederik 1. øger vægten pr. stykke med 6,3 % ved uændret lødighed på 14 lod. Nyskabelsen er den <b>lybsk-tilpassede markinddeling i 24 ß</b> (mod Christian 2.s tarif i 32 ß) — Wilcke 7-2 s. 193 ordret «<i>Mynten ville udgøre eens og liig ved vores Mynt (o: Hertugdømmets) og udi de Vendiske Stæder</i>». Et fuldstændigt apparat under marken: 2 mark danske / 1 mark / ½ mark / 4 ß / 4-hvids skilling / hvid. En særskilt akt af 26. februar 1524 gør <b>14-penningstykket</b> («14 %») til indløsningsmønt for klippingene — Christian 2.s klippinge byttes mod 14-penningstykker. Hovedfasen 1524-1531; den afsluttende konsolidering i 1532 (sølvgyldenserien Galster 47-52). Standarden ophører med Frederik 1.s død 10. april 1533; interregnet under Christian 3. 1534-1540 løber under [fuss:8_daler_fod] fase 0 og konsolideres de jure ved Christian 3.s møntordning af 1541 (14½ lod, 8 daler pr. mark).'
