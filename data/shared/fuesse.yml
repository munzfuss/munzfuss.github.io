          en: "<b>no fixed tariff</b> — pure trade coin · the market rate at Au:Ag 1:15.5 yields 1 Vereinskrone ≈ 9.3 Taler Talerwährung<sup>[ref:wikipedia-de-krone-vereinsgoldmuenze]</sup>"
          uk: "<b>фіксованого тарифу немає</b> — суто торгова монета · ринковий курс при Au:Ag 1:15,5 дає 1 Vereinskrone ≈ 9,3 Taler Talerwährung<sup>[ref:wikipedia-de-krone-vereinsgoldmuenze]</sup>"
