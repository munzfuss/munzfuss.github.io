        value:
          de: "<b>10½ Krone je Cöllnische Marck Raulegierung von 10¾ Loth</b> · 22,272 g rau je Krone · 11,136 g rau je ½ Krone · 5,568 g rau je ¼ Krone — Norwegen ab 1649, Dänemark ab 1652, letzte Prägung 1732<sup>[ref:hede-1957-kronemoenten-nnum]</sup>"
          en: "<b>10½ Krone per Cologne mark of raw alloy at 10¾ Loth</b> · 22.272 g rough per Krone · 11.136 g rough per ½ Krone · 5.568 g rough per ¼ Krone — Norway from 1649, Denmark from 1652, last struck 1732<sup>[ref:hede-1957-kronemoenten-nnum]</sup>"
          uk: "<b>10½ Krone з кельнської марки сплаву проби 10¾ Loth</b> · 22,272 г повної ваги на Krone · 11,136 г на ½ Krone · 5,568 г на ¼ Krone — Норвегія з 1649 р., Данія з 1652 р., останнє карбування 1732 р.<sup>[ref:hede-1957-kronemoenten-nnum]</sup>"
          da: <b>10½ krone pr. Cöllnische Marck rå legering af 10¾ lod</b> · 22,272 g rå pr. krone · 11,136 g rå pr. ½ krone · 5,568 g rå pr. ¼ krone — Norge fra 1649, Danmark fra 1652, sidste prægning 1732<sup>[ref:hede-1957-kronemoenten-nnum]</sup>
