    subheading:
      de: "Cöllnische Marck rauh = 233,856 g Silberlegierung · Probe 14 Lod = 875 ‰ · 8 Sølvgylden aus der Cölln. Marck rauh (Møntordning vom 25. Februar 1524, Wilcke 1950 Kap. 7-2 S. 184-187) · per Sølvgylden 29,232 g rauh / <b>25,578 g fein</b> · Marken-fin <b>mf 9,143</b>"
      en: "Cologne mark rough = 233.856 g silver alloy · fineness 14 Lod = 875 ‰ · 8 Sølvgylden per Cologne mark rough (Møntordning of 25 February 1524, Wilcke 1950 Kap. 7-2 pp. 184-187) · per Sølvgylden 29.232 g rough / <b>25.578 g fine</b> · Marken-fin <b>mf 9.143</b>"
      uk: "Кельнська марка повна = 233,856 г срібного сплаву · проба 14 Lod = 875 ‰ · 8 Sølvgylden з повної кельнської марки (Møntordning 25 лютого 1524, Wilcke 1950 Kap. 7-2 с. 184-187) · на Sølvgylden 29,232 г повної / <b>25,578 г чистого</b> · Marken-fin <b>mf 9,143</b>"
      da: Cöllnische Marck rå = 233,856 g sølvlegering · lødighed 14 lod = 875 ‰ · 8 sølvgylden af den rå Cölln. Marck (Møntordning af 25. februar 1524, Wilcke 1950 kap. 7-2 s. 184-187) · pr. sølvgylden 29,232 g rå / <b>25,578 g fin</b> · marken fin <b>mf 9,143</b>
