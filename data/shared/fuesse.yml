          de: "<b>16,250 g fein je Krone</b> · 32,500 g fein je Doppelkrone · 8,125 g fein je ½ Krone · 4,0625 g fein je ¼ Krone — direkt aus dem Schou-Katalog (Wikipedia und Schrötter <i>Wörterbuch der Münzkunde</i> 1930 zitieren dieselben 32,5 g für die Doppelkrone)<sup>[ref:wikipedia-de-corona-danica]</sup><sup>[ref:schroetter-wb-muenzkunde-1930]</sup><sup>[ref:hede-1957-kronemoenten-nnum]</sup>"
