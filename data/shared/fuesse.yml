    subheading:
      de: "<b>Englischer Münzfuß, nicht die Cöllnische Marck:</b> der Unite Jakobs I. ist eine englische Kronengold-Prägung — <b>Troy-Pfund rauh = 5760 Gran ≈ 373,24 g</b> · <b>Kronengold 22 Karat (≈ 916 ‰)</b> · Nennwert <b>20 Schilling = 1 Pfund</b> (1612 auf 22 Schilling erhöht) · Rauhgewicht <b>≈ 154,8 Gran ≈ 10,03 g</b>, Durchmesser 35-37 mm<sup>[ref:taxfreegold-james-i-unite]</sup> ⇒ die Indentur vom 11. November 1604 setzt das Pfund Kronengold auf <b>£37 4s in tale</b> (Unite zu 20 Schilling) = <b>37,2 Stück je Troy-Pfund</b>, gerechnet auf das <b>Pfund Kronengold (Raulegierung), nicht auf Feingold</b><sup>[ref:leake-1793-james-i-unite-indenture]</sup>. Für die dänischen Stücke ist der Feingehalt <b>nicht quellenbelegt</b> (Hede: «Finhed ?») und aus diesem Unite-Standard abgeleitet. Leit-Stück <b>1 Sovereign ca. 10,0 g rauh</b> (Hede 19, 1608 Helsingør)<sup>[ref:danskmoent-c4h19-sovereign]</sup> · gesamter Hede-Strang 19-22 als <b>«Prøvemønt efter engelsk forbillede»</b> klassifiziert (Versuchsgold nach Christians IV. Englandreise 1606)<sup>[ref:stacksbowers-bruun-sovereign-1608]</sup>"
      en: "<b>An English mint standard, not the Cologne mark:</b> James I's Unite is an English crown-gold coinage — <b>Troy pound rough = 5760 grains ≈ 373.24 g</b> · <b>crown gold 22 carat (≈ 916 ‰)</b> · face value <b>20 shillings = £1</b> (raised to 22 shillings in 1612) · rough weight <b>≈ 154.8 grains ≈ 10.03 g</b>, diameter 35-37 mm<sup>[ref:taxfreegold-james-i-unite]</sup> ⇒ the indenture of 11 November 1604 sets the pound of crown gold at <b>£37 4s in tale</b> (Unite at 20 shillings) = <b>37.2 pieces per Troy pound</b>, reckoned on the <b>pound of crown gold (standard alloy), not on fine gold</b><sup>[ref:leake-1793-james-i-unite-indenture]</sup>. For the Danish pieces the fineness is <b>not source-attested</b> (Hede: «fineness ?») and inferred from this Unite standard. Lead piece <b>1 Sovereign ca. 10.0 g rough</b> (Hede 19, 1608 Helsingør)<sup>[ref:danskmoent-c4h19-sovereign]</sup> · the whole Hede 19-22 strand is classified as <b>«Prøvemønt efter engelsk forbillede»</b> (trial gold after Christian IV''s 1606 England journey)<sup>[ref:stacksbowers-bruun-sovereign-1608]</sup>"
      uk: "<b>Англійський монетний стандарт, не кельнська марка:</b> Unite Джеймса I — англійське карбування коронного золота: <b>тройський фунт повний = 5760 гранів ≈ 373,24 г</b> · <b>коронне золото 22 карати (≈ 916 ‰)</b> · номінал <b>20 шилінгів = 1 фунт</b> (1612 підвищено до 22 шилінгів) · повна вага <b>≈ 154,8 грана ≈ 10,03 г</b>, діаметр 35-37 мм<sup>[ref:taxfreegold-james-i-unite]</sup> ⇒ індентура 11 листопада 1604 встановлює фунт коронного золота на <b>£37 4s in tale</b> (Unite по 20 шилінгів) = <b>37,2 монети з тройського фунта</b>, лічено на <b>фунт коронного золота (сплав, rau), не на чисте золото</b><sup>[ref:leake-1793-james-i-unite-indenture]</sup>. Для данських стуків проба <b>джерелами не підтверджена</b> (Hede: «Finhed ?») і виведена з цього стандарту Unite. Провідний стук <b>1 Sovereign бл. 10,0 г повної</b> (Hede 19, 1608 Helsingør)<sup>[ref:danskmoent-c4h19-sovereign]</sup> · увесь ряд Hede 19-22 класифіковано як <b>«Prøvemønt efter engelsk forbillede»</b> (пробне золото після візиту Кристіана IV в Англію 1606)<sup>[ref:stacksbowers-bruun-sovereign-1608]</sup>"
      da: '<b>En engelsk møntfod, ikke Cöllnische Marck:</b> Jakob 1.s unite er en engelsk prægning i kronguld — <b>troypund rå = 5760 grain ≈ 373,24 g</b> · <b>kronguld 22 karat (≈ 916 ‰)</b> · pålydende <b>20 shilling = 1 pund</b> (i 1612 hævet til 22 shilling) · bruttovægt <b>≈ 154,8 grain ≈ 10,03 g</b>, diameter 35-37 mm<sup>[ref:taxfreegold-james-i-unite]</sup> ⇒ indenturen af 11. november 1604 sætter pundet kronguld til <b>£37 4s in tale</b> (uniten til 20 shilling) = <b>37,2 stykker pr. troypund</b>, regnet på <b>pundet kronguld (rå legering), ikke på finguld</b><sup>[ref:leake-1793-james-i-unite-indenture]</sup>. For de danske stykker er lødigheden <b>ikke kildebelagt</b> (Hede: «Finhed ?») og udledt af denne unite-standard. Hovedstykket <b>1 sovereign ca. 10,0 g rå</b> (Hede 19, 1608 Helsingør)<sup>[ref:danskmoent-c4h19-sovereign]</sup> · hele Hede-strengen 19-22 klassificeret som <b>«Prøvemønt efter engelsk forbillede»</b> (forsøgsguld efter Christian 4.s Englandsrejse i 1606)<sup>[ref:stacksbowers-bruun-sovereign-1608]</sup>'
