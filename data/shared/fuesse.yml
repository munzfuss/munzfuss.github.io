  description:
    de: Tehmnischer Sammelbucket für bulk-importierte Stücke aus ucoin, deren endgültige Müntzfuß-Klassifikation noch aussteht. Soll-Werte sind hier nicht definiert; einzelne Münzen tragen ihre eigenen Roh- und Feingewichte aus der Quelle. Künftige per-Münze-Bearbeitung verschiebt jeden Eintrag in den passenden eigentlichen Müntzfuß.
    en: Technical catch-all bucket for bulk-imported pieces from ucoin whose final coinage-standard classification is still pending. Soll values are not defined here; individual coins carry their own rough and fine weights from the source. Future per-coin work moves each entry to its proper coinage standard.
    uk: Технічний загальний кошик для bulk-імпортованих монет із ucoin, у яких остаточну класифікацію стопи ще не виконано. Soll-значення тут не визначено; окремі монети несуть власні значення повної ваги й чистого зі джерела. Майбутня per-coin робота переміщує кожен запис у належну стопу.
    da: Teknisk samlebucket for stykker importeret i bulk fra ucoin, hvis endelige møntfodsplacering endnu udestår. Sollværdier er ikke defineret her; de enkelte mønter bærer deres egne brutto- og finvægte fra kilden. Senere bearbejdning mønt for mønt flytter hver post over i den møntfod, den rettelig hører til.
