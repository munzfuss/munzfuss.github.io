        <b>1 Goldgulden</b> (Rhinsk Gylden) — main denomination across all phases · as a double denomination <b>2 Goldgulden</b> (Christian III, 1546, Flensburg)<sup>[ref:danskmoent-c3-rhinsk-gylden-1546]</sup>.<br>Tariff: <b>1 Goldgulden ≈ 0.71-0.73 Reichsdukat</b> (by fine weight, no formal tariff) ≈ <b>20 ß lybsk</b> · ≈ <b>1½ Mark Dansk</b> (1620s)<sup>[ref:danskmoent-1rhinsk-gylden]</sup>
      uk: |-
        <b>1 Goldgulden</b> (Rhinsk Gylden) — головний номінал через усі фази · як подвійний номінал <b>2 Goldgulden</b> (Кристіан III, 1546, Фленсбург)<sup>[ref:danskmoent-c3-rhinsk-gylden-1546]</sup>.<br>Тариф: <b>1 Goldgulden ≈ 0,71-0,73 Reichsdukat</b> (за чистою вагою, без формального тарифу) ≈ <b>20 ß lybsk</b> любекських · ≈ <b>1½ Mark Dansk</b> (1620-ті)<sup>[ref:danskmoent-1rhinsk-gylden]</sup>
      da: '<b>1 guldgylden</b> (rhinsk gylden) — hovednominalet gennem alle faser · som dobbeltnominal <b>2 guldgylden</b> (Christian 3., 1546, Flensborg)<sup>[ref:danskmoent-c3-rhinsk-gylden-1546]</sup>.<br>Tarif: <b>1 guldgylden ≈ 0,71-0,73 rigsdukat</b> (efter finvægt, ingen formel tarif) ≈ <b>20 ß lybsk</b> · ≈ <b>1½ mark dansk</b> (1620''erne)<sup>[ref:danskmoent-1rhinsk-gylden]</sup>'
    aside_label:
      de: "Verhältnis zu anderen Goldfüßen"
      en: "Relation to other gold standards"
      uk: "Відношення до інших золотих стоп"
      da: Forholdet til de øvrige guldfødder
    aside:
      de: "Der leichteste der drei dänischen Goldstränge: mit ~3,25 g rauh rund ein Viertel des Gewichts des zeitgleichen [fuss:nobel_fod] (~14,6 g, .979). Im Gewichtsband des Goldgulden steht ihm der Ungersk Gylden / Dukat ([fuss:reichsdukatenfuss], ~3,49 g) am nächsten — dieselbe Größenordnung, aber deutlich höhere Probe (.986 gegen .77): die ungarische Dukaten-Tradition neben der rheinischen Gulden-Tradition, zwei parallele Handelsgold-Standards. Keine feste Tarifbindung an den silbernen Speciedaler oder die Guldkrone."
      en: "The lightest of the three Danish gold lines: at ~3.25 g rough about a quarter of the weight of the contemporary [fuss:nobel_fod] (~14.6 g, .979). In the Goldgulden weight band its nearest neighbour is the Ungersk Gylden / Dukat ([fuss:reichsdukatenfuss], ~3.49 g) — the same order of magnitude but a markedly higher fineness (.986 vs .77): the Hungarian ducat tradition alongside the Rhenish gulden tradition, two parallel trade-gold standards. No fixed tariff link to the silver Speciedaler or the Guldkrone."
      uk: "Найлегший із трьох данських золотих напрямів: за ~3,25 г повної ваги — близько чверті ваги тогочасного [fuss:nobel_fod] (~14,6 г, .979). У ваговому діапазоні Goldgulden найближчий до нього Ungersk Gylden / Dukat ([fuss:reichsdukatenfuss], ~3,49 г) — той самий порядок величини, але помітно вища проба (.986 проти .77): угорська дукатна традиція поряд із рейнською гульденовою, два паралельні стандарти торгового золота. Без жорсткої тарифної прив'язки до срібного Speciedaler чи Guldkrone."
      da: 'Den letteste af de tre danske guldstrenge: med ~3,25 g rå omkring en fjerdedel af vægten af den samtidige [fuss:nobel_fod] (~14,6 g, .979). Inden for guldgyldenens vægtbånd står den ungerske gylden, altså dukaten ([fuss:reichsdukatenfuss], ~3,49 g), den nærmest — samme størrelsesorden, men en markant højere lødighed (.986 mod .77): den ungarske dukattradition ved siden af den rhinske gyldentradition, to parallelle standarder for handelsguld. Ingen fast tarifbinding til den sølvbaserede speciedaler eller til guldkronen.'
  description:
    de: '<b>Dänische Königsmünz-Variante der Rhenish-Gulden-Tradition</b>: Der rheinische Goldgulden war die führende Goldhandels- und Rechnungsmünze des Heiligen Römischen Reichs<sup>[ref:rheinischer-gulden-imperial-handelsmuenze]</sup>, weshalb die dänische Krone ihn als Handelsmünze für den reichsweiten Markt nachprägte. Die Probe wurde de jure durch die <b>Christian-II-Møntordning (Sommer 1514)</b> und die <b>Frederik-I-Ordonnanz vom 25. Februar 1524</b> auf <b>18 Karat (.750)</b> bei 72 Stück je rauer Cölln. Marck festgelegt<sup>[ref:wilcke-rhinsk-gylden-1514-standard]</sup><sup>[ref:wilcke-rhinsk-gylden-1524-standard]</sup>. Die Reichsnorm selbst stand biß dahin auf der von den vier Rheinischen Kurfürsten 1490 vertheileten Form — 71⅓ Stück je Marck bei 18½ Karat<sup>[ref:wilcke6-rhinfyrster-1490-norm]</sup> —, die Karl V. in seiner Müntzordnung vom 28. Juli 1551 aufrecht erhielt<sup>[ref:wilcke6-karl-v-moentordning-1551]</sup>; erst Kaiser Ferdinands I. Müntzedikt vom 19. August 1559 setzte sie auf 72 Stück je 18½-karätiger Marck<sup>[ref:wilcke6-ferdinand-moentedikt-1559]</sup>, worauf Friedrich II. ab 1563 in eben diesem Korn karbte. Die Abschnitte scheiden sich danach, welche Ordonnanz jeweils galt. Die Karbung unter <b>Hans</b> (~1496-1510) geht jeder dänischen Goldordonnanz voraus und mißt sich allein an der Reichsnorm; die deutschen Wardeiner fanden sie 1551 «<i>kun ca. 3/4 Karat</i>» darunter, also bei 17¾ Karat<sup>[ref:wilcke6-valvationstag-1551]</sup>, und Wilcke ordnet dieses Gold der Soldzahlung an die deutschen Söldner im Krieg gegen Sten Sture zu<sup>[ref:danskmoent-hans-rhinsk-gylden-1497]</sup>. Ab 1514 gilt die dänische Vorgabe von 18 Karat, unter der <b>Frederik I.</b><sup>[ref:danskmoent-f1-rhinsk-gylden-1527]</sup> und <b>Christian III.</b><sup>[ref:danskmoent-c3g131-roskilde]</sup> biß 1547 karben — wobei deren Stücke der 1530er Jahre mit 18⅓ Karat über der Vorgabe und auf der im Reich üblichen Ausbringung liegen. Von 1563 an karbt <b>Frederik II.</b> nach dem kaiserlichen Edikt von 1559 zu 18½ Karat<sup>[ref:danskmoent-1rhinsk-gylden]</sup>. Für die Wiederaufnahme unter <b>Christian IV.</b> 1625-1632, zur Zeit des <b>Kaiserlich-Dänischen Krieges</b>, ist keine Ordonnanz überliefert: die 18¼ Karat (.76) sind ein Befund an den erhaltenen Stücken<sup>[ref:danskmoent-1rhinsk-gylden]</sup>, und die Ausbringungsverhältnisse von 1559 galten fort<sup>[ref:wilcke6-ferdinand-moentedikt-1559]</sup>. Neben der königlichen Reihe läuft von 1619 biß 1664 eine zweite, herzogliche: Gottorp und die Sonderburger Nebenlinien karbten den Guldgylden in eigener Regie<sup>[ref:jensen-1971-hans-den-yngre-guldgylden]</sup> — ohne Ordonnanz, und für keines dieser Stücke ist ein Korn überliefert. Ihrer Funktion nach eine <b>deutsch-orientierte Marktmünze</b>, kein Tarifgeld — ohne feste Tarifbindung an Speciedaler oder Guldkrone.'
    en: '<b>The Danish royal-mint variant of the Rhenish-Gulden tradition</b>: the Rhenish gold gulden was the leading gold trade and accounting coin of the Holy Roman Empire<sup>[ref:rheinischer-gulden-imperial-handelsmuenze]</sup>, so the Danish crown struck its own to that standard as a trade coin for the empire-wide market. The fineness was fixed de jure at <b>18 carats (.750)</b>, 72 pieces per rough Cologne mark, by the <b>Christian II Møntordning (Summer 1514)</b> and the <b>Frederik I ordinance of 25 February 1524</b><sup>[ref:wilcke-rhinsk-gylden-1514-standard]</sup><sup>[ref:wilcke-rhinsk-gylden-1524-standard]</sup>. The imperial norm itself had until then stood on the form the four Rhenish electors adopted in 1490 — 71⅓ pieces to the mark at 18½ carats<sup>[ref:wilcke6-rhinfyrster-1490-norm]</sup> — which Karl V upheld in his ordinance of 28 July 1551<sup>[ref:wilcke6-karl-v-moentordning-1551]</sup>; only Emperor Ferdinand I''s edict of 19 August 1559 moved it to 72 pieces to the 18½-carat mark<sup>[ref:wilcke6-ferdinand-moentedikt-1559]</sup>, after which Frederik II struck at that same fineness from 1563. The sections divide by which ordinance was in force. The coinage under <b>Hans</b> (~1496-1510) precedes every Danish gold ordinance and is measured against the imperial norm alone; the German assayers found it in 1551 «<i>kun ca. 3/4 Karat</i>» below that, i.e. at 17¾ carats<sup>[ref:wilcke6-valvationstag-1551]</sup>, and Wilcke assigns this gold to the pay of the German mercenaries in the war against Sten Sture<sup>[ref:danskmoent-hans-rhinsk-gylden-1497]</sup>. From 1514 the Danish specification of 18 carats governs, under which <b>Frederik I</b><sup>[ref:danskmoent-f1-rhinsk-gylden-1527]</sup> and <b>Christian III</b><sup>[ref:danskmoent-c3g131-roskilde]</sup> strike until 1547 — their pieces of the 1530s holding 18⅓ carats, above the specification and on the output customary within the Empire. From 1563 <b>Frederik II</b> strikes at 18½ carats under the imperial edict of 1559<sup>[ref:danskmoent-1rhinsk-gylden]</sup>. For the resumption under <b>Christian IV</b> in 1625-1632, during the <b>Imperial-Danish War</b>, no ordinance survives: the 18¼ carats (.76) are a finding on the surviving pieces<sup>[ref:danskmoent-1rhinsk-gylden]</sup>, and the output relations of 1559 continued to hold<sup>[ref:wilcke6-ferdinand-moentedikt-1559]</sup>. Alongside the royal series a second, ducal one runs from 1619 to 1664: Gottorp and the Sonderburg cadet branches struck the Goldgulden on their own account<sup>[ref:jensen-1971-hans-den-yngre-guldgylden]</sup> — without an ordinance, and with no fineness recorded for any of the pieces. By function a <b>German-oriented market coin</b>, not tariff money — with no fixed tariff link to the Speciedaler or the Guldkrone.'
    uk: '<b>Данський королівський варіант традиції Rhenish-Gulden</b>: рейнський золотий гульден був провідною золотою торговою та розрахунковою монетою Священної Римської імперії<sup>[ref:rheinischer-gulden-imperial-handelsmuenze]</sup>, тож данська корона карбувала власну під цей стандарт як торгову монету для загальноімперського ринку. Пробу de jure зафіксовано на <b>18 карат (.750)</b>, 72 штуки з повної кельнської марки, <b>Møntordning-ом Христіана II (літо 1514)</b> та <b>ордонансом Фредеріка I від 25 лютого 1524</b><sup>[ref:wilcke-rhinsk-gylden-1514-standard]</sup><sup>[ref:wilcke-rhinsk-gylden-1524-standard]</sup>. Сама імперська норма доти стояла на формі, ухваленій чотирма рейнськими курфюрстами 1490 р., — 71⅓ штуки з марки за 18½ карата<sup>[ref:wilcke6-rhinfyrster-1490-norm]</sup>, — і Карл V зберіг її ордонансом від 28 липня 1551 р.<sup>[ref:wilcke6-karl-v-moentordning-1551]</sup>; і лише едикт імператора Фердинанда I від 19 серпня 1559 р. перевів її на 72 штуки з 18½-каратної марки<sup>[ref:wilcke6-ferdinand-moentedikt-1559]</sup>, після чого Фредерік II з 1563 р. карбує саме за цією пробою. Розділи різняться тим, яка ординація діяла. Карбування за <b>Ганса</b> (~1496-1510) передує будь-якій данській золотій ординації і міряється самою лише імперською нормою; німецькі вардейни 1551 р. знайшли його на «<i>kun ca. 3/4 Karat</i>» нижче, тобто на 17¾ карата<sup>[ref:wilcke6-valvationstag-1551]</sup>, а Вильке відносить це золото до платні німецьким найманцям у війні проти Sten Sture<sup>[ref:danskmoent-hans-rhinsk-gylden-1497]</sup>. Від 1514 р. діє данський припис у 18 карат, за яким <b>Фредерік I</b><sup>[ref:danskmoent-f1-rhinsk-gylden-1527]</sup> і <b>Кристіан III</b><sup>[ref:danskmoent-c3g131-roskilde]</sup> карбують до 1547 р. — причому їхні монети 1530-х тримають 18⅓ карата, вище за припис і на звичній в Імперії вибірці. Від 1563 р. <b>Фредерік II</b> карбує за 18½ карата згідно з імперським едиктом 1559 р.<sup>[ref:danskmoent-1rhinsk-gylden]</sup>. Для відновлення за <b>Кристіана IV</b> 1625-1632 рр., за часів <b>Імперсько-данської війни</b>, ординанса не збереглося: 18¼ карата (.76) — це висновок з наявних примірників<sup>[ref:danskmoent-1rhinsk-gylden]</sup>, а відносини вибірки 1559 р. трималися й далі<sup>[ref:wilcke6-ferdinand-moentedikt-1559]</sup>. Поряд із королівською низкою від 1619 до 1664 р. іде друга, герцогська: Готторп і зондербурзькі бічні лінії карбували голдгульден власним коштом<sup>[ref:jensen-1971-hans-den-yngre-guldgylden]</sup> — без ординанса, і для жодної з цих монет проби не збереглося. За функцією — <b>торгова монета німецького спрямування</b>, не тарифні гроші — без жорсткої тарифної прив''язки до Speciedaler чи Guldkrone.'
    da: '<b>Den danske kongemønts variant af den rhinske gyldens tradition</b>: den rhinske guldgylden var Det Tysk-romerske Riges førende guldhandels- og regningsmønt<sup>[ref:rheinischer-gulden-imperial-handelsmuenze]</sup>, og derfor eftergjorde den danske krone den som handelsmønt til markedet i hele riget. Lødigheden blev de jure fastsat ved <b>Christian 2.s møntordning (sommeren 1514)</b> og <b>Frederik 1.s ordonnans af 25. februar 1524</b> til <b>18 karat (.750)</b> ved 72 stykker pr. rå Cölln. Marck<sup>[ref:wilcke-rhinsk-gylden-1514-standard]</sup><sup>[ref:wilcke-rhinsk-gylden-1524-standard]</sup>. Rigsnormen selv stod indtil da på den form, de fire rhinske kurfyrster havde aftalt i 1490 — 71⅓ stykker pr. mark ved 18½ karat<sup>[ref:wilcke6-rhinfyrster-1490-norm]</sup> — som Karl 5. opretholdt i sin møntordning af 28. juli 1551<sup>[ref:wilcke6-karl-v-moentordning-1551]</sup>; først kejser Ferdinand 1.s møntedikt af 19. august 1559 satte den til 72 stykker pr. 18½-karats mark<sup>[ref:wilcke6-ferdinand-moentedikt-1559]</sup>, hvorpå Frederik 2. fra 1563 prægede i netop den lødighed. Afsnittene skilles derefter af, hvilken ordonnans der til enhver tid gjaldt. Prægningen under <b>Hans</b> (~1496-1510) ligger forud for enhver dansk guldordonnans og måles alene mod rigsnormen; de tyske vardejner fandt den i 1551 «<i>kun ca. 3/4 Karat</i>» derunder, altså ved 17¾ karat<sup>[ref:wilcke6-valvationstag-1551]</sup>, og Wilcke henfører dette guld til soldbetaling af de tyske lejetropper i krigen mod Sten Sture<sup>[ref:danskmoent-hans-rhinsk-gylden-1497]</sup>. Fra 1514 gælder den danske forskrift på 18 karat, som <b>Frederik 1.</b><sup>[ref:danskmoent-f1-rhinsk-gylden-1527]</sup> og <b>Christian 3.</b><sup>[ref:danskmoent-c3g131-roskilde]</sup> præger efter indtil 1547 — idet deres stykker fra 1530''erne med 18⅓ karat ligger over forskriften og på den udbringning, der var gængs i riget. Fra 1563 præger <b>Frederik 2.</b> efter det kejserlige edikt af 1559 ved 18½ karat<sup>[ref:danskmoent-1rhinsk-gylden]</sup>. For genoptagelsen under <b>Christian 4.</b> 1625-1632, under <b>Kejserkrigen</b>, er ingen ordonnans overleveret: de 18¼ karat (.76) er et fund på de bevarede stykker<sup>[ref:danskmoent-1rhinsk-gylden]</sup>, og udbringningsforholdene fra 1559 gjaldt fortsat<sup>[ref:wilcke6-ferdinand-moentedikt-1559]</sup>. Ved siden af den kongelige række løber fra 1619 til 1664 en anden, hertugelig: Gottorp og de sønderborgske sidelinjer prægede guldgyldenen i eget regi<sup>[ref:jensen-1971-hans-den-yngre-guldgylden]</sup> — uden ordonnans, og for ingen af disse stykker er en lødighed overleveret. Efter sin funktion en <b>tysk-orienteret markedsmønt</b>, ikke tarifpenge — uden fast tarifbinding til speciedaler eller guldkrone.'
  fractions:
    "1": {soll_rau_g: 3.248, soll_fein_g: 2.50367}                                                               # 1 Goldgulden. A phase gets its own target only where a dated ordinance sets it: phase I = Møntordning 1514/1524, 18 Karat → 2.436. Phase 0 (pre-1514), the Denmark-page phase III (1619-1627, ducal, no instrument) and phase IV (1625-1632, Christian IV, no instrument) fall back to this scalar, 18½ Karat per the Møntedikt of 1559.
    "2": {soll_rau_g: 6.496, soll_fein_g: 5.00733}                                                               # 2 Goldgulden — double: phase I 4.872 (18 Karat), otherwise this scalar.
  events:
    first_adoption:
      anywhere: 1514
      note: "Christian III adopts the Rhenish-Gulden standard for Danish-royal Gold trade-coin issues already 1536 in Roskilde (Galster 131, .764 fineness, 3.19 g rough). Wormser Reichsabschied 1495 is the imperial precedent (72 stk per Cölln. Marck rauh at 18½ Karat). Galster originally misattributed the mint to Gottorp; danskmoent.dk corrects to Roskilde. HOLSTEIN SCOPE (added 2026-09-05): 1495, the Wormser Reichsabschied that fixed the Rhenish norm at 72 pieces to the rough Cölln. Marck. The duchies were imperial fiefs, so the Reichsabschied applied to them directly rather than by analogy — hence firm_holstein. Before this the fuss carried no holstein scope at all and the Schleswig-Holstein timeline bar drew no Holstein layer. CORRECTION 2026-09-05: the anywhere anchor moves 1536 → 1514. It stood on «Christian III adopts the standard 1536», but Christian II's Møntordning of summer 1514 already lists the Rhinsk Gylden at 72/Mark, 18 Karat (Wilcke 7-2 p. 152-153) and Frederik I's of 25 February 1524 restates it (p. 184) — so the anchor postdated both ordinances AND the first coinage (1496). It still postdates first_mint, which is correct: Hans struck to the norm eighteen years before Denmark codified it."
      holstein: 1495
      firm_holstein: true
    first_mint:
      anywhere: 1496
      note: "Earliest documented coinage is the undated Hans Rhinsk Gylden ~1496-1497 (Malmø; Bruun coll. 3839 / Galster hg27; danskmoent «formentlig slået omkring 1497»). The earliest DATED specimen remains Galster c3g131 (1 Rhinsk gylden 1536, Christian III, Roskilde, 3.19 g rough / 2.44 g fine / .764). Galster fejlagtigt henført til Gottorp; korrekt mint Roskilde per danskmoent.dk. (first_mint moved 1536->1496 after the Hans specimen was added.) HOLSTEIN SCOPE (added 2026-09-05): the duchies' own coinage of this standard begins with Frederik I's Goldgulden of 1523-1533 from Gottorp and Schleswig. The scope was absent entirely, which the timeline reads as «never minted here» — derive_mint_overrides deliberately does not promote a missing endpoint to the data-derived range — so the Schleswig-Holstein bar carried no Holstein layer at all, only the realm-wide one."
      holstein: 1523
    last_mint:
      anywhere: 1632
      note: "Hede c4h29 last dated year 1632 (Christian IV). Coinage stops as the Imperial-Danish War ends (1629) and Christian IV's gold-coin focus shifts to the silver Krone-Mønt programme (1644+ Hebræermønt / Glückstadt 10½-Krone-Fuß). HOLSTEIN SCOPE: ends with Christian Albrecht's Goldgulden of 1664 (Gottorp). The realm-wide scope stops in 1632 with Christian IV — the ducal lines went on striking the Rhenish standard for three decades after the crown had left it."
      holstein: 1664
    std_end:
      anywhere: 1602
      note: "Standard effectively ends post-1632 — Christian IV does not resume Rhinsk Gylden coinage after the Imperial-Danish War. Frederik III pivots gold coinage to the Guldkrone tariff programme from 1655 (separate Müntzfuß family). CORRECTION 2026-09-05: 1640 (approx) → 1602, and the holstein scope gains the same year. The old figure was an estimate from Christian IV not resuming coinage. The dated instrument is the Forordning af 8. September 1602, whose gold schedule prescribes only the Portugaløser (6¾/Mk, 23½ Kt) and the Ungersk Gylden (67/Mk, 23⅓ Kt): Danish gold is redefined on the ducat grid and the Rhenish norm has no statutory place after it. This is the silence of a comprehensive schedule rather than an express ban — the express ban is imperial and earlier, Kejser Ferdinands Møntedikt of 19 August 1559, which voided Christian III's and Kong Hans' Goldgulden by name with six months' notice (Wilcke 6). 1602 governs BOTH scopes because the royal-Schleswig mints kept striking under Danish law after the edict — Flensborg issued rhinske gylden 1545-1554 and Frederik II struck 1563-1564 — so the imperial ban plainly did not reach them. std_end now precedes last_mint in both scopes, which is the finding, not an error: crown and ducal lines alike went on striking a standard the law had dropped."
      holstein: 1602
    demonetisation:
      anywhere: 1700
      approx_anywhere: true
      note: "Approximate practical-circulation tail — surviving specimens predominantly remelted into Reichsdukaten during the 17th century. By Christian V's death 1699 the Rhinsk Gylden is collector / numismatic territory. Holstein scope mirrors the realm-wide tail at ~1700, approximate, as guldkrone and 9_thaler do on the same page. The coinage was not rare when struck — Hvitfeldt has Hans ordering 150,000 pieces for the 1497 Sweden campaign (Wilcke 6) — so the handful of surviving specimens is a survival rate, not a reason to shorten the circulation layer."
      holstein: 1700
      approx_holstein: true
    anywhere_label:
      de: Königreich Dänemark und Norwegen
      en: Royal Danish-Norwegian Realm
      uk: Королівство Данії і Норвегії
      da: Kongeriget Danmark og Norge
