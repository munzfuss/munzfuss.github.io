  events:
    first_adoption:
      anywhere: 1602
      note: "Møntanordning af 8. September 1602 — the gold schedule that sets pieces-per-mark and carat for the 8, 6 and 4 daler klippen. Wilcke I, table p. 69; the column is headed «Lovbestemt Værdi»."
    first_mint:
      anywhere: 1604
      note: "First struck 1604 at Copenhagen under mintmaster Nicolaus Schwabe — two years after the ordinance. The 6 daler was struck again in 1605."
    last_mint:
      anywhere: 1605
      note: "Last recorded striking 1605 (6 daler; a batch of 4 daler re-struck that year after 552 overweight pieces were re-melted). No later issue to this standard is documented."
    std_end:
      anywhere: 1611
      approx_anywhere: true
      note: "The 1602 gold schedule was left untouched by the ordinance of 3 February 1609 («dens Udmøntningsforhold ikke er ændrede»); the next development in Danish gold is the Guldridder of 1611-13, which follows a different formula. The end date is therefore the standard's practical horizon, not a repeal."
    anywhere_label:
      de: Königreich Dänemark und Norwegen
      en: Royal Danish-Norwegian Realm
