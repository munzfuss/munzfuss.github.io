    rechnungsfraktionen:
      de: |-
        <b>1 Nobel</b> — Hauptnominal über alle drei Regenten · als Mehrfachstücke <b>2 Nobel</b> (Hans, Galster 26) und <b>3 Nobel</b> (Hans, Galster 25).<br><em>Kein fester Specie-Tarif überliefert</em> — kein Tagesumlauf belegt<sup>[ref:danskmoent-1nobel]</sup>.
      en: |-
        <b>1 Nobel</b> — main denomination across all three reigns · as multiple pieces <b>2 Nobel</b> (Hans, Galster 26) and <b>3 Nobel</b> (Hans, Galster 25).<br><em>No fixed Specie tariff is recorded</em> — no daily circulation attested<sup>[ref:danskmoent-1nobel]</sup>.
      uk: |-
        <b>1 Nobel</b> — головний номінал через усі три правління · як кратні номінали <b>2 Nobel</b> (Hans, Galster 26) і <b>3 Nobel</b> (Hans, Galster 25).<br><em>Фіксованого Specie-тарифу не задокументовано</em> — щоденного обігу не засвідчено<sup>[ref:danskmoent-1nobel]</sup>.
      da: <b>1 nobel</b> — hovednominalet gennem alle tre regenter · som flerdobbelte stykker <b>2 nobel</b> (Hans, Galster 26) og <b>3 nobel</b> (Hans, Galster 25).<br><em>Ingen fast specietarif er overleveret</em> — intet dagligt omløb er belagt<sup>[ref:danskmoent-1nobel]</sup>.
    aside_label:
      de: "Verhältnis zu anderen Goldfüßen"
      en: "Relation to other gold standards"
      uk: "Відношення до інших золотих стоп"
      da: Forholdet til de øvrige guldfødder
    aside:
      de: "Das schwerste Goldstück seiner Zeit, mit rund dem vierfachen Gewicht der zeitgleichen Goldgulden: der Rhinsk Gylden ([fuss:rhinsk_gylden_fod], ~3,25 g) und der Ungersk Gylden ([fuss:reichsdukatenfuss], ~3,49 g). In der Feinheit (.979) liegt der Nobel zwischen beiden: über dem Rhinsk Gylden (.770), aber unter dem Ungersk Gylden (.986). <b>Nicht</b> Vorgänger des [fuss:reichsdukatenfuss] (der Dukat bleibt im Goldgulden-Gewichtsband, nicht im Nobel-Band) und <b>nicht</b> verwandt mit der späteren [fuss:rosenobel_fod]-Linie Christians IV. (1611-1629, separate Probe .833, Tarif-Logik der Kalmar-Krieges-Finanzierung)."
      en: "The heaviest gold piece of its time, about four times the weight of the contemporary Goldgulden: the Rhinsk Gylden ([fuss:rhinsk_gylden_fod], ~3.25 g) and the Ungersk Gylden ([fuss:reichsdukatenfuss], ~3.49 g). In fineness (.979) the Nobel sits between the two: above the Rhinsk Gylden (.770) but below the Ungersk Gylden (.986). <b>Not</b> a predecessor of [fuss:reichsdukatenfuss] (the Dukat stays in the Goldgulden weight band, not the Nobel's) and <b>not</b> related to the later Christian IV [fuss:rosenobel_fod] line (1611-1629, separate fineness .833, the tariff logic of Kalmar-War financing)."
      uk: "Найважча золота монета свого часу, приблизно вчетверо більша вага за тогочасні Goldgulden: Rhinsk Gylden ([fuss:rhinsk_gylden_fod], ~3,25 г) і Ungersk Gylden ([fuss:reichsdukatenfuss], ~3,49 г). За пробою (.979) Nobel лежить між обома: вищий за Rhinsk Gylden (.770), але нижчий за Ungersk Gylden (.986). <b>Не</b> попередник [fuss:reichsdukatenfuss] (Dukat лишається у ваговому діапазоні Goldgulden, а не Nobel) і <b>не</b> пов'язана з пізнішою лінією Christian IV [fuss:rosenobel_fod] (1611-1629, окрема проба .833, тарифна логіка фінансування Кальмарської війни)."
      da: 'Det tungeste guldstykke i sin tid, med omkring fire gange vægten af de samtidige guldgylden: den rhinske gylden ([fuss:rhinsk_gylden_fod], ~3,25 g) og den ungerske gylden ([fuss:reichsdukatenfuss], ~3,49 g). I lødighed (.979) ligger nobelen mellem de to: over den rhinske gylden (.770), men under den ungerske (.986). <b>Ikke</b> forløber for [fuss:reichsdukatenfuss] (dukaten bliver i guldgyldenens vægtbånd, ikke i nobelens) og <b>ikke</b> beslægtet med Christian 4.s senere [fuss:rosenobel_fod]-linje (1611-1629, sin egen lødighed .833 og en tariflogik knyttet til finansieringen af Kalmarkrigen).'
  description:
    de: |-
      <b>Dänisch-norwegischer Goldstandard 1496–1532.</b> König Hans prägt 1496 in Malmø und Kopenhagen den ersten dänischen Nobel<sup>[ref:danskmoent-1nobel]</sup> — die erste datierte Goldmünze Dänemarks<sup>[ref:stacksbowers-bruun-1496-nobel]</sup>. Vorbild ist nach Galster nicht der englische Nobel, sondern der holländische «groote gouden reaal» von 1487, dem das dänische Stück in Gepräge und Gewicht folgt, wenn auch bei etwas geringerer Feinheit<sup>[ref:galster-unionstidens-nobel]</sup>. Es handelt sich um Prachtmünzen — kein Umlauf-, sondern Repräsentations- und Soldgold, geschlagen im Zusammenhang mit der Rüstung gegen Schweden und deutlich schwerer als die zeitgleichen Goldgulden — der Rhinsk Gylden ([fuss:rhinsk_gylden_fod]) und der Ungersk Gylden ([fuss:reichsdukatenfuss])<sup>[ref:galster-unionstidens-nobel]</sup>. Seine maßgebliche Spezifikation — 16 Stück aus der Cöllnischen Marck zu 23½ Karat — erhält der Nobel de jure in der Christian-II-Møntordning vom Sommer 1514 zu Malmø, die das seit 1496 de facto geprägte schwere Goldstück normiert<sup>[ref:wilcke-1950-nobel-ordinance]</sup>; die Probe der vor 1514 geschlagenen Hans-Nobler ist unabhängig nicht belegt. Die niedrigere Probe der Frederik-I-Ordnung von 1524 ist an keinem erhaltenen Stück belegt — die datierten 1532-Nobler tragen dieselbe höhere Feinheit wie die Vorgabe von 1514, und eine einheitliche Nobel-Probe geben die Quellen insgesamt nicht her<sup>[ref:danskmoent-nobel-finhed-f1g45]</sup>. Über drei Regenten hinweg bleibt die Linie eine Reihe seltener Einzelprägungen — Hans 1496 und 1502, Christian II. 1516 und 1518, Frederik I. 1532 —, geschlagen zu Malmø und Kopenhagen — für die Hans- und Frederik-I-Jahrgänge läßt Galster die Münzstätte zwischen beiden offen — sowie, undatiert, zu Ribe<sup>[ref:danskmoent-1nobel]</sup>. Mit dem Tod Frederiks I. 1533 endet die Karbung; Christian III. (1534–1559) führt die schwere Nobel-Linie nicht fort; sein Goldgeld bleibt bei den leichteren Goldgulden — Rhinsk Gylden und Ungersk Gylden<sup>[ref:danskmoent-1nobel]</sup>.
    en: |-
      <b>Danish-Norwegian gold standard 1496–1532.</b> King Hans strikes the first Danish Nobel at Malmø and Copenhagen in 1496<sup>[ref:danskmoent-1nobel]</sup> — the first dated gold coin of Denmark<sup>[ref:stacksbowers-bruun-1496-nobel]</sup>. Per Galster the model is not the English Noble but the Dutch «groote gouden reaal» of 1487, which the Danish piece follows in design and weight, though at a slightly lower fineness<sup>[ref:galster-unionstidens-nobel]</sup>. These are prestige coins — not circulation money but display and military-pay gold, struck in connection with the armament against Sweden and markedly heavier than the contemporary Goldgulden — the Rhinsk Gylden ([fuss:rhinsk_gylden_fod]) and the Ungersk Gylden ([fuss:reichsdukatenfuss])<sup>[ref:galster-unionstidens-nobel]</sup>. The Nobel receives its governing specification — 16 pieces from the Cologne mark at 23½ carats — de jure in the Christian II Møntordning of Summer 1514 at Malmø, which codifies the heavy gold piece struck de facto since 1496<sup>[ref:wilcke-1950-nobel-ordinance]</sup>; the fineness of the pre-1514 Hans Nobler is not independently attested. The lower fineness of the Frederik I ordinance of 1524 is borne out by no surviving piece — the dated 1532 Nobler carry the same higher fineness as the 1514 specification, and the sources give no single Nobel fineness overall<sup>[ref:danskmoent-nobel-finhed-f1g45]</sup>. Across three rulers the line stays a series of rare individual issues — Hans 1496 and 1502, Christian II 1516 and 1518, Frederik I 1532 — struck at Malmø and Copenhagen — for the Hans and Frederik I issues Galster leaves the mint undecided between the two — and, undated, at Ribe<sup>[ref:danskmoent-1nobel]</sup>. With the death of Frederik I in 1533 the coinage ends; Christian III (1534–1559) does not continue the heavy Nobel line; his gold coinage stays with the lighter Goldgulden — Rhinsk Gylden and Ungersk Gylden<sup>[ref:danskmoent-1nobel]</sup>.
    uk: |-
      <b>Дансько-норвезький золотий стандарт 1496–1532.</b> Король Hans 1496 р. карбує перший данський Nobel у Malmø і Копенгагені<sup>[ref:danskmoent-1nobel]</sup> — першу датовану золоту монету Данії<sup>[ref:stacksbowers-bruun-1496-nobel]</sup>. За Galster прообразом є не англійський Noble, а голландський «groote gouden reaal» 1487 р., якому данська монета слідує у гравіруванні й вазі, хоч і за дещо нижчої проби<sup>[ref:galster-unionstidens-nobel]</sup>. Це престижні монети — не для звичайного обігу, а репрезентативне й платіжне золото, карбоване у звʼязку з озброєнням проти Швеції й помітно важче за тогочасні Goldgulden — Rhinsk Gylden ([fuss:rhinsk_gylden_fod]) і Ungersk Gylden ([fuss:reichsdukatenfuss])<sup>[ref:galster-unionstidens-nobel]</sup>. Свою визначальну специфікацію — 16 штук з кельнської марки за 23½ карати — Nobel дістає de jure в Møntordning Christian II літа 1514 р. у Malmø, що кодифікує важке золоте карбування, наявне de facto від 1496 р.<sup>[ref:wilcke-1950-nobel-ordinance]</sup>; проба до-1514 нобелів Hans незалежно не засвідчена. Нижча проба Ordnung Frederik I 1524 р. не засвідчена на жодному збереженому примірнику — датовані 1532-нобелі мають ту саму вищу пробу, що й специфікація 1514, а єдиної проби Nobel джерела загалом не дають<sup>[ref:danskmoent-nobel-finhed-f1g45]</sup>. Через трьох правителів лінія лишається низкою рідкісних поодиноких випусків — Hans 1496 і 1502, Christian II 1516 і 1518, Frederik I 1532 —, карбованих у Malmø і Копенгагені — для випусків Hans і Frederik I двір за Galster лишається невизначеним між обома — та, недатовано, у Ribe<sup>[ref:danskmoent-1nobel]</sup>. Зі смертю Frederik I 1533 р. карбування припиняється; Christian III (1534–1559) важку лінію Nobel не продовжує; його золоте карбування лишається при легших Goldgulden — Rhinsk Gylden і Ungersk Gylden<sup>[ref:danskmoent-1nobel]</sup>.
    da: <b>Dansk-norsk guldstandard 1496–1532.</b> Kong Hans præger i 1496 i Malmø og København den første danske nobel<sup>[ref:danskmoent-1nobel]</sup> — Danmarks første daterede guldmønt<sup>[ref:stacksbowers-bruun-1496-nobel]</sup>. Forbilledet er efter Galster ikke den engelske nobel, men den hollandske «groote gouden reaal» fra 1487, som det danske stykke følger i præg og vægt, om end ved en noget lavere lødighed<sup>[ref:galster-unionstidens-nobel]</sup>. Der er tale om pragtmønter — ikke omløbsguld, men repræsentations- og soldguld, slået i forbindelse med rustningen mod Sverige og betydelig tungere end de samtidige guldgylden — den rhinske gylden ([fuss:rhinsk_gylden_fod]) og den ungerske gylden ([fuss:reichsdukatenfuss])<sup>[ref:galster-unionstidens-nobel]</sup>. Sin gældende specifikation — 16 stykker af Cöllnische Marck ved 23½ karat — får nobelen de jure i Christian 2.s møntordning af sommeren 1514 i Malmø, som normerer det tunge guldstykke, der havde været præget de facto siden 1496<sup>[ref:wilcke-1950-nobel-ordinance]</sup>; lødigheden af de nobler, Hans slog før 1514, er ikke uafhængigt belagt. Den lavere lødighed i Frederik 1.s ordning af 1524 er ikke belagt på noget bevaret stykke — de daterede nobler fra 1532 bærer samme højere lødighed som forskriften af 1514, og kilderne giver samlet ingen ensartet nobellødighed<sup>[ref:danskmoent-nobel-finhed-f1g45]</sup>. Gennem tre regenter forbliver linjen en række sjældne enkeltprægninger — Hans 1496 og 1502, Christian 2. 1516 og 1518, Frederik 1. 1532 — slået i Malmø og København, idet Galster for Hans' og Frederik 1.s årgange lader møntstedet stå åbent mellem de to, samt udateret i Ribe<sup>[ref:danskmoent-1nobel]</sup>. Med Frederik 1.s død i 1533 ophører prægningen; Christian 3. (1534–1559) fører ikke den tunge nobellinje videre, og hans guldpenge bliver ved de lettere guldgylden — den rhinske og den ungerske<sup>[ref:danskmoent-1nobel]</sup>.
  fractions:
    "1": {soll_rau_g: 14.616, soll_fein_g: 14.31}    # 1 Nobel = 233.856 / 16 = 14.616 g rauh; × .979 (23½ Karat, Wilcke 1514) = 14.31 g fein. danskmoent 1532-Spezimen 14.375 g / 14.08 g fein; Hans-Belegexemplar 14.67 g rauh — alle innerhalb der Pragtmünzen-Streuung
    "3": {soll_rau_g: 43.848, soll_fein_g: 42.93}    # 3 Nobel = 3 × 14.616 / 14.31 (errechnet aus der Møntordning 1514, 16 Nobler/Marck). John I (Hans I) Multiplum
    "2": {soll_rau_g: 29.232, soll_fein_g: 28.62}    # 2 Nobel = 2 × 14.616 / 14.31 (errechnet aus der Møntordning 1514). John I (Hans I) Multiplum
  events:
    first_adoption:
      anywhere: 1496
      note: "Hans introduces a new heavy gold standard in DK in 1496 (Galster 24 Nobel) alongside the lighter gold-gulden tradition — the Rhinsk Gylden (Hans ~1497); the Ungersk Gylden / Dukat tier follows from ~1513 (Christian II). Metric specification — see grundwerte block."
    first_mint:
      anywhere: 1496
      note: "Hans 1496 Malmø/Copenhagen (Galster 24) — first dated Nobel coinage. Primary mint Malmø."
    last_mint:
      anywhere: 1532
      note: "Frederik I 1532 Copenhagen/Malmø (Galster 45) — last dated Nobel coinage. Plus undated Ribe coinage of Frederik I (Galster 68 + 69). With Frederik I's death 1533 the Nobel line is discontinued; Christian III (1534-1559) does not strike Nobler; his gold coinage stays with the lighter gulden — Rhinsk Gylden (1536, Galster 131) and Ungersk Gylden (1557, Hede c3h1/c3h2)."
    std_end:
      anywhere: 1533
      approx_anywhere: true
      note: "Standard ends with Frederik I's death 1533. Christian III's reign (1534-1559) records no Nobel coinage (per ref37). A heavy gold line is not revived in DK until Christian IV's Rosenobel programme 1611, struck on a different gold standard."
    demonetisation:
      anywhere: 1600
      approx_anywhere: true
      note: "Approximate practical-circulation tail — Nobler are RRR-classified in Galster throughout (надзвичайно рідкісна, per ref37). The Müntzfuß has no successor coinage in DK until Christian IV's Rosenobel programme 1611 reopens a heavy gold line under a separate tariff logic."
    anywhere_label:
      de: Königreich Dänemark und Norwegen
      en: Royal Danish-Norwegian Realm
      uk: Королівство Данії і Норвегії
      da: Kongeriget Danmark og Norge
rosenobel_fod:
  name:
    de: Rosenobel-fod
    en: Rosenobel-fod
    uk: Rosenobel-fod
    da: Rosenobel-fod
  historical_name: Rosenobel / Guldridder (½-Rosenobel period nickname); Anpassung des englischen Rose-Noble-Modells
  metal: gold
  grid_unit_g: 233.856                  # Cöllnische Marck rauh (Goldlegierung)
  grid_unit_name: Cöllnische Marck
  grid_stops: 26                        # ≈ 26 Rosenobler aus der rauen Cölln. Marck (233.856 / 8.994 ≈ 26.0)
  grid_unit_convention: rauh
  fineness_standard: 0.833              # 20 Karat (= 20/24) — Hede c4h23a/c4h24 verbatim attestiert
  fineness_period: '20 Karat'
  fineness_display: "833 ‰ (20 Karat = 20/24, Hede c4h23/c4h24 verbatim)"
  grundwerte:
    heading:
      de: "Grundwerte · Rosenobel-fod"
      en: "Base values · Rosenobel-fod"
      uk: "Базові значення · Rosenobel-fod"
      da: Grundværdier · Rosenobel-fod
    subheading:
      de: "Cöllnische Marck rauh = 233,856 g Goldlegierung · Probe <b>833 ‰</b> (20 Karat, Hede c4h23/c4h24 verbatim) · <b>≈ 26 Rosenobler aus der rauen Cölln. Marck</b> · per Stück <b>8,994 g rauh / 7,492 g fein</b> (Hede c4h23a Christian IV.) · zwei Phasen: <b>Phase I</b> Frederik II. 1584 (Frederiksborg, unikat, andere Brutto-Massengewicht 7,69 g, Probe unbekannt) und <b>Phase II</b> Christian IV. 1611-1629 (Kopenhagen, standardisierter .833/8,994 g) · Anpassung des <a href=\"https://www.danskmoent.dk/1rosenob.htm\" target=\"_blank\">englischen Rose-Noble-Modells</a><sup>[ref:danskmoent-1rosenobel]</sup>"
      en: "Cologne mark rough = 233.856 g gold alloy · fineness <b>833 ‰</b> (20 carats, Hede c4h23/c4h24 verbatim) · <b>≈ 26 Rosenobler per rough Cologne mark</b> · per piece <b>8.994 g rough / 7.492 g fine</b> (Hede c4h23a Christian IV) · two phases: <b>Phase I</b> Frederik II 1584 (Frederiksborg, unique, different gross weight 7.69 g, fineness unknown) and <b>Phase II</b> Christian IV 1611-1629 (Copenhagen, standardised .833 / 8.994 g) · adaptation of the <a href=\"https://www.danskmoent.dk/1rosenob.htm\" target=\"_blank\">English Rose Noble model</a><sup>[ref:danskmoent-1rosenobel]</sup>"
      uk: "Кельнська марка повна = 233,856 г золотого сплаву · проба <b>833 ‰</b> (20 карат, Hede c4h23/c4h24 verbatim) · <b>≈ 26 Rosenobler з повної кельнської марки</b> · на штуку <b>8,994 г повної / 7,492 г чистого</b> (Hede c4h23a Christian IV) · дві фази: <b>Phase I</b> Frederik II 1584 (Frederiksborg, унікат, інша повна вага 7,69 г, проба невідома) і <b>Phase II</b> Christian IV 1611-1629 (Копенгаген, стандартизовано .833 / 8,994 г) · адаптація <a href=\"https://www.danskmoent.dk/1rosenob.htm\" target=\"_blank\">моделі англійського Rose Noble</a><sup>[ref:danskmoent-1rosenobel]</sup>"
      da: 'Cöllnische Marck rå = 233,856 g guldlegering · lødighed <b>833 ‰</b> (20 karat, Hede c4h23/c4h24 ordret) · <b>≈ 26 rosenobler af den rå Cölln. Marck</b> · pr. stykke <b>8,994 g rå / 7,492 g fin</b> (Hede c4h23a, Christian 4.) · to faser: <b>fase I</b> Frederik 2. 1584 (Frederiksborg, unikum, afvigende bruttovægt 7,69 g, lødigheden ukendt) og <b>fase II</b> Christian 4. 1611-1629 (København, standardiseret til .833 / 8,994 g) · en tilpasning af <a href="https://www.danskmoent.dk/1rosenob.htm" target="_blank">den engelske rosenobelmodel</a><sup>[ref:danskmoent-1rosenobel]</sup>'
    badge:
      de: "Gold"
      en: "Gold"
      uk: "Золото"
      da: Guld
    rows:
      - key:
          de: "Belegexemplare über zwei Regenten"
          en: "Reference specimens across two rulers"
          uk: "Еталонні зразки через двох правителів"
          da: Belægeksemplarer over to regenter
        value:
          de: "<b>Phase I — Frederik II. 1584</b> (Frederiksborg-Münzstätte): <a href=\"https://www.danskmoent.dk/1rosenob.htm\" target=\"_blank\">Hede 7B</a> / Schou 2 / Sieg 29, <em>unikat</em>, Brutto 7,69 g, Probe unbekannt (Belegexemplar Hede f2h7b; Avers «<i>FRIDERICVS Z D.G. DA. NO. SLA.GO.O. REX</i>», Revers vierzeilige Legende «<i>ROSEN / NOWEL / 1584</i>» umrandet vom Wahlspruch Frederik II. «<i>ALLEIN MEIN HOFFNUNG ZV GOTT</i>» — die period-attestierte Inschriftform «ROSEN NOWEL» wurde durch Wilcke 1950 und die moderne numismatische Literatur retrospektiv zu «Rosenobel» standardisiert<sup>[ref:nationalmuseet-frederik-ii-1584-rosenobel]</sup>) — wahrscheinlich englisch-Rose-Noble-konform (7,78 g klassisch). <b>Phase II — Christian IV. 1611-1629</b> (Kopenhagen): <a href=\"https://www.danskmoent.dk/1rosenob.htm\" target=\"_blank\">Hede 23A</a> Typ A (1611-1613 + 1627 + 1629) und Typ B (Hede 23B / Schou 2-3 / Sieg 149); ½-Rosenobel Hede 24 (1611, period-Spitzname «<i>Guldridder</i>» = «Goldritter»). Standardisiertes Brutto 8,994 g @ .833 Probe = 7,492 g fein (Hede c4h23a / c4h24 verbatim)."
          en: "<b>Phase I — Frederik II 1584</b> (Frederiksborg mint): <a href=\"https://www.danskmoent.dk/1rosenob.htm\" target=\"_blank\">Hede 7B</a> / Schou 2 / Sieg 29, <em>unique</em>, brutto 7.69 g, fineness unknown (reference specimen Hede f2h7b; obverse «<i>FRIDERICVS Z D.G. DA. NO. SLA.GO.O. REX</i>», reverse four-line legend «<i>ROSEN / NOWEL / 1584</i>» ringed by Frederik II's Wahlspruch «<i>ALLEIN MEIN HOFFNUNG ZV GOTT</i>» — the period-attested inscription form «ROSEN NOWEL» was retrospectively standardised to «Rosenobel» by Wilcke 1950 and the modern numismatic literature<sup>[ref:nationalmuseet-frederik-ii-1584-rosenobel]</sup>) — probably conforming to the English Rose Noble (7.78 g classical). <b>Phase II — Christian IV 1611-1629</b> (Copenhagen): <a href=\"https://www.danskmoent.dk/1rosenob.htm\" target=\"_blank\">Hede 23A</a> Type A (1611-1613 + 1627 + 1629) and Type B (Hede 23B / Schou 2-3 / Sieg 149); ½-Rosenobel Hede 24 (1611, period nickname «<i>Guldridder</i>» = «gold knight»). Standardised brutto 8.994 g at .833 fineness = 7.492 g fine (Hede c4h23a / c4h24 verbatim)."
          uk: "<b>Phase I — Frederik II 1584</b> (монетний двір Frederiksborg): <a href=\"https://www.danskmoent.dk/1rosenob.htm\" target=\"_blank\">Hede 7B</a> / Schou 2 / Sieg 29, <em>унікат</em>, повна вага 7,69 г, проба невідома (еталонний зразок Hede f2h7b; аверс «<i>FRIDERICVS Z D.G. DA. NO. SLA.GO.O. REX</i>», реверс чотирирядкова легенда «<i>ROSEN / NOWEL / 1584</i>», обрамлена девізом Frederik II «<i>ALLEIN MEIN HOFFNUNG ZV GOTT</i>» — period-attested форму інскрипції «ROSEN NOWEL» Wilcke 1950 та сучасна нумізматична література ретроспективно стандартизували до «Rosenobel»<sup>[ref:nationalmuseet-frederik-ii-1584-rosenobel]</sup>) — імовірно відповідає англійському Rose Noble (7,78 г класично). <b>Phase II — Christian IV 1611-1629</b> (Копенгаген): <a href=\"https://www.danskmoent.dk/1rosenob.htm\" target=\"_blank\">Hede 23A</a> Тип A (1611-1613 + 1627 + 1629) та Тип B (Hede 23B / Schou 2-3 / Sieg 149); ½-Rosenobel Hede 24 (1611, period-прізвисько «<i>Guldridder</i>» = «золотий лицар»). Стандартизована повна вага 8,994 г за .833 пробою = 7,492 г чистого (Hede c4h23a / c4h24 verbatim)."
          da: '<b>Fase I — Frederik 2. 1584</b> (møntstedet Frederiksborg): <a href="https://www.danskmoent.dk/1rosenob.htm" target="_blank">Hede 7B</a> / Schou 2 / Sieg 29, <em>unikum</em>, brutto 7,69 g, lødigheden ukendt (belægeksemplar Hede f2h7b; forside «<i>FRIDERICVS Z D.G. DA. NO. SLA.GO.O. REX</i>», bagside en firelinjet legende «<i>ROSEN / NOWEL / 1584</i>» omkranset af Frederik 2.s valgsprog «<i>ALLEIN MEIN HOFFNUNG ZV GOTT</i>» — den samtidigt belagte indskriftform «ROSEN NOWEL» blev af Wilcke 1950 og den moderne numismatiske litteratur retrospektivt standardiseret til «rosenobel»<sup>[ref:nationalmuseet-frederik-ii-1584-rosenobel]</sup>) — formentlig i overensstemmelse med den engelske rosenobel (klassisk 7,78 g). <b>Fase II — Christian 4. 1611-1629</b> (København): <a href="https://www.danskmoent.dk/1rosenob.htm" target="_blank">Hede 23A</a> type A (1611-1613 samt 1627 og 1629) og type B (Hede 23B / Schou 2-3 / Sieg 149); ½ rosenobel Hede 24 (1611, i samtiden kaldt «<i>guldridder</i>»). Standardiseret brutto 8,994 g ved lødigheden .833 = 7,492 g fin (Hede c4h23a og c4h24 ordret).'
      - key:
          de: "Englisches Vorbild und Lineage"
          en: "English model and lineage"
          uk: "Англійська модель і лінія"
          da: Engelsk forbillede og afstamning
        value:
          de: "Verbatim aus <a href=\"https://www.danskmoent.dk/1rosenob.htm\" target=\"_blank\">danskmoent.dk</a>: «<i>Navnet Rosenobel stammer fra den engelske mønt Rose noble fra 13-1400-tallet</i>» — der Name stammt von der englischen Münze Rose Noble aus dem 13.-14. Jahrhundert<sup>[ref:danskmoent-1rosenobel]</sup>. Das englische Rose Noble (Edward IV. 1465, 7,78 g, 10s = ½ Pfund, .995 Probe) ist das spätmittelalterliche Modell; die dänische Rosenobel-Karbung ist eine späte Anpassung im Renaissance-Kontext, vermittelt über den <a href=\"https://en.wikipedia.org/wiki/Sound_Dues\" target=\"_blank\">Øresund-Zoll</a> (Hans 1497 eingeführt). Frederik IIs einzelnes 1584-Stück (7,69 g) folgt noch dem klassischen 7,78-g-Standard; Christian IVs Massenkarbung 1611-1629 (8,994 g @ .833) verlängert den Standard im Sinne dänischer Renaissance-Münzpraxis."
          en: "Verbatim from <a href=\"https://www.danskmoent.dk/1rosenob.htm\" target=\"_blank\">danskmoent.dk</a>: «<i>Navnet Rosenobel stammer fra den engelske mønt Rose noble fra 13-1400-tallet</i>» — the name derives from the English Rose Noble coin of the 13th-14th centuries<sup>[ref:danskmoent-1rosenobel]</sup>. The English Rose Noble (Edward IV 1465, 7.78 g, 10s = half-pound, .995 fineness) is the late-medieval model; the Danish Rosenobel coinage is a late adaptation in the Renaissance context, mediated through the <a href=\"https://en.wikipedia.org/wiki/Sound_Dues\" target=\"_blank\">Øresund Toll</a> (introduced by Hans in 1497). Frederik II's single 1584 piece (7.69 g) still follows the classical 7.78-g standard; Christian IV's mass coinage 1611-1629 (8.994 g at .833) extends the standard in the spirit of Danish Renaissance mint practice."
          uk: "Verbatim з <a href=\"https://www.danskmoent.dk/1rosenob.htm\" target=\"_blank\">danskmoent.dk</a>: «<i>Navnet Rosenobel stammer fra den engelske mønt Rose noble fra 13-1400-tallet</i>» — назва походить від англійської монети Rose Noble XIII-XIV століть<sup>[ref:danskmoent-1rosenobel]</sup>. Англійський Rose Noble (Edward IV 1465, 7,78 г, 10s = пів-фунта, .995 проба) — пізньосередньовічна модель; данське карбування Rosenobel — пізня адаптація в ренесансному контексті, опосередкована через <a href=\"https://en.wikipedia.org/wiki/Sound_Dues\" target=\"_blank\">Øresund-мито</a> (запроваджене Hans 1497). Окремий зразок Frederik II 1584 р. (7,69 г) ще слідує класичному стандарту 7,78 г; масове карбування Christian IV 1611-1629 (8,994 г за .833) продовжує стандарт у дусі данської ренесансної монетної практики."
          da: 'Ordret fra <a href="https://www.danskmoent.dk/1rosenob.htm" target="_blank">danskmoent.dk</a>: «<i>Navnet Rosenobel stammer fra den engelske mønt Rose noble fra 13-1400-tallet</i>»<sup>[ref:danskmoent-1rosenobel]</sup>. Den engelske rosenobel (Edward 4. 1465, 7,78 g, 10 s. = ½ pund, lødighed .995) er den senmiddelalderlige model; den danske rosenobelprægning er en sen tilpasning i renæssancesammenhæng, formidlet gennem <a href="https://en.wikipedia.org/wiki/Sound_Dues" target="_blank">Øresundstolden</a> (indført af Hans i 1497). Frederik 2.s enkelte stykke fra 1584 (7,69 g) følger endnu standarden på 7,78 g; Christian 4.s masseprægning 1611-1629 (8,994 g ved .833) forlænger standarden i dansk renæssancemøntpraksis.'
      - key:
          de: "Wirtschaftlicher Hintergrund — Kalmar-Krieg und Söldnerbezahlung"
          en: "Economic background — Kalmar War and mercenary pay"
          uk: "Економічний контекст — Кальмарська війна і оплата найманців"
          da: Økonomisk baggrund — Kalmarkrigen og soldbetaling
        value:
          de: "Christian IVs Hauptkarbungsperiode 1611-1613 fällt exakt mit dem <a href=\"https://www.historyofwar.org/articles/wars_kalmar.html\" target=\"_blank\">Kalmar-Krieg</a> (1611-1613)<sup>[ref:historyofwar-kalmar-war-1611]</sup>: «<i>King Christian IV attacked Sweden in the 1611-13 Kalmar War but failed to accomplish his main objective of forcing Sweden to return to the union with Denmark. The war led to no territorial changes, but Sweden was forced to pay a war indemnity of 1 million silver riksdaler to Denmark</i>». Die Prestige-Goldemission diente der Söldnerbezahlung und diplomatischen Repräsentation. Die Folge-Karbung 1627 + 1629 fällt in den Beginn der dänischen Beteiligung am Dreißigjährigen Krieg (Kaiserlich-Dänischer Krieg 1625-1629) — selbe Funktion, anderer Konflikt-Kontext."
          en: "Christian IV's main coinage period 1611-1613 coincides exactly with the <a href=\"https://www.historyofwar.org/articles/wars_kalmar.html\" target=\"_blank\">Kalmar War</a> (1611-1613)<sup>[ref:historyofwar-kalmar-war-1611]</sup>: «<i>King Christian IV attacked Sweden in the 1611-13 Kalmar War but failed to accomplish his main objective of forcing Sweden to return to the union with Denmark. The war led to no territorial changes, but Sweden was forced to pay a war indemnity of 1 million silver riksdaler to Denmark</i>». The prestige gold issue served mercenary pay and diplomatic representation. The follow-up coinage 1627 + 1629 falls within the start of Danish involvement in the Thirty Years' War (Imperial-Danish War 1625-1629) — the same function under a different conflict."
          uk: "Головний період карбування Christian IV 1611-1613 точно збігається з <a href=\"https://www.historyofwar.org/articles/wars_kalmar.html\" target=\"_blank\">Кальмарською війною</a> (1611-1613)<sup>[ref:historyofwar-kalmar-war-1611]</sup>: «<i>King Christian IV attacked Sweden in the 1611-13 Kalmar War but failed to accomplish his main objective of forcing Sweden to return to the union with Denmark. The war led to no territorial changes, but Sweden was forced to pay a war indemnity of 1 million silver riksdaler to Denmark</i>». Престижна золота емісія слугувала оплаті найманців і дипломатичній репрезентації. Наступне карбування 1627 + 1629 припадає на початок данської участі у Тридцятилітній війні (Імперсько-данська війна 1625-1629) — та сама функція, інший конфлікт."
          da: 'Christian 4.s hovedprægningsperiode 1611-1613 falder nøjagtigt sammen med <a href="https://www.historyofwar.org/articles/wars_kalmar.html" target="_blank">Kalmarkrigen</a> (1611-1613)<sup>[ref:historyofwar-kalmar-war-1611]</sup>: «<i>King Christian IV attacked Sweden in the 1611-13 Kalmar War but failed to accomplish his main objective of forcing Sweden to return to the union with Denmark. The war led to no territorial changes, but Sweden was forced to pay a war indemnity of 1 million silver riksdaler to Denmark</i>». Prestigeguldet tjente soldbetaling og diplomatisk repræsentation. Den efterfølgende prægning i 1627 og 1629 falder i begyndelsen af den danske deltagelse i Trediveårskrigen (Kejserkrigen 1625-1629) — samme funktion, en anden konflikt.'
      - key:
          de: "Tarif zum Speciedaler (rechnerisch)"
          en: "Tariff vs. Speciedaler (computed)"
          uk: "Тариф до Speciedaler (розрахунково)"
          da: Tarif mod speciedaleren (beregnet)
        value:
          de: "Kein period-attestierter formaler Tarif gefunden. Aus dem Feingewicht 7,492 g Au bei Markt-Au/Ag ≈ 12,5:1 (frühes 17. Jahrhundert) ≈ 93,65 g Feinsilber-Äquivalent. Bei 9¼-Speciedaler-Standard 25,28 g Feinsilber ergibt das ≈ <b>3,7 Speciedaler</b> Metallwert per Rosenobel — typischer Tarif somit vermutlich 3-4 Specie (ähnlich der späteren Frederik-III-Guldkrone mit 3½-Specie-Tarif)."
          en: "No period-attested formal tariff has been found. From the fine weight 7.492 g Au at a market Au/Ag of ≈ 12.5:1 (early 17th century) ≈ 93.65 g fine-silver equivalent. At the 9¼-Speciedaler standard of 25.28 g fine silver this gives ≈ <b>3.7 Speciedaler</b> metal value per Rosenobel — the typical tariff was thus probably 3-4 Specie (similar to the later Frederik-III-Guldkrone with a 3½-Specie tariff)."
          uk: "Period-attested формального тарифу не знайдено. З чистої ваги 7,492 г Au при ринковому Au/Ag ≈ 12,5:1 (початок XVII ст.) ≈ 93,65 г чистого срібла еквівалент. За стандарту 9¼-Speciedaler 25,28 г чистого срібла це дає ≈ <b>3,7 Speciedaler</b> металевого значення на Rosenobel — типовий тариф імовірно 3-4 Specie (подібно до пізнішої Frederik-III-Guldkrone з тарифом 3½ Specie)."
          da: Ingen samtidigt belagt formel tarif er fundet. Ud fra finvægten 7,492 g guld ved et markedsforhold guld/sølv ≈ 12,5:1 (tidligt 1600-tal) svarer det til ≈ 93,65 g fint sølv. Ved speciedalerstandarden i 9¼ på 25,28 g fint sølv giver det ≈ <b>3,7 speciedaler</b> i metalværdi pr. rosenobel — den typiske tarif har derfor formentlig været 3-4 specie (svarende til den senere guldkrone under Frederik 3. med en tarif på 3½ specie).
    rechnungsfraktionen_label:
      de: "Rechnungsfraktionen (Rosenobel-Prestige + Sub-Stückelung)"
      en: "Accounting fractions (Rosenobel prestige + sub-denomination)"
      uk: "Розрахункові фракції (Rosenobel-престиж + субномінали)"
      da: Regningsfraktioner (rosenobelen som prestigemønt og dens underpålydende)
    rechnungsfraktionen:
      de: |
        <b>1 Rosenobel</b> = <b>8,994 g rauh / 7,492 g fein</b> @ 20 Karat (.833)<sup>[ref:danskmoent-1rosenobel]</sup><br>
        <b>½ Rosenobel</b> («Guldridder») = 4,497 g rauh / 3,746 g fein @ .833 (Hede 24, Christian IV. 1611)<br>
        <em>Tarif zum Speciedaler:</em> rechnerisch ≈ 3-4 Specie per Feingewicht-Konversion (Au/Ag 12,5:1), kein period-attestierter formaler Tarif.<br>
        Englisches Rose-Noble-Modell (Edward IV. 1465): 7,78 g, 10 Schilling = ½ Pfund Sterling.
      en: |-
        <b>1 Rosenobel</b> = <b>8.994 g rough / 7.492 g fine</b> at 20 carats (.833)<sup>[ref:danskmoent-1rosenobel]</sup><br><b>½ Rosenobel</b> («Guldridder») = 4.497 g rough / 3.746 g fine at .833 (Hede 24, Christian IV 1611)<br><em>Tariff vs. Speciedaler:</em> computed ≈ 3-4 Specie via fine-weight conversion (Au/Ag 12.5:1); no period-attested formal tariff.<br>English Rose Noble model (Edward IV 1465): 7.78 g, 10 shillings = half-pound sterling.
      uk: |-
        <b>1 Rosenobel</b> = <b>8,994 г повної / 7,492 г чистого</b> за 20 карат (.833)<sup>[ref:danskmoent-1rosenobel]</sup><br><b>½ Rosenobel</b> («Guldridder») = 4,497 г повної / 3,746 г чистого за .833 (Hede 24, Christian IV 1611)<br><em>Тариф до Speciedaler:</em> розрахунково ≈ 3-4 Specie через конверсію чистої ваги (Au/Ag 12,5:1); period-attested формального тарифу немає.<br>Англійська модель Rose Noble (Edward IV 1465): 7,78 г, 10 шилінгів = пів-фунта стерлінгів.
      da: '<b>1 rosenobel</b> = <b>8,994 g rå / 7,492 g fin</b> ved 20 karat (.833)<sup>[ref:danskmoent-1rosenobel]</sup><br>

  <b>½ rosenobel</b> («guldridder») = 4,497 g rå / 3,746 g fin ved .833 (Hede 24, Christian 4. 1611)<br>

  <em>Tarif mod speciedaleren:</em> regnemæssigt ≈ 3-4 specie ved omregning af finvægten (guld/sølv 12,5:1), ingen samtidigt belagt formel tarif.<br>

  Den engelske rosenobelmodel (Edward 4. 1465): 7,78 g, 10 shilling = ½ pund sterling.

  '
  description:
    de: '<b>Renaissance-Anpassung des englischen Rose-Noble-Modells in der dänischen Königsmünze.</b> Verbatim aus <a href="https://www.danskmoent.dk/1rosenob.htm" target="_blank">danskmoent.dk</a>: «<i>Navnet Rosenobel stammer fra den engelske mønt Rose noble fra 13-1400-tallet</i>»<sup>[ref:danskmoent-1rosenob]</sup>. Frederik II. prägt 1584 in <b>Frederiksborg</b> einen unikalen Rosenobel-Vorläufer bei klassisch-englischer Brutto-Masse 7,69 g (Hede 7B / Schou 2 / Sieg 29) — wahrscheinlich näher am englischen Original 7,78 g (Edward IV. 1465 Rose Noble). Christian IV. nimmt das Programm 1611 in Kopenhagen wieder auf — standardisiertes Brutto <b>8,994 g bei 20 Karat (.833) Probe = 7,492 g fein</b> per Stück (Hede c4h23a + c4h24 verbatim). Sub-Stückelung <b>½ Rosenobel</b> (Hede 24, 1611, period-Spitzname <i>«Guldridder»</i> = «Goldritter»). Hauptkarbungsperiode 1611-1613 fällt exakt mit dem <a href="https://www.historyofwar.org/articles/wars_kalmar.html" target="_blank">Kalmar-Krieg</a> (1611-1613)<sup>[ref:historyofwar-wars-kalmar]</sup>: «<i>King Christian IV attacked Sweden in the 1611-13 Kalmar War but failed to accomplish his main objective of forcing Sweden to return to the union with Denmark. The war led to no territorial changes, but Sweden was forced to pay a war indemnity of 1 million silver riksdaler to Denmark.</i>» Folge-Karbung 1627 + 1629 fällt in den Beginn der dänischen Beteiligung am Dreißigjährigen Krieg (Kaiserlich-Dänischer Krieg 1625-1629). Funktion durchgehend: <b>Prestige-Goldemission zur Söldnerbezahlung und diplomatischen Repräsentation</b>, nicht Tagesumlauf. Tarif zum Speciedaler rechnerisch ≈ 3-4 Specie (kein period-attestierter formaler Tarif). <em>Distinkter Müntzfuß-Stamm</em>, nicht zu verwechseln mit der früheren [fuss:nobel_fod] (Sovereign-Tier 14,61 g @ .986, 1496-1532) oder der späteren [fuss:guldkrone]-Tarifmünze Christians IV. (5,996 g @ .917, 1618+).'
    en: '<b>A Renaissance adaptation of the English Rose Noble model in the Danish royal mint.</b> Verbatim from <a href="https://www.danskmoent.dk/1rosenob.htm" target="_blank">danskmoent.dk</a>: «<i>Navnet Rosenobel stammer fra den engelske mønt Rose noble fra 13-1400-tallet</i>»<sup>[ref:danskmoent-1rosenob]</sup>. Frederik II strikes a unique Rosenobel predecessor at <b>Frederiksborg</b> in 1584 at the classical English brutto of 7.69 g (Hede 7B / Schou 2 / Sieg 29) — probably closer to the English original 7.78 g (Edward IV 1465 Rose Noble). Christian IV resumes the programme in Copenhagen in 1611 — standardised brutto <b>8.994 g at 20 carats (.833) fineness = 7.492 g fine</b> per piece (Hede c4h23a + c4h24 verbatim). Sub-denomination <b>½ Rosenobel</b> (Hede 24, 1611, period nickname <i>«Guldridder»</i> = «gold knight»). The main coinage period 1611-1613 coincides exactly with the <a href="https://www.historyofwar.org/articles/wars_kalmar.html" target="_blank">Kalmar War</a> (1611-1613)<sup>[ref:historyofwar-wars-kalmar]</sup>: «<i>King Christian IV attacked Sweden in the 1611-13 Kalmar War but failed to accomplish his main objective of forcing Sweden to return to the union with Denmark. The war led to no territorial changes, but Sweden was forced to pay a war indemnity of 1 million silver riksdaler to Denmark.</i>» The follow-up coinage 1627 + 1629 falls within the start of Danish involvement in the Thirty Years'' War (Imperial-Danish War 1625-1629). Function throughout: <b>a prestige gold issue for mercenary pay and diplomatic representation</b>, not daily circulation. Tariff vs. Speciedaler computed ≈ 3-4 Specie (no period-attested formal tariff). <em>A distinct coinage-standard lineage</em>, not to be confused with the earlier [fuss:nobel_fod] (Sovereign tier 14.61 g at .986, 1496-1532) or the later [fuss:guldkrone] tariff coin of Christian IV (5.996 g at .917, 1618+).'
    uk: '<b>Ренесансна адаптація моделі англійського Rose Noble у данській королівській монеті.</b> Verbatim з <a href="https://www.danskmoent.dk/1rosenob.htm" target="_blank">danskmoent.dk</a>: «<i>Navnet Rosenobel stammer fra den engelske mønt Rose noble fra 13-1400-tallet</i>»<sup>[ref:danskmoent-1rosenob]</sup>. Frederik II карбує унікального попередника Rosenobel у <b>Frederiksborg</b> 1584 р. з класичною англійською повною вагою 7,69 г (Hede 7B / Schou 2 / Sieg 29) — імовірно ближче до англійського оригіналу 7,78 г (Edward IV 1465 Rose Noble). Christian IV відновлює програму в Копенгагені 1611 р. — стандартизована повна вага <b>8,994 г за 20 карат (.833) пробою = 7,492 г чистого</b> на штуку (Hede c4h23a + c4h24 verbatim). Субномінал <b>½ Rosenobel</b> (Hede 24, 1611, period-прізвисько <i>«Guldridder»</i> = «золотий лицар»). Головний період карбування 1611-1613 точно збігається з <a href="https://www.historyofwar.org/articles/wars_kalmar.html" target="_blank">Кальмарською війною</a> (1611-1613)<sup>[ref:historyofwar-wars-kalmar]</sup>: «<i>King Christian IV attacked Sweden in the 1611-13 Kalmar War but failed to accomplish his main objective of forcing Sweden to return to the union with Denmark. The war led to no territorial changes, but Sweden was forced to pay a war indemnity of 1 million silver riksdaler to Denmark.</i>» Наступне карбування 1627 + 1629 припадає на початок данської участі у Тридцятилітній війні (Імперсько-данська війна 1625-1629). Функція впродовж: <b>престижна золота емісія для оплати найманцям і дипломатичної репрезентації</b>, не щоденний обіг. Тариф до Speciedaler розрахунково ≈ 3-4 Specie (period-attested формального тарифу немає). <em>Окрема стопа</em>, не плутати з ранішою [fuss:nobel_fod] (Sovereign-tier 14,61 г за .986, 1496-1532) чи пізнішою тарифною [fuss:guldkrone] Christian IV (5,996 г за .917, 1618+).'
    da: '<b>Renæssancens tilpasning af den engelske rosenobelmodel i den danske kongemønt.</b> Ordret fra <a href="https://www.danskmoent.dk/1rosenob.htm" target="_blank">danskmoent.dk</a>: «<i>Navnet Rosenobel stammer fra den engelske mønt Rose noble fra 13-1400-tallet</i>»<sup>[ref:danskmoent-1rosenob]</sup>. Frederik 2. præger i 1584 på <b>Frederiksborg</b> en unik forløber for rosenobelen med den klassisk engelske bruttovægt på 7,69 g (Hede 7B / Schou 2 / Sieg 29) — formentlig nærmere det engelske forlæg på 7,78 g (Edward 4.s rosenobel fra 1465). Christian 4. genoptager programmet i 1611 i København — en standardiseret bruttovægt på <b>8,994 g ved 20 karat (.833) = 7,492 g fin</b> pr. stykke (Hede c4h23a og c4h24 ordret). Underpålydendet <b>½ rosenobel</b> (Hede 24, 1611, i samtiden kaldt <i>«guldridder»</i>). Hovedprægningsperioden 1611-1613 falder nøjagtigt sammen med <a href="https://www.historyofwar.org/articles/wars_kalmar.html" target="_blank">Kalmarkrigen</a> (1611-1613)<sup>[ref:historyofwar-wars-kalmar]</sup>: «<i>King Christian IV attacked Sweden in the 1611-13 Kalmar War but failed to accomplish his main objective of forcing Sweden to return to the union with Denmark. The war led to no territorial changes, but Sweden was forced to pay a war indemnity of 1 million silver riksdaler to Denmark.</i>» Den efterfølgende prægning i 1627 og 1629 falder i begyndelsen af den danske deltagelse i Trediveårskrigen (Kejserkrigen 1625-1629). Funktionen er gennemgående: <b>prestigeguld til soldbetaling og diplomatisk repræsentation</b>, ikke daglig omsætning. Tariffen mod speciedaleren er regnemæssigt ≈ 3-4 specie (ingen samtidigt belagt formel tarif). <em>En særskilt møntfodsstamme</em>, som ikke må forveksles med den tidligere [fuss:nobel_fod] (sovereign-niveauet 14,61 g ved .986, 1496-1532) eller med Christian 4.s senere tarifmønt [fuss:guldkrone] (5,996 g ved .917, fra 1618).'
  fractions:
    "1": {soll_rau_g: 8.994, soll_fein_g: 7.492}       # 1 Rosenobel Christian IV (Hede c4h23a 1611-1629, .833)
    "1/2": {soll_rau_g: 4.497, soll_fein_g: 3.746}     # ½ Rosenobel «Guldridder» Christian IV (Hede c4h24 1611, .833)
  events:
    first_adoption:
      anywhere: 1584
      note: "Frederik II strikes a unique Rosenobel predecessor in 1584 at Frederiksborg (Hede 7B / Schou 2 / Sieg 29, unique specimen). The date is exact — the coin itself is dated 1584; Wilcke (1931) treats it as a standalone study under the title «Frederik II.s Guldmønt 1584» (Daler, Mark og Kroner 1481-1914, pp. 85-90); the piece is part of «Dronning Sophies gavesæt» (Queen Sophie's gift set, documented by Galster 1959 + Jensen Steen 1975). Brutto 7.69 g — close to the English classical Rose Noble standard 7.78 g. Programme not continued by Frederik II after 1584; the line is dormant until Christian IV revives it in 1611."
    first_mint:
      anywhere: 1584
      note: "Frederik II Rosenobel 1584 — Frederiksborg, Hede 7B, unique specimen (f2h7b), date is exact (specimen dated 1584). Fineness not recorded in the source; weight 7.69 g brutto. Source: danskmoent.dk (Hede 7B)."
    last_mint:
      anywhere: 1629
      note: "Christian IV Hede 23A Type A — last dated emission year 1629. Falls within the Imperial-Danish War (1625-1629). Christian IV does not resume Rosenobel coinage after 1629; the line transitions to other gold formats (Guldkrone from 1618 in parallel, Reichsdukatenfuß continuation)."
    std_end:
      anywhere: 1629
      approx_anywhere: true
      note: "Standard effectively ends with the last Christian IV emission 1629. No successor mint master continues the Rosenobel programme; the Sovereign-prestige niche in Danish gold coinage is filled later by the Frederik-III Guldkrone tariff programme (1655-1668, separate Müntzfuß lineage)."
    demonetisation:
      anywhere: 1700
      approx_anywhere: true
      note: "Approximate practical-circulation tail — Rosenobler served prestige + mercenary-pay functions, not daily circulation. Surviving specimens drift into the collector / numismatic register by the late 17th century. Hede c4h23a confirms emission across 5 years (1611, 1612, 1613, 1627, 1629); ½ Rosenobel only 1611."
    anywhere_label:
      de: Königreich Dänemark und Norwegen
      en: Royal Danish-Norwegian Realm
      uk: Королівство Данії і Норвегії
      da: Kongeriget Danmark og Norge
