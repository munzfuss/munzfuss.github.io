  '
  description:
    de: '<b>Christians IV. englisch-standardisiertes Versuchsgold von 1606-1608.</b> Nach seiner Englandreise 1606 ließ Christian IV. — dem Vorbild der Münzreform seines Schwagers Jakob I. folgend — dänische «<i>Sovereigns</i>» nach dem englischen <a href="https://en.wikipedia.org/wiki/Unite_(English_coin)" target="_blank">Unite</a> prägen, von annähernd gleichem Gewicht und Feingehalt wie die britischen Unites (22 Karat, ca. 10,0 g)<sup>[ref:stacksbowers-bruun-sovereign-1608]</sup>. Leit-Stück ist der <a href="https://www.danskmoent.dk/chr/c4h19.htm" target="_blank">1 Sovereign 1608</a> aus Helsingør (Hede 19, Rauhgewicht ca. 10,0 g, in ca. 3 Exemplaren bekannt)<sup>[ref:danskmoent-c4h19-sovereign]</sup>; dazu drei unikale Probe-Varianten aus Kopenhagen — Hede 20 (22,64 g), Hede 21 (8,08-10,75 g) und Hede 22 (4,65 g)<sup>[ref:danskmoent-c4h20-22-sovereign-proever]</sup>. Hede klassifiziert den gesamten Strang 19-22 als «<i>Prøvemønt efter engelsk forbillede</i>» (Probegold nach englischem Vorbild): der Feingehalt ist in keiner Quelle angegeben («Finhed ?») und wird hier aus dem bewußt kopierten Unite-Standard abgeleitet. Ein period-attestierter Tarif oder eine fortlaufende Umlaufemission fehlt; Julius Wilcke widmete dem Leit-Stück eine eigene Studie «<i>Dansk Sovereign 1608</i>» (NFM VI 1923). <em>Distinkter, experimenteller Müntzfuß-Ansatz</em>, nicht in den Massenumlauf überführt — zu unterscheiden von der englisch-mittelalterlichen [fuss:nobel_fod] (1496-1532), der zeitgleichen [fuss:rosenobel_fod] (Christian IV. ab 1611, .833) und dem regulären [fuss:reichsdukatenfuss].'
    en: '<b>Christian IV''s English-standard experimental gold of 1606-1608.</b> After his 1606 journey to England, Christian IV — following the coin reform of his brother-in-law James I — had Danish «<i>Sovereigns</i>» struck to the English <a href="https://en.wikipedia.org/wiki/Unite_(English_coin)" target="_blank">Unite</a>, of approximately the same weight and fineness as the British Unites (22 carats, ca. 10.0 g)<sup>[ref:stacksbowers-bruun-sovereign-1608]</sup>. The lead piece is the <a href="https://www.danskmoent.dk/chr/c4h19.htm" target="_blank">1 Sovereign 1608</a> from Helsingør (Hede 19, rough weight ca. 10.0 g, known in ca. 3 examples)<sup>[ref:danskmoent-c4h19-sovereign]</sup>; alongside three unique trial variants from Copenhagen — Hede 20 (22.64 g), Hede 21 (8.08-10.75 g) and Hede 22 (4.65 g)<sup>[ref:danskmoent-c4h20-22-sovereign-proever]</sup>. Hede classifies the whole 19-22 strand as «<i>Prøvemønt efter engelsk forbillede</i>» (trial gold after the English model): the fineness is stated in no source («fineness ?») and is inferred here from the deliberately copied Unite standard. No period-attested tariff or continuing circulation issue survives; Julius Wilcke devoted a dedicated study «<i>Dansk Sovereign 1608</i>» to the lead piece (NFM VI 1923). <em>A distinct, experimental coinage-standard attempt</em>, not carried into mass circulation — to be distinguished from the medieval-English [fuss:nobel_fod] (1496-1532), the contemporaneous [fuss:rosenobel_fod] (Christian IV from 1611, .833) and the regular [fuss:reichsdukatenfuss].'
    uk: '<b>Англо-стандартне експериментальне золото Кристіана IV 1606-1608.</b> Після візиту в Англію 1606 р. Кристіан IV — за взірцем монетної реформи свого шваґра Джеймса I — звелів карбувати данські «<i>Sovereigns</i>» за англійським <a href="https://en.wikipedia.org/wiki/Unite_(English_coin)" target="_blank">Unite</a>, приблизно тієї ж ваги й проби, що й британські Unite (22 карати, бл. 10,0 г)<sup>[ref:stacksbowers-bruun-sovereign-1608]</sup>. Провідний стук — <a href="https://www.danskmoent.dk/chr/c4h19.htm" target="_blank">1 Sovereign 1608</a> з Helsingør (Hede 19, повна вага бл. 10,0 г, відомий у бл. 3 екземплярах)<sup>[ref:danskmoent-c4h19-sovereign]</sup>; поряд — три унікальні пробні варіанти з Копенгагена: Hede 20 (22,64 г), Hede 21 (8,08-10,75 г) і Hede 22 (4,65 г)<sup>[ref:danskmoent-c4h20-22-sovereign-proever]</sup>. Hede класифікує весь ряд 19-22 як «<i>Prøvemønt efter engelsk forbillede</i>» (пробне золото за англ. взірцем): проба в жодному джерелі не вказана («Finhed ?») і виводиться тут із навмисно скопійованого стандарту Unite. Period-attested тарифу чи тривалої обігової емісії не збереглося; Юліус Wilcke присвятив провідному стуку окрему студію «<i>Dansk Sovereign 1608</i>» (NFM VI 1923). <em>Окрема, експериментальна спроба стопи</em>, не переведена в масовий обіг — відрізняти від середньовічно-англійської [fuss:nobel_fod] (1496-1532), одночасної [fuss:rosenobel_fod] (Кристіан IV від 1611, .833) і регулярного [fuss:reichsdukatenfuss].'
    da: '<b>Christian 4.s forsøgsguld efter engelsk standard 1606-1608.</b> Efter sin Englandsrejse i 1606 lod Christian 4. — efter forbillede i svogeren Jakob 1.s møntreform — præge danske «<i>sovereigns</i>» efter den engelske <a href="https://en.wikipedia.org/wiki/Unite_(English_coin)" target="_blank">unite</a>, af tilnærmelsesvis samme vægt og lødighed som de britiske unites (22 karat, ca. 10,0 g)<sup>[ref:stacksbowers-bruun-sovereign-1608]</sup>. Hovedstykket er <a href="https://www.danskmoent.dk/chr/c4h19.htm" target="_blank">1 sovereign 1608</a> fra Helsingør (Hede 19, bruttovægt ca. 10,0 g, kendt i ca. 3 eksemplarer)<sup>[ref:danskmoent-c4h19-sovereign]</sup>; dertil tre unikke prøvevarianter fra København — Hede 20 (22,64 g), Hede 21 (8,08-10,75 g) og Hede 22 (4,65 g)<sup>[ref:danskmoent-c4h20-22-sovereign-proever]</sup>. Hede klassificerer hele strengen 19-22 som «<i>Prøvemønt efter engelsk forbillede</i>»: lødigheden er ikke angivet i nogen kilde («Finhed ?») og udledes her af den bevidst kopierede unite-standard. En samtidigt belagt tarif eller en løbende omløbsudmøntning mangler; Julius Wilcke viede hovedstykket en selvstændig studie, «<i>Dansk Sovereign 1608</i>» (NFM VI 1923). <em>Et særskilt, eksperimentelt møntfodsforsøg</em>, der ikke blev ført over i masseomløb — og som skal holdes ude fra den engelsk-middelalderlige [fuss:nobel_fod] (1496-1532), fra den samtidige [fuss:rosenobel_fod] (Christian 4. fra 1611, .833) og fra den regulære [fuss:reichsdukatenfuss].'
  fractions:
    "1": {soll_rau_g: 10.02, soll_fein_g: 9.184}      # 1 Sovereign Christian IV (Hede 19, 1608; fineness inferred .9166 = 22kt English Unite)
  events:
    first_adoption:
      anywhere: 1606
      note: "Christian IV visits England in 1606 and, after James I's Unite reform, initiates the Danish Sovereign programme. The lead coin (Hede 19) is dated 1608 (Helsingør); the trial variants (Hede 20-22, Copenhagen) are undated. The whole Hede 19-22 strand is Hede-classified «Prøvemønt efter engelsk forbillede» — trial gold after the English model."
    first_mint:
      anywhere: 1608
      note: "1 Sovereign 1608, Helsingør (Hede 19, Schou 1, Sieg 150, Fr 35, KM A47), ca. 10.0 g brutto, rarity R (~3 known). The undated trial variants (Hede 20-22) are attributed to the same 1606-1608 window. Fineness not recorded in the sources; inferred .9166 (22 carats) from the copied English Unite."
    last_mint:
      anywhere: 1608
      approx_anywhere: true
      note: "The dated Sovereign is 1608; the undated trial pieces sit in the same window. The programme is not continued as a circulating standard — Christian IV's regular gold reverts to the Reichsdukatenfuß and (from 1611) the Rosenobel-fod."
    std_end:
      anywhere: 1608
      approx_anywhere: true
      note: "Experimental standard; effectively a single 1606-1608 episode. No successor emission or period-attested tariff."
    anywhere_label:
      de: Königreich Dänemark und Norwegen
      en: Royal Danish-Norwegian Realm
      uk: Королівство Данії і Норвегії
      da: Kongeriget Danmark og Norge
