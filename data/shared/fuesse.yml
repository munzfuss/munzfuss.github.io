          da: <b>27¾ Marck Banco</b> = <b>9¼ rigsdaler</b> = 1 fin Cöllnische Marck — den formelle møntfod for den kongelige danske <b>Altonaer Bank</b> efter Altonaer Bankordnung § 19; talmæssigt identisk med speciedalerstandarden i 9¼-Thaler-Fuß, blot opdelt i Marck Banco i stedet for rigsdaler (1 Marck Banco = ⅓ Reichsthaler Specie ≈ 8,427 g fin)<sup>[ref:bobzin-muenzfuesse]</sup>
