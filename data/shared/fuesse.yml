        value:
          de: "<b>Leit-Stück:</b> <a href=\"https://www.danskmoent.dk/chr/c4h19.htm\" target=\"_blank\">1 Sovereign 1608</a>, Helsingør (Hede 19 / Schou 1 / Sieg 150 / Fr 35 / KM A47), Rauhgewicht ca. 10,0 g, Rarität R (Stack''s Bowers Bruun-Lot 1021: «<i>best of the three known examples in private collections</i>», Mzm. Hans Flemming)<sup>[ref:stacksbowers-bruun-sovereign-1608]</sup>. <b>Probe-Varianten</b> (alle u.år, Kopenhagen, unikal/RRR, im Kgl. Mønt- og Medaillesamling): Hede 20 (22,64 g, Schou 8, Sieg 159, Fr 50), Hede 21 (21A+21B, 8,08-10,75 g, Schou 10-12, Sieg 158, Fr 52), Hede 22 (4,65 g, Schou 13, Sieg 157, Fr 53)<sup>[ref:danskmoent-c4h20-22-sovereign-proever]</sup>. Feingehalt in keiner der Quellen angegeben («Finhed ?»)."
          en: "<b>Lead piece:</b> <a href=\"https://www.danskmoent.dk/chr/c4h19.htm\" target=\"_blank\">1 Sovereign 1608</a>, Helsingør (Hede 19 / Schou 1 / Sieg 150 / Fr 35 / KM A47), rough weight ca. 10.0 g, rarity R (Stack''s Bowers Bruun lot 1021: «<i>best of the three known examples in private collections</i>», mintmaster Hans Flemming)<sup>[ref:stacksbowers-bruun-sovereign-1608]</sup>. <b>Trial variants</b> (all undated, Copenhagen, unique/RRR, in the Royal Coin Cabinet): Hede 20 (22.64 g, Schou 8, Sieg 159, Fr 50), Hede 21 (21A+21B, 8.08-10.75 g, Schou 10-12, Sieg 158, Fr 52), Hede 22 (4.65 g, Schou 13, Sieg 157, Fr 53)<sup>[ref:danskmoent-c4h20-22-sovereign-proever]</sup>. Fineness given in none of the sources («fineness ?»)."
          uk: "<b>Провідний стук:</b> <a href=\"https://www.danskmoent.dk/chr/c4h19.htm\" target=\"_blank\">1 Sovereign 1608</a>, Helsingør (Hede 19 / Schou 1 / Sieg 150 / Fr 35 / KM A47), повна вага бл. 10,0 г, рідкісність R (Stack''s Bowers Bruun-лот 1021: «<i>best of the three known examples in private collections</i>», монетмайстер Hans Flemming)<sup>[ref:stacksbowers-bruun-sovereign-1608]</sup>. <b>Пробні варіанти</b> (усі u.år, Копенгаген, унікати/RRR, у Королівському монетному кабінеті): Hede 20 (22,64 г, Schou 8, Sieg 159, Fr 50), Hede 21 (21A+21B, 8,08-10,75 г, Schou 10-12, Sieg 158, Fr 52), Hede 22 (4,65 г, Schou 13, Sieg 157, Fr 53)<sup>[ref:danskmoent-c4h20-22-sovereign-proever]</sup>. Проба в жодному з джерел не вказана («Finhed ?»)."
          da: '<b>Hovedstykke:</b> <a href="https://www.danskmoent.dk/chr/c4h19.htm" target="_blank">1 sovereign 1608</a>, Helsingør (Hede 19 / Schou 1 / Sieg 150 / Fr 35 / KM A47), bruttovægt ca. 10,0 g, sjældenhed R (Stack''s Bowers, Bruun-lot 1021: «<i>best of the three known examples in private collections</i>», møntmester Hans Flemming)<sup>[ref:stacksbowers-bruun-sovereign-1608]</sup>. <b>Prøvevarianter</b> (alle u. år, København, unikke/RRR, i Den kgl. Mønt- og Medaillesamling): Hede 20 (22,64 g, Schou 8, Sieg 159, Fr 50), Hede 21 (21A+21B, 8,08-10,75 g, Schou 10-12, Sieg 158, Fr 52) og Hede 22 (4,65 g, Schou 13, Sieg 157, Fr 53)<sup>[ref:danskmoent-c4h20-22-sovereign-proever]</sup>. Lødigheden er ikke angivet i nogen af kilderne («Finhed ?»).'
      - key:
          de: "Englisches Vorbild — der Unite Jakobs I."
          en: "English model — James I's Unite"
          uk: "Англійська модель — Unite Джеймса I"
          da: Engelsk forbillede — Jakob 1.s unite
        value:
          de: "Christian IV. besuchte 1606 England; nach dem Vorbild der Münzreform seines Schwagers Jakob I. ließ er dänische «<i>Sovereigns</i>» prägen — von annähernd gleichem Gewicht und Feingehalt wie die neuen britischen <a href=\"https://en.wikipedia.org/wiki/Unite_(English_coin)\" target=\"_blank\">Unites</a><sup>[ref:stacksbowers-bruun-sovereign-1608]</sup>. Der englische Unite (1604-1619, 20 Schilling) war Kronengold zu <b>22 Karat (≈ 916 ‰)</b> bei ca. 10,0 g — daher die abgeleitete Probe der dänischen Stücke. Die 10,02 g des Bruun-Sovereigns entsprechen exakt dem vorreduzierten Unite-Gewicht (vor der 1612-Reduktion zum «Laurel»)."
          en: "Christian IV visited England in 1606; after the coin reform of his brother-in-law James I he had Danish «<i>Sovereigns</i>» struck — of approximately the same weight and fineness as the new British <a href=\"https://en.wikipedia.org/wiki/Unite_(English_coin)\" target=\"_blank\">Unites</a><sup>[ref:stacksbowers-bruun-sovereign-1608]</sup>. The English Unite (1604-1619, 20 shillings) was crown gold at <b>22 carats (≈ 916 ‰)</b> at ca. 10.0 g — hence the inferred fineness of the Danish pieces. The Bruun Sovereign's 10.02 g match the pre-reduction Unite weight exactly (before the 1612 reduction to the «Laurel»)."
          uk: "Кристіан IV відвідав Англію 1606 р.; за взірцем монетної реформи свого шваґра Джеймса I він звелів карбувати данські «<i>Sovereigns</i>» — приблизно тієї ж ваги й проби, що й нові британські <a href=\"https://en.wikipedia.org/wiki/Unite_(English_coin)\" target=\"_blank\">Unite</a><sup>[ref:stacksbowers-bruun-sovereign-1608]</sup>. Англійський Unite (1604-1619, 20 шилінгів) — коронне золото <b>22 карати (≈ 916 ‰)</b> при бл. 10,0 г — звідси виведена проба данських стуків. 10,02 г Bruun-Sovereign точно відповідають дореформеній вазі Unite (до редукції 1612 р. до «Laurel»)."
          da: Christian 4. besøgte England i 1606; efter forbillede i svogeren Jakob 1.s møntreform lod han præge danske «<i>sovereigns</i>» — af tilnærmelsesvis samme vægt og lødighed som de nye britiske <a href="https://en.wikipedia.org/wiki/Unite_(English_coin)" target="_blank">unites</a><sup>[ref:stacksbowers-bruun-sovereign-1608]</sup>. Den engelske unite (1604-1619, 20 shilling) var kronguld til <b>22 karat (≈ 916 ‰)</b> ved ca. 10,0 g — deraf den udledte lødighed for de danske stykker. De 10,02 g på Bruun-sovereignen svarer nøjagtigt til unitens vægt før nedsættelsen (før reduktionen i 1612 til «laurel»).
      - key:
          de: "Status — Versuchsgold, kein Massenumlauf"
          en: "Status — experimental gold, no mass circulation"
          uk: "Статус — експериментальне золото, без масового обігу"
          da: Status — forsøgsguld, intet masseomløb
        value:
          de: "Hede klassifiziert den gesamten Strang 19-22 als «<i>Prøvemønt efter engelsk forbillede</i>» — Probegold nach englischem Vorbild. Die Stücke überleben nur in Einzel- bzw. RRR-Exemplaren (Hede 19 in ca. 3 bekannten Stücken, Hede 20-22 unikal), sämtlich im Kgl. Mønt- og Medaillesamling bzw. Privatsammlungen. Ein period-attestierter Tarif oder eine fortlaufende Emission ist nicht überliefert; Julius Wilcke widmete dem Stück eine eigene Studie «<i>Dansk Sovereign 1608</i>» (NFM VI 1923, S. 277-283)<sup>[ref:danskmoent-c4h19-sovereign]</sup>. Christian IV. führt die englische Linie nicht als Umlaufstandard fort — sein reguläres Prestigegold folgt weiter dem [fuss:reichsdukatenfuss] und (ab 1611) dem [fuss:rosenobel_fod]."
          en: "Hede classifies the whole 19-22 strand as «<i>Prøvemønt efter engelsk forbillede</i>» — trial gold after the English model. The pieces survive only in single or RRR specimens (Hede 19 in ca. 3 known examples, Hede 20-22 unique), all in the Royal Coin Cabinet or private collections. No period-attested tariff or continuing emission is recorded; Julius Wilcke devoted a dedicated study «<i>Dansk Sovereign 1608</i>» to the piece (NFM VI 1923, pp. 277-283)<sup>[ref:danskmoent-c4h19-sovereign]</sup>. Christian IV does not carry the English line on as a circulating standard — his regular prestige gold continues under the [fuss:reichsdukatenfuss] and (from 1611) the [fuss:rosenobel_fod]."
          uk: "Hede класифікує весь ряд 19-22 як «<i>Prøvemønt efter engelsk forbillede</i>» — пробне золото за англійським взірцем. Стуки вціліли лише в поодиноких або RRR-екземплярах (Hede 19 — бл. 3 відомих, Hede 20-22 унікати), усі в Королівському монетному кабінеті чи приватних збірках. Period-attested тарифу чи тривалої емісії не збереглося; Юліус Wilcke присвятив стуку окрему студію «<i>Dansk Sovereign 1608</i>» (NFM VI 1923, с. 277-283)<sup>[ref:danskmoent-c4h19-sovereign]</sup>. Кристіан IV не продовжує англійську лінію як обіговий стандарт — його регулярне престижне золото далі йде за [fuss:reichsdukatenfuss] і (від 1611) [fuss:rosenobel_fod]."
          da: Hede klassificerer hele strengen 19-22 som «<i>Prøvemønt efter engelsk forbillede</i>». Stykkerne overlever kun i enkelte eller RRR-eksemplarer (Hede 19 i ca. 3 kendte stykker, Hede 20-22 unikke), alle i Den kgl. Mønt- og Medaillesamling eller i privatsamlinger. En samtidigt belagt tarif eller en løbende udmøntning er ikke overleveret; Julius Wilcke viede stykket en selvstændig studie, «<i>Dansk Sovereign 1608</i>» (NFM VI 1923, s. 277-283)<sup>[ref:danskmoent-c4h19-sovereign]</sup>. Christian 4. fører ikke den engelske linje videre som omløbsstandard — hans regulære prestigeguld følger fortsat [fuss:reichsdukatenfuss] og fra 1611 [fuss:rosenobel_fod].
