      en: "Cologne mark rough = 233.856 g silver alloy · fineness 14 Lod = 875 ‰ · 8½ Sølvgylden per Cologne mark rough (Brev Dines Blicher Malmø Summer 1514, Wilcke 1950 Kap. 7-2 pp. 152-153) · per Sølvgylden 27.51 g rough / <b>24.07 g fine</b>"
      uk: "Кельнська марка повна = 233,856 г срібного сплаву · проба 14 Lod = 875 ‰ · 8½ Sølvgylden з повної кельнської марки (Brev Dines Blicher Malmø літа 1514, Wilcke 1950 Kap. 7-2 с. 152-153) · на Sølvgylden 27,51 г повної / <b>24,07 г чистого</b>"
      da: Cöllnische Marck rå = 233,856 g sølvlegering · lødighed 14 lod = 875 ‰ · 8½ sølvgylden af den rå Cölln. Marck (Dines Blichers brev, Malmø, sommeren 1514, Wilcke 1950 kap. 7-2 s. 152-153) · pr. sølvgylden 27,51 g rå / <b>24,07 g fin</b>
    badge:
      de: "Silber"
      en: "Silver"
      uk: "Срібло"
      da: Sølv
    rows:
      - key:
          de: "Feingewicht je Sølvgylden"
          en: "Fine weight per Sølvgylden"
          uk: "Чиста вага на Sølvgylden"
          da: Finvægt pr. sølvgylden
        value:
          de: "<b>24,07 g</b> fein (= 27,51 g rauh × 87,5 % Probe; entspricht 233,856 g ÷ 8½ Stück = 27,51 g rauh je Sølvgylden) — Marken-fin <b>mf 9,713</b>"
          en: "<b>24.07 g</b> fine (= 27.51 g rough × 87.5 % fineness; matches 233.856 g ÷ 8.5 pieces = 27.51 g rough per Sølvgylden) — Marken-fin <b>mf 9.713</b>"
          uk: "<b>24,07 г</b> чистого (= 27,51 г повної × 87,5 % проби; відповідає 233,856 г ÷ 8,5 шт. = 27,51 г повної на Sølvgylden) — Marken-fin <b>mf 9,713</b>"
          da: <b>24,07 g</b> fin (= 27,51 g rå × 87,5 % lødighed; svarer til 233,856 g ÷ 8½ stykker = 27,51 g rå pr. sølvgylden) — marken fin <b>mf 9,713</b>
      - key:
          de: "Feingehalt"
          en: "Fineness"
          uk: "Проба"
          da: Lødighed
        value:
          de: "<b>14 Lod = 14 ÷ 16 = 875 ‰</b> — Wendisch-Lübisch-Tradition mit ½-Lod Abstand vom späteren Christian-III-Standard (14½ Lod 1541). Hauptkurant-Tier; subsidiäre Skillinger und Hvide sind dramatisch tiefer (5¾ Lod / 4½ Lod) — Scheidemünz-Logik."
          en: "<b>14 Lod = 14 ÷ 16 = 875 ‰</b> — Wendisch-Lübisch tradition with ½-Lod gap to the later Christian III standard (14½ Lod 1541). Hauptkurant tier; subsidiary Skilling and Hvid pieces are dramatically lower (5¾ Lod / 4½ Lod) — Scheidemünze logic."
          uk: "<b>14 Lod = 14 ÷ 16 = 875 ‰</b> — Wendisch-Lübisch традиція з ½-Lod різницею до пізнішого стандарту Кристіана III (14½ Lod 1541). Hauptkurant-tier; субсидіарні Skilling і Hvid драматично нижчі (5¾ Lod / 4½ Lod) — Scheidemünze-логіка."
          da: <b>14 lod = 14 ÷ 16 = 875 ‰</b> — den vendisk-lybske tradition, et halvt lod fra den senere Christian 3.-standard (14½ lod 1541). Hovedkurantens trin; de underordnede skillinger og hvide ligger dramatisk lavere (5¾ lod / 4½ lod) — skillemøntslogik.
      - key:
          de: "Subnominale (Scheide-Tier)"
          en: "Sub-denominations (Scheide tier)"
          uk: "Субномінали (Scheide-tier)"
          da: Underpålydende (skillemøntstrinnet)
        value:
          de: "<b>1 Skilling</b> @ 5¾ Lod (≈ 359 ‰): 96 Stk./Cölln. Marck = 2,436 g rauh / 0,875 g fein, period-Tarif 32 Skilling = 1 Sølvgylden · <b>1 Hvid (Alb.)</b> @ 4½ Lod (≈ 281 ‰): 222 Stk./Cölln. Marck = 1,053 g rauh / 0,296 g fein, period-Tarif 96 Hvid = 1 Rhinsk Gylden Gold (gold-Tarif-Anker) · 3 Hvid = 1 Skilling"
          en: "<b>1 Skilling</b> at 5¾ Lod (≈ 359 ‰): 96 pieces/Cologne mark = 2.436 g rough / 0.875 g fine, period tariff 32 Skilling = 1 Sølvgylden · <b>1 Hvid (Alb.)</b> at 4½ Lod (≈ 281 ‰): 222 pieces/Cologne mark = 1.053 g rough / 0.296 g fine, period tariff 96 Hvid = 1 Rhinsk Gulden gold (gold-tariff anchor) · 3 Hvid = 1 Skilling"
          uk: "<b>1 Skilling</b> за 5¾ Lod (≈ 359 ‰): 96 шт./кельнська марка = 2,436 г повної / 0,875 г чистого, period-тариф 32 Skilling = 1 Sølvgylden · <b>1 Hvid (Alb.)</b> за 4½ Lod (≈ 281 ‰): 222 шт./кельнська марка = 1,053 г повної / 0,296 г чистого, period-тариф 96 Hvid = 1 Rhinsk Gylden золотий (золотий-тариф-анкер) · 3 Hvid = 1 Skilling"
          da: '<b>1 skilling</b> ved 5¾ lod (≈ 359 ‰): 96 stk. pr. Cölln. Marck = 2,436 g rå / 0,875 g fin, samtidig tarif 32 skilling = 1 sølvgylden · <b>1 hvid (alb.)</b> ved 4½ lod (≈ 281 ‰): 222 stk. pr. Cölln. Marck = 1,053 g rå / 0,296 g fin, samtidig tarif 96 hvid = 1 rhinsk gylden i guld (guldtariffens anker) · 3 hvid = 1 skilling'
      - key:
          de: "Klipping-Debasierung 1518-1522 (Phase A2)"
          en: "Klipping debasement 1518-1522 (Phase A2)"
          uk: "Klipping-девальвація 1518-1522 (фаза A2)"
          da: Klippingforringelsen 1518-1522 (fase A2)
        value:
          de: "1518 Klipping-Ordnung führt radikal abgesenkte Wertmarken ein — Wilcke 7-2 S. 157 charakterisiert die Klippinge als «<i>ydel Kobber</i>» (im Wesen Kupfer). 18-Penning- und 1-Skilling-Klippinge (Galster S. 26-27 + S. 29-31) tragen kleine Bruchteile der Lovkompleks-1514-Norm; Karbung im Vorfeld der Christian-II.-Absetzung 1523."
          en: "The 1518 Klipping ordinance introduces radically devalued token issues — Wilcke 7-2 p. 157 characterises the Klippinge as «<i>ydel Kobber</i>» (essentially copper). The 18-Penning and 1-Skilling Klippinge (Galster S. 26-27 and S. 29-31) carry small fractions of the Lovkompleks-1514 norm; struck in the run-up to Christian II's deposition 1523."
          uk: "Klipping-ордонанс 1518 запроваджує радикально девальвовані token-випуски — Wilcke 7-2 с. 157 характеризує Klippinge як «<i>ydel Kobber</i>» (по суті мідь). 18-Penning та 1-Skilling Klippinge (Galster S. 26-27 та S. 29-31) несуть малі частки норми Lovkompleks-1514; карбування напередодні скинення Christian II 1523 р."
          da: Klippingordningen af 1518 indfører radikalt nedsatte værditegn — Wilcke 7-2 s. 157 karakteriserer klippingene som «<i>ydel Kobber</i>» (i sit væsen kobber). 18-pennings- og 1-skillingklippinge (Galster s. 26-27 og s. 29-31) bærer små brøkdele af lovkompleksets norm fra 1514; prægningen ligger i optakten til afsættelsen af Christian 2. i 1523.
      - key:
          de: "1523 Final-Konsolidierung (Phase A3)"
          en: "1523 final consolidation (Phase A3)"
          uk: "Фінальна консолідація 1523 (фаза A3)"
          da: Den afsluttende konsolidering 1523 (fase A3)
        value:
          de: "Letzte Sølvgylden-Massenkarbung am Vorabend der Absetzung — Wilcke 7-2 S. 156 verbatim «<i>meget almindelig</i>» (sehr verbreitet), Bruun-3933 + Bruun-3934 attestieren Specimen-Brutto 28,74-29,49 g (≈ 4-7 % über dem Soll 27,51 g; typische frühneuzeitliche Specimen-Spannweite)."
          en: "Last Sølvgylden mass coinage on the eve of the deposition — Wilcke 7-2 p. 156 verbatim «<i>meget almindelig</i>» (very common); Bruun-3933 + Bruun-3934 attest specimen brutto 28.74-29.49 g (≈ 4-7 % over the soll 27.51 g; typical early-modern specimen range)."
          uk: "Остання масова Sølvgylden-карбування напередодні скинення — Wilcke 7-2 с. 156 verbatim «<i>meget almindelig</i>» (дуже поширене), Bruun-3933 + Bruun-3934 засвідчують повну вагу зразка 28,74-29,49 г (≈ 4-7 % понад soll 27,51 г; типовий ранньомодерний specimen-діапазон)."
          da: Den sidste masseprægning af sølvgylden på tærsklen til afsættelsen — Wilcke 7-2 s. 156 ordret «<i>meget almindelig</i>»; Bruun-3933 og Bruun-3934 attesterer en bruttovægt på 28,74-29,49 g (≈ 4-7 % over sollet på 27,51 g; en typisk tidligmoderne spredning mellem eksemplarer).
    rechnungsfraktionen_label:
      de: "Rechnungsfraktionen (Sølvgylden-Skilling-Hvid)"
      en: "Accounting fractions (Sølvgylden-Skilling-Hvid)"
      uk: "Розрахункові фракції (Sølvgylden-Skilling-Hvid)"
      da: Regningsfraktioner (sølvgylden · skilling · hvid)
    rechnungsfraktionen:
      de: |
        <b>1 Sølvgylden</b> = 27,51 g rauh / <b>24,07 g fein</b> @ 14 Lod (Wilcke 1950 Kap. 7-2 S. 152-153)<sup>[ref:wilcke-1950-renaissance-moent]</sup><br>
        <b>1 Sølvgylden</b> ≈ <b>32 Skilling</b> = 96 Hvid (period-Tarif, Brev Dines Blicher 1514) · NB: Skilling und Hvid sind nach Sølvgylden-Fein-Wert <em>überrtarifiert</em> (Skilling Fein 0,875 g × 32 = 28 g vs Sølvgylden 24,07 g) — Sub-Tier ist <b>Scheidemünz-Token</b>, nicht vollwertige Sub-Kurant.<br>
        <em>Gold-Anker (Rhinsk Gylden): 96 Hvid = 1 Rhinsk Gylden Gold (2,437 g fein) — der Lovkompleks 1514 etabliert die Hvid-Rhinsk-Gylden-Tarifbindung, NICHT die Sølvgylden-Skilling-Bindung in Fein-Logik.</em>
      en: |-
        <b>1 Sølvgylden</b> = 27.51 g rough / <b>24.07 g fine</b> at 14 Lod (Wilcke 1950 Kap. 7-2 pp. 152-153)<sup>[ref:wilcke-1950-renaissance-moent]</sup><br><b>1 Sølvgylden</b> ≈ <b>32 Skilling</b> = 96 Hvid (period tariff, Brev Dines Blicher 1514) · NB: Skilling and Hvid are <em>over-tariffed</em> against Sølvgylden fine value (Skilling fine 0.875 g × 32 = 28 g vs Sølvgylden 24.07 g) — the sub-tier is <b>Scheidemünze token</b>, not full-value sub-Kurant.<br><em>Gold anchor (Rhinsk Gylden): 96 Hvid = 1 Rhinsk Gulden gold (2.437 g fine) — the Lovkompleks of 1514 establishes the Hvid-Rhinsk-Gulden tariff bond, NOT the Sølvgylden-Skilling bond in fine-weight logic.</em>
      uk: |-
        <b>1 Sølvgylden</b> = 27,51 г повної / <b>24,07 г чистого</b> за 14 Lod (Wilcke 1950 Kap. 7-2 с. 152-153)<sup>[ref:wilcke-1950-renaissance-moent]</sup><br><b>1 Sølvgylden</b> ≈ <b>32 Skilling</b> = 96 Hvid (period-тариф, Brev Dines Blicher 1514) · NB: Skilling і Hvid <em>над-тариф</em>овані відносно фейн-вартості Sølvgylden (Skilling fein 0,875 г × 32 = 28 г vs Sølvgylden 24,07 г) — sub-tier це <b>Scheidemünze-token</b>, а не повноцінний sub-Kurant.<br><em>Золотий анкер (Rhinsk Gylden): 96 Hvid = 1 Rhinsk Gylden золотий (2,437 г чистого) — Lovkompleks 1514 встановлює тарифну прив'язку Hvid-Rhinsk-Gylden, НЕ Sølvgylden-Skilling у фейн-логіці.</em>
      da: '<b>1 sølvgylden</b> = 27,51 g rå / <b>24,07 g fin</b> ved 14 lod (Wilcke 1950 kap. 7-2 s. 152-153)<sup>[ref:wilcke-1950-renaissance-moent]</sup><br>

  <b>1 sølvgylden</b> ≈ <b>32 skilling</b> = 96 hvid (samtidig tarif, Dines Blichers brev 1514) · NB: skilling og hvid er <em>overtariferede</em> i forhold til sølvgyldenens finværdi (skillingens finvægt 0,875 g × 32 = 28 g mod sølvgyldenens 24,07 g) — trinnet under er <b>tegnmønt</b>, ikke fuldværdig underkurant.<br>

  <em>Guldanker (rhinsk gylden): 96 hvid = 1 rhinsk gylden i guld (2,437 g fin) — lovkomplekset af 1514 etablerer tarifbindingen mellem hvid og rhinsk gylden, IKKE bindingen mellem sølvgylden og skilling i finlogik.</em>

  '
  description:
    de: '<b>Erste umfassende Müntzgesetzgebung des dänisch-norwegischen Reichs für beide Metalle und beide Königreiche</b>, etabliert durch das <b>Christian-II-Lovkompleks 1514-1515</b><sup>[ref:denmark-ref29-no-url]</sup> — eine vierteilige Aktion: Møntordning af Sommeren 1514 («<i>Dienis Malmø Brev</i>», nach Mzm. Diens (Hans) Blicher), Norge-Forordning 3. August 1514 (Erweiterung auf Norwegen unter Kalmar-Union), Kvittering Paasketid 1515 (Compliance-Quittung des Rigsråd), Sjælland åbent Brev 24. August 1515 (Sjælland-spezifische Erneuerung). Auf der Silber-Seite definiert das Lovkompleks die <b>Sølvgylden-Skilling-Hvid-Triade</b> — 8½ Sølvgylden aus der Cölln. Marck rauh @ 14 Lod (875 ‰), 27,51 g rauh / 24,07 g fein je Stück; Skilling 96 Stk./M @ 5¾ Lod und Hvid 222 Stk./M @ 4½ Lod als Scheidemünzen<sup>[ref:denmark-ref29-no-url]</sup>. Drei Phasen: <b>A1</b> (1514-1517) Lovkompleks-Karbung mit Sølvgylden 1516+1518 aus Malmø (Mzm. Diens Blicher) — vorausgehende 1513-Akte (22. Juli 1513 Haandfæstning + 1. August 1513 Dynes-Blicher-Beskikkelsesbrev) sind PRECURSOR, NICHT Teil des Lovkompleks; <b>A2</b> (1518-1522) Klipping-Debasierung («<i>ydel Kobber</i>», Wilcke 7-2 S. 157) — 18-Penning- und 1-Skilling-Klippinge als Notmünze im Vorfeld der Absetzung; <b>A3</b> (1523) Final-Konsolidierung mit Massen-Sølvgylden-Karbung Malmø am Vorabend der Flucht 13. April 1523 (Wilcke 7-2 S. 156 verbatim «<i>meget almindelig</i>»). Standard endet 1524 mit Frederik Is Møntordning 25. Februar 1524 (separate Fuß [fuss:8_gylden_fod]), die die Sølvgylden-Stückzahl auf 8/M strafft.'
    en: '<b>The first comprehensive coinage legislation of the Danish-Norwegian realm covering both metals and both kingdoms</b>, established through the <b>Christian II Lovkompleks of 1514-1515</b><sup>[ref:denmark-ref29-no-url]</sup> — a four-part act: Møntordning af Sommeren 1514 («<i>Dienis Malmø Brev</i>», after mintmaster Diens (Hans) Blicher), Norge ordinance of 3 August 1514 (extension to Norway under the Kalmar Union), Kvittering Paasketid 1515 (compliance receipt from the Rigsråd), Sjælland åbent Brev of 24 August 1515 (Sjælland-specific renewal). On the silver side the Lovkompleks defines the <b>Sølvgylden-Skilling-Hvid triad</b> — 8½ Sølvgylden per Cologne mark rough at 14 Lod (875 ‰), 27.51 g rough / 24.07 g fine per piece; Skilling 96/M at 5¾ Lod and Hvid 222/M at 4½ Lod as Scheidemünzen<sup>[ref:denmark-ref29-no-url]</sup>. Three phases: <b>A1</b> (1514-1517) Lovkompleks coinage with Sølvgylden 1516+1518 from Malmø (mintmaster Diens Blicher) — preceding 1513 acts (22 July 1513 Haandfæstning + 1 August 1513 Dynes Blicher beskikkelsesbrev) are PRECURSOR, NOT part of the Lovkompleks; <b>A2</b> (1518-1522) Klipping debasement («<i>ydel Kobber</i>», Wilcke 7-2 p. 157) — 18-Penning and 1-Skilling Klippinge as emergency coinage in the run-up to the deposition; <b>A3</b> (1523) final consolidation with mass Sølvgylden coinage at Malmø on the eve of the flight of 13 April 1523 (Wilcke 7-2 p. 156 verbatim «<i>meget almindelig</i>»). The standard ends in 1524 with Frederik I''s Møntordning of 25 February 1524 (separate Fuß [fuss:8_gylden_fod]), which tightens the Sølvgylden count to 8/M.'
    uk: '<b>Перше комплексне монетне законодавство дансько-норвезького реалму, що охоплює обидва метали та обидва королівства</b>, запроваджене через <b>Lovkompleks Кристіана II 1514-1515</b><sup>[ref:denmark-ref29-no-url]</sup> — чотирискладовий акт: Møntordning af Sommeren 1514 («<i>Dienis Malmø Brev</i>», за монетмайстра Diens (Hans) Blicher), норвезький ордонанс 3 серпня 1514 (поширення на Норвегію в Кальмарській унії), Kvittering Paasketid 1515 (compliance-квитанція Rigsråd), Sjælland åbent Brev 24 серпня 1515 (Sjælland-специфічне відновлення). На срібній стороні Lovkompleks визначає <b>тріаду Sølvgylden-Skilling-Hvid</b> — 8½ Sølvgylden з повної кельнської марки за 14 Lod (875 ‰), 27,51 г повної / 24,07 г чистого на штуку; Skilling 96/M за 5¾ Lod і Hvid 222/M за 4½ Lod як Scheidemünzen<sup>[ref:denmark-ref29-no-url]</sup>. Три фази: <b>A1</b> (1514-1517) Lovkompleks-карбування з Sølvgylden 1516+1518 з Мальме (монетмайстер Diens Blicher) — попередні акти 1513 (22 липня 1513 Haandfæstning + 1 серпня 1513 Dynes Blicher Beskikkelsesbrev) — ПРЕКУРСОРНІ, НЕ частина Lovkompleks; <b>A2</b> (1518-1522) Klipping-девальвація («<i>ydel Kobber</i>», Wilcke 7-2 с. 157) — 18-Penning та 1-Skilling Klippinge як надзвичайна монета напередодні скинення; <b>A3</b> (1523) фінальна консолідація з масовою Sølvgylden-карбуванням у Мальме напередодні втечі 13 квітня 1523 (Wilcke 7-2 с. 156 verbatim «<i>meget almindelig</i>»). Стандарт завершується 1524 р. з Møntordning Frederik I 25 лютого 1524 (окрема стопа [fuss:8_gylden_fod]), яка стискає кількість Sølvgylden до 8/M.'
    da: '<b>Det dansk-norske riges første samlede møntlovgivning for begge metaller og begge kongeriger</b>, etableret ved <b>Christian 2.s lovkompleks 1514-1515</b><sup>[ref:denmark-ref29-no-url]</sup> — en firdelt akt: Møntordning af sommeren 1514 («<i>Dienis Malmø Brev</i>», efter møntmester Diens (Hans) Blicher), Norge-forordningen af 3. august 1514 (udvidelse til Norge under Kalmarunionen), kvitteringen fra påsketid 1515 (rigsrådets bekræftelse) og Sjælland åbent Brev af 24. august 1515 (en sjællandsk fornyelse). På sølvsiden definerer lovkomplekset <b>treklangen sølvgylden, skilling og hvid</b> — 8½ sølvgylden af den rå Cölln. Marck ved 14 lod (875 ‰), 27,51 g rå / 24,07 g fin pr. stykke; skilling 96 stk. pr. mark ved 5¾ lod og hvid 222 stk. pr. mark ved 4½ lod som skillemønt<sup>[ref:denmark-ref29-no-url]</sup>. Tre faser: <b>A1</b> (1514-1517) lovkompleksets prægning med sølvgylden 1516 og 1518 fra Malmø (møntmester Diens Blicher) — de forudgående akter fra 1513 (håndfæstningen af 22. juli og Dynes Blichers beskikkelsesbrev af 1. august) er FORLØBERE og IKKE en del af lovkomplekset; <b>A2</b> (1518-1522) klippingforringelsen («<i>ydel Kobber</i>», Wilcke 7-2 s. 157) — 18-pennings- og 1-skillingklippinge som nødmønt i optakten til afsættelsen; <b>A3</b> (1523) den afsluttende konsolidering med masseprægning af sølvgylden i Malmø på tærsklen til flugten 13. april 1523 (Wilcke 7-2 s. 156, ordret «<i>meget almindelig</i>»). Standarden ophører i 1524 med Frederik 1.s Møntordning af 25. februar 1524 (en selvstændig fod, [fuss:8_gylden_fod]), som strammer sølvgyldenens styktal til 8 pr. mark.'
  fractions:
    "1": {soll_rau_g: 27.51, soll_fein_g: 24.07}        # 1 Sølvgylden @ 14 Lod
    "1/2": {soll_rau_g: 13.76, soll_fein_g: 12.04}      # ½ Sølvgylden
    "1/4": {soll_rau_g: 6.88, soll_fein_g: 6.02}        # ¼ Sølvgylden
    "1/32": {soll_rau_g: 2.436, soll_fein_g: 0.875}     # 1 Skilling (period-tariff 32 Skilling = 1 Sølvgylden; fein-weight is 27.5× under Sølvgylden — Scheidemünze)
    "1/96": {soll_rau_g: 1.053, soll_fein_g: 0.296}     # 1 Hvid (period-tariff 96 Hvid = 1 Rhinsk Gylden Gold; Scheidemünze)
  events:
    first_adoption:
      anywhere: 1514
      note: "Møntordning af Sommeren 1514 («Dienis Malmø Brev», after mintmaster Diens (Hans) Blicher) — first systematic Sølvgylden-Skilling-Hvid silver standard for the Danish-Norwegian realm. Wilcke 1950 Kap. 7-2 pp. 152-153."
    first_mint:
      anywhere: 1514
      note: "Lovkompleks-Karbung beginnt 1514 mit der Møntordning af Sommeren 1514 («Dienis Malmø Brev»). PRECURSOR-Akte 1513 (22. Juli 1513 Haandfæstning mit monetären Klauseln + 1. August 1513 Dynes Blicher Beskikkelsesbrev als Mzm. in Malmø, Wilcke 7-2 S. 4 + S. 150) sind NICHT Teil des Lovkompleks selbst — sie sind die vorbereitenden Akte Christians II. unmittelbar nach Hans' Tod 20. Februar 1513 und vor der Krönung 11. Juni 1514. Die formale 4-teilige Lovkompleks-Aktion startet erst Sommer 1514. Frühestes belegte Sølvgylden: Galster c2g-38 1516 Malmø (Bruun-3917+3929+3931 attest Skilling 1514-1518 Belegexemplare)."
    last_mint:
      anywhere: 1523
      note: "Last documented Sølvgylden mass coinage 1523 Malmø (Bruun-3933+3934, Wilcke 7-2 p. 156 «meget almindelig»). Christian II is deposed 13 April 1523; Frederik I's Møntordning 25 February 1524 supersedes the standard."
    std_end:
      anywhere: 1524
      approx_anywhere: true
      note: "Standard superseded by Frederik I's Møntordning of 25 February 1524 (Wilcke 7-2 pp. 184-187, separate Fuß christian-II → 8_gylden_fod transition)."
    demonetisation:
      anywhere: 1541
      approx_anywhere: true
      note: "Approximate practical-circulation tail terminus — by Christian III's 20 September 1541 Møntordning, the Lovkompleks-1514 norm is no longer struck and surviving specimens are remelt fodder for the new 14½-Lod Daler standard. Christian-II-era Sølvgylden gradually demonetised through the 1530s-1540s."
    anywhere_label:
      de: Königreich Dänemark und Norwegen (Christian II Lovkompleks)
      en: Royal Danish-Norwegian Realm (Christian II Lovkompleks)
      uk: Королівство Данії і Норвегії (Lovkompleks Christian II)

      da: Kongeriget Danmark og Norge (Christian 2.s lovkompleks)
