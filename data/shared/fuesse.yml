      approx_anywhere: true
      firm_anywhere: false
      note: 'KORREKTUR 2026-08-16: der Anker 1513 fällt. Er beruhte auf Galster c2g-89/90, das dieser Sitzung zufolge in die Grevens Fejde 1534-1536 gehört und nicht in Christian II. Regierungszeit; die früheste dänische Müntze dieses Fußes ist Frederiks I. Ungersk Gylden von 1531. Der anywhere-Anker steht nun auf 1497 — dem frühesten belegten Dukaten im Geltungsbereich dieses Ankers (Hamburg, Heiliges Römisches Reich). approx_anywhere=true, weil das Korn des Hamburger Stückes nicht veröffentlicht ist; firm_anywhere=false, weil dem Jahr keine bindende Ordonnanz zugrunde liegt. De-jure-Codification erst durch die Augspurgische Reichsmünzordnung vom 19. Aug 1559 als Reichsgoldmüntze; HRR-wide adoption applied to all Holstein duchies, daher die Holstein-Seite 1559 als feste RMO. Herleitung: docs/research/de_reichsdukatenfuss.md §2 + docs/research/ducat_origins.md §1. Die ältere KORREKTUR 2026-07-10 bleibt gültig: der noch frühere Anker 1481 samt Numista-N#355730 war eine Fehlzuordnung — N#355730 (Hans-«Goldgulden» ~1497, Galster 27) ist eine .75-Rhinsk-Gylden-Prägung und gehört zum rhinsk_gylden_fod, nicht zu diesem Standard.'
    first_mint:
      anywhere: 1497
      holstein: 1640
      approx_anywhere: true
      note: 'anywhere = the Hamburg ducat of 1497, the earliest attested strike inside this anchor''s own scope (Holy Roman Empire + the Danish-Norwegian realm); its fineness is not published, hence approx. CORRECTION 2026-08-16: the previous anchor 1513 rested on Galster c2g-89/90, re-dated this session to the Grevens Fejde of 1534-1536; the earliest Danish piece on this standard is Frederik I''s Ungersk Gylden of 1531 (Galster 46), and the Danish line continues through Christian III 1557, Frederik II 1563 and Christian IV 1591-1611, then through the formal codification of 1559+. Derivation: docs/research/de_reichsdukatenfuss.md §2 + docs/research/ducat_origins.md §1. The still earlier anchor 1481 (Numista N#355730) was a misattribution corrected 2026-07-10 — that piece is the Hans .75 Rhinsk Gylden (rhinsk_gylden_fod). H first-mint 1640 = km-29-chr-iv-1640 (1640-1646 Glückstadt under Christian IV.) — earliest documented Holstein-mint Reichsdukat in our base.'
    last_mint:
      anywhere: 1871
      holstein: 1802
      note: anywhere = last German Reichsdukaten before Reichsmünzgesetz. H last-mint 1802 = KM#650 Christian VII Altona-Dukat 1791-1802. The Glückstadt mint operated until 1812 but no later Reichsdukatenfuß-Dukat is documented from a Holstein mint.
    std_end:
      anywhere: 1871
      holstein: 1871
      note: Reichsmünzgesetz 4. Dec 1871 superseded the Dukatenfuß Reich-wide; Holstein, as part of the Empire, exits the standard at the same date — no separate Holstein-specific reform.
    demonetisation:
      anywhere: 1876
      holstein: 1876
      note: 'Reichsmünzgesetz 4. Dec 1871 (gold) and 9. Jul 1873 (extended to silver) phased in the new Goldmark; 1 Jan 1876 — Mark + Vereinsthaler became the SOLE legal tenders, so all older coinage including Reichsdukaten lost legal-tender status from that date. Std end (1871) marks the formal-standard cutoff; demon (1876) marks actual loss of currency status. Austrian restrike-Dukaten dated 1915 are commemorative bullion, out-of-system.'

    anywhere_label:
      de: Heiliges Römisches Reich + Königreich Dänemark und Norwegen
      en: Holy Roman Empire + Royal Danish-Norwegian Realm
      uk: Священна Римська імперія + Королівство Данії і Норвегії
      da: Det Tysk-romerske Rige samt Kongeriget Danmark og Norge
