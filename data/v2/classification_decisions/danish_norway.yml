  - coin_id: unified-dk-hede-nc5h7
    fuss: reichsdukatenfuss
    phase: III
    kind: kurant
    reason: "Curator (Serhii) 2026-07-27: 1 Dukat u.år Christian V, Christiania — Hede Norge 7 / Schou 34 / AAJT 20. Trade Dukat at .979 = Reichsdukatenfuß, Phase III (Christiania trade-dukat window 1660-1697).
      Two members (dk-hede-nc5h7 + dk-numista-416423), joined by the curator-approved merge of the same date. No Krause number is published for this type by either source. The Hede page carries TWO types
      — «1 og 2 Dukat u.år, Christiania … (Hede Norge 7, Schou 34 (1 dukat; RR) hhv. Hede Norge 8, Schou 15 (2 dukat; R))» — and the parser's per-Hede split yields this 1-Dukat entry (Bruttovægt 3,490 g
      / Finhed 0,979 / Finvægt 3,418 g) alongside dk-hede-nc5h8, the 2 Dukat. Attribution note: the DANISH volume's Hede 7 (danskmoent.dk/chr/c5h7.htm) is also a 1 Dukat u.år of Christian V with metrics
      identical to the digit — 3,490 g / 0,979 / 3,418 g — so weight and fineness cannot discriminate; the two types are separated only by mint (Christiania vs København) and Schou (34 vs 23), and Numista
      publishes no Schou. The Norwegian reading rests on mint Christiania (mint_verified true), the Numista entry's own scope (N#416423 «1 Ducat - Christian V (Christiania type IV) - Norway»), AAJT 20 as
      a Norwegian catalogue, and the curator's visual confirmation that the Danish c5h7 coin is a different piece. year_verified stays false — Hede records u.år; the displayed 1674 is Numista's dated attribution
      and the Hede reign window 1670-1699 is year-demoted in its favour."
  - coin_id: unified-dk-numista-444264
    fuss: rhinsk_gylden_fod
    phase: '0'
    kind: kurant
    reason: "Hans «Norway's first gold coin» — 1 Goldgulden, Bergen (dk-galster-hg-gej + Numista N#444264, merged; AAJT# 1A, Thesen# 1, Galster «Gej»). Gold .739 ≈ the .77 Rhenish/Rhinsk-Gyldenfod standard;
      Goldgulden type, Hans pre-1514 → rhinsk_gylden_fod Phase I (same as the Hans Danish Goldgulden bruun-3839). year_verified false (Bergen dating unsettled — galster reign-span 1481-1513 vs Numista 1505-1510).
      Numista side harvested via WebFetch 2026-07-13. Curator (Serhii) 2026-07-13. — Phase 0 — the coinage predates any Danish gold ordinance. The Møntordning of Summer 1514 is the first Danish act to specify
      the Rhinsk Gylden (18 Karat, 72 to the mark), so measuring a ~1497 or 1505-1510 piece against it is anachronistic. Phase 0 carries NO soll_fein_by_phase: it falls back to the fuss scalar of 18½ Karat
      — the Rhenish norm of the Wormser Reichsabschied 1495 that these pieces imitate, and the figure Hans himself put in his Møntanordning of 4 Dec 1497 («guldmynt på Rhenska gulden slag», 72 to the 18½
      Karat mark). The shortfall therefore stays visible: the Nürnberg Valvationstag of 1551 found the surviving 2-Bjælker type «kun ca. 3/4 Karat» under the norm, i.e. 17¾, and Wilcke attributes the reduction
      to military pay — «søgt noget forringet i Gehalt». Curator (Serhii) 2026-09-06."
