      entries, and the danskmoent Christian V overview row «N4 | 2 Dukat | Guld | U.år | Christiania | Som N3». Bruun records «only two examples recorded, and the other being in the Danish National Museum»,
      but no KMM record in the cache carries Schou 14 — the three untyped Christian V «dobbelt dukat» stubs (kmk-78366 / 78367 / 277061) hold no typeNumber, year, weight or mint, so attributing any of them
      to this type would be unsourced speculation per §0b. Left unattributed."
