      = 1½ Thaler), which they could not do if both were 3,5 g at .986. The 3,5 g / .986 on the NGC and NumisMaster records is the Krause volume's blanket gold default, kept in the data and marked erroneous.
      Phase is dict-form: denmark places the ducal series as III, before Christian IV's royal war-coinage phase (now IV), schleswig_holstein declares the fuss fresh as I. Evidence: docs/SOURCES.md §13.15.
      — Schleswig-Holstein phase renumbered I → II. That page's single rhinsk_gylden_fod phase bundled the king's ducal-zone coinage of 1523-1547 with the dukes' own of 1619-1664 under a ducal title, and
      the renderer expanded the header to «1523 → 1664» across a 72-year gap. The page now declares I = 1523-1547 (royal, under the Danish Møntordninger of 1514/1524, 18 Karat) and II = 1619-1664 (ducal,
      no ordinance, no fineness). Denmark's ducal phase was renumbered IV → III on 2026-09-06: its window is clipped to the last Danish-page coin (1627), so the ducal line — starting 1619 — precedes Christian
      IV's royal phase, which becomes IV, keeping the numeric indices ordinal by start year. Curator (Serhii) 2026-09-06."
    fraction: '1'
