    reason: "Curator (Serhii) 2026-07-27: 2 Dukat 1584, Frederiksborg, Frederik II —\nHede 7C / Schou 3 / Sieg 29, Bruttovaegt 6,91 g. A full-weight trade\nDukat (canonical 2 x 3,49 = 6,98 g), so Reichsdukatenfuss,
      Phase I\n(1514-1629); it joins its sibling from the same set, the 1584 Ungersk\nGylden f2h7e, already in Phase I. Fineness is not published by the source\nand stays unrecorded rather than assumed.\n\
      \nStandalone, no merge: a corpus-wide scan found no second record carrying\nHede 7C. The Sieg 29 it shares with f2h7a / 7b / 7e / 7f / 7g is the\nindex of Queen Sophie's gift set as a whole, not of
      this type — the seven\npieces differ by nominal and Hede sub-letter (Portugaloeser 7a, Rosenobel\n7b, 2 Dukat 7c, Ungersk Gylden 7e, Guldkrone 7f, Rhinsk Gylden 7g), so\nSieg 29 cannot serve as a
      merge key here. danskmoent f2h7c also records\nthe piece as \"(Unik)\".\n\nSources on the page for later citation work: Galster, Nationalmuseets\nArbejdsmark 1959 s. 117; J. S. Jensen, Moentsamlernyt
      1/1975; Wilcke,\n\"Frederik II.s Guldmoent 1584\", Daler, Mark og Kroner 1481-1914,\nKoebenhavn 1931, s. 85-90.\n"
