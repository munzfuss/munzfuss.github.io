    curator: 'Serhii 2026-11-05 (period 0 tooltips: «все інше теж згоден»)'
    note:
      de: "Das Jahr nach [b]Lindahl 1955 (NNÅ 1955, S. 74)[/b]: [i]«ca. 1350 til reces 1379/81»[/i] (dt.: «ca. 1350 bis zum Rezeß 1379/81»); damit weicht Lindahl von Hauberg ab ([b]Lindahl 1955 (NNÅ 1955, S. 73)[/b]: [i]«dateringen af den første Flensborg-witten og -viertelwitten til ca. 1350»[/i] (dt.: «die Datierung des ersten Flensborger Witten und Viertelwitten auf ca. 1350»)).\n\n[b]Nöbbe 1930 (Numismatisk Forenings Medlemsblad XII, S. 2)[/b]: [i]«Før 1379 er den flensborgske Witten (Fig. 1) og den tilsvarende Penning (Fig. 2) udmøntet»[/i] (dt.: «Vor 1379 sind der Flensborger Witten (Abb. 1) und der entsprechende Pfennig (Abb. 2) ausgemüntzt»).\n\n[b]Hauberg 1886 (Aarbøger for nordisk Oldkyndighed 1886, S. 154)[/b] setzte die Prägung später an: [i]«Formentlig i Tiden 1388-1395 blev der i Flensborg udmyntet Firepenninge og Topenninge af samme Typ»[/i] (dt.: «Vermutlich in der Zeit 1388–1395 wurden in Flensborg Vierpfennige und Zweipfennige desselben Typs ausgemüntzt»).\n\n[b]Numista (179715)[/b]: [i]«1359-1378»[/i]."
      en: "The year after [b]Lindahl 1955 (NNÅ 1955, p. 74)[/b]: [i]«ca. 1350 til reces 1379/81»[/i] (transl.: «c. 1350 to the recess of 1379/81»); here Lindahl departs from Hauberg ([b]Lindahl 1955 (NNÅ 1955, p. 73)[/b]: [i]«dateringen af den første Flensborg-witten og -viertelwitten til ca. 1350»[/i] (transl.: «the dating of the first Flensborg Witten and Viertelwitten to c. 1350»)).\n\n[b]Nöbbe 1930 (Numismatisk Forenings Medlemsblad XII, p. 2)[/b]: [i]«Før 1379 er den flensborgske Witten (Fig. 1) og den tilsvarende Penning (Fig. 2) udmøntet»[/i] (transl.: «Before 1379 the Flensborg Witten (Fig. 1) and the corresponding penny (Fig. 2) were struck»).\n\n[b]Hauberg 1886 (Aarbøger for nordisk Oldkyndighed 1886, p. 154)[/b] placed the coinage later: [i]«Formentlig i Tiden 1388-1395 blev der i Flensborg udmyntet Firepenninge og Topenninge af samme Typ»[/i] (transl.: «Presumably in the period 1388–1395 four-pennies and two-pennies of the same type were struck in Flensborg»).\n\n[b]Numista (179715)[/b]: [i]«1359-1378»[/i]."
      uk: "Рік за [b]Lindahl 1955 (NNÅ 1955, с. 74)[/b]: [i]«ca. 1350 til reces 1379/81»[/i] (перекл.: «бл. 1350 р. — до рецесу 1379/81 р.»); цим Lindahl відходить від Hauberg ([b]Lindahl 1955 (NNÅ 1955, с. 73)[/b]: [i]«dateringen af den første Flensborg-witten og -viertelwitten til ca. 1350»[/i] (перекл.: «датування першого фленсборзького віттена і віртельвіттена бл. 1350 р.»)).\n\n[b]Nöbbe 1930 (Numismatisk Forenings Medlemsblad XII, с. 2)[/b]: [i]«Før 1379 er den flensborgske Witten (Fig. 1) og den tilsvarende Penning (Fig. 2) udmøntet»[/i] (перекл.: «До 1379 р. вибито фленсборзький віттен (рис. 1) і відповідний пфеніг (рис. 2)»).\n\n[b]Hauberg 1886 (Aarbøger for nordisk Oldkyndighed 1886, с. 154)[/b] відносив карбування до пізнішого часу: [i]«Formentlig i Tiden 1388-1395 blev der i Flensborg udmyntet Firepenninge og Topenninge af samme Typ»[/i] (перекл.: «Імовірно, в 1388–1395 рр. у Flensborg карбували чотирипфеніговики й двопфеніговики того самого типу»).\n\n[b]Numista (179715)[/b]: [i]«1359-1378»[/i]."
      da: "Året efter [b]Lindahl 1955 (NNÅ 1955, s. 74)[/b]: [i]«ca. 1350 til reces 1379/81»[/i]; dermed afviger Lindahl fra Hauberg ([b]Lindahl 1955 (NNÅ 1955, s. 73)[/b]: [i]«dateringen af den første Flensborg-witten og -viertelwitten til ca. 1350»[/i]).\n\n[b]Nöbbe 1930 (Numismatisk Forenings Medlemsblad XII, s. 2)[/b]: [i]«Før 1379 er den flensborgske Witten (Fig. 1) og den tilsvarende Penning (Fig. 2) udmøntet»[/i].\n\n[b]Hauberg 1886 (Aarbøger for nordisk Oldkyndighed 1886, s. 154)[/b] lagde prægningen senere: [i]«Formentlig i Tiden 1388-1395 blev der i Flensborg udmyntet Firepenninge og Topenninge af samme Typ»[/i].\n\n[b]Numista (179715)[/b]: [i]«1359-1378»[/i]."
