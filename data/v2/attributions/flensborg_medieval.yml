    note:
      de: "Das Jahr nach [b]Lindahl 1955 (NNÅ 1955, S. 75)[/b]: [i]«efter reces 1379/81»[/i] (dt.: «nach dem Rezeß 1379/81»).\n\n[b]Nöbbe 1930 (Numismatisk Forenings Medlemsblad XII, S. 3)[/b]: [i]«I Tiden mellem 1379 og 1387 er der i Flensborg præget en Witten, som svarer til Hansestædernes saakaldte Stjernemønt»[/i] (dt.: «In der Zeit zwischen 1379 und 1387 ist in Flensborg ein Witten geprägt worden, der der sogenannten Sternmüntze der Hansestädte entspricht»); nicht ausgeschlossen sei nach ihm auch erst 1386: [i]«Det er ikke udelukket, at denne Witten med det schauenborgske Mærke først er udmøntet 1386»[/i] (dt.: «Es ist nicht ausgeschlossen, daß dieser Witten mit dem schauenburgischen Zeichen erst 1386 ausgemüntzt wurde»).\n\n[b]Hauberg 1886 (Aarbøger for nordisk Oldkyndighed 1886, S. 153)[/b]: [i]«den er sikkert udmyntet i en nær Tid derefter»[/i] (dt.: «er ist sicher bald danach ausgemüntzt») — nach dem gemeinsamen Typ von Lübeck, Hamburg und Wismar von 1379."
      en: "The year after [b]Lindahl 1955 (NNÅ 1955, p. 75)[/b]: [i]«efter reces 1379/81»[/i] (transl.: «after the recess of 1379/81»).\n\n[b]Nöbbe 1930 (Numismatisk Forenings Medlemsblad XII, p. 3)[/b]: [i]«I Tiden mellem 1379 og 1387 er der i Flensborg præget en Witten, som svarer til Hansestædernes saakaldte Stjernemønt»[/i] (transl.: «Between 1379 and 1387 a Witten was struck in Flensborg corresponding to the so-called star coin of the Hanseatic towns»); in his view, 1386 is not excluded either: [i]«Det er ikke udelukket, at denne Witten med det schauenborgske Mærke først er udmøntet 1386»[/i] (transl.: «It is not excluded that this Witten with the Schauenburg mark was struck only in 1386»).\n\n[b]Hauberg 1886 (Aarbøger for nordisk Oldkyndighed 1886, p. 153)[/b]: [i]«den er sikkert udmyntet i en nær Tid derefter»[/i] (transl.: «it was surely struck shortly after that») — after the common type of Lübeck, Hamburg and Wismar of 1379."
      uk: "Рік за [b]Lindahl 1955 (NNÅ 1955, с. 75)[/b]: [i]«efter reces 1379/81»[/i] (перекл.: «після рецесу 1379/81 р.»).\n\n[b]Nöbbe 1930 (Numismatisk Forenings Medlemsblad XII, с. 3)[/b]: [i]«I Tiden mellem 1379 og 1387 er der i Flensborg præget en Witten, som svarer til Hansestædernes saakaldte Stjernemønt»[/i] (перекл.: «Між 1379 і 1387 рр. у Flensborg вибито віттен, що відповідає так званій «зірковій монеті» ганзейських міст»); не виключено, за ним, і 1386 р.: [i]«Det er ikke udelukket, at denne Witten med det schauenborgske Mærke først er udmøntet 1386»[/i] (перекл.: «Не виключено, що цей віттен зі знаком Schauenburg карбовано лише 1386 р.»).\n\n[b]Hauberg 1886 (Aarbøger for nordisk Oldkyndighed 1886, с. 153)[/b]: [i]«den er sikkert udmyntet i en nær Tid derefter»[/i] (перекл.: «його, певно, карбовано незабаром після того») — після спільного типу Lübeck, Hamburg і Wismar 1379 р.."
      da: "Året efter [b]Lindahl 1955 (NNÅ 1955, s. 75)[/b]: [i]«efter reces 1379/81»[/i].\n\n[b]Nöbbe 1930 (Numismatisk Forenings Medlemsblad XII, s. 3)[/b]: [i]«I Tiden mellem 1379 og 1387 er der i Flensborg præget en Witten, som svarer til Hansestædernes saakaldte Stjernemønt»[/i]; ifølge ham er heller ikke 1386 udelukket: [i]«Det er ikke udelukket, at denne Witten med det schauenborgske Mærke først er udmøntet 1386»[/i].\n\n[b]Hauberg 1886 (Aarbøger for nordisk Oldkyndighed 1886, s. 153)[/b]: [i]«den er sikkert udmyntet i en nær Tid derefter»[/i] — efter Lübecks, Hamburgs og Wismars fælles type fra 1379."
