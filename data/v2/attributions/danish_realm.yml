# Attributions — the value a class shows for a field when it rests on
# scholarly works, not on the specimen sources that are its members (D52,
# curator 2026-10-29). `type` names the type by its catalogue number(s), as the
# works do; the merger finds the class by the scoped catalogue keys
# (merge_seeds_cross_source._attribution_matches) and reports a type found in
# no class or in several. basis: given (a work states the value) | compiled (the
# curator's compilation of the works' datings). works[].how: the work's own
# reservation (circa, possibly, …) or plain.
entity: danish_realm
attributions:
  - type:
      galster: '1'
      galster_volume: galster1972-margrethe1
    field: year
    basis: compiled
    value:
      - 1373
      - 1381
    curator: Serhii 2026-10-26 («приймемо 1373–1381 (?)»); moved from merge_decisions year_window 2026-10-29
    note:
      de: 'Die Datierung ist aus den Datierungen der Quellen zusammengestellt. danskmoent.dk (Galster 1): «slået i Ribe ca. 1380» («um 1380 in Ribe geschlagen»). Ernst 1948 (NNÅ 1948, S. 9–15) setzt den Beginn vor die Sternwitten der wendischen Städte von 1379: «Udmøntningen skulde da mest sandsynligt kunne dateres til Aarene 1373 eller kort derefter til 1377» («die Ausmüntzung ließe sich dann am wahrscheinlichsten auf das Jahr 1373 oder kurz danach bis 1377 datieren»). Lindahl 1955 (NNÅ 1955, S. 76) gibt «1373/77—96»; die Grenze 1396 folgt Galster 1947 («Ribe Mønt», S. 605–606, nach Ernst 1948): «Udmøntningen maa rimeligvis være standset før 1396» («die Ausmüntzung ist vermutlich vor 1396 eingestellt worden»). Märcher 2018 (in: Horsnæs, Moesgaard, Märcher, Denar til daler, Kap. 6, S. 372): «En datering af udmøntningen til ca. 1376-1381 synes på nuværende tidspunkt at være det mest oplagte» («eine Datierung der Ausmüntzung auf ca. 1376–1381 scheint derzeit am naheliegendsten»); eine Fortsetzung in die 1380er–1390er Jahre hält er für «mindre sandsynlig» («weniger wahrscheinlich»). Daraus läßt sich der Zeitraum 1373–1381 ableiten: der Beginn nach Ernst, das Ende nach Märcher.'
      en: 'The dating is compiled from the datings of the sources. danskmoent.dk (Galster 1): «slået i Ribe ca. 1380» («struck in Ribe c. 1380»). Ernst 1948 (NNÅ 1948, pp. 9–15) places the start before the Sternwitten of the Wendish towns of 1379: «Udmøntningen skulde da mest sandsynligt kunne dateres til Aarene 1373 eller kort derefter til 1377» («the coinage could then most probably be dated to the year 1373 or shortly after, to 1377»). Lindahl 1955 (NNÅ 1955, p. 76) gives «1373/77—96»; the limit 1396 follows Galster 1947 («Ribe Mønt», pp. 605–606, after Ernst 1948): «Udmøntningen maa rimeligvis være standset før 1396» («the coinage must probably have stopped before 1396»). Märcher 2018 (in: Horsnæs, Moesgaard, Märcher, Denar til daler, ch. 6, p. 372): «En datering af udmøntningen til ca. 1376-1381 synes på nuværende tidspunkt at være det mest oplagte» («a dating of the coinage to c. 1376–1381 currently seems the most obvious»); he regards a continuation into the 1380s–1390s as «mindre sandsynlig» («less likely»). From these the period 1373–1381 can be derived: the start after Ernst, the end after Märcher.'
      uk: 'Датування зведене з датувань джерел. danskmoent.dk (Galster 1): «slået i Ribe ca. 1380» («карбований у Ribe близько 1380»). Ernst 1948 (NNÅ 1948, с. 9–15) ставить початок перед «Sternwitten» вендських міст 1379 р.: «Udmøntningen skulde da mest sandsynligt kunne dateres til Aarene 1373 eller kort derefter til 1377» («карбування тоді найімовірніше можна датувати 1373 роком або невдовзі після нього, до 1377»). Lindahl 1955 (NNÅ 1955, с. 76) подає «1373/77—96»; межа 1396 походить від Galster 1947 («Ribe Mønt», с. 605–606, за Ernst 1948): «Udmøntningen maa rimeligvis være standset før 1396» («карбування, ймовірно, припинилося до 1396»). Märcher 2018 (у: Horsnæs, Moesgaard, Märcher, Denar til daler, розд. 6, с. 372): «En datering af udmøntningen til ca. 1376-1381 synes på nuværende tidspunkt at være det mest oplagte» («датування карбування приблизно 1376–1381 роками наразі видається найочевиднішим»); продовження карбування в 1380–1390-х роках він вважає «mindre sandsynlig» («менш імовірним»). Звідси можна вивести період 1373–1381: початок за Ernst, кінець за Märcher.'
      da: 'Dateringen er sammenstillet af kildernes dateringer. danskmoent.dk (Galster 1): «slået i Ribe ca. 1380». Ernst 1948 (NNÅ 1948, s. 9–15) lægger begyndelsen før de vendiske stæders «Sternwitten» fra 1379: «Udmøntningen skulde da mest sandsynligt kunne dateres til Aarene 1373 eller kort derefter til 1377». Lindahl 1955 (NNÅ 1955, s. 76) angiver «1373/77—96»; grænsen 1396 følger Galster 1947 («Ribe Mønt», s. 605–606, efter Ernst 1948): «Udmøntningen maa rimeligvis være standset før 1396». Märcher 2018 (i: Horsnæs, Moesgaard, Märcher, Denar til daler, kap. 6, s. 372): «En datering af udmøntningen til ca. 1376-1381 synes på nuværende tidspunkt at være det mest oplagte»; en fortsættelse ind i 1380’erne–1390’erne anser han for «mindre sandsynlig». Heraf kan perioden 1373–1381 udledes: begyndelsen efter Ernst, slutningen efter Märcher.'
    works:
      - work: Ernst, Bidrag til Ribe Mønts Historie (Nordisk Numismatisk Årsskrift 1948), cit. danskmoent.dk
        url: https://www.danskmoent.dk/ernst/ribeaxe1.htm
        how: possibly
        quote: Udmøntningen skulde da mest sandsynligt kunne dateres til Aarene 1373 eller kort derefter til 1377
        translation:
          de: die Ausmüntzung ließe sich dann am wahrscheinlichsten auf das Jahr 1373 oder kurz danach bis 1377 datieren
          en: the coinage could then most probably be dated to the year 1373 or shortly after, to 1377
          uk: карбування тоді найімовірніше можна датувати 1373 роком або невдовзі після нього, до 1377
      - work: 'Märcher, in: Horsnæs, Moesgaard, Märcher (red.), Denar til daler (2018)'
        page: 372
        url: https://www.nationalbanken.dk/media/5nznzynp/denar-til-daler-danmarks-moenthistorie-indtil-1550-danmarks-nationalbank.pdf
        how: circa
        quote: En datering af udmøntningen til ca. 1376-1381 synes på nuværende tidspunkt at være det mest oplagte
        translation:
          de: eine Datierung der Ausmüntzung auf ca. 1376–1381 scheint derzeit am naheliegendsten
          en: a dating of the coinage to c. 1376–1381 currently seems the most obvious
          uk: датування карбування приблизно 1376–1381 роками наразі видається найочевиднішим
