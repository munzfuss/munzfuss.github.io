  - type:
      galster: '5'
      galster_volume: galster1972-erik7
    field: year
    basis: compiled
    value:
      - 1403
      - 1424
    curator: 'Serhii 2026-11-02 («Згоден з усім»: datings after Stefke 1995 and Märcher 2018)'
    note:
      de: "Die Datierung ist aus den Datierungen der Quellen zusammengestellt.\n[b]danskmoent.dk (Galster 5)[/b]: [i]«Hulpenning, Næstved og Lund, ca. 1400-1420»[/i] (dt.: «Hohlpfennig, Næstved und Lund, ca. 1400–1420»).\n[b]Lindahl 1955 (NNÅ 1955, S. 79)[/b]: [i]«Hulpenning fra Næstved og Lund? (efter ca. 1405, før 1424)»[/i] (dt.: «Hohlpfennig aus Næstved und Lund? (nach ca. 1405, vor 1424)»).\n[b]Märcher 2018 (Denar til daler, Kap. 6, S. 368)[/b]: die Münzen von Ribe waren die einzigen im Reich [i]«før ca. 1403, hvor udmøntningerne i Næstved startede»[/i] (dt.: «vor ca. 1403, als die Ausmüntzung in Næstved begann»).\n[b]Stefke 1995[/b]: [i]«Eine Variantengruppe der seit Ende 1424 geprägten \"Lebarden\"-Hohlpfennige»[/i].\nDaraus läßt sich der Zeitraum 1403–1424 ableiten: der Beginn nach Märcher, das Ende nach Lindahl."
      en: "The dating is compiled from the datings of the sources.\n[b]danskmoent.dk (Galster 5)[/b]: [i]«Hulpenning, Næstved og Lund, ca. 1400-1420»[/i] (transl.: «Hollow penny, Næstved and Lund, c. 1400–1420»).\n[b]Lindahl 1955 (NNÅ 1955, p. 79)[/b]: [i]«Hulpenning fra Næstved og Lund? (efter ca. 1405, før 1424)»[/i] (transl.: «Hollow penny from Næstved and Lund? (after c. 1405, before 1424)»).\n[b]Märcher 2018 (Denar til daler, ch. 6, p. 368)[/b]: the Ribe coins were the only ones in the realm [i]«før ca. 1403, hvor udmøntningerne i Næstved startede»[/i] (transl.: «before c. 1403, when coinage began in Næstved»).\n[b]Stefke 1995[/b]: [i]«Eine Variantengruppe der seit Ende 1424 geprägten \"Lebarden\"-Hohlpfennige»[/i] (transl.: «A variant group of the «Lebard» hollow pennies struck from the end of 1424»).\nFrom these the period 1403–1424 can be derived: the start after Märcher, the end after Lindahl."
      uk: "Датування зведене з датувань джерел.\n[b]danskmoent.dk (Galster 5)[/b]: [i]«Hulpenning, Næstved og Lund, ca. 1400-1420»[/i] (перекл.: «порожнистий пфеніг, Næstved і Lund, бл. 1400–1420»).\n[b]Lindahl 1955 (NNÅ 1955, с. 79)[/b]: [i]«Hulpenning fra Næstved og Lund? (efter ca. 1405, før 1424)»[/i] (перекл.: «порожнистий пфеніг з Næstved і Lund? (після бл. 1405, до 1424)»).\n[b]Märcher 2018 (Denar til daler, розд. 6, с. 368)[/b]: монети Ribe були єдиними в королівстві [i]«før ca. 1403, hvor udmøntningerne i Næstved startede»[/i] (перекл.: «до бл. 1403, коли почалося карбування в Næstved»).\n[b]Stefke 1995[/b]: [i]«Eine Variantengruppe der seit Ende 1424 geprägten \"Lebarden\"-Hohlpfennige»[/i] (перекл.: «Група варіантів «лебардових» порожнистих пфенігів, що їх карбували з кінця 1424»).\nЗвідси можна вивести період 1403–1424: початок за Märcher, кінець за Lindahl."
      da: "Dateringen er sammenstillet af kildernes dateringer.\n[b]danskmoent.dk (Galster 5)[/b]: [i]«Hulpenning, Næstved og Lund, ca. 1400-1420»[/i].\n[b]Lindahl 1955 (NNÅ 1955, s. 79)[/b]: [i]«Hulpenning fra Næstved og Lund? (efter ca. 1405, før 1424)»[/i].\n[b]Märcher 2018 (Denar til daler, kap. 6, s. 368)[/b]: Ribes mønter var de eneste i riget [i]«før ca. 1403, hvor udmøntningerne i Næstved startede»[/i].\n[b]Stefke 1995[/b]: [i]«Eine Variantengruppe der seit Ende 1424 geprägten \"Lebarden\"-Hohlpfennige»[/i] (overs.: «En variantgruppe af de «lebard»-hulpenninge, der blev præget fra slutningen af 1424»).\nHeraf kan perioden 1403–1424 udledes: begyndelsen efter Märcher, slutningen efter Lindahl."
