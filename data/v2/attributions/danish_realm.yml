    curator: 'Serhii 2026-11-28 (Hvid with crozier first, then Hvid with cross from the start of the same-type sterling; supersedes 2026-11-02)'
    note:
      de: "Die Datierung ist aus den Datierungen der Quellen zusammengestellt.\n[b]Lindahl 1955 (NNÅ 1955, S. 77)[/b]: [i]«Witten fra Næstved (1397—ca. 1405)»[/i] (dt.: «Witten aus Næstved (1397 – ca. 1405)»).\n[b]Galster 1966 (Næstved mønt)[/b]: [i]«Den muligvis ældste Næstved-mønt»[/i] (dt.: «Die möglicherweise älteste Næstveder Münze») — über den Hvid mit Krummstab; die Münzen werden mit Sicherheit erstmals in einem Pfandbrief vom 1. Oktober 1402 genannt: [i]«32 mark sølv i hvid, lovlig og gængse Sjællands mønt»[/i] (dt.: «32 Mark Silber in Hvide, gesetzlicher und gängiger Münze Seelands»). Der Sterling hat das Gepräge des Hvid mit Kreuz: [i]«Man har øjensynlig ret snart opgivet udmøntningen af hviden til fordel for sterlingen … af ganske samme præg og omskrifter som den sidst nævnte hvid»[/i] (dt.: «Man hat die Ausmüntzung des Hvid offenbar recht bald zugunsten des Sterlings aufgegeben … von ganz demselben Gepräge und denselben Umschriften wie der zuletzt genannte Hvid»).\n[b]Märcher 2018 (Denar til daler, Kap. 6, S. 379)[/b]: [i]«Først i 1403 er der med sikkerhed møntproduktion i gang i riget»[/i] (dt.: «Erst 1403 ist im Reich mit Sicherheit eine Münzproduktion im Gange»).\n[b]Moesgaard 2005 (NNUM 2005)[/b]: [i]«Den dateres til 1400-tallets allerførste år»[/i] (dt.: «Er wird in die allerersten Jahre des 15. Jahrhunderts datiert»).\nDaraus läßt sich der Zeitraum 1397–1403 ableiten: der Beginn nach Lindahl; der Hvid mit Krummstab ging dem Hvid mit Kreuz voraus, der beim Beginn des gleich aussehenden Sterlings (mit Sicherheit 1403) an seine Stelle trat."
      en: "The dating is compiled from the datings of the sources.\n[b]Lindahl 1955 (NNÅ 1955, p. 77)[/b]: [i]«Witten fra Næstved (1397—ca. 1405)»[/i] (transl.: «Witten from Næstved (1397 – c. 1405)»).\n[b]Galster 1966 (Næstved mønt)[/b]: [i]«Den muligvis ældste Næstved-mønt»[/i] (transl.: «The possibly oldest Næstved coin») — on the hvid with the crozier; the coins are first named with certainty in a pledge deed of 1 October 1402: [i]«32 mark sølv i hvid, lovlig og gængse Sjællands mønt»[/i] (transl.: «32 marks of silver in hvide, lawful and current coin of Zealand»). The sterling repeats the hvid with the cross: [i]«Man har øjensynlig ret snart opgivet udmøntningen af hviden til fordel for sterlingen … af ganske samme præg og omskrifter som den sidst nævnte hvid»[/i] (transl.: «The coining of the hvid was evidently given up quite soon in favour of the sterling … of exactly the same type and legends as the hvid last mentioned»).\n[b]Märcher 2018 (Denar til daler, ch. 6, p. 379)[/b]: [i]«Først i 1403 er der med sikkerhed møntproduktion i gang i riget»[/i] (transl.: «Only in 1403 is coin production certainly under way in the realm»).\n[b]Moesgaard 2005 (NNUM 2005)[/b]: [i]«Den dateres til 1400-tallets allerførste år»[/i] (transl.: «It is dated to the very first years of the fifteenth century»).\nFrom these the period 1397–1403 can be derived: the start after Lindahl; the hvid with the crozier preceded the hvid with the cross, which replaced it when the sterling of the same type began (certainly by 1403)."
      uk: "Датування зведене з датувань джерел.\n[b]Lindahl 1955 (NNÅ 1955, с. 77)[/b]: [i]«Witten fra Næstved (1397—ca. 1405)»[/i] (перекл.: «Witten з Næstved (1397 — бл. 1405)»).\n[b]Galster 1966 (Næstved mønt)[/b]: [i]«Den muligvis ældste Næstved-mønt»[/i] (перекл.: «Можливо, найстаріша монета Næstved») — про гвід із жезлом; монети вперше напевно названо в заставній грамоті від 1 жовтня 1402: [i]«32 mark sølv i hvid, lovlig og gængse Sjællands mønt»[/i] (перекл.: «32 марки срібла у гвідах, законній і ходовій монеті Зеландії»). Стерлінг повторює гвід із хрестом: [i]«Man har øjensynlig ret snart opgivet udmøntningen af hviden til fordel for sterlingen … af ganske samme præg og omskrifter som den sidst nævnte hvid»[/i] (перекл.: «Карбування гвіда, очевидно, досить скоро покинули на користь стерлінга … точно такого ж зображення й написів, як щойно названий гвід»).\n[b]Märcher 2018 (Denar til daler, розд. 6, с. 379)[/b]: [i]«Først i 1403 er der med sikkerhed møntproduktion i gang i riget»[/i] (перекл.: «Лише з 1403 року карбування в королівстві напевно йде»).\n[b]Moesgaard 2005 (NNUM 2005)[/b]: [i]«Den dateres til 1400-tallets allerførste år»[/i] (перекл.: «Його датують найпершими роками XV століття»).\nЗвідси можна вивести період 1397–1403: початок за Lindahl; гвід із жезлом передував гвіду з хрестом, який змінив його, коли почали карбувати стерлінг того самого вигляду (напевно з 1403)."
      da: "Dateringen er sammenstillet af kildernes dateringer.\n[b]Lindahl 1955 (NNÅ 1955, s. 77)[/b]: [i]«Witten fra Næstved (1397—ca. 1405)»[/i].\n[b]Galster 1966 (Næstved mønt)[/b]: [i]«Den muligvis ældste Næstved-mønt»[/i] — om hviden med krumstav; mønterne nævnes første gang med sikkerhed i et pantebrev af 1. oktober 1402: [i]«32 mark sølv i hvid, lovlig og gængse Sjællands mønt»[/i]. Sterlingen gentager hviden med kors: [i]«Man har øjensynlig ret snart opgivet udmøntningen af hviden til fordel for sterlingen … af ganske samme præg og omskrifter som den sidst nævnte hvid»[/i].\n[b]Märcher 2018 (Denar til daler, kap. 6, s. 379)[/b]: [i]«Først i 1403 er der med sikkerhed møntproduktion i gang i riget»[/i].\n[b]Moesgaard 2005 (NNUM 2005)[/b]: [i]«Den dateres til 1400-tallets allerførste år»[/i].\nHeraf kan perioden 1397–1403 udledes: begyndelsen efter Lindahl; hviden med krumstav gik forud for hviden med kors, der afløste den, da sterlingen af samme præg begyndte (med sikkerhed i 1403)."
