    curator: 'Serhii 2026-11-02 («Згоден з усім»: datings after Stefke 1995 and Märcher 2018)'
    note:
      de: "Die Datierung ist aus den Datierungen der Quellen zusammengestellt.\n[b]Lindahl 1955 (NNÅ 1955, S. 79)[/b] führt Hohlpfennig und Halbpfennig unter einer Überschrift: [i]«Hulpenning fra Næstved og Lund? (efter ca. 1405, før 1424)»[/i] (dt.: «Hohlpfennig aus Næstved und Lund? (nach ca. 1405, vor 1424)»).\n[b]Stefke 1995[/b]: [i]«Insgesamt halte ich es für höchstwahrscheinlich, daß es im Næstved des 15. Jh. nur zweimal eine Münzstätte gegeben hat: 1403-1412/13 und 1422/23»[/i].\n[b]Märcher 2018 (Denar til daler, Kap. 6, S. 368)[/b]: [i]«nogle meget sjældne halvpenninge (en skærv, kun i Næstved) og hvide (kun i Næstved)»[/i] (dt.: «einige sehr seltene Halbpfennige (ein Skærv, nur in Næstved) und Hvide (nur in Næstved)»); nach [b]S. 380[/b] wurde die Münzstätte Næstved geschlossen, als um 1412–1413 die Münzstätte Lund eröffnet wurde.\nDaraus läßt sich der Zeitraum 1403–1413 ableiten: der Skærv ist nur aus Næstved bekannt."
      en: "The dating is compiled from the datings of the sources.\n[b]Lindahl 1955 (NNÅ 1955, p. 79)[/b] lists the hollow penny and the half penny under one heading: [i]«Hulpenning fra Næstved og Lund? (efter ca. 1405, før 1424)»[/i] (transl.: «Hollow penny from Næstved and Lund? (after c. 1405, before 1424)»).\n[b]Stefke 1995[/b]: [i]«Insgesamt halte ich es für höchstwahrscheinlich, daß es im Næstved des 15. Jh. nur zweimal eine Münzstätte gegeben hat: 1403-1412/13 und 1422/23»[/i] (transl.: «On the whole I consider it most probable that in fifteenth-century Næstved there was a mint only twice: 1403–1412/13 and 1422/23»).\n[b]Märcher 2018 (Denar til daler, ch. 6, p. 368)[/b]: [i]«nogle meget sjældne halvpenninge (en skærv, kun i Næstved) og hvide (kun i Næstved)»[/i] (transl.: «some very rare half pennies (a skærv, only in Næstved) and hvide (only in Næstved)»); according to [b]p. 380[/b] the Næstved mint was closed when the Lund mint opened around 1412–1413.\nFrom these the period 1403–1413 can be derived: the skærv is known only from Næstved."
      uk: "Датування зведене з датувань джерел.\n[b]Lindahl 1955 (NNÅ 1955, с. 79)[/b] подає порожнистий пфеніг і півпфеніг під одним заголовком: [i]«Hulpenning fra Næstved og Lund? (efter ca. 1405, før 1424)»[/i] (перекл.: «порожнистий пфеніг з Næstved і Lund? (після бл. 1405, до 1424)»).\n[b]Stefke 1995[/b]: [i]«Insgesamt halte ich es für höchstwahrscheinlich, daß es im Næstved des 15. Jh. nur zweimal eine Münzstätte gegeben hat: 1403-1412/13 und 1422/23»[/i] (перекл.: «Загалом я вважаю найімовірнішим, що в Næstved у XV ст. монетний двір існував лише двічі: 1403–1412/13 і 1422/23»).\n[b]Märcher 2018 (Denar til daler, розд. 6, с. 368)[/b]: [i]«nogle meget sjældne halvpenninge (en skærv, kun i Næstved) og hvide (kun i Næstved)»[/i] (перекл.: «кілька дуже рідкісних півпфенігів (скерв, лише в Næstved) і гвіди (лише в Næstved)»); за [b]с. 380[/b], двір у Næstved закрили, коли близько 1412–1413 відкрився двір у Lund.\nЗвідси можна вивести період 1403–1413: скерв відомий лише з Næstved."
      da: "Dateringen er sammenstillet af kildernes dateringer.\n[b]Lindahl 1955 (NNÅ 1955, s. 79)[/b] fører hulpenning og halvpenning under én overskrift: [i]«Hulpenning fra Næstved og Lund? (efter ca. 1405, før 1424)»[/i].\n[b]Stefke 1995[/b]: [i]«Insgesamt halte ich es für höchstwahrscheinlich, daß es im Næstved des 15. Jh. nur zweimal eine Münzstätte gegeben hat: 1403-1412/13 und 1422/23»[/i] (overs.: «Alt i alt anser jeg det for højst sandsynligt, at der i 1400-tallets Næstved kun to gange var et møntsted: 1403–1412/13 og 1422/23»).\n[b]Märcher 2018 (Denar til daler, kap. 6, s. 368)[/b]: [i]«nogle meget sjældne halvpenninge (en skærv, kun i Næstved) og hvide (kun i Næstved)»[/i]; efter [b]s. 380[/b] blev møntstedet i Næstved lukket, da møntstedet i Lund åbnede omkring 1412–1413.\nHeraf kan perioden 1403–1413 udledes: skærven kendes kun fra Næstved."
