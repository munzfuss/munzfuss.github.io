  - type:
      galster: '6'
      galster_volume: galster1972-erik7
    field: year
    basis: compiled
    value:
      - 1397
      - 1405
    curator: 'Serhii 2026-11-28 (skærv 1397-1405: Nakskov hoard c. 1400-1405 and the high fineness of the assays)'
    note:
      de: "Die Datierung ist aus den Datierungen der Quellen zusammengestellt.\n[b]Galster 1966 (Næstved mønt)[/b]: [i]«sin nye mønt, der blev slået i kong Eriks navn, efter at han 1397 var blevet kronet i Kalmar»[/i] (dt.: «ihre neue Münze, die im Namen König Eriks geschlagen wurde, nachdem er 1397 in Kalmar gekrönt worden war»); zu den Skærve des Fundes von Nakskov: [i]«De tolv skærve vejer i gennemsnit 0,145 g, to prøver viste 334 og 413 tusinddele»[/i] (dt.: «Die zwölf Skærve wiegen durchschnittlich 0,145 g, zwei Proben ergaben 334 und 413 Tausendstel»).\n[b]Märcher 2018 (Denar til daler, Kap. 6, S. 368)[/b]: [i]«nogle meget sjældne halvpenninge (en skærv, kun i Næstved) og hvide (kun i Næstved)»[/i] (dt.: «einige sehr seltene Halbpfennige (ein Skærv, nur in Næstved) und Hvide (nur in Næstved)»); [b]Tab. 6.4, S. 378[/b]: [i]«Nakskov, Gåsetorvet … Ca. 1400-1405 … De 12 danske mønter er samme type: Lille, sjælden brakteat ½ penninge (skærv, brakteat)»[/i] (dt.: «Nakskov, Gåsetorvet … ca. 1400–1405 … Die 12 dänischen Münzen sind vom selben Typ: kleiner, seltener Brakteat-½-Pfennig (Skærv, Brakteat)»).\n[b]Moesgaard 2005 (NNUM 2005)[/b]: der Skærv ist nur aus einem frühen Fund bekannt, alle Proben zeigen hohen Silbergehalt: [i]«Skærven er derfor sandsynligvis kun præget i begyndelsen af Eriks udmøntning»[/i] (dt.: «Der Skærv ist daher wahrscheinlich nur zu Beginn von Eriks Ausmüntzung geprägt worden»).\nDaraus läßt sich der Zeitraum 1397–1405 ableiten: der Beginn mit der Münze im Namen Eriks nach seiner Krönung 1397, das Ende mit dem Fund von Nakskov (ca. 1400–1405), dem einzigen mit Skærve, und dem hohen Silbergehalt der Proben."
      en: "The dating is compiled from the datings of the sources.\n[b]Galster 1966 (Næstved mønt)[/b]: [i]«sin nye mønt, der blev slået i kong Eriks navn, efter at han 1397 var blevet kronet i Kalmar»[/i] (transl.: «her new coinage, struck in King Erik's name after he had been crowned at Kalmar in 1397»); on the skærve of the Nakskov hoard: [i]«De tolv skærve vejer i gennemsnit 0,145 g, to prøver viste 334 og 413 tusinddele»[/i] (transl.: «The twelve skærve weigh 0.145 g on average; two assays showed 334 and 413 thousandths»).\n[b]Märcher 2018 (Denar til daler, ch. 6, p. 368)[/b]: [i]«nogle meget sjældne halvpenninge (en skærv, kun i Næstved) og hvide (kun i Næstved)»[/i] (transl.: «some very rare half pennies (a skærv, only in Næstved) and hvide (only in Næstved)»); [b]table 6.4, p. 378[/b]: [i]«Nakskov, Gåsetorvet … Ca. 1400-1405 … De 12 danske mønter er samme type: Lille, sjælden brakteat ½ penninge (skærv, brakteat)»[/i] (transl.: «Nakskov, Gåsetorvet … c. 1400–1405 … The 12 Danish coins are of the same type: small, rare bracteate ½ penning (skærv, bracteate)»).\n[b]Moesgaard 2005 (NNUM 2005)[/b]: the skærv is known from a single early hoard, and all assays show a high silver content: [i]«Skærven er derfor sandsynligvis kun præget i begyndelsen af Eriks udmøntning»[/i] (transl.: «The skærv was therefore probably struck only at the beginning of Erik's coinage»).\nFrom these the period 1397–1405 can be derived: the start with the coinage in Erik's name after his coronation in 1397, the end with the Nakskov hoard (c. 1400–1405), the only one with skærve, and the high silver content of the assays."
      uk: "Датування зведене з датувань джерел.\n[b]Galster 1966 (Næstved mønt)[/b]: [i]«sin nye mønt, der blev slået i kong Eriks navn, efter at han 1397 var blevet kronet i Kalmar»[/i] (перекл.: «її нова монета, яку карбували від імені короля Еріка після того, як 1397 року його коронували в Kalmar»); про скерви зі скарбу з Nakskov: [i]«De tolv skærve vejer i gennemsnit 0,145 g, to prøver viste 334 og 413 tusinddele»[/i] (перекл.: «Дванадцять скервів важать у середньому 0,145 г; дві проби показали 334 і 413 тисячних»).\n[b]Märcher 2018 (Denar til daler, розд. 6, с. 368)[/b]: [i]«nogle meget sjældne halvpenninge (en skærv, kun i Næstved) og hvide (kun i Næstved)»[/i] (перекл.: «кілька дуже рідкісних півпфенігів (скерв, лише в Næstved) і гвіди (лише в Næstved)»); [b]табл. 6.4, с. 378[/b]: [i]«Nakskov, Gåsetorvet … Ca. 1400-1405 … De 12 danske mønter er samme type: Lille, sjælden brakteat ½ penninge (skærv, brakteat)»[/i] (перекл.: «Nakskov, Gåsetorvet … бл. 1400–1405 … 12 данських монет одного типу: малий рідкісний брактеат ½ пфеніга (скерв, брактеат)»).\n[b]Moesgaard 2005 (NNUM 2005)[/b]: скерв відомий лише з одного раннього скарбу, і всі проби показують високий вміст срібла: [i]«Skærven er derfor sandsynligvis kun præget i begyndelsen af Eriks udmøntning»[/i] (перекл.: «Тому скерв, імовірно, карбували лише на початку монетного випуску Еріка»).\nЗвідси можна вивести період 1397–1405: початок — карбування від імені Еріка після коронації 1397 року, кінець — скарб із Nakskov (бл. 1400–1405), єдиний зі скервами, і висока проба."
      da: "Dateringen er sammenstillet af kildernes dateringer.\n[b]Galster 1966 (Næstved mønt)[/b]: [i]«sin nye mønt, der blev slået i kong Eriks navn, efter at han 1397 var blevet kronet i Kalmar»[/i]; om skærvene fra Nakskov-fundet: [i]«De tolv skærve vejer i gennemsnit 0,145 g, to prøver viste 334 og 413 tusinddele»[/i].\n[b]Märcher 2018 (Denar til daler, kap. 6, s. 368)[/b]: [i]«nogle meget sjældne halvpenninge (en skærv, kun i Næstved) og hvide (kun i Næstved)»[/i]; [b]tabel 6.4, s. 378[/b]: [i]«Nakskov, Gåsetorvet … Ca. 1400-1405 … De 12 danske mønter er samme type: Lille, sjælden brakteat ½ penninge (skærv, brakteat)»[/i].\n[b]Moesgaard 2005 (NNUM 2005)[/b]: skærven kendes kun fra ét tidligt fund, og alle prøver viser høj sølvholdighed: [i]«Skærven er derfor sandsynligvis kun præget i begyndelsen af Eriks udmøntning»[/i].\nHeraf kan perioden 1397–1405 udledes: begyndelsen med mønten i Eriks navn efter kroningen 1397, slutningen med Nakskov-fundet (ca. 1400–1405), det eneste med skærve, og prøvernes høje sølvholdighed."
