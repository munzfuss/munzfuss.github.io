# Attributions — the value a class shows for a field when it rests on
# scholarly works, not on the specimen sources that are its members (D52,
# curator 2026-10-29). `type` names the type by its catalogue number(s), as the
# works do; the merger finds the class by the scoped catalogue keys
# (merge_seeds_cross_source._attribution_matches) and reports a type found in
# no class or in several. basis: given (a work states the value) | compiled (the
# curator's compilation of the works' datings). works[].how: the work's own
# reservation (circa, possibly, …) or plain.
entity: danish_realm
attributions:
  - type:
      galster: '27'
      galster_volume: hg
    field: year
    basis: given
    value: 1497
    curator: Serhii 2026-10-10 (dated 1497 with (?)); recorded as an attribution 2026-10-29
    works:
      - work: Zinck I, s. 9, cit. danskmoent.dk (Galster 27)
        url: https://www.danskmoent.dk/fr/hg27.htm
        how: circa
        quote: blev formentlig slået omkring 1497
        translation:
          de: wurde vermutlich um 1497 geschlagen
          en: was probably struck around 1497
          uk: карбовано, імовірно, близько 1497 року
      - &id001
        work: 'Märcher, in: Horsnæs, Moesgaard, Märcher (red.), Denar til daler (2018)'
        page: 447
        url: https://www.nationalbanken.dk/media/5nznzynp/denar-til-daler-danmarks-moenthistorie-indtil-1550-danmarks-nationalbank.pdf
        how: possibly
        quote: blev der produceret 150.000 gylden til betaling af tyske lejetropper i forbindelse med den svenske konflikt i 1497. Tidsmæssigt og variantmæssigt kan det godt passe sammen
        translation:
          de: wurden 150 000 Gulden zur Bezahlung deutscher Söldner im Zusammenhang mit dem schwedischen Konflikt 1497 hergestellt. Zeitlich und nach den Varianten kann das gut zusammenpassen
          en: 150,000 gulden were produced to pay German mercenaries in connection with the Swedish conflict of 1497. In time and in variants this may well fit together
          uk: було вироблено 150 000 гульденів для оплати німецьких найманців у зв'язку зі шведським конфліктом 1497 року. За часом і за варіантами це цілком може збігатися
      - work: Galster, Danmarks Mønter (Nordisk Kultur XXIX, 1936), cit. danskmoent.dk
        url: https://www.danskmoent.dk/galster/galkult.htm
        how: plain
        quote: de Lejetropper, der modtog Kong Hans' Gylden til Toget mod Sverige 1497
        translation:
          de: den Söldnern, die König Hans' Gulden für den Zug gegen Schweden 1497 erhielten
          en: the mercenaries who received King Hans's gulden for the campaign against Sweden in 1497
          uk: найманцям, які отримали гульдени короля Hans для походу проти Швеції 1497 року
  - type:
      galster: '28'
      galster_volume: hg
    field: year
    basis: compiled
    value: 1497
    curator: Serhii 2026-10-10 (dated 1497 with (?), as the full gulden); recorded as an attribution 2026-10-29
    works:
      - work: 'Märcher, in: Horsnæs, Moesgaard, Märcher (red.), Denar til daler (2018)'
        page: 447
        url: https://www.nationalbanken.dk/media/5nznzynp/denar-til-daler-danmarks-moenthistorie-indtil-1550-danmarks-nationalbank.pdf
        how: possibly
        quote: en nu uhyre sjælden ½ gylden, der formodentlig er produceret på samme tid som de andre
        translation:
          de: ein heute äußerst seltener ½ Gulden, der vermutlich zur selben Zeit wie die anderen hergestellt wurde
          en: a now extremely rare ½ gulden, presumably produced at the same time as the others
          uk: нині надзвичайно рідкісний ½ гульден, імовірно вироблений водночас з іншими
      - *id001
  - type:
      galster: '2'
      galster_volume: galster1972-erik7
    field: year
    basis: compiled
    value:
      - 1403
      - 1413
    curator: 'Serhii 2026-11-02 («Згоден з усім»: datings after Stefke 1995 and Märcher 2018)'
    note:
      de: "Die Datierung ist aus den Datierungen der Quellen zusammengestellt.\n[b]Lindahl 1955 (NNÅ 1955, S. 77)[/b]: [i]«Witten fra Næstved (1397—ca. 1405)»[/i] (dt.: «Witten aus Næstved (1397 – ca. 1405)»).\n[b]Stefke 1995[/b]: [i]«Insgesamt halte ich es für höchstwahrscheinlich, daß es im Næstved des 15. Jh. nur zweimal eine Münzstätte gegeben hat: 1403-1412/13 und 1422/23»[/i]; 1422/23 wurden dort nur Kupfersterlinge geprägt.\n[b]Märcher 2018 (Denar til daler, Kap. 6, S. 368)[/b]: die Münzen von Ribe waren die einzigen im Reich [i]«før ca. 1403, hvor udmøntningerne i Næstved startede»[/i] (dt.: «vor ca. 1403, als die Ausmüntzung in Næstved begann»); Hvide wurden nur in Næstved geprägt; nach [b]S. 380[/b]: [i]«der synes ikke umiddelbart at være tegn på, at Lundemønten åbnede tidligere end omkring 1412-1413. Formentlig var der tale om en nogenlunde samtidig lukning af møntstedet i Næstved til fordel for det i Lund»[/i] (dt.: «es scheint keine unmittelbaren Anzeichen zu geben, daß die Lunder Münzstätte früher als um 1412–1413 öffnete. Vermutlich handelte es sich um eine ungefähr gleichzeitige Schließung der Münzstätte in Næstved zugunsten derjenigen in Lund»).\nDaraus läßt sich der Zeitraum 1403–1413 ableiten: der Beginn nach Stefke und Märcher, das Ende mit der Schließung der Münzstätte Næstved."
      en: "The dating is compiled from the datings of the sources.\n[b]Lindahl 1955 (NNÅ 1955, p. 77)[/b]: [i]«Witten fra Næstved (1397—ca. 1405)»[/i] (transl.: «Witten from Næstved (1397 – c. 1405)»).\n[b]Stefke 1995[/b]: [i]«Insgesamt halte ich es für höchstwahrscheinlich, daß es im Næstved des 15. Jh. nur zweimal eine Münzstätte gegeben hat: 1403-1412/13 und 1422/23»[/i] (transl.: «On the whole I consider it most probable that in fifteenth-century Næstved there was a mint only twice: 1403–1412/13 and 1422/23»); in 1422/23 only copper sterlings were struck there.\n[b]Märcher 2018 (Denar til daler, ch. 6, p. 368)[/b]: the Ribe coins were the only ones in the realm [i]«før ca. 1403, hvor udmøntningerne i Næstved startede»[/i] (transl.: «before c. 1403, when coinage began in Næstved»); hvide were struck only in Næstved; according to [b]p. 380[/b]: [i]«der synes ikke umiddelbart at være tegn på, at Lundemønten åbnede tidligere end omkring 1412-1413. Formentlig var der tale om en nogenlunde samtidig lukning af møntstedet i Næstved til fordel for det i Lund»[/i] (transl.: «there seems to be no immediate sign that the Lund mint opened earlier than around 1412–1413. Presumably the Næstved mint was closed at roughly the same time in favour of the one in Lund»).\nFrom these the period 1403–1413 can be derived: the start after Stefke and Märcher, the end with the closing of the Næstved mint."
      uk: "Датування зведене з датувань джерел.\n[b]Lindahl 1955 (NNÅ 1955, с. 77)[/b]: [i]«Witten fra Næstved (1397—ca. 1405)»[/i] (перекл.: «Witten з Næstved (1397 — бл. 1405)»).\n[b]Stefke 1995[/b]: [i]«Insgesamt halte ich es für höchstwahrscheinlich, daß es im Næstved des 15. Jh. nur zweimal eine Münzstätte gegeben hat: 1403-1412/13 und 1422/23»[/i] (перекл.: «Загалом я вважаю найімовірнішим, що в Næstved у XV ст. монетний двір існував лише двічі: 1403–1412/13 і 1422/23»); у 1422/23 там карбували тільки мідні стерлінги.\n[b]Märcher 2018 (Denar til daler, розд. 6, с. 368)[/b]: монети Ribe були єдиними в королівстві [i]«før ca. 1403, hvor udmøntningerne i Næstved startede»[/i] (перекл.: «до бл. 1403, коли почалося карбування в Næstved»); гвіди карбували лише в Næstved; за [b]с. 380[/b]: [i]«der synes ikke umiddelbart at være tegn på, at Lundemønten åbnede tidligere end omkring 1412-1413. Formentlig var der tale om en nogenlunde samtidig lukning af møntstedet i Næstved til fordel for det i Lund»[/i] (перекл.: «немає явних ознак, що монетний двір у Lund відкрився раніше ніж близько 1412–1413. Імовірно, йшлося про приблизно одночасне закриття монетного двору в Næstved на користь двору в Lund»).\nЗвідси можна вивести період 1403–1413: початок за Stefke і Märcher, кінець — закриття монетного двору в Næstved."
      da: "Dateringen er sammenstillet af kildernes dateringer.\n[b]Lindahl 1955 (NNÅ 1955, s. 77)[/b]: [i]«Witten fra Næstved (1397—ca. 1405)»[/i].\n[b]Stefke 1995[/b]: [i]«Insgesamt halte ich es für höchstwahrscheinlich, daß es im Næstved des 15. Jh. nur zweimal eine Münzstätte gegeben hat: 1403-1412/13 und 1422/23»[/i] (overs.: «Alt i alt anser jeg det for højst sandsynligt, at der i 1400-tallets Næstved kun to gange var et møntsted: 1403–1412/13 og 1422/23»); i 1422/23 blev der kun slået kobbersterlinge dér.\n[b]Märcher 2018 (Denar til daler, kap. 6, s. 368)[/b]: Ribes mønter var de eneste i riget [i]«før ca. 1403, hvor udmøntningerne i Næstved startede»[/i]; hvide blev kun slået i Næstved; efter [b]s. 380[/b]: [i]«der synes ikke umiddelbart at være tegn på, at Lundemønten åbnede tidligere end omkring 1412-1413. Formentlig var der tale om en nogenlunde samtidig lukning af møntstedet i Næstved til fordel for det i Lund»[/i].\nHeraf kan perioden 1403–1413 udledes: begyndelsen efter Stefke og Märcher, slutningen med lukningen af møntstedet i Næstved."
    works:
      - work: Lindahl, Danmarks mønter 1377–1448 (Nordisk Numismatisk Årsskrift 1955)
        page: 77
        url: https://www.danskmoent.dk/pdf2/NNA_1955_Lindahl.pdf
        how: circa
        quote: Witten fra Næstved (1397—ca. 1405)
        translation:
          de: Witten aus Næstved (1397 – ca. 1405)
          en: Witten from Næstved (1397 – c. 1405)
          uk: Witten з Næstved (1397 — бл. 1405)
      - &id002
        work: Stefke, Der Beginn der Sterling-Prägung in Lund und das Ende der Münzstätte Næstved (Studia Numismatica, Tallinn 1995), cit. danskmoent.dk
        url: https://www.danskmoent.dk/artikler/stefke.htm
        how: plain
        quote: 'Insgesamt halte ich es für höchstwahrscheinlich, daß es im Næstved des 15. Jh. nur zweimal eine Münzstätte gegeben hat: 1403-1412/13 und 1422/23'
        translation:
          de: 'Insgesamt halte ich es für höchstwahrscheinlich, daß es im Næstved des 15. Jh. nur zweimal eine Münzstätte gegeben hat: 1403-1412/13 und 1422/23'
          en: 'On the whole I consider it most probable that in fifteenth-century Næstved there was a mint only twice: 1403–1412/13 and 1422/23'
          uk: 'Загалом я вважаю найімовірнішим, що в Næstved у XV ст. монетний двір існував лише двічі: 1403–1412/13 і 1422/23'
          da: 'Alt i alt anser jeg det for højst sandsynligt, at der i 1400-tallets Næstved kun to gange var et møntsted: 1403–1412/13 og 1422/23'
      - &id003
        work: 'Märcher, in: Horsnæs, Moesgaard, Märcher (red.), Denar til daler (2018)'
        page: 368
        url: https://www.nationalbanken.dk/media/5nznzynp/denar-til-daler-danmarks-moenthistorie-indtil-1550-danmarks-nationalbank.pdf
        how: circa
        quote: før ca. 1403, hvor udmøntningerne i Næstved startede
        translation:
          de: vor ca. 1403, als die Ausmüntzung in Næstved begann
          en: before c. 1403, when coinage began in Næstved
          uk: до бл. 1403, коли почалося карбування в Næstved
      - &id004
        work: 'Märcher, in: Horsnæs, Moesgaard, Märcher (red.), Denar til daler (2018)'
        page: 380
        url: https://www.nationalbanken.dk/media/5nznzynp/denar-til-daler-danmarks-moenthistorie-indtil-1550-danmarks-nationalbank.pdf
        how: circa
        quote: der synes ikke umiddelbart at være tegn på, at Lundemønten åbnede tidligere end omkring 1412-1413. Formentlig var der tale om en nogenlunde samtidig lukning af møntstedet i Næstved til fordel for det i Lund
        translation:
          de: es scheint keine unmittelbaren Anzeichen zu geben, daß die Lunder Münzstätte früher als um 1412–1413 öffnete. Vermutlich handelte es sich um eine ungefähr gleichzeitige Schließung der Münzstätte in Næstved zugunsten derjenigen in Lund
          en: there seems to be no immediate sign that the Lund mint opened earlier than around 1412–1413. Presumably the Næstved mint was closed at roughly the same time in favour of the one in Lund
          uk: немає явних ознак, що монетний двір у Lund відкрився раніше ніж близько 1412–1413. Імовірно, йшлося про приблизно одночасне закриття монетного двору в Næstved на користь двору в Lund
