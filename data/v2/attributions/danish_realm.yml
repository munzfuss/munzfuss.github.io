    curator: 'Serhii 2026-11-28 (Hvid with crozier first, then Hvid with cross from the start of the same-type sterling; supersedes 2026-11-02)'
    note:
      de: "Die Datierung ist aus den Datierungen der Quellen zusammengestellt.\n[b]Lindahl 1955 (NNÅ 1955, S. 77)[/b]: [i]«Witten fra Næstved (1397—ca. 1405)»[/i] (dt.: «Witten aus Næstved (1397 – ca. 1405)»); zum Hvid mit Kreuz: [i]«den følgende lidt yngre witten»[/i] (dt.: «der folgende, etwas jüngere Witten»).\n[b]Galster 1966 (Næstved mønt)[/b]: [i]«Man har øjensynlig ret snart opgivet udmøntningen af hviden til fordel for sterlingen … af ganske samme præg og omskrifter som den sidst nævnte hvid»[/i] (dt.: «Man hat die Ausmüntzung des Hvid offenbar recht bald zugunsten des Sterlings aufgegeben … von ganz demselben Gepräge und denselben Umschriften wie der zuletzt genannte Hvid»).\n[b]Märcher 2018 (Denar til daler, Kap. 6, S. 379)[/b]: [i]«Først i 1403 er der med sikkerhed møntproduktion i gang i riget»[/i] (dt.: «Erst 1403 ist im Reich mit Sicherheit eine Münzproduktion im Gange»).\n[b]Moesgaard 2005 (NNUM 2005)[/b]: [i]«Den dateres til 1400-tallets allerførste år»[/i] (dt.: «Er wird in die allerersten Jahre des 15. Jahrhunderts datiert»).\nDaraus läßt sich der Zeitraum 1403–1405 ableiten: der Hvid mit Kreuz trat beim Beginn des gleich aussehenden Sterlings (mit Sicherheit 1403) an die Stelle des Hvid mit Krummstab und wich bald dem Sterling; das Ende nach Lindahl."
      en: "The dating is compiled from the datings of the sources.\n[b]Lindahl 1955 (NNÅ 1955, p. 77)[/b]: [i]«Witten fra Næstved (1397—ca. 1405)»[/i] (transl.: «Witten from Næstved (1397 – c. 1405)»); on the hvid with the cross: [i]«den følgende lidt yngre witten»[/i] (transl.: «the following, somewhat younger witten»).\n[b]Galster 1966 (Næstved mønt)[/b]: [i]«Man har øjensynlig ret snart opgivet udmøntningen af hviden til fordel for sterlingen … af ganske samme præg og omskrifter som den sidst nævnte hvid»[/i] (transl.: «The coining of the hvid was evidently given up quite soon in favour of the sterling … of exactly the same type and legends as the hvid last mentioned»).\n[b]Märcher 2018 (Denar til daler, ch. 6, p. 379)[/b]: [i]«Først i 1403 er der med sikkerhed møntproduktion i gang i riget»[/i] (transl.: «Only in 1403 is coin production certainly under way in the realm»).\n[b]Moesgaard 2005 (NNUM 2005)[/b]: [i]«Den dateres til 1400-tallets allerførste år»[/i] (transl.: «It is dated to the very first years of the fifteenth century»).\nFrom these the period 1403–1405 can be derived: the hvid with the cross replaced the hvid with the crozier when the sterling of the same type began (certainly by 1403) and soon gave way to the sterling; the end after Lindahl."
      uk: "Датування зведене з датувань джерел.\n[b]Lindahl 1955 (NNÅ 1955, с. 77)[/b]: [i]«Witten fra Næstved (1397—ca. 1405)»[/i] (перекл.: «Witten з Næstved (1397 — бл. 1405)»); про гвід із хрестом: [i]«den følgende lidt yngre witten»[/i] (перекл.: «наступний, трохи молодший віттен»).\n[b]Galster 1966 (Næstved mønt)[/b]: [i]«Man har øjensynlig ret snart opgivet udmøntningen af hviden til fordel for sterlingen … af ganske samme præg og omskrifter som den sidst nævnte hvid»[/i] (перекл.: «Карбування гвіда, очевидно, досить скоро покинули на користь стерлінга … точно такого ж зображення й написів, як щойно названий гвід»).\n[b]Märcher 2018 (Denar til daler, розд. 6, с. 379)[/b]: [i]«Først i 1403 er der med sikkerhed møntproduktion i gang i riget»[/i] (перекл.: «Лише з 1403 року карбування в королівстві напевно йде»).\n[b]Moesgaard 2005 (NNUM 2005)[/b]: [i]«Den dateres til 1400-tallets allerførste år»[/i] (перекл.: «Його датують найпершими роками XV століття»).\nЗвідси можна вивести період 1403–1405: гвід із хрестом змінив гвід із жезлом, коли почали карбувати стерлінг того самого вигляду (напевно з 1403), і незабаром поступився стерлінгу; кінець за Lindahl."
      da: "Dateringen er sammenstillet af kildernes dateringer.\n[b]Lindahl 1955 (NNÅ 1955, s. 77)[/b]: [i]«Witten fra Næstved (1397—ca. 1405)»[/i]; om hviden med kors: [i]«den følgende lidt yngre witten»[/i].\n[b]Galster 1966 (Næstved mønt)[/b]: [i]«Man har øjensynlig ret snart opgivet udmøntningen af hviden til fordel for sterlingen … af ganske samme præg og omskrifter som den sidst nævnte hvid»[/i].\n[b]Märcher 2018 (Denar til daler, kap. 6, s. 379)[/b]: [i]«Først i 1403 er der med sikkerhed møntproduktion i gang i riget»[/i].\n[b]Moesgaard 2005 (NNUM 2005)[/b]: [i]«Den dateres til 1400-tallets allerførste år»[/i].\nHeraf kan perioden 1403–1405 udledes: hviden med kors afløste hviden med krumstav, da sterlingen af samme præg begyndte (med sikkerhed i 1403), og veg snart for sterlingen; slutningen efter Lindahl."
