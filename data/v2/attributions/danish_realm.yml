    value: 1422
    curator: "Serhii 2026-11-14 («Блафферт і датування»: Hedin's dating after Moesgaard 2005 added beside Galster's c. 1422; the year stays 1422)"
    note:
      de: "Das Jahr nach [b]danskmoent.dk (Galster 10)[/b]: [i]«Erik af Pommern Kobbersterling, Lund, ca. 1422»[/i] (Übers.: «Erik von Pommern, Kupfersterling, Lund, ca. 1422»); ebenso auf den Seiten zu Galster 7, 14 und 15.\n[b]Hedin 2023 (Myntstudier 2023:1, S. 31)[/b] nach Moesgaard 2005: [i]«den inte förkommer tillsammans med gros-mynt (1430-talet), vilket gör att dateringen blir ca 1420–30/35»[/i] (Übers.: «er kommt nicht zusammen mit Gros-Münzen (1430er Jahre) vor, wodurch sich die Datierung ca. 1420–30/35 ergibt»)."
      en: "The year after [b]danskmoent.dk (Galster 10)[/b]: [i]«Erik af Pommern Kobbersterling, Lund, ca. 1422»[/i] (transl.: «Erik of Pomerania, copper sterling, Lund, c. 1422»); likewise on the pages for Galster 7, 14 and 15.\n[b]Hedin 2023 (Myntstudier 2023:1, p. 31)[/b] after Moesgaard 2005: [i]«den inte förkommer tillsammans med gros-mynt (1430-talet), vilket gör att dateringen blir ca 1420–30/35»[/i] (transl.: «it does not occur together with gros coins (1430s), which gives the dating c. 1420–30/35»)."
      uk: "Рік за [b]danskmoent.dk (Galster 10)[/b]: [i]«Erik af Pommern Kobbersterling, Lund, ca. 1422»[/i] (перекл.: «Ерік Померанський, мідний стерлінг, Lund, бл. 1422»); так само на сторінках Galster 7, 14 і 15.\n[b]Hedin 2023 (Myntstudier 2023:1, с. 31)[/b] за Moesgaard 2005: [i]«den inte förkommer tillsammans med gros-mynt (1430-talet), vilket gör att dateringen blir ca 1420–30/35»[/i] (перекл.: «він не трапляється разом із монетами gros (1430-ті роки), тож датування виходить бл. 1420–30/35»)."
      da: "Året efter [b]danskmoent.dk (Galster 10)[/b]: [i]«Erik af Pommern Kobbersterling, Lund, ca. 1422»[/i]; ligeså på siderne for Galster 7, 14 og 15.\n[b]Hedin 2023 (Myntstudier 2023:1, s. 31)[/b] efter Moesgaard 2005: [i]«den inte förkommer tillsammans med gros-mynt (1430-talet), vilket gör att dateringen blir ca 1420–30/35»[/i] (overs.: «den forekommer ikke sammen med grosmønter (1430’erne), hvilket giver dateringen ca. 1420–30/35»)."
