    curator: 'Serhii 2026-11-02 («Згоден з усім»: datings after Stefke 1995 and Märcher 2018)'
    note:
      de: "Die Datierung ist aus den Datierungen der Quellen zusammengestellt.\n[b]danskmoent.dk (Galster 9)[/b]: [i]«Sterling (3 penning), Lund, ca. 1413-1420»[/i] (dt.: «Sterling (3 Pfennig), Lund, ca. 1413–1420»).\n[b]Stefke 1995[/b]: [i]«Was den Beginn der Münzproduktion in Lund angeht, wird man am ehesten daran denken wollen, daß er nicht vor Ende 1412 stattfand»[/i].\n[b]Märcher 2018 (Denar til daler, Kap. 6, S. 380)[/b]: [i]«der synes ikke umiddelbart at være tegn på, at Lundemønten åbnede tidligere end omkring 1412-1413. Formentlig var der tale om en nogenlunde samtidig lukning af møntstedet i Næstved til fordel for det i Lund»[/i] (dt.: «es scheint keine unmittelbaren Anzeichen zu geben, daß die Lunder Münzstätte früher als um 1412–1413 öffnete. Vermutlich handelte es sich um eine ungefähr gleichzeitige Schließung der Münzstätte in Næstved zugunsten derjenigen in Lund»); nach [b]S. 379[/b]: [i]«Sterlingen blev som antydet den vigtigste danskproducerede mønt fra ca. 1403-1420»[/i] (dt.: «Der Sterling wurde, wie angedeutet, die wichtigste in Dänemark hergestellte Münze von ca. 1403–1420»).\nDaraus läßt sich der Zeitraum 1412–1420 ableiten: der Beginn nach Stefke und Märcher, das Ende nach Märcher und danskmoent.dk."
      en: "The dating is compiled from the datings of the sources.\n[b]danskmoent.dk (Galster 9)[/b]: [i]«Sterling (3 penning), Lund, ca. 1413-1420»[/i] (transl.: «Sterling (3 penning), Lund, c. 1413–1420»).\n[b]Stefke 1995[/b]: [i]«Was den Beginn der Münzproduktion in Lund angeht, wird man am ehesten daran denken wollen, daß er nicht vor Ende 1412 stattfand»[/i] (transl.: «As for the beginning of coin production in Lund, one will most readily think that it did not take place before the end of 1412»).\n[b]Märcher 2018 (Denar til daler, ch. 6, p. 380)[/b]: [i]«der synes ikke umiddelbart at være tegn på, at Lundemønten åbnede tidligere end omkring 1412-1413. Formentlig var der tale om en nogenlunde samtidig lukning af møntstedet i Næstved til fordel for det i Lund»[/i] (transl.: «there seems to be no immediate sign that the Lund mint opened earlier than around 1412–1413. Presumably the Næstved mint was closed at roughly the same time in favour of the one in Lund»); according to [b]p. 379[/b]: [i]«Sterlingen blev som antydet den vigtigste danskproducerede mønt fra ca. 1403-1420»[/i] (transl.: «As indicated, the sterling became the most important Danish-produced coin from c. 1403–1420»).\nFrom these the period 1412–1420 can be derived: the start after Stefke and Märcher, the end after Märcher and danskmoent.dk."
      uk: "Датування зведене з датувань джерел.\n[b]danskmoent.dk (Galster 9)[/b]: [i]«Sterling (3 penning), Lund, ca. 1413-1420»[/i] (перекл.: «стерлінг (3 пфеніги), Lund, бл. 1413–1420»).\n[b]Stefke 1995[/b]: [i]«Was den Beginn der Münzproduktion in Lund angeht, wird man am ehesten daran denken wollen, daß er nicht vor Ende 1412 stattfand»[/i] (перекл.: «Щодо початку карбування в Lund, найімовірніше слід вважати, що воно почалося не раніше кінця 1412»).\n[b]Märcher 2018 (Denar til daler, розд. 6, с. 380)[/b]: [i]«der synes ikke umiddelbart at være tegn på, at Lundemønten åbnede tidligere end omkring 1412-1413. Formentlig var der tale om en nogenlunde samtidig lukning af møntstedet i Næstved til fordel for det i Lund»[/i] (перекл.: «немає явних ознак, що монетний двір у Lund відкрився раніше ніж близько 1412–1413. Імовірно, йшлося про приблизно одночасне закриття монетного двору в Næstved на користь двору в Lund»); за [b]с. 379[/b]: [i]«Sterlingen blev som antydet den vigtigste danskproducerede mønt fra ca. 1403-1420»[/i] (перекл.: «Як зазначено, стерлінг став найважливішою монетою данського виробництва бл. 1403–1420»).\nЗвідси можна вивести період 1412–1420: початок за Stefke і Märcher, кінець за Märcher і danskmoent.dk."
      da: "Dateringen er sammenstillet af kildernes dateringer.\n[b]danskmoent.dk (Galster 9)[/b]: [i]«Sterling (3 penning), Lund, ca. 1413-1420»[/i].\n[b]Stefke 1995[/b]: [i]«Was den Beginn der Münzproduktion in Lund angeht, wird man am ehesten daran denken wollen, daß er nicht vor Ende 1412 stattfand»[/i] (overs.: «Hvad begyndelsen af møntproduktionen i Lund angår, vil man helst tænke, at den ikke fandt sted før slutningen af 1412»).\n[b]Märcher 2018 (Denar til daler, kap. 6, s. 380)[/b]: [i]«der synes ikke umiddelbart at være tegn på, at Lundemønten åbnede tidligere end omkring 1412-1413. Formentlig var der tale om en nogenlunde samtidig lukning af møntstedet i Næstved til fordel for det i Lund»[/i]; efter [b]s. 379[/b]: [i]«Sterlingen blev som antydet den vigtigste danskproducerede mønt fra ca. 1403-1420»[/i].\nHeraf kan perioden 1412–1420 udledes: begyndelsen efter Stefke og Märcher, slutningen efter Märcher og danskmoent.dk."
