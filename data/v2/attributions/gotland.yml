# Attributions — the value a class shows for a field when it rests on
# scholarly works, not on the specimen sources that are its members (D52,
# curator 2026-10-29). `type` names the type by its catalogue number(s), as the
# works do; the merger finds the class by the scoped catalogue keys
# (merge_seeds_cross_source._attribution_matches) and reports a type found in
# no class or in several. basis: given (a work states the value) | compiled (the
# curator's compilation of the works' datings). works[].how: the work's own
# reservation (circa, possibly, …) or plain.
entity: gotland
attributions:
  - type:
      galster: '142'
      galster_volume: hg
    field: year
    basis: given
    value: 1510
    curator: 'Serhii 2026-11-02 («роби цей варіант і нотатку»: 1510 (?) after Hauberg)'
    note:
      de: "Das Jahr nach [b]Hauberg 1891, S. 66[/b]: [i]«c. 1510»[/i]. Ebenda, [b]S. 47–48[/b], wird der Typ der Zeit König Hans' zugewiesen: [i]«Formentlig i Begyndelsen af det 16de Aarhundrede, under Kong Hans, gjenoptoges atter den gamle Typ med Lilien og Lammet»[/i] (dt.: «Vermutlich zu Beginn des 16. Jahrhunderts, unter König Hans, wurde der alte Typ mit der Lilie und dem Lamm wieder aufgenommen»); nach [b]S. 48[/b] wird er unter Christian II. aufgegeben: [i]«Under Christian II. forlades helt Typen med Liliebusken»[/i] (dt.: «Unter Christian II. wird der Typ mit dem Lilienbusch ganz verlassen»). [b]danskmoent.dk (Galster 142)[/b]: [i]«Hans, Hvid u. år, Visby (Gotland)»[/i] (dt.: «Hans, Hvid o. J., Visby (Gotland)»). [b]Lindblad 2017 (Metallanalyser av mynt 2017:3), S. 12[/b] datiert die Gruppe: [i]«Hvider (ca 1500-1520)»[/i] (dt.: «Hvide (ca. 1500–1520)»)."
      en: 'The year after [b]Hauberg 1891, p. 66[/b]: [i]«c. 1510»[/i]. In the same work, [b]pp. 47–48[/b], the type is assigned to the time of King Hans: [i]«Formentlig i Begyndelsen af det 16de Aarhundrede, under Kong Hans, gjenoptoges atter den gamle Typ med Lilien og Lammet»[/i] (transl.: «Presumably at the beginning of the 16th century, under King Hans, the old type with the lily and the lamb was taken up again»); according to [b]p. 48[/b] it is abandoned under Christian II: [i]«Under Christian II. forlades helt Typen med Liliebusken»[/i] (transl.: «Under Christian II the type with the lily bush is abandoned entirely»). [b]danskmoent.dk (Galster 142)[/b]: [i]«Hans, Hvid u. år, Visby (Gotland)»[/i] (transl.: «Hans, Hvid, undated, Visby (Gotland)»). [b]Lindblad 2017 (Metallanalyser av mynt 2017:3), p. 12[/b] dates the group: [i]«Hvider (ca 1500-1520)»[/i] (transl.: «Hvide (c. 1500–1520)»).'
      uk: 'Рік за [b]Hauberg 1891, с. 66[/b]: [i]«c. 1510»[/i]. Там само, [b]с. 47–48[/b], тип віднесено до часу короля Hans: [i]«Formentlig i Begyndelsen af det 16de Aarhundrede, under Kong Hans, gjenoptoges atter den gamle Typ med Lilien og Lammet»[/i] (перекл.: «Імовірно, на початку XVI століття, за короля Hans, знову відновили старий тип з лілією і ягням»); за [b]с. 48[/b], за Christian II його полишено: [i]«Under Christian II. forlades helt Typen med Liliebusken»[/i] (перекл.: «За Christian II тип з лілійним кущем повністю полишено»). [b]danskmoent.dk (Galster 142)[/b]: [i]«Hans, Hvid u. år, Visby (Gotland)»[/i] (перекл.: «Hans, Hvid без року, Visby (Gotland)»). [b]Lindblad 2017 (Metallanalyser av mynt 2017:3), с. 12[/b] датує групу: [i]«Hvider (ca 1500-1520)»[/i] (перекл.: «Hvide (бл. 1500–1520)»).'
      da: "Året efter [b]Hauberg 1891, s. 66[/b]: [i]«c. 1510»[/i]. Samme sted, [b]s. 47–48[/b], henføres typen til kong Hans' tid: [i]«Formentlig i Begyndelsen af det 16de Aarhundrede, under Kong Hans, gjenoptoges atter den gamle Typ med Lilien og Lammet»[/i]; efter [b]s. 48[/b] opgives den under Christian II: [i]«Under Christian II. forlades helt Typen med Liliebusken»[/i]. [b]danskmoent.dk (Galster 142)[/b]: [i]«Hans, Hvid u. år, Visby (Gotland)»[/i]. [b]Lindblad 2017 (Metallanalyser av mynt 2017:3), s. 12[/b] daterer gruppen: [i]«Hvider (ca 1500-1520)»[/i] (overs.: «Hvide (ca. 1500–1520)»)."
    works:
      - work: Hauberg, Gullands Myntvæsen (Aarbøger for nordisk Oldkyndighed og Historie 1891)
        page: 66
        url: https://www.danskmoent.dk/pdf2/Hauberg%20Gulland.pdf
        how: circa
        quote: c. 1510
      - work: Hauberg, Gullands Myntvæsen (Aarbøger for nordisk Oldkyndighed og Historie 1891)
        page: 47–48
        url: https://www.danskmoent.dk/pdf2/Hauberg%20Gulland.pdf
        how: possibly
        quote: Formentlig i Begyndelsen af det 16de Aarhundrede, under Kong Hans, gjenoptoges atter den gamle Typ med Lilien og Lammet
        translation:
          de: Vermutlich zu Beginn des 16. Jahrhunderts, unter König Hans, wurde der alte Typ mit der Lilie und dem Lamm wieder aufgenommen
          en: Presumably at the beginning of the 16th century, under King Hans, the old type with the lily and the lamb was taken up again
          uk: Імовірно, на початку XVI століття, за короля Hans, знову відновили старий тип з лілією і ягням
