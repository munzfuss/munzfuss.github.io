  - id: kmk-122078
    category: off_strike
    scope: member
    reason: "KMM GP 4551.56 (ex L. E. Bruun, LEB# 10854): a gold strike from the dies of the Norwegian 2 Skilling 1786 (Hede Norge 16) — photo: C7 monogram, «2 SKILLING DANSKE», «17 86», «H·I·A·B». L. E. Bruuns Mønt- og Medaillesamling (1928), p. 327, no. 10854: «Toskilling … — Afslag paa en Kurant Dukat fra 1760». KMM's «1810» and «H 10» belong to no part of it. Off-metal strike, CLAUDE.md §9.3. Curator (Serhii) 2026-11-07: «Всі інші згоден»."
    curator: Serhii
    date: '2026-11-07'
