  # dies of the SILVER Norwegian 1 Speciedaler (Christiania) — stamped
  # «1 Speciedaler» (silver) ≪ 10-Dukat gold-bullion value → §9.5. Verified
  # ruler = Frederik III + Guldafslag against danskmoent norge (nf3h39/55/62) +
  # KMM (authority «Frederik 3», nation Norge). Norway-Hede numbering (Rønning#/
  # Thesen#), distinct from the Danish Hede — the silver Norwegian Speciedaler
  # mothers (nf3h39/55/62) are separate finals and are KEPT. ---
