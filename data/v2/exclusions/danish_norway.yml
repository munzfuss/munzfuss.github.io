  - id: dk-hede-nc5h19abc
    category: pattern
    reason: "Gyldenløve's ducat (Hede Norge 19A-C, Schou 4 / 35 / 39, KM Pn3; gold, undated, Christiania): a presentation or trial piece, not a circulation coin (§9.1). Wilcke 1927 (Kurantmønten 1726-1788), p. 38-39: the ducats struck in or for Norway under Christian V «har imidlertid ikke spillet nogen Rolle for Omsætningen eller Møntbestanden, men tjent som en Slags Presentmønt eller Prøvemønt ved særlige Lejligheder», the type listed as «U. A. Saakaldt Gyldenløves Dukat». Krause numbers it KM Pn3 (gold) / Pn4 (silver), Numista files both under «Patterns». Curator (Serhii) 2026-11-18: «Цю медаль/монету виключай»."
    curator: Serhii
    date: '2026-11-18'
