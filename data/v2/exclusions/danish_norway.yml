  - id: ngc-1099232
    category: off_strike
    reason: >-
      F.III Norway Guldafslag, Norge-Hede 62, 1668, Christiania — the NGC copy of
      the very type already excluded above as dk-numista-387243 (KM PnD20).
      Membership proven from the source rather than inferred: NGC's own record
      carries «Struck with Speciedaler dies, KM#83», is_pattern_number true and a
      cross-reference to the silver mother KM 83; danskmoent norge/nf3h62, the
      mother's page, lists the off-strike inline as «Guldafslag 10 Dukat 1668 og
      1669 (Unik, Schou 1)». Gold 10-Dukat off-strike of the SILVER 1 Speciedaler
      die, one known specimen, no Hede number of its own — the §9.3 hallmark in
      full. The exclusion list matches by seed id, so this copy survived the
      2026-07-12 pass only because the NGC harvest arrived 2026-08-10; recording
      it here makes the removal a decision instead of a side effect of the
      stale-foundation purge. The silver mother unified-dk-hede-nf3h62 stays.
    curator: Serhii
    date: 2026-08-17
  - id: ngc-1114137
    category: off_strike
    reason: >-
      Norway Guldafslag, 10 Ducat 1664, KM PnA20 — gold off-strike of a SILVER
      Speciedaler die (§9.3). NGC's own record states it: «Struck with Specidaler dies, KM#10.»
      Same family as dk-numista-387243 / -387448 / -421408 and ngc-1099232 above.
      Christian IV, the Speciedaler-fraction dies (KM 10 survives as nc4h12 / nc4h13 / bruun-9390). The Pn number alone would NOT justify this (§9.1) — the die
      statement in the source does. Its «Fineness» reads a value that cannot be a
      fineness, gated at parse since 2026-08-17 and preserved as
      fineness_unusable_raw; the fractional nominal is the silver die's weight
      expressed in ducats, another mark of the off-strike. The silver mother stays.
    curator: Serhii
    date: 2026-08-17
