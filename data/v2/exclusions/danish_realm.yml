      assigns its own Friedberg number (Fr 127) rather than «unlisted», i.e.
      Friedberg treats it as an independent gold type. Curator resolved the
      catalogue disagreement in favour of danskmoent. Silver mothers
      (km-223-fr-iii-1659, km-225-fr-iii-1659) KEPT.
    curator: Serhii
    date: 2026-08-03
