# Curator per-coin EXCLUSIONS — entity `sweden`.
#
# Coins the curator has decided are out-of-scope and must NOT render even in the
# `seed_unsorted` bucket — patterns / Prøvemønter, off-strikes, exonumia,
# undocumented stubs — that the rule-based §9 seed filters missed (usually
# because the SOURCE mislabelled the piece). Distinct from the other decision
# surfaces: merge_decisions RESHAPE, classification_decisions CLASSIFY, this one
# REMOVES a coin with a recorded reason.
#
# `id` is a SEED id (as in data/v2/seed/<src>/<entity>.yml). A final is dropped
# when its own unified id OR any composed_of member resolves to a listed id. The
# coin's seed / seed_unified SURVIVE (provenance / audit trail); the absorb drops
# it from `final` so it never reaches the render.
#
# category vocab: pattern | off_strike | off_nominal | exonumia |
#                 undocumented_stub | out_of_scope | duplicate_noise
#
# Consumed by scripts/maintenance/absorb_seeds_into_final_v2.py (_load_exclusions
# + the exclusion purge in process_entity). Applied on every absorb run.

entity_id: sweden
exclusions:
  # ── Swedish issues after the Kalmar Union (post-1523) — out of Denmark scope ──
  # Curator rule (Serhii, 2026-09-11): a polity's coins appear on the Denmark
  # page ONLY while the Danish king also held that polity's crown. Sweden was
  # independent from 6 June 1523 (Gustav Vasa elected; Kalmar Union dissolved),
  # so every Stockholm/Swedish-crown issue dated after 1523 is out of scope,
  # tracked by the issuing crown (ruler), not the physical mint city. The three
  # 1535 pieces bear Christian III's NAME but were struck by Gustav Vasa's
  # independent Sweden during Grevens Fejde — the Swedish crown was Vasa's, not
  # the Danish king's, so they fall under the same rule. Union-era Swedish coins
  # (Christian I 1457-1467, Hans 1497-1501) stay — the Danish king then held the
  # Swedish crown. See docs/SOURCES.md §13. (Relocated 2026-10-09 from exclusions/danish_realm.yml with its entries.)
  - id: ikmk-18235175
    category: out_of_scope
    reason: >-
      «20 Kronor» 1877, Oskar II — SWEDEN (IKMK title «Schweden: Oskar II.», mint
      Stockholm). Mis-routed to danish_realm because mint_registry maps «stockholm»
      → danish_realm UNCONDITIONALLY (intended only as the Hans-era Kalmar-Union
      pre-1521 anchor). ROOT FIX PENDING: make «stockholm» year-aware (danish_realm
      ≤1521, else out-of-scope) so post-Union Swedish Stockholm coins route to
      _unclassified — see handoff. This exclusion drops the render meanwhile.
    relocated: 'RELOCATED 2026-10-09 from exclusions/danish_realm.yml — the coin lives in the out-of-scope sweden bucket, so the exclusion filed under danish_realm never applied.'
    curator: Serhii
    date: 2026-07-17
