  - seed: lindahl-1955-flensborg-viertelwitten
    curator: Serhii 2026-11-05
    note:
      de: 'Vs.: MONETA HOLSASCIE, zwei Leoparden; Rs.: CIVITAS FLENSBVRG, Kreuz mit Kleeblatt in der Mitte<sup>[ref:lindahl-1955-flensborg-viertelwitten-340]</sup>. In der Form des Kreuzes entspricht der Typ genau den lübischen Müntzen vor und nach dem Rezeß von 1379<sup>[ref:lindahl-1955-korsform-lybske]</sup>. Lindahl nennt das Nominal «Viertelwitten», Nöbbe «Penning eller 1/4 Witten» («Pfennig oder ¼ Witten»)<sup>[ref:noebbe-1930-penning-kvart-witten]</sup>, Hauberg beschreibt den Typ als «Topenning» («Zweipfennig»)<sup>[ref:hauberg-1886-topenning]</sup>.'
      en: 'Obv.: MONETA HOLSASCIE, two leopards; rev.: CIVITAS FLENSBVRG, cross with a clover leaf in the centre<sup>[ref:lindahl-1955-flensborg-viertelwitten-340]</sup>. In the form of the cross the type corresponds closely to the Lübeck coins before and after the recess of 1379<sup>[ref:lindahl-1955-korsform-lybske]</sup>. Lindahl calls the denomination «Viertelwitten» («quarter Witten»), Nöbbe «Penning eller 1/4 Witten» («penny or ¼ Witten»)<sup>[ref:noebbe-1930-penning-kvart-witten]</sup>, Hauberg describes the type as a «Topenning» («two-penny»)<sup>[ref:hauberg-1886-topenning]</sup>.'
      uk: 'Аверс: MONETA HOLSASCIE, два леопарди; реверс: CIVITAS FLENSBVRG, хрест із листком конюшини в центрі<sup>[ref:lindahl-1955-flensborg-viertelwitten-340]</sup>. Формою хреста тип точно відповідає любецьким монетам до і після рецесу 1379 р.<sup>[ref:lindahl-1955-korsform-lybske]</sup> Lindahl називає номінал «Viertelwitten» («чверть віттена»), Nöbbe — «Penning eller 1/4 Witten» («пфеніг, або ¼ віттена»)<sup>[ref:noebbe-1930-penning-kvart-witten]</sup>, Hauberg описує цей тип як «Topenning» («двопфеніговик»)<sup>[ref:hauberg-1886-topenning]</sup>.'
      da: 'Forside: MONETA HOLSASCIE, to leoparder; bagside: CIVITAS FLENSBVRG, kors med kløverblad i midten<sup>[ref:lindahl-1955-flensborg-viertelwitten-340]</sup>. I korsets form svarer typen nøje til de lybske mønter før og efter recessen 1379<sup>[ref:lindahl-1955-korsform-lybske]</sup>. Lindahl kalder nominalen «Viertelwitten», Nöbbe «Penning eller 1/4 Witten»<sup>[ref:noebbe-1930-penning-kvart-witten]</sup>, Hauberg beskriver typen som «Topenning»<sup>[ref:hauberg-1886-topenning]</sup>.'
  - seed: lindahl-1955-flensborg-witten-leoparder
    curator: Serhii 2026-11-05
    note:
      de: 'Vs.: MONETA HOLSASCIE, die zwei südjütischen Leoparden im Schild, von sechs Bögen umgeben; Rs.: CIVITAS FLENSBVRG, Kreuz mit Kleeblatt in der Mitte, darin ein Punkt<sup>[ref:lindahl-1955-flensborg-witten-339]</sup>. In der Form des Kreuzes entspricht der Typ genau den lübischen Müntzen vor und nach dem Rezeß von 1379<sup>[ref:lindahl-1955-korsform-lybske]</sup>.'
      en: 'Obv.: MONETA HOLSASCIE, the two South Jutland leopards in a shield, surrounded by six arcs; rev.: CIVITAS FLENSBVRG, cross with a clover leaf in the centre, a dot in it<sup>[ref:lindahl-1955-flensborg-witten-339]</sup>. In the form of the cross the type corresponds closely to the Lübeck coins before and after the recess of 1379<sup>[ref:lindahl-1955-korsform-lybske]</sup>.'
      uk: 'Аверс: MONETA HOLSASCIE, два південноютландські леопарди в щиті, оточені шістьма дугами; реверс: CIVITAS FLENSBVRG, хрест із листком конюшини в центрі, у ньому крапка<sup>[ref:lindahl-1955-flensborg-witten-339]</sup>. Формою хреста тип точно відповідає любецьким монетам до і після рецесу 1379 р.<sup>[ref:lindahl-1955-korsform-lybske]</sup>'
      da: 'Forside: MONETA HOLSASCIE, de to sønderjyske leoparder i skjold, omgivet af seks buer; bagside: CIVITAS FLENSBVRG, kors med kløverblad i midten, heri et punkt<sup>[ref:lindahl-1955-flensborg-witten-339]</sup>. I korsets form svarer typen nøje til de lybske mønter før og efter recessen 1379<sup>[ref:lindahl-1955-korsform-lybske]</sup>.'
  - seed: lindahl-1955-flensborg-witten-naeldeblad
    curator: Serhii 2026-11-05
    note:
      de: 'Vs.: MONETA HOLSACI, das holsteinische Nesselblatt mit oder ohne Punkt in der Mitte; Rs.: CIVITAS FLENSBVR, Kreuz mit Ring in der Mitte, darin ein Stern<sup>[ref:lindahl-1955-flensborg-witten-371]</sup>. Der Typ entspricht dem gemeinsamen Typ, den Lübeck, Hamburg und Wismar 1379 beschlossen<sup>[ref:hauberg-1886-faelles-typ-1379]</sup>. Das Nesselblatt nennt Nöbbe das schauenburgische Zeichen<sup>[ref:noebbe-1930-naeldeblad-schauenburg]</sup>; die holsteinische Nessel, die auch auf den Hamburger Müntzen steht, konnte nach Nöbbe den Eindruck einer Hamburger Ausmüntzung wecken<sup>[ref:noebbe-1930-naeldeblad-hamborg]</sup>.'
      en: 'Obv.: MONETA HOLSACI, the Holstein nettle leaf with or without a dot in the centre; rev.: CIVITAS FLENSBVR, cross with a ring in the centre, a star in it<sup>[ref:lindahl-1955-flensborg-witten-371]</sup>. The type agrees with the common type that Lübeck, Hamburg and Wismar adopted in 1379<sup>[ref:hauberg-1886-faelles-typ-1379]</sup>. Nöbbe calls the nettle leaf the Schauenburg mark<sup>[ref:noebbe-1930-naeldeblad-schauenburg]</sup>; according to Nöbbe, the Holstein nettle, which also appears on the Hamburg coins, could give the impression of a Hamburg issue<sup>[ref:noebbe-1930-naeldeblad-hamborg]</sup>.'
      uk: "Аверс: MONETA HOLSACI, гольштейнський кропив'яний листок із крапкою в центрі або без неї; реверс: CIVITAS FLENSBVR, хрест із кільцем у центрі, у ньому зірка<sup>[ref:lindahl-1955-flensborg-witten-371]</sup>. Тип відповідає спільному типу, який Lübeck, Hamburg і Wismar ухвалили 1379 р.<sup>[ref:hauberg-1886-faelles-typ-1379]</sup> Кропив'яний листок Nöbbe називає знаком Schauenburg<sup>[ref:noebbe-1930-naeldeblad-schauenburg]</sup>; гольштейнська кропива, яка є і на гамбурзьких монетах, за Nöbbe, могла створювати враження гамбурзького карбування<sup>[ref:noebbe-1930-naeldeblad-hamborg]</sup>."
      da: 'Forside: MONETA HOLSACI, det holstenske nældeblad med eller uden punkt i midten; bagside: CIVITAS FLENSBVR, kors med ring i midten, heri en stjerne<sup>[ref:lindahl-1955-flensborg-witten-371]</sup>. Typen svarer til den fælles type, som Lübeck, Hamburg og Wismar vedtog i 1379<sup>[ref:hauberg-1886-faelles-typ-1379]</sup>. Nældebladet kalder Nöbbe det schauenburgske mærke<sup>[ref:noebbe-1930-naeldeblad-schauenburg]</sup>; den holstenske nælde, der også findes på de hamborgske mønter, kunne ifølge Nöbbe give indtryk af en hamborgsk udmøntning<sup>[ref:noebbe-1930-naeldeblad-hamborg]</sup>.'
  - seed: lindahl-1955-flensborg-dreling
    curator: Serhii 2026-11-05
    note:
      de: 'Vs.: MONETA HOLTSACIE; Rs.: CIVITAS FLENSBVRGEN; auf beiden Seiten zwei Leoparden im Schild, darüber drei oder zwei Punkte oder Ringe<sup>[ref:lindahl-1955-flensborg-dreling-427]</sup>. Der Typ entspricht ganz den lübischen Dreilingen<sup>[ref:noebbe-1930-dreiling-lybaek]</sup>. Er ist die häufigste der mittelalterlichen Müntzen Flensborgs: allein der Fund von Aarhus enthielt 119 Stück, etwa 20 Stempel lassen sich nachweisen<sup>[ref:noebbe-1930-dreiling-almindeligste]</sup>. Mit ihm bricht die kurze Reihe der mittelalterlichen Müntzen Flensborgs ab<sup>[ref:noebbe-1930-raekke-afbrydes]</sup>.'
      en: 'Obv.: MONETA HOLTSACIE; rev.: CIVITAS FLENSBVRGEN; on both sides two leopards in a shield, above it three or two dots or rings<sup>[ref:lindahl-1955-flensborg-dreling-427]</sup>. The type corresponds entirely to the Lübeck Dreilinge<sup>[ref:noebbe-1930-dreiling-lybaek]</sup>. It is the commonest of Flensborg’s medieval coins: the Aarhus hoard alone contained 119 pieces, and about 20 dies can be identified<sup>[ref:noebbe-1930-dreiling-almindeligste]</sup>. With it the short series of Flensborg’s medieval coins breaks off<sup>[ref:noebbe-1930-raekke-afbrydes]</sup>.'
      uk: 'Аверс: MONETA HOLTSACIE; реверс: CIVITAS FLENSBVRGEN; на обох боках два леопарди в щиті, над ним три або дві крапки чи кільця<sup>[ref:lindahl-1955-flensborg-dreling-427]</sup>. Тип цілком подібний до любецьких дрейлінгів<sup>[ref:noebbe-1930-dreiling-lybaek]</sup>. Це найпоширеніша із середньовічних монет Flensborg: лише в скарбі з Aarhus виявлено 119 штук, відомо близько 20 штемпелів<sup>[ref:noebbe-1930-dreiling-almindeligste]</sup>. Нею уривається короткий ряд середньовічних монет Flensborg<sup>[ref:noebbe-1930-raekke-afbrydes]</sup>.'
      da: 'Forside: MONETA HOLTSACIE; bagside: CIVITAS FLENSBVRGEN; på begge sider to leoparder i skjold, hvorover tre eller to punkter eller ringe<sup>[ref:lindahl-1955-flensborg-dreling-427]</sup>. Typen svarer ganske til de lybske dreilinge<sup>[ref:noebbe-1930-dreiling-lybaek]</sup>. Den er den almindeligste af Flensborgs middelaldermønter: alene Aarhusfundet indeholdt 119 stykker, og omtrent 20 stempler kan påvises<sup>[ref:noebbe-1930-dreiling-almindeligste]</sup>. Med den afbrydes den korte række af Flensborgs middelaldermønter<sup>[ref:noebbe-1930-raekke-afbrydes]</sup>.'
