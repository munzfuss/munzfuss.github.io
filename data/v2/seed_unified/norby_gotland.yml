      - value: Christian II
        source: bruun
        kind: suspect
        reason:
          de: 'Der Katalog Bruun nennt in der Zeile des Loses «Christian II.» als Münzherrn. Søren Norby, Lehnsmann Christians II. auf Gotland, schlug die Visbyer Münzen jedoch «med eget navn og våbenskjold»
            (dt.: «mit eigenem Namen und Wappen»; danskmoent.dk, «Søren Norby»), nicht im Namen des Königs.'
          en: "The Bruun catalogue names «Christian II.» as the issuer in the lot line. Søren Norby, Christian II's fief-holder on Gotland, struck the Visby coins «med eget navn og våbenskjold» (transl.:
            «with his own name and arms»; danskmoent.dk, «Søren Norby»), not in the king's name."
          uk: 'Каталог Bruun у рядку лота називає емітентом «Christian II.». Проте Søren Norby, ленсман Christian II на Готланді, карбував монети у Visby «med eget navn og våbenskjold» (перекл.: «з власним
            іменем і гербом»; danskmoent.dk, «Søren Norby»), а не від імені короля.'
          da: Bruun-kataloget nævner i lotlinjen «Christian II.» som møntherre. Søren Norby, Christian 2.s lensmand på Gotland, slog dog Visby-mønterne med eget navn og våbenskjold (danskmoent.dk, 
            «Søren Norby»), ikke i kongens navn.
