      - value: Landskrona
        source: kmk
        kind: erroneous
        reason:
          de: Falsche Münzstätte. Die Königliche Münz- und Medaillensammlung verzeichnet das Stück (Galster 144) unter «Landskrona», doch die Rückseite zeigt auf dem Foto das Agnus Dei des Galster 
            144, den danskmoent (Galster 144) Visby zuweist. Der Skilling Søren Norbys aus Landskrona (Galster 80) trägt auf der Vorderseite das dänische Wappen, auf der Rückseite Norbys Wappen.
          en: Wrong mint. The Royal Coin Cabinet records the piece (Galster 144) under «Landskrona», but the photo shows the Agnus Dei reverse of Galster 144, which danskmoent (Galster 144) gives to 
            Visby. Søren Norby's Skilling of Landskrona (Galster 80) has the Danish arms on the obverse and Norby's arms on the reverse.
          uk: Помилкове місце карбування. Королівський монетний кабінет вносить екземпляр (Galster 144) під «Landskrona», але на фото на реверсі Agnus Dei — ознака Galster 144, який danskmoent 
            (Galster 144) відносить до Visby. Skilling Søren Norby з Landskrona (Galster 80) має на аверсі герб Данії, на реверсі — герб Norby.
          da: Forkert møntsted. Den Kongelige Mønt- og Medaillesamling fører stykket (Galster 144) under «Landskrona», men fotoet viser bagsidens agnus dei fra Galster 144, som danskmoent (Galster 
            144) henfører til Visby. Søren Norbys skilling fra Landskrona (Galster 80) har Danmarks våben på forsiden og Norbys våben på bagsiden.
