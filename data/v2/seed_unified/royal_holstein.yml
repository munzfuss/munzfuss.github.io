          en: NGC gives «ca1501-10», a dating within the attribution to Frederik I (Hauberg, Jørgensen, Schou). Sømod 2002 assigns the type to Christian I, hence 1460–1481. The Travemünde hoard 
            (latest coin 1515) does not separate the two datings.
          uk: NGC подає «ca1501-10» — датування в межах атрибуції Фредерікові I (Hauberg, Jørgensen, Schou). За Sømod 2002 тип належить Christian I, звідси 1460–1481. Скарб із Травемюнде (найпізніша 
            монета 1515 р.) ці два датування не розрізняє.
          da: NGC angiver «ca1501-10», en datering inden for henførelsen til Frederik I (Hauberg, Jørgensen, Schou). Ifølge Sømod 2002 tilhører typen Christian I, deraf 1460–1481. Fundet ved 
            Travemünde (yngste mønt 1515) adskiller ikke de to dateringer.
