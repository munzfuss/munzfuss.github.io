    ruler_alts:
      - value: Friedrich I
        source: ngc
        kind: suspect
        reason:
          de: 'Umstrittene Zuweisung. NGC (MB 5) nennt «Friedrich I» und «ca1501-10», wie zuvor Hauberg, Jørgensen und Schou, die den Typ Friedrich I. zuschrieben. Sømod 2002 weist ihn Christian I. (1460–1481)
            zu: Der geteilte Schild Holstein/Oldenburg zeige dessen mütterliches und väterliches Wappen, und die Stücke liegen im Fund von Travemünde, dessen jüngste Münze von 1515 ist. Dieselben Wappen
            führte aber auch Herzog Friedrich: Seine Husumer Münzen von 1514 zeigen «Sct. Andreas med Oldenborgs våben» (dt.: «St. Andreas mit dem Oldenburger Wappen»; Galster 115–116), sein herzoglicher
            Schild das holsteinische Nesselblatt mit den Oldenburger Balken im Herzschild (Denar til daler 2018, S. 477). Schild und Fund lassen sich daher mit beiden Zuweisungen vereinbaren.'
          en: 'Disputed attribution. NGC (MB 5) gives «Friedrich I» and «ca1501-10», as did Hauberg, Jørgensen and Schou, who placed the type under Frederik I. Sømod 2002 assigns it to Christian I (1460–1481):
            the halved Holstein/Oldenburg shield shows his maternal and paternal arms, and the pieces occur in the Travemünde hoard, whose latest coin is dated 1515. Duke Frederik bore the same arms, however:
            his Husum coins of 1514 show «Sct. Andreas med Oldenborgs våben» (transl.: «St Andrew with the arms of Oldenburg»; Galster 115–116), and his ducal shield the Holstein nettle leaf with the Oldenburg
            bars in the centre (Denar til daler 2018, p. 477). The shield and the hoard can therefore be reconciled with either attribution.'
          uk: 'Спірна атрибуція. NGC (MB 5) подає «Friedrich I» і «ca1501-10», як і Hauberg, Jørgensen та Schou, що відносили тип до Фредеріка I. Sømod 2002 відносить його до Christian I (1460–1481): розділений
            щит Гольштейну й Ольденбурга — це материнський і батьківський герби Christian I, а монети трапляються у скарбі з Травемюнде, найпізніша монета якого датована 1515 р. Проте ті самі герби мав
            і герцог Фредерік: його монети з Husum 1514 р. показують «Sct. Andreas med Oldenborgs våben» (перекл.: «св. Андрій з гербом Ольденбурга»; Galster 115–116), а його герцогський щит — гольштейнський
            лист кропиви з ольденбурзькими смугами в центральному щитку (Denar til daler 2018, с. 477). Тож щит і скарб можна вважати сумісними з обома атрибуціями.'
          da: 'Omstridt henførelse. NGC (MB 5) angiver «Friedrich I» og «ca1501-10», som Hauberg, Jørgensen og Schou, der henførte typen til Frederik I. Sømod 2002 henfører den til Christian I (1460–1481):
            det delte skjold med Holstens og Oldenborgs våben er hans mødrene og fædrene våben, og mønterne forekommer i fundet ved Travemünde, hvis yngste mønt er fra 1515. Hertug Frederik førte dog de
            samme våben: hans Husum-mønter fra 1514 viser «Sct. Andreas med Oldenborgs våben» (Galster 115–116), og hans hertugelige skjold Holstens nældeblad med Oldenborgs bjælker i hjerteskjoldet (Denar
            til daler 2018, s. 477). Skjoldet og fundet kan derfor forenes med begge henførelser.'
