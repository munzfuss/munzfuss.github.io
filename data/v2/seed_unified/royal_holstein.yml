          en: "The Hede number does not belong to this coin.\n[b]danskmoent.dk (Hede, Christian 8.)[/b], overview: [i]«9AB 6, 7 3 Rigsbankskilling / 3 R.B.S. Sølv 1842 Altona FF»[/i] (transl.: «… 3 Rigsbankskilling
