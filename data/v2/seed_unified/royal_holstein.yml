            (RR), Altona; mint mark: orb and FF (Hede 8C, Schou 6, Sieg 8)»)."
          uk: "Номер Hede не належить цій монеті.\n[b]danskmoent.dk (Hede, Christian 8.)[/b], огляд: [i]«9AB 6, 7 3 Rigsbankskilling / 3 R.B.S. Sølv 1842 Altona FF»[/i] (перекл.: «… 3 Rigsbankskilling /
            3 R.B.S. срібло 1842 Altona FF»).\n[b]danskmoent.dk (Hede 8)[/b], 4 Rigsbankskilling: [i]«C) 1842 (RR), Altona; møntmærke: rigsæble og FF (Hede 8C, Schou 6, Sieg 8)»[/i] (перекл.: «C) 1842 (RR),
            Altona; монетний знак: держава і FF (Hede 8C, Schou 6, Sieg 8)»)."
          da: "Hede-nummeret hører ikke til denne mønt.\n[b]danskmoent.dk (Hede, Christian 8.)[/b], oversigt: [i]«9AB 6, 7 3 Rigsbankskilling / 3 R.B.S. Sølv 1842 Altona FF»[/i].\n[b]danskmoent.dk (Hede
