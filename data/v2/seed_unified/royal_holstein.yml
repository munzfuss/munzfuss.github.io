      da: 'Kun oversigtsrækken hos c7hede.htm dokumenterer denne post; Hede-dybdesiden mangler på danskmoent.dk. Vægt og finhed er ikke angivet der; de ville skulle hentes fra de trykte Hede 1971 og Galster
        1965. Bemærkning i indekset: «22A: Kølle i venstre hånd 22B: Kølle i højre hånd. Wilcke III s.189; Wilcke IV s.46 ; Nat.Arb. 1959 s.112»'
