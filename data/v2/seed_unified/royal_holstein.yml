        reason:
          de: Falsche Münzstätte. Bruun Part V (Los 14206, S. 77) druckt «Copenhagen Mint» («Münzstätte København»), doch Hede 25 (danskmoent) nennt «1 kurantdaler, Altona», Bruun Part II (Los 13248) 
            «Altona/Poppenbüttel Mint» («Münzstätte Altona/Poppenbüttel»), und L. E. Bruuns Mønt- og Medaillesamling (1928, S. 239) führt genau dieses Stück, Bruun 7892, unter «1788 ALTONA».
          en: Wrong mint. Bruun Part V (lot 14206, p. 77) prints «Copenhagen Mint», but Hede 25 (danskmoent) gives «1 kurantdaler, Altona», Bruun Part II (lot 13248) «Altona/Poppenbüttel Mint», and L.
            E. Bruuns Mønt- og Medaillesamling (1928, p. 239) lists this very piece, Bruun 7892, under «1788 ALTONA».
          uk: Помилкове місце карбування. Bruun Part V (лот 14206, с. 77) друкує «Copenhagen Mint» («монетний двір København»), але Hede 25 (danskmoent) подає «1 kurantdaler, Altona», Bruun Part II 
            (лот 13248) — «Altona/Poppenbüttel Mint» («монетний двір Altona/Poppenbüttel»), а L. E. Bruuns Mønt- og Medaillesamling (1928, с. 239) наводить саме цей екземпляр, Bruun 7892, під 
            заголовком «1788 ALTONA».
          da: Forkert møntsted. Bruun Part V (lot 14206, s. 77) trykker «Copenhagen Mint» («møntstedet København»), men Hede 25 (danskmoent) angiver «1 kurantdaler, Altona», Bruun Part II (lot 13248) 
            «Altona/Poppenbüttel Mint» («møntstedet Altona/Poppenbüttel»), og L. E. Bruuns Mønt- og Medaillesamling (1928, s. 239) fører netop dette stykke, Bruun 7892, under «1788 ALTONA».
