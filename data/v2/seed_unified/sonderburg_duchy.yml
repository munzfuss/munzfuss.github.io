    note:
      de: 'Rheinischer Goldgulden, kein Dukat. Müntzmeister Johan Lilliendahl, in zwei Stempelvarianten. Vier gewogene Stücke: 3,19 g (Landesbibliothek Schleswig-Holstein, Slg. Chr. Lange), 3,16 g (København,
        doppelt gekarbt) und 3,08 g (Bode-Museum Berlin), 3,22 g (Künker 176/5749). Zwei weitere Stücke, je eines beider Varianten, lagen in einem um 1633 verborgenen Goldgulden-Funde in Mitteldeutschland
        und kamen 1912 bei Kube in Berlin zur Auction. Um 1633 karbte Lilliendahl den Typus heimlich und unterlöthig nach.'
      en: "A Rhenish Goldgulden, not a ducat. Mintmaster Johan Lilliendahl, in two die variants. Four weighed specimens: 3.19 g (Schleswig-Holstein Landesbibliothek, Chr. Lange's collection), 3.16 g (Copenhagen,
        double-struck) and 3.08 g (Bode-Museum Berlin), 3.22 g (Künker 176/5749). Two further pieces, one of each variant, lay in a Goldgulden hoard in central Germany deposited c. 1633 and were sold at
        Kube, Berlin, in 1912. Around 1633 Lilliendahl struck the type again clandestinely and below standard."
      uk: 'Рейнський голдгульден, не дукат. Мінцмейстер Johan Lilliendahl, у двох штемпельних варіантах. Чотири зважені екземпляри: 3,19 г (Ландесбібліотека Шлезвіг-Гольштейну, збірка Chr. Lange), 3,16
        г (Копенгаген, подвійне карбування) і 3,08 г (Bode-Museum, Берлін), 3,22 г (Künker 176/5749). Ще два примірники, по одному кожного варіанта, лежали в скарбі голдгульденів у центральній Німеччині,
        закладеному близько 1633 р., і пішли з аукціону Kube в Берліні 1912 р. Близько 1633 р. Lilliendahl потайки перекарбував цей тип у зниженій пробі.'
    verification_note:
      de: Kein Korn ist für diese Prägung überliefert; angesetzt ist das Korn des Fußes selbst, 18½ Karat nach dem Wormser Reichsabschied 1495.
      en: No fineness is recorded for this coinage; the figure shown is the standard's own 18½ carats per the Worms Reichsabschied of 1495.
