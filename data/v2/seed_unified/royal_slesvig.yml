          da: Numista angiver samme par 6,556 g / 0,75 som Hede 15 og henviser til Hede 15; ifølge Galster (artiklen om Flensborg mønt, note 47) er det Hedes formel, beregnet ud fra den traditionelle 
            vægt for den kølnske mark (233,855 g).
    weight_rough_g:
      - value: 6.556
        source: hede
        template:
          de: 'Wahrscheinlich kein Wägebefund: 6,556 g sind genau das Doppelte der 3,278 g des einfachen Gulden (Hede 14), die der Sollgröße des Standards von 71⅓ Stück aus einer Cöllnischen Marck entsprechen.
            Daß es das Gewicht eines gewogenen Stücks ist, zeigen die vorliegenden Angaben nicht.'
          en: 'Probably not a weighing: 6.556 g is exactly twice the 3.278 g of the single gulden (Hede 14), which equals the target weight of the standard of 71⅓ pieces to a Cöllnische Marck. That it is
            the weight of a weighed specimen is not shown by the available data.'
          uk: 'Імовірно, не результат зважування: 6,556 г — рівно вдвічі більше за 3,278 г одинарного гульдена (Hede 14), що дорівнює цільовій вазі стандарту 71⅓ штуки з Кельнської марки. Що це вага зваженого
            екземпляра, наявні дані не показують.'
          da: 'Formentlig ikke en vejning: 6,556 g er netop det dobbelte af de 3,278 g for den enkelte gylden (Hede 14), som svarer til målvægten for standarden 71⅓ stykker af en Cöllnische Marck. At det
            er vægten af et vejet eksemplar, viser de foreliggende data ikke.'
