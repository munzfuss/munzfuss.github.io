  - id: c-05b359a2
    class_id: c-05b359a2
    label: unified-dk-hede-c3h14
    fuss: seed_unsorted
    phase: hede
    kind: kurant
    nominal: 1 Goldgulden
    year_first: 1546
    year_last: 1546
    year_label: '1546'
    ruler: Christian III
    mint: Flensburg
    catalog:
      hede: '14'
      hede_volume: c3h
      schou: '2'
      sieg: '51'
    metal: gold
    metal_verified: true
    fineness_verified: true
    weight_rough_verified: true
    mint_verified: true
    verified: false
    fineness:
      - value: 0.75
        source: hede
        template:
          de: 'Teil von Hedes Formel: nach Galster (Aufsatz über die Münzstätte Flensborg, Anm. 47) hat Hede, von der traditionellen Kölner Mark (233,855 g) ausgehend, die Formeln 3,278 g–0,750–2,458 g
            und 6,556 g–0,750–4,916 g.'
          en: "Part of Hede's formula: according to Galster (article on the Flensborg mint, note 47), Hede, starting from the traditional weight of the Cologne mark (233.855 g), has the formulas 3.278 g–0.750–2.458
            g and 6.556 g–0.750–4.916 g."
          uk: 'Частина формули Hede: за Galster (стаття про монетний двір у Flensborg, примітка 47), Hede, виходячи з традиційної ваги кельнської марки (233,855 г), має формули 3,278 г–0,750–2,458 г і 6,556
            г–0,750–4,916 г.'
          da: 'Del af Hedes formel: ifølge Galster (artiklen om Flensborg mønt, note 47) har Hede, der går ud fra den traditionelle vægt for den kølnske mark (233,855 g), formlerne 3,278 g–0,750–2,458 g
            og 6,556 g–0,750–4,916 g.'
    weight_rough_g:
      - value: 3.278
        source: hede
        template:
          de: 'Wahrscheinlich kein Wägebefund: 3,278 g entsprechen der Sollgröße des Standards von 71⅓ Stück aus einer Cöllnischen Marck (233,856 / 71⅓ ≈ 3,278). Daß es das Gewicht eines gewogenen Stücks
            ist, zeigen die vorliegenden Angaben nicht.'
          en: 'Probably not a weighing: 3.278 g equals the target weight of the standard of 71⅓ pieces to a Cöllnische Marck (233.856 / 71⅓ ≈ 3.278). That it is the weight of a weighed specimen is not shown
            by the available data.'
          uk: 'Імовірно, не результат зважування: 3,278 г дорівнює цільовій вазі стандарту 71⅓ штуки з Кельнської марки (233,856 / 71⅓ ≈ 3,278). Що це вага зваженого екземпляра, наявні дані не показують.'
          da: 'Formentlig ikke en vejning: 3,278 g svarer til målvægten for standarden 71⅓ stykker af en Cöllnische Marck (233,856 / 71⅓ ≈ 3,278). At det er vægten af et vejet eksemplar, viser de foreliggende
            data ikke.'
    sources:
      - type: literature
        url: https://www.danskmoent.dk/chr/c3h15.htm
        ref: danskmoent.dk (Hede c3h14)
    issuing_entity: royal_slesvig
    composed_of:
      - dk-hede-c3h14
