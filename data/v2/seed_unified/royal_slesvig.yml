    year_alts:
      - value: '1506'
        source: ikmk
        kind: suspect
        reason:
          de: Das IKMK datiert dieses Stück nach Dannenberg 1859 «um 1506». Die Müntze zu Schleswig/Gottorp, die die Umschrift nennt, richtete Herzog Frederik erst um 1522 ein (Galster 1934), den 
            rheinischen Gulden führt in seiner Prägung erst die Møntordning 1524 ein, sein erster Gulden ist Malmø 1527; herzogliches Gold kennen Galster und Wilcke nicht. Der Fund von Chörau, aus dem
            das Stück stammt, schließt nach 1546 und stützt das Jahr nicht.
          en: The IKMK dates this piece «c. 1506» after Dannenberg 1859. The Schleswig/Gottorp mint named in the legend was set up by Duke Frederik only around 1522 (Galster 1934), the Rhenish gulden 
            enters his coinage only with the Møntordning of 1524, his first gulden is Malmø 1527; Galster and Wilcke know no ducal gold. The Chörau hoard the piece comes from closes after 1546 and 
            does not support the year.
          uk: IKMK датує цей примірник «близько 1506» за Dannenberg 1859. Двір у Schleswig/Gottorp, який називає легенда, герцог Frederik влаштував лише близько 1522 р. (Galster 1934), рейнський 
            гульден у його карбуванні запроваджує лише Møntordning 1524, перший його гульден — Malmø 1527; герцогського золота Galster і Wilcke не знають. Скарб Chörau, з якого походить примірник, 
            закривається після 1546 р. і року не підтверджує.
          da: IKMK daterer dette stykke «o. 1506» efter Dannenberg 1859. Mønten på Schleswig/Gottorp, som omskriften nævner, indrettede hertug Frederik først omkring 1522 (Galster 1934), den rhinske 
            gylden indføres i hans udmøntning først med møntordningen af 1524, hans første gylden er Malmø 1527; hertugeligt guld kender Galster og Wilcke ikke. Chörau-fundet, som stykket stammer fra,
            slutter efter 1546 og støtter ikke året.
