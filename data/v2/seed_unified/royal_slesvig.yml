      - type: literature
        url: https://www.danskmoent.dk/pdf2/Wilcke%207-4.pdf
        ref: 'Wilcke 1950, Kap. 4, S. 282 — Bestallungsbrief Christians III. vom 22. Januar 1547: «Guldgylden skulde slaas efter Kurfyrsternes Gylden i Værd, Halt, Schrot og Korn»'
      - type: literature
        url: https://numismaster.com/MC_167747
        ref: NumisMaster
    verification_note:
      de: 'Weder Gewicht noch Korn dieser Müntze sind überliefert; angesetzt sind die Parameter der Norm — 71⅓ Stück aus der rauhen Cöllnischen Marck zu 18½ Karat (Norm der Kurfürsten; Wormser Reichsabschied
        1495), die der Bestallungsbrief von 1547 vorschreibt. Die Müntzstätte nennen weder die Müntze noch der Katalog; Flensborg ist erschlossen: Der Bestallungsbrief vom 22. Januar 1547 bestellt Jørgen
        Kock, in den Herzogtümern zu müntzen, «binnen unser Stadt Flensburgk», und schreibt Guldgylden vor.'
      en: "Neither weight nor fineness of this coin is recorded; the figures shown are those of the norm — 71⅓ pieces from the rough Cologne mark at 18½ carats (the electors' norm; Worms Reichsabschied
        of 1495), which the 1547 letter of appointment prescribes. Neither the coin nor the catalogue names the mint; Flensborg is inferred: the letter of appointment of 22 January 1547 engages Jørgen Kock
        to coin in the duchies «binnen unser Stadt Flensburgk» («within our town of Flensborg») and prescribes Guldgylden."
      uk: 'Ні вага, ні проба цієї монети не засвідчені; наведено параметри норми — 71⅓ штуки з повної кельнської марки за 18½ карата (норма курфюрстів; Вормський Reichsabschied 1495), яку приписує лист
        1547 р. Ні монета, ні каталог двору не називають; Flensborg виведено: лист про призначення від 22 січня 1547 р. доручає Jørgen Kock карбувати в герцогствах «binnen unser Stadt Flensburgk» («у нашому
        місті Flensborg») і приписує Guldgylden.'
      da: 'Hverken vægt eller lødighed for denne mønt er overleveret; de viste tal er normens — 71⅓ stykker af den rå Cöllnische Marck ved 18½ karat (kurfyrsternes norm; rigsafskeden i Worms 1495), som
        bestallingsbrevet af 1547 foreskriver. Hverken mønten eller kataloget nævner møntstedet; Flensborg er udledt: bestallingsbrevet af 22. januar 1547 beskikker Jørgen Kock til at mønte i hertugdømmerne
        «binnen unser Stadt Flensburgk» («i vor by Flensborg») og foreskriver guldgylden.'
