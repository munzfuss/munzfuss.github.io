    year_note:
      de: "Die Datierung ist aus den Datierungen der Quellen zusammengestellt.\n[b]danskmoent.dk (Galster 1)[/b]: [i]«slået i Ribe ca. 1380»[/i] («um 1380 in Ribe geschlagen»).\n[b]Ernst 1948 (NNÅ 1948,
        S. 9–15)[/b] setzt den Beginn vor die Sternwitten der wendischen Städte von 1379: [i]«Udmøntningen skulde da mest sandsynligt kunne dateres til Aarene 1373 eller kort derefter til 1377»[/i] («die
        Ausmüntzung ließe sich dann am wahrscheinlichsten auf das Jahr 1373 oder kurz danach bis 1377 datieren»).\n[b]Lindahl 1955 (NNÅ 1955, S. 76)[/b] gibt [i]«1373/77—96»[/i].\nDie Grenze 1396 folgt
        [b]Galster 1947 («Ribe Mønt», S. 605–606, nach Ernst 1948)[/b]: [i]«Udmøntningen maa rimeligvis være standset før 1396»[/i] («die Ausmüntzung ist vermutlich vor 1396 eingestellt worden»).\n[b]Märcher
        2018 (in: Horsnæs, Moesgaard, Märcher, Denar til daler, Kap. 6, S. 372)[/b]: [i]«En datering af udmøntningen til ca. 1376-1381 synes på nuværende tidspunkt at være det mest oplagte»[/i] («eine Datierung
        der Ausmüntzung auf ca. 1376–1381 scheint derzeit am naheliegendsten»); eine Fortsetzung in die 1380er–1390er Jahre hält er für [i]«mindre sandsynlig»[/i] («weniger wahrscheinlich»).\nDaraus läßt
        sich der Zeitraum 1373–1381 ableiten: der Beginn nach Ernst, das Ende nach Märcher."
      en: "The dating is compiled from the datings of the sources.\n[b]danskmoent.dk (Galster 1)[/b]: [i]«slået i Ribe ca. 1380»[/i] («struck in Ribe c. 1380»).\n[b]Ernst 1948 (NNÅ 1948, pp. 9–15)[/b] places
        the start before the Sternwitten of the Wendish towns of 1379: [i]«Udmøntningen skulde da mest sandsynligt kunne dateres til Aarene 1373 eller kort derefter til 1377»[/i] («the coinage could then
        most probably be dated to the year 1373 or shortly after, to 1377»).\n[b]Lindahl 1955 (NNÅ 1955, p. 76)[/b] gives [i]«1373/77—96»[/i].\nThe limit 1396 follows [b]Galster 1947 («Ribe Mønt», pp. 605–606,
        after Ernst 1948)[/b]: [i]«Udmøntningen maa rimeligvis være standset før 1396»[/i] («the coinage must probably have stopped before 1396»).\n[b]Märcher 2018 (in: Horsnæs, Moesgaard, Märcher, Denar
        til daler, ch. 6, p. 372)[/b]: [i]«En datering af udmøntningen til ca. 1376-1381 synes på nuværende tidspunkt at være det mest oplagte»[/i] («a dating of the coinage to c. 1376–1381 currently seems
        the most obvious»); he regards a continuation into the 1380s–1390s as [i]«mindre sandsynlig»[/i] («less likely»).\nFrom these the period 1373–1381 can be derived: the start after Ernst, the end
        after Märcher."
      uk: "Датування зведене з датувань джерел.\n[b]danskmoent.dk (Galster 1)[/b]: [i]«slået i Ribe ca. 1380»[/i] («карбований у Ribe близько 1380»).\n[b]Ernst 1948 (NNÅ 1948, с. 9–15)[/b] ставить початок
        перед «Sternwitten» вендських міст 1379 р.: [i]«Udmøntningen skulde da mest sandsynligt kunne dateres til Aarene 1373 eller kort derefter til 1377»[/i] («карбування тоді найімовірніше можна датувати
        1373 роком або невдовзі після нього, до 1377»).\n[b]Lindahl 1955 (NNÅ 1955, с. 76)[/b] подає [i]«1373/77—96»[/i].\nМежа 1396 походить від [b]Galster 1947 («Ribe Mønt», с. 605–606, за Ernst 1948)[/b]:
        [i]«Udmøntningen maa rimeligvis være standset før 1396»[/i] («карбування, ймовірно, припинилося до 1396»).\n[b]Märcher 2018 (у: Horsnæs, Moesgaard, Märcher, Denar til daler, розд. 6, с. 372)[/b]:
        [i]«En datering af udmøntningen til ca. 1376-1381 synes på nuværende tidspunkt at være det mest oplagte»[/i] («датування карбування приблизно 1376–1381 роками наразі видається найочевиднішим»);
        продовження карбування в 1380–1390-х роках він вважає [i]«mindre sandsynlig»[/i] («менш імовірним»).\nЗвідси можна вивести період 1373–1381: початок за Ernst, кінець за Märcher."
      da: "Dateringen er sammenstillet af kildernes dateringer.\n[b]danskmoent.dk (Galster 1)[/b]: [i]«slået i Ribe ca. 1380»[/i].\n[b]Ernst 1948 (NNÅ 1948, s. 9–15)[/b] lægger begyndelsen før de vendiske
        stæders «Sternwitten» fra 1379: [i]«Udmøntningen skulde da mest sandsynligt kunne dateres til Aarene 1373 eller kort derefter til 1377»[/i].\n[b]Lindahl 1955 (NNÅ 1955, s. 76)[/b] angiver [i]«1373/77—96»[/i].\n\
        Grænsen 1396 følger [b]Galster 1947 («Ribe Mønt», s. 605–606, efter Ernst 1948)[/b]: [i]«Udmøntningen maa rimeligvis være standset før 1396»[/i].\n[b]Märcher 2018 (i: Horsnæs, Moesgaard, Märcher,
        Denar til daler, kap. 6, s. 372)[/b]: [i]«En datering af udmøntningen til ca. 1376-1381 synes på nuværende tidspunkt at være det mest oplagte»[/i]; en fortsættelse ind i 1380’erne–1390’erne anser
        han for [i]«mindre sandsynlig»[/i].\nHeraf kan perioden 1373–1381 udledes: begyndelsen efter Ernst, slutningen efter Märcher."
