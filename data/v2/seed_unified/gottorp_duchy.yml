          de: Der Datensatz des Nationalmuseums (KMM) nennt «Frederik 3». König Friedrich III. regierte erst ab 1648 (Huldigung am 6. Juli 1648). Das Stück trägt eine Nummer aus Langes Katalog der 
            schleswig-holsteinischen Münzen; der regierende Friedrich jener Jahre war Herzog Friedrich III. von Gottorp (1616–1659).
          en: The National Museum record (KMM) names «Frederik 3». King Frederik III reigned only from 1648 (homage on 6 July 1648). The piece carries a number from Lange's catalogue of 
            Schleswig-Holstein coins; the reigning Frederik of those years was Duke Frederik III of Gottorp (1616–1659).
          uk: Запис Національного музею (KMM) називає «Frederik 3». Король Frederik III правив лише з 1648 р. (присяга 6 липня 1648 р.). Примірник має номер із каталогу Lange монет Шлезвіг-Гольштейну;
            Фредеріком, що правив у ті роки, був герцог Frederik III Gottorp (1616–1659).
          da: Nationalmuseets post (KMM) nævner «Frederik 3». Kong Frederik III regerede først fra 1648 (hyldning 6. juli 1648). Stykket bærer et nummer fra Langes katalog over slesvig-holstenske 
            mønter; den regerende Frederik i disse år var hertug Frederik III af Gottorp (1616–1659).
