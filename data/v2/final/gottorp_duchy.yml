          1998 på auktion i Osnabruck»
      - type: literature
        url: https://numismaster.com/MC_99477
        ref: NumisMaster
    note:
      de: 'Brustbild Friedrichs III. nach rechts im Innenkreis / Wappen unter drei Helmen, Jahreszahl in der Umschrift. NGC/NumisMaster geben für diesen Goldgulden irrtümlich das Schablonengewicht und das
        Schablonenkorn des Dukaten an (3,5 g, .986). Unicum: ein einziges Stück bekannt, 1998 auf einer Auktion in Osnabrück für das Kgl. Müntzkabinett Kopenhagen erworben. Ein Gewicht ist in keiner Quelle
        veröffentlicht.'
      en: 'Bust of Friedrich III right in an inner circle / arms topped by three helmets, date in the legend. NGC/NumisMaster wrongly give this Goldgulden the template weight and fineness of the ducat (3.5
        g, .986). Unique: one specimen known, acquired at auction in Osnabrück in spring 1998 for the Royal Coin Cabinet, Copenhagen. No weight is published in any source.'
      uk: 'Погруддя Friedrich III праворуч у внутрішньому колі / герб під трьома шоломами, дата в легенді. NGC/NumisMaster помилково подає для цього голдгульдена шаблонні вагу і пробу дуката (3,5 г, .986).
        Унікальний: відомий один екземпляр, придбаний Королівським монетним кабінетом у Копенгагені на аукціоні в Оснабрюці навесні 1998 р. Ваги в жодному джерелі не опубліковано.'
      da: 'Brystbillede af Frederik 3. mod højre i inderkreds / våben under tre hjelme, årstal i omskriften. NGC/NumisMaster angiver fejlagtigt dukatens skabelonvægt og -lødighed for denne guldgylden (3,5
        g, .986). Unik: kun ét eksemplar kendes, købt på auktion i Osnabrück i foråret 1998 til Den Kgl. Mønt- og Medaillesamling, København. Vægten er ikke offentliggjort i nogen kilde.'
