      en: 1/16 Thaler · Friedrich III, Duke of Schleswig-Holstein-Gottorp, 1617–1619 · Burg auf Fehmarn mint under mintmaster Samuel Timpf (1617–1620), Kipper-period sub-emission far below the 
        Reichsmüntzfuß standard. Die-variants Lange 339b (1618) and 339c (1619) documented under the KM#46 type; further sub-dies with legend variations (HOL/HO, HER/HAER, SCHL/SLES, etc.) flagged 
        «cf. Lange 339 B/C» — see the IKMK specimen corpus.
      uk: 1/16 Thaler · Фредерік III (Гольштейн-Ґотторп), 1617–1619 · монетний двір Burg auf Fehmarn під монетмайстром Samuel Timpf (1617–1620), Kipper-періоду розмінна емісія значно нижче 
        Reichsmüntzfuß-стандарту. Задокументовані штемпелі Lange 339b (1618) і 339c (1619) під типом KM#46; додаткові підштемпелі з варіаціями легенди (HOL/HO, HER/HAER, SCHL/SLES тощо) ведуться як 
        «vgl. Lange 339 B/C» — див. корпус IKMK.
