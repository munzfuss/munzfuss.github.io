    inscription_obv: MO ADOLPHI ABB WERDIN ET HELMSTAED
    inscription_rev: SANCTVS [L]VDGE-RVS EPISCOP - 16-67
    note:
      de: Es handelt sich um einen Halbthaler-Abschlag der Thalerstempel, die für den Schauthaler auf den Amtsantritt Adolph IV. Borkens 1667 verwendet wurden. Wegen des fehlenden Müntzmeisterzeichens
        ist der Prägeort bislang nicht genau zu bestimmen.
      en: This is a half-Thaler off-strike from the Thaler dies used for the show-Thaler on the accession of Adolph IV Borken in 1667. Owing to the missing mintmaster's mark, the place of minting 
        cannot yet be precisely determined.
      uk: Це напівталеровий відбиток талеровими штемпелями, використаними для показового Thaler на вступ на посаду Adolph IV Borken 1667 року. Через відсутність знака монетника місце карбування досі 
        точно не встановлено.
    verification_note: *id001
