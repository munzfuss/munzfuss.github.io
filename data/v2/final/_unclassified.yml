      uk: Konventionsthaler. Anna Amalia (Wolfenbüttel 1739 – Weimar 1807) була донькою Karl I von Braunschweig. 1756 року вона вийшла заміж за герцога Ernst August II von Sachsen-Weimar-Eisenach і 
        після його смерті 1758 року правила як опікунка за сина Karl August, якому передала владу 1775 року. Її ім'я тісно пов'язане з веймарським «двором муз».
