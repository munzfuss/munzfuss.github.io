    inscription_rev: 30 EIN THALER - 10 PFENNINGE -/ 1 / ZEHNER / 1812 / A
    note:
      de: Bei diesem Stück handelt es sich um eine Probemüntze, die allerdings dann doch nicht als reguläre Prägung ausgegeben wurde. Die Prägewerkzeuge zu den sogenannten Ausgleichungsmüntzen, von 
        denen noch Stücke zu 5, 2 Pfennige und ein Pfennig geplant waren, befinden sich im Stempelarchiv der ehemaligen Müntzstätte Berlin hier im Müntzkabinett.
      en: This piece is a trial coin that was, however, ultimately not issued as a regular striking. The dies for the so-called Ausgleichungsmünzen, of which pieces of 5, 2 Pfennig and one Pfennig 
        were still planned, are in the die archive of the former Berlin mint here in the Coin Cabinet.
      uk: Ця штука — пробна монета, яку, однак, зрештою не випустили як регулярне карбування. Штемпельні знаряддя до так званих Ausgleichungsmünzen, з-поміж яких планували ще штуки по 5, 2 Pfennig та 
        один Pfennig, зберігаються в штемпельному архіві колишнього Берлінського монетного двору тут, у Монетному кабінеті.
