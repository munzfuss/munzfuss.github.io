    note:
      de: Konventionsthaler. Anna Amalia (1739 Wolfenbüttel – 1807 Weimar) war die Tochter Karls I. von Braunschweig. 1756 heiratete sie Herzog Ernst August II. von Sachsen-Weimar-Eisenach und 
