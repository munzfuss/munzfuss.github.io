    note:
      de: Nach Grote handelt es sich bei dem Müntztyp vermutlich um die Schillinge des zwischen Münster, Köln, Osnabrück, Cleve und Dortmund geschlossenen Müntzvertrages vom 6. Juni 1489, obwohl deren
        Normgewicht (3,96 g) etwas höher liegt. Nach Peter Ilisch handelt es sich eher um einen Braspenning nach niederländischem Vorbild.
      en: According to Grote, this coin type is probably one of the Schillinge of the coinage treaty concluded between Münster, Köln, Osnabrück, Cleve and Dortmund on 6 June 1489, although their norm 
        weight (3.96 g) is somewhat higher. According to Peter Ilisch it is rather a Braspenning after a Dutch model.
      uk: За Grote, цей тип монети — імовірно, один зі Schillinge монетного договору, укладеного між Münster, Köln, Osnabrück, Cleve і Dortmund 6 червня 1489 року, хоча їхня нормативна вага (3,96 г) 
        дещо вища. За Peter Ilisch, це радше Braspenning за нідерландським взірцем.
    verification_note: *id001
