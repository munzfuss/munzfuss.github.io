      de: Die Stempel zu dieser Reichsmüntze im Jugendstil fertigten nach dem Modell von Adolf Amberg die Müntzmedailleure Paul Sturm (Vorderseite) und Otto Schultz (Rückseite). Dargestellt ist die an
        der Straße Unter den Linden gelegene Universität, die seit 1949 den Namen Humboldt-Universität trägt.
