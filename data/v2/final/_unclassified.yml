    inscription_rev: NAT D WURT ET DOM HEY E ST ET W / CHARITATE ET CANDORE ANNO 1685
    note:
      de: Christine Charlotte war die Tochter des württembergischen Herzogs Eberhard III. aus dessen erster Ehe mit Anna Dorothea von Salm-Kyrburg. 1662 heiratete sie den Fürsten Christian von 
        Ostfriesland; nach dessen plötzlichem Tod gebar sie 1665 den künftigen Nachfolger Christian Eberhard (1665–1708) und führte als dessen Vormünderin die Regierung Ostfrieslands.
      en: Christine Charlotte was the daughter of Duke Eberhard III of Württemberg by his first marriage to Anna Dorothea von Salm-Kyrburg. In 1662 she married Prince Christian of East Frisia; after 
        his sudden death she bore the future successor Christian Eberhard (1665–1708) in 1665 and governed East Frisia as his regent.
      uk: Christine Charlotte була донькою вюртемберзького герцога Eberhard III від його першого шлюбу з Anna Dorothea von Salm-Kyrburg. 1662 року вона вийшла заміж за князя Christian von 
        Ostfriesland; після його раптової смерті народила 1665 року майбутнього спадкоємця Christian Eberhard (1665–1708) і правила Східною Фризією як його опікунка.
