    note:
      de: Die 12 Kreuzer oder Schreckenberger bilden neben Groschen und Doppelschillingen die am umfangreichsten und schlechtesten gemüntzte deutsche Geldsorte in der sogenannten Kipperzeit 
        (1619-1622).
      en: The 12 Kreuzer or Schreckenberger, together with Groschen and Doppelschillinge, form the most extensively and most poorly minted German coin type of the so-called Kipperzeit (1619-1622).
      uk: 12 Kreuzer, або Schreckenberger, разом із Groschen і Doppelschillinge становлять найпоширеніший і найгірше карбований німецький вид грошей так званої Kipperzeit (1619-1622).
