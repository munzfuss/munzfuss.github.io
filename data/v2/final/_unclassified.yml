    inscription_obv: MO - NOVA GLARONENSIS
    inscription_rev: SANCTVS - FR-IDOLINV
    note:
      de: Die Pächter der Silberminen im Mürtschengebiet hatten das Recht erhalten, im Namen des Landes Glarus das geförderte Silber zu vermüntzen. Aus den Jahren 1610 biß 1617 sind allerdings nur 
        diese Schillinge nachgewiesen.
      en: The lessees of the silver mines in the Mürtschen area had been granted the right to coin the mined silver in the name of the land of Glarus. From the years 1610 to 1617, however, only these 
        Schillinge are documented.
      uk: Орендарі срібних копалень у районі Mürtschen отримали право карбувати видобуте срібло в ім'я землі Glarus. Проте з років 1610-1617 засвідчено лише ці Schillinge.
    verification_note: *id001
