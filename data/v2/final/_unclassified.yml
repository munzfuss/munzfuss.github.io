    inscription_obv: FERDIN - D G ABB
    inscription_rev: MON ARG ABBAT WERD & H -/ XVI / 1 REICHS/THALER / 1670
    note:
      de: Das Müntzmeisterzeichen zweier gekreuzter Zainhaken auf der Rückseite ist bisher nicht zweifelsfrei zu deuten, dürfte aber nach Ilisch mit hoher Wahrscheinlichkeit dem in Dortmund und 
        Mülheim am Rhein tätigen Müntzmeister Johann Longerich zuzuordnen sein.
      en: The mintmaster's mark of two crossed casting-hooks on the reverse cannot yet be interpreted with certainty, but according to Ilisch it can most probably be assigned to Johann Longerich, 
        mintmaster active in Dortmund and Mülheim am Rhein.
      uk: Знак монетника у вигляді двох схрещених ливарних гачків на реверсі досі не витлумачено однозначно, проте, за Ilisch, його з високою ймовірністю можна віднести до монетника Johann Longerich, 
        який працював у Dortmund і Mülheim am Rhein.
