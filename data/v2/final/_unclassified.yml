        den Linden, which since 1949 has borne the name Humboldt-Universität.
      uk: Штемпелі цієї Reichsmünze у стилі модерн виконали за моделлю Adolf Amberg медальєри Paul Sturm (аверс) і Otto Schultz (реверс). На монеті зображено університет на вулиці Unter den Linden, 
        який від 1949 року має назву Humboldt-Universität.
