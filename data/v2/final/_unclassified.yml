    inscription_obv: FRID WILH ET SOPHIA DOROTHEA
    inscription_rev: PRIMI / REGNI PRUSS / HEREDIS / CONIUGIUM / FELIX / 28 NOV / 1706
    note:
      de: Dieser Doppeldukat wurde unter König Friedrich I. (1701–1713) auf die Hochzeit des Thronfolgers Friedrich Wilhelm mit Sophia Dorothea von Hannover am 28. November 1706 geprägt, und zwar 
        nicht in Berlin, sondern in der Müntzstätte Magdeburg. Neben Doppeldukaten entstanden auch Dukaten und Halbdukaten. Sophia Dorothea wurde später Königin in Preußen und war die Mutter 
        Friedrichs II.
      en: This double ducat was struck under King Friedrich I (1701–1713) for the wedding of the heir Friedrich Wilhelm to Sophia Dorothea of Hanover on 28 November 1706 — not in Berlin, but at the 
        Magdeburg mint. Ducats and half-ducats were produced alongside the double ducats. Sophia Dorothea later became Queen in Prussia and was the mother of Friedrich II.
      uk: Цей подвійний дукат карбували за короля Friedrich I (1701–1713) з нагоди весілля спадкоємця Friedrich Wilhelm із Sophia Dorothea von Hannover 28 листопада 1706 року — і не в Берліні, а на 
        монетному дворі Magdeburg. Поряд із подвійними дукатами випускали також дукати й піводукати. Sophia Dorothea згодом стала королевою Пруссії й була матір'ю Friedrich II.
