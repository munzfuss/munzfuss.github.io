    inscription_obv: FRID W D G - M BR & ELEC
    inscription_rev: DEO - DVCE 1682
    note:
      de: Die zwischen 1682 und 1696 nach dänischem Vorbild aus dem Gold der brandenburgischen Kolonie in Afrika geprägten sogenannten Guineadukaten erfreuten sich besonderer Beliebtheit und zeigen 
        auf der Rückseite stets einen segelnden Dreimaster; wegen dieser Darstellung werden sie auch Schiffsdukaten genannt.
      en: The so-called Guineadukaten, struck between 1682 and 1696 on the Danish model from the gold of the Brandenburg colony in Africa, were especially popular and always show a sailing 
        three-master on the reverse; on account of this image they are also called Schiffsdukaten (ship ducats).
      uk: Так звані Guineadukaten, карбовані між 1682 і 1696 роками за данським зразком із золота бранденбурзької колонії в Африці, були особливо популярні й завжди мають на реверсі трищоглове 
        вітрильне судно; через це зображення їх також називають Schiffsdukaten (корабельні дукати).
    verification_note: *id001
    composed_of:
      - c-a3c9d493
    label: unified-ikmk-18273618
    origin: promoted
