        Annaberg in Saxony, the silver-mining district.
      uk: Engelgroschen назвали за щитотримачами, зображеними на лицьовому боці монети. Ці Groschen також називали Schreckenberger — назва походить від «Шреккенберга» поблизу Аннаберга в Саксонії, де 
        добували срібло.
