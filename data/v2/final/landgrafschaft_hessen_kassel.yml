        zweite Jahrhundertfeier der Universität Marburg ähnlich, die Gabriel Leclerc signiert hat.
      en: The die of this undated Doppeldukaten with the expressive portrait of Landgrave Carl is unsigned, but the portrait resembles the likeness on a 1727 medal for the second centenary of the 
        University of Marburg, which was signed by Gabriel Leclerc.
