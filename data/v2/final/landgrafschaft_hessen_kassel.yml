    inscription_obv: WILHELM9 V DICT9 CONSTANS HASS LANDGRAVIUS - NATVS / 14 FEBRVARI / ANNI 1602 MOR/TVVS 21 SEPTEM / ANNI 1637 REGN / ANNOS 10 MESES / 6 DIES 4 VIXIT / ANNOS 35 MEN / SES 7 DIES 7 / 
      G K
    inscription_rev: VNO VOLENTE HUMILIS LEVABOR
    note:
      de: Diese Weidenbaumtaler genannten Müntzen sind erst unter der Regentschaft Amalie Elisabeths geprägt worden. Landgraf Wilhelm IV., geboren 1602, starb mit nur 35 Jahren während der Belagerung 
        des Schlosses Stickhausen zu Leer in Ostfriesland. Im Dreißigjährigen Krieg stand er auf Seiten der Protestanten um Gustav Adolf von Schweden und wurde deshalb auch Wilhelm der Beständige 
        genannt. In seiner relativ kurzen Regierungszeit sind verhältnismäßig viele und gute Müntzen ausgeprägt worden, um den Handel zu aktivieren.
      en: These coins, known as Weidenbaumtaler, were struck only under the regency of Amalie Elisabeth. Landgrave Wilhelm IV, born in 1602, died aged only 35 during the siege of Stickhausen Castle at
        Leer in East Frisia. In the Thirty Years' War he sided with the Protestants around Gustav Adolf of Sweden and was therefore also called Wilhelm the Steadfast. During his relatively short reign
        a comparatively large number of good coins were struck to stimulate trade.
      uk: Ці монети, відомі як Weidenbaumtaler, викарбувано лише за регентства Амалії Елизавети. Ландграф Вільгельм IV, народжений 1602 року, помер у віці лише 35 років під час облоги замку Штікгаузен
        у Леєрі в Східній Фризії. У Тридцятилітній війні він став на бік протестантів навколо Густава Адольфа Шведського, за що дістав прізвисько Вільгельм Стійкий. За порівняно недовге правління було
        викарбувано доволі багато добрих монет, щоб пожвавити торгівлю.
    verification_note: *id001
    composed_of:
      - c-18f56674
      - c-21e7dbe1
      - c-d780783c
