    inscription_obv: FRIDERICUS II D G HASS LANDG HAN COM
    inscription_rev: EIN THALER // VIRTUTE ET FIDELITATE // 17-78
    note:
      de: Die sogenannten Sterntaler sind benannt nach der Darstellung auf der Müntzrückseite. Sie zeigt den achtzackigen Stern des hessischen Hausordens vom Goldenen Löwen. Möglicherweise sind die im
        Märchen „Sterntaler“ der Gebrüder Grimm erwähnten Thaler in Beziehung zu den hessischen Thalern zu setzen. Vielfach wird der Thaler auch Blutdollar (Blood Dollar) genannt. Landgraf Friedrich 
        II. hatte dem englischen König 12.000 hessische Soldaten für dessen Kampf gegen die abtrünnigen Kolonien an der Ostküste Nordamerikas „verkauft“. Von dem dafür erhaltenen Silber sollen diese 
        Thaler geprägt worden sein.
      en: "The so-called Sterntaler are named after the design on the coin's reverse, which shows the eight-pointed star of the Hessian house Order of the Golden Lion. The Thaler mentioned in the Brothers
        Grimm fairy tale 'Sterntaler' may possibly be linked to these Hessian Thaler. The coin is also frequently called Blutdollar (Blood Dollar): Landgrave Friedrich II had 'sold' 12,000 Hessian soldiers
        to the English king for his war against the rebellious colonies on the east coast of North America, and these Thaler are said to have been struck from the silver received in return."
      uk: 'Так звані Sterntaler названо за зображенням на зворотному боці монети — восьмипроменевою зіркою гессенського домашнього ордена Золотого Лева. Талери, згадані в казці братів Грімм «Sterntaler»,
        можливо, повʼязані з цими гессенськими талерами. Монету часто називають також Blutdollar (Blood Dollar): ландграф Фрідріх II «продав» англійському королю 12 000 гессенських солдатів для його війни
        проти повсталих колоній на східному узбережжі Північної Америки, і саме зі здобутого за це срібла, як кажуть, було викарбувано ці талери.'
    verification_note: *id001
    composed_of:
      - c-db6c7a07
    label: unified-ikmk-18206254
    origin: promoted
