  - fuss: seed_unsorted
    phase: galster
    kind: kurant
    nominal: 1 Hvid
    ruler: Hans
    issuing_entity: gotland
    id: c-e673d91b
    year_first: 1510
    year_last: 1510
    year_label: '1510'
    year_verified: false
    year_note:
      de: "Das Jahr nach [b]Hauberg 1891, S. 66[/b]: [i]«c. 1510»[/i]. Ebenda, [b]S. 47–48[/b], wird der Typ der Zeit König Hans' zugewiesen: [i]«Formentlig i Begyndelsen af det 16de Aarhundrede, under
        Kong Hans, gjenoptoges atter den gamle Typ med Lilien og Lammet»[/i] (dt.: «Vermutlich zu Beginn des 16. Jahrhunderts, unter König Hans, wurde der alte Typ mit der Lilie und dem Lamm wieder aufgenommen»);
        nach [b]S. 48[/b] wird er unter Christian II. aufgegeben: [i]«Under Christian II. forlades helt Typen med Liliebusken»[/i] (dt.: «Unter Christian II. wird der Typ mit dem Lilienbusch ganz verlassen»).\n\
        [b]danskmoent.dk (Galster 142)[/b]: [i]«Hans, Hvid u. år, Visby (Gotland)»[/i] (dt.: «Hans, Hvid o. J., Visby (Gotland)»).\n[b]Lindblad 2017 (Metallanalyser av mynt 2017:3), S. 12[/b] datiert die
        Gruppe: [i]«Hvider (ca 1500-1520)»[/i] (dt.: «Hvide (ca. 1500–1520)»)."
      en: "The year after [b]Hauberg 1891, p. 66[/b]: [i]«c. 1510»[/i]. In the same work, [b]pp. 47–48[/b], the type is assigned to the time of King Hans: [i]«Formentlig i Begyndelsen af det 16de Aarhundrede,
        under Kong Hans, gjenoptoges atter den gamle Typ med Lilien og Lammet»[/i] (transl.: «Presumably at the beginning of the 16th century, under King Hans, the old type with the lily and the lamb was
        taken up again»); according to [b]p. 48[/b] it is abandoned under Christian II: [i]«Under Christian II. forlades helt Typen med Liliebusken»[/i] (transl.: «Under Christian II the type with the lily
        bush is abandoned entirely»).\n[b]danskmoent.dk (Galster 142)[/b]: [i]«Hans, Hvid u. år, Visby (Gotland)»[/i] (transl.: «Hans, Hvid, undated, Visby (Gotland)»).\n[b]Lindblad 2017 (Metallanalyser
        av mynt 2017:3), p. 12[/b] dates the group: [i]«Hvider (ca 1500-1520)»[/i] (transl.: «Hvide (c. 1500–1520)»)."
      uk: "Рік за [b]Hauberg 1891, с. 66[/b]: [i]«c. 1510»[/i]. Там само, [b]с. 47–48[/b], тип віднесено до часу короля Hans: [i]«Formentlig i Begyndelsen af det 16de Aarhundrede, under Kong Hans, gjenoptoges
        atter den gamle Typ med Lilien og Lammet»[/i] (перекл.: «Імовірно, на початку XVI століття, за короля Hans, знову відновили старий тип з лілією і ягням»); за [b]с. 48[/b], за Christian II його полишено:
        [i]«Under Christian II. forlades helt Typen med Liliebusken»[/i] (перекл.: «За Christian II тип з лілійним кущем повністю полишено»).\n[b]danskmoent.dk (Galster 142)[/b]: [i]«Hans, Hvid u. år, Visby
        (Gotland)»[/i] (перекл.: «Hans, Hvid без року, Visby (Gotland)»).\n[b]Lindblad 2017 (Metallanalyser av mynt 2017:3), с. 12[/b] датує групу: [i]«Hvider (ca 1500-1520)»[/i] (перекл.: «Hvide (бл. 1500–1520)»)."
      da: "Året efter [b]Hauberg 1891, s. 66[/b]: [i]«c. 1510»[/i]. Samme sted, [b]s. 47–48[/b], henføres typen til kong Hans' tid: [i]«Formentlig i Begyndelsen af det 16de Aarhundrede, under Kong Hans,
        gjenoptoges atter den gamle Typ med Lilien og Lammet»[/i]; efter [b]s. 48[/b] opgives den under Christian II: [i]«Under Christian II. forlades helt Typen med Liliebusken»[/i].\n[b]danskmoent.dk
        (Galster 142)[/b]: [i]«Hans, Hvid u. år, Visby (Gotland)»[/i].\n[b]Lindblad 2017 (Metallanalyser av mynt 2017:3), s. 12[/b] daterer gruppen: [i]«Hvider (ca 1500-1520)»[/i] (overs.: «Hvide (ca. 1500–1520)»)."
