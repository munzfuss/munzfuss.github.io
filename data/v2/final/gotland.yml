    note:
      de: 'Bei danskmoent.dk als «Gote» geführt. Unter Christian I. wurde auf Gotland die dänische Müntzrechnung eingeführt: «Der blev samtidig indført dansk møntregning, således at goten blev til en hvid
        (4-penning)» («Zugleich wurde die dänische Müntzrechnung eingeführt, so daß die Gote zu einem Hvid (4-Penning) wurde»)<sup>[ref:horsnaes-moesgaard-maercher-2018-s398-gote-hvid]</sup>. Abweichende
        Datierungen: 1513–1523 (Christian II.), um 1520 — Hauberg 1891, Schou 1926; 1480–1500 — Jonsson 1997, Lindblad 2017.'
      en: 'Listed by danskmoent.dk as «Gote». Under Christian I Danish reckoning was introduced on Gotland: «Der blev samtidig indført dansk møntregning, således at goten blev til en hvid (4-penning)» («at
        the same time Danish reckoning was introduced, so that the gote became a hvid (4-penning)»)<sup>[ref:horsnaes-moesgaard-maercher-2018-s398-gote-hvid]</sup>. Other datings: 1513–1523 (Christian II),
        c. 1520 — Hauberg 1891, Schou 1926; 1480–1500 — Jonsson 1997, Lindblad 2017.'
      uk: 'На danskmoent.dk монету названо «Gote». За Christian I на Готланді запровадили данську монетну лічбу: «Der blev samtidig indført dansk møntregning, således at goten blev til en hvid (4-penning)»
        («тоді ж запровадили данську монетну лічбу, тож гота стала хвідом (4-пенінговиком)»)<sup>[ref:horsnaes-moesgaard-maercher-2018-s398-gote-hvid]</sup>. Інші датування: 1513–1523 (Christian II), близько
        1520 — Hauberg 1891, Schou 1926; 1480–1500 — Jonsson 1997, Lindblad 2017.'
      da: 'Hos danskmoent.dk opført som «Gote». Under Christian 1. blev dansk møntregning indført på Gotland: «Der blev samtidig indført dansk møntregning, således at goten blev til en hvid (4-penning)»<sup>[ref:horsnaes-moesgaard-maercher-2018-s398-gote-hvid]</sup>.
        Andre dateringer: 1513–1523 (Christian 2.), ca. 1520 — Hauberg 1891, Schou 1926; 1480–1500 — Jonsson 1997, Lindblad 2017.'
