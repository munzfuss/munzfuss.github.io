    year_note:
      de: "Das Jahr nach [b]Lindahl 1955 (NNÅ 1955, S. 75)[/b]: [i]«efter reces 1379/81»[/i] (dt.: «nach dem Rezeß 1379/81»).\n\n[b]Nöbbe 1930 (Numismatisk Forenings Medlemsblad XII, S. 3)[/b]: [i]«I Tiden
        mellem 1379 og 1387 er der i Flensborg præget en Witten, som svarer til Hansestædernes saakaldte Stjernemønt»[/i] (dt.: «In der Zeit zwischen 1379 und 1387 ist in Flensborg ein Witten geprägt worden,
        der der sogenannten Sternmüntze der Hansestädte entspricht»); nicht ausgeschlossen sei nach ihm auch erst 1386: [i]«Det er ikke udelukket, at denne Witten med det schauenborgske Mærke først er udmøntet
        1386»[/i] (dt.: «Es ist nicht ausgeschlossen, daß dieser Witten mit dem schauenburgischen Zeichen erst 1386 ausgemüntzt wurde»).\n\n[b]Hauberg 1886 (Aarbøger for nordisk Oldkyndighed 1886, S. 153)[/b]:
        [i]«den er sikkert udmyntet i en nær Tid derefter»[/i] (dt.: «er ist sicher bald danach ausgemüntzt») — nach dem gemeinsamen Typ von Lübeck, Hamburg und Wismar von 1379."
      en: "The year after [b]Lindahl 1955 (NNÅ 1955, p. 75)[/b]: [i]«efter reces 1379/81»[/i] (transl.: «after the recess of 1379/81»).\n\n[b]Nöbbe 1930 (Numismatisk Forenings Medlemsblad XII, p. 3)[/b]:
        [i]«I Tiden mellem 1379 og 1387 er der i Flensborg præget en Witten, som svarer til Hansestædernes saakaldte Stjernemønt»[/i] (transl.: «Between 1379 and 1387 a Witten was struck in Flensborg corresponding
        to the so-called star coin of the Hanseatic towns»); in his view, 1386 is not excluded either: [i]«Det er ikke udelukket, at denne Witten med det schauenborgske Mærke først er udmøntet 1386»[/i]
        (transl.: «It is not excluded that this Witten with the Schauenburg mark was struck only in 1386»).\n\n[b]Hauberg 1886 (Aarbøger for nordisk Oldkyndighed 1886, p. 153)[/b]: [i]«den er sikkert udmyntet
        i en nær Tid derefter»[/i] (transl.: «it was surely struck shortly after that») — after the common type of Lübeck, Hamburg and Wismar of 1379."
      uk: "Рік за [b]Lindahl 1955 (NNÅ 1955, с. 75)[/b]: [i]«efter reces 1379/81»[/i] (перекл.: «після рецесу 1379/81 р.»).\n\n[b]Nöbbe 1930 (Numismatisk Forenings Medlemsblad XII, с. 3)[/b]: [i]«I Tiden
        mellem 1379 og 1387 er der i Flensborg præget en Witten, som svarer til Hansestædernes saakaldte Stjernemønt»[/i] (перекл.: «Між 1379 і 1387 рр. у Flensborg вибито віттен, що відповідає так званій
        «зірковій монеті» ганзейських міст»); не виключено, за ним, і 1386 р.: [i]«Det er ikke udelukket, at denne Witten med det schauenborgske Mærke først er udmøntet 1386»[/i] (перекл.: «Не виключено,
        що цей віттен зі знаком Schauenburg карбовано лише 1386 р.»).\n\n[b]Hauberg 1886 (Aarbøger for nordisk Oldkyndighed 1886, с. 153)[/b]: [i]«den er sikkert udmyntet i en nær Tid derefter»[/i] (перекл.:
        «його, певно, карбовано незабаром після того») — після спільного типу Lübeck, Hamburg і Wismar 1379 р.."
      da: "Året efter [b]Lindahl 1955 (NNÅ 1955, s. 75)[/b]: [i]«efter reces 1379/81»[/i].\n\n[b]Nöbbe 1930 (Numismatisk Forenings Medlemsblad XII, s. 3)[/b]: [i]«I Tiden mellem 1379 og 1387 er der i Flensborg
        præget en Witten, som svarer til Hansestædernes saakaldte Stjernemønt»[/i]; ifølge ham er heller ikke 1386 udelukket: [i]«Det er ikke udelukket, at denne Witten med det schauenborgske Mærke først
        er udmøntet 1386»[/i].\n\n[b]Hauberg 1886 (Aarbøger for nordisk Oldkyndighed 1886, s. 153)[/b]: [i]«den er sikkert udmyntet i en nær Tid derefter»[/i] — efter Lübecks, Hamburgs og Wismars fælles
        type fra 1379."
    note:
      de: 'Vs.: MONETA HOLSACI, das holsteinische Nesselblatt mit oder ohne Punkt in der Mitte; Rs.: CIVITAS FLENSBVR, Kreuz mit Ring in der Mitte, darin ein Stern<sup>[ref:lindahl-1955-flensborg-witten-371]</sup>.
        Der Typ entspricht dem gemeinsamen Typ, den Lübeck, Hamburg und Wismar 1379 beschlossen<sup>[ref:hauberg-1886-faelles-typ-1379]</sup>. Das Nesselblatt nennt Nöbbe das schauenburgische Zeichen<sup>[ref:noebbe-1930-naeldeblad-schauenburg]</sup>;
        die holsteinische Nessel, die auch auf den Hamburger Müntzen steht, konnte nach Nöbbe den Eindruck einer Hamburger Ausmüntzung wecken<sup>[ref:noebbe-1930-naeldeblad-hamborg]</sup>.'
      en: 'Obv.: MONETA HOLSACI, the Holstein nettle leaf with or without a dot in the centre; rev.: CIVITAS FLENSBVR, cross with a ring in the centre, a star in it<sup>[ref:lindahl-1955-flensborg-witten-371]</sup>.
        The type agrees with the common type that Lübeck, Hamburg and Wismar adopted in 1379<sup>[ref:hauberg-1886-faelles-typ-1379]</sup>. Nöbbe calls the nettle leaf the Schauenburg mark<sup>[ref:noebbe-1930-naeldeblad-schauenburg]</sup>;
        according to Nöbbe, the Holstein nettle, which also appears on the Hamburg coins, could give the impression of a Hamburg issue<sup>[ref:noebbe-1930-naeldeblad-hamborg]</sup>.'
      uk: "Аверс: MONETA HOLSACI, гольштейнський кропив'яний листок із крапкою в центрі або без неї; реверс: CIVITAS FLENSBVR, хрест із кільцем у центрі, у ньому зірка<sup>[ref:lindahl-1955-flensborg-witten-371]</sup>.
        Тип відповідає спільному типу, який Lübeck, Hamburg і Wismar ухвалили 1379 р.<sup>[ref:hauberg-1886-faelles-typ-1379]</sup> Кропив'яний листок Nöbbe називає знаком Schauenburg<sup>[ref:noebbe-1930-naeldeblad-schauenburg]</sup>;
        гольштейнська кропива, яка є і на гамбурзьких монетах, за Nöbbe, могла створювати враження гамбурзького карбування<sup>[ref:noebbe-1930-naeldeblad-hamborg]</sup>."
      da: 'Forside: MONETA HOLSACI, det holstenske nældeblad med eller uden punkt i midten; bagside: CIVITAS FLENSBVR, kors med ring i midten, heri en stjerne<sup>[ref:lindahl-1955-flensborg-witten-371]</sup>.
        Typen svarer til den fælles type, som Lübeck, Hamburg og Wismar vedtog i 1379<sup>[ref:hauberg-1886-faelles-typ-1379]</sup>. Nældebladet kalder Nöbbe det schauenburgske mærke<sup>[ref:noebbe-1930-naeldeblad-schauenburg]</sup>;
        den holstenske nælde, der også findes på de hamborgske mønter, kunne ifølge Nöbbe give indtryk af en hamborgsk udmøntning<sup>[ref:noebbe-1930-naeldeblad-hamborg]</sup>.'
