        с. 73)[/b]: [i]«dateringen af den første Flensborg-witten og -viertelwitten til ca. 1350»[/i] (перекл.: «датування першого фленсборзького віттена і віртельвіттена бл. 1350 р.»)).\n\n[b]Nöbbe 1930
        (Numismatisk Forenings Medlemsblad XII, с. 2)[/b]: [i]«Før 1379 er den flensborgske Witten (Fig. 1) og den tilsvarende Penning (Fig. 2) udmøntet»[/i] (перекл.: «До 1379 р. вибито фленсборзький віттен
        (рис. 1) і відповідний пфеніг (рис. 2)»).\n\n[b]Hauberg 1886 (Aarbøger for nordisk Oldkyndighed 1886, с. 154)[/b] відносив карбування до пізнішого часу: [i]«Formentlig i Tiden 1388-1395 blev der
        i Flensborg udmyntet Firepenninge og Topenninge af samme Typ»[/i] (перекл.: «Імовірно, в 1388–1395 рр. у Flensborg карбували чотирипфеніговики й двопфеніговики того самого типу»)."
      da: "Året efter [b]Lindahl 1955 (NNÅ 1955, s. 75)[/b]: [i]«ca. 1350 til reces 1379/81»[/i]; dermed afviger Lindahl fra Hauberg ([b]Lindahl 1955 (NNÅ 1955, s. 73)[/b]: [i]«dateringen af den første
        Flensborg-witten og -viertelwitten til ca. 1350»[/i]).\n\n[b]Nöbbe 1930 (Numismatisk Forenings Medlemsblad XII, s. 2)[/b]: [i]«Før 1379 er den flensborgske Witten (Fig. 1) og den tilsvarende Penning
        (Fig. 2) udmøntet»[/i].\n\n[b]Hauberg 1886 (Aarbøger for nordisk Oldkyndighed 1886, s. 154)[/b] lagde prægningen senere: [i]«Formentlig i Tiden 1388-1395 blev der i Flensborg udmyntet Firepenninge
        og Topenninge af samme Typ»[/i]."
    note:
      de: 'Vs.: MONETA HOLSASCIE, zwei Leoparden; Rs.: CIVITAS FLENSBVRG, Kreuz mit Kleeblatt in der Mitte<sup>[ref:lindahl-1955-flensborg-viertelwitten-340]</sup>. In der Form des Kreuzes entspricht der
        Typ genau den lübischen Müntzen vor und nach dem Rezeß von 1379<sup>[ref:lindahl-1955-korsform-lybske]</sup>. Lindahl nennt das Nominal «Viertelwitten», Nöbbe «Penning eller 1/4 Witten» («Pfennig
        oder ¼ Witten»)<sup>[ref:noebbe-1930-penning-kvart-witten]</sup>, Hauberg beschreibt den Typ als «Topenning» («Zweipfennig»)<sup>[ref:hauberg-1886-topenning]</sup>.'
      en: 'Obv.: MONETA HOLSASCIE, two leopards; rev.: CIVITAS FLENSBVRG, cross with a clover leaf in the centre<sup>[ref:lindahl-1955-flensborg-viertelwitten-340]</sup>. In the form of the cross the type
        corresponds closely to the Lübeck coins before and after the recess of 1379<sup>[ref:lindahl-1955-korsform-lybske]</sup>. Lindahl calls the denomination «Viertelwitten» («quarter Witten»), Nöbbe
        «Penning eller 1/4 Witten» («penny or ¼ Witten»)<sup>[ref:noebbe-1930-penning-kvart-witten]</sup>, Hauberg describes the type as a «Topenning» («two-penny»)<sup>[ref:hauberg-1886-topenning]</sup>.'
      uk: 'Аверс: MONETA HOLSASCIE, два леопарди; реверс: CIVITAS FLENSBVRG, хрест із листком конюшини в центрі<sup>[ref:lindahl-1955-flensborg-viertelwitten-340]</sup>. Формою хреста тип точно відповідає
        любецьким монетам до і після рецесу 1379 р.<sup>[ref:lindahl-1955-korsform-lybske]</sup> Lindahl називає номінал «Viertelwitten» («чверть віттена»), Nöbbe — «Penning eller 1/4 Witten» («пфеніг,
        або ¼ віттена»)<sup>[ref:noebbe-1930-penning-kvart-witten]</sup>, Hauberg описує цей тип як «Topenning» («двопфеніговик»)<sup>[ref:hauberg-1886-topenning]</sup>.'
      da: 'Forside: MONETA HOLSASCIE, to leoparder; bagside: CIVITAS FLENSBVRG, kors med kløverblad i midten<sup>[ref:lindahl-1955-flensborg-viertelwitten-340]</sup>. I korsets form svarer typen nøje til
        de lybske mønter før og efter recessen 1379<sup>[ref:lindahl-1955-korsform-lybske]</sup>. Lindahl kalder nominalen «Viertelwitten», Nöbbe «Penning eller 1/4 Witten»<sup>[ref:noebbe-1930-penning-kvart-witten]</sup>,
        Hauberg beskriver typen som «Topenning»<sup>[ref:hauberg-1886-topenning]</sup>.'
