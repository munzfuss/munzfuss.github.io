      de: "Das Jahr nach [b]Lindahl 1955 (NNÅ 1955, S. 74)[/b]: [i]«ca. 1350 til reces 1379/81»[/i] (dt.: «ca. 1350 bis zum Rezeß 1379/81»); damit weicht Lindahl von Hauberg ab ([b]Lindahl 1955 (NNÅ 1955,
        S. 73)[/b]: [i]«dateringen af den første Flensborg-witten og -viertelwitten til ca. 1350»[/i] (dt.: «die Datierung des ersten Flensborger Witten und Viertelwitten auf ca. 1350»)).\n\n[b]Nöbbe 1930
        (Numismatisk Forenings Medlemsblad XII, S. 2)[/b]: [i]«Før 1379 er den flensborgske Witten (Fig. 1) og den tilsvarende Penning (Fig. 2) udmøntet»[/i] (dt.: «Vor 1379 sind der Flensborger Witten
        (Abb. 1) und der entsprechende Pfennig (Abb. 2) ausgemüntzt»).\n\n[b]Hauberg 1886 (Aarbøger for nordisk Oldkyndighed 1886, S. 154)[/b] setzte die Prägung später an: [i]«Formentlig i Tiden 1388-1395
        blev der i Flensborg udmyntet Firepenninge og Topenninge af samme Typ»[/i] (dt.: «Vermutlich in der Zeit 1388–1395 wurden in Flensborg Vierpfennige und Zweipfennige desselben Typs ausgemüntzt»).\n\
        \n[b]Numista (179715)[/b]: [i]«1359-1378»[/i]."
      en: "The year after [b]Lindahl 1955 (NNÅ 1955, p. 74)[/b]: [i]«ca. 1350 til reces 1379/81»[/i] (transl.: «c. 1350 to the recess of 1379/81»); here Lindahl departs from Hauberg ([b]Lindahl 1955 (NNÅ
        1955, p. 73)[/b]: [i]«dateringen af den første Flensborg-witten og -viertelwitten til ca. 1350»[/i] (transl.: «the dating of the first Flensborg Witten and Viertelwitten to c. 1350»)).\n\n[b]Nöbbe
        1930 (Numismatisk Forenings Medlemsblad XII, p. 2)[/b]: [i]«Før 1379 er den flensborgske Witten (Fig. 1) og den tilsvarende Penning (Fig. 2) udmøntet»[/i] (transl.: «Before 1379 the Flensborg Witten
        (Fig. 1) and the corresponding penny (Fig. 2) were struck»).\n\n[b]Hauberg 1886 (Aarbøger for nordisk Oldkyndighed 1886, p. 154)[/b] placed the coinage later: [i]«Formentlig i Tiden 1388-1395 blev
        der i Flensborg udmyntet Firepenninge og Topenninge af samme Typ»[/i] (transl.: «Presumably in the period 1388–1395 four-pennies and two-pennies of the same type were struck in Flensborg»).\n\n\
        [b]Numista (179715)[/b]: [i]«1359-1378»[/i]."
      uk: "Рік за [b]Lindahl 1955 (NNÅ 1955, с. 74)[/b]: [i]«ca. 1350 til reces 1379/81»[/i] (перекл.: «бл. 1350 р. — до рецесу 1379/81 р.»); цим Lindahl відходить від Hauberg ([b]Lindahl 1955 (NNÅ 1955,
        с. 73)[/b]: [i]«dateringen af den første Flensborg-witten og -viertelwitten til ca. 1350»[/i] (перекл.: «датування першого фленсборзького віттена і віртельвіттена бл. 1350 р.»)).\n\n[b]Nöbbe 1930
        (Numismatisk Forenings Medlemsblad XII, с. 2)[/b]: [i]«Før 1379 er den flensborgske Witten (Fig. 1) og den tilsvarende Penning (Fig. 2) udmøntet»[/i] (перекл.: «До 1379 р. вибито фленсборзький віттен
        (рис. 1) і відповідний пфеніг (рис. 2)»).\n\n[b]Hauberg 1886 (Aarbøger for nordisk Oldkyndighed 1886, с. 154)[/b] відносив карбування до пізнішого часу: [i]«Formentlig i Tiden 1388-1395 blev der
        i Flensborg udmyntet Firepenninge og Topenninge af samme Typ»[/i] (перекл.: «Імовірно, в 1388–1395 рр. у Flensborg карбували чотирипфеніговики й двопфеніговики того самого типу»).\n\n[b]Numista
        (179715)[/b]: [i]«1359-1378»[/i]."
      da: "Året efter [b]Lindahl 1955 (NNÅ 1955, s. 74)[/b]: [i]«ca. 1350 til reces 1379/81»[/i]; dermed afviger Lindahl fra Hauberg ([b]Lindahl 1955 (NNÅ 1955, s. 73)[/b]: [i]«dateringen af den første
        Flensborg-witten og -viertelwitten til ca. 1350»[/i]).\n\n[b]Nöbbe 1930 (Numismatisk Forenings Medlemsblad XII, s. 2)[/b]: [i]«Før 1379 er den flensborgske Witten (Fig. 1) og den tilsvarende Penning
        (Fig. 2) udmøntet»[/i].\n\n[b]Hauberg 1886 (Aarbøger for nordisk Oldkyndighed 1886, s. 154)[/b] lagde prægningen senere: [i]«Formentlig i Tiden 1388-1395 blev der i Flensborg udmyntet Firepenninge
        og Topenninge af samme Typ»[/i].\n\n[b]Numista (179715)[/b]: [i]«1359-1378»[/i]."
    note:
      de: 'Vs.: MONETA HOLSASCIE, die zwei südjütischen Leoparden im Schild, von sechs Bögen umgeben; Rs.: CIVITAS FLENSBVRG, Kreuz mit Kleeblatt in der Mitte, darin ein Punkt<sup>[ref:lindahl-1955-flensborg-witten-339]</sup>.
        In der Form des Kreuzes entspricht der Typ genau den lübischen Müntzen vor und nach dem Rezeß von 1379<sup>[ref:lindahl-1955-korsform-lybske]</sup>.'
      en: 'Obv.: MONETA HOLSASCIE, the two South Jutland leopards in a shield, surrounded by six arcs; rev.: CIVITAS FLENSBVRG, cross with a clover leaf in the centre, a dot in it<sup>[ref:lindahl-1955-flensborg-witten-339]</sup>.
        In the form of the cross the type corresponds closely to the Lübeck coins before and after the recess of 1379<sup>[ref:lindahl-1955-korsform-lybske]</sup>.'
      uk: 'Аверс: MONETA HOLSASCIE, два південноютландські леопарди в щиті, оточені шістьма дугами; реверс: CIVITAS FLENSBVRG, хрест із листком конюшини в центрі, у ньому крапка<sup>[ref:lindahl-1955-flensborg-witten-339]</sup>.
        Формою хреста тип точно відповідає любецьким монетам до і після рецесу 1379 р.<sup>[ref:lindahl-1955-korsform-lybske]</sup>'
      da: 'Forside: MONETA HOLSASCIE, de to sønderjyske leoparder i skjold, omgivet af seks buer; bagside: CIVITAS FLENSBVRG, kors med kløverblad i midten, heri et punkt<sup>[ref:lindahl-1955-flensborg-witten-339]</sup>.
        I korsets form svarer typen nøje til de lybske mønter før og efter recessen 1379<sup>[ref:lindahl-1955-korsform-lybske]</sup>.'
