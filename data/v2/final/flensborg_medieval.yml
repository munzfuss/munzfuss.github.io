    origin: promoted
    year_note:
      de: "Das Jahr nach [b]Lindahl 1955 (NNÅ 1955, S. 76)[/b]: [i]«efter reces 1392»[/i] (dt.: «nach dem Rezeß 1392»); in der Anmerkung: [i]«Flensborg-drelingene er muligvis en halv snes år ældre end angivet»[/i]
        (dt.: «Die Flensborger Dreilinge sind möglicherweise etwa zehn Jahre älter als angegeben»), in der Nähe der lübischen und hamburgischen Dreilinge, die die Quellen 1374 und 1382 nennen.\n\n[b]Nöbbe
        1930 (Numismatisk Forenings Medlemsblad XII, S. 3–4)[/b]: [i]«ganske svarende til Lybæks Dreilinge efter, maaske allerede før, 1392»[/i] (dt.: «ganz entsprechend den Lübecker Dreilingen nach, vielleicht
        schon vor 1392»); [i]«senest maa være udkommet mellem 1392 og 1400»[/i] (dt.: «muß spätestens zwischen 1392 und 1400 herausgekommen sein»).\n\n[b]Hauberg 1886 (Aarbøger for nordisk Oldkyndighed
        1886, S. 156)[/b] stellte den Dreiling zu den lübischen von 1403: [i]«utvivlsomt maa være samtidig med eller kun lidt yngre end disse. Den forekommer første Gang i det c. 1400 nedlagte Kalby F.»[/i]
        (dt.: «muß zweifellos gleichzeitig mit diesen oder nur wenig jünger sein. Er kommt zuerst in dem um 1400 niedergelegten Fund von Kalby vor»)."
      en: "The year after [b]Lindahl 1955 (NNÅ 1955, p. 76)[/b]: [i]«efter reces 1392»[/i] (transl.: «after the recess of 1392»); in the note: [i]«Flensborg-drelingene er muligvis en halv snes år ældre
        end angivet»[/i] (transl.: «The Flensborg Dreilinge are possibly some ten years older than stated»), close to the Lübeck and Hamburg Dreilinge named in the sources in 1374 and 1382.\n\n[b]Nöbbe
        1930 (Numismatisk Forenings Medlemsblad XII, p. 3–4)[/b]: [i]«ganske svarende til Lybæks Dreilinge efter, maaske allerede før, 1392»[/i] (transl.: «entirely corresponding to Lübeck's Dreilinge after,
        perhaps even before, 1392»); [i]«senest maa være udkommet mellem 1392 og 1400»[/i] (transl.: «must have been issued between 1392 and 1400 at the latest»).\n\n[b]Hauberg 1886 (Aarbøger for nordisk
        Oldkyndighed 1886, p. 156)[/b] placed the Dreiling with the Lübeck ones of 1403: [i]«utvivlsomt maa være samtidig med eller kun lidt yngre end disse. Den forekommer første Gang i det c. 1400 nedlagte
        Kalby F.»[/i] (transl.: «must undoubtedly be contemporary with these or only a little younger. It first occurs in the Kalby hoard, deposited c. 1400»)."
      uk: "Рік за [b]Lindahl 1955 (NNÅ 1955, с. 76)[/b]: [i]«efter reces 1392»[/i] (перекл.: «після рецесу 1392 р.»); у примітці: [i]«Flensborg-drelingene er muligvis en halv snes år ældre end angivet»[/i]
        (перекл.: «Фленсборзькі дрейлінги, можливо, приблизно на десять років старші, ніж зазначено»), ближче до любецьких і гамбурзьких дрейлінгів, які джерела згадують 1374 і 1382 р..\n\n[b]Nöbbe 1930
        (Numismatisk Forenings Medlemsblad XII, с. 3–4)[/b]: [i]«ganske svarende til Lybæks Dreilinge efter, maaske allerede før, 1392»[/i] (перекл.: «цілком подібний до любецьких дрейлінгів після, а можливо,
        ще й до 1392 р.»); [i]«senest maa være udkommet mellem 1392 og 1400»[/i] (перекл.: «мала вийти найпізніше між 1392 і 1400 рр.»).\n\n[b]Hauberg 1886 (Aarbøger for nordisk Oldkyndighed 1886, с. 156)[/b]
        зіставляв дрейлінг із любецькими 1403 р.: [i]«utvivlsomt maa være samtidig med eller kun lidt yngre end disse. Den forekommer første Gang i det c. 1400 nedlagte Kalby F.»[/i] (перекл.: «безсумнівно,
        сучасний їм або лише трохи молодший. Уперше він трапляється в скарбі з Kalby, закопаному бл. 1400 р.»)."
      da: "Året efter [b]Lindahl 1955 (NNÅ 1955, s. 76)[/b]: [i]«efter reces 1392»[/i]; i noten: [i]«Flensborg-drelingene er muligvis en halv snes år ældre end angivet»[/i], nær de lybske og hamborgske
        drelinge, som kilderne nævner 1374 og 1382.\n\n[b]Nöbbe 1930 (Numismatisk Forenings Medlemsblad XII, s. 3–4)[/b]: [i]«ganske svarende til Lybæks Dreilinge efter, maaske allerede før, 1392»[/i];
        [i]«senest maa være udkommet mellem 1392 og 1400»[/i].\n\n[b]Hauberg 1886 (Aarbøger for nordisk Oldkyndighed 1886, s. 156)[/b] stillede dreilingen sammen med de lybske fra 1403: [i]«utvivlsomt maa
        være samtidig med eller kun lidt yngre end disse. Den forekommer første Gang i det c. 1400 nedlagte Kalby F.»[/i]."
    note:
      de: 'Vs.: MONETA HOLTSACIE; Rs.: CIVITAS FLENSBVRGEN; auf beiden Seiten zwei Leoparden im Schild, darüber drei oder zwei Punkte oder Ringe<sup>[ref:lindahl-1955-flensborg-dreling-427]</sup>. Der Typ
        entspricht ganz den lübischen Dreilingen<sup>[ref:noebbe-1930-dreiling-lybaek]</sup>. Er ist die häufigste der mittelalterlichen Müntzen Flensborgs: allein der Fund von Aarhus enthielt 119 Stück,
        etwa 20 Stempel lassen sich nachweisen<sup>[ref:noebbe-1930-dreiling-almindeligste]</sup>. Mit ihm bricht die kurze Reihe der mittelalterlichen Müntzen Flensborgs ab<sup>[ref:noebbe-1930-raekke-afbrydes]</sup>.'
      en: 'Obv.: MONETA HOLTSACIE; rev.: CIVITAS FLENSBVRGEN; on both sides two leopards in a shield, above it three or two dots or rings<sup>[ref:lindahl-1955-flensborg-dreling-427]</sup>. The type corresponds
        entirely to the Lübeck Dreilinge<sup>[ref:noebbe-1930-dreiling-lybaek]</sup>. It is the commonest of Flensborg’s medieval coins: the Aarhus hoard alone contained 119 pieces, and about 20 dies can
        be identified<sup>[ref:noebbe-1930-dreiling-almindeligste]</sup>. With it the short series of Flensborg’s medieval coins breaks off<sup>[ref:noebbe-1930-raekke-afbrydes]</sup>.'
      uk: 'Аверс: MONETA HOLTSACIE; реверс: CIVITAS FLENSBVRGEN; на обох боках два леопарди в щиті, над ним три або дві крапки чи кільця<sup>[ref:lindahl-1955-flensborg-dreling-427]</sup>. Тип цілком подібний
        до любецьких дрейлінгів<sup>[ref:noebbe-1930-dreiling-lybaek]</sup>. Це найпоширеніша із середньовічних монет Flensborg: лише в скарбі з Aarhus виявлено 119 штук, відомо близько 20 штемпелів<sup>[ref:noebbe-1930-dreiling-almindeligste]</sup>.
        Нею уривається короткий ряд середньовічних монет Flensborg<sup>[ref:noebbe-1930-raekke-afbrydes]</sup>.'
      da: 'Forside: MONETA HOLTSACIE; bagside: CIVITAS FLENSBVRGEN; på begge sider to leoparder i skjold, hvorover tre eller to punkter eller ringe<sup>[ref:lindahl-1955-flensborg-dreling-427]</sup>. Typen
        svarer ganske til de lybske dreilinge<sup>[ref:noebbe-1930-dreiling-lybaek]</sup>. Den er den almindeligste af Flensborgs middelaldermønter: alene Aarhusfundet indeholdt 119 stykker, og omtrent
        20 stempler kan påvises<sup>[ref:noebbe-1930-dreiling-almindeligste]</sup>. Med den afbrydes den korte række af Flensborgs middelaldermønter<sup>[ref:noebbe-1930-raekke-afbrydes]</sup>.'
