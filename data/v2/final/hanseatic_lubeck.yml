    inscription_obv: IMPERIAL CIVIT - LUBECENSIS 1730
    inscription_rev: CONFESS EVANG IN COM AUG EXHIBITAE -/ SAC - SAECU/LAR - SEC / 25 - IUN
    note:
      de: Die Dukaten von 1730 sind auf die Zweite Säkularfeier der Augsburger Konfession, einen der wichtigsten Gedenktage der Protestanten, geprägt worden. Das protestantische Glaubensbekenntnis, 
        die 'Confessio Augustana', war vom Reformator Philipp Melanchthon in einer Schrift zusammengefaßt und vor Kaiser Karl V. 1530 auf dem Reichstag verlesen worden.
      en: The ducats of 1730 were struck for the second centenary of the Augsburg Confession, one of the most important commemorative days of the Protestants. The Protestant creed, the 'Confessio 
        Augustana', had been summarised in a document by the reformer Philipp Melanchthon and read before Emperor Charles V at the Reichstag in 1530.
      uk: Дукати 1730 року карбовані до другого 200-річчя Аугсбурзького віросповідання, одного з найважливіших памʼятних днів протестантів. Протестантський символ віри 'Confessio Augustana' уклав 
        реформатор Philipp Melanchthon у писанні та зачитав перед імператором Karl V на Райхстазі 1530 року.
