        Umschrift wörtlich zu nehmen ist, wäre die Marck als Müntze mit ca. 22 g anzunehmen.
      en: First large-silver issue within the Wendischer Münzverein. The year 1502 marks the fixing of the coinage standard for Mark issues within the Wendischer Münzverein. If the legend is to be 
        taken literally, the Mark as a coin would be assumed to weigh about 22 g.
      uk: Перше великосрібне карбування в межах Wendischer Münzverein. Дата 1502 позначає встановлення монетної стопи для карбування марки в межах Wendischer Münzverein. Якщо тлумачити легенду 
        буквально, Mark як монету слід вважати вагою близько 22 г.
