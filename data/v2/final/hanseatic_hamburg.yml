    inscription_obv: I / SCHIL/LING / 1754
    inscription_rev: HAMBURGER
    note:
      de: Der Schilling ist ursprünglich eine karolingische Rechnungseinheit im Wert von 1/20 Pfund oder 12 Denaren. Müntzen dieses Namens wurden erstmals im 12. und 13. Jahrhundert ausgeprägt und 
        hießen Grosso oder Groschen, im norddeutschen Raum Schilling. In Hamburg wurden Schillinge biß 1855 geprägt. Ein Schilling galt 12 Pfennige.
      en: The Schilling is originally a Carolingian unit of account worth 1/20 of a pound or 12 denarii. Coins of this name were first struck in the 12th and 13th centuries and were called Grosso or 
        Groschen, in northern Germany Schilling. In Hamburg Schillinge were struck until 1855. One Schilling was worth 12 Pfennige.
      uk: Schilling первісно — каролінзька лічильна одиниця вартістю 1/20 фунта або 12 денаріїв. Монети під цією назвою вперше карбували у XII–XIII століттях і називали Grosso чи Groschen, у 
        північнонімецьких землях — Schilling. У Hamburg Schilling карбували до 1855 року. Один Schilling дорівнював 12 Pfennige.
