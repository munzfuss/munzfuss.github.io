    inscription_rev: DEUTSCHES - REICH 1909
    note:
      de: Das 25-Pfennig-Stück ist eine der wenigen Müntzen, die in den Formen des Jugendstils gestaltet wurde. Es war ein unbeliebtes und unbekanntes Nominal und wurde daher weitgehend abgelehnt und 
        nicht angenommen bzw. sofort wieder ausgegeben. Weitere Prägeaufträge wurden nicht vergeben, und da Nickel ein kriegswichtiges Metall war, sind die Müntzen ab 1916 wieder eingezogen worden.
      en: The 25-Pfennig piece is one of the few coins designed in the forms of the Jugendstil. It was an unpopular and little-known denomination and was therefore largely rejected and not accepted, 
        or immediately spent again. No further minting orders were placed, and since nickel was a metal important to the war effort, the coins were withdrawn from 1916.
      uk: Монета в 25 Pfennig — одна з небагатьох, оформлених у стилі Jugendstil. Це був непопулярний і маловідомий номінал, тож його здебільшого відхиляли й не приймали або одразу пускали назад в 
        обіг. Подальших замовлень на карбування не давали, а оскільки нікель був важливим для війни металом, від 1916 року монети вилучали з обігу.
    verification_note: *id001
    composed_of:
      - c-8c9e9f4d
    label: unified-ikmk-18203937
    origin: promoted
