    inscription_rev: DEUTSCHES - REICH 1875 - ZEHN MARK
    note:
      de: Das Gesetz über die Ausprägung von Goldmüntzen vom 4.12.1871 führte im Deutschen Reich die Goldwährung ein. Es wurden Goldmüntzen zu 20, 10 und 5 Mark ausgegeben. Ihre offizielle Bezeichnung
        als Doppelkrone, Krone und halbe Krone setzte sich nicht durch. Alle Reichsgoldmüntzen wurden in einer Legierung von 900 Teilen Gold und 100 Teilen Kupfer geprägt.
      en: The law on the minting of gold coins of 4 December 1871 introduced the gold standard in the German Reich. Gold coins of 20, 10 and 5 Mark were issued. Their official designations as 
        Doppelkrone, Krone and halbe Krone did not gain acceptance. All Reichsgoldmünzen were struck in an alloy of 900 parts gold and 100 parts copper.
      uk: Закон про карбування золотих монет від 4 грудня 1871 року запровадив у Німецькій імперії золотий стандарт. Випускалися золоті монети по 20, 10 і 5 Mark. Їхні офіційні назви Doppelkrone, 
        Krone і halbe Krone не прижилися. Усі Reichsgoldmünzen карбувалися зі сплаву 900 частин золота та 100 частин міді.
    verification_note: *id001
    composed_of:
      - c-f2cd291a
    label: unified-ikmk-18224429
    origin: promoted
