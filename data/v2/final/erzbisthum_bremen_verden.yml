            13–16; номер Schou примірника лежить у цих межах.
          da: Nationalmuseets post (KMM) nævner «Frederik 3». Konge blev Frederik III først i 1648; 1641 prægede han som ærkebiskop af Bremen. Hede BV6 opfører «1 Søsling lybsk» 1641 med Schou 13–16; 
