    note:
      de: Christian II. wurde 1523 nach einer Erhebung des Adels in Dänemark und Norwegen zur Flucht in die Niederlande gezwungen. Sein Onkel Friedrich I. folgte ihm auf den Thron. 1531 versuchte er 
        die Rückeroberung Norwegens, gelangte aber nicht über Oslo hinaus und mußte sich 1532 nach Dänemark in Gefangenschaft begeben, in der er 1549 starb. Die Klippe wurde aus Kirchensilber geprägt,
        das die norwegischen Bischöfe Christian II. zur Verfügung stellten.
      en: In 1523, following a rising of the nobility, Christian II was forced to flee Denmark and Norway for the Netherlands, and his uncle Frederik I succeeded him on the throne. In 1531 he 
        attempted to reconquer Norway but got no farther than Oslo, and in 1532 had to surrender into captivity in Denmark, where he died in 1549. The Klippe was struck from church silver placed at 
        Christian II's disposal by the Norwegian bishops.
      uk: Після повстання шляхти 1523 року Христіан II був змушений тікати з Данії та Норвегії до Нідерландів, а на трон зійшов його дядько Фредерік I. У 1531 році він спробував відвоювати Норвегію, 
        але не просунувся далі Осло і 1532 року мусив здатися й потрапити в полон у Данії, де помер 1549 року. Klippe викарбувано з церковного срібла, яке надали Христіанові II норвезькі єпископи.
