  - fuss: seed_unsorted
    phase: galster
    kind: kurant
    nominal: 1 Skilling
    ruler: Søren Norby
    mintmaster: Hans Seyer
    issuing_entity: norby_gotland
    id: unified-dk-bruun-4112
    year_first: 1524
    year_last: 1525
    year_ranges:
      -   - 1524
          - 1525
    year_label: 1524-1525
    year_verified: true
    ruler_alts:
      - value: Christian II
        source: bruun
        kind: suspect
        reason:
          de: 'Der Katalog Bruun nennt in der Zeile des Loses «Christian II.» als Münzherrn. Søren Norby, Lehnsmann Christians II. auf Gotland, schlug die Visbyer Münzen jedoch «med eget navn og våbenskjold»
            (dt.: «mit eigenem Namen und Wappen»; danskmoent.dk, «Søren Norby»), nicht im Namen des Königs.'
          en: "The Bruun catalogue names «Christian II.» as the issuer in the lot line. Søren Norby, Christian II's fief-holder on Gotland, struck the Visby coins «med eget navn og våbenskjold» (transl.:
            «with his own name and arms»; danskmoent.dk, «Søren Norby»), not in the king's name."
          uk: 'Каталог Bruun у рядку лота називає емітентом «Christian II.». Проте Søren Norby, ленсман Christian II на Готланді, карбував монети у Visby «med eget navn og våbenskjold» (перекл.: «з власним
            іменем і гербом»; danskmoent.dk, «Søren Norby»), а не від імені короля.'
          da: Bruun-kataloget nævner i lotlinjen «Christian II.» som møntherre. Søren Norby, Christian 2.s lensmand på Gotland, slog dog Visby-mønterne med eget navn og våbenskjold (danskmoent.dk, 
            «Søren Norby»), ikke i kongens navn.
    mint: Visby
    catalog:
      sieg: '12'
      bruun_collection_id:
        - '4112'
        - '4114'
      schou:
        - 2-3
        - 2-5
      galster: '143'
      others:
        - Hauberg# hhv. 125-127 og 128
    metal: billon
    metal_verified: false
    fineness_verified: false
    weight_rough_verified: true
    mint_verified: true
    verified: false
    weight_rough_g:
      - value: 4.24
        source: bruun
      - value: 4.38
        source: bruun
    sources:
      - type: auction
        url: https://stacksbowers.com/wp-content/themes/stacksbowers/uploads/catalogs/SBG_Mar2026_BruunIV_Coins_Catalog.pdf
        ref: Bruun Part IV, lot 17036, p. 11
      - type: auction
        url: https://stacksbowers.com/wp-content/themes/stacksbowers/uploads/catalogs/SBG_Oct2025_LE_Bruun_Coins_Part_III.pdf
        ref: Bruun Part III, lot 11159, p. 68
      - type: literature
        url: https://www.danskmoent.dk/gotlg143.htm
        ref: Galster 143 (hg) — danskmoent.dk gotlg143.htm
    note:
      de: Gotland
      en: Gotland
      uk: Gotland
      da: Gotland
    verification_note:
      de: Daten aus dem Bruun-Auktionskatalog (Stack's Bowers, L. E. Bruun Collection 2024-2026) übernommen. Das Brutto-Gewicht ist ein Einzelstück-Wert; einen Feingehalt gibt Bruun nicht an, er folgt
        aus der Ordonnanz-Spezifikationstabelle bei Wilcke 1950. Der Müntzfuß dieses Stücks ist noch nicht bestimmt.
      en: Data taken from the Bruun auction catalogue (Stack's Bowers, L. E. Bruun Collection 2024-2026). The gross weight is a single-specimen value; Bruun gives no fineness, so it follows from the 
        ordinance specification table in Wilcke 1950. The coinage standard of this piece is not yet determined.
      uk: Дані взято з аукціонного каталогу Bruun (Stack's Bowers, L. E. Bruun Collection 2024-2026). Повна вага — значення одного примірника; проби Bruun не подає, вона випливає з таблиці 
        специфікацій ордонансів у Wilcke 1950. Стопу цього примірника ще не визначено.
      da: Data hentet fra Bruun-auktionskatalogen (Stack's Bowers, L. E. Bruun Collection 2024-2026). Bruttovægten er en enkeltstyksværdi; Bruun angiver ingen finhed, den følger af 
        specifikationstabellen for forordningerne hos Wilcke 1950. Møntfoden for dette stykke er endnu ikke bestemt.
    composed_of:
      - unified-dk-bruun-4112
