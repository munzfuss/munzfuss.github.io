        source: danskmoent.dk (Kunzel 1985–86)
        template:
          de: "Kein Probierbefund: 4½ Lot (281,25 ‰) ist die Probe, die der Vertrag Herzog Albrechts VII. von Mecklenburg mit dem Münzmeister Moritz Schacht (Schwerin, 28. März 1535) vorschreibt, nicht
            die an einem Stück bestimmte Feinheit.\n[b]Kunzel 1985–86 (Nordisk Numismatisk Årsskrift 1985–86), danskmoent.dk/artikler/gustrow.htm[/b]: [i]«Diese Münzen dänischer Währung, d.h. Vierskillinge,
            sollten nach folgendem Fuß ausgeprägt werden»[/i]; Korn 4½ Lot, Schrot 63½ Stück aus der Mark; Remedium [i]«ein Quentchen am Feingehalt»[/i]."
          en: "Not an assay: 4½ Lot (281.25 ‰) is the fineness prescribed by the contract of Duke Albrecht VII of Mecklenburg with the mintmaster Moritz Schacht (Schwerin, 28 March 1535), not a fineness
            determined on a specimen.\n[b]Kunzel 1985–86 (Nordisk Numismatisk Årsskrift 1985–86), danskmoent.dk/artikler/gustrow.htm[/b]: [i]«Diese Münzen dänischer Währung, d.h. Vierskillinge, sollten
            nach folgendem Fuß ausgeprägt werden»[/i] (transl.: «These coins of Danish currency, i.e. four-skilling pieces, were to be struck on the following standard»); fineness 4½ Lot, 63½ pieces to
            the mark; remedy [i]«ein Quentchen am Feingehalt»[/i] (transl.: «one Quentchen in the fineness»)."
          uk: "Не результат визначення проби: 4½ лота (281,25 ‰) — проба, яку приписує контракт герцога Albrecht VII Мекленбурзького з мінцмейстером Moritz Schacht (Schwerin, 28 березня 1535 р.), а не проба,
            визначена на екземплярі.\n[b]Kunzel 1985–86 (Nordisk Numismatisk Årsskrift 1985–86), danskmoent.dk/artikler/gustrow.htm[/b]: [i]«Diese Münzen dänischer Währung, d.h. Vierskillinge, sollten nach
            folgendem Fuß ausgeprägt werden»[/i] (перекл.: «Ці монети данської валюти, тобто четвертаки, мали карбуватися за такою стопою»); проба 4½ лота, 63½ штуки з марки; допуск [i]«ein Quentchen am
            Feingehalt»[/i] (перекл.: «один квентхен на пробі»)."
          da: "Ikke en prøvning: 4½ lod (281,25 ‰) er den lødighed, som hertug Albrecht 7. af Mecklenburgs kontrakt med møntmester Moritz Schacht (Schwerin, 28. marts 1535) foreskriver, ikke en lødighed
            bestemt på et eksemplar.\n[b]Kunzel 1985–86 (Nordisk Numismatisk Årsskrift 1985–86), danskmoent.dk/artikler/gustrow.htm[/b]: [i]«Diese Münzen dänischer Währung, d.h. Vierskillinge, sollten nach
            folgendem Fuß ausgeprägt werden»[/i] (overs.: «Disse mønter af dansk mønt, dvs. firskillinger, skulle præges efter følgende fod»); lødighed 4½ lod, 63½ stykker af marken; remedium [i]«ein Quentchen
            am Feingehalt»[/i] (overs.: «et kvintin i lødigheden»)."
