    inscription_obv: E D G C H - S E S D G
    inscription_rev: MATTHIAS D G RO IM S A 618
    note:
      de: Die Müntzmeisterstelle für die beiden von den Grafen von Holstein-Schauenburg betriebenen Müntzstätten wurde seit 1609 in Personalunion ausgeübt, da jene die Müntzstätte in der Grafschaft 
        Schauenburg (zunächst Oldendorf, 1618 Rinteln, 1620 wieder Oldendorf) als der Altonaer Müntze zugehörig erklärten, um rechtliche Probleme mit dem Kreis wegen des Betriebs von mehr als einer 
        Müntzstätte in ihrem Territorium zu vermeiden. Der Müntzmeister der Müntzstätte Altona war theoretisch als Müntzmeister für beide holsteinisch-schauenburgische Müntzstätten verantwortlich.
      en: From 1609 the post of mintmaster for the two mints operated by the Counts of Holstein-Schauenburg was held in personal union, since the counts declared the mint in the county of Schauenburg 
        (first Oldendorf, in 1618 Rinteln, in 1620 again Oldendorf) to belong to the Altona mint, in order to avoid legal difficulties with the Imperial Circle over running more than one mint in their
        territory. The mintmaster of the Altona mint was in theory responsible as mintmaster for both Holstein-Schauenburg mints.
      uk: Від 1609 року посаду монетного майстра для двох монетних дворів, які утримували графи Гольштейн-Шауенбурзькі, обіймали в персональній унії, оскільки графи оголосили монетний двір у графстві 
        Шауенбург (спершу Ольдендорф, 1618 року Рінтельн, 1620 року знову Ольдендорф) належним до Альтонського монетного двору, щоб уникнути правових труднощів із імперським округом через утримання 
        більш ніж одного монетного двору на своїй території. Монетний майстер Альтонського двору теоретично відповідав як монетний майстер за обидва гольштейн-шауенбурзькі двори.
    verification_note:
