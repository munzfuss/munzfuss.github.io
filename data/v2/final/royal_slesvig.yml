    fineness:
      - value: 0.75
        source: hede
        template:
          de: 'Teil von Hedes Formel: nach Galster (Aufsatz über die Münzstätte Flensborg, Anm. 47) hat Hede, von der traditionellen Kölner Mark (233,855 g) ausgehend, die Formeln 3,278 g–0,750–2,458 g
            und 6,556 g–0,750–4,916 g.'
          en: "Part of Hede's formula: according to Galster (article on the Flensborg mint, note 47), Hede, starting from the traditional weight of the Cologne mark (233.855 g), has the formulas 3.278 g–0.750–2.458
            g and 6.556 g–0.750–4.916 g."
          uk: 'Частина формули Hede: за Galster (стаття про монетний двір у Flensborg, примітка 47), Hede, виходячи з традиційної ваги кельнської марки (233,855 г), має формули 3,278 г–0,750–2,458 г і 6,556
            г–0,750–4,916 г.'
          da: 'Del af Hedes formel: ifølge Galster (artiklen om Flensborg mønt, note 47) har Hede, der går ud fra den traditionelle vægt for den kølnske mark (233,855 g), formlerne 3,278 g–0,750–2,458 g
            og 6,556 g–0,750–4,916 g.'
      - value: 0.75
        source: numista
        template:
          de: Numista gibt dasselbe Paar 6,556 g / 0,75 wie Hede 15 und verweist auf Hede 15; nach Galster (Aufsatz über die Münzstätte Flensborg, Anm. 47) ist es Hedes aus der traditionellen Kölner 
            Mark (233,855 g) errechnete Formel.
          en: Numista gives the same pair 6.556 g / 0.75 as Hede 15 and cites Hede 15; according to Galster (article on the Flensborg mint, note 47) it is Hede's formula, computed from the traditional
            weight of the Cologne mark (233.855 g).
          uk: Numista подає ту саму пару 6,556 г / 0,75, що й Hede 15, і посилається на Hede 15; за Galster (стаття про монетний двір у Flensborg, примітка 47), це формула Hede, обчислена з 
            традиційної ваги кельнської марки (233,855 г).
          da: Numista angiver samme par 6,556 g / 0,75 som Hede 15 og henviser til Hede 15; ifølge Galster (artiklen om Flensborg mønt, note 47) er det Hedes formel, beregnet ud fra den traditionelle 
            vægt for den kølnske mark (233,855 g).
    weight_rough_g:
      - value: 6.556
        source: hede
        template:
          de: 'Wahrscheinlich kein Wägebefund: 6,556 g sind genau das Doppelte der 3,278 g des einfachen Gulden (Hede 14), die der Sollgröße des Standards von 71⅓ Stück aus einer Cöllnischen Marck entsprechen.
            Daß es das Gewicht eines gewogenen Stücks ist, zeigen die vorliegenden Angaben nicht.'
          en: 'Probably not a weighing: 6.556 g is exactly twice the 3.278 g of the single gulden (Hede 14), which equals the target weight of the standard of 71⅓ pieces to a Cöllnische Marck. That it is
            the weight of a weighed specimen is not shown by the available data.'
          uk: 'Імовірно, не результат зважування: 6,556 г — рівно вдвічі більше за 3,278 г одинарного гульдена (Hede 14), що дорівнює цільовій вазі стандарту 71⅓ штуки з Кельнської марки. Що це вага зваженого
            екземпляра, наявні дані не показують.'
          da: 'Formentlig ikke en vejning: 6,556 g er netop det dobbelte af de 3,278 g for den enkelte gylden (Hede 14), som svarer til målvægten for standarden 71⅓ stykker af en Cöllnische Marck. At det
            er vægten af et vejet eksemplar, viser de foreliggende data ikke.'
      - value: 6.556
        source: numista
        template:
          de: Numista gibt dasselbe Paar 6,556 g / 0,75 wie Hede 15 und verweist auf Hede 15; nach Galster (Aufsatz über die Münzstätte Flensborg, Anm. 47) ist es Hedes aus der traditionellen Kölner 
            Mark (233,855 g) errechnete Formel.
          en: Numista gives the same pair 6.556 g / 0.75 as Hede 15 and cites Hede 15; according to Galster (article on the Flensborg mint, note 47) it is Hede's formula, computed from the traditional
            weight of the Cologne mark (233.855 g).
          uk: Numista подає ту саму пару 6,556 г / 0,75, що й Hede 15, і посилається на Hede 15; за Galster (стаття про монетний двір у Flensborg, примітка 47), це формула Hede, обчислена з 
            традиційної ваги кельнської марки (233,855 г).
          da: Numista angiver samme par 6,556 g / 0,75 som Hede 15 og henviser til Hede 15; ifølge Galster (artiklen om Flensborg mønt, note 47) er det Hedes formel, beregnet ud fra den traditionelle 
            vægt for den kølnske mark (233,855 g).
    sources:
      - type: literature
        url: https://www.danskmoent.dk/chr/c3h15.htm
        ref: danskmoent.dk (Hede c3h15)
      - type: literature
        url: https://en.numista.com/474509
        ref: Numista N#474509 — 2 Goldgulden - Christian III
      - type: literature
        url: https://www.ngccoin.com/price-guide/world/german-states-schleswig-holstein-2-goldgulden-mb-51-1546-cuid-167748-duid-380835
        ref: NGC World Coin Price Guide (powered by NumisMaster)
      - type: literature
        url: https://numismaster.com/MC_167748
        ref: NumisMaster
    note:
      de: Brustbild / Wappenschilde. Die Zuweisung nach Flensburg beruht auf Reynold Junges Müntzzeichen, dem Glühhaken («glødehagen»)<sup>[ref:danskmoent-c3h15-flensborg-gloedehagen]</sup>. Das 
        einzige bekannte Stück liegt in der Kgl. Müntz- und Medaillensammlung, Kopenhagen<sup>[ref:danskmoent-c3h15-2-gylden-unik]</sup>.
      en: Portrait / shields of arms. The attribution to Flensburg rests on Reynold Junge’s mint mark, the fire hook («glødehagen»)<sup>[ref:danskmoent-c3h15-flensborg-gloedehagen]</sup>. The only 
        known specimen is in the Royal Collection of Coins and Medals, Copenhagen<sup>[ref:danskmoent-c3h15-2-gylden-unik]</sup>.
      uk: Портрет / гербові щити. Атрибуція Фленсбургу ґрунтується на монетному знаку Reynold Junge — гачку для жару («glødehagen»)<sup>[ref:danskmoent-c3h15-flensborg-gloedehagen]</sup>. Єдиний 
        відомий екземпляр — у Королівській колекції монет і медалей, Копенгаген<sup>[ref:danskmoent-c3h15-2-gylden-unik]</sup>.
      da: Portræt / våbenskjolde. Henførslen til Flensborg bygger på Reynold Junges møntmærke, glødehagen<sup>[ref:danskmoent-c3h15-flensborg-gloedehagen]</sup>. Det eneste kendte eksemplar er i Den 
        Kgl. Mønt- og Medaillesamling, København<sup>[ref:danskmoent-c3h15-2-gylden-unik]</sup>.
    composed_of:
      - c-1a6e6907
    label: unified-dk-hede-c3h15
    origin: promoted
    _curation_holds:
      nominal: "Curator 2026-09-06: display «2 Goldgulden», not Hede's «2 Rhinsk Gylden». The coin carries no value legend (portrait / arms only), so the nominal is a catalogue name, not a literal inscription;
        the sources diverge — danskmoent/Hede c3h15 «2 Rhinsk gylden» vs Numista N#474509 + NGC/NumisMaster (MB 51) «2 Goldgulden». Curator prefers the Goldgulden form. Held because the merger takes Hede
        (top authority) for the scalar nominal, and nominal is foundation-immutable so this edit already persists — the hold documents the deliberate divergence for future sessions."
      issuing_entity: Pinned royal_slesvig (curator 2026-08-26, option A). This is Christian III's ROYAL Schleswig issue — Flensburg mint (Reynold Junge mintmaster) + Schleswig-town, the KING's 
        coinage, NOT a Gottorp-share coin (Adolf I's Gottorp share was two years old in 1546). The mint-derived stamp yields [gottorp_duchy, royal_slesvig] because Schleswig-town at 1546 (≥1544) 
        routes to gottorp_duchy; the mint alone cannot disambiguate post-1544 Schleswig-town (royal vs Gottorp), so ruler disambiguates → royal_slesvig. Without this hold the absorb subset-upgrade 
        would re-adopt the joint [gottorp_duchy, royal_slesvig] from the seed_unified bridge.
      year_verified: 1546 is source-attested (Hede 15 = danskmoent c3h15, Numista N#474509, both 1546). A yearless NGC/NumisMaster re-harvest member flips the OR-merge to false; pin true (§4 
        verified-wins). Was commit c070d60; re-pinned after the 2026-08-26 royal_holstein→royal_slesvig relocation dropped the prior foundation and its hold.
    mint_alts:
      - value: Schleswig
        source: numista
        kind: erroneous
        reason:
          de: "Falsche Münzstätte. [b]Numista 474509[/b] gibt «Schleswig» an. SLESVICENSIS in der Umschrift dieser Gulden kann als Name des Herzogtums gelten; geschlagen wurden sie in Flensborg.\n[b]danskmoent.dk
            (Hede 15)[/b]: [i]«Henførslen til Flensborg sker pga. Reynold Junges møntmærke, glødehagen»[/i] (Übers.: «Die Zuweisung nach Flensborg erfolgt wegen Reynold Junges Münzzeichen, dem Glühhaken»).\n\
            [b]Galster 1934 (Reynold Junges Møntmesterregnskaber), S. XXVII[/b]: [i]«Af hans Udmøntninger i Flensborg foreligger nu dobbelte og enkelte Guldgylden … alle af Aargang 1546»[/i] (Übers.: «Von
            seinen Ausmünzungen in Flensborg liegen jetzt doppelte und einfache Goldgulden vor … alle des Jahrgangs 1546»).\n[b]Galster, Danmarks Mønter (danskmoent.dk)[/b]: [i]«overensstemmende i Præget
            med de ældre gottorpske (ligetil SLESVICENSIS i Omskriften)»[/i] (Übers.: «im Gepräge übereinstimmend mit den älteren gottorpischen (bis hin zu SLESVICENSIS in der Umschrift)»)."
          en: "Wrong mint. [b]Numista 474509[/b] gives «Schleswig». SLESVICENSIS in the legend of these gulden can be taken as the name of the duchy; they were struck in Flensborg.\n[b]danskmoent.dk (Hede
            15)[/b]: [i]«Henførslen til Flensborg sker pga. Reynold Junges møntmærke, glødehagen»[/i] (transl.: «The attribution to Flensborg rests on Reynold Junge's mint mark, the fire hook»).\n[b]Galster
            1934 (Reynold Junges Møntmesterregnskaber), p. XXVII[/b]: [i]«Af hans Udmøntninger i Flensborg foreligger nu dobbelte og enkelte Guldgylden … alle af Aargang 1546»[/i] (transl.: «Of his coinage
            in Flensborg there are now known double and single gold gulden … all of the year 1546»).\n[b]Galster, Danmarks Mønter (danskmoent.dk)[/b]: [i]«overensstemmende i Præget med de ældre gottorpske
            (ligetil SLESVICENSIS i Omskriften)»[/i] (transl.: «in their type agreeing with the older Gottorp ones (down to SLESVICENSIS in the legend)»)."
          uk: "Помилкове місце карбування. [b]Numista 474509[/b] подає «Schleswig». SLESVICENSIS у легенді цих гульденів можна вважати назвою герцогства; карбовано їх у Flensborg.\n[b]danskmoent.dk (Hede
            15)[/b]: [i]«Henførslen til Flensborg sker pga. Reynold Junges møntmærke, glødehagen»[/i] (перекл.: «Віднесення до Flensborg зроблено через знак монетного майстра Reynold Junge — гачок для жару»).\n\
            [b]Galster 1934 (Reynold Junges Møntmesterregnskaber), с. XXVII[/b]: [i]«Af hans Udmøntninger i Flensborg foreligger nu dobbelte og enkelte Guldgylden … alle af Aargang 1546»[/i] (перекл.: «З
            його карбувань у Flensborg нині відомі подвійні й одинарні золоті гульдени … усі 1546 року»).\n[b]Galster, Danmarks Mønter (danskmoent.dk)[/b]: [i]«overensstemmende i Præget med de ældre gottorpske
            (ligetil SLESVICENSIS i Omskriften)»[/i] (перекл.: «за карбуванням відповідають старшим готторпським, аж до SLESVICENSIS у легенді»)."
          da: "Forkert møntsted. [b]Numista 474509[/b] angiver «Schleswig». SLESVICENSIS i omskriften på disse gylden kan anses for hertugdømmets navn; de er slået i Flensborg.\n[b]danskmoent.dk (Hede 15)[/b]:
            [i]«Henførslen til Flensborg sker pga. Reynold Junges møntmærke, glødehagen»[/i].\n[b]Galster 1934 (Reynold Junges Møntmesterregnskaber), s. XXVII[/b]: [i]«Af hans Udmøntninger i Flensborg foreligger
            nu dobbelte og enkelte Guldgylden … alle af Aargang 1546»[/i].\n[b]Galster, Danmarks Mønter (danskmoent.dk)[/b]: [i]«overensstemmende i Præget med de ældre gottorpske (ligetil SLESVICENSIS i
            Omskriften)»[/i]."
