    year_alts:
      - value: '1516'
        source: numista
        kind: erroneous
        reason:
          de: "Dieses Jahr gehört nicht zu diesem Typ. [b]Numista 301215[/b] gibt 1516 und 1532 in einem Typ. 1516 ist das Jahr des Søsling aus Husum (Galster 121); Galster 126 ist der Søsling aus Gottorp.\n\
            [b]danskmoent.dk (Galster 121)[/b]: [i]«Frederik 1., 1 Søsling 1516, Husum»[/i] (Übers.: «Frederik I., 1 Søsling 1516, Husum»).\n[b]danskmoent.dk (Galster 126)[/b]: [i]«Frederik 1., 1 Søsling
            u.år, Gottorp 1532, 1533 (Unik), u. år»[/i] (Übers.: «Frederik I., 1 Søsling ohne Jahr, Gottorp 1532, 1533 (Unikum), ohne Jahr»).\n[b]Galster, Danmarks Mønter (danskmoent.dk)[/b]: [i]«Samme
            Aar (1522) lod Frederik I bygge en ny Mønt paa Gottorp»[/i] (Übers.: «Im selben Jahr (1522) ließ Frederik I. eine neue Müntze auf Gottorp bauen»)."
          en: "This year does not belong to this type. [b]Numista 301215[/b] gives 1516 and 1532 in one type. 1516 is the year of the Søsling from Husum (Galster 121); Galster 126 is the Søsling from Gottorp.\n\
            [b]danskmoent.dk (Galster 121)[/b]: [i]«Frederik 1., 1 Søsling 1516, Husum»[/i] (transl.: «Frederik I, 1 Søsling 1516, Husum»).\n[b]danskmoent.dk (Galster 126)[/b]: [i]«Frederik 1., 1 Søsling
            u.år, Gottorp 1532, 1533 (Unik), u. år»[/i] (transl.: «Frederik I, 1 Søsling undated, Gottorp 1532, 1533 (unique), undated»).\n[b]Galster, Danmarks Mønter (danskmoent.dk)[/b]: [i]«Samme Aar
            (1522) lod Frederik I bygge en ny Mønt paa Gottorp»[/i] (transl.: «In the same year (1522) Frederik I had a new mint built at Gottorp»)."
          uk: "Цей рік не належить до цього типу. [b]Numista 301215[/b] подає 1516 і 1532 в одному типі. 1516 — рік сьослінга з Husum (Galster 121); Galster 126 — сьослінг з Gottorp.\n[b]danskmoent.dk (Galster
            121)[/b]: [i]«Frederik 1., 1 Søsling 1516, Husum»[/i] (перекл.: «Фредерік I, 1 сьослінг 1516, Husum»).\n[b]danskmoent.dk (Galster 126)[/b]: [i]«Frederik 1., 1 Søsling u.år, Gottorp 1532, 1533
            (Unik), u. år»[/i] (перекл.: «Фредерік I, 1 сьослінг без року, Gottorp 1532, 1533 (унікальна), без року»).\n[b]Galster, Danmarks Mønter (danskmoent.dk)[/b]: [i]«Samme Aar (1522) lod Frederik
            I bygge en ny Mønt paa Gottorp»[/i] (перекл.: «Того ж року (1522) Фредерік I звелів збудувати новий монетний двір на Gottorp»)."
          da: "Dette år hører ikke til denne type. [b]Numista 301215[/b] angiver 1516 og 1532 i én type. 1516 er året for søslingen fra Husum (Galster 121); Galster 126 er søslingen fra Gottorp.\n[b]danskmoent.dk
            (Galster 121)[/b]: [i]«Frederik 1., 1 Søsling 1516, Husum»[/i].\n[b]danskmoent.dk (Galster 126)[/b]: [i]«Frederik 1., 1 Søsling u.år, Gottorp 1532, 1533 (Unik), u. år»[/i].\n[b]Galster, Danmarks
            Mønter (danskmoent.dk)[/b]: [i]«Samme Aar (1522) lod Frederik I bygge en ny Mønt paa Gottorp»[/i]."
    mint_alts:
      - value: Husum
        source: kmk
        kind: suspect
        reason:
          de: "Prägeort nach KMM. [b]KMM 83081[/b] gibt «Husum» für einen Søsling ohne Jahr (G. 126; Schou 52). Galster stellt die Søslinge ohne Jahr (Schou 50–71) zu Galster 126, Gottorp.\n[b]danskmoent.dk
            (Galster 126)[/b]: [i]«1 Søsling u.år, Gottorp 1532, 1533 (Unik), u. år»[/i] … [i]«Schou hhv. 1-5, ej, 50-71»[/i] (Übers.: «1 Søsling ohne Jahr, Gottorp 1532, 1533 (Unikum), ohne Jahr» … «Schou
            jeweils 1–5, keine, 50–71»).\n[b]Galster, Danmarks Mønter (danskmoent.dk)[/b]: [i]«Det er uvist, om Møntvirksomheden i Husum har været fortsat efter 1522»[/i] (Übers.: «Es ist ungewiß, ob die
            Müntztätigkeit in Husum nach 1522 fortgesetzt wurde»).\nHusum und Gottorp sind beide möglich; keines von beiden ist belegt."
          en: "Mint as given by KMM. [b]KMM 83081[/b] gives «Husum» for an undated Søsling (G. 126; Schou 52). Galster places the undated Søslinge (Schou 50–71) under Galster 126, Gottorp.\n[b]danskmoent.dk
            (Galster 126)[/b]: [i]«1 Søsling u.år, Gottorp 1532, 1533 (Unik), u. år»[/i] … [i]«Schou hhv. 1-5, ej, 50-71»[/i] (transl.: «1 Søsling undated, Gottorp 1532, 1533 (unique), undated» … «Schou
            1–5, none, 50–71 respectively»).\n[b]Galster, Danmarks Mønter (danskmoent.dk)[/b]: [i]«Det er uvist, om Møntvirksomheden i Husum har været fortsat efter 1522»[/i] (transl.: «It is uncertain
            whether minting in Husum continued after 1522»).\nHusum and Gottorp are both possible; neither is established."
          uk: "Місце карбування за KMM. [b]KMM 83081[/b] подає «Husum» для сьослінга без року (G. 126; Schou 52). Galster відносить сьослінги без року (Schou 50–71) до Galster 126, Gottorp.\n[b]danskmoent.dk
            (Galster 126)[/b]: [i]«1 Søsling u.år, Gottorp 1532, 1533 (Unik), u. år»[/i] … [i]«Schou hhv. 1-5, ej, 50-71»[/i] (перекл.: «1 сьослінг без року, Gottorp 1532, 1533 (унікальна), без року» …
            «Schou відповідно 1–5, немає, 50–71»).\n[b]Galster, Danmarks Mønter (danskmoent.dk)[/b]: [i]«Det er uvist, om Møntvirksomheden i Husum har været fortsat efter 1522»[/i] (перекл.: «Невідомо,
            чи карбування в Husum тривало після 1522»).\nHusum і Gottorp однаково можливі, і жодне з них не доведене."
          da: "Møntsted efter KMM. [b]KMM 83081[/b] angiver «Husum» for en søsling uden år (G. 126; Schou 52). Galster henfører søslingerne uden år (Schou 50–71) til Galster 126, Gottorp.\n[b]danskmoent.dk
            (Galster 126)[/b]: [i]«1 Søsling u.år, Gottorp 1532, 1533 (Unik), u. år»[/i] … [i]«Schou hhv. 1-5, ej, 50-71»[/i].\n[b]Galster, Danmarks Mønter (danskmoent.dk)[/b]: [i]«Det er uvist, om Møntvirksomheden
            i Husum har været fortsat efter 1522»[/i].\nHusum og Gottorp er begge mulige; ingen af dem er påvist."
