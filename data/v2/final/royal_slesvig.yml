        reason:
          de: "[b]Nöbbe 1938[/b], Anm. 2: [i]«Det af Heller og Lange anførte Aarstal 1560 paa en Topenning er urigtigt læst for 1566. Topenningen 1570 (= utydelig 1566)»[/i] (dt.: «Die von Heller und Lange
            angeführte Jahreszahl 1560 auf einem Zweipfennig ist falsch gelesen für 1566. Der Zweipfennig 1570 (= undeutlich 1566)»).\n[b]Hede 32[/b] kennt die Blafferte nur von 1566 und 1571."
          en: "[b]Nöbbe 1938[/b], n. 2: [i]«Det af Heller og Lange anførte Aarstal 1560 paa en Topenning er urigtigt læst for 1566. Topenningen 1570 (= utydelig 1566)»[/i] (transl.: «The year 1560 on a
            two-penning piece cited by Heller and Lange is misread for 1566. The two-penning piece 1570 (= indistinct 1566)»).\n[b]Hede 32[/b] knows the Blafferte only of 1566 and 1571."
          uk: "[b]Nöbbe 1938[/b], прим. 2: [i]«Det af Heller og Lange anførte Aarstal 1560 paa en Topenning er urigtigt læst for 1566. Topenningen 1570 (= utydelig 1566)»[/i] (перекл.: «Рік 1560 на двопфеніговій
            монеті, наведений у Heller і Lange, — помилкове прочитання 1566. Двопфенігова монета 1570 (= нечіткий 1566)»).\n[b]Hede 32[/b] знає блафферти лише 1566 і 1571 рр."
          da: "[b]Nöbbe 1938[/b], note 2: [i]«Det af Heller og Lange anførte Aarstal 1560 paa en Topenning er urigtigt læst for 1566. Topenningen 1570 (= utydelig 1566)»[/i].\n[b]Hede 32[/b] kender blafferterne
            kun fra 1566 og 1571."
