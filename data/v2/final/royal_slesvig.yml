    ruler_alts:
      - value: Adolf
        source: ngc
        kind: erroneous
        reason:
          de: "Der Katalog nennt Herzog Adolf als Münzherrn der Blafferte 1566 und 1571, nach [b]Lange II, S. 302[/b]. Die Münze in Flensborg war königlich: Frederik II bestallte die Münzmeister (Hans Køppelin
            1566, Balthasar Wegener 1570).\n[b]Nöbbe 1938[/b]: die Eichel Wegeners auf dem Penning 1571 [i]«sikrer Henførelsen af den hele Møntgruppe af tosidige Blafferte og Penninge til Møntstedet Flensborg
            under Frederik II»[/i] (dt.: «sichert die Zuweisung der ganzen Münzgruppe zweiseitiger Blafferte und Penninge an die Münzstätte Flensborg unter Frederik II»)."
          en: "The catalogue names Duke Adolf as the issuer of the Blafferte of 1566 and 1571, after [b]Lange II, p. 302[/b]. The Flensborg mint was royal: Frederik II appointed its mintmasters (Hans Køppelin
            1566, Balthasar Wegener 1570).\n[b]Nöbbe 1938[/b]: Wegener's acorn on the Penning 1571 [i]«sikrer Henførelsen af den hele Møntgruppe af tosidige Blafferte og Penninge til Møntstedet Flensborg
            under Frederik II»[/i] (transl.: «secures the attribution of the whole group of two-sided Blafferte and Penninge to the Flensborg mint under Frederik II»)."
          uk: "Каталог називає емітентом блаффертів 1566 і 1571 рр. герцога Адольфа, за [b]Lange II, с. 302[/b]. Монетний двір у Flensborg був королівським: монетмайстрів призначав Frederik II (Hans Køppelin
            1566 р., Balthasar Wegener 1570 р.).\n[b]Nöbbe 1938[/b]: жолудь Вегенера на пенінгу 1571 р. [i]«sikrer Henførelsen af den hele Møntgruppe af tosidige Blafferte og Penninge til Møntstedet Flensborg
            under Frederik II»[/i] (перекл.: «забезпечує віднесення всієї групи двобічних блаффертів і пенінгів до монетного двору Flensborg за Frederik II»)."
          da: "Kataloget nævner hertug Adolf som udsteder af blafferterne 1566 og 1571, efter [b]Lange II, s. 302[/b]. Møntstedet i Flensborg var kongeligt: Frederik II ansatte møntmestrene (Hans Køppelin
            1566, Balthasar Wegener 1570).\n[b]Nöbbe 1938[/b]: Wegeners agern på penningen 1571 [i]«sikrer Henførelsen af den hele Møntgruppe af tosidige Blafferte og Penninge til Møntstedet Flensborg under
            Frederik II»[/i]."
