            als Frederik noch Herzog von Gottorp war; den dänischen Königstitel erhielt er erst 1523»).\n[b]danskmoent.dk (Galster 124)[/b]: [i]«2 Skilling, Gottorp»[/i] … [i]«1523-33 og uden år»[/i] (Übers.:
            «2 Skilling, Gottorp» … «1523–33 und ohne Jahr»)."
          en: "These years do not belong to this type. [b]Numista 301214[/b] gives 1514, 1520, 1522, as does the type MB 10, which covers both Galster types. Galster separates the ducal coinage (Galster
