    note:
      de: Die Schilde von Holstein, Schleswig, Stormarn und Norwegen mit dem Oldenburger Mittelschild / Reichsapfel im spitzen Dreipaß; Rückseitenumschrift «MO. NO. AVREA. SLESVICENSIS.» («Neue 
        Goldmüntze Schleswigs»). Letzte Ausgabe, die Reynold Junge 1534, in seinem letzten Jahr als Müntzmeister in Gottorp, prägte<sup>[ref:stacksbowers-bruun-p2-14259-junge-gottorp-1534]</sup>.
      en: The shields of Holstein, Schleswig, Stormarn and Norway with the central shield of Oldenburg / orb in a pointed trefoil; reverse legend «MO. NO. AVREA. SLESVICENSIS.» («new gold coin of 
        Schleswig»). The last issue struck by Reynold Junge, in 1534, his last year as mintmaster at Gottorp<sup>[ref:stacksbowers-bruun-p2-14259-junge-gottorp-1534]</sup>.
      uk: Щити Гольштейну, Шлезвігу, Стормарну й Норвегії з центральним щитом Ольденбурга / держава в гострому трилиснику; легенда реверсу «MO. NO. AVREA. SLESVICENSIS.» («нова золота монета 
        Шлезвігу»). Останній випуск, який Reynold Junge викарбував 1534 р., в останній рік своєї служби монетмейстером у Готторпі<sup>[ref:stacksbowers-bruun-p2-14259-junge-gottorp-1534]</sup>.
      da: Skjoldene for Holsten, Slesvig, Stormarn og Norge med Oldenborgs midterskjold / rigsæble i spids trepas; bagsideomskrift «MO. NO. AVREA. SLESVICENSIS.» («ny guldmønt fra Slesvig»). Den 
        sidste emission, Reynold Junge prægede, i 1534, hans sidste år som møntmester på Gottorp<sup>[ref:stacksbowers-bruun-p2-14259-junge-gottorp-1534]</sup>.
