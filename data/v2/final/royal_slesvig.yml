            Frederik was still Duke of Gottorp; he received the Danish royal title only in 1523»).\n[b]danskmoent.dk (Galster 124)[/b]: [i]«2 Skilling, Gottorp»[/i] … [i]«1523-33 og uden år»[/i] (transl.:
