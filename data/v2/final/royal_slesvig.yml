    inscription_obv: FREDERICVS - D HOLSACI
    inscription_rev: MO NO AVREA SLESWICENSIS
    note:
      de: 'Hl. Andreas stehend mit Kreuz, zu Füßen der Holsteiner Schild / die Wappen von Holstein, Schleswig, Stormarn und Norwegen um einen kleinen Oldenburger Schild. Umschriften: «FRIDERICVS - D HOLSACI.»
        («Frederik, Herzog von Holstein») / «MO. NOV. AVREA. SLESVICENSIS.» («Neue Goldmüntze Schleswigs»). Das Berliner Exemplar (Münzkabinett Berlin, 3,25 g) datiert das IKMK nach Dannenberg 1859 «um
        1506» — eine zweifelhafte Datierung: die Müntze zu Schleswig/Gottorp richtete Herzog Frederik erst um 1522 ein<sup>[ref:galster-1934-gottorp-moentsmedje-1522]</sup>, den rheinischen Gulden führt
        in seiner Prägung erst die Møntordning 1524 ein<sup>[ref:wilcke-1950-moentordning-1524]</sup>, sein erster Gulden ist Malmø 1527<sup>[ref:danskmoent-f1-rhinsk-gylden-1527]</sup>; herzogliches Gold
        kennen Galster und Wilcke nicht.'
      en: 'St Andrew standing with a cross, the Holstein shield at his feet / the arms of Holstein, Schleswig, Stormarn and Norway around a small Oldenburg shield. Legends: «FRIDERICVS - D HOLSACI.» («Frederik,
        duke of Holstein») / «MO. NOV. AVREA. SLESVICENSIS.» («new gold coin of Schleswig»). The Berlin specimen (Münzkabinett Berlin, 3.25 g) is dated by the IKMK «c. 1506» after Dannenberg 1859 — a doubtful
        dating: Duke Frederik set up the Schleswig/Gottorp mint only around 1522<sup>[ref:galster-1934-gottorp-moentsmedje-1522]</sup>, the Rhenish gulden enters his coinage only with the Møntordning of
        1524<sup>[ref:wilcke-1950-moentordning-1524]</sup>, his first gulden is Malmø 1527<sup>[ref:danskmoent-f1-rhinsk-gylden-1527]</sup>; Galster and Wilcke know no ducal gold.'
      uk: 'Св. Андрій стоїть із хрестом, біля ніг щиток Гольштейну / герби Гольштейну, Шлезвігу, Стормарну й Норвегії навколо малого щита Ольденбурга. Легенди: «FRIDERICVS - D HOLSACI.» («Frederik, герцог
        Гольштейну») / «MO. NOV. AVREA. SLESVICENSIS.» («нова золота монета Шлезвігу»). Берлінський примірник (Münzkabinett Berlin, 3,25 г) IKMK датує «близько 1506» за Dannenberg 1859 — датування сумнівне:
        двір у Schleswig/Gottorp герцог Frederik влаштував лише близько 1522 р.<sup>[ref:galster-1934-gottorp-moentsmedje-1522]</sup>, рейнський гульден у його карбуванні запроваджує лише Møntordning 1524<sup>[ref:wilcke-1950-moentordning-1524]</sup>,
        перший його гульден — Malmø 1527<sup>[ref:danskmoent-f1-rhinsk-gylden-1527]</sup>; герцогського золота Galster і Wilcke не знають.'
      da: 'Sct. Andreas stående med kors, Holstens skjold ved fødderne / våbenskjoldene fra Holsten, Slesvig, Stormarn og Norge omkring et lille Oldenborgskjold. Omskrift: «FRIDERICVS - D HOLSACI.» («Frederik,
        hertug af Holsten») / «MO. NOV. AVREA. SLESVICENSIS.» («ny guldmønt fra Slesvig»). Berlinereksemplaret (Münzkabinett Berlin, 3,25 g) dateres af IKMK «o. 1506» efter Dannenberg 1859 — en tvivlsom
        datering: mønten på Schleswig/Gottorp indrettede hertug Frederik først omkring 1522<sup>[ref:galster-1934-gottorp-moentsmedje-1522]</sup>, den rhinske gylden indføres i hans udmøntning først med
        møntordningen af 1524<sup>[ref:wilcke-1950-moentordning-1524]</sup>, hans første gylden er Malmø 1527<sup>[ref:danskmoent-f1-rhinsk-gylden-1527]</sup>; hertugeligt guld kender Galster og Wilcke
        ikke.'
