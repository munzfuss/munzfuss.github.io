      de: Technischer Sammelbucket für bulk-importierte Münzen aus Numista. Bei künftiger Detail-Bearbeitung wandern die Stücke in den jeweils passenden eigentlichen Müntzfuß.
      en: Technical catch-all bucket for bulk-imported coins from Numista. On future detailed work the pieces will move to their proper Münzfuß.
      uk: Технічний загальний кошик для bulk-імпортованих монет із Numista. При майбутній детальній роботі монети перейдуть у відповідну Müntzfuß.
