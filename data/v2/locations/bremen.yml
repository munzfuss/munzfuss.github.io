summary:
  de: Freie Hansestadt Bremen — Münzprägung der Stadt Bremen, vom Erzbisthum Bremen-Verden zu unterscheiden. Die Reichswährungsmünzen ab 1871 erscheinen auch auf der Seite Deutsches Reich.
  en: Free Hanseatic City of Bremen — the coinage of the city of Bremen, distinct from the Archbishopric of Bremen-Verden. The Reich-currency coins from 1871 also appear on the German Empire page.
  uk: Вільне ганзейське місто Bremen — карбування міста Bremen, відмінне від Архієпископства Бремен-Верден. Монети Reichswährung з 1871 року показані також на сторінці Німецької імперії.
