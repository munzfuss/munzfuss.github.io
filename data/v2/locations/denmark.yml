name:
  de: Königreich Dänemark
  en: Kingdom of Denmark
  uk: Королівство Данія
  da: Kongeriget Danmark
summary:
  de: Die Epoche des standardisierten dänischen Müntzwesens (1514–1914) — vom Christian-II-Lovkompleks 1514–1515 (Møntordning af Sommeren 1514 (Malmø), Norge-Forordning 3. August 1514, Sjælland åbent Brev 24. August 1515) als erstem umfassenden Müntzgesetz für beide Metalle, über die Møntordningen Christians III. af 20. september 1541, biß zum Ausklingen des Silber-Gold-Standards 1914. Hauptmüntzstätte ist Kopenhagen, weitere Müntzstätten u. a. in Altona, Flensborg, Frederiksborg, Glückstadt, Haderslev, Helsingør, Kristianstad und Kongsberg. Das Register umfaßt das Korpus der dänisch-norwegischen Møntfødder — von Nobler und Rhinsk Gylden des Christian-II-Lovkomplexes über die Christian-III-Daler-Tradition und die Speciedaler-Standards (9- und 9¼-Fuß), Reichsdukaten- und Courantdukatenfuß, Guldkrone und die Kronemønt-Stufen biß zum Rigsbankdaler und der Krone-Reform 1873–1875.
  en: The era of standardised Danish coinage (1514–1914) — from the Christian II Lovkompleks of 1514–1515 (Møntordning Summer 1514 Malmø, Norge ordinance 3 August 1514, Sjælland åbent Brev 24 August 1515) as the first comprehensive coinage act for both metals, through Christian III's Møntordning of 20 September 1541, to the close of the silver-gold standard in 1914. The principal mint is Copenhagen, with additional mints at Altona, Flensborg, Frederiksborg, Glückstadt, Haderslev, Helsingør, Kristianstad and Kongsberg. The register holds the corpus of Danish-Norwegian Møntfødder — from the Nobler and Rhinsk Gylden of the Christian II Lovkompleks through the Christian-III-Daler tradition and the Speciedaler standards (9-Fuß and 9¼-Fuß), Reichsdukatenfuß and Courantdukatenfuß, Guldkrone and the Kronemønt stages, to the Rigsbankdaler and the Krone reform of 1873–1875.
  uk: Доба стандартизованого монетного карбування Данського королівства (1514–1914) — від Lovkompleks Кристіана II 1514–1515 років (Møntordning літа 1514 у Malmø, норвезький ордонанс 3 серпня 1514, Sjælland åbent Brev 24 серпня 1515) як першого всеосяжного монетного акту для обох металів, через Møntordning Кристіана III 20 вересня 1541 року, до завершення срібно-золотого стандарту 1914 року. Головний монетний двір — Копенгаген, додаткові — в Альтоні, Фленсборзі, Фредеріксборзі, Ґлюкштадті, Гадерслеві, Гельсінгері, Кристіанстаді та Конгсберзі. У реєстрі — корпус Møntfødder дансько-норвезької корони, від Nobler і Rhinsk Gylden Кристіана-II-Lovkomplekс-у через далерову традицію Кристіана III і стандарти Speciedaler (9-Fuß і 9¼-Fuß), Reichsdukatenfuß і Courantdukatenfuß, Guldkrone та фази Kronemønt — до Rigsbankdaler і Krone-реформи 1873–1875 років.
  da: Epoken for det standardiserede danske møntvæsen (1514–1914) — fra Christian 2.s lovkompleks 1514–1515 (Møntordning af sommeren 1514 (Malmø), Norge-forordningen af 3. august 1514, Sjælland åbent Brev af 24. august 1515) som den første samlede møntlov for begge metaller, over Christian 3.s Møntordning af 20. september 1541, til sølv- og guldstandardens udløb i 1914. Hovedmøntstedet er København; andre møntsteder er bl.a. Altona, Flensborg, Frederiksborg, Glückstadt, Haderslev, Helsingør, Kristianstad og Kongsberg. Registret omfatter korpusset af dansk-norske møntfødder — fra Christian 2.s lovkomplekses nobler og rhinske gylden over Christian 3.s dalertradition og speciedalerstandarderne (9- og 9¼-Fuß), Reichsdukatenfuß og Courantdukatenfuß, Guldkrone og kronemøntens trin til Rigsbankdaler og kronereformen 1873–1875.
