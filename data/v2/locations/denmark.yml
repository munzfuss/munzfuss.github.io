        en: Frederik III · Copenhagen 1655 + Glückstadt 1657–1660 + Copenhagen 1666
        uk: Фредерік III · Копенгаген 1655 + Glückstadt 1657–1660 + Копенгаген 1666
        da: Frederik 3. · København 1655, Glückstadt 1657–1660 og København 1666
      description:
        de: 'Hauptprägephase Frederiks III. am Guldkrone-Standardstandard (.917, ≈ 5,996 g rauh, Tarif 3½ Speciedaler). Hede 1971 verzeichnet zwei Münzstätten-Reihen: <b>Glückstadt 1657–1660</b> (f3h145; Mzm. Jacob Schwieger, kanonischer Standardtyp) und <b>Kopenhagen 1666</b><sup>[ref:danskmoent-f3h44]</sup> (f3h44 für 1 Guldkrone, f3h45 für 2 Guldkrone — letzteres bei 11,181 g rauh = 2 × 5,59 g). Tarif unverändert; 1666 zeigt Hede gegenüber dem Glückstädter Standard eine leichte Rauungewicht-Reduktion (5,59 g vs 5,996 g), die Phase B (1668) als ausgewiesene Tarifreduktion ablöst.<br><br><b>Umbenennung der Stückbezeichnung 1655:</b> mit dem Wiederaufnahme der Karbung in Kopenhagen vollzieht Frederik III. eine nominale Halbierung der Einheitsbenennung — was unter Christian IV. «<i>2 Guldkrone</i>» (Hede 25, ~5,996 g rau) hieß, wird nun «<i>1 Guldkrone</i>» (Hede 145B in Glückstadt, später f3h44 in Kopenhagen). Physisch ändert sich nichts: Raugewicht und 22-Karat-Probe bleiben unverändert; halbiert wird nur die nominale Stückbenennung. Hede 1957 dokumentiert den Wechsel verbatim in Fußnote (1): «<i>Betegnelsen guldkrone dækker under Frederik III den mønt, Christian IV kaldte 2 guldkrone</i>»<sup>[ref:danskmoent-f3guldkr]</sup>.'
        en: 'Frederik III main minting phase at the Guldkrone standard (.917, ≈ 5.996 g raw, tariff 3½ Speciedaler). Hede 1971 records two mint runs: <b>Glückstadt 1657–1660</b> (f3h145; mintmaster Jacob Schwieger, canonical standard type) and <b>Copenhagen 1666</b><sup>[ref:danskmoent-f3h44]</sup> (f3h44 for the 1 Guldkrone, f3h45 for the 2 Guldkrone at 11.181 g raw = 2 × 5.59 g). Tariff unchanged; the Copenhagen 1666 issue already shows a small rough-weight reduction (5.59 g vs 5.996 g) ahead of the formal tariff drop documented under phase B (1668).<br><br><b>Renaming of the unit designation in 1655:</b> with the resumption of minting in Copenhagen Frederik III halves the nominal unit name — what under Christian IV had been called «<i>2 Guldkrone</i>» (Hede 25, ~5.996 g raw) is now «<i>1 Guldkrone</i>» (Hede 145B in Glückstadt, later f3h44 in Copenhagen). Physically nothing changes: rough weight and 22-carat fineness stay the same; only the nominal unit name is halved. Hede 1957 records the shift verbatim in footnote (1): «<i>Betegnelsen guldkrone dækker under Frederik III den mønt, Christian IV kaldte 2 guldkrone</i>»<sup>[ref:danskmoent-f3guldkr]</sup>.'
        uk: 'Основна емісійна фаза Фредеріка III. за стандартним Guldkrone-стандартом (.917, ≈ 5,996 г повної ваги, тариф 3½ Speciedaler). Hede 1971 фіксує дві монетдвірські серії: <b>Glückstadt 1657–1660</b> (f3h145; монетмайстер Jacob Schwieger, канонічний еталонний тип) і <b>Копенгаген 1666</b><sup>[ref:danskmoent-f3h44]</sup> (f3h44 для 1 Guldkrone, f3h45 для 2 Guldkrone при 11,181 г повної ваги = 2 × 5,59 г). Тариф незмінний; Копенгаген 1666 показує невелике зниження повної ваги (5,59 г проти 5,996 г) перед формальним зниженням тарифу, задокументованим у фазі B (1668).<br><br><b>Перейменування одиниці 1655 р.:</b> із відновленням карбування в Копенгагені Фредерік III номінально вдвічі зменшує назву одиниці — те, що під Кристіаном IV називалось «<i>2 Guldkrone</i>» (Hede 25, ~5,996 г повної ваги), тепер «<i>1 Guldkrone</i>» (Hede 145B у Glückstadt, пізніше f3h44 у Копенгагені). Фізично нічого не змінюється: повна вага і 22-каратна проба незмінні; вдвічі зменшується лише номінальна одинична назва. Hede 1957 фіксує зміну verbatim у виносці (1): «<i>Betegnelsen guldkrone dækker under Frederik III den mønt, Christian IV kaldte 2 guldkrone</i>»<sup>[ref:danskmoent-f3guldkr]</sup>.'
    - id: II
      year_from: 1668
      year_to: 1668
      from_label: '1668'
      to_label: '1668'
      title:
        de: Frederik III. · Kopenhagen · Tarif 3 Speciedaler (Tarifsenkung)
        en: Frederik III · Copenhagen · tariff 3 Speciedaler (tariff reduction)
        uk: Фредерік III · Копенгаген · тариф 3 Speciedaler (зниження тарифу)
        da: Frederik 3. · København · tarif 3 speciedaler (tarifnedsættelse)
      description:
        de: 'Späte Kopenhagener Folgeprägung der Guldkrone-Serie 1668: Tarif gegenüber der Glückstadter Phase 1657–1660 von 3½ auf <b>3 Speciedaler = 18 Mark Dansk</b> reduziert, Raugewicht von 5,996 auf 5,47 g abgesenkt. Feingehalt unverändert .917 (22 Karat). Belegtyp: <b>KM# 303 / Friedberg# 92 / Numista N#308327</b>; Münzmeister <b>Gotfred Krüger</b> (Kopenhagen 1664–1680), Mzz. <b>GK</b>. Reverslegende «<i>Dominus Providebit</i> XVIII · M · 1668 · G · K ·».'
        en: 'A late Copenhagen follow-up to the Guldkrone series in 1668: tariff reduced from the Glückstadt phase 1657–1660 of 3½ to <b>3 Speciedaler = 18 Mark Dansk</b>, rough weight lowered from 5.996 to 5.47 g. Fineness unchanged at .917 (22 carat). Reference type: <b>KM# 303 / Friedberg# 92 / Numista N#308327</b>; mintmaster <b>Gotfred Krüger</b> (Copenhagen 1664–1680), mintmark <b>GK</b>. Reverse legend «<i>Dominus Providebit</i> XVIII · M · 1668 · G · K ·».'
        uk: 'Пізніший копенгагенський наступний випуск серії Guldkrone 1668 р.: тариф знижено з ґлюкштадтської фази 1657–1660 з 3½ до <b>3 Speciedaler = 18 Mark Dansk</b>, повна вага зменшена з 5,996 до 5,47 г. Проба незмінна .917 (22 карати). Еталонний тип: <b>KM# 303 / Friedberg# 92 / Numista N#308327</b>; монетмайстер <b>Gotfred Krüger</b> (Копенгаген 1664–1680), монограма <b>GK</b>. Легенда реверсу «<i>Dominus Providebit</i> XVIII · M · 1668 · G · K ·».'
      context:
        de: '<b>Außerhalb Holsteins, eingearbeitet zur Vollständigkeit der Frederik-III.-Tarif-Serie:</b> die Münze wurde in Kopenhagen geprägt, gehört also nicht zum Kern-Skopus dieses Verzeichnisses. Sie ist hier aufgeführt, weil sie das einzige weitere bekannte Stück der <i>Guldkrone</i>-Tarifserie überhaupt ist und das Tarifregime der Glückstadter Phase 1657–1660 historisch ablöst.<br><br>

          <b>Müntzfuß-Verhältnis zur Glückstadter Form:</b> bei gleichem Feingehalt .917 ist das Raugewicht um ≈ 8,8 % gesenkt (5,47 statt 5,996 g) — das Feinsilberäquivalent geht entsprechend zurück. Aus der Cöllnischen Marck Raulegierung lassen sich nun ≈ 233,856 ÷ 5,47 ≈ 42,75 Stück je Marck schlagen, gegen 39 in Glückstadt. Da die Form keine glatte ganze Zahl ergibt und der Tarif ebenfalls nicht zum 22-karätigen Raugewicht passt (3 Specie ≈ 18 Mark Dansk), liegt physikalisch ein eigener Müntzfuß vor — die Münze wird in der Δ-Spalte daher als «außer Remedium» gegen die kanonische Glückstadter Form ausgewiesen.

          '
        en: <b>Outside Holstein, included for completeness of the Frederik III tariff series:</b> the coin was struck in Copenhagen, so it does not belong to the core scope of this register. It is listed here because it is the only other known piece of the <i>Guldkrone</i> tariff series and historically supersedes the tariff regime of the Glückstadt phase 1657–1660.<br><br> <b>Standard relative to the Glückstadt form:</b> at the same fineness .917 the rough weight is reduced by ≈ 8.8 % (5.47 g instead of 5.996 g) — fine-silver equivalent falls in step. From a Cologne mark of raw alloy one now strikes ≈ 233.856 ÷ 5.47 ≈ 42.75 pieces per mark, versus 39 at Glückstadt. Since the form does not yield a clean integer and the tariff also fails to match the 22-carat rough weight (3 Specie ≈ 18 Mark Dansk), the coin physically belongs to its own standard — the Δ column accordingly flags it as «outside tolerance» against the canonical Glückstadt form.
        uk: <b>Поза Гольштейном, наведено для повноти тарифної серії Фредеріка III:</b> монету викарбувано в Копенгагені, тож вона не належить до основного скоупу цього реєстру. Включена тут, бо це єдина інша відома штука серії <i>Guldkrone</i> і вона історично змінює тарифний режим ґлюкштадтської фази 1657–1660.<br><br> <b>Стопа щодо ґлюкштадтської форми:</b> при тій же пробі .917 повна вага знижена на ≈ 8,8 % (5,47 г замість 5,996 г) — чистий срібно-золотий еквівалент пропорційно падає. З кельнської марки сплаву тепер виходить ≈ 233,856 ÷ 5,47 ≈ 42,75 штук на марку проти 39 у Glückstadt. Оскільки форма не дає круглого цілого числа й тариф теж не відповідає 22-каратному повному вагому (3 Specie ≈ 18 Mark Dansk), монета фізично належить до власної стопи — у стовпці Δ її буде відмічено як «поза допуском» щодо канонічної ґлюкштадтської форми.
        da: '<b>Uden for Holsten, medtaget for at gøre Frederik 3.s tarifserie fuldstændig:</b> mønten blev præget i København og hører altså ikke til dette registers kerneområde. Den er anført her, fordi den er det eneste andet kendte stykke af <i>Guldkrone</i>-tarifserien overhovedet, og fordi den historisk afløser tarifordningen fra Glückstadt-fasen 1657–1660.<br><br>

  <b>Forholdet til den glückstadtske form som møntfod:</b> ved samme lødighed .917 er bruttovægten sat ned med ≈ 8,8 % (5,47 i stedet for 5,996 g) — sølvækvivalenten falder tilsvarende. Af Cöllnische Marck rå legering kan der nu slås ≈ 233,856 ÷ 5,47 ≈ 42,75 stykker pr. mark mod 39 i Glückstadt. Da formen ikke giver noget rundt heltal, og tariffen heller ikke passer til bruttovægten ved 22 karat (3 species ≈ 18 mark dansk), foreligger der fysisk en selvstændig møntfod — mønten anføres derfor i Δ-kolonnen som «uden for remedium» i forhold til den kanoniske glückstadtske form.'
    - id: III
      year_from: 1701
      year_to: 1701
      from_label: '1701'
      to_label: '1701'
      title:
        de: Friedrich IV. · Kopenhagen · Prägung für die Vestindische Compagnie
        en: Frederik IV · Copenhagen · striking for the West India Company
        uk: Фредерік IV · Копенгаген · карбування для Вест-Індської компанії
        da: Frederik 4. · København · prægning for Vestindisk Kompagni
      description:
        de: 'Letzte dänische Guldkrone: eine 2-Guldkrone, 1701 in Kopenhagen für die Vestindische Compagnie geprägt<sup>[ref:danskmoent-1guldkro-vestindisk-1701]</sup>. Kein Exemplar ist erhalten («kendes ikke mere»); der Typ ist ausschließlich literarisch überliefert — Ramus S. 192, Wilcke III S. 20, NFM X S. 87<sup>[ref:danskmoent-f4hede-30]</sup> (Hede 30). Raugewicht, Feingehalt und Tarif sind in den vorliegenden Quellen nicht angegeben.'
        en: 'The last Danish Guldkrone: a 2 Guldkrone struck at Copenhagen in 1701 for the West India Company<sup>[ref:danskmoent-1guldkro-vestindisk-1701]</sup>. No specimen survives («kendes ikke mere»); the type is documented in literature only — Ramus p. 192, Wilcke III p. 20, NFM X p. 87<sup>[ref:danskmoent-f4hede-30]</sup> (Hede 30). Rough weight, fineness and tariff are not given in the available sources.'
        uk: 'Остання данська Guldkrone: 2 Guldkrone, викарбувана 1701 р. в Копенгагені для Вест-Індської компанії<sup>[ref:danskmoent-1guldkro-vestindisk-1701]</sup>. Жоден екземпляр не зберігся («kendes ikke mere»); тип задокументовано лише в літературі — Ramus s. 192, Wilcke III s. 20, NFM X s. 87<sup>[ref:danskmoent-f4hede-30]</sup> (Hede 30). Повна вага, проба й тариф у наявних джерелах не вказані.'
  kronemont_fine:
    - id: I
      year_from: 1693
      year_to: 1771
      from_label: '1693'
      to_label: '1771'
      title:
        de: Christian V. → Christian VII. · Kopenhagener Hauptmünze · «Feine Krone»
        en: Christian V → Christian VII · Copenhagen royal mint · «Fine Crown»
        uk: Кристіан V → Кристіан VII · Копенгагенський королівський монетний двір · «Тонка Крона»
        da: Christian 5. → Christian 7. · den københavnske hovedmønt · «fin krone»
      description:
        de: 'Einzige Phase der dänischen «Feinen Krone»: nach dem Reskript Christians V. vom 31. Dezember 1692 werden 13 Specieskronen aus 1 feinen Cöllnischen Marck ausgeprägt — Feingewicht ≈ 14,98 g je Krone (gegenüber 14,964 g im Glückstadter 10½-Krone-Fuß). Geprägt ausschließlich an der Kopenhagener Hauptmünze 1693–1771 unter den Münzmeistern der jeweiligen Regenten (Christian V. biß 1699, Friedrich IV. 1699–1730, Christian VI. 1730–1746, Friedrich V. 1746–1766, Christian VII. 1766–1808). Tarif ⅔ Speciedaler durchgehend übernommen. Ältere Bestände kursierten biß zum Statsbankerot 5. Januar 1813.'
        en: 'Sole phase of the Danish «Fine Crown»: per Christian V''s Reskript of 31 December 1692, 13 Specieskronen are struck from 1 fine Cologne mark — fine weight ≈ 14.98 g per Krone (versus 14.964 g in the Glückstadt 10½-Krone-Fuß). Struck exclusively at the Copenhagen royal mint 1693–1771 under the mintmasters of the respective regents (Christian V to 1699, Friedrich IV 1699–1730, Christian VI 1730–1746, Friedrich V 1746–1766, Christian VII 1766–1808). The ⅔-Speciedaler tariff is carried through unchanged. Older stocks remained in circulation until the Statsbankerot of 5 January 1813.'
        uk: 'Єдина фаза данської «Тонкої Корони»: за Рескриптом Кристіана V від 31 грудня 1692 р. карбується 13 Specieskronen з 1 марки чистого срібла кельнської ваги — чиста вага ≈ 14,98 г на одну Krone (проти 14,964 г у ґлюкштадтському 10½-Krone-Fuß). Карбувалася виключно на Копенгагенському королівському монетному дворі 1693–1771 за монетмайстрів відповідних регентів (Кристіан V до 1699, Фредерік IV 1699–1730, Кристіан VI 1730–1746, Фредерік V 1746–1766, Кристіан VII 1766–1808). Тариф ⅔ Speciedaler зберігається без змін. Старі запаси в обігу до Statsbankerot 5 січня 1813.'
  11_333_thaler:
    - id: I
      year_from: 1726
      year_to: 1813
      from_label: 15./31. Juli 1726
      to_label: 5. Januar 1813
      title:
        de: Kurantmøntfod im dänisch-norwegischen Verbund · Hauptalltagswährung
        en: Kurantmøntfod in the Danish-Norwegian composite state · main everyday currency
        uk: Kurantmøntfod у Королівстві Данії і Норвегії · основна повсякденна валюта
        da: Kurantmøntfod i det dansk-norske forbund · den daglige hovedvaluta
      description:
        de: 'Etabliert durch die Forordning Friedrichs IV. vom 15./31. Juli 1726: 11⅓ Rigsdaler Courant aus 1 feinen Cöllnischen Marck — Feingewicht ≈ 20,63 g pro Daler. Hauptträger des dänisch-norwegischen Geldumlaufs während fast des gesamten 18. Jahrhunderts (Friedrich IV., Christian VI., Friedrich V., Christian VII., Friedrich VI.). Endet im Königreich Dänemark mit dem Statsbankerot vom 5. Januar 1813 (Forordning Friedrichs VI.); in Holstein tritt der Kurant ab 1788 (Schimmelmann-Reform, Speciesbank) hinter den Speciedaler zurück, bleibt aber in Kraft und wird in Altona weiter geprägt. Altbestände 1726–1813 blieben ab 1813 noch jahrzehntelang als Scheidemünzen im Umlauf, biß zur Krone-Reform 1875.'
        en: 'Established by Friedrich IV''s Forordning of 15/31 July 1726: 11⅓ Rigsdaler Courant from 1 fine Cologne mark — fine weight ≈ 20.63 g per daler. Principal vehicle of the Danish-Norwegian money supply through most of the 18th century (Friedrich IV, Christian VI, Friedrich V, Christian VII, Friedrich VI). In the Kingdom of Denmark it ends with the Statsbankerot of 5 January 1813 (Forordning of Friedrich VI); in Holstein the kurant recedes behind the Speciedaler from the Schimmelmann reform of 1788 (Speciesbank) onward, but it is not abolished and is still struck at Altona. Old stocks from 1726–1813 remained in circulation as petty coinage for decades after 1813, until the Krone reform of 1875.'
        uk: 'Встановлений Forordning Фредеріка IV від 15/31 липня 1726 р.: 11⅓ Rigsdaler Courant з 1 марки чистого срібла кельнської ваги — чиста вага ≈ 20,63 г на даллер. Основний носій дансько-норвезького грошового обігу впродовж майже всього XVIII ст. (Фредерік IV, Кристіан VI, Фредерік V, Кристіан VII, Фредерік VI). У Королівстві Данії дія тривала до Statsbankerot 5 січня 1813 (Forordning Фредеріка VI); у Гольштейні kurant від реформи Шіммельмана 1788 р. (Speciesbank) відступає за Speciedaler, але не скасовується і далі карбується в Альтоні. Старі запаси 1726–1813 ще десятиліттями залишалися в обігу як розмінна монета після 1813 — аж до Krone-реформи 1875.'
  18_5_thaler:
    - id: I
      year_from: 1813
      year_to: 1875
      from_label: 5. Januar 1813
      to_label: 1873/1875
      title:
        de: Rigsbankdaler → Rigsdaler Rigsmønt · Krone-Reform
        en: Rigsbankdaler → Rigsdaler Rigsmønt · Krone reform
        uk: Rigsbankdaler → Rigsdaler Rigsmønt · Krone-реформа
        da: Rigsbankdaler → Rigsdaler Rigsmønt · kronereformen
      description:
        de: Notreform Friedrichs VI. nach dem dänischen Staatsbankrott. Forordning vom 5. Januar 1813 setzt 18½ Rigsbankdaler aus 1 feinen Cöllnischen Marck (≈ 12,64 g fein pro Daler). §10 verankert ausdrücklich 1 Speciedaler = 2 Rigsbankdaler — eine glatte ½-Anteil-Anbindung an den 9¼-Thaler-Fuß, die den Übergang vom Kurantfuß logisch glättet. 1854 ohne Fußänderung in Rigsdaler Rigsmønt umbenannt; 1873–1875 ersetzt die Krone der Skandinavischen Münzunion (Schweden, Norwegen, Dänemark) den Rigsdaler.
        en: Friedrich VI's emergency reform after the Danish state bankruptcy. The Forordning of 5 January 1813 sets 18½ Rigsbankdaler per fine Cologne mark (≈ 12.64 g fine per daler). §10 explicitly anchors 1 Speciedaler = 2 Rigsbankdaler — a clean ½-share link to the 9¼-Thaler-Fuß that smoothly carries the transition from the Kurantfuß. Renamed Rigsdaler Rigsmønt in 1854 without any change of standard; in 1873–1875 the Krone of the Scandinavian Monetary Union (Sweden, Norway, Denmark) supersedes the Rigsdaler.
        uk: Надзвичайна реформа Фредеріка VI після данського державного банкрутства. Forordning 5 січня 1813 встановлює 18½ Rigsbankdaler з 1 марки чистого срібла кельнської ваги (≈ 12,64 г чистого на даллер). §10 явно закріплює 1 Speciedaler = 2 Rigsbankdaler — чиста привʼязка ½-частки до 9¼-Thaler-Fuß, яка логічно згладжує перехід з Kurantfuß. 1854 р. перейменовується на Rigsdaler Rigsmønt без зміни стопи; 1873–1875 рр. Krone Скандинавської монетної унії (Швеція, Норвегія, Данія) заміщує Rigsdaler.
  kronefod:
    - id: I
      year_from: 1873
      year_to: 1914
      from_label: 23. maj 1873 (Møntloven)
      to_label: 2. Aug. 1914 (Goldkonvertibilität ausgesetzt)
      title:
        de: Skandinavische Krone-Mønt — Gold-Hauptkurant + Silber/Bronze-Subsidiare — Christian IX. → Christian X.
        en: Scandinavian Krone-Mønt — gold Hauptkurant + silver/bronze subsidiaries — Christian IX → Christian X
        uk: Скандинавська Krone-Mønt — золотий Hauptkurant + срібні/бронзові субсидіари — Христіян IX → Христіян X
        da: Den skandinaviske kronemønt — guld som hovedkurant, sølv og bronze som underordnede — Christian 9. → Christian 10.
      description:
        de: 'Vollständige Krone-Mønt-Reihe nach <b>Møntloven af 23. maj 1873</b>: <b>Gold</b> 10 / 20 Kroner (.900), <b>Silber-Kurant</b> 1 / 2 Kroner (.800), <b>Silber-Scheide</b> 25 / 10 øre (.600 / .400), <b>Bronze</b> 5 / 2 / 1 øre — alle Stückelungen aus demselben Müntzfuß unter einheitlichem Akkonto-System (100 øre = 1 Krone). Tarif gegenüber Reichs-Goldmark fest 8 Kroner = 9 Mark; Goldkonvertibilität durch die Danmarks Nationalbank am 2. August 1914 ausgesetzt.'
        en: 'Full Krone-Mønt series under the <b>Møntloven af 23. maj 1873</b>: <b>gold</b> 10 / 20 Kroner (.900), <b>silver Kurant</b> 1 / 2 Kroner (.800), <b>silver Scheide</b> 25 / 10 øre (.600 / .400), <b>bronze</b> 5 / 2 / 1 øre — all denominations from the same coinage standard on a uniform accounting system (100 øre = 1 Krone). Tariff against the Reichsmark fixed at 8 Kroner = 9 Mark; gold convertibility suspended by Danmarks Nationalbank on 2 August 1914.'
        uk: 'Повна серія Krone-Mønt за <b>Møntloven af 23. maj 1873</b>: <b>золото</b> 10 / 20 Krone (.900), <b>срібний Kurant</b> 1 / 2 Krone (.800), <b>срібний Scheide</b> 25 / 10 øre (.600 / .400), <b>бронза</b> 5 / 2 / 1 øre — усі номінали з однієї стопи за єдиною обліковою системою (100 øre = 1 Krone). Тариф проти Reichsmark фіксований 8 Krone = 9 Mark; конвертованість у золото призупинено Danmarks Nationalbank 2 серпня 1914.'
      mt_caption:
