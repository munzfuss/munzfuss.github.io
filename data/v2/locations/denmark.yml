fuss_periods:
  nobel_fod:
    pdate_label:
      de: 'Geltungsbereich: 1496 → 1532 · 36 Jahre'
      en: 'Period of validity: 1496 → 1532 · 36 years'
      uk: 'Період дії: 1496 → 1532 · 36 років'
      da: 'Gyldighedsområde: 1496 → 1532 · 36 år'
    closing_label:
      de: Zusammenfassung · Ende der Nobel-Linie
      en: Summary · end of the Nobel line
      uk: Підсумок · кінець лінії Nobel
      da: Sammenfatning · Nobel-linjens ophør
    closing:
      de: 'Nach 1532 ist keine weitere Nobel-Karbung dokumentiert<sup>[ref:danskmoent-1nobel]</sup>. Eine schwere Goldlinie in DK wird erst 1611 unter Christian IV. mit dem Rosenobel wieder aufgenommen — ein eigener Müntzfuß<sup>[ref:danskmoent-1rosenob]</sup> ([fuss:rosenobel_fod]), nicht die Fortsetzung des Nobel.'
      en: 'No further Nobel coinage is documented after 1532<sup>[ref:danskmoent-1nobel]</sup>. A heavy gold line is not revived in Denmark until 1611 under Christian IV with the Rosenobel — a separate coinage standard<sup>[ref:danskmoent-1rosenob]</sup> ([fuss:rosenobel_fod]), not a continuation of the Nobel.'
      uk: 'Подальше карбування Nobel після 1532 не задокументовано<sup>[ref:danskmoent-1nobel]</sup>. Важка золота лінія в Данії відновлюється лише 1611 за Christian IV із Rosenobel — окрема стопа<sup>[ref:danskmoent-1rosenob]</sup> ([fuss:rosenobel_fod]), а не продовження Nobel.'
  8_5_gylden_fod:
    pdate_label:
      de: 'Geltungsbereich: 1514 → 1523 · 9 Jahre'
      en: 'Period of validity: 1514 → 1523 · 9 years'
      uk: 'Період дії: 1514 → 1523 · 9 років'
      da: 'Gyldighedsområde: 1514 → 1523 · 9 år'
    closing_label:
      de: Zusammenfassung · 10 Jahre Christian-II-Silber-Lovkompleks · drei Phasen
      en: Summary · 10 years of the Christian II silver Lovkompleks · three phases
      uk: Підсумок · 10 років срібного Lovkompleks Кристіана II · три фази
      da: Sammenfatning · 10 år med Christian 2.s sølv-lovkompleks · tre faser
    closing:
      de: 'Das <b>Christian-II-Lovkompleks</b> ist die genealogische Wurzel der post-mittelalterlichen Sølvgylden-Skilling-Hvid-Tradition im dänisch-norwegischen Reich. Der 14-Lod (.875)-Hauptkurant-Anker wird unverändert von Frederik I 1524 übernommen ([fuss:8_gylden_fod]), dann von Christian III 1541 leicht auf 14½ Lod (.906) angehoben ([fuss:8_daler_fod]). Die Skilling-Scheidemünz-Logik (.359 Probe, weit über dem Sølvgylden-Fein-Wert tariffiert) ist das früheste systematische Beispiel der Token-Münzgebung im Reich.'
      en: 'The <b>Christian II Lovkompleks</b> is the genealogical root of the post-medieval Sølvgylden-Skilling-Hvid tradition in the Danish-Norwegian realm. The 14-Lod (.875) Hauptkurant anchor is taken over unchanged by Frederik I in 1524 ([fuss:8_gylden_fod]), then raised slightly by Christian III in 1541 to 14½ Lod (.906) ([fuss:8_daler_fod]). The Skilling Scheidemünze logic (.359 fineness, tariffed far above the Sølvgylden fine value) is the earliest systematic example of token coinage in the realm.'
      uk: '<b>Lovkompleks Кристіана II</b> — генеалогічний корінь пост-середньовічної традиції Sølvgylden-Skilling-Hvid у дансько-норвезькому реалмі. Якір Hauptkurant 14 Lod (.875) незмінно переймає Frederik I 1524 р. ([fuss:8_gylden_fod]), потім Кристіан III 1541 р. злегка піднімає до 14½ Lod (.906) ([fuss:8_daler_fod]). Логіка Skilling-Scheidemünze (проба .359, тарифована значно вище фейн-вартості Sølvgylden) — найраніший систематичний приклад токенної монети в реалмі.'
  8_gylden_fod:
    pdate_label:
      de: 'Geltungsbereich: 1524 → 1532 · 8 Jahre'
      en: 'Period of validity: 1524 → 1532 · 8 years'
      uk: 'Період дії: 1524 → 1532 · 8 років'
      da: 'Gyldighedsområde: 1524 → 1532 · 8 år'
    closing_label:
      de: Zusammenfassung · 8 Jahre 8-Gylden-Fod · Lybsk-Tarif + Klipping-Indfrielse
      en: Summary · 8 years of 8-Gylden-Fod · Lybsk tariff + Klipping redemption
      uk: Підсумок · 8 років 8-Gylden-Fod · Lybsk-тариф + Klipping-обмін
      da: Sammenfatning · 8 år med 8-Gylden-Fod · lybsk tarif + klippingindfrielse
    closing:
      de: 'Die <b>8-Gylden-Fod</b> ist der erste dänische Müntzfuß mit <b>Lybsk-aligned 24-ß-Mark-Subdivision</b> — strukturell ein Vorläufer der späteren Schleswig-Holstein-Helstaten-Müntzwesen-Lineage. Der 14-Lod-Anker bleibt vom Christian-II-Lovkompleks erhalten; das spätere Christian-III-Daler 1541 hebt die Probe auf 14½ Lod und etabliert den Daler als 1/3-Untertheilung anstelle der Sølvgylden-Untertheilung. Reine Reckoning-Konvergenz mit dem Hansestädernes Mynt 1524; volle metrische Konvergenz mit der Schleswig-Holstein-Lybsk-Linie erst 1547 (Flensborg Bestalling, [fuss:8_daler_lybsk_fod]).'
      en: '<b>8-Gylden-Fod</b> is the first Danish coinage standard with a <b>Lybsk-aligned 24-ß Mark subdivision</b> — structurally a precursor of the later Schleswig-Holstein-Helstaten coinage lineage. The 14-Lod anchor is preserved from the Christian II Lovkompleks; the later Christian III Daler of 1541 raises the fineness to 14½ Lod and establishes the Daler as a 1/3 subdivision in place of the Sølvgylden subdivision. Pure reckoning convergence with the Hansestädernes coinage in 1524; full metric convergence with the Schleswig-Holstein-Lybsk line only in 1547 (Flensborg Bestalling, [fuss:8_daler_lybsk_fod]).'
      uk: '<b>8-Gylden-Fod</b> — перша данська монетна стопа з <b>Lybsk-aligned 24-ß Mark-підструктурою</b> — структурно попередник пізнішої лінії Schleswig-Holstein-Helstaten-Müntzwesen. Якір 14 Lod збережено з Lovkompleks Кристіана II; пізніший Daler Кристіана III 1541 піднімає пробу до 14½ Lod і встановлює Daler як 1/3-підструктуру замість Sølvgylden-підструктури. Чиста reckoning-конвергенція з Hansestädernes-монетою 1524; повна метрична конвергенція з лінією Schleswig-Holstein-Lybsk лише 1547 р. (Flensborg Bestalling, [fuss:8_daler_lybsk_fod]).'
  8_daler_fod:
    pdate_label:
      de: 'Geltungsbereich: 1541 → 1555 · 14 Jahre'
      en: 'Period of validity: 1541 → 1555 · 14 years'
      uk: 'Період дії: 1541 → 1555 · 14 років'
      da: 'Gyldighedsområde: 1541 → 1555 · 14 år'
    closing_label:
      de: Zusammenfassung · 14 Jahre 8-Daler-Fod (baseline + 1544 Tillæg-Debasierung)
      en: Summary · 14 years of 8-Daler-Fod (baseline + 1544 debasement supplement)
      uk: Підсумок · 14 років 8-Daler-Fod (baseline + tillæg-девальвація 1544)
      da: Sammenfatning · 14 år med 8-Daler-Fod (udgangspunkt + forringelsen ved tillægget 1544)
    closing:
      de: 'Die <b>8-Daler-Fod</b> markiert die erste post-Reformations-Müntzfuß-Norm des dänisch-norwegischen Reichs. Phase A1 (1541-1543) baseline mf 8,827; Phase A2 (1544-1555) debasiert per Tillæg vom 27. September 1544 auf mf 9,481. Im Royalen Track parallel läuft seit 1547 die [fuss:8_daler_lybsk_fod] Lybsk-aligned ducal-zone (siehe nächste Sektion). Der Standard endet faktisch mit der Reichsmünzordnung 1559 und Frederik IIs 9-Fuß-Adoption ab 1566.'
      en: '<b>8-Daler-Fod</b> marks the first post-Reformation coinage-standard norm of the Danish-Norwegian realm. Phase A1 (1541-1543) baseline mf 8.827; Phase A2 (1544-1555) debased per Tillæg of 27 September 1544 to mf 9.481. Running in parallel from 1547 is the Lybsk-aligned ducal-zone [fuss:8_daler_lybsk_fod] (see next section). The standard effectively ends with the Reichsmünzordnung 1559 and Frederik II''s adoption of the 9-Fuß from 1566.'
      uk: '<b>8-Daler-Fod</b> позначає першу пост-реформаційну норму монетної стопи дансько-норвезького реалму. Фаза A1 (1541-1543) baseline mf 8,827; фаза A2 (1544-1555) знижена за Tillæg 27 вересня 1544 до mf 9,481. Паралельно з 1547 діє любекська ducal-zone [fuss:8_daler_lybsk_fod] (див. наступну секцію). Стандарт фактично завершується Reichsmünzordnung 1559 та адопцією 9-Fuß Фредеріком II з 1566 р.'
  8_daler_lybsk_fod:
    pdate_label:
      de: 'Geltungsbereich: 1547 → 1571 · 24 Jahre'
      en: 'Period of validity: 1547 → 1571 · 24 years'
      uk: 'Період дії: 1547 → 1571 · 24 роки'
      da: 'Gyldighedsområde: 1547 → 1571 · 24 år'
    closing_label:
      de: Zusammenfassung · 24 Jahre Lybsk-aligned ducal-zone (Saatkorn der 18½-Thaler-Fuß-Linie)
      en: Summary · 24 years of the Lybsk-aligned ducal zone (seed of the 18½-Thaler-Fuß lineage)
      uk: Підсумок · 24 роки любекської ducal-zone (зерно лінії 18½-Thaler-Fuß)
      da: Sammenfatning · 24 år med en lybsk-tilpasset hertugelig zone (spiren til 18½-Thaler-Fuß-linjen)
    closing:
      de: 'Die <b>8-Daler-Lybsk-Fod</b> ist der erste belegte Punkt, an dem die königliche (14½ Lod, 48 ß danske) und die dukale (14¼ Lod, 24 ß lybsk) Müntz-Linie strukturell auseinandertreten. Die Lybsk-aligned sub-Mark-Logik überlebt das Ende des Standards 1571 — sie migriert nach Glückstadt unter Christian IV (Krone-Mønt 1618+) und wird unter Frederik III als Rigsbankdaler-Standard (18½ Thaler je Cölln. Marck fein) formalisiert.'
      en: '<b>8-Daler-Lybsk-Fod</b> is the first documented point at which the royal (14½ Lod, 48 ß danske) and the ducal (14¼ Lod, 24 ß lybsk) coinage lines structurally diverge. The Lybsk-aligned sub-Mark logic survives the end of the standard in 1571 — it migrates to Glückstadt under Christian IV (Krone-Mønt 1618+) and is formalised under Frederik III as the Rigsbankdaler standard (18½ Thaler per Cologne mark fine).'
      uk: '<b>8-Daler-Lybsk-Fod</b> — перший задокументований момент, у якому королівська (14½ Lod, 48 ß danske) та герцогська (14¼ Lod, 24 ß lybsk) монетні лінії структурно розходяться. Любекська sub-Mark-логіка переживає завершення стандарту 1571 — мігрує до Glückstadt за Кристіана IV (Krone-Mønt 1618+) і формалізується за Фредеріка III як стандарт Rigsbankdaler (18½ Thaler з кельнської марки чистого срібла).'
  rhinsk_gylden_fod:
    pdate_label:
      de: 'Geltungsbereich: ~1496 → 1664 · 168 Jahre · königliche und herzogliche Linie'
      en: 'Period of validity: ~1496 → 1664 · 168 years · royal and ducal lines'
      uk: 'Період дії: ~1496 → 1664 · 168 років · королівська і герцогська лінії'
      da: 'Gyldighedsområde: ~1496 → 1664 · 168 år · den kongelige og den hertugelige linje'
    closing_label:
      de: Zusammenfassung · 135 Jahre Rhenish-Gulden-Lineage in der dänischen Königsmünze
      en: Summary · 135 years of the Rhenish-Gulden lineage in the Danish royal mint
      uk: Підсумок · 135 років лінії Rhenish-Gulden у данській королівській монеті
      da: Sammenfatning · 135 år med den rhinske gyldens linje i den danske kongemønt
    closing:
      de: 'Die <b>Rhinskgyldenfod</b> ist eine eigenständige Müntzfuß-Familie der Rhenish-Gulden-Tradition, parallel zum Reichsdukatenfuß ohne Tarif-Bindung. Die Karbung Hans'' ~1497 in Malmø geht jeder dänischen Ordonnanz voraus; die Møntordninger von 1514 und 1524 setzen die Probe dann auf 18 Karat, das kaiserliche Müntzedikt von 1559 auf 18½. Was die Stücke tatsächlich hielten, weicht davon in beide Richtungen ab: die Karbung Christians III. 1534-1536 liegt mit 18⅓ Karat über der dänischen Vorgabe und auf der im Reich üblichen Ausbringung, die Karbung Christians IV. 1625-1632 mit 18¼ Karat darunter — ohne daß eine Ordonnanz die Absenkung deckte. Mit dem Auslauf der Hauptphase 1632 und Christian IVs Pivot zur silbernen Krone-Mønt (Hebræermønt 1644, Glückstadter 10½-Krone-Fuß 1671) endet die Linie faktisch — Frederik III. setzt sie nicht fort.'
      en: '<b>Rhinskgyldenfod</b> is a standalone coinage-standard family of the Rhenish-Gulden tradition, parallel to the Reichsdukatenfuß without tariff binding. Hans'' coinage of ~1497 at Malmø precedes every Danish ordinance; the Møntordninger of 1514 and 1524 then set the fineness at 18 carats, and the imperial coinage edict of 1559 at 18½. What the pieces actually held departs from that in both directions: Christian III''s coinage of 1534-1536 stands at 18⅓ carats, above the Danish specification and on the customary output within the Empire, while Christian IV''s of 1625-1632 stands at 18¼, below it — with no ordinance to cover the reduction. With the end of the main phase in 1632 and Christian IV''s pivot to the silver Krone-Mønt (Hebræermønt 1644, Glückstadt 10½-Krone-Fuß 1671) the line effectively ends — Frederik III does not continue it.'
      uk: '<b>Rhinskgyldenfod</b> — самостійна родина стоп традиції Rhenish-Gulden, паралельна Reichsdukatenfuß без тарифної прив''язки. Карбування Ганса ~1497 р. у Мальме передує будь-якій данській ординації; Møntordninger 1514 і 1524 рр. ставлять пробу на 18 карат, а імперський монетний едикт 1559 р. — на 18½. Те, що монети тримали насправді, відхиляється від цього в обидва боки: карбування Кристіана III 1534-1536 рр. стоїть на 18⅓ карата, вище за данський припис і на звичній в Імперії вибірці, а карбування Кристіана IV 1625-1632 рр. — на 18¼, нижче, і жодна ординація цього зниження не покриває. Із завершенням головної фази 1632 та поворотом Кристіана IV до срібної Krone-Mønt (Hebræermønt 1644, ґлюкштадтський 10½-Krone-Fuß 1671) лінія фактично завершується — Фредерік III її не продовжує.'
    fractions:
      '1':
        soll_rau_g: 3.248
        soll_fein_g: 2.50367
        soll_fein_by_phase:
          # Only a dated ordinance may set a phase's own target. Phase I: Møntordning
          # Sommer 1514 + 25 Feb 1524, 18 Karat. Phase II: Møntedikt Ferdinands I.
          # 19 Aug 1559, 18½ Karat. Phase 0 (pre-1514), phase III (ducal 1619-1627)
          # and phase IV (Christian IV 1625-1632) have no instrument of their own and
          # fall back to the scalar (18½), so their shortfall stays visible.
          I: 2.436
          II: 2.50367
      '2':
        soll_rau_g: 6.496
        soll_fein_g: 5.00733
        soll_fein_by_phase:
          I: 4.872
          II: 5.00733
  f2_guldkrone_fod:
    pdate_label:
      de: 'Geltungsbereich: 1563 → 1584 · 22 Jahre'
      en: 'Period of validity: 1563 → 1584 · 22 years'
      uk: 'Період дії: 1563 → 1584 · 22 роки'
      da: 'Gyldighedsområde: 1563 → 1584 · 22 år'
    closing_label:
      de: Zusammenfassung · Klipping-Notmünz-Emission 1563-1564 und Geschenksatz-Karbung 1584 · separater Müntzfuß-Stamm
      en: Summary · Klipping emergency coinage 1563-1564 and gift-set coinage 1584 · standalone coinage-standard lineage
      uk: Підсумок · Klipping-надзвичайна емісія 1563-1564 і карбування подарункового набору 1584 · самостійна стопа
      da: Sammenfatning · klippingnødmønt 1563-1564 og gavesætsprægning 1584 · en selvstændig møntfodsstamme
    closing:
      de: 'Die <b>Frederik-II-Guldkrone-fod</b> ruht auf zwei schmalen Karbungs-Fenstern: der zweijährigen Klipping-Notmünz-Emission der frühen Phase der Nordischen Siebenjährigen Krieges (1563-1564) und einer einmaligen Frederiksborger Karbung 1584 für das Gold-Geschenkset Königin Sophies, die dieselbe Dreiheit Ungersk / Rhinsk / Krone wiederholt (Probe nicht überliefert)<sup>[ref:danskmoent-f2h7f-gavesaet-guldkrone]</sup>. <b>Eigenständiger Müntzfuß-Stamm</b>, nicht zu verwechseln mit der späteren Tarif-Guldkrone Christians IV. und Frederiks III. ([fuss:guldkrone], 1618-1668 mit eigener Tarif-Logik 3½ Speciedaler und kanonischen 5,996 g rauh / 5,498 g fein @ .917): 34-jähriger Belegfenster-Hiat zwischen 1584 und 1619; metrische Diskontinuität (kleines Klipping-Stück bei Frederik II. vs großes Tarif-Stück bei Christian IV.); funktionale Diskontinuität (Notmünze vs Tarif-Hauptkurant). Frederik II. wechselt für die restliche Kriegszeit (1565-1570) zu silbernen Klippinge und zum imperialen 9-Thaler-Fuß für Speciedaler ab 1566; die Krone-Goldlinie wird erst 1618 unter Christian IV. mit ganz anderer Metrik und Tarif-Logik wieder aufgenommen.'
      en: '<b>Frederik-II-Guldkrone-fod</b> rests on two narrow coinage windows: the two-year Klipping emergency-coinage emission of the early phase of the Northern Seven Years'' War (1563-1564) and a single Frederiksborg coinage of 1584 for Queen Sophie''s gold gift set, which repeats the same triad Ungersk / Rhinsk / Krone (fineness not transmitted)<sup>[ref:danskmoent-f2h7f-gavesaet-guldkrone]</sup>. <b>Standalone coinage-standard lineage</b>, not to be confused with the later tariff Guldkrone of Christian IV and Frederik III ([fuss:guldkrone], 1618-1668 with its own tariff logic 3½ Speciedaler and canonical 5.996 g rough / 5.498 g fine at .917): 34-year documented-window hiatus between 1584 and 1619; metric discontinuity (small Klipping piece under Frederik II vs large tariff piece under Christian IV); functional discontinuity (emergency coin vs tariff Hauptkurant). For the remainder of the war (1565-1570) Frederik II shifts to silver Klippings and to the imperial 9-Thaler-Fuß for Speciedaler from 1566; the Krone gold line is only resumed in 1618 under Christian IV with an entirely different metric and tariff logic.'
      uk: '<b>Frederik-II-Guldkrone-fod</b> спирається на два вузькі карбувальні вікна: дворічну Klipping-надзвичайну емісію ранньої фази Північної Семирічної війни (1563-1564) та одноразове карбування у Frederiksborg 1584 р. для золотого подарункового набору королеви Софії, яке повторює ту саму трійцю Ungersk / Rhinsk / Krone (пробу в джерелі не зафіксовано)<sup>[ref:danskmoent-f2h7f-gavesaet-guldkrone]</sup>. <b>Самостійна стопа</b>, не плутати з пізнішою тарифною Guldkrone Кристіана IV і Фредеріка III ([fuss:guldkrone], 1618-1668 з власною тарифною логікою 3½ Speciedaler та канонічними 5,996 г повної / 5,498 г чистого за .917): 34-річна пауза у задокументованому вікні між 1584 і 1619; метрична розривність (мала Klipping-штука за Frederik II vs велика тарифна штука за Christian IV); функційна розривність (надзвичайна монета vs тарифна Hauptkurant). На решту війни (1565-1570) Frederik II переходить до срібних Klippinge та до імперського 9-Thaler-Fuß для Speciedaler з 1566 р.; лінія Krone-золота відновлюється лише 1618 за Кристіана IV з геть іншою метрикою і тарифною логікою.'
  rosenobel_fod:
    pdate_label:
      de: 'Geltungsbereich: 1584 → 1629 · 45 Jahre'
      en: 'Period of validity: 1584 → 1629 · 45 years'
      uk: 'Період дії: 1584 → 1629 · 45 років'
      da: 'Gyldighedsområde: 1584 → 1629 · 45 år'
    closing_label:
      de: Zusammenfassung · 45 Jahre Rose-Noble-Renaissance-Anpassung
      en: Summary · 45 years of Rose Noble Renaissance adaptation
      uk: Підсумок · 45 років ренесансної адаптації Rose Noble
      da: Sammenfatning · 45 år med renæssancens tilpasning af rosenobelen
    closing:
      de: 'Die <b>Rosenobel-fod</b> ist eine Sonderlinie der dänischen Prestige-Goldmünze über zwei Regenten mit unterschiedlicher Metrik: Frederik IIs einzelnes 1584-Stück folgt noch dem englischen Klassik-Standard (~7,78 g), während Christian IVs Massenkarbung 1611-1629 ein neues dänisches Standard-Format (8,994 g @ .833 = 7,492 g fein) etabliert. <em>Distinkter Müntzfuß-Stamm</em>, nicht zu verwechseln mit der früheren [fuss:nobel_fod] (Sovereign-Tier 14,61 g @ .986, 1496-1532) oder der späteren [fuss:guldkrone]-Tarifmünze Christians IV (5,996 g @ .917, 1618+, eigene Tarif-Logik 3½ Speciedaler).'
      en: '<b>Rosenobel-fod</b> is a special line of Danish prestige gold coinage across two rulers with different metrics: Frederik II''s single 1584 piece still follows the classical English standard (~7.78 g), while Christian IV''s mass coinage 1611-1629 establishes a new Danish standard format (8.994 g at .833 = 7.492 g fine). <em>A distinct coinage-standard lineage</em>, not to be confused with the earlier [fuss:nobel_fod] (Sovereign tier 14.61 g at .986, 1496-1532) or the later [fuss:guldkrone] tariff coin of Christian IV (5.996 g at .917, 1618+, with its own 3½-Speciedaler tariff logic).'
      uk: '<b>Rosenobel-fod</b> — особлива лінія данського престижного золотого карбування через двох правителів з різною метрикою: окремий зразок Frederik II 1584 р. ще слідує класичному англійському стандарту (~7,78 г), тоді як масове карбування Christian IV 1611-1629 встановлює новий данський стандартний формат (8,994 г за .833 = 7,492 г чистого). <em>Окрема стопа</em>, не плутати з ранішою [fuss:nobel_fod] (Sovereign-tier 14,61 г за .986, 1496-1532) чи пізнішою тарифною [fuss:guldkrone] Christian IV (5,996 г за .917, 1618+, з власною тарифною логікою 3½ Speciedaler).'
  115_5_daler_fod:
    name:
      de: 115½-Dalerfod
      en: 115½-Dalerfod
      uk: 115½-Dalerfod
      da: 115½-Dalerfod
    historical_name: Gulddalerfod
    pdate_label:
      de: 'Geltungsbereich: 1602 → 1611 · Karbung 1604-1605'
      en: 'Period of validity: 1602 → 1611 · struck 1604-1605'
      uk: 'Період дії: 1602 → 1611 · карбування 1604-1605'
      da: 'Gyldighedsområde: 1602 → 1611 · prægning 1604-1605'
    closing_label:
      de: Zusammenfassung · Goldfuß der Møntanordning af 8. September 1602
      en: Summary · the gold standard of the 1602 ordinance
      uk: Підсумок · золота стопа ордонансу 1602
      da: Sammenfatning · guldfoden i Møntanordning af 8. september 1602
    closing:
      de: 'Der <b>115½-Dalerfod</b> ist der Goldfuß, dessen Nennwert in Silber rechnet: aus der feinen Cöllnischen Marck gehen 115½ Daler, je Daler-Einheit rund 2,03 g Feingold. Korn und Stückzahl je Marck wechseln dabei von Stückelung zu Stückelung (20 · 22⅙ · 22½ Karat bei 24 · 17¾ · 13¼ Stück) — zusammengehalten wird die Reihe allein durch das Feingold je Daler<sup>[ref:wilcke1-moentordning-1602-guld]</sup>. Vom [fuss:reichsdukatenfuss] derselben Ordnung ist er dadurch geschieden, dass dessen Stücke auf runde Dukatenvielfache fallen, die Daler-Klippen dagegen auf keine. <em>Kein Umlaufgeld</em>, sondern Repräsentations- und Soldgold<sup>[ref:wilcke1-guldmoent-skuemoent]</sup>.'
      en: '<b>115½-Dalerfod</b> is the gold standard whose face value counts in silver: the fine Cologne mark yields 115½ daler, about 2.03 g of fine gold to the daler unit. Carat and pieces-per-mark change from denomination to denomination (20 · 22⅙ · 22½ carats at 24 · 17¾ · 13¼ pieces) — what holds the series together is the fine gold per daler alone<sup>[ref:wilcke1-moentordning-1602-guld]</sup>. What separates it from the [fuss:reichsdukatenfuss] of the same ordinance is that the latter''s pieces fall on round multiples of the ducat while the daler klippen fall on none. <em>Not circulation money</em> but gold for representation and military pay<sup>[ref:wilcke1-guldmoent-skuemoent]</sup>.'
      uk: '<b>115½-Dalerfod</b> — золота стопа, чий номінал лічить у сріблі: з чистої Кельнської марки йде 115½ далера, близько 2,03 г чистого золота на одиницю «daler». Проба й кількість штук із марки при цьому змінюються від номіналу до номіналу (20 · 22⅙ · 22½ карата при 24 · 17¾ · 13¼ штуки) — тримає ряд докупи саме чисте золото на далер<sup>[ref:wilcke1-moentordning-1602-guld]</sup>. Від [fuss:reichsdukatenfuss] того самого ордонансу її відділяє те, що монети тієї стопи лягають на круглі кратні дуката, а далерні кліпе — ні на що. <em>Не обігові гроші</em>, а золото репрезентації та війська<sup>[ref:wilcke1-guldmoent-skuemoent]</sup>.'
  sovereign_fod:
    pdate_label:
      de: 'Geltungsbereich: 1606 → 1608 · Versuchsepisode'
      en: 'Period of validity: 1606 → 1608 · experimental episode'
      uk: 'Період дії: 1606 → 1608 · експериментальний епізод'
      da: 'Gyldighedsområde: 1606 → 1608 · forsøgsepisode'
    closing_label:
      de: Zusammenfassung · englisch-standardisiertes Versuchsgold 1606-1608
      en: Summary · English-standard experimental gold 1606-1608
      uk: Підсумок · англо-стандартне експериментальне золото 1606-1608
      da: Sammenfatning · forsøgsguld efter engelsk standard 1606-1608
    closing:
      de: 'Die <b>Sovereignfod</b> ist eine kurze Versuchsepisode: nach Christians IV. Englandreise 1606 nach dem Unite-Vorbild Jakobs I. geprägtes Probegold (Hede 19-22, «<i>Prøvemønt efter engelsk forbillede</i>»), Leit-Stück der <a href="https://www.danskmoent.dk/chr/c4h19.htm" target="_blank">1 Sovereign 1608</a> (Helsingør, ca. 10,0 g, in ca. 3 Exemplaren bekannt). Feingehalt nicht quellenbelegt, aus dem englischen 22-Karat-Unite abgeleitet. Nicht in den Massenumlauf überführt — <em>distinkter, experimenteller Müntzfuß-Ansatz</em>, zu unterscheiden von der [fuss:rosenobel_fod] (Christian IV. ab 1611, .833) und dem regulären [fuss:reichsdukatenfuss].'
      en: '<b>Sovereignfod</b> is a brief experimental episode: trial gold struck after Christian IV''s 1606 England journey on James I''s Unite model (Hede 19-22, «<i>Prøvemønt efter engelsk forbillede</i>»), lead piece the <a href="https://www.danskmoent.dk/chr/c4h19.htm" target="_blank">1 Sovereign 1608</a> (Helsingør, ca. 10.0 g, known in ca. 3 examples). Fineness not source-attested, inferred from the English 22-carat Unite. Not carried into mass circulation — <em>a distinct, experimental coinage-standard attempt</em>, to be distinguished from the [fuss:rosenobel_fod] (Christian IV from 1611, .833) and the regular [fuss:reichsdukatenfuss].'
      uk: '<b>Sovereignfod</b> — короткий експериментальний епізод: пробне золото, карбоване після візиту Кристіана IV в Англію 1606 р. за взірцем Unite Джеймса I (Hede 19-22, «<i>Prøvemønt efter engelsk forbillede</i>»), провідний стук — <a href="https://www.danskmoent.dk/chr/c4h19.htm" target="_blank">1 Sovereign 1608</a> (Helsingør, бл. 10,0 г, відомий у бл. 3 екземплярах). Проба джерелами не підтверджена, виведена з англійського 22-каратного Unite. Не переведене в масовий обіг — <em>окрема, експериментальна спроба стопи</em>, відрізняти від [fuss:rosenobel_fod] (Кристіан IV від 1611, .833) і регулярного [fuss:reichsdukatenfuss].'
  kronemont_chr_iv:
    grundwerte:
      rows_patch:
        Daler-Ausbringung — wieviel Specie aus einer Marck Feinsilber als Krone-Münzen herauskommt:
          value:
            en: 'The period-correct Danish definition of the coinage standard: not «so many pieces per mark»
              but rather <b>the total face value, in Speciedaler, that one fine Cologne mark of silver yielded
              once struck into Krone coin</b>. At the prevailing Krone-to-Specie tariff, the pieces-per-mark
              count translates directly into a daler face-value sum.<br><br><b>1618</b> (initial tariff: 1½
              Specie per Doppelkrone, i.e. ¾ Specie per Krone): 1 fine mark → 14.391 Krone × ¾ Specie/Krone
              = <b>10.793 Speciedaler</b> in total face value (Hede H105<sup>[ref:hede-1957-kronemoenten-nnum]</sup>)<br>·
              <b>1624</b> (Forordning of 14 February 1624: Specie re-rated to 100 Skilling): the same fine
              mark → <b>10.361 Speciedaler</b> in total face value (Hede H124<sup>[ref:hede-1957-kronemoenten-nnum]</sup>)<br>·
              <em>same physical coin (37.819 g rough, 32.500 g fine); the daler output falls only because
              the Specie itself was re-rated, not because the Krone changed</em>'
            uk: 'Період-коректне данське означення стопи: не «стільки-то штук з марки», а <b>сумарна номінальна
              вартість у Speciedaler, яку марка чистого кельнського срібла «приносила» при карбуванні в Krone-монети</b>.
              За чинним тарифом Krone ↔ Specie кількість штук з марки безпосередньо переводиться в сумарну
              номінальну вартість у даллерах.<br><br><b>1618</b> (початковий тариф: 1½ Specie на Doppelkrone,
              тобто ¾ Specie на одну Krone): з 1 марки чистого виходить 14,391 Krone × ¾ Specie/Krone = <b>10,793
              Speciedaler</b> сумарної номінальної вартості (Hede H105<sup>[ref:hede-1957-kronemoenten-nnum]</sup>)<br>·
              <b>1624</b> (Forordning 14 лютого 1624 р.: Specie перетарифовано на 100 Skilling): та сама марка
              чистого → <b>10,361 Speciedaler</b> сумарної номінальної вартості (Hede H124<sup>[ref:hede-1957-kronemoenten-nnum]</sup>)<br>·
              <em>фізично та сама монета (37,819 г повної ваги, 32,500 г чистого); вихід у даллерах падає
              лише через перетарифування самого Specie, а не через зміну Krone</em>'
    pdate_label:
      de: 'Geltungsbereich: 1618 → 1624 · ca. 6 Jahre'
      en: 'Period of validity: 1618 → 1624 · ca. 6 years'
      uk: 'Період дії: 1618 → 1624 · ca. 6 років'
      da: 'Gyldighedsområde: 1618 → 1624 · ca. 6 år'
    hintergrund:
      de: Christian IVs kroner 1618–1624. Tarifmünze, 1618 als <i>Corona Danica</i> mit Anfangstarif 1½ Speciedaler eingeführt — eine fiskalische Maßnahme der Krone mit einem Seigniorage-Aufschlag von ca. 11 % über dem Silberwert<sup>[ref:danskmoent-w2ref]</sup>. Die Prägung endet 1624; im Folgejahr <b>1625</b> wird der Tarif offiziell auf 1⅓ Speciedaler gesenkt. Danach folgt eine 19-jährige Pause der Krone-Prägung biß zur Wiederaufnahme im 10½-Krone-Fuß (Glückstadt) 1644.<sup>[ref:danskmoent-1krone]</sup><sup>[ref:wikipedia-de-corona-danica]</sup><sup>[ref:archive-worterbuchdermun007491mbp]</sup><sup>[ref:danskmoent-hedekron]</sup>
      en: Christian IV's kroner 1618–1624. A tariff coin, introduced in 1618 as the <i>Corona Danica</i> at an initial tariff of 1½ Speciedaler — a Crown fiscal measure with a seigniorage premium of ca. 11 % above the silver value<sup>[ref:danskmoent-w2ref]</sup>. Production ends in 1624; in the following year, <b>1625</b>, the tariff is officially cut to 1⅓ Speciedaler. Thereafter a 19-year hiatus of Krone production follows, until the revival in the 10½-Krone-Fuß (Glückstadt) in 1644.<sup>[ref:danskmoent-1krone]</sup><sup>[ref:wikipedia-de-corona-danica]</sup><sup>[ref:archive-worterbuchdermun007491mbp]</sup><sup>[ref:danskmoent-hedekron]</sup>
      uk: Christian IV's kroner 1618–1624. Тарифна монета, запроваджена 1618 р. як <i>Corona Danica</i> за початковим тарифом 1½ Speciedaler — фіскальний інструмент Корони з сеньйораж­ною надбавкою бл. 11 % над срібною вартістю<sup>[ref:danskmoent-w2ref]</sup>. Карбування завершується 1624 р., наступного <b>1625</b> року тариф офіційно знижено до 1⅓ Speciedaler. Далі настає 19-річна перерва карбування Krone — аж до відновлення у 10½-Krone-Fuß (Glückstadt) 1644 р.<sup>[ref:danskmoent-1krone]</sup><sup>[ref:wikipedia-de-corona-danica]</sup><sup>[ref:archive-worterbuchdermun007491mbp]</sup><sup>[ref:danskmoent-hedekron]</sup>
    details:
      de: '<p>Die Christian-IV.-Krone war keine Handelsmünze nach Silbergehalt, sondern eine fiskalische Tarifmünze: ihr Nennwert wurde vom König per Mandat über dem tatsächlichen Silberwert festgesetzt, die Differenz floß als Seigniorage in die Staatskasse<sup>[ref:danskmoent-w2ref]</sup>.</p><p><b>Primärkanonische Hede-Formel</b><sup>[ref:danskmoent-hedekron]</sup>: <b>12 ²⁵⁷⁄₇₀₀ Stück je 13¾-lötiger Marck</b> = 18,909 g rau bei .859 Feingehalt = 16,250 g fein je Krone. Die Bruchform (12,367 statt 12½) ergibt sich daraus, daß der Fuß 1618 über die <b>Daler-Ausbringung</b> definiert wurde — den nominellen Gesamtwert in Speciedaler aus einer feinen Marck Silber als Krone-Münzen. Bei Anfangstarif 1½ Specie pro Doppelkrone (= ¾ Specie pro Krone) ergeben 233,856 g Feinsilber 14,391 Krone, deren Nennwert sich auf 10,793 Speciedaler addiert (Hede H105<sup>[ref:danskmoent-hedekron]</sup>). Nach der Forordning vom 14. Februar 1624 wird die Specie selbst auf 100 Skilling neu tarifiert; die physische Krone bleibt unverändert, aber dieselbe Marck Feinsilber bringt nach der neuen Specie-Skala nur noch 10,361 Speciedaler aus (Hede H124<sup>[ref:danskmoent-hedekron]</sup>).</p><p>1618 wurde nur die 2 Krone (damals einfach «Krone» genannt) nach dieser Formel geprägt; ½, ¼ und ⅛ Krone des Jahres 1618 folgten einer leicht niedrigeren Münzfod. Ab 1619 prägt auch die ½ Krone nach der Hauptformel<sup>[ref:danskmoent-hedekron]</sup>.</p><p>Spezialliteratur zur Christian-IV.-Phase: Hede / Schou (H105–H107, H124–H126); Bruun-Lots 13089 ff. (Stack''s Bowers Auktion Part II, Zürich 14.–15. März 2025).</p>'
      en: '<p>The Christian IV Krone was not a trade coin valued by silver content but a fiscal tariff coin: its face value was set by royal mandate above the actual silver value, the gap accruing to the treasury as seigniorage<sup>[ref:danskmoent-w2ref]</sup>.</p><p><b>Primary catalogue formula (Hede)</b><sup>[ref:danskmoent-hedekron]</sup>: <b>12 ²⁵⁷⁄₇₀₀ pieces per 13¾-lødig mark</b> = 18.909 g rough at .859 fineness = 16.250 g fine per Krone. The fractional form (12.367 rather than 12½) follows from the standard being defined in 1618 via the <b>daler output</b> — the total face value, expressed in Speciedaler, that one fine mark of silver yields once struck into Krone coin. At the initial tariff of 1½ Specie per Doppelkrone (= ¾ Specie per Krone), 233.856 g of fine silver yields 14.391 Krone, whose face values add up to 10.793 Speciedaler (Hede H105<sup>[ref:danskmoent-hedekron]</sup>). After the Forordning of 14 February 1624 the Specie itself is re-rated to 100 Skilling; the physical Krone is unchanged, but on the new Specie scale the same fine mark now yields only 10.361 Speciedaler (Hede H124<sup>[ref:danskmoent-hedekron]</sup>).</p><p>In 1618 only the 2 Krone (then simply called «Krone») was struck on this formula; the ½, ¼ and ⅛ Krone of 1618 followed a slightly lower Münzfod. From 1619 the ½ Krone also follows the main formula<sup>[ref:danskmoent-hedekron]</sup>.</p><p>Specialist literature on the Christian IV phase: Hede / Schou (H105–H107, H124–H126); Bruun lots 13089 ff. (Stack''s Bowers auction Part II, Zurich 14–15 March 2025).</p>'
      uk: '<p>Krone Кристіана IV не була торговельною монетою за вмістом срібла, а фіскальною тарифною: її номінал встановлювався королівським мандатом вище фактичної срібної вартості, різниця надходила до скарбниці як сеньйораж<sup>[ref:danskmoent-w2ref]</sup>.</p><p><b>Першоджерельна Hede-формула</b><sup>[ref:danskmoent-hedekron]</sup>: <b>12 ²⁵⁷⁄₇₀₀ штук з 13¾-lødig марки</b> = 18,909 г повної ваги за проби .859 = 16,250 г чистого на Krone. Дробова форма (12,367 замість 12½) випливає з того, що стопу 1618 р. задавали через <b>вихід у даллерах (daler-udbringning)</b> — сумарну номінальну вартість у Speciedaler, яку одна марка чистого срібла «приносила» при карбуванні в Krone-монети. За початкового тарифу 1½ Specie на Doppelkrone (= ¾ Specie на одну Krone) з 233,856 г чистого срібла виходить 14,391 Krone, сумарна номінальна вартість яких становить 10,793 Speciedaler (Hede H105<sup>[ref:danskmoent-hedekron]</sup>). Після Forordning 14 лютого 1624 р. сам Specie перетарифовано на 100 Skilling; фізично Krone лишається без змін, але та сама марка чистого срібла за новою Specie-шкалою «приносить» уже лише 10,361 Speciedaler (Hede H124<sup>[ref:danskmoent-hedekron]</sup>).</p><p>1618 р. за цією формулою карбувалась лише 2 Krone (тоді просто «Krone»); ½, ¼ та ⅛ Krone 1618 р. йшли за дещо нижчою møntfod. З 1619 р. ½ Krone теж переходить на головну формулу<sup>[ref:danskmoent-hedekron]</sup>.</p><p>Спеціальна література по фазі Кристіана IV: Hede / Schou (H105–H107, H124–H126); лоти Bruun 13089 і далі (Stack''s Bowers auction Part II, Цюрих 14–15 березня 2025).</p>'
  reichsdukatenfuss:
    name:
      de: 67-Dukatfod
      en: 67-Dukatfod
      uk: 67-Dukatfod
      da: 67-Dukatfod
    historical_name: Ungerskgyldenfod
    # Per-page Δ target for the ONE Danish phase an ordinance governs.
    # The Forordning af 8. september 1602 sets the Ungersk Gylden at 23 1/3 Karat
    # (67 per rough Cölln. Marck → 233.856/67 × 280/288 = 3.39343; Galster-via-Wilcke
    # print 3,39) and, in the same table, the Portugaløser at 23 1/2 Karat and 6 3/4
    # per Marck (233.856/6.75 × 282/288 = 33.92356; they print 33,92).
    #
    # Phases III and IV run below the imperial Korn too, at .979 — but NO ordinance
    # for that step has been located (dk_dukat_portugaloeser_fod.md §3.3, open
    # question §7.3). They therefore keep the shared imperial target on purpose, so
    # their Δ shows the shortfall instead of hiding it behind a re-based zero.
    #
    # Here and not in data/shared/fuesse.yml because `soll_fein_by_phase` is keyed by
    # PHASE ID, and «II» means 1602-1611 on this page but 1726-1771 on the
    # schleswig_holstein page, which renders the same fuss — on the shared table the
    # two Plön ducats of 1760 measured against the Danish 1602 ordinance.
    fractions:
      "1": {soll_rau_g: 3.49039, soll_fein_g: 3.44191, soll_fein_by_phase: {'II': 3.39343}}
      "2": {soll_rau_g: 6.98078, soll_fein_g: 6.88382, soll_fein_by_phase: {'II': 6.78687}}
      "10": {soll_rau_g: 34.90392, soll_fein_g: 34.41910, soll_fein_by_phase: {'II': 33.92356}}
    details:
      de: |
        <b>Dukatfod</b> — die dänisch-norwegische Ausprägung des Dukatenstandards: 67 Stück je rauer Cöllnischer Marck bei 23 Karat 8 Grän. Metrisch ist er der deutsche Reichsdukatenfuß; rechtlich ist er es nicht, denn die Augspurgische Reichsmünzordnung von 1559 band das Königreich nicht.<sup>[ref:wikipedia-de-reichsmuenzordnungen-gold]</sup>

        <b>Einführung ohne Müntzbrief.</b> Das früheste dänische Stück dieses Fußes ist der Ungersk Gylden Frederiks I. von 1531.<sup>[ref:danskmoent-galster46-ungersk-gylden]</sup> Ein dänischer Rechtsakt steht nicht dahinter: das Lovkompleks von 1514 regelt Nobler und Rhinsk Gylden, Frederiks I. Ordnung von 1524 den Nobel zu 23 Karat — beides anderes Gold. Erst die <b>Forordning vom 8. September 1602</b> nennt diese Müntze in dänischem Recht, und sie senkt das Korn auf 23⅓ Karat für den Ungersk Gylden und 23½ für den Portugaløser.<sup>[ref:wilcke1-moentordning-1602-guld]</sup> Die 71 Jahre davor sind Karbungspraxis, durch Müntzen belegt, nicht durch Verordnung.

        <b>Rolle.</b> Prestige- und Handelsgold neben der silbernen Landeswährung. Die dänische Krone karbte es nie als Alltagsgeld, sondern für den Fernhandel und für Geschenk und Repräsentation; angenommen wurde es — wie die mitlaufenden ungarischen und venezianischen Stücke desselben Fußes — nach Edelmetallgehalt.<sup>[ref:museum-rantzau-taler-dukaten]</sup> Neben ihm steht ab 1714 mit dem [fuss:courantdukatenfuss] eine eigene, tariftragende dänische Goldlinie: der Dukatfod bleibt das internationale, der Courantdukat das binnenländische Gold.

        <b>Der Portugaløser</b> ist kein eigener Fuß, sondern der Zehnfach-Multiplus desselben: sein Feingehalt entspricht in jeder Periode zehn zeitgenössischen dänischen Dukaten. Das Vorbild ist der portugiesische <i>Português</i> Manuels I. zu zehn Cruzados, den Hamburg zwischen 1553 und 1560 nachkarbte;<sup>[ref:wikipedia-pt-portugues-moeda]</sup> nach Hamburger Vorbild ließ Königin Sophie ihn 1591 biß 1593 in Haderslev prägen. Die Benennung Ungersk Gylden und Portugaløser hält biß 1629, danach heißt die Müntze Dukat.

        <b>Phasen.</b> Trennend wirkt jeweils ein Rechtsakt: die Forordning vom 8. September 1602 senkt das Korn und schließt den ersten Abschnitt;<sup>[ref:wilcke1-moentordning-1602-guld]</sup> mit dem dänisch-norwegischen Courantverbund von 1726 tritt der Fuß in seinen letzten Abschnitt, der biß zur letzten Karbung reicht.

        <b>Ende.</b> Gekarbt wurde auf diesem Fuß biß 1802 — die spätesten verzeichneten Karbungsjahre sind 1791-1792, 1794 und 1802 (errechnet aus den verzeichneten Karbungsjahren). Die <b>Forordning vom 5. Januar 1813</b> stellt die Landeswährung auf den Rigsbankdaler um, erfaßt in ihren §§1-16 die Goldmüntzen jedoch nicht;<sup>[ref:forordning-pengevaesenet-1813]</sup> abgelöst wird das dänische Gold erst durch die Skandinavische Müntzunion von 1873 und die Krone.<sup>[ref:muenzen-online-d-nemarks-w-hrungsreformen-der-lange-weg-zur-krone]</sup>
      en: |
        <b>Dukatfod</b> — the Danish-Norwegian form of the ducat standard: 67 pieces per rough Cologne mark at 23 carats 8 grains. Metrically it is the German Reichsdukatenfuß; legally it is not, since the Augsburg Imperial Coinage Ordinance of 1559 did not bind the kingdom.<sup>[ref:wikipedia-de-reichsmuenzordnungen-gold]</sup>

        <b>Adopted without an instrument.</b> The earliest Danish piece on this standard is Frederik I's Ungersk Gylden of 1531.<sup>[ref:danskmoent-galster46-ungersk-gylden]</sup> No Danish act stands behind it: the Lovkompleks of 1514 governs Nobler and Rhinsk Gylden, Frederik I's ordinance of 1524 the Nobel at 23 carats — both a different gold. Only the <b>Forordning of 8 September 1602</b> names this coin in Danish law, and it lowers the fineness to 23⅓ carats for the Ungersk Gylden and 23½ for the Portugaløser.<sup>[ref:wilcke1-moentordning-1602-guld]</sup> The seventy-one years before that are minting practice attested by coins, not by ordinance.

        <b>Role.</b> Prestige and trade gold beside the silver territorial currency. The Danish crown never struck it as everyday money but for long-distance commerce and for gift and display; like the Hungarian and Venetian pieces of the same standard that circulated with it, it was taken by metal content.<sup>[ref:museum-rantzau-taler-dukaten]</sup> From 1714 the [fuss:courantdukatenfuss] runs beside it as a distinct, tariff-bearing Danish gold line: the Dukatfod stays the international gold, the Courantdukat the domestic one.

        <b>The Portugaløser</b> is not a standard of its own but the tenfold multiple of this one: in every period its fine content equals ten contemporary Danish ducats. Its model is the Portuguese <i>português</i> of Manuel I at ten cruzados, which Hamburg imitated between 1553 and 1560;<sup>[ref:wikipedia-pt-portugues-moeda]</sup> following the Hamburg pattern, Queen Sophie had it struck at Haderslev from 1591 to 1593. The names Ungersk Gylden and Portugaløser hold until 1629, after which the coin is called Dukat.

        <b>Phases.</b> What separates them is a legal act each time: the Forordning of 8 September 1602 lowers the fineness and closes the first stretch;<sup>[ref:wilcke1-moentordning-1602-guld]</sup> with the Danish-Norwegian Courant union of 1726 the standard enters its last stretch, which runs to the final striking.

        <b>End.</b> Striking on this standard continued to 1802 — the latest recorded striking years are 1791-1792, 1794 and 1802 (as computed from the recorded striking years). The <b>Forordning of 5 January 1813</b> re-bases the territorial currency on the Rigsbankdaler, but its §§1-16 do not cover the gold coins;<sup>[ref:forordning-pengevaesenet-1813]</sup> Danish gold is superseded only by the Scandinavian Monetary Union of 1873 and the Krone.<sup>[ref:muenzen-online-d-nemarks-w-hrungsreformen-der-lange-weg-zur-krone]</sup>
      uk: |
        <b>Dukatfod</b> — дансько-норвезька форма дукатного стандарту: 67 штук із сирої Кельнської марки за 23 карати 8 гран. Метрично це німецький Reichsdukatenfuß; юридично — ні, бо Авґсбурзький імперський монетний ордонанс 1559 р. королівства не звʼязував.<sup>[ref:wikipedia-de-reichsmuenzordnungen-gold]</sup>

        <b>Запровадження без монетного акта.</b> Найраніша данська монета цієї стопи — Ungersk Gylden Фредеріка I 1531 р.<sup>[ref:danskmoent-galster46-ungersk-gylden]</sup> Данського правового акта за нею немає: Lovkompleks 1514 р. регулює Nobler і Rhinsk Gylden, ордонанс Фредеріка I 1524 р. — Nobel при 23 каратах, і те й те інше золото. Лише <b>Forordning від 8 вересня 1602 р.</b> називає цю монету в данському праві — і знижує пробу до 23⅓ карата для Ungersk Gylden і 23½ для Portugaløser.<sup>[ref:wilcke1-moentordning-1602-guld]</sup> Попередній 71 рік — це карбувальна практика, засвідчена монетами, а не приписом.

        <b>Роль.</b> Престижне й торгове золото поряд зі срібною земельною валютою. Данська корона ніколи не карбувала його як щоденні гроші — лише для далекої торгівлі, дарунку й репрезентації; як і угорські та венеційські монети тієї самої стопи, що ходили поруч, його приймали за вмістом дорогоцінного металу.<sup>[ref:museum-rantzau-taler-dukaten]</sup> Від 1714 р. поряд стоїть [fuss:courantdukatenfuss] — окрема данська золота лінія з власним тарифом: Dukatfod лишається міжнародним золотом, Courantdukat — внутрішнім.

        <b>Portugaløser</b> не є окремою стопою, а десятикратним множником цієї: у кожному періоді його чиста вага дорівнює десяти сучасним данським дукатам. Зразок — португальський <i>português</i> Мануела I на десять крузадо, який Гамбург наслідував між 1553 і 1560 рр.;<sup>[ref:wikipedia-pt-portugues-moeda]</sup> за гамбурзьким взірцем королева Софія карбувала його в Гадерслеві 1591-1593 рр. Назви Ungersk Gylden і Portugaløser тримаються до 1629 р., далі монета зветься Dukat.

        <b>Фази.</b> Розділяє їх щоразу правовий акт: Forordning від 8 вересня 1602 р. знижує пробу й закриває перший відтинок;<sup>[ref:wilcke1-moentordning-1602-guld]</sup> з дансько-норвезьким курантним обʼєднанням 1726 р. стопа входить в останній відтинок, що триває до останнього карбування.

        <b>Кінець.</b> Карбування на цій стопі тривало до 1802 р. — найпізніші зафіксовані роки карбування це 1791-1792, 1794 і 1802 (обчислено із зафіксованих років карбування). <b>Forordning від 5 січня 1813 р.</b> переводить земельну валюту на Rigsbankdaler, проте §§1-16 золотих монет не охоплюють;<sup>[ref:forordning-pengevaesenet-1813]</sup> данське золото заступає лише Скандинавська монетна унія 1873 р. і Krone.<sup>[ref:muenzen-online-d-nemarks-w-hrungsreformen-der-lange-weg-zur-krone]</sup>
