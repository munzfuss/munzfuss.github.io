      bar_title:
        de: 'Skandinavische Müntzunion 5. Mai 1873 (Stockholm) → die dänische Møntloven af 23. maj 1873, wirksam ab 1. Januar 1875 · vier Stückelungs-Stufen unter demselben Müntzfuß: Gold-Hauptkurant 10/20 Kr (.900, 4,48/8,96 g rauh), Silber-Kurant 1/2 Kr (.800, 7,5/15 g), Silber-Scheide 25/10 øre (.600/.400, 2,42/1,45 g), Bronze-Scheide 5/2/1 øre (8/4/2 g) · 100 øre = 1 Krone · feste Goldparität gegenüber Reichs-Goldmark: 8 Kr = 9 Mark · Goldkonvertibilität ausgesetzt 2. August 1914 · Skandinavische Müntzunion formell aufgelöst 1924'
        en: 'Scandinavian Monetary Convention of 5 May 1873 (Stockholm) → Danish Møntloven af 23. maj 1873, effective 1 January 1875 · four denomination tiers under the same coinage standard: gold Hauptkurant 10/20 Kr (.900, 4.48/8.96 g raw), silver Kurant 1/2 Kr (.800, 7.5/15 g), silver Scheide 25/10 øre (.600/.400, 2.42/1.45 g), bronze Scheide 5/2/1 øre (8/4/2 g) · 100 øre = 1 Krone · fixed gold parity vs the Reichsmark: 8 Kr = 9 Mark · gold convertibility suspended 2 August 1914 · Scandinavian Monetary Union formally dissolved 1924'
        uk: 'Скандинавська монетна конвенція 5 травня 1873 р. (Стокгольм) → данський Møntloven af 23. maj 1873, чинний з 1 січня 1875 р. · чотири ступені номіналів у тій самій стопі: золотий Hauptkurant 10/20 Kr (.900, 4,48/8,96 г), срібний Kurant 1/2 Kr (.800, 7,5/15 г), срібний Scheide 25/10 øre (.600/.400, 2,42/1,45 г), бронзовий Scheide 5/2/1 øre (8/4/2 г) · 100 øre = 1 Krone · фіксована золота паритетність до Reichsmark: 8 Kr = 9 Mark · конвертованість у золото призупинено 2 серпня 1914 · Скандинавська монетна унія формально розпущена 1924'
        da: 'Den Skandinaviske Møntunion af 5. maj 1873 (Stockholm) → den danske Møntloven af 23. maj 1873, gældende fra 1. januar 1875 · fire pålydendetrin under samme møntfod: guldhovedkurant 10 og 20 kr. (.900, 4,48/8,96 g rå), sølvkurant 1 og 2 kr. (.800, 7,5/15 g), sølvskillemønt 25 og 10 øre (.600/.400, 2,42/1,45 g) og bronzeskillemønt 5, 2 og 1 øre (8/4/2 g) · 100 øre = 1 krone · fast guldparitet over for den tyske guldmark: 8 kr. = 9 mark · guldindløseligheden suspenderet 2. august 1914 · Den Skandinaviske Møntunion formelt opløst i 1924'
