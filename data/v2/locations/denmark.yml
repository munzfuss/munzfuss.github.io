        uk: 'Передфаза Кристіана IV 1618 → 1648 (кінець серії Hede 25 за c4h25<sup>[ref:danskmoent-c4h25]</sup>; подвійна Guldkrone Hede 28 засвідчена у Esrum-скарбі 1628 Ingvardson & Märcher 2010) — не масове карбування, а придворний подарунок та плата найманцям · Головна фаза Фредеріка III 1655 (перше копенгагенське карбування) → 14 лютого 1671 (рекомендація Commerce Collegium припиняє регулярне карбування) · Hede 1957 «Frederik III''s guldkroner»: «<i>møntet i København 1655 og i Glückstadt 1657, 1659 og 1660</i>» · ґлюкштадтська фаза 1657–1660 (Hede 145B, монетмайстер Jacob Schwieger); копенгагенські наступні випуски 1666 (Hede 44/45)<sup>[ref:danskmoent-f3h44]</sup>, 1668 (новіша монетна формула 5,590 г повної ваги / 5,126 г чистого = 1½ Speciesdukat за Forordning 2 січня 1658) · за Кристіана V не продовжено; королівський особливий дозвіл 2 вересня 1701 р. для Vestindiske Compagni — реальних екземплярів не виявлено · залишки фактично виходять з обігу до кінця століття'
