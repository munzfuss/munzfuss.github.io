      de: Bulk-Seed-Sammelbucket — Geltungsbereich pro Münze noch zuzuweisen
      en: Bulk seed bucket — period of validity to be assigned per coin
      uk: Bulk-seed загальний кошик — період дії потрібно призначити per coin
      da: Samlebucket for bulk-seed — gyldighedsområdet skal endnu tildeles pr. mønt
    hintergrund:
      de: 'Technischer Sammelbucket für bulk-importierte Münzen aus mehreren Quellen — pro Quelle eine eigene Phase (ucoin, Hede 1971 via danskmoent.dk, NumisMaster, Bruun, Galster, Numista). Bei künftiger Detail-Bearbeitung wandern die Stücke in den jeweils passenden eigentlichen Müntzfuß ([fuss:9_25_thaler], [fuss:11_333_thaler], [fuss:18_5_thaler], [fuss:kronefod], [fuss:reichsdukatenfuss] etc.).'
      en: 'Technical catch-all bucket for bulk-imported coins from several sources — one phase per source (ucoin, Hede 1971 via danskmoent.dk, NumisMaster, Bruun, Galster, Numista). On future detailed work the pieces move to their proper coinage standard ([fuss:9_25_thaler], [fuss:11_333_thaler], [fuss:18_5_thaler], [fuss:kronefod], [fuss:reichsdukatenfuss], etc.).'
      uk: 'Технічний загальний кошик для bulk-імпортованих монет із кількох джерел — окрема фаза на джерело (ucoin, Hede 1971 через danskmoent.dk, NumisMaster, Bruun, Galster, Numista). При майбутній детальній роботі монети перейдуть у відповідну стопу ([fuss:9_25_thaler], [fuss:11_333_thaler], [fuss:18_5_thaler], [fuss:kronefod], [fuss:reichsdukatenfuss] тощо).'
phases:
  nobel_fod:
    - id: '0'
      year_from: 1496
      year_to: 1513
      from_label: '1496'
      to_label: '1513'
      title:
        de: 'Phase 0 · De-facto-Karbung vor der Møntordning (1496-1513)'
        en: 'Phase 0 · de-facto coinage before the Møntordning (1496-1513)'
        uk: 'Фаза 0 · De-facto-карбування до Møntordning (1496-1513)'
        da: Fase 0 · de facto-prægning før møntordningen (1496-1513)
      description:
        de: 'Schweres Goldstück, das <b>Hans</b> 1496 (Malmø/København) und 1502 (Malmø) de facto prägt (Galster 24)<sup>[ref:danskmoent-1nobel]</sup> — noch vor der formellen Normierung. Die Probe dieser vor-1514-Nobler ist unabhängig nicht belegt<sup>[ref:danskmoent-nobel-finhed-f1g45]</sup>.'
        en: 'The heavy gold piece <b>Hans</b> strikes de facto in 1496 (Malmø/Copenhagen) and 1502 (Malmø) (Galster 24)<sup>[ref:danskmoent-1nobel]</sup> — before the formal codification. The fineness of these pre-1514 Nobler is not independently attested<sup>[ref:danskmoent-nobel-finhed-f1g45]</sup>.'
        uk: 'Важке золоте карбування <b>Hans</b> de facto 1496 (Malmø/Копенгаген) і 1502 (Malmø) (Galster 24)<sup>[ref:danskmoent-1nobel]</sup> — ще до формальної нормалізації. Проба цих до-1514 нобелів незалежно не засвідчена<sup>[ref:danskmoent-nobel-finhed-f1g45]</sup>.'
    - id: I
      year_from: 1514
      year_to: 1532
      from_label: '1514'
      to_label: '1532'
      title:
        de: 'Phase I · De-jure-Standard, Christian-II-Møntordning 1514 (1514-1532)'
        en: 'Phase I · de-jure standard, Christian II Møntordning 1514 (1514-1532)'
        uk: 'Фаза I · De-jure-стандарт, Møntordning Christian II 1514 (1514-1532)'
        da: Fase I · de jure-standard, Christian 2.s møntordning 1514 (1514-1532)
      description:
        de: 'Die <b>Christian-II-Møntordning vom Sommer 1514</b> (Malmø) normiert den Nobel de jure: 16 Stück je Cölln. Marck zu 23½ Karat<sup>[ref:wilcke-1950-nobel-ordinance]</sup>. Belegt durch <b>Christian II.</b> 1516 + 1518 Malmø (Galster 37) und <b>Frederik I.</b> 1532 København/Malmø (Galster 45) + undatiertes Ribe (Galster 68 + 69); die datierten 1532-Nobler tragen die 23½-Karat-Probe der Vorgabe von 1514<sup>[ref:danskmoent-nobel-finhed-f1g45]</sup>.'
        en: 'The <b>Christian II Møntordning of Summer 1514</b> (Malmø) codifies the Nobel de jure: 16 pieces per Cologne mark at 23½ carats<sup>[ref:wilcke-1950-nobel-ordinance]</sup>. Attested by <b>Christian II</b> 1516 + 1518 Malmø (Galster 37) and <b>Frederik I</b> 1532 Copenhagen/Malmø (Galster 45) + undated Ribe (Galster 68 + 69); the dated 1532 Nobler carry the 23½-carat fineness of the 1514 specification<sup>[ref:danskmoent-nobel-finhed-f1g45]</sup>.'
        uk: '<b>Møntordning Christian II літа 1514</b> (Malmø) нормує Nobel de jure: 16 штук з кельнської марки за 23½ карати<sup>[ref:wilcke-1950-nobel-ordinance]</sup>. Засвідчено <b>Christian II</b> 1516 + 1518 Malmø (Galster 37) і <b>Frederik I</b> 1532 Копенгаген/Malmø (Galster 45) + недатований Ribe (Galster 68 + 69); датовані 1532-нобелі несуть 23½-каратну пробу специфікації 1514<sup>[ref:danskmoent-nobel-finhed-f1g45]</sup>.'
  8_5_gylden_fod:
    - id: A1
      year_from: 1514
      year_to: 1517
      from_label: '1514'
      to_label: '1517'
      title:
        de: 'Phase A1 · Lovkompleks baseline 1514-1517 · 14 Lod (875 ‰), 27,51 g rauh / 24,07 g fein je Sølvgylden — Malmø'
        en: 'Phase A1 · Lovkompleks baseline 1514-1517 · 14 Lod (875 ‰), 27.51 g rough / 24.07 g fine per Sølvgylden — Malmø'
        uk: 'Фаза A1 · Lovkompleks baseline 1514-1517 · 14 Lod (875 ‰), 27,51 г повної / 24,07 г чистого на Sølvgylden — Мальме'
        da: Fase A1 · lovkompleksets udgangspunkt 1514-1517 · 14 lod (875 ‰), 27,51 g rå / 24,07 g fin pr. sølvgylden — Malmø
      description:
        de: '<em>Precursor-Akte 1513</em> (NICHT Teil des Lovkompleks selbst): <b>22. Juli 1513 Haandfæstning</b> (Wilcke 7-2 S. 4 verbatim «<i>Den 22. Juli 1513 udstedtes Kong Christian II.s Haandfæstning</i>») etabliert die Forderung «<i>thue mark giør fyldest for en riksdlr.</i>»; <b>1. August 1513 Dynes Blicher Beskikkelsesbrev</b> ernennt Diens (Hans) Blicher zum Mzm. in Malmø — Skilling-Hvid-Tarif Wilcke 7-2 S. 150 (Skilling 96 Stk./M @ 5¾ Lod, Hvid 222 Stk./M @ 4½ Lod). Diese 1513-Akte sind die unmittelbare Vorbereitung nach Hans'' Tod 20. Februar 1513 und gehen der Krönung 11. Juni 1514 voraus. <b>Lovkompleks-Karbung beginnt 1514</b> mit der <b>Møntordning af Sommeren 1514 «Dienis Malmø Brev»</b> (Wilcke 7-2 S. 152-153), die den Hauptkurant-Sølvgylden 8½ Stk./Cölln. Marck rauh @ 14 Lod (27,51 g rauh / 24,07 g fein) etabliert. Begleitende Aktien des Lovkompleks: Norge-Forordning 3. August 1514 (Kalmar-Union-Extension), Kvittering Paasketid 1515, Sjælland åbent Brev 24. August 1515. Hauptmünze Malmø unter Mzm. Diens (Hans) Blicher; Galster c2g-38 attestiert Sølvgylden 1516+1518+1523 (.875/27,06 g). Skillinge 1515-1517 sind «<i>betydelig tungere</i>» als das Brev specifiziert (Wilcke S. 153) — Specimen-Drift über die Ordnung-Soll.'
        en: '<em>Precursor acts 1513</em> (NOT part of the Lovkompleks itself): <b>22 July 1513 Haandfæstning</b> (Wilcke 7-2 p. 4 verbatim «<i>Den 22. Juli 1513 udstedtes Kong Christian II.s Haandfæstning</i>») establishes the requirement «<i>thue mark giør fyldest for en riksdlr.</i>»; <b>1 August 1513 Dynes Blicher Beskikkelsesbrev</b> appoints Diens (Hans) Blicher as mintmaster at Malmø — Skilling-Hvid tariff per Wilcke 7-2 p. 150 (Skilling 96/M at 5¾ Lod, Hvid 222/M at 4½ Lod). These 1513 acts are the immediate preparation after Hans''s death of 20 February 1513 and predate the coronation of 11 June 1514. <b>Lovkompleks coinage begins in 1514</b> with the <b>Møntordning af Sommeren 1514 «Dienis Malmø Brev»</b> (Wilcke 7-2 pp. 152-153), which establishes the Hauptkurant Sølvgylden at 8½ pieces/Cologne mark rough at 14 Lod (27.51 g rough / 24.07 g fine). Companion acts of the Lovkompleks: Norge ordinance 3 August 1514 (Kalmar Union extension), Kvittering Paasketid 1515, Sjælland åbent Brev 24 August 1515. Main mint Malmø under mintmaster Diens (Hans) Blicher; Galster c2g-38 attests Sølvgylden 1516+1518+1523 (.875/27.06 g). Skilling pieces 1515-1517 are «<i>betydelig tungere</i>» than the Brev specifies (Wilcke p. 153) — specimen drift above the ordinance soll.'
        uk: '<em>Прекурсорні акти 1513</em> (НЕ частина Lovkompleks): <b>22 липня 1513 Haandfæstning</b> (Wilcke 7-2 с. 4 verbatim «<i>Den 22. Juli 1513 udstedtes Kong Christian II.s Haandfæstning</i>») встановлює вимогу «<i>thue mark giør fyldest for en riksdlr.</i>»; <b>1 серпня 1513 Dynes Blicher Beskikkelsesbrev</b> призначає Diens (Hans) Blicher монетмайстром у Мальме — тариф Skilling-Hvid за Wilcke 7-2 с. 150 (Skilling 96/M за 5¾ Lod, Hvid 222/M за 4½ Lod). Ці акти 1513 — безпосередня підготовка після смерті Hans 20 лютого 1513 і передують коронації 11 червня 1514. <b>Карбування Lovkompleks починається 1514</b> з <b>Møntordning af Sommeren 1514 «Dienis Malmø Brev»</b> (Wilcke 7-2 с. 152-153), яка встановлює Hauptkurant-Sølvgylden у 8½ шт. з повної кельнської марки за 14 Lod (27,51 г повної / 24,07 г чистого). Супутні акти Lovkompleks: норвезький ордонанс 3 серпня 1514 (Kalmar-Union extension), Kvittering Paasketid 1515, Sjælland åbent Brev 24 серпня 1515. Головний монетний двір Мальме за монетмайстра Diens (Hans) Blicher; Galster c2g-38 засвідчує Sølvgylden 1516+1518+1523 (.875/27,06 г). Skilling 1515-1517 «<i>betydelig tungere</i>» ніж specifiziert у Brev (Wilcke с. 153) — specimen drift над soll-ом ордонансу.'
    - id: A2
      year_from: 1518
      year_to: 1522
      from_label: '1518'
      to_label: '1522'
      title:
        de: 'Phase A2 · Klipping-Debasierung 1518-1522 («ydel Kobber») — 18-Penning + 1-Skilling Klippinge'
        en: 'Phase A2 · Klipping debasement 1518-1522 («ydel Kobber») — 18-Penning + 1-Skilling Klippinge'
        uk: 'Фаза A2 · Klipping-девальвація 1518-1522 («ydel Kobber») — 18-Penning + 1-Skilling Klippinge'
        da: Fase A2 · klippingforringelsen 1518-1522 («ydel Kobber») — 18-penning- og 1-skillingklippinge
      description:
        de: '1518 Klipping-Ordnung führt radikal abgesenkte Notmünz-Klippinge ein — Wilcke 7-2 S. 157 verbatim «<i>ydel Kobber</i>» (im Wesen Kupfer). Belegserie Galster S. 26-27 + S. 29-31 (18-Penning + 1-Skilling Klippinge); Numista-297656 attestiert 18 Penning Klipping 1518. Karbung im Vorfeld der Absetzung 1523 — Christian IIs Versuch, durch Notgeld die Bauernkrise + den Schwedenkrieg zu finanzieren. Vægt der Klippinge variiert stark (1,47-2,35 g per Bruchstück), Probe nicht im Brev fixiert; Wilcke S. 153 charakterisiert sie als «<i>betydelig tungere</i>» Skillinger gefolgt von einem deutlich abwärtigen Drift.'
        en: 'The 1518 Klipping ordinance introduces radically debased emergency Klippinge — Wilcke 7-2 p. 157 verbatim «<i>ydel Kobber</i>» (essentially copper). Reference series Galster S. 26-27 and S. 29-31 (18-Penning and 1-Skilling Klippinge); Numista-297656 attests 18 Penning Klipping 1518. Struck in the run-up to the 1523 deposition — Christian II''s attempt to fund the peasant crisis and the war with Sweden through emergency money. Klipping weights vary widely (1.47-2.35 g per fragment), fineness not fixed in the Brev; Wilcke p. 153 characterises them as «<i>betydelig tungere</i>» Skilling pieces followed by a sharp downward drift.'
        uk: 'Klipping-ордонанс 1518 запроваджує радикально девальвовані надзвичайні Klippinge — Wilcke 7-2 с. 157 verbatim «<i>ydel Kobber</i>» (по суті мідь). Еталонна серія Galster S. 26-27 + S. 29-31 (18-Penning + 1-Skilling Klippinge); Numista-297656 засвідчує 18 Penning Klipping 1518. Карбування напередодні скинення 1523 — спроба Кристіана II через надзвичайні гроші фінансувати селянську кризу + шведську війну. Вага Klippinge сильно варіює (1,47-2,35 г на уламок), проба у Brev не зафіксована; Wilcke с. 153 характеризує їх як «<i>betydelig tungere</i>» Skilling-и з подальшим різким спадом.'
    - id: A3
      year_from: 1523
      year_to: 1523
      from_label: '1523'
      to_label: '1523'
      title:
        de: 'Phase A3 · Final-Konsolidierung 1523 · Massen-Sølvgylden Malmø pre-Absetzung 13. April 1523'
        en: 'Phase A3 · Final consolidation 1523 · mass Sølvgylden Malmø pre-deposition 13 April 1523'
        uk: 'Фаза A3 · Фінальна консолідація 1523 · масова Sølvgylden Мальме напередодні скинення 13 квітня 1523'
        da: Fase A3 · afsluttende konsolidering 1523 · masseprægning af sølvgylden i Malmø før afsættelsen 13. april 1523
      description:
        de: 'Letzte Sølvgylden-Massenkarbung in Malmø am Vorabend der Absetzung. Wilcke 7-2 S. 156 verbatim «<i>meget almindelig</i>» (sehr verbreitet). Belegexemplare <b>Bruun-3933 + Bruun-3934</b> (Bruun-Lots im Stack''s Bowers Auktionskatalog Part I) attestieren Specimen-Brutto 28,74-29,49 g — 4-7 % über dem ordinance-Soll 27,51 g, typische frühneuzeitliche Specimen-Spannweite. Karbung endet abrupt mit Christian IIs Flucht ins Exil (13. April 1523); Frederik I übernimmt die dänische Krone und erläßt 25. Februar 1524 eine neue Møntordning ([fuss:8_gylden_fod]), die die Sølvgylden-Stückzahl auf 8/M strafft.'
        en: 'Last Sølvgylden mass coinage at Malmø on the eve of the deposition. Wilcke 7-2 p. 156 verbatim «<i>meget almindelig</i>» (very common). Reference specimens <b>Bruun-3933 + Bruun-3934</b> (Bruun lots in the Stack''s Bowers Part I auction catalogue) attest specimen brutto 28.74-29.49 g — 4-7 % over the ordinance soll 27.51 g, typical early-modern specimen range. Coinage ends abruptly with Christian II''s flight into exile (13 April 1523); Frederik I takes the Danish crown and issues a new Møntordning on 25 February 1524 ([fuss:8_gylden_fod]), which tightens the Sølvgylden count to 8/M.'
        uk: 'Остання масова Sølvgylden-карбування у Мальме напередодні скинення. Wilcke 7-2 с. 156 verbatim «<i>meget almindelig</i>» (дуже поширене). Еталонні зразки <b>Bruun-3933 + Bruun-3934</b> (Bruun-лоти у каталозі Stack''s Bowers Part I) засвідчують повну вагу зразка 28,74-29,49 г — 4-7 % понад ordinance-soll 27,51 г, типовий ранньомодерний specimen-діапазон. Карбування завершується раптово втечею Кристіана II до вигнання (13 квітня 1523); Frederik I приймає данську корону і 25 лютого 1524 видає нову Møntordning ([fuss:8_gylden_fod]), яка стискає кількість Sølvgylden до 8/M.'
  8_gylden_fod:
    - id: A1
      year_from: 1524
      year_to: 1531
      from_label: '1524'
      to_label: '1531'
      title:
        de: 'Phase A1 · Hauptphase 1524-1531 · 8 Sølvgylden/M @ 14 Lod, mf 9,143, 25,578 g fein je Sølvgylden — København + Malmø'
        en: 'Phase A1 · Main phase 1524-1531 · 8 Sølvgylden/M at 14 Lod, mf 9.143, 25.578 g fine per Sølvgylden — Copenhagen + Malmø'
        uk: 'Фаза A1 · Головна фаза 1524-1531 · 8 Sølvgylden/M за 14 Lod, mf 9,143, 25,578 г чистого на Sølvgylden — Копенгаген + Мальме'
        da: Fase A1 · hovedfasen 1524-1531 · 8 sølvgylden pr. mark ved 14 lod, mf 9,143, 25,578 g fin pr. sølvgylden — København og Malmø
      description:
        de: 'Baseline-Phase der Møntordning vom 25. Februar 1524. <b>Karbung beginnt mit dem 14-Penning-Stück</b> (separater Akt 26. Februar 1524) als Klipping-Indfrielse-Mønt: Christian-IIs Klippinge werden gegen 14-Penning-Stücke umgetauscht. Numista-Belege f1g-* attestieren 14 Penning / 14 Penny aus Kopenhagen 1524 (Frederik I); Mzm. Jørgen Koch in Malmø, Hans Dringenberg in Aalborg (vorübergehende Filiale). 4 Skilling 1525 København (Galster f1g-Belegserie). Sølvgylden-Karbung erst ab 1531 dokumentiert — vermutlich pre-1531 Sølvgylden-Stücke in Wilcke-Reichweite, aber spezifische Galster-Datierungen ab 1531. Hauptmünzanstalt: Hovedmønten Malmø unter Mzm. Jørgen Koch (1520s).'
        en: 'Baseline phase of the Møntordning of 25 February 1524. <b>Coinage begins with the 14-Penning piece</b> (separate act of 26 February 1524) as Klipping redemption coin: Christian II''s Klippinge are exchanged for 14-Penning pieces. Numista records f1g-* attest 14 Penning / 14 Penny from Copenhagen 1524 (Frederik I); mintmaster Jørgen Koch at Malmø, Hans Dringenberg at Aalborg (temporary branch). 4 Skilling 1525 Copenhagen (Galster f1g reference series). Sølvgylden coinage first documented from 1531 — likely pre-1531 Sølvgylden pieces within Wilcke''s reach, but specific Galster datings begin in 1531. Main mint: Hovedmønten Malmø under mintmaster Jørgen Koch (1520s).'
        uk: 'Baseline-фаза Møntordning від 25 лютого 1524. <b>Карбування починається з 14-Penning-штуки</b> (окремий акт 26 лютого 1524) як Klipping-обмінна монета: Klippinge Кристіана II обмінювалися на 14-Penning штуки. Numista-записи f1g-* засвідчують 14 Penning / 14 Penny з Копенгагена 1524 (Frederik I); монетмайстер Jørgen Koch у Мальме, Hans Dringenberg у Aalborg (тимчасова філія). 4 Skilling 1525 Копенгаген (еталонна серія Galster f1g). Sølvgylden-карбування вперше задокументовано з 1531 — імовірно пре-1531 Sølvgylden-штуки в межах досяжності Wilcke, але специфічні Galster-датування починаються з 1531. Головний монетний двір: Hovedmønten Мальме за монетмайстра Jørgen Koch (1520-ті).'
    - id: A2
      year_from: 1532
      year_to: 1532
      from_label: '1532'
      to_label: '1532'
      title:
        de: 'Phase A2 · Final-Konsolidierung 1532 · Galster 47-52 Sølvgylden-Serie · København'
        en: 'Phase A2 · Final consolidation 1532 · Galster 47-52 Sølvgylden series · Copenhagen'
        uk: 'Фаза A2 · Фінальна консолідація 1532 · серія Galster 47-52 Sølvgylden · Копенгаген'
        da: Fase A2 · afsluttende konsolidering 1532 · sølvgyldenserien Galster 47-52 · København
      description:
        de: 'Finale Karbungs-Periode Frederik Is, dominiert von der <b>Sølvgylden-Serie Galster 47-52</b>: 1 Sølvgylden 1532 (Galster 47, 37,75 g brutto), 1½ Sølvgylden 1532 (Galster 48, 45,58 g — Doppel-Stück), ½ Sølvgylden 1532 mit Pillars/Statues-Obvers (Galster 48, 14,98 g), ¼ Sølvgylden 1532 (Galster 52, 7 g). Karbung in København unter Mzm. Jørgen Drews (transferiert von Husum) im <b>«<i>Nødens Aaret 1532</i>»</b> (Wilcke 7-2 S. 187 verbatim) — Frederik Is letztes volles Karbungs-Jahr. Tod des Königs 10. April 1533; Karbungs-Pause bis Christian IIIs Krönung 1537 + de-facto-Etablierung 1534-1540 [fuss:8_daler_fod] Phase 0 1534-1540.'
        en: 'Frederik I''s final coinage period, dominated by the <b>Galster 47-52 Sølvgylden series</b>: 1 Sølvgylden 1532 (Galster 47, 37.75 g brutto), 1½ Sølvgylden 1532 (Galster 48, 45.58 g — double piece), ½ Sølvgylden 1532 with Pillars/Statues obverse (Galster 48, 14.98 g), ¼ Sølvgylden 1532 (Galster 52, 7 g). Coinage at Copenhagen under mintmaster Jørgen Drews (transferred from Husum) in <b>«<i>Nødens Aaret 1532</i>»</b> (Wilcke 7-2 p. 187 verbatim) — Frederik I''s last full year of coinage. King''s death 10 April 1533; coinage pause until Christian III''s coronation 1537 + de-facto establishment 1534-1540 [fuss:8_daler_fod] Phase 0 1534-1540.'
        uk: 'Фінальний період карбування Frederik I, домінований <b>серією Galster 47-52 Sølvgylden</b>: 1 Sølvgylden 1532 (Galster 47, 37,75 г повної), 1½ Sølvgylden 1532 (Galster 48, 45,58 г — подвійна штука), ½ Sølvgylden 1532 з Pillars/Statues-обверсом (Galster 48, 14,98 г), ¼ Sølvgylden 1532 (Galster 52, 7 г). Карбування у Копенгагені за монетмайстра Jørgen Drews (переведений з Хузума) у <b>«<i>Nødens Aaret 1532</i>»</b> (Wilcke 7-2 с. 187 verbatim) — останній повний рік карбування Frederik I. Смерть короля 10 квітня 1533; пауза карбування до коронації Кристіана III 1537 + де-факто-встановлення 1534-1540 [fuss:8_daler_fod] Phase 0 1534-1540.'
  8_daler_fod:
    - id: '0'
      year_from: 1534
      year_to: 1540
      from_label: '1534'
      to_label: '1540'
      title:
        de: Phase 0 · De-facto-Etablierung 1534-1540 · Grevens-Fejde-Notmünz-Kaskade + 1537 Joachimsdaler Kopenhagen 14½-Lod-Anker — Mzm. Reynold Junge
        en: Phase 0 · De-facto establishment 1534-1540 · Counts' Feud emergency-coinage cascade + 1537 Joachimsdaler Copenhagen 14½-Lod anchor — mintmaster Reynold Junge
        uk: Фаза 0 · Де-факто-встановлення 1534-1540 · каскад надзвичайної монети Grevens Fejde + 1537 Joachimsdaler Копенгаген 14½-Lod якір — монетмайстер Reynold Junge
        da: Fase 0 · de facto-etablering 1534-1540 · nødmøntkaskaden under Grevens Fejde og joachimsdaleren fra København 1537 med 14½ lod som anker — møntmester Reynold Junge
      description:
        de: "Vor-Møntordnungs-Phase: das 14½-Lod-Daler-Standard <b>de facto</b> etabliert durch Reynold Junges Karbung. Wilcke 1950 Kap. 7-3 S. 242 verbatim: «<i>die 1537 Karbung etabliert das 14½-Lod-Daler-Standard</i>». Drei interne Sub-Phasen: <b>(1) 1534-1536 Grevens-Fejde-Notmünz-Kaskade</b> — 2-Mark-Klippinge bei 10/8/7 Lod (.625/.500/.4375), 4-Skilling-Klippinge bei 5/4/3½ Lod (.3125/.250/.219), sub-Skilling-Tiers bei 3-2½ Lod — Kriegszeit-Debasierung der unteren Stückelungs-Tiers, ohne Veränderung des Hauptkurant-Standards (Junge zieht von Aarhus 1535 nach Roskilde 1535-37 — Mzm-Bewegung dokumentiert Frontverschiebung im Bürgerkrieg). <b>(2) 1537 Joachimsdaler-Anker Kopenhagen</b> — 8 Stk./Marck rauh @ 14½ Lod = 29,232 g rauh / 26,494 g fein (Bruun-4276 + 4277 + 4278 drei Stack''s-Bowers-Lots ≈ 28,5-28,94 g brutto). <em>Metrisch identisch mit Phase A1 ab 1541</em> — die 1537 Karbung etabliert das Daler-Standard de facto 4 Jahre vor der formalen Møntordning. <b>(3) 1538-1540 Konsolidierungs-Übergang</b> — Sub-Skilling-Notmünzen laufen fort, Junge bereitet aber die zentrale Kopenhagener Hauptmünze für die Møntordnungs-Karbung vor; ab Aufdeckung als Betrüger 1540-41 Übergabe an Povel Fechtel. <em>Belegexemplare</em>: Bruun-4155 2 Mark Klippe 1535 Aarhus (Galster 92B, 11,05 g, variant 2 @ 8 Lod), Bruun-4156 8 Skilling Klippe 1535 Aarhus (Galster 93, 2,72 g), Bruun-4194 1 Mark 1535 Roskilde, Bruun-4232 8 Skilling 1535 Stockholm (Sieg-24), Bruun-4276/4277/4278 Joachimsdaler 1537 Kopenhagen, Bruun-4279 ½ Joachimsdaler 1537.dk Galster-Hede-Katalog (kontinuierliche Auflistung), Wilcke 1950 Metric-Continuity-Statement, und Reynold-Junge-Mintmaster-Kontinuität 1534-1540."
        en: "Pre-Møntordning phase: the 14½-Lod Daler standard <b>de facto</b> established through Reynold Junge's coinage. Wilcke 1950 Kap. 7-3 p. 242 verbatim: «<i>die 1537 Karbung etabliert das 14½-Lod-Daler-Standard</i>» (the 1537 coinage establishes the 14½-Lod Daler standard). Three internal sub-phases: <b>(1) 1534-1536 Counts' Feud emergency-coinage cascade</b> — 2-Mark Klippinge at 10/8/7 Lod (.625/.500/.4375), 4-Skilling Klippinge at 5/4/3½ Lod (.3125/.250/.219), sub-Skilling tiers at 3-2½ Lod — wartime debasement of the lower-denomination tiers, without altering the Hauptkurant standard (Junge moves from Aarhus 1535 to Roskilde 1535-37 — mintmaster movement tracks the civil-war front). <b>(2) 1537 Joachimsdaler anchor Copenhagen</b> — 8 pieces/mark rough at 14½ Lod = 29.232 g rough / 26.494 g fine (Bruun-4276 + 4277 + 4278 three Stack's Bowers lots ≈ 28.5-28.94 g brutto). <em>Metrically identical to Phase A1 from 1541</em> — the 1537 coinage establishes the Daler standard de facto four years before the formal Møntordning. <b>(3) 1538-1540 consolidation transition</b> — sub-Skilling emergency coinage continues, but Junge prepares the central Copenhagen royal mint for the Møntordning programme; upon his exposure as fraudster 1540-41 hand-over to Povel Fechtel. <em>Reference specimens</em>: Bruun-4155 2 Mark Klippe 1535 Aarhus (Galster 92B, 11.05 g, variant 2 at 8 Lod), Bruun-4156 8 Skilling Klippe 1535 Aarhus (Galster 93, 2.72 g), Bruun-4194 1 Mark 1535 Roskilde, Bruun-4232 8 Skilling 1535 Stockholm (Sieg-24), Bruun-4276/4277/4278 Joachimsdaler 1537 Copenhagen, Bruun-4279 ½ Joachimsdaler 1537.dk Galster-Hede catalogue (continuous listing), Wilcke 1950 metric-continuity statement, and Reynold Junge mintmaster continuity 1534-1540."
        uk: "Pre-Møntordning фаза: стандарт 14½-Lod Daler <b>де факто</b> встановлено карбуванням Reynold Junge. Wilcke 1950 Kap. 7-3 с. 242 verbatim: «<i>die 1537 Karbung etabliert das 14½-Lod-Daler-Standard</i>» (карбування 1537 встановлює стандарт 14½-Lod Daler). Три внутрішні sub-фази: <b>(1) 1534-1536 каскад надзвичайної монети Grevens Fejde</b> — 2-Mark Klippinge за 10/8/7 Lod (.625/.500/.4375), 4-Skilling Klippinge за 5/4/3½ Lod (.3125/.250/.219), sub-Skilling-tier-и за 3-2½ Lod — воєнна девальвація нижніх tier-ів номіналів, без зміни Hauptkurant-стандарту (Junge переміщується з Aarhus 1535 до Roskilde 1535-37 — рух монетмайстра простежує фронт громадянської війни). <b>(2) 1537 Joachimsdaler-якір Копенгаген</b> — 8 шт./марку повної ваги за 14½ Lod = 29,232 г повної / 26,494 г чистого (Bruun-4276 + 4277 + 4278 — три Stack''s-Bowers-лоти ≈ 28,5-28,94 г повної). <em>Метрично ідентичний фазі A1 від 1541</em> — карбування 1537 встановлює стандарт Daler де факто за чотири роки до формальної Møntordning. <b>(3) 1538-1540 перехідна консолідація</b> — sub-Skilling надзвичайна монета триває, але Junge готує центральний Копенгагенський королівський монетний двір до програми Møntordning; з викриттям як шахрая 1540-41 передача Povel Fechtel. <em>Еталонні зразки</em>: Bruun-4155 2 Mark Klippe 1535 Aarhus (Galster 92B, 11,05 г, варіант 2 за 8 Lod), Bruun-4156 8 Skilling Klippe 1535 Aarhus (Galster 93, 2,72 г), Bruun-4194 1 Mark 1535 Roskilde, Bruun-4232 8 Skilling 1535 Stockholm (Sieg-24), Bruun-4276/4277/4278 Joachimsdaler 1537 Копенгаген, Bruun-4279 ½ Joachimsdaler 1537.dk (безперервне списування), заявою Wilcke 1950 про метричну неперервність, та неперервністю Reynold Junge як монетмайстра 1534-1540."
    - id: A1
      year_from: 1541
      year_to: 1543
      from_label: '1541'
      to_label: '1543'
      title:
        de: 'Phase A1 · Baseline 1541-1543 · mf 8,827, 14½ Lod (906¼ ‰), 26,494 g fein je Daler — København'
        en: 'Phase A1 · Baseline 1541-1543 · mf 8.827, 14½ Lod (906¼ ‰), 26.494 g fine per Daler — København'
        uk: 'Фаза A1 · Baseline 1541-1543 · mf 8,827, 14½ Lod (906¼ ‰), 26,494 г чистого на Daler — Копенгаген'
        da: Fase A1 · udgangspunktet 1541-1543 · mf 8,827, 14½ lod (906¼ ‰), 26,494 g fin pr. daler — København
      description:
        de: 'Baseline-Phase der <b>Møntordning vom 20. September 1541</b> Christians III.<sup>[ref:denmark-ref29-no-url]</sup>: acht Daler aus der Cölln. Marck fein bei 14½ Lod, Marken-fin <b>mf 8,827</b>, 26,494 g fein je Daler. Dreistufige Stückelung: vollwertige Kurantmünze (Daler / Mark / 8 Skilling / 4 Skilling) @ 14½ Lod; Scheidemünze (1 Skilling) @ 4 Lod (250 ‰); Billon (Hvid 4 Lod, Penning 2 Lod). Hauptmünze København unter Mzm. Reynold Junge.'
        en: 'Baseline phase of Christian III''s <b>Møntordning of 20 September 1541</b><sup>[ref:denmark-ref29-no-url]</sup>: eight Daler per Cologne mark fine at 14½ Lod, Marken-fin <b>mf 8.827</b>, 26.494 g fine per Daler. Three-tier denomination: full-value Kurantmünze (Daler / Mark / 8 Skilling / 4 Skilling) at 14½ Lod; Scheidemünze (1 Skilling) at 4 Lod (250 ‰); billon (Hvid 4 Lod, Penning 2 Lod). Principal mint København under mintmaster Reynold Junge.'
        uk: 'Baseline-фаза <b>Møntordning від 20 вересня 1541</b> Кристіана III<sup>[ref:denmark-ref29-no-url]</sup>: вісім Daler з кельнської марки чистого срібла за 14½ Lod, Marken-fin <b>mf 8,827</b>, 26,494 г чистого на Daler. Триступенева структура: повноцінна Kurantmünze (Daler / Mark / 8 Skilling / 4 Skilling) за 14½ Lod; Scheidemünze (1 Skilling) за 4 Lod (250 ‰); billon (Hvid 4 Lod, Penning 2 Lod). Головний монетний двір Копенгаген за монетмайстра Reynold Junge.'
    - id: A2
      year_from: 1544
      year_to: 1555
      from_label: '1544'
      to_label: '1555'
      title:
        de: 'Phase A2 · Debasierung 1544-1555 · Tillæg 27. September 1544 · mf 9,481, ≈ 24,67 g fein je Daler — København'
        en: 'Phase A2 · Debasement 1544-1555 · supplement of 27 September 1544 · mf 9.481, ≈ 24.67 g fine per Daler — København'
        uk: 'Фаза A2 · Девальвація 1544-1555 · Tillæg 27 вересня 1544 · mf 9,481, ≈ 24,67 г чистого на Daler — Копенгаген'
        da: Fase A2 · forringelsen 1544-1555 · tillægget af 27. september 1544 · mf 9,481, ≈ 24,67 g fin pr. daler — København
      description:
        de: 'Tillæg vom 27. September 1544 erhöht den Marken-fin auf <b>mf 9,481</b> (≈ 24,67 g fein je Daler)<sup>[ref:denmark-ref30-no-url]</sup><sup>[ref:denmark-ref31-no-url]</sup>. Feingehalt unverändert bei 14½ Lod (906¼ ‰); Raugewicht reduziert. Wirtschaftlicher Hintergrund: nordeuropäische Silberpreisaufwärtsbewegung 1544+ und Bedarf an Münzgeld für Schmalkaldischer-Krieg-Subventionszahlungen Christians III.'
        en: 'The supplement of 27 September 1544 raises Marken-fin to <b>mf 9.481</b> (≈ 24.67 g fine per Daler)<sup>[ref:denmark-ref30-no-url]</sup><sup>[ref:denmark-ref31-no-url]</sup>. Fineness unchanged at 14½ Lod (906¼ ‰); rough weight reduced. Economic background: northern-European silver price uptrend from 1544 onwards and Christian III''s need for mint money to fund Schmalkaldic War subsidies.'
        uk: 'Tillæg від 27 вересня 1544 підвищує Marken-fin до <b>mf 9,481</b> (≈ 24,67 г чистого на Daler)<sup>[ref:denmark-ref30-no-url]</sup><sup>[ref:denmark-ref31-no-url]</sup>. Проба незмінна 14½ Lod (906¼ ‰); повна вага зменшена. Економічний контекст: північноєвропейський підйом цін на срібло з 1544+ і потреба Кристіана III у монетних коштах для субсидій Шмалькальденської війни.'
  8_daler_lybsk_fod:
    - id: I
      year_from: 1545
      year_to: 1571
      from_label: '1545'
      to_label: '1571'
      title:
        de: 'Phase I · Flensborg Bestalling 1547 · 14¼ Lod (890⅝ ‰) · mf 8,982, 26,029 g fein je Daler · Lybsk-Untertheilung'
        en: 'Phase I · Flensborg Bestalling 1547 · 14¼ Lod (890⅝ ‰) · mf 8.982, 26.029 g fine per Daler · Lybsk subdivision'
        uk: 'Фаза I · Flensborg Bestalling 1547 · 14¼ Lod (890⅝ ‰) · mf 8,982, 26,029 г чистого на Daler · любекська підструктура'
        da: Fase I · Flensborg-bestallingen 1547 · 14¼ lod (890⅝ ‰) · mf 8,982, 26,029 g fin pr. daler · lybsk underdeling
      description:
        de: 'Flensborg Bestalling vom 22. Januar 1547 unter Mzm. Jørgen Kock dem Jüngeren<sup>[ref:denmark-ref29-no-url]</sup>. Daler-Brutto identisch zur königlichen Linie (29,232 g, 8 Stück / Cölln. Marck rauh), aber Feingehalt abgesenkt auf 14¼ Lod (890⅝ ‰) ⇒ <b>mf 8,982</b>, 26,029 g fein je Daler (1,75 % leichter als royal). Sub-Mark in Lybsk-Untertheilung: <b>1 Gylden = 24 ß lybsk = 288 Penning lybsk</b><sup>[ref:denmark-ref29-no-url]</sup><sup>[ref:denmark-ref32-no-url]</sup> (vs königliche 48 ß danske). Hauptphase 1545-1554; Auslauf biß 1571 unter Frederik II. Geprägt: Rhinsk Gylden, Sølvgylden, Søsling lybsk (Hede c3h15-c3h22.'
        en: 'Flensborg Bestalling of 22 January 1547 under mintmaster Jørgen Kock the Younger<sup>[ref:denmark-ref29-no-url]</sup>. Daler brutto identical to the royal line (29.232 g, 8 pieces per Cologne mark rough), but fineness reduced to 14¼ Lod (890⅝ ‰) ⇒ <b>mf 8.982</b>, 26.029 g fine per Daler (1.75 % lighter than royal). Sub-Mark in Lybsk subdivision: <b>1 Gylden = 24 ß lybsk = 288 Penning lybsk</b><sup>[ref:denmark-ref29-no-url]</sup><sup>[ref:denmark-ref32-no-url]</sup> (vs royal 48 ß danske). Main phase 1545-1554; tail through 1571 under Frederik II. Coinage: Rhinsk Gylden, Sølvgylden, Søsling lybsk (Hede c3h15-c3h22.'
        uk: 'Flensborg Bestalling від 22 січня 1547 за монетмайстра Jørgen Kock молодшого<sup>[ref:denmark-ref29-no-url]</sup>. Daler повної ваги ідентично royal-лінії (29,232 г, 8 шт. з кельнської марки повної), але проба знижена до 14¼ Lod (890⅝ ‰) ⇒ <b>mf 8,982</b>, 26,029 г чистого на Daler (на 1,75 % легший за royal). Sub-Mark у любекській підструктурі: <b>1 Gylden = 24 ß lybsk = 288 Penning lybsk</b><sup>[ref:denmark-ref29-no-url]</sup><sup>[ref:denmark-ref32-no-url]</sup> (vs royal 48 ß danske). Головна фаза 1545-1554; заник до 1571 за Фредеріка II. Карбування: Rhinsk Gylden, Sølvgylden, Søsling lybsk (Hede c3h15-c3h22.'
  rhinsk_gylden_fod:
    - id: '0'
      year_from: 1496
      year_to: 1510
      from_label: '1496'
      to_label: '1510'
      title:
        de: 'Vor der ersten dänischen Müntzordnung · Maßstab: Wormser Reichsabschied 1495 — 18½ Karat · befundene Probe 17¾ Karat'
        en: 'Before the first Danish coinage ordinance · benchmark: Wormser Reichsabschied 1495 — 18½ carats · assayed fineness 17¾ carats'
        uk: 'До першої данської монетної ординації · мірило: Wormser Reichsabschied 1495 — 18½ карата · виявлена проба 17¾ карата'
        da: 'Før den første danske møntordning · målestok: Wormser Reichsabschied 1495 — 18½ karat · målt lødighed 17¾ karat'
      description:
        de: 'Die Karbung <b>Hans</b>'' (reg. 1481-1513) geht jeder dänischen Goldordonnanz voraus — das Reich hatte mit dem <b>Wormser Reichsabschied 1495</b> die Norm der vier Rheinischen Kurfürsten bereits verbindlich gemacht<sup>[ref:wilcke6-worms-1495-reichsabschied]</sup><sup>[ref:wilcke6-rhinfyrster-1490-norm]</sup>, Dänemark aber erst 1514. Die undatierte Malmø-/Kopenhagener Karbung «formentlig slået omkring 1497» diente der Soldzahlung an die deutschen Söldner im Krieg gegen Sten Sture<sup>[ref:danskmoent-hans-rhinsk-gylden-1497]</sup>; nach Hvitfeldt wurden dafür 150 000 Stück geschlagen<sup>[ref:wilcke6-hans-150000-gylden-1497]</sup>. Unter derselben Regierung prägt Hans auch in Bergen (~1505-1510) — <i>REX NORWEGIE</i> / <i>MONETA NOVA AVREA BERGE</i>, die früheste in Norwegen geschlagene Goldmünze<sup>[ref:danskmoent-hans-goldgulden-bergen]</sup>. Was der König selbst unter dem Standard verstand, hält seine <b>Møntanordning vom 4. Dezember 1497</b> fest: «<i>guldmynt på Rhenska gulden slag</i>», 72 Stück auf die 18½ Karat feine Marck — ein für Schweden erlassener und nie ausgeführter Befehl<sup>[ref:wilcke6-hans-moentanordning-1497-sverige]</sup>. Der Nürnberger Valvationstag von 1551 fand das überlieferte Stück «<i>kun ca. 3/4 Karat</i>» unter dieser Norm, also bei 17¾ Karat<sup>[ref:wilcke6-valvationstag-1551]</sup>; das Untergewicht der Feinheit ist mithin nicht verordnet, sondern gemessen, und erscheint als Abweichung.'
        en: '<b>Hans</b>'' coinage (r. 1481-1513) precedes every Danish gold ordinance — the Empire had already made the four Rhenish electors'' norm binding through the <b>Wormser Reichsabschied 1495</b><sup>[ref:wilcke6-worms-1495-reichsabschied]</sup><sup>[ref:wilcke6-rhinfyrster-1490-norm]</sup>, while Denmark did so only in 1514. The undated Malmø/Copenhagen coinage «formentlig slået omkring 1497» was struck to pay the German mercenaries in the war against Sten Sture<sup>[ref:danskmoent-hans-rhinsk-gylden-1497]</sup>; after Hvitfeldt, 150,000 pieces were struck for it<sup>[ref:wilcke6-hans-150000-gylden-1497]</sup>. Under the same reign Hans also strikes at Bergen (~1505-1510) — <i>REX NORWEGIE</i> / <i>MONETA NOVA AVREA BERGE</i>, the earliest gold coin struck in Norway<sup>[ref:danskmoent-hans-goldgulden-bergen]</sup>. What the king himself understood by the standard is recorded in his <b>Møntanordning of 4 December 1497</b>: «<i>guldmynt på Rhenska gulden slag</i>», 72 pieces to the 18½-carat mark — an order issued for Sweden and never executed<sup>[ref:wilcke6-hans-moentanordning-1497-sverige]</sup>. The Nürnberg Valvationstag of 1551 found the surviving type «<i>kun ca. 3/4 Karat</i>» below that norm, i.e. at 17¾ carats<sup>[ref:wilcke6-valvationstag-1551]</sup>; the shortfall in fineness is therefore measured, not decreed, and shows as a deviation.'
        uk: 'Карбування <b>Ганса</b> (прав. 1481-1513) передує будь-якій данській золотій ординації — Імперія вже зробила норму чотирьох рейнських курфюрстів обов''язковою <b>Вормським Reichsabschied 1495</b><sup>[ref:wilcke6-worms-1495-reichsabschied]</sup><sup>[ref:wilcke6-rhinfyrster-1490-norm]</sup>, тоді як Данія — аж 1514 р. Недатоване карбування в Мальме/Копенгагені «formentlig slået omkring 1497» призначалося для оплати німецьким найманцям у війні проти Sten Sture<sup>[ref:danskmoent-hans-rhinsk-gylden-1497]</sup>; за Hvitfeldt для цього викарбувано 150 000 штук<sup>[ref:wilcke6-hans-150000-gylden-1497]</sup>. За того ж правління Ганс карбує й у Бергені (~1505-1510) — <i>REX NORWEGIE</i> / <i>MONETA NOVA AVREA BERGE</i>, найраніша золота монета, викарбувана в Норвегії<sup>[ref:danskmoent-hans-goldgulden-bergen]</sup>. Що сам король розумів під цим стандартом, фіксує його <b>Møntanordning від 4 грудня 1497 р.</b>: «<i>guldmynt på Rhenska gulden slag</i>», 72 штуки на марку 18½ карата — наказ, виданий для Швеції й ніколи не виконаний<sup>[ref:wilcke6-hans-moentanordning-1497-sverige]</sup>. Нюрнберзький Valvationstag 1551 р. знайшов збережений тип на «<i>kun ca. 3/4 Karat</i>» нижче цієї норми, тобто на 17¾ карата<sup>[ref:wilcke6-valvationstag-1551]</sup>; отже, недобір проби не приписаний, а виміряний, і показується як відхилення.'
    - id: I
      year_from: 1514
      year_to: 1547
      from_label: '1514'
      to_label: '1547'
      title:
        de: 'Møntordning Sommer 1514 · Møntordning 25. Februar 1524 — 72 Stück aus der rauen Cöllnischen Marck zu 18 Karat · 2,436 g fein je Stück'
        en: 'Møntordning of Summer 1514 · Møntordning of 25 February 1524 — 72 pieces to the rough Cologne Mark at 18 carats · 2.436 g fine per piece'
        uk: 'Møntordning літа 1514 · Møntordning 25 лютого 1524 — 72 штуки з повної кельнської марки за 18 карат · 2,436 г чистого на штуку'
        da: Møntordning af sommeren 1514 · Møntordning af 25. februar 1524 — 72 stykker af den rå Cöllnische Marck ved 18 karat · 2,436 g fin pr. stykke
      description:
        de: 'Die <b>Møntordning Christians II. vom Sommer 1514</b> gibt dem Rhinsk Gylden erstmals eine dänische Rechtsgrundlage — 18 Karat bei 72 Stück aus der Marck<sup>[ref:wilcke-rhinsk-gylden-1514-standard]</sup> —, und die <b>Møntordning Frederiks I. vom 25. Februar 1524</b> wiederholt dieses Gold-Raster unverändert<sup>[ref:wilcke-rhinsk-gylden-1524-standard]</sup>. Beide setzen die Probe um ein halbes Karat unter die rheinische Norm. <b>Frederik I.</b> (reg. 1523-1533) karbt 1527 in Malmø<sup>[ref:danskmoent-f1-rhinsk-gylden-1527]</sup>, <b>Christian III.</b> (reg. 1534-1559) 1536 in Roskilde und 1546-1547 in Flensborg (1 und 2 Goldgulden)<sup>[ref:danskmoent-c3-rhinsk-gylden-1546]</sup>; mit der Flensborger Karbung endet die Phase. Parallel dazu läuft in denselben Jahren die Karbung des Königs in seiner herzoglichen Eigenschaft — Gottorp, Flensborg, Holstein — nach denselben Vorgaben; das Stück von 1536 trägt beide Emittenten zugleich. Die 1534-1536 geschlagenen Stücke halten mit .764 nicht weniger, sondern <i>mehr</i> als die dänische Vorgabe: sie liegen auf den 18⅓ Karat, die der Valvationstag von 1551 als die im Reich übliche Ausbringung des Normalgyldens festhält — 108 Stück je 1½ Marck, für die keine Ordonnanz überliefert ist<sup>[ref:wilcke6-normalgylden-ausbringung-1551]</sup>. Über der dänischen Vorgabe, doch unter der Reichsnorm von 18½ Karat — und eben dieses Zurückbleiben hinter der Reichsnorm verbindet Wilcke mit dem Müntzedikt Kaiser Ferdinands I. vom 19. August 1559, das Christian III.s und Kong Hans'' Guldgylden für ungültig erklärte<sup>[ref:wilcke6-ferdinand-moentedikt-1559]</sup>.'
        en: 'The <b>Møntordning of Christian II of Summer 1514</b> gives the Rhinsk Gylden its first Danish legal basis — 18 carats at 72 pieces to the mark<sup>[ref:wilcke-rhinsk-gylden-1514-standard]</sup> — and the <b>Møntordning of Frederik I of 25 February 1524</b> restates that gold grid unchanged<sup>[ref:wilcke-rhinsk-gylden-1524-standard]</sup>. Both set the fineness half a carat below the Rhenish norm. <b>Frederik I</b> (r. 1523-1533) strikes at Malmø in 1527<sup>[ref:danskmoent-f1-rhinsk-gylden-1527]</sup>, <b>Christian III</b> (r. 1534-1559) at Roskilde in 1536 and at Flensburg in 1546-1547 (1 and 2 Goldgulden)<sup>[ref:danskmoent-c3-rhinsk-gylden-1546]</sup>; the Flensburg coinage closes the phase. Running alongside it in the same years is the king''s coinage in his ducal capacity — Gottorp, Flensburg, Holstein — on the same specification; the 1536 piece carries both issuers at once. The pieces struck in 1534-1536 hold at .764 not less but <i>more</i> than the Danish specification: they sit at the 18⅓ carats which the Valvationstag of 1551 records as the customary output of the Normalgylden within the Empire — 108 pieces to 1½ marks, for which no ordinance is recorded<sup>[ref:wilcke6-normalgylden-ausbringung-1551]</sup>. Above the Danish specification, yet below the imperial norm of 18½ carats — and it is this shortfall against the imperial norm that Wilcke connects to Emperor Ferdinand I''s edict of 19 August 1559, which declared Christian III''s and Kong Hans'' Guldgylden void<sup>[ref:wilcke6-ferdinand-moentedikt-1559]</sup>.'
        uk: '<b>Møntordning Кристіана II літа 1514 р.</b> вперше дає Rhinsk Gylden данську правову основу — 18 карат за 72 штуки з марки<sup>[ref:wilcke-rhinsk-gylden-1514-standard]</sup>, а <b>Møntordning Фредеріка I від 25 лютого 1524 р.</b> повторює цю золоту сітку без змін<sup>[ref:wilcke-rhinsk-gylden-1524-standard]</sup>. Обидві ставлять пробу на пів карата нижче за рейнську норму. <b>Фредерік I</b> (прав. 1523-1533) карбує 1527 р. у Мальме<sup>[ref:danskmoent-f1-rhinsk-gylden-1527]</sup>, <b>Кристіан III</b> (прав. 1534-1559) — 1536 р. у Роскілле та 1546-1547 рр. у Фленсбурзі (1- і 2-Goldgulden)<sup>[ref:danskmoent-c3-rhinsk-gylden-1546]</sup>; фленсбурзьким карбуванням фаза завершується. Паралельно в ті самі роки йде карбування короля в його герцогській іпостасі — Готторп, Фленсбург, Гольштейн — за тими самими приписами; монета 1536 р. несе обох емітентів водночас. Монети 1534-1536 рр. за пробою .764 тримають не менше, а <i>більше</i> за данський припис: вони лежать на 18⅓ карата, які Valvationstag 1551 р. фіксує як звичну в Імперії вибірку Normalgylden — 108 штук з 1½ марки, для якої ординанса не збереглося<sup>[ref:wilcke6-normalgylden-ausbringung-1551]</sup>. Вище за данський припис, але нижче за імперську норму 18½ карата — і саме це відставання від імперської норми Вильке пов''язує з монетним едиктом Фердинанда I від 19 серпня 1559 р., який оголосив голдгульдени Кристіана III і Ганса недійсними<sup>[ref:wilcke6-ferdinand-moentedikt-1559]</sup>.'
    - id: II
      year_from: 1563
      year_to: 1584
      from_label: '1563'
      to_label: '1584'
      title:
        de: 'Møntedikt Kaiser Ferdinands I. vom 19. August 1559 — 72 Stück aus der Marck zu 18½ Karat · 2,50367 g fein je Stück'
        en: 'Coinage edict of Emperor Ferdinand I of 19 August 1559 — 72 pieces to the mark at 18½ carats · 2.50367 g fine per piece'
        uk: 'Монетний едикт імператора Фердинанда I від 19 серпня 1559 р. — 72 штуки з марки за 18½ карата · 2,50367 г чистого на штуку'
        da: Kejser Ferdinand 1.s møntedikt af 19. august 1559 — 72 stykker af marken ved 18½ karat · 2,50367 g fin pr. stykke
      description:
        de: 'Zwischen 1524 und 1563 ergeht keine dänische Goldordonnanz; maßgebend wird das <b>Müntzedikt Kaiser Ferdinands I. vom 19. August 1559</b>, das die Probe «<i>endelig … til 72 Stkr. af den 18 1/2 Karat fine Mark</i>» festsetzt und zugleich die älteren Guldgylden Christians III. und Kong Hans'' mit sechsmonatiger Frist für ungültig erklärt<sup>[ref:wilcke6-ferdinand-moentedikt-1559]</sup>. Genau auf dieser Probe karbt <b>Frederik II.</b> ab 1563 in Kopenhagen und 1584 in Frederiksborg<sup>[ref:danskmoent-1rhinsk-gylden]</sup> — die dänische Karbung folgt hier also einem kaiserlichen, nicht einem dänischen Rechtsakt. Anlaß der Wiederaufnahme ist die Kriegsfinanzierung der Nordischen Siebenjährigen Krieges, für die Frederik II. gleichzeitig drei Goldarten schlagen läßt: Ungersk Gylden, Rhinsk Gylden und Kroneguld<sup>[ref:danskmoent-w6b1]</sup>.'
        en: 'No Danish gold ordinance is issued between 1524 and 1563; what governs is the <b>coinage edict of Emperor Ferdinand I of 19 August 1559</b>, which fixes the fineness «<i>endelig … til 72 Stkr. af den 18 1/2 Karat fine Mark</i>» and at the same time voids, at six months'' notice, the older Guldgylden of Christian III and Kong Hans<sup>[ref:wilcke6-ferdinand-moentedikt-1559]</sup>. It is on exactly that fineness that <b>Frederik II</b> strikes from 1563 at Copenhagen and in 1584 at Frederiksborg<sup>[ref:danskmoent-1rhinsk-gylden]</sup> — Danish coinage here follows an imperial, not a Danish, legal act. The occasion for the resumption is the financing of the Northern Seven Years'' War, for which Frederik II has three kinds of gold struck at once: Ungersk Gylden, Rhinsk Gylden and Kroneguld<sup>[ref:danskmoent-w6b1]</sup>.'
        uk: 'Між 1524 і 1563 рр. жодної данської золотої ординації не виходить; визначальним стає <b>монетний едикт імператора Фердинанда I від 19 серпня 1559 р.</b>, який встановлює пробу «<i>endelig … til 72 Stkr. af den 18 1/2 Karat fine Mark</i>» і водночас із піврічним терміном оголошує недійсними давніші голдгульдени Кристіана III та Ганса<sup>[ref:wilcke6-ferdinand-moentedikt-1559]</sup>. Саме на цій пробі <b>Фредерік II</b> карбує від 1563 р. у Копенгагені та 1584 р. у Frederiksborg<sup>[ref:danskmoent-1rhinsk-gylden]</sup> — данське карбування тут іде за імперським, а не данським правовим актом. Приводом до відновлення є фінансування Північної Семирічної війни, задля якого Фредерік II водночас велить бити три золоті типи: Ungersk Gylden, Rhinsk Gylden і Kroneguld<sup>[ref:danskmoent-w6b1]</sup>.'
    - id: III
      year_from: 1619
      year_to: 1627
      from_label: '1619'
      to_label: '1627'
      title:
        de: 'Parallele herzogliche Prägung · Gottorp und die Sonderburger Linien · kein Ordonnanz-Anker, kein Korn überliefert'
        en: 'Parallel ducal coinage · Gottorp and the Sonderburg lines · no ordinance anchor, no fineness recorded'
        uk: 'Паралельне герцогське карбування · Готторп і зондербурзькі лінії · ані ординансного якоря, ані проби'
        da: Parallel hertugelig prægning · Gottorp og de sønderborgske linjer · intet ordonnansanker, ingen overleveret lødighed
      description:
        de: 'Der Guldgylden nach der rheinischen Norm lief in den Herzogtümern nicht über die Krone, sondern über die herzoglichen Linien: Gottorp und die Sonderburger Nebenlinien karbten ihn zwischen 1619 und 1664<sup>[ref:jensen-1971-hans-den-yngre-guldgylden]</sup>. Diese Reihe ist keine eigenständige Abfolge-Periode, sondern eine gleichzeitige herzogliche Linie: sie setzt sechs Jahre vor der Karbung Christians IV. ein, überdeckt sie ganz und läuft in den Herzogtümern noch zweiunddreißig Jahre über deren Ende hinaus. Die Sonderburger führten dabei kein Müntzrecht — das abgeteilte Herzogtum war ein Titularherzogtum, «das weder ein Müntzrecht erhielt noch stehende Truppen unterhalten durfte» — und karbten dennoch. Ein Korn ist für keine dieser Prägungen überliefert; der Fuß selbst bleibt der Wormser Anker von 72 Stück aus der rauen Cöllnischen Marck<sup>[ref:wilcke6-worms-1495-reichsabschied]</sup>.'
        en: 'In the duchies the Rhenish-standard Goldgulden did not come from the crown but from the ducal lines: Gottorp and the Sonderburg cadet branches struck it between 1619 and 1664<sup>[ref:jensen-1971-hans-den-yngre-guldgylden]</sup>. This series is not a sequential period but a concurrent ducal line: it begins six years before Christian IV''s coinage, covers it entirely, and runs on in the duchies for thirty-two years after it ends. The Sonderburg dukes held no coinage right at all — the partitioned duchy was a titular one, «das weder ein Münzrecht erhielt noch stehende Truppen unterhalten durfte» — and struck regardless. No fineness is recorded for any of these issues; the standard itself remains the Worms anchor of 72 pieces to the rough Cologne mark<sup>[ref:wilcke6-worms-1495-reichsabschied]</sup>.'
        uk: 'У герцогствах голдгульден рейнської норми йшов не від корони, а від герцогських ліній: Готторп і зондербурзькі бічні лінії карбували його між 1619 і 1664 роками<sup>[ref:jensen-1971-hans-den-yngre-guldgylden]</sup>. Ця низка — не послідовний період, а одночасна герцогська лінія: вона починається за шість років до карбування Кристіана IV, накриває його цілком і триває в герцогствах ще тридцять два роки після його кінця. Зондербурзькі герцоги при цьому взагалі не мали монетного права — відокремлене герцогство було титулярним, «das weder ein Münzrecht erhielt noch stehende Truppen unterhalten durfte», — і карбували попри це. Проби для жодного з цих карбувань джерела не подають; сама ж стопа лишається вормським якорем у 72 штуки з повної кельнської марки<sup>[ref:wilcke6-worms-1495-reichsabschied]</sup>.'
    - id: IV
      year_from: 1625
      year_to: 1632
      from_label: '1625'
      to_label: '1632'
      title:
        de: 'Kein eigener Ordonnanz-Anker · weiterhin maßgebend das Møntedikt vom 19. August 1559 (18½ Karat) · befundene Probe 18¼ Karat'
        en: 'No ordinance anchor of its own · the coinage edict of 19 August 1559 still governs (18½ carats) · assayed fineness 18¼ carats'
        uk: 'Власного ординансного якоря нема · чинним лишається монетний едикт 19 серпня 1559 р. (18½ карата) · виявлена проба 18¼ карата'
        da: Intet selvstændigt ordonnansanker · fortsat gældende er møntediktet af 19. august 1559 (18½ karat) · målt lødighed 18¼ karat
      description:
        de: 'Wiederaufnahme der Karbung unter <b>Christian IV.</b> in den Jahrgängen <b>1625, 1627, 1628, 1632</b> — dem Zeitraum des <b>Kaiserlich-Dänischen Krieges</b> (Kriegseintritt 1625, Niederlage bei Lutter am Barenberge 1626, Lübecker Frieden 1629). Für diese Karbung ist keine Ordonnanz überliefert: die Ausbringungsverhältnisse des Edikts von 1559 galten «<i>helt ind i Christian IV.s Tid</i>»<sup>[ref:wilcke6-ferdinand-moentedikt-1559]</sup>. Die auf 18¼ Karat abgesenkte Probe ist ein Befund an den erhaltenen Stücken, keine Vorgabe<sup>[ref:danskmoent-1rhinsk-gylden]</sup>; Wilcke ordnet dieses Gold der Soldzahlung zu und hält fest, es sei «<i>til Fordel for Kongen — været søgt noget forringet i Gehalt</i>»<sup>[ref:wilcke6-valvationstag-1551]</sup>. Die Abweichung erscheint deshalb in der Feingewichts-Bilanz. Mit dem Auslauf der Karbung 1632 endet die Linie; Christian IV. wendet sich später der silbernen Krone-Mønt zu (Hebræermønt 1644).'
        en: 'Coinage resumes under <b>Christian IV</b> in the years <b>1625, 1627, 1628, 1632</b> — the span of the <b>Imperial-Danish War</b> (entry 1625, defeat at Lutter am Barenberge 1626, Peace of Lübeck 1629). No ordinance survives for this coinage: the output relations of the 1559 edict held «<i>helt ind i Christian IV.s Tid</i>»<sup>[ref:wilcke6-ferdinand-moentedikt-1559]</sup>. The fineness reduced to 18¼ carats is a finding on the surviving pieces, not a specification<sup>[ref:danskmoent-1rhinsk-gylden]</sup>; Wilcke assigns this gold to military pay and records that it was «<i>til Fordel for Kongen — været søgt noget forringet i Gehalt</i>»<sup>[ref:wilcke6-valvationstag-1551]</sup>. The deviation therefore shows in the fine-weight balance. With the end of coinage in 1632 the line closes; Christian IV later turns to the silver Krone-Mønt (Hebræermønt 1644).'
        uk: 'Карбування відновлюється за <b>Кристіана IV</b> у роки <b>1625, 1627, 1628, 1632</b> — час <b>Імперсько-данської війни</b> (вступ 1625 р., поразка під Lutter am Barenberge 1626, Любекський мир 1629). Для цього карбування ординанса не збереглося: відносини вибірки едикту 1559 р. трималися «<i>helt ind i Christian IV.s Tid</i>»<sup>[ref:wilcke6-ferdinand-moentedikt-1559]</sup>. Знижена до 18¼ карата проба — це висновок з наявних примірників, а не припис<sup>[ref:danskmoent-1rhinsk-gylden]</sup>; Вильке відносить це золото до платні війську і фіксує, що воно було «<i>til Fordel for Kongen — været søgt noget forringet i Gehalt</i>»<sup>[ref:wilcke6-valvationstag-1551]</sup>. Тому відхилення проступає в балансі чистої ваги. Із завершенням карбування 1632 р. лінія закінчується; Кристіан IV згодом звертається до срібної Krone-Mønt (Hebræermønt 1644).'
  f2_guldkrone_fod:
    - id: I
      year_from: 1563
      year_to: 1564
      from_label: '1563'
      to_label: '1564'
      title:
        de: 'Phase I · Klipping-Karbung 1563-1564 · .934 / 3,341 g rauh / 3,120 g fein · Kriegsfinanzierung Nordische Siebenjährige Krieg'
        en: 'Phase I · Klipping coinage 1563-1564 · .934 / 3.341 g rough / 3.120 g fine · Northern Seven Years'' War financing'
        uk: 'Фаза I · Klipping-карбування 1563-1564 · .934 / 3,341 г повної / 3,120 г чистого · фінансування Північної Семирічної війни'
        da: Fase I · klippingprægning 1563-1564 · .934 / 3,341 g rå / 3,120 g fin · finansiering af Den Nordiske Syvårskrig
      description:
        de: 'Klipping-Notmünz-Emission der frühen Phase der Nordischen Siebenjährigen Krieges<sup>[ref:historyofwar-wars-nordic-seven-years]</sup>. <b>Karbung 17. Oktober 1563 verbatim:</b> «<i>17. Oktbr., af 66 1/2 Marck Kroneguld 4,860 Krone Klippinge.</i>» (Wilcke Rentmeister-Rechnungen Kap. 6)<sup>[ref:danskmoent-w6b1]</sup>. Belegexemplare Hede f2h2 (1563, Unikat) + Hede f2h5 (1564), Kopenhagen / Bremerholm-Hauptmünze<sup>[ref:danskmoent-1guldkro]</sup>. Reversinschrift «<i>I GOLT KRONE</i>». Karbung endet 1564 (vermutlich aufgrund knapper Kroneguld-Bestände); Frederik II. wechselt für die restliche Kriegszeit (1565-1570) zu silbernen Klippinge-Notmünzen und zum imperialen 9-Thaler-Fuß ab 1566.'
        en: 'A Klipping emergency-coinage emission of the early phase of the Northern Seven Years'' War<sup>[ref:historyofwar-wars-nordic-seven-years]</sup>. <b>17 October 1563 coinage verbatim:</b> «<i>17. Oktbr., af 66 1/2 Marck Kroneguld 4,860 Krone Klippinge.</i>» (Wilcke Rentmeister account records, Kap. 6)<sup>[ref:danskmoent-w6b1]</sup>. Reference specimens Hede f2h2 (1563, unique) + Hede f2h5 (1564), Copenhagen / Bremerholm royal mint<sup>[ref:danskmoent-1guldkro]</sup>. Reverse inscription «<i>I GOLT KRONE</i>». Coinage ends in 1564 (presumably due to limited Kroneguld stocks); for the remainder of the war (1565-1570) Frederik II shifts to silver Klipping emergency coins and to the imperial 9-Thaler-Fuß from 1566.'
        uk: 'Klipping-надзвичайна емісія ранньої фази Північної Семирічної війни<sup>[ref:historyofwar-wars-nordic-seven-years]</sup>. <b>Карбування 17 жовтня 1563 verbatim:</b> «<i>17. Oktbr., af 66 1/2 Marck Kroneguld 4,860 Krone Klippinge.</i>» (рент-майстерські рахунки Wilcke, Kap. 6)<sup>[ref:danskmoent-w6b1]</sup>. Еталонні зразки Hede f2h2 (1563, унікат) + Hede f2h5 (1564), Копенгаген / Bremerholm-королівський монетний двір<sup>[ref:danskmoent-1guldkro]</sup>. Реверс-напис «<i>I GOLT KRONE</i>». Карбування завершується 1564 (ймовірно через обмежені запаси Kroneguld); на решту війни (1565-1570) Frederik II переходить до срібних Klipping-надзвичайних монет та до імперського 9-Thaler-Fuß з 1566 р.'
    - id: II
      year_from: 1584
      year_to: 1584
      from_label: '1584'
      to_label: '1584'
      title:
        de: 'Phase II · Frederik II. 1584 (Frederiksborg) · Brutto 3,38 g · Probe nicht überliefert · Gold-Geschenksatz'
        en: 'Phase II · Frederik II 1584 (Frederiksborg) · brutto 3.38 g · fineness not transmitted · gold gift set'
        uk: 'Фаза II · Frederik II 1584 (Frederiksborg) · повна вага 3,38 г · пробу не зафіксовано · золотий подарунковий набір'
        da: Fase II · Frederik 2. 1584 (Frederiksborg) · brutto 3,38 g · lødigheden ikke overleveret · guldgavesæt
      description:
        de: 'Einmalige Karbung an der Frederiksborger Münze für das Gold-Geschenkset Königin Sophies, zwanzig Jahre nach dem Ende der Klipping-Karbung. Der Satz wiederholt die Dreiheit der Goldarten von 1563-1564 — Ungersk Gylden ([fuss:reichsdukatenfuss]), Rhinsk Gylden ([fuss:rhinsk_gylden_fod]) und Guldkrone (dieser Müntzfuß) — nun jedoch als Hofgeschenk statt als Kriegsfinanzierung. Brutto 3,38 g; eine Probe ist nicht überliefert, so daß die Zuordnung allein auf dem Raugewicht ruht, das dem 1563-1564er Sollwert von 3,341 g auf 1,2 % nahekommt (errechnet aus 3,38 / 3,341)<sup>[ref:danskmoent-f2h7f-gavesaet-guldkrone]</sup>. Die Guldkrone-Linie bricht danach ab und wird erst 1618 unter Christian IV. mit anderer Metrik und eigener Tarif-Logik wieder aufgenommen ([fuss:guldkrone]).'
        en: 'A single coinage at the Frederiksborg mint for Queen Sophie''s gold gift set, twenty years after the Klipping coinage ended. The set repeats the triad of gold types of 1563-1564 — Ungersk Gylden ([fuss:reichsdukatenfuss]), Rhinsk Gylden ([fuss:rhinsk_gylden_fod]) and Guldkrone (this standard) — now as a court gift rather than wartime financing. Brutto 3.38 g; no fineness is transmitted, so the assignment rests on the gross weight alone, which comes within 1.2 % of the 1563-1564 target of 3.341 g (as computed from 3.38 / 3.341)<sup>[ref:danskmoent-f2h7f-gavesaet-guldkrone]</sup>. The Guldkrone line then breaks off and is resumed only in 1618 under Christian IV with a different metric and its own tariff logic ([fuss:guldkrone]).'
        uk: 'Одноразове карбування на монетному дворі Frederiksborg для золотого подарункового набору королеви Софії, через двадцять років після завершення Klipping-карбування. Набір повторює трійцю золотих типів 1563-1564 — Ungersk Gylden ([fuss:reichsdukatenfuss]), Rhinsk Gylden ([fuss:rhinsk_gylden_fod]) та Guldkrone (ця стопа) — але вже як придворний дарунок, а не воєнне фінансування. Повна вага 3,38 г; пробу в джерелі не зафіксовано, тож віднесення спирається лише на повну вагу, яка на 1,2 % відхиляється від значення 1563-1564 рр. 3,341 г (обчислено з 3,38 / 3,341)<sup>[ref:danskmoent-f2h7f-gavesaet-guldkrone]</sup>. Далі лінія Guldkrone обривається і відновлюється лише 1618 р. за Кристіана IV з іншою метрикою та власною тарифною логікою ([fuss:guldkrone]).'
  rosenobel_fod:
    - id: I
      year_from: 1584
      year_to: 1584
      from_label: '1584'
      to_label: '1584'
      title:
        de: 'Phase I · Frederik II 1584 (Frederiksborg) · Brutto 7,69 g · Probe unbekannt · unikat (Rose-Noble-Vorläufer)'
        en: 'Phase I · Frederik II 1584 (Frederiksborg) · brutto 7.69 g · fineness unknown · unique (Rose Noble predecessor)'
        uk: 'Фаза I · Frederik II 1584 (Frederiksborg) · повна вага 7,69 г · проба невідома · унікат (передвісник Rose Noble)'
        da: Fase I · Frederik 2. 1584 (Frederiksborg) · brutto 7,69 g · lødigheden ukendt · unikum (forløber for rosenobelen)
      description:
        de: 'Unikales Belegexemplar Hede f2h7b — 1 Rosenobel 1584, Münzstätte <b>Frederiksborg</b>, Brutto 7,69 g (Probe nicht überliefert). Wahrscheinlich näher am englischen Klassik-Rose-Noble-Standard 7,78 g (Edward IV. 1465). Karbung wurde von Frederik II. nicht fortgesetzt — 27-jährige Pause biß zur Wiederaufnahme unter Christian IV. 1611. Hede 7B / Schou 2 / Sieg 29<sup>[ref:danskmoent-1rosenob]</sup>.'
        en: 'Unique reference specimen Hede f2h7b — 1 Rosenobel 1584, <b>Frederiksborg</b> mint, brutto 7.69 g (fineness not transmitted). Probably closer to the classical English Rose Noble standard 7.78 g (Edward IV 1465). Frederik II did not continue the coinage — a 27-year pause until Christian IV resumed it in 1611. Hede 7B / Schou 2 / Sieg 29<sup>[ref:danskmoent-1rosenob]</sup>.'
        uk: 'Унікальний еталонний зразок Hede f2h7b — 1 Rosenobel 1584, монетний двір <b>Frederiksborg</b>, повна вага 7,69 г (пробу не зафіксовано в джерелі). Імовірно ближче до класичного англійського стандарту Rose Noble 7,78 г (Edward IV 1465). Frederik II не продовжив карбування — 27-річна пауза до відновлення за Christian IV 1611 р. Hede 7B / Schou 2 / Sieg 29<sup>[ref:danskmoent-1rosenob]</sup>.'
    - id: II
      year_from: 1611
      year_to: 1629
      from_label: '1611'
      to_label: '1629'
      title:
        de: 'Phase II · Christian IV 1611-1629 (Kopenhagen) · 8,994 g rauh / 7,492 g fein @ .833 · Kalmar-Krieg + Imperial-Dänischer Krieg'
        en: 'Phase II · Christian IV 1611-1629 (Copenhagen) · 8.994 g rough / 7.492 g fine at .833 · Kalmar War + Imperial-Danish War'
        uk: 'Фаза II · Christian IV 1611-1629 (Копенгаген) · 8,994 г повної / 7,492 г чистого за .833 · Кальмарська війна + Імперсько-данська війна'
        da: Fase II · Christian 4. 1611-1629 (København) · 8,994 g rå / 7,492 g fin ved .833 · Kalmarkrigen og Kejserkrigen
      description:
        de: 'Hauptkarbungsphase: Christian IV. revives das Rosenobel-Programm 1611 in <b>Kopenhagen</b> mit neuem standardisiertem Format. Hede c4h23a — 1 Rosenobel 1611, 1612, 1613, 1627, 1629 · 8,994 g rauh × .833 = 7,492 g fein. Sub-Stückelung Hede c4h24 — ½ Rosenobel 1611, period-Spitzname <i>«Guldridder»</i> («Goldritter»). 1611-1613 fällt exakt mit dem <a href="https://www.historyofwar.org/articles/wars_kalmar.html" target="_blank">Kalmar-Krieg</a> (Christian IVs Versuch, Schweden zur Kalmar-Union zurück zu zwingen — Schweden zahlt 1 Mio. Riksdaler Älvsborg-Lösegeld)<sup>[ref:historyofwar-wars-kalmar]</sup>; 1627 + 1629 fällt in den Imperial-Dänischen Krieg (1625-1629, Christian IVs Beteiligung am Dreißigjährigen Krieg). Funktion: Söldnerbezahlung + diplomatische Repräsentation, kein Tagesumlauf. Tarif rechnerisch ≈ 3-4 Speciedaler per Feingewicht-Konversion (kein period-attestierter formaler Tarif gefunden).'
        en: 'Main coinage phase: Christian IV revives the Rosenobel programme in 1611 in <b>Copenhagen</b> at a new standardised format. Hede c4h23a — 1 Rosenobel 1611, 1612, 1613, 1627, 1629 · 8.994 g rough × .833 = 7.492 g fine. Sub-denomination Hede c4h24 — ½ Rosenobel 1611, period nickname <i>«Guldridder»</i> («gold knight»). 1611-1613 coincides exactly with the <a href="https://www.historyofwar.org/articles/wars_kalmar.html" target="_blank">Kalmar War</a> (Christian IV''s attempt to force Sweden back into the Kalmar Union — Sweden pays a 1 million riksdaler Älvsborg ransom)<sup>[ref:historyofwar-wars-kalmar]</sup>; 1627 + 1629 falls within the Imperial-Danish War (1625-1629, Christian IV''s involvement in the Thirty Years'' War). Function: mercenary pay + diplomatic representation, not daily circulation. Tariff computed ≈ 3-4 Speciedaler via fine-weight conversion (no period-attested formal tariff found).'
        uk: 'Головна фаза карбування: Christian IV відновлює програму Rosenobel 1611 р. у <b>Копенгагені</b> з новим стандартизованим форматом. Hede c4h23a — 1 Rosenobel 1611, 1612, 1613, 1627, 1629 · 8,994 г повної × .833 = 7,492 г чистого. Субномінал Hede c4h24 — ½ Rosenobel 1611, period-прізвисько <i>«Guldridder»</i> («золотий лицар»). 1611-1613 точно збігається з <a href="https://www.historyofwar.org/articles/wars_kalmar.html" target="_blank">Кальмарською війною</a> (спроба Christian IV примусити Швецію повернутися до Кальмарської унії — Швеція виплачує 1 млн riksdaler Älvsborg-викупу)<sup>[ref:historyofwar-wars-kalmar]</sup>; 1627 + 1629 припадає на Імперсько-данську війну (1625-1629, участь Christian IV у Тридцятилітній війні). Функція: оплата найманців + дипломатична репрезентація, не щоденний обіг. Тариф розрахунково ≈ 3-4 Speciedaler через конверсію чистої ваги (period-attested формального тарифу не знайдено).'
  115_5_daler_fod:
    - id: I
      year_from: 1604
      year_to: 1605
      from_label: '1604'
      to_label: '1605'
      title:
        de: Gold-Daler-Klippen nach der Møntanordning af 8. September 1602
        en: Gold daler klippen to the ordinance of 8 September 1602
        uk: Золоті далерні кліпе за ордонансом 8 вересня 1602
        da: Gulddalerklippinge efter Møntanordning af 8. september 1602
      description:
        de: 'Vierkantige Goldklippen Christians IV., 1604 in Kopenhagen geschlagen und 1605 fortgesetzt. Die Møntanordning af 8. September 1602 setzt die Karbungsformeln für die 8-, 6- und 4-Daler-Stücke — je Stückelung eigenes Korn und eigene Stückzahl je Marck; die 3-Daler steht nicht in der Ordnung und wurde nach den Müntzrechnungen als halbe 6-Daler-Klippe geschlagen<sup>[ref:wilcke1-moentordning-1602-guld]</sup>. Der aufgeprägte «Daler» ist <b>gesetzlich gesetzter Nennwert in der Silberrechnungseinheit</b>, keine Willkür: er folgt dem Verhältnis von Gold zu Silber, das Wilcke für die 4-Daler-Klippe mit 12,80 zu 1 ausrechnet, und wurde nachgesetzt, als sich dieses Verhältnis verschob<sup>[ref:wilcke1-moentordning-1604-nedsaettelse]</sup>. Umlaufgeld waren die Stücke nicht — Wilcke zählt das Gold dieser Ordnung zur «<i>Skuemønt til festlig Lejlighed</i>»<sup>[ref:wilcke1-guldmoent-skuemoent]</sup>.'
        en: 'Square gold klippen of Christian IV, struck at Copenhagen in 1604 and continued in 1605. The ordinance of 8 September 1602 sets the minting formulas for the 8, 6 and 4 daler pieces — each denomination with its own carat and its own count per mark; the 3 daler is not in the ordinance and was struck, per the mint accounts, as half a 6-daler klippe<sup>[ref:wilcke1-moentordning-1602-guld]</sup>. The «daler» struck on them is a <b>statutory face value in the silver unit of account</b>, not an arbitrary one: it follows the gold-to-silver ratio Wilcke computes for the 4-daler klippe at 12.80 to 1, and it was reset when that ratio moved<sup>[ref:wilcke1-moentordning-1604-nedsaettelse]</sup>. Circulation money they were not — Wilcke counts the gold of this ordinance among «<i>Skuemønt til festlig Lejlighed</i>»<sup>[ref:wilcke1-guldmoent-skuemoent]</sup>.'
        uk: 'Квадратні золоті кліпе Христіяна IV, карбовані 1604 р. у Копенгагені й продовжені 1605. Ордонанс 8 вересня 1602 задає формули карбування для 8-, 6- і 4-далерних монет — кожному номіналові власна проба й власна кількість штук із марки; 3-далера в ордонансі немає, і за монетними рахунками її карбували як половину 6-далерної кліпе<sup>[ref:wilcke1-moentordning-1602-guld]</sup>. Викарбуваний «daler» — це <b>установлений законом номінал у срібній розрахунковій одиниці</b>, а не довільність: він тримається співвідношення золота до срібла, яке Wilcke для 4-далерної кліпе рахує як 12,80 до 1, і його переставили, коли те співвідношення зрушило<sup>[ref:wilcke1-moentordning-1604-nedsaettelse]</sup>. Обіговими грішми ці монети не були — золото цього ордонансу Wilcke відносить до «<i>Skuemønt til festlig Lejlighed</i>»<sup>[ref:wilcke1-guldmoent-skuemoent]</sup>.'
  sovereign_fod:
    - id: I
      year_from: 1606
      year_to: 1608
      from_label: '1606'
      to_label: '1608'
      title:
        de: 'Phase I · Christian IV 1606-1608 (Helsingør / Kopenhagen) · Sovereign ca. 10,0 g · Probe abgeleitet .916 (22 Karat) · Versuchsgold nach englischem Unite'
        en: 'Phase I · Christian IV 1606-1608 (Helsingør / Copenhagen) · Sovereign ca. 10.0 g · fineness inferred .916 (22 carats) · trial gold after the English Unite'
        uk: 'Фаза I · Christian IV 1606-1608 (Helsingør / Копенгаген) · Sovereign бл. 10,0 г · проба виведена .916 (22 карати) · пробне золото за англ. Unite'
        da: Fase I · Christian 4. 1606-1608 (Helsingør / København) · sovereign ca. 10,0 g · lødigheden udledt til .916 (22 karat) · forsøgsguld efter den engelske unite
      description:
        de: 'Kurze Versuchsepisode nach Christians IV. Englandreise 1606: Leit-Stück <a href="https://www.danskmoent.dk/chr/c4h19.htm" target="_blank">1 Sovereign 1608</a> (Helsingør, Hede 19, ca. 10,0 g, Rarität R)<sup>[ref:danskmoent-c4h19-sovereign]</sup> nach dem Unite-Vorbild Jakobs I. (22 Karat, ca. 10,0 g)<sup>[ref:stacksbowers-bruun-sovereign-1608]</sup>; dazu drei unikale Probe-Varianten aus Kopenhagen — Hede 20 (22,64 g), Hede 21 (8,08-10,75 g), Hede 22 (4,65 g)<sup>[ref:danskmoent-c4h20-22-sovereign-proever]</sup>. Hede klassifiziert den ganzen Strang 19-22 als «<i>Prøvemønt efter engelsk forbillede</i>»; Feingehalt in keiner Quelle angegeben, aus dem englischen 22-Karat-Unite abgeleitet. Nicht in den Massenumlauf überführt.'
        en: 'A brief experimental episode after Christian IV''s 1606 England journey: lead piece <a href="https://www.danskmoent.dk/chr/c4h19.htm" target="_blank">1 Sovereign 1608</a> (Helsingør, Hede 19, ca. 10.0 g, rarity R)<sup>[ref:danskmoent-c4h19-sovereign]</sup> on James I''s Unite model (22 carats, ca. 10.0 g)<sup>[ref:stacksbowers-bruun-sovereign-1608]</sup>; alongside three unique trial variants from Copenhagen — Hede 20 (22.64 g), Hede 21 (8.08-10.75 g), Hede 22 (4.65 g)<sup>[ref:danskmoent-c4h20-22-sovereign-proever]</sup>. Hede classifies the whole 19-22 strand as «<i>Prøvemønt efter engelsk forbillede</i>»; fineness stated in no source, inferred from the English 22-carat Unite. Not carried into mass circulation.'
        uk: 'Короткий експериментальний епізод після візиту Кристіана IV в Англію 1606 р.: провідний стук <a href="https://www.danskmoent.dk/chr/c4h19.htm" target="_blank">1 Sovereign 1608</a> (Helsingør, Hede 19, бл. 10,0 г, рідкісність R)<sup>[ref:danskmoent-c4h19-sovereign]</sup> за взірцем Unite Джеймса I (22 карати, бл. 10,0 г)<sup>[ref:stacksbowers-bruun-sovereign-1608]</sup>; поряд — три унікальні пробні варіанти з Копенгагена: Hede 20 (22,64 г), Hede 21 (8,08-10,75 г), Hede 22 (4,65 г)<sup>[ref:danskmoent-c4h20-22-sovereign-proever]</sup>. Hede класифікує весь ряд 19-22 як «<i>Prøvemønt efter engelsk forbillede</i>»; проба в жодному джерелі не вказана, виведена з англійського 22-каратного Unite. Не переведене в масовий обіг.'
  kronemont_chr_iv:
    - id: I
      year_from: 1618
      year_to: 1624
      from_label: '1618'
      to_label: '1624'
      title:
        de: Christian IV. · Corona Danica · Tarif 1½ Speciedaler
        en: Christian IV · Corona Danica · tariff 1½ Speciedaler
        uk: Кристіан IV · Corona Danica · тариф 1½ Specie
        da: Christian 4. · Corona Danica · tarif 1½ speciedaler
      description:
        de: 'Erste Phase der Christian-IV.-Müntzformel: eingeführt durch das <b>åbne Brev af 12. Juli 1618</b> (Wilcke II Anm. 53<sup>[ref:danskmoent-w2ref]</sup>: «<i>I det aabne Brev af 12. Juli 1618, hvorved Kronemønten førtes frem for Offentligheden ...</i>»; Wilcke I S. 156–157<sup>[ref:danskmoent-w2ref]</sup>). Im Patent wird die Münze als «<i>1½-Specie / ¾-Specie (Krone / ½-Krone)</i>» beschrieben — der spätere Latin-Name «Corona Danica» ist Numismatik-Usus, nicht Patent-Sprache. Alle Prägungen 1618–1624 laufen unter dem ursprünglichen Tarif <b>1½ Speciedaler</b> — eine Wertigkeit, die im Volksmund die satirische Umdeutung des königlichen Wahlspruches <b>RFP</b> (regna firmat pietas) als <b>R(iget) F(attes) P(enge)</b> hervorrief.<sup>[ref:natmus-christian-4s-svindler-moent-fylder-400-aar]</sup> Die offizielle Tarifsenkung auf 1⅓ Speciedaler erfolgt erst <b>1625</b><sup>[ref:wikipedia-de-corona-danica]</sup><sup>[ref:archive-worterbuchdermun007491mbp]</sup>, unmittelbar nach Einstellung der Karbverfahrensphase. Stilistische Untergruppen: Corona-Danica-Originalprägungen 1618–1622 (KM# 57–61, 58a, 59a) und «Dicke» / Open-Crown-Varianten 1624 (KM# 94–99) — alle innerhalb desselben Tarifregimes. Wikipedia DE «Corona Danica»: «<i>Die ursprüngliche Krone und ihre Teilstücke wurden nur bis 1624, teilweise bis 1625 geprägt</i>»<sup>[ref:wikipedia-de-corona-danica]</sup>.'
        en: 'First phase of the Christian IV Müntzformel: introduced by the <b>åbne Brev af 12. Juli 1618</b> (Wilcke II note 53<sup>[ref:danskmoent-w2ref]</sup>: «<i>I det aabne Brev af 12. Juli 1618, hvorved Kronemønten førtes frem for Offentligheden ...</i>»; Wilcke I pp. 156–157<sup>[ref:danskmoent-w2ref]</sup>). In the patent the coin is described as «<i>1½-Specie / ¾-Specie (Krone / ½-Krone)</i>» — the later Latin name «Corona Danica» is a numismatic convention, not patent language. All 1618–1624 issues run under the original <b>1½ Speciedaler</b> tariff — a parity that in folk parlance prompted the satirical reread of the royal motto <b>RFP</b> (regna firmat pietas) as <b>R(iget) F(attes) P(enge)</b>.<sup>[ref:natmus-christian-4s-svindler-moent-fylder-400-aar]</sup> The official tariff cut to 1⅓ Speciedaler only comes in <b>1625</b><sup>[ref:wikipedia-de-corona-danica]</sup><sup>[ref:archive-worterbuchdermun007491mbp]</sup>, right after the Christian-IV personnel mintage phase ends. Stylistic sub-groups: Corona Danica original strikes 1618–1622 (KM# 57–61, 58a, 59a) and «Dicke» / Open-Crown variants 1624 (KM# 94–99) — all within the same tariff regime. Wikipedia DE «Corona Danica»: «<i>Die ursprüngliche Krone und ihre Teilstücke wurden nur bis 1624, teilweise bis 1625 geprägt</i>»<sup>[ref:wikipedia-de-corona-danica]</sup>.'
        uk: 'Перша фаза монетної формули Кристіана IV: запроваджено <b>åbne Brev af 12. Juli 1618</b> (Wilcke II прим. 53<sup>[ref:danskmoent-w2ref]</sup>: «<i>I det aabne Brev af 12. Juli 1618, hvorved Kronemønten førtes frem for Offentligheden ...</i>»; Wilcke I с. 156–157<sup>[ref:danskmoent-w2ref]</sup>). У патенті монета описана як «<i>1½-Specie / ¾-Specie (Krone / ½-Krone)</i>» — пізніша латинська назва «Corona Danica» — нумізматична умовність, не мова патенту. Усі емісії 1618–1624 під оригінальним тарифом <b>1½ Speciedaler</b> — паритет, який у народі породив сатиричне переосмислення королівського девізу <b>RFP</b> (regna firmat pietas) як <b>R(iget) F(attes) P(enge)</b>.<sup>[ref:natmus-christian-4s-svindler-moent-fylder-400-aar]</sup> Офіційне зниження тарифу до 1⅓ Speciedaler відбувається лише <b>1625</b><sup>[ref:wikipedia-de-corona-danica]</sup><sup>[ref:archive-worterbuchdermun007491mbp]</sup> — одразу після припинення фази персонального карбування Кристіана IV. Стилістичні підгрупи: оригінальні Corona Danica 1618–1622 (KM# 57–61, 58a, 59a) та варіанти «Dicke» / Open-Crown 1624 (KM# 94–99) — усі в одному тарифному режимі. Wikipedia DE «Corona Danica»: «<i>Die ursprüngliche Krone und ihre Teilstücke wurden nur bis 1624, teilweise bis 1625 geprägt</i>»<sup>[ref:wikipedia-de-corona-danica]</sup>.'
    - id: II
      year_from: 1651
      year_to: 1652
      from_label: '1651'
      to_label: '1652'
      title:
        de: Frederik III. · Fortsetzung der Christian-IV.-Müntzformel · Übergang zum 10½-Krone-Fuß
        en: Frederik III · Christian IV Müntzformel continuation · transition to 10½-Krone-Fuß
        uk: Фредерік III · продовження монетної формули Кристіана IV · перехід до 10½-Krone-Fuß
        da: Frederik 3. · fortsættelsen af Christian 4.s møntformel · overgang til 10½-Krone-Fuß
      description:
        de: 'Zweite Phase der Christian-IV.-Müntzformel: Frederik III. (1648–1670) nimmt die Krone-Prägung 1651 in Kopenhagen wieder auf und folgt zunächst der älteren Müntzformel mit 16,25 g Feinsilber, bevor er 1652 zum neuen 10½-Krone-Fuß (.672 / 14,964 g fein) übergeht. Wikipedia DE «Corona Danica»<sup>[ref:wikipedia-de-corona-danica]</sup>: «<i>Friedrich III. lässt ab 1651 neben anderen Münzen erneut Kronen prägen, zunächst mit einem Feingehalt von 16,25 g Silber, dann von 14,964 g</i>». Hede 1957<sup>[ref:danskmoent-hedekron]</sup> klassifiziert die gesamte Müntzformel als <b>1618–1652</b>; die feinste Typologie der Übergangsphase 1651–1652 in Aagaard 2004<sup>[ref:denmark-ref13-no-url]</sup> «Frederik III Kronemønt København 1651–1670».'
        en: 'Second phase of the Christian IV Müntzformel: Frederik III (1648–1670) resumes Krone production at Copenhagen in 1651 and at first follows the older formula with 16.25 g fine silver, before transitioning to the new 10½-Krone-Fuß (.672 / 14.964 g fine) in 1652. Wikipedia DE «Corona Danica»<sup>[ref:wikipedia-de-corona-danica]</sup>: «<i>Friedrich III. lässt ab 1651 neben anderen Münzen erneut Kronen prägen, zunächst mit einem Feingehalt von 16,25 g Silber, dann von 14,964 g</i>». Hede 1957<sup>[ref:danskmoent-hedekron]</sup> classifies the full Müntzformel as <b>1618–1652</b>; the finest typology of the 1651–1652 transition is in Aagaard 2004<sup>[ref:denmark-ref13-no-url]</sup> «Frederik III Kronemønt København 1651–1670».'
        uk: 'Друга фаза монетної формули Кристіана IV: Фредерік III (1648–1670) поновлює карбування Krone у Копенгагені 1651 р. і спочатку йде за старішою формулою з 16,25 г чистого срібла, перш ніж 1652 р. перейти на нову 10½-Krone-Fuß (.672 / 14,964 г чистого). Wikipedia DE «Corona Danica»<sup>[ref:wikipedia-de-corona-danica]</sup>: «<i>Friedrich III. lässt ab 1651 neben anderen Münzen erneut Kronen prägen, zunächst mit einem Feingehalt von 16,25 g Silber, dann von 14,964 g</i>». Hede 1957<sup>[ref:danskmoent-hedekron]</sup> класифікує повну монетну формулу як <b>1618–1652</b>; найточніша типологія перехідного періоду 1651–1652 — в Aagaard 2004<sup>[ref:denmark-ref13-no-url]</sup> «Frederik III Kronemønt København 1651–1670».'
    - id: III
      year_from: 1665
      year_to: 1675
      from_label: '1665'
      to_label: '1675'
      title:
        de: Sonderemissionen — Pumphosenkrone (1665) und 2-Krone (1675)
        en: Special issues — Pumphosenkrone (1665) and 2-Krone (1675)
        uk: Спец-випуски — Pumphosenkrone (1665) і 2-Krone (1675)
        da: Særudmøntninger — pumpebuksekrone (1665) og 2-krone (1675)
      description:
        de: Hede 1957<sup>[ref:danskmoent-hedekron]</sup> verzeichnet zwei nachträgliche Sonderemissionen, die der Christian-IV.-Müntzformel-Lötigkeit nahekommen, aber Hede explizit als spezielle Schaumünzen wertet, nicht als Formelfortsetzungen:<br>· <b>1665 «Pumphosenkrone» / «Pumpbucksen Thaler»</b> — Krone und ½ Krone Frederiks III. (Schou 39/40), bei höherer Lötigkeit für ein schöneres Karbverfahren;<br>· <b>1675 2-Krone</b> — Doppelkronenprägung Christians V. (Schou 11–15) unter Reskript vom 11. März 1675 über den Münzgewinn.<br>Beide Stücke werden in Hedes Klassifikation als «<i>specielle udgaver med finere sølv for at få en smukkere mønt</i>» behandelt — also außerhalb des regulären 10½-Krone-Fußes (Grobe Krone).
        en: Hede 1957<sup>[ref:danskmoent-hedekron]</sup> records two later special issues that approach the Christian IV Müntzformel's fineness, but which Hede explicitly classifies as specialised Schaumünzen rather than formula continuations:<br>· <b>1665 «Pumphosenkrone» / «Pumpbucksen Thaler»</b> — Frederik III's Krone and ½ Krone (Schou 39/40), at higher fineness for a more attractive strike;<br>· <b>1675 2-Krone</b> — Christian V's double-Krone strike (Schou 11–15) under the rescript of 11 March 1675 regarding the mint gain.<br>Both pieces are handled by Hede as «<i>specielle udgaver med finere sølv for at få en smukkere mønt</i>» — i.e. outside the regular 10½-Krone-Fuß (Grobe Krone).
        uk: Hede 1957<sup>[ref:danskmoent-hedekron]</sup> фіксує два пізніші спеціальні випуски, які за пробою наближаються до монетної формули Кристіана IV, але Hede явно класифікує їх як спеціальні Schaumünzen, а не продовження формули:<br>· <b>1665 «Pumphosenkrone» / «Pumpbucksen Thaler»</b> — Krone та ½ Krone Фредеріка III (Schou 39/40), за вищою пробою для красивішого карбування;<br>· <b>1675 2-Krone</b> — карбування подвійної Krone Кристіана V (Schou 11–15) за рескриптом 11 березня 1675 про монетний прибуток.<br>Обидва випуски Hede трактує як «<i>specielle udgaver med finere sølv for at få en smukkere mønt</i>» — тобто поза регулярною 10½-Krone-Fuß (Grobe Krone).
  reichsdukatenfuss:
    - id: I
      year_from: 1531
      year_to: 1601
      from_label: '1531'
      to_label: '1601'
      title:
        de: 'Ungersk Gylden und Portugaløser — Goldgulden-Benennung des .986-Goldes (Frederik I. bis Christian IV.)'
        en: 'Ungersk Gylden and Portugaløser — the gold-gulden naming of the .986 gold (Frederik I to Christian IV)'
        uk: 'Ungersk Gylden і Portugaløser — гульденна назва .986-золота (Frederik I — Christian IV)'
        da: Ungersk gylden og portugaløser — guldgyldenbetegnelsen for .986-guldet (Frederik 1. til Christian 4.)
      description:
        de: 'Frühe .986-Goldprägung Dänemark-Norwegens unter den Namen <b>Ungersk Gylden</b> und <b>Portugaløser</b>. Das früheste belegte Stück ist <b>Frederik I.</b> Ungersk Gylden von 1531 (Galster 46); der Hans-Goldgulden ~1497 gehört zum Rhinskgyldenfod (.75), nicht zu diesem Standard. Es folgen Christian III. 1557 (Hede c3h1/c3h2) und Frederik II. 1563-1564; <b>Christian IV.</b> knüpft mit den Haderslever Portugaløsern und Goldgulden (1591-1593) an. In diesem Abschnitt liegt die Probe bei .986 — metrisch identisch mit dem deutschen Reichsdukatenfuß, den die Augsburger Reichsmünzordnung 1559 kodifizierte; das Königreich Dänemark band diese imperiale Ordnung jedoch nicht. Mit der Møntanordning af 8. September 1602 endet dieser Gleichlauf: sie setzt den Ungersk Gylden auf 23⅓ Karat herab<sup>[ref:wilcke1-moentordning-1602-guld]</sup> — siehe den folgenden Abschnitt.'
        en: 'Early .986 gold coinage of Denmark-Norway under the names <b>Ungersk Gylden</b> and <b>Portugaløser</b>. The earliest documented piece is <b>Frederik I</b>''s Ungersk Gylden of 1531 (Galster 46); the Hans gold gulden ~1497 belongs to the Rhinskgyldenfod at .75, not this standard. Christian III follows in 1557 (Hede c3h1/c3h2) and Frederik II in 1563-1564; <b>Christian IV</b> takes the line up with the Haderslev Portugaløsere and Goldgulden (1591-1593). Across this stretch the fineness is .986 — metrically identical to the German Reichsdukatenfuß codified by the Augsburg Imperial Coinage Ordinance of 1559, which however did not bind the Kingdom of Denmark. The ordinance of 8 September 1602 ends that alignment by setting the Ungersk Gylden at 23⅓ carats<sup>[ref:wilcke1-moentordning-1602-guld]</sup> — see the following section.'
        uk: 'Раннє .986-золоте карбування Данії-Норвегії під назвами <b>Ungersk Gylden</b> і <b>Portugaløser</b>. Найраніша задокументована монета — Ungersk Gylden <b>Frederik I</b> 1531 р. (Galster 46); Hans-Goldgulden ~1497 належить до Rhinskgyldenfod (.75), не до цього стандарту. Далі Christian III 1557 (Hede c3h1/c3h2) і Frederik II 1563-1564; <b>Christian IV</b> підхоплює лінію Гадерслевськими Portugaløser-ами й Goldgulden (1591-1593). На цьому відтинку проба становить .986 — метрично ідентична німецькому Reichsdukatenfuß, кодифікованому Авґсбурзьким монетним ордонансом 1559 р., який, однак, не звʼязував Королівство Данію. Ордонанс 8 вересня 1602 цю тотожність припиняє: він знижує Ungersk Gylden до 23⅓ карата<sup>[ref:wilcke1-moentordning-1602-guld]</sup> — див. наступний розділ.'
    - id: II
      year_from: 1602
      year_to: 1611
      from_label: '1602'
      to_label: '1611'
      title:
        de: 'Das Goldkorn der Møntanordning af 8. September 1602 — Ungersk Gylden 23⅓, Portugaløser 23½ Karat'
        en: 'The gold standard of the ordinance of 8 September 1602 — Ungersk Gylden 23⅓, Portugaløser 23½ carats'
        uk: 'Золота проба ордонансу 8 вересня 1602 — Ungersk Gylden 23⅓, Portugaløser 23½ карата'
        da: Guldlødigheden i Møntanordning af 8. september 1602 — ungersk gylden 23⅓, portugaløser 23½ karat
      description:
        de: 'Die Møntanordning af 8. September 1602 schreibt das Gold nicht in einem Korn fest, sondern <b>je Stückelung gesondert</b>: der Portugaløser bei 23½ Karat (.979), der Ungersk Gylden bei <b>23⅓ Karat (.972)</b> — vier Grän unter dem imperialen Dukatenkorn von 23 Karat 8 Grän. Das Raugewicht bleibt bei 67 Stück je Marck unverändert, das Feingold je Stück sinkt damit von 3,442 g auf 3,393 g. Wilcke ordnet den Schritt als bewusste Verringerung ein: «<i>Med disse Forhold for Øje er det forklarligt, om man noget forringede Mønten</i>»<sup>[ref:wilcke1-moentordning-1602-guld]</sup>. Beide Stücke tragen zugleich einen gesetzlich gesetzten Nennwert in Silberdalern — 17 für den Portugaløser, 1⅝ für den Ungersk Gylden. Am 20. November 1604 werden diese Kurse nachgesetzt (16 bzw. 1 9/16), das Korn bleibt<sup>[ref:wilcke1-moentordning-1604-nedsaettelse]</sup>. Die Ordnung vom 3. Februar 1609 rührt das Gold nicht an; der Abschnitt läuft bis zum letzten datierten Ungersk Gylden aus.'
        en: 'The ordinance of 8 September 1602 does not fix the gold at one fineness but sets it <b>separately per denomination</b>: the Portugaløser at 23½ carats (.979), the Ungersk Gylden at <b>23⅓ carats (.972)</b> — four grains below the imperial ducat fineness of 23 carats 8 grains. The rough weight stays unchanged at 67 pieces per mark, so the fine gold per piece falls from 3.442 g to 3.393 g. Wilcke reads the step as a deliberate reduction: «<i>Med disse Forhold for Øje er det forklarligt, om man noget forringede Mønten</i>»<sup>[ref:wilcke1-moentordning-1602-guld]</sup>. Both pieces also carry a statutory face value in silver daler — 17 for the Portugaløser, 1⅝ for the Ungersk Gylden. On 20 November 1604 those rates were reset (to 16 and 1 9/16), the fineness left alone<sup>[ref:wilcke1-moentordning-1604-nedsaettelse]</sup>. The ordinance of 3 February 1609 leaves the gold untouched; the section runs out with the last dated Ungersk Gylden.'
        uk: 'Ордонанс 8 вересня 1602 не закріплює золото однією пробою, а задає її <b>окремо за номіналом</b>: Portugaløser — 23½ карата (.979), Ungersk Gylden — <b>23⅓ карата (.972)</b>, на чотири грани нижче за імперську дукатну пробу в 23 карати 8 гран. Повна вага лишається незмінною — 67 штук із марки, тож чисте золото на штуку падає з 3,442 г до 3,393 г. Wilcke трактує цей крок як свідоме зниження: «<i>Med disse Forhold for Øje er det forklarligt, om man noget forringede Mønten</i>»<sup>[ref:wilcke1-moentordning-1602-guld]</sup>. Обидві монети водночас несуть установлений законом номінал у срібних далерах — 17 для Portugaløser і 1⅝ для Ungersk Gylden. 20 листопада 1604 ці курси переставляють (на 16 і 1 9/16), пробу лишають<sup>[ref:wilcke1-moentordning-1604-nedsaettelse]</sup>. Ордонанс 3 лютого 1609 золота не чіпає; відтинок добігає останнім датованим Ungersk Gylden.'
    - id: III
      year_from: 1623
      year_to: 1726
      from_label: '1623'
      to_label: '1726'
      title:
        de: 'Späte Portugaløser und Dukaten bei 23½ Karat — Kopenhagen, Christiania, Glückstadt (Christian IV. biß Frederik IV.)'
        en: 'Late Portugaløsere and ducats at 23½ carats — Copenhagen, Christiania, Glückstadt (Christian IV to Frederik IV)'
        uk: 'Пізні Portugaløser і дукати за 23½ карата — Копенгаген, Крістіанія, Glückstadt (Christian IV — Frederik IV)'
        da: Sene portugaløsere og dukater ved 23½ karat — København, Christiania, Glückstadt (Christian 4. til Frederik 4.)
      description:
        de: 'Das spätere Gold des Standards. Die Phase öffnet mit Christian IVs letzten Portugaløser-Prachtstücken (1 Portugaløser 1623, ¼ Portugaløser 1629) und der einsetzenden Dukaten-Prägung — dem 1627 in Wolfenbüttel geschlagenen Dukaten der dänischen Besatzungsprägung des Dreißigjährigen Krieges. Die Benennung wandert: Ungersk Gylden heißt die Müntze biß zu den letzten datierten Stücken von 1611, von den 1640er Jahren an führt Hede sie als Dukat. Das Korn steht in diesem ganzen Abschnitt auf <b>23½ Karat (.979)</b> — dem Korn, das die Forordning af 8. september 1602 dem Portugaløser gab<sup>[ref:danskmoent-hede-c4h30-portugaloeser-1629]</sup> — und zwar in Kopenhagen wie in Christiania, Glückstadt und Rendsborg gleichermaßen<sup>[ref:danskmoent-hede-c4h37-brilledukat-1647]</sup><sup>[ref:danskmoent-hede-gluckstadt-dukat-finhed]</sup>. Für die Glückstädter Stücke führt Krause daneben das imperiale Korn von 23 Karat 8 Grän<sup>[ref:numismaster-gluckstadt-km70-1-dukat]</sup>; die Divergenz ist bei den Grundwerten vermerkt. 1726 geht die Linie in den Courantverbund über (Phase IV).'
        en: 'The later gold of the standard. The phase opens with Christian IV''s final Portugaløser prestige pieces (1 Portugaløser 1623, ¼ Portugaløser 1629) and the emerging ducat coinage — the 1627 Wolfenbüttel ducat of the Danish occupation coinage of the Thirty Years'' War. The naming shifts: the coin is called Ungersk Gylden down to the last dated pieces of 1611, and from the 1640s Hede lists it as Dukat. Across this whole stretch the fineness stands at <b>23½ carats (.979)</b> — the fineness the ordinance of 1602 gave the Portugaløser<sup>[ref:danskmoent-hede-c4h30-portugaloeser-1629]</sup> — in Copenhagen as much as in Christiania, Glückstadt and Rendsborg<sup>[ref:danskmoent-hede-c4h37-brilledukat-1647]</sup><sup>[ref:danskmoent-hede-gluckstadt-dukat-finhed]</sup>. For the Glückstadt pieces Krause carries the imperial 23 carats 8 grains instead<sup>[ref:numismaster-gluckstadt-km70-1-dukat]</sup>; the divergence is recorded under the base values. In 1726 the line passes into the Courant union (Phase IV).'
        uk: 'Пізніше золото стандарту. Фаза відкривається останніми престижними Portugaløser Christian IV (1 Portugaløser 1623, ¼ Portugaløser 1629) і початком дукатного карбування — дукатом 1627 р., карбованим у Wolfenbüttel у складі данської окупаційної емісії Тридцятилітньої війни. Назва зсувається: Ungersk Gylden монета зветься до останніх датованих штук 1611 р., а від 1640-х Hede веде її як Dukat. Проба на всьому цьому відтинку стоїть на <b>23½ карата (.979)</b> — тій, яку ордонанс 1602 р. дав Portugaløser-ові<sup>[ref:danskmoent-hede-c4h30-portugaloeser-1629]</sup> — і в Копенгагені, і в Крістіанії, Glückstadt та Рендсборзі однаково<sup>[ref:danskmoent-hede-c4h37-brilledukat-1647]</sup><sup>[ref:danskmoent-hede-gluckstadt-dukat-finhed]</sup>. Для глюкштадтських штук Krause натомість подає імперську пробу 23 карати 8 гран<sup>[ref:numismaster-gluckstadt-km70-1-dukat]</sup>; розходження зазначено при базових значеннях. 1726 р. лінія переходить у курантний союз (Фаза IV).'
      mt_caption:
        de: 'Portugaløser und Dukaten des Dukatfod · Kopenhagen und Christiania, dazu Glückstadt und Rendsborg (Christian IV. biß Frederik IV.) · sortiert nach Jahr'
        en: 'Portugaløsere and ducats of the Dukatfod · Copenhagen and Christiania, with Glückstadt and Rendsborg (Christian IV to Frederik IV) · sorted by year'
        uk: 'Portugaløser і дукати Dukatfod · Копенгаген і Крістіанія, а також Glückstadt і Рендсборг (Christian IV — Frederik IV) · впорядковано за роком'
        da: Portugaløsere og dukater under Dukatfod · København og Christiania, dertil Glückstadt og Rendsborg (Christian 4. til Frederik 4.) · ordnet efter år
    - id: IV
      year_from: 1726
      year_to: 1802
      from_label: '1726'
      to_label: '1802'
      title:
        de: Courantdukat-Fuß durch Courantverbund
        en: Courantdukat standard via the Courant union
        uk: Стопа Courantdukat через Courant-союз
        da: Courantdukat-Fuß gennem courantforbundet
      context:
        de: Mit dem Kurantmøntfod von 1726 entwickelt sich parallel zum Dukatfod der <b>Courantdukat</b> — Dukat mit leichter Feingewichtsreduktion zur festen Kurs-Anbindung (2 Rigsdaler Courant = 1 Courantdukat, später 2½ Rigsdaler Courant). Altona-Münze wird erst 1771 eröffnet; Dukaten in dieser Phase werden in Kopenhagen bzw. Glückstadt für den gesamtstaatlichen Handel geprägt.
        en: With the Kurantmøntfod of 1726 a <b>Courantdukat</b> grows up alongside the Dukatfod — a ducat with slightly reduced fine weight, designed for a fixed exchange link (2 Rigsdaler Courant = 1 Courantdukat, later 2½ Rigsdaler Courant). The Altona mint is only opened in 1771; the ducats of this phase are struck in Copenhagen and Glückstadt for the trade of the composite state.
        uk: З Kurantmøntfod 1726 паралельно до Dukatfod виростає <b>Courantdukat</b> — дукат із трохи зниженою чистою вагою, призначений для фіксованої курсової привʼязки (2 Rigsdaler Courant = 1 Courantdukat, пізніше 2½ Rigsdaler Courant). Монетний двір в Альтоні відкриють лише 1771; дукати цієї фази карбують у Копенгагені й Glückstadt для торгівлі цілісної держави.
        da: Med Kurantmøntfod af 1726 udvikler <b>kurantdukaten</b> sig parallelt med Dukatfod — en dukat med en let nedsat finvægt, der gav en fast kursbinding (2 rigsdaler courant = 1 kurantdukat, senere 2½ rigsdaler courant). Møntstedet i Altona åbner først i 1771; dukaterne i denne fase præges i København og Glückstadt til helstatens handel.
  courantdukatenfuss:
    - id: I
      year_from: 1714
      year_to: 1796
      from_label: '1714'
      to_label: '1796'
      title:
        de: Kurantdukat · Kopenhagen + Altona · 12-Mark-Tarif
        en: Kurantdukat · Copenhagen + Altona · 12-Mark tariff
        uk: Kurantdukat · Копенгаген + Альтона · тариф 12 Mark
        da: Kurantdukat · København og Altona · 12-marks tarif
      description:
        de: 'Tarif-tragende Goldlinie der dänischen Krone in zwei Phasen: <b>Frederik IV. 1714–1717</b> (Großer Nordischer Krieg, 81½ Stück / Mark, 2,511 g fein, 12 Mark Tarif; 1727 auf 11 Mark gesenkt; 1757 zur Einschmelzung eingezogen) und <b>Frederik V. ab 1757</b> (Reform: 75 Stück / Mark, 2,72832 g fein, .875 Probe, 12 Mark Tarif zurück) mit Massenprägung 1757–1765 (≈ 3 030 742 Stück) und Christian-VII.-Hauptphase 1781–1796 (≈ 237 000 Stück Altona + Kopenhagen) auf Grundlage des Plakat 2. Dezember 1782<sup>[ref:danskmoent-c7mord-plakat-1782]</sup>. KM-Belege in unseren Daten: KM-586 (1757), KM-587.1–587.7 (1758–1764). Letzte Prägung 1796 mit 1785-Datum.<sup>[ref:ernst-axel-kurantdukat]</sup>'
        en: 'Tariff-bearing gold line of the Danish crown in two phases: <b>Frederik IV 1714–1717</b> (Great Northern War, 81½ pieces per Mark, 2.511 g fine, 12-Mark tariff; reduced to 11 Mark in 1727; called in for melting in 1757) and <b>Frederik V from 1757</b> (reform: 75 pieces per Mark, 2.72832 g fine, .875 fineness, 12-Mark tariff restored) with mass coinage 1757–1765 (≈ 3,030,742 pieces) and the Christian VII main phase 1781–1796 (≈ 237,000 pieces Altona + Copenhagen) under the Plakat of 2 December 1782<sup>[ref:danskmoent-c7mord-plakat-1782]</sup>. KM records in our data: KM-586 (1757), KM-587.1–587.7 (1758–1764). Last issue 1796 with 1785 dies.<sup>[ref:ernst-axel-kurantdukat]</sup>'
        uk: 'Тариф-несуча золота лінія данської корони у двох фазах: <b>Frederik IV 1714–1717</b> (Велика Північна війна, 81½ штук з марки, 2,511 г чистого, тариф 12 Mark; 1727 знижено до 11 Mark; 1757 скликано на переплав) і <b>Frederik V з 1757</b> (реформа: 75 штук з марки, 2,72832 г чистого, проба .875, тариф 12 Mark відновлено) з масовим карбуванням 1757–1765 (≈ 3 030 742 шт.) і головною фазою Christian VII 1781–1796 (≈ 237 000 шт. Альтона + Копенгаген) на основі Plakat 2 грудня 1782<sup>[ref:danskmoent-c7mord-plakat-1782]</sup>. KM-записи в наших даних: KM-586 (1757), KM-587.1–587.7 (1758–1764). Останнє карбування 1796 зі штемпелями 1785.<sup>[ref:ernst-axel-kurantdukat]</sup>'
  pistolenfuss:
    - id: I
      year_from: 1771
      year_to: 1870
      from_label: '1771'
      to_label: '1870'
      title:
        de: Christian d'or / Frederik d'or · Altona + Kopenhagen · 5-Speciedaler-Tarif
        en: Christian d'or / Frederik d'or · Altona + Copenhagen · 5-Speciedaler tariff
        uk: Christian d'or / Frederik d'or · Альтона + Копенгаген · тариф 5 Speciedaler
        da: Christian d'or / Frederik d'or · Altona og København · 5-speciedalers tarif
      description:
        de: 'Pistolen-Goldlinie der dänischen Monarchie: Christian d''or 1771 unter Christian VII. (Altona, Vorbild Louis d''or<sup>[ref:danskmoent-w6b1]</sup>); fortgeführt unter Frederik VI. (Frederik d''or, 2 Frederik d''or 1826–1838 trotz Statsbankerot 1813), Christian VIII. (2 Christian d''or 1841–1843), Frederik VII. (Frederik d''or, 2 Frederik d''or 1850–1859), Christian IX. (Frederik d''or 1869, 2 Christian d''or 1866 / 1869) — letzte Prägung 1870. Standard 130/144 Probe (≈ 903 ‰), 6,03 g Feingold, 5-Speciedaler-Tarif. Demonetisierung mit der Krone-Reform 1873 (Skandinavische Münzunion).'
        en: 'Pistole gold line of the Danish monarchy: Christian d''or in 1771 under Christian VII (Altona, modelled on the Louis d''or<sup>[ref:danskmoent-w6b1]</sup>); continued under Frederik VI (Frederik d''or, 2 Frederik d''or 1826–1838 despite the Statsbankerot of 1813), Christian VIII (2 Christian d''or 1841–1843), Frederik VII (Frederik d''or, 2 Frederik d''or 1850–1859), Christian IX (Frederik d''or 1869, 2 Christian d''or 1866 / 1869) — last issue 1870. Standard 130/144 fineness (≈ 903 ‰), 6.03 g fine gold, 5-Speciedaler tariff. Demonetised by the Krone reform of 1873 (Scandinavian Monetary Union).'
        uk: 'Pistolen-золота лінія данської монархії: Christian d''or 1771 за Christian VII (Альтона, зразок Louis d''or<sup>[ref:danskmoent-w6b1]</sup>); продовжено за Frederik VI (Frederik d''or, 2 Frederik d''or 1826–1838 попри Statsbankerot 1813), Christian VIII (2 Christian d''or 1841–1843), Frederik VII (Frederik d''or, 2 Frederik d''or 1850–1859), Christian IX (Frederik d''or 1869, 2 Christian d''or 1866 / 1869) — остання емісія 1870. Стандарт 130/144 проба (≈ 903 ‰), 6,03 г чистого золота, тариф 5 Speciedaler. Демонетизована Krone-реформою 1873 (Скандинавська монетна унія).'
  9_thaler:
    - id: I
      year_from: 1566
      year_to: 1625
      from_label: 30. Mai 1566
      to_label: '1625'
      title:
        de: Reichsmünzordnung in Holstein-Gottorp
        en: Imperial Mint Decree in Holstein-Gottorp
        uk: Імперський монетний ордонанс у Гольштейн-Ґотторпі
        da: Reichsmünzordnung i Holsten-Gottorp
      description:
        de: Holsteinische Reichsthaler-Prägungen unter Adolf I., Johann Adolf, frühem Friedrich III. und Hans Jr. von Sonderburg — Kipper-Wipper-Krise (1620–1623), ab 1622 parallel vom leichteren 9¼-Fuß abgelöst, letzte Holstein-Prägung 1625.
        en: Holstein Reichsthaler issues under Adolf I, Johann Adolf, early Friedrich III and Hans Jr. of Sonderburg — Kipper-Wipper crisis (1620–1623), superseded in parallel by the lighter 9¼-Fuß from 1622, last Holstein strike 1625.
        uk: Гольштинські карбування Reichsthaler за Адольфа I, Йоганна Адольфа, раннього Фредеріка III та Hans Jr. Sonderburg — Kipper-Wipper-криза (1620–1623); з 1622 паралельно витісняється легшим 9¼-Fuß; останнє карбування в Гольштейні — 1625.
    - id: II
      year_from: 1624
      year_to: 1683
      from_label: '1624'
      to_label: '1683'
      title:
        de: 9-Fuß-Speciedaler-Familie · Christian IV. + Frederik III. + späte Glückstadt
        en: 9-Fuß Speciedaler family · Christian IV + Frederik III + late Glückstadt
        uk: Родина 9-Fuß Speciedaler · Кристіан IV + Фредерік III + пізня Glückstadt
        da: Speciedalerfamilien under 9-Fuß · Christian 4., Frederik 3. og det sene Glückstadt
      description:
        de: 'Nach dem Holstein-weiten Umstieg auf den 9¼-Fuß 1622–1625 prägt Dänemark-Norwegen weiterhin systematisch Großstücke nach dem alten 9-Fuß. Hede 1971 dokumentiert eine durchlaufende Familie mit der Spezifikation <i>Marken fin udbragt til 9 speciedalere</i> (≈9.071) bzw. <i>Marken fin udbragt til 9 daler</i> (≈9.0): Christian IV.s Kopenhagener 2-Speciedaler Hede 56 (1624–1628) und ½-Speciedaler Hede 59 (1624–1634, 1646), die späte Prestige-Großprägung Christian IV.s aus Kopenhagen 1647 (km-x035, 2 Speciedaler bei Reichsmüntzfuß-Standardprobe .888; Δ −0,11 % gegen den 9-Fuß-Soll vs. +2,67 % gegen den 9¼-Fuß-Soll bestätigt die Zuordnung empirisch), frühe Frederik-III.-Kopenhagen-Speciedalere und -Theilstücke (Hede f3h47–f3h51, 1648–1651) sowie Glückstadt-Speciedalere unter Frederik III. (f3h148, 1664–1666) und Christian V. (c5h120, 1683). Glückstadt blieb damit über sechs Dezennien am alten Reichs-Speciesstandard, während das übrige dänisch-norwegische Münzwesen seit 1622 im 9¼-Fuß lief; die Kopenhagener Großprägungen Christian IV.s zeigen, daß der königlich-dänische Hauptmünzhof bei Großstücken systematisch an die ältere Norm zurückgreifen konnte.'
        en: 'After the Holstein-wide shift to the 9¼-Fuß in 1622-1625, Denmark-Norway continues to strike large coins systematically on the old 9-Fuß. Hede 1971 documents a continuous family with the specification <i>Marken fin udbragt til 9 speciedalere</i> (≈9.071) or <i>Marken fin udbragt til 9 daler</i> (≈9.0): Christian IV''s Copenhagen 2 Speciedaler Hede 56 (1624–1628) and ½ Speciedaler Hede 59 (1624–1634, 1646); the late Christian-IV prestige issue from Copenhagen 1647 (km-x035, 2 Speciedaler at Reichsmüntzfuß standard fineness .888; Δ −0.11 % from the 9-Fuß Soll vs. +2.67 % from the 9¼-Fuß Soll empirically confirms the placement); early Frederik III Copenhagen Speciedaler and divisional pieces (Hede f3h47–f3h51, 1648–1651); Glückstadt Speciedaler under Frederik III (f3h148, 1664–1666) and Christian V (c5h120, 1683). Glückstadt thus held to the old imperial Specie standard for six decades after the rest of Danish-Norwegian coinage moved to the 9¼-Fuß in 1622.'
        uk: 'Після гольштинського переходу на 9¼-Fuß 1622–1625 рр. Данія-Норвегія продовжує систематично карбувати великі номінали за старим 9-Fuß. Hede 1971 фіксує безперервну родину зі специфікацією <i>Marken fin udbragt til 9 speciedalere</i> (≈9,071) чи <i>Marken fin udbragt til 9 daler</i> (≈9,0): копенгагенські 2 Speciedaler Кристіана IV. Hede 56 (1624–1628) та ½ Speciedaler Hede 59 (1624–1634, 1646); пізня престижна емісія Кристіана IV. з Копенгагена 1647 р. (km-x035, 2 Speciedaler за Reichsmüntzfuß-стандартом .888; Δ −0,11 % від 9-Fuß-Soll проти +2,67 % від 9¼-Fuß-Soll емпірично підтверджує атрибуцію); ранні Speciedaler Фредеріка III. з Копенгагена та їх поділки (Hede f3h47–f3h51, 1648–1651); ґлюкштадські Speciedaler за Фредеріка III. (f3h148, 1664–1666) і Кристіана V. (c5h120, 1683). Glückstadt таким чином тримався старого імперського Speciedaler-стандарту понад шість десятиліть після того, як решта дансько-норвезького монетарства 1622 р. перейшла на 9¼-Fuß.'
      context:
        de: '<b>Reichsstandard biß 1625:</b> Reichsthaler 9-Fuß (.889/14²⁄₉ Loth, 25,984 g fein), Mark-lübisch-Theilstücke (½, ¼, ⅛ Thaler), Schillinge (1/32, 1/48 Thaler), Pfennig-Scheidemünzen (1/96, 1/128 Thaler).<br>

          <b>Münzstätten:</b> in Holstein-Gottorp vor allem Schleswig und Husum. Nach dem Kipper-Wipper-Zusammenbruch (~1620) verlieren die Reichsstände das einheitliche Münzwesen — ab 1622 setzt sich in Holstein der leichtere 9¼-Fuß (Thaler Species, 25,28173 g fein gegen 25,984 g im 9-Fuß) durch, die letzte holsteinische 9-Fuß-Prägung erfolgt 1625 (Hans Jr. Sonderburg, 2 Schilling Lübisch).<br>

          <b>Außerhalb Holsteins lebt der 9-Fuß weiter:</b> Hamburg behält ihn als <i>Bank-Mark</i> der Hamburger Bank, Lübeck als <i>Speciemark</i> — beide biß 1875.

          '
        en: <b>Imperial standard until 1625:</b> Reichsthaler at 9-Fuß (.889/14²⁄₉ Loth, 25.984 g fine), Mark-lübisch sub-units (½, ¼, ⅛ Thaler), Schilling pieces (1/32, 1/48 Thaler), Pfennig petty coins (1/96, 1/128 Thaler).<br> <b>Mints:</b> in Holstein-Gottorp mainly Schleswig and Husum. After the Kipper-Wipper collapse (~1620) the imperial estates lose unified coinage; from 1622 the lighter 9¼-Fuß (Thaler Species, 25.28173 g fine vs. 25.984 g in the 9-Fuß) takes over in Holstein, with the last 9-Fuß strike falling in 1625 (Hans Jr. of Sonderburg, 2 Schilling Lübisch).<br> <b>Beyond Holstein the 9-Fuß lived on:</b> Hamburg kept it as the <i>Bank-Mark</i> of the Hamburger Bank, Lübeck as the <i>Speciemark</i> — both until 1875.
        uk: <b>Імперський стандарт до 1625:</b> Reichsthaler у 9-Fuß (.889/14²⁄₉ Loth, 25,984 г чистого), частки Mark lübisch (½, ¼, ⅛ Thaler), Schilling-монети (1/32, 1/48 Thaler), Pfennig-розмінні монети (1/96, 1/128 Thaler).<br> <b>Монетні двори:</b> в Гольштейн-Ґотторпі переважно Шлезвіг і Гузум. Після колапсу Kipper-Wipper (~1620) імперські стани втрачають єдину монетну систему; з 1622 у Гольштейні утверджується легший 9¼-Fuß (Thaler Species, 25,28173 г чистого проти 25,984 г у 9-Fuß), а останнє 9-Fuß-карбування припадає на 1625 р. (Hans Jr. Sonderburg, 2 Schilling Lübisch).<br> <b>Поза Гольштейном 9-Fuß продовжує існувати:</b> Гамбург тримає його як <i>Bank-Mark</i> Гамбурзького банку, Любек — як <i>Speciemark</i>; обидва до 1875 р.
        da: '<b>Rigsstandarden til 1625:</b> Reichsthaler i 9-Fuß (.889/14²⁄₉ lod, 25,984 g fin), delstykker i lybsk mark (½, ¼, ⅛ thaler), skillinger (1/32, 1/48 thaler) og penningeskillemønt (1/96, 1/128 thaler).<br>

  <b>Møntsteder:</b> i Holsten-Gottorp først og fremmest Slesvig og Husum. Efter kipper- og wippertidens sammenbrud (~1620) mister rigsstænderne det ensartede møntvæsen — fra 1622 slår den lettere 9¼-Fuß igennem i Holsten (Thaler Species, 25,28173 g fin mod 25,984 g i 9-Fuß), og den sidste holstenske prægning i 9-Fuß sker i 1625 (Hans den Yngre af Sønderborg, 2 skilling lybsk).<br>

  <b>Uden for Holsten lever 9-Fuß videre:</b> Hamborg beholder den som Hamburger Banks <i>Bank-Mark</i>, Lübeck som <i>Speciemark</i> — begge til 1875.

  '
  9_25_thaler:
    - id: I
      year_from: 1622
      year_to: 1726
      from_label: '1622'
      to_label: 15. Juli 1726
      title:
        de: Etablierung unter dänischer und gottorpischer Herrschaft
        en: Establishment under Danish and Gottorp rule
        uk: Становлення під данським і ґотторпським правлінням
        da: Etablering under dansk og gottorpsk styre
      description:
        de: 'Holstein zweigetheilt: Königsl. dänischer Antheil (Glückstadt, Pinneberg, Rantzau) und Gottorpischer Antheil (Tönning, Schleswig, Kiel) · keine einheitliche Münzstruktur · Aufgeld zwischen Species und Umlaufmünzen üblich.'
        en: 'Holstein divided in two: the royal Danish part (Glückstadt, Pinneberg, Rantzau) and the Gottorp part (Tönning, Schleswig, Kiel) · no unified coinage structure · a premium between Species and circulating coins is the norm.'
        uk: 'Гольштейн розділений на дві частини: королівська данська частина (Glückstadt, Pinneberg, Rantzau) і ґотторпська частина (Tönning, Schleswig, Kiel) · єдиної монетної структури немає · надбавка (Aufgeld) між Species і обіговими монетами — звична практика.'
      context:
        de: '<b>Dominierende Großsilbermünze:</b> Thaler Species im 9¼-Fuß, nach dänischer Tradition etabliert; daneben lübisch geprägte Schilling-Scheidemünzen. <b>Zeitgenössische Nomenklatur:</b> auf den Münzen «SPECIES» oder Mark-Danske-Denomination; in Auktionskatalogen auch «Speciedaler».<br>

          <b>Hauptumlauf in Holstein:</b> Neben heimischen Prägungen zirkulieren lübische, hamburgische und norddeutsche Thaler Species; niederländische Patagonen/Albertusthaler; schwedische 4-Mark-Stücke; spanische Piaster — der Handel akzeptiert jede Species nach Silbergehalt.<br>

          <b>Parallel zur Thaler-Species-Prägung: die Kronemønt-Kategorie (1618 → 1696).</b> Siehe eigene Sektion <i>10½-Krone-Fuß · Kronemønt-Tarifmünze</i> unten, wo die Tarifhistorie 1½ → 1⅓ → ⅔ Speciedaler und die Prägetabelle 1644–1696 detailliert dokumentiert sind.

          '
        en: <b>Dominant large silver coin:</b> the Thaler Species in the 9¼-Fuß, established by Danish tradition; alongside it, Schilling petty coinage in Lübeck reckoning. <b>Contemporary nomenclature:</b> on the coins themselves «SPECIES» or a Mark-Danske denomination; auction catalogues often use «Speciedaler».<br> <b>Main circulation in Holstein:</b> besides domestic issues, Lübeck, Hamburg and North-German Thaler Species circulate; Dutch Patagonen/Albertusthaler; Swedish 4-Mark pieces; Spanish piastres — trade accepts every Species by silver content.<br> <b>In parallel with the Thaler Species issues — the Kronemønt category (1618 → 1696).</b> See the dedicated section <i>10½-Krone-Fuß · Kronemønt tariff coin</i> below, which documents the tariff history 1½ → 1⅓ → ⅔ Speciedaler and the strike table 1644–1696 in detail.
        uk: <b>Домінантна велика срібна монета:</b> Thaler Species у 9¼-Fuß, закріплений данською традицією; поруч — Schilling-розмінна монета у любецькому рахунку. <b>Сучасна термінологія:</b> на самих монетах «SPECIES» або номінал у Mark-Danske; аукціонні каталоги вживають також «Speciedaler».<br> <b>Основний обіг у Гольштейні:</b> крім місцевих карбувань, обертають любецькі, гамбурзькі й північнонімецькі Thaler Species; нідерландські Patagonen/Albertusthaler; шведські 4-Mark; іспанські піастри — торгівля приймає кожен Species за вмістом срібла.<br> <b>Паралельно з карбуванням Thaler Species — категорія Kronemønt (1618 → 1696).</b> Див. окрему секцію <i>10½-Krone-Fuß · тарифна монета Kronemønt</i> нижче, де докладно задокументовано історію тарифу 1½ → 1⅓ → ⅔ Speciedaler і таблицю карбувань 1644–1696.
        da: '<b>Den dominerende store sølvmønt:</b> Thaler Species i 9¼-Fuß, etableret efter dansk tradition; ved siden af den skillemønt præget i lybsk skilling. <b>Samtidig nomenklatur:</b> på mønterne «SPECIES» eller pålydende i mark dansk; i auktionskataloger også «speciedaler».<br>

  <b>Hovedomløbet i Holsten:</b> ved siden af de hjemlige prægninger cirkulerer lybske, hamborgske og nordtyske Thaler Species, nederlandske patagoner og albertusdalere, svenske 4-markstykker og spanske piastre — handelen tager enhver species efter sølvindhold.<br>

  <b>Parallelt med prægningen af Thaler Species: kronemøntkategorien (1618 → 1696).</b> Se det selvstændige afsnit <i>10½-Krone-Fuß · Kronemønt-Tarifmünze</i> nedenfor, hvor tarifhistorien 1½ → 1⅓ → ⅔ speciedaler og prægetabellen 1644–1696 er dokumenteret i detaljer.

  '
      mt_caption:
        de: Münzstätte Tönning · Gottorpisches Holstein · 1689–1726 · Scheidemünzen mit lübischer Nominalangabe (im 9¼-Fuß-System) + Thaler Species und Dukaten (aus Bruun Coll. Stack's Bowers Auktion Zürich 14.–15. März 2025)
        en: Tönning mint · Gottorp Holstein · 1689–1726 · petty coins denominated in Lübeck reckoning (within the 9¼-Fuß system) plus Thaler Species and ducats (from the Bruun Coll., Stack's Bowers auction, Zurich 14–15 March 2025)
        uk: Монетний двір Tönning · ґотторпський Гольштейн · 1689–1726 · розмінна монета з номіналом у любецькому рахунку (в межах системи 9¼-Fuß) плюс Thaler Species і дукати (з колекції Bruun, аукціон Stack's Bowers, Цюрих 14–15 березня 2025)
