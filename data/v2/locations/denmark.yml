      year_to: 1584
      bar_title:
        de: Frederik-II-Guldkrone-fod (Klipping-Notmünze 1563-1564, Kopenhagen/Bremerholm, Mzm. Hans de Wüllers + Hans Köppelin + Laurits Hammer) · 934 ‰ Kroneguld, 3,341 g rauh / 3,120 g fein · ≈ 70 Stück je Cölln. Marck rauh · 17. Oktober 1563 Karbung verbatim «af 66 1/2 Marck Kroneguld 4,860 Krone Klippinge» (Wilcke Rentmeister-Rechnungen Kap. 6) · Kriegsfinanzierung der Nordischen Siebenjährigen Krieges (1563-1570) · drei parallele Goldarten (Ungersk + Rhinsk + Krone) für drei Markt-Bestimmungen · Rückkehr der Metrik 1584 im Frederiksborger Gold-Geschenkset für Königin Sophie (Probe nicht überliefert) · separater Müntzfuß, NICHT die spätere Tarif-Guldkrone Christians IV / Frederiks III (34-jähriger Belegfenster-Hiat)
