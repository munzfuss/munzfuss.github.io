  kronemont:
    - id: I
      year_from: 1644
      year_to: 1669
      from_label: '1644'
      to_label: '1669'
      title:
        de: 10½-Krone-Fuß · Hebræermønt und Frederik-III.-Glückstadt-Serie
        en: 10½-Krone-Fuß · Hebræermønt and Frederik III Glückstadt series
        uk: 10½-Krone-Fuß · Hebræermønt та серія Frederik III Glückstadt
        da: 10½-Krone-Fuß · hebræermønten og Frederik 3.s Glückstadt-serie
      description:
        de: 'Nach dem 19-jährigen Stillstand 1625–1643 (siehe <i>Christian IVs kroner</i> oben) kehrt die Krone-Mønt 1644 im <b>10½-Krone-Fuß</b> («<i>Grobe Krone</i>») zurück: <b>10½ Krone je rauer Marck</b> von 10¾ Loth (.672 Feingehalt, 14,964 g fein je Stück, Hede / Wilcke II p. 203) — ~8 % weniger Feinsilber pro Münze als unter Christian IV. Beginn mit der <b>Hebræermønt</b> (KM# 32, KM# 137) und der regulären Glückstadter 4-Marck-Danske-Serie unter Frederik III. Tarif weiterhin 1⅓ Speciedaler.<sup>[ref:danskmoent-w2ref]</sup><sup>[ref:en-8493]</sup>'
        en: 'After the 19-year hiatus of 1625–1643 (see <i>Christian IV''s kroner</i> above), the Krone returns in 1644 under the <b>10½-Krone-Fuß</b> («<i>Coarse Krone</i>»): <b>10½ Krone per raw mark</b> at 10¾ Loth (.672 fineness, 14.964 g fine per coin, Hede / Wilcke II p. 203) — ~8 % less fine silver per coin than under Christian IV. The series opens with the <b>Hebræermønt</b> (KM# 32, KM# 137) and the regular Glückstadt 4-Marck-Danske series under Frederik III. The tariff remains 1⅓ Speciedaler.<sup>[ref:danskmoent-w2ref]</sup><sup>[ref:en-8493]</sup>'
        uk: 'Після 19-річного припинення 1625–1643 (див. <i>Christian IV''s kroner</i> вище) Krone-Mønt повертається 1644 р. у <b>10½-Krone-Fuß</b> («<i>Груба Крона</i>»): <b>10½ Krone з повної марки</b> проби 10¾ Loth (.672 проби, 14,964 г чистого на монету, Hede / Wilcke II с. 203) — ~8 % менше чистого срібла на монету, ніж за Кристіана IV. Серія відкривається <b>Hebræermønt</b> (KM# 32, KM# 137) та регулярною ґлюкштатською серією 4 Marck Danske за Фредеріка III. Тариф лишається 1⅓ Speciedaler.<sup>[ref:danskmoent-w2ref]</sup><sup>[ref:en-8493]</sup>'
      context:
        de: <p>Die <b>Hebræermønt</b> wird parallel in zwei Münzstätten geprägt — København (KM# 137, 1644–1646) und Glückstadt (KM# 32, 1645) — beide mit dem Tetragramm יהוה auf der Rückseite und beide bei .593 Feingehalt (gegen den Kronemønt-Standard .671 reduziert). Bei unverändertem Tarif von ⅓ Speciedaler steigt der kumulative Seigniorage-Aufschlag durch dieses zweite Debasement auf ca. +27,6 % (siehe Sondertabelle).</p><p>Parallel dazu Glückstadter 4-Marck-Danske-Serie unter Frederik III. (KM# A43, B43) am Standardfeingehalt .671 — die Norm­fortsetzung, die später die Christian-V.-Serie ablöst.</p>
        en: <p>The <b>Hebræermønt</b> is struck in parallel at two mints — Copenhagen (KM# 137, 1644–1646) and Glückstadt (KM# 32, 1645) — both bearing the Tetragrammaton יהוה on the reverse and both at .593 fineness (reduced from the Kronemønt standard of .671). At an unchanged tariff of ⅓ Speciedaler, this second debasement raises the cumulative seigniorage premium to about +27.6 % (see separate sub-table).</p><p>Alongside, the Glückstadt 4-Marck-Danske series under Frederik III (KM# A43, B43) at standard fineness .671 — the normative continuation that the Christian V series later carries forward.</p>
        uk: <p><b>Hebræermønt</b> карбується паралельно на двох монетних дворах — Копенгаген (KM# 137, 1644–1646) і Glückstadt (KM# 32, 1645) — обидва з тетраграматоном יהוה на реверсі та обидва на пробі .593 (знижено від стандартної kronemønt-проби .671). За незмінним тарифом ⅓ Speciedaler це другий шар debasement піднімає кумулятивну сеньйораж-надбавку до ~+27,6 % (див. окрему підтаблицю).</p><p>Паралельно — ґлюкштатська серія 4 Marck Danske за Фредеріка III (KM# A43, B43) на стандартній пробі .671 — нормативне продовження, яке пізніше підхоплює серія Кристіана V.</p>
        da: <p><b>Hebræermønten</b> præges parallelt i to møntsteder — København (KM# 137, 1644–1646) og Glückstadt (KM# 32, 1645) — begge med tetragrammet יהוה på bagsiden og begge ved .593 i lødighed (nedsat i forhold til kronemøntens standard på .671). Ved uændret tarif på ⅓ speciedaler stiger den samlede møntningsgevinst med denne anden forringelse til ca. +27,6 % (se særtabellen).</p><p>Parallelt hermed Glückstadt-serien på 4 mark danske under Frederik 3. (KM# A43, B43) ved standardlødigheden .671 — den videreførte norm, som senere afløses af Christian 5.s serie.</p>
    - id: II
      year_from: 1670
      year_to: 1699
      from_label: '1670'
      to_label: '1699'
      title:
        de: 10½-Krone-Fuß · Christian-V.-Reihe (Krone und 2/4 Mark)
        en: 10½-Krone-Fuß · Christian V series (Krone and 2/4 Mark)
        uk: 10½-Krone-Fuß · серія Кристіана V (Krone і 2/4 Mark)
        da: 10½-Krone-Fuß · Christian 5.s række (krone samt 2 og 4 mark)
      description:
        de: 'Christian V. setzt den <b>10½-Krone-Fuß</b> ab 1670 in Kopenhagen-Reihen fort: 1 und 2 Krone sowie die parallel laufenden 2- und 4-Mark-Danske auf demselben Standard. Hede 1971 verzeichnet für diese Stücke jeweils <i>Marken fin udbragt til ≈ 10,4 daler / rd je Marck fein</i>, was den Müntzfuß identifiziert. Ende mit Christian V.s Tod 1699.'
        en: 'Christian V continues the <b>10½-Krone-Fuß</b> from 1670 in Copenhagen series: 1 and 2 Krone plus the parallel 2- and 4-Mark Danske on the same standard. Hede 1971 records <i>Marken fin udbragt til ≈ 10.4 daler / rd per Marck fein</i> for these pieces, identifying the coinage standard. Series ends with Christian V''s death in 1699.'
        uk: 'Кристіан V продовжує <b>10½-Krone-Fuß</b> з 1670 р. у копенгагенських серіях: 1 і 2 Krone та паралельні 2- і 4-Mark Danske на тому ж стандарті. Hede 1971 фіксує для цих монет <i>Marken fin udbragt til ≈ 10,4 daler / rd за марку чистого срібла</i> — це і визначає прив''язку. Серія завершується зі смертю Кристіана V у 1699 р.'
    - id: III
      year_from: 1726
      year_to: 1726
      from_label: '1726'
      to_label: '1726'
      title:
        de: 10½-Krone-Fuß · Frederik-IV.-Sonderprägung «Trekrone af 1726»
        en: 10½-Krone-Fuß · Frederik IV special issue «Trekrone af 1726»
        uk: 10½-Krone-Fuß · спеціальна емісія Фредеріка IV «Trekrone af 1726»
        da: 10½-Krone-Fuß · Frederik 4.s særprægning «Trekrone af 1726»
      description:
        de: 'Einzelne 1726-Sonderprägung im alten Kronemøntfod-Standard nach Schließung der Reihe 1699: <b>3 Krone</b> (KM# 525, Hede 41, Dav-1293, Schou 2, Sieg 22) — 66,816 g rauh, .671 Feingehalt, 44,892 g fein, <i>Marken udbragt til 10,418 rd.k.</i> (Hede 1971 f4h41) — also derselbe Müntzfuß wie Christian V.s 1, 2, 4 Mark / Krone-Reihen. Stempelschneider Peter Berg. Findes in Nypræg (Restrike) für die Jahre 1788 und 1927 dokumentiert. Tarif des Originalstücks: 3 Krone = 1 Speciedaler.'
        en: 'A single 1726 special issue at the old Kronemøntfod standard after the series closed in 1699: <b>3 Krone</b> (KM# 525, Hede 41, Dav-1293, Schou 2, Sieg 22) — 66.816 g raw, .671 fineness, 44.892 g fine, <i>Marken udbragt til 10.418 rd.k.</i> (Hede 1971 f4h41) — i.e. the same coinage standard as Christian V''s 1, 2, 4 Mark / Krone series. Engraver Peter Berg. Restrikes («Findes i Nypræg») documented for 1788 and 1927. Tariff of the original piece: 3 Krone = 1 Speciedaler.'
        uk: 'Окрема емісія 1726 р. за старим стандартом Kronemøntfod після закриття серії 1699 р.: <b>3 Krone</b> (KM# 525, Hede 41, Dav-1293, Schou 2, Sieg 22) — 66,816 г повної ваги, .671 проба, 44,892 г чистого, <i>Marken udbragt til 10,418 rd.k.</i> (Hede 1971 f4h41) — тобто та сама стопа, що й серії Кристіана V (1, 2, 4 Mark / Krone). Різьбяр штемпелів Петер Берг. Hовокарбування («Findes i Nypræg») задокументовано для 1788 і 1927 років. Тариф оригінального випуску: 3 Krone = 1 Speciedaler.'
  guldkrone:
    - id: pre-I
      year_from: 1618
      year_to: 1654
      from_label: '1618'
      to_label: 1648 (Hede 25 series end)
      title:
        de: Christian-IV.-Vorgängerphase · Hofgeschenk und Soldzahlung
        en: Christian IV predecessor phase · court gift and mercenary pay
        uk: Передфаза Кристіана IV · придворний подарунок та плата найманцям
        da: Christian 4.s forudgående fase · hofgave og soldbetaling
      description:
        de: 'Die Guldkrone-Tarif-Logik beginnt parallel zur silbernen Christian-IV.-Müntzformel mit dem <b>åbne Brev af 12. Juli 1618</b><sup>[ref:danskmoent-w2ref]</sup>: Christian IV. läßt 2-Guldkroner («dobbelt guldkrone») schlagen, die im Konzept dasselbe 22-Karat-Gold und denselben Tarif<sup>[ref:danskmoent-c4h25]</sup> tragen wie die spätere Frederik-III.-Form. Belegt durch den <b>Esrum-Schatzfund</b> (Ingvardson & Märcher 2010<sup>[ref:portal-christian-4s-guldm-nt-fra-esrum-m-lleg-rd]</sup>, peer-reviewed in <i>Danefæ — Skatte fra den danske muld</i>, Nationalmuseet, S. 254–257): drei Doppelguldkroner Hede 28, alle datiert <b>1628</b>, gefunden auf den Feldern um Esrum Kloster und Møllegård (Detektor-Aufnahmen 2008/2011, Grabung Gilleleje Museum). Aus 12 weltweit bekannten Exemplaren des Typs hält das Nationalmuseet nun 5 (≈ 25 % des erhaltenen Korpus); Esrum liefert den ersten dokumentierten Fundort für diesen Typ. Christian-IV.-Guldkroner waren keine Massenkarbung im täglichen Umlauf, sondern dienten als Hofgeschenk und Soldzahlung.<br><br><b>Christian-IV.-Nomenklatur:</b> die Stücke trugen unter Christians IV. eigener Pålydende-Konvention nominal die Hälfte ihrer späteren Bezeichnung — die Hede-26-Serie (~2,998 g rau, .917) wurde als «<i>1 Guldkrone</i>» gestempelt, die Hede-25-Serie (~5,996 g rau, .917) als «<i>2 Guldkrone</i>», die Hede-28-Serie (~11,99 g rau, .917) als «<i>dobbelt guldkrone</i>». Erst Frederik III. benennt 1655 dasselbe physische Stück um: Hede 1957 hält den Wechsel verbatim in Fußnote (1) fest — «<i>Betegnelsen guldkrone dækker under Frederik III den mønt, Christian IV kaldte 2 guldkrone</i>»<sup>[ref:danskmoent-f3guldkr]</sup>.'
        en: 'The Guldkrone tariff logic begins in parallel with the silver Christian IV Müntzformel via the <b>åbne Brev af 12. Juli 1618</b><sup>[ref:danskmoent-w2ref]</sup>: Christian IV strikes 2-Guldkroner («dobbelt guldkrone») on the same 22-carat gold and the same tariff<sup>[ref:danskmoent-c4h25]</sup> as the later Frederik III form. Attested by the <b>Esrum hoard</b> (Ingvardson & Märcher 2010<sup>[ref:portal-christian-4s-guldm-nt-fra-esrum-m-lleg-rd]</sup>, peer-reviewed in <i>Danefæ — Skatte fra den danske muld</i>, Nationalmuseet, pp. 254–257): three double Guldkroner Hede 28, all dated <b>1628</b>, found in the fields around Esrum Abbey and Møllegård (detector finds 2008 / 2011, follow-up excavation by Gilleleje Museum). Of the 12 known specimens of this type worldwide, the National Museum now holds 5 (≈ 25 % of the surviving corpus); Esrum delivers the first documented find spot for this type. Christian IV Guldkroner were not mass production for daily circulation but served as court gifts and mercenary pay.<br><br><b>Christian IV nomenclature:</b> under Christian IV''s own Pålydende convention the pieces carried nominally half the value of their later designation — the Hede 26 series (~2.998 g raw, .917) was struck as «<i>1 Guldkrone</i>», the Hede 25 series (~5.996 g raw, .917) as «<i>2 Guldkrone</i>», the Hede 28 series (~11.99 g raw, .917) as «<i>dobbelt guldkrone</i>». Only under Frederik III in 1655 is the same physical coin renamed: Hede 1957 records the shift verbatim in footnote (1) — «<i>Betegnelsen guldkrone dækker under Frederik III den mønt, Christian IV kaldte 2 guldkrone</i>»<sup>[ref:danskmoent-f3guldkr]</sup>.'
        uk: 'Тарифна логіка Guldkrone починається паралельно зі срібною монетною формулою Кристіана IV через <b>åbne Brev af 12. Juli 1618</b><sup>[ref:danskmoent-w2ref]</sup>: Кристіан IV карбує 2-Guldkroner («dobbelt guldkrone») на тому самому 22-каратному золоті й за тим самим тарифом<sup>[ref:danskmoent-c4h25]</sup>, що й пізніша форма Фредеріка III. Засвідчено <b>Esrum-скарбом</b> (Ingvardson & Märcher 2010<sup>[ref:portal-christian-4s-guldm-nt-fra-esrum-m-lleg-rd]</sup>, рецензоване видання в <i>Danefæ — Skatte fra den danske muld</i>, Nationalmuseet, с. 254–257): три подвійні Guldkrone Hede 28, усі датовані <b>1628 р.</b>, знайдені на полях довкола Esrum Kloster та Møllegård (детекторні знахідки 2008 / 2011 рр., наступні розкопки Gilleleje Museum). Із 12 відомих у світі екземплярів цього типу Nationalmuseet тримає 5 (≈ 25 % збереженого корпусу); Esrum дає перше задокументоване місце знахідки для цього типу. Guldkrone Кристіана IV не були масовим карбуванням для повсякденного обігу, а слугували придворним подарунком та платою найманцям.<br><br><b>Номенклатура Кристіана IV:</b> за його власною Pålydende-конвенцією монети мали номінально вдвічі менші значення, ніж пізніше — серія Hede 26 (~2,998 г повної ваги, .917) карбувалась як «<i>1 Guldkrone</i>», серія Hede 25 (~5,996 г повної ваги, .917) як «<i>2 Guldkrone</i>», серія Hede 28 (~11,99 г повної ваги, .917) як «<i>dobbelt guldkrone</i>». Лише за Фредеріка III 1655 р. та сама фізична монета перейменовується: Hede 1957 фіксує зміну verbatim у виносці (1) — «<i>Betegnelsen guldkrone dækker under Frederik III den mønt, Christian IV kaldte 2 guldkrone</i>»<sup>[ref:danskmoent-f3guldkr]</sup>.'
    - id: I
      year_from: 1655
