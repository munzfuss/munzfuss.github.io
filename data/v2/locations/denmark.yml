        - key:
            de: "Divergenz der Quellen zum Korn"
            en: "Where the sources diverge on the fineness"
            uk: "Розходження джерел щодо проби"
            da: Kildernes uenighed om lødigheden
          value:
            de: "<b>Hede</b> gibt den Glückstädter und Rendsborger Dukaten dasselbe Korn wie der Kopenhagener und Christianiaer Linie — <b>0,979</b> —, und zwar auf allen acht Typen, für die er überhaupt ein Korn druckt<sup>[ref:danskmoent-hede-gluckstadt-dukat-finhed]</sup>. <b>Krause</b> führt dieselben Stücke in seinem schleswig-holsteinischen Bande unter Glückstadt und gibt ihnen <b>0,986</b>, das Korn der Reichsmünzordnung von 1559, während seine dänischen und norwegischen Bände 0,979 führen<sup>[ref:numismaster-gluckstadt-km70-1-dukat]</sup>. Die herzoglichen Prägungen von Gottorp, Tönning, Plön, Sonderburg, Norburg und Glücksburg stehen allein im schleswig-holsteinischen Bande und tragen 0,986 ohne dänisches Gegenstück. Die Scheide läuft mithin zwischen den Katalogbänden, nicht zwischen Holstein und Schleswig. Zur Genauigkeit der beiden Angaben: die 0,986 steht dort durchweg neben einem Raugewicht von 3,5 g — <i>errechnet 233,856 / 3,5 = 66,8 Stück je Marck</i>, nicht 67; Hedes 3,490 g ergeben <i>67,01</i>."
            en: "<b>Hede</b> gives the Glückstadt and Rendsborg ducats the same fineness as the Copenhagen and Christiania lines — <b>0.979</b> — on all eight types for which he prints a fineness at all<sup>[ref:danskmoent-hede-gluckstadt-dukat-finhed]</sup>. <b>Krause</b> lists the same pieces in his Schleswig-Holstein volume under Glückstadt and gives them <b>0.986</b>, the fineness of the imperial ordinance of 1559, while his Danish and Norwegian volumes carry 0.979<sup>[ref:numismaster-gluckstadt-km70-1-dukat]</sup>. The ducal issues of Gottorp, Tönning, Plön, Sonderburg, Norburg and Glücksburg appear only in the Schleswig-Holstein volume and carry 0.986 with no Danish counterpart. The line therefore runs between the catalogue volumes, not between Holstein and Schleswig. On the precision of the two figures: the 0.986 stands there throughout beside a rough weight of 3.5 g — <i>computed, 233.856 / 3.5 = 66.8 pieces per mark</i>, not 67; Hede's 3.490 g yields <i>67.01</i>."
            uk: "<b>Hede</b> дає глюкштадтським і рендсборзьким дукатам ту саму пробу, що й копенгагенській та крістіанійській лініям — <b>0,979</b> — і так на всіх восьми типах, для яких він узагалі друкує пробу<sup>[ref:danskmoent-hede-gluckstadt-dukat-finhed]</sup>. <b>Krause</b> веде ті самі монети у своєму шлезвіг-гольштейнському томі під заголовком Glückstadt і дає їм <b>0,986</b> — пробу імперського ордонансу 1559 р., тоді як його данський і норвезький томи несуть 0,979<sup>[ref:numismaster-gluckstadt-km70-1-dukat]</sup>. Герцогські карбування Готторпа, Тьоннінга, Плена, Сондербурга, Нєрборга і Глюксбурга є лише в шлезвіг-гольштейнському томі й несуть 0,986 без данського відповідника. Отже межа проходить між томами каталогів, а не між Гольштейном і Шлезвігом. Щодо точності обох величин: 0,986 стоїть там незмінно поряд із повною вагою 3,5 г — <i>обчислено 233,856 / 3,5 = 66,8 штуки з марки</i>, а не 67; 3,490 г у Hede дають <i>67,01</i>."
            da: '<b>Hede</b> giver dukaterne fra Glückstadt og Rendsborg samme lødighed som den københavnske og christianiaske linje — <b>0,979</b> — og det på alle otte typer, for hvilke han overhovedet trykker en lødighed<sup>[ref:danskmoent-hede-gluckstadt-dukat-finhed]</sup>. <b>Krause</b> fører de samme stykker i sit slesvig-holstenske bind under Glückstadt og giver dem <b>0,986</b>, lødigheden fra Reichsmünzordnung 1559, mens hans danske og norske bind fører 0,979<sup>[ref:numismaster-gluckstadt-km70-1-dukat]</sup>. De hertugelige prægninger fra Gottorp, Tønning, Plön, Sønderborg, Nordborg og Lyksborg står alene i det slesvig-holstenske bind og bærer 0,986 uden dansk modstykke. Skellet løber altså mellem katalogbindene, ikke mellem Holsten og Slesvig. Om nøjagtigheden af de to angivelser: de 0,986 står dér gennemgående ved siden af en bruttovægt på 3,5 g — <i>beregnet 233,856 / 3,5 = 66,8 stykker pr. mark</i>, ikke 67; Hedes 3,490 g giver <i>67,01</i>.'
      rechnungsfraktionen_label:
        de: "Nominale und Rechnungsbindungen"
        en: "Denominations and accounting links"
        uk: "Номінали та розрахункові звʼязки"
        da: Nominaler og regningsbindinger
      rechnungsfraktionen:
        de: |-
          <b>1 Dukat</b> — biß 1629 <b>Ungersk Gylden</b> geheißen — ist das Hauptnominal über alle Phasen; gekarbt wurden daneben ½, ¼, 2, 3, 4, 5 und 10 Dukaten.<br><b>1 Portugaløser = 10 Dukaten</b>: kein eigener Fuß, sondern der Zehnfach-Multiplus dieses<sup>[ref:danskmoent-10dukat-portugaloeser]</sup>, mit halben, viertel und doppelten Stücken. Die Zehnfachheit liegt im Feingolde, nicht im Raugewichte: die Forordning af 8. september 1602 gibt dem Portugaløser 6¾ Stück je Marck (34,645 g rauh) gegen 6,7 bei zehn Dukaten — leichter im Schrot, doch höher im Korn, 23½ gegen 23⅓ Karat, so daß <i>errechnet 33,924 / 3,393 = 9,997</i><sup>[ref:wilcke1-moentordning-1602-guld]</sup>.<br><b>Lovbestemt Værdi</b> 1602: Portugaløser 17 Daler, Ungersk Gylden 1⅝ Daler; die Forordning vom 20. November 1604 senkt sie auf 16 und 1 9/16 und läßt Schrot und Korn unberührt<sup>[ref:wilcke1-moentordning-1604-nedsaettelse]</sup>. Der Tarif steht damit auf 10,46 und 10,24, wo das Metall auf 9,997 steht — Tarif und Gewichtsstandard bewegen sich getrennt.<br>Ein festes Silberäquivalent hat der Fuß nicht; außerhalb der gesetzten Kurse wurde die Müntze nach Edelmetallgehalt angenommen<sup>[ref:museum-rantzau-taler-dukaten]</sup>.
        en: |-
          <b>1 Dukat</b> — called <b>Ungersk Gylden</b> until 1629 — is the main denomination across all phases; ½, ¼, 2, 3, 4, 5 and 10 ducat pieces were struck beside it.<br><b>1 Portugaløser = 10 ducats</b>: not a standard of its own but the tenfold multiple of this one<sup>[ref:danskmoent-10dukat-portugaloeser]</sup>, with half, quarter and double pieces. The tenfold relation lies in the fine gold, not in the rough weight: the ordinance of 1602 gives the Portugaløser 6¾ pieces per mark (34.645 g rough) against 6.7 for ten ducats — lighter in weight yet higher in fineness, 23½ against 23⅓ carats, so that <i>computed, 33.924 / 3.393 = 9.997</i><sup>[ref:wilcke1-moentordning-1602-guld]</sup>.<br><b>Lovbestemt Værdi</b> 1602: Portugaløser 17 daler, Ungersk Gylden 1⅝ daler; the Forordning of 20 November 1604 lowers these to 16 and 1 9/16 and leaves weight and fineness untouched<sup>[ref:wilcke1-moentordning-1604-nedsaettelse]</sup>. The tariff thus stands at 10.46 and 10.24 where the metal stands at 9.997 — tariff and weight standard move separately.<br>The standard has no fixed silver equivalent; outside the set rates the coin was taken by metal content<sup>[ref:museum-rantzau-taler-dukaten]</sup>.
        uk: |-
          <b>1 Dukat</b> — до 1629 р. званий <b>Ungersk Gylden</b> — головний номінал через усі фази; поряд карбувалися ½, ¼, 2, 3, 4, 5 і 10 дукатів.<br><b>1 Portugaløser = 10 дукатів</b>: не окрема стопа, а десятикратний множник цієї<sup>[ref:danskmoent-10dukat-portugaloeser]</sup>, з половинними, чвертними й подвійними штуками. Десятикратність лежить у чистому золоті, а не в повній вазі: ордонанс 1602 р. дає Portugaløser-ові 6¾ штуки з марки (34,645 г повної) проти 6,7 у десяти дукатів — легше на вагу, але вище на пробу, 23½ проти 23⅓ карата, тож <i>обчислено 33,924 / 3,393 = 9,997</i><sup>[ref:wilcke1-moentordning-1602-guld]</sup>.<br><b>Lovbestemt Værdi</b> 1602 р.: Portugaløser 17 далерів, Ungersk Gylden 1⅝ далера; Forordning від 20 листопада 1604 р. знижує їх до 16 і 1 9/16, лишаючи вагу й пробу недоторканими<sup>[ref:wilcke1-moentordning-1604-nedsaettelse]</sup>. Тариф стоїть отже на 10,46 і 10,24 там, де метал стоїть на 9,997 — тариф і ваговий стандарт рухаються окремо.<br>Фіксованого срібного еквівалента стопа не має; поза встановленими курсами монету приймали за вмістом дорогоцінного металу<sup>[ref:museum-rantzau-taler-dukaten]</sup>.
        da: '<b>1 dukat</b> — indtil 1629 kaldet <b>ungersk gylden</b> — er hovednominalet gennem alle faser; desuden blev der præget ½, ¼, 2, 3, 4, 5 og 10 dukater.<br><b>1 portugaløser = 10 dukater</b>: ingen selvstændig fod, men et tidobbelt multiplum af denne<sup>[ref:danskmoent-10dukat-portugaloeser]</sup>, med halve, kvarte og dobbelte stykker. Tidoblingen ligger i finguldet, ikke i bruttovægten: Forordning af 8. september 1602 giver portugaløseren 6¾ stykker pr. mark (34,645 g rå) mod 6,7 ved ti dukater — lettere i skrot, men højere i lødighed, 23½ mod 23⅓ karat, således at <i>beregnet 33,924 / 3,393 = 9,997</i><sup>[ref:wilcke1-moentordning-1602-guld]</sup>.<br><b>Lovbestemt værdi</b> 1602: portugaløser 17 daler, ungersk gylden 1⅝ daler; Forordning af 20. november 1604 nedsætter dem til 16 og 1 9/16 og lader skrot og lødighed urørt<sup>[ref:wilcke1-moentordning-1604-nedsaettelse]</sup>. Tariffen står dermed på 10,46 og 10,24, hvor metallet står på 9,997 — tarif og vægtstandard bevæger sig hver for sig.<br>Foden har ingen fast sølvækvivalent; uden for de fastsatte kurser blev mønten modtaget efter ædelmetalindhold<sup>[ref:museum-rantzau-taler-dukaten]</sup>.'
    pdate_label:
      de: 'Karbungszeit: 1531 → 1802 · 271 Jahre'
      en: 'Struck: 1531 → 1802 · 271 years'
      uk: 'Карбування: 1531 → 1802 · 271 рік'
      da: 'Prægningstid: 1531 → 1802 · 271 år'
    hintergrund:
      de: |
        <b>Dukatfod</b> — die dänisch-norwegische Ausprägung des Dukatenstandards: 67 Stück je rauer Cöllnischer Marck bei 23 Karat 8 Grän, metrisch der deutsche Reichsdukatenfuß, den die Augspurgische Reichsmünzordnung von 1559 für das Königreich jedoch nicht verbindlich machte. Gekarbt seit 1531, in dänischem Recht erst durch die Forordning vom 8. September 1602 benannt. Der Portugaløser gehört demselben Fuß an als dessen Zehnfach-Multiplus; die Benennung Ungersk Gylden und Portugaløser hält biß 1629, danach Dukat.
      en: |
        <b>Dukatfod</b> — the Danish-Norwegian form of the ducat standard: 67 pieces per rough Cologne mark at 23 carats 8 grains, metrically the German Reichsdukatenfuß, which the Augsburg Imperial Coinage Ordinance of 1559 did not, however, make binding on the kingdom. Struck from 1531, named in Danish law only by the Forordning of 8 September 1602. The Portugaløser belongs to the same standard as its tenfold multiple; the names Ungersk Gylden and Portugaløser hold until 1629, thereafter Dukat.
      uk: |
        <b>Dukatfod</b> — дансько-норвезька форма дукатного стандарту: 67 штук із сирої Кельнської марки за 23 карати 8 гран, метрично німецький Reichsdukatenfuß, якого, втім, Авґсбурзький ордонанс 1559 р. для королівства обовʼязковим не робив. Карбується від 1531 р., у данському праві названий лише Forordning від 8 вересня 1602 р. Portugaløser належить до тієї самої стопи як її десятикратний множник; назви Ungersk Gylden і Portugaløser тримаються до 1629 р., далі Dukat.
  courantdukatenfuss:
    pdate_label:
      de: 'Geltungsbereich: 1714 → 1796 · 82 Jahre'
      en: 'Period of validity: 1714 → 1796 · 82 years'
      uk: 'Період дії: 1714 → 1796 · 82 роки'
      da: 'Gyldighedsområde: 1714 → 1796 · 82 år'
    hintergrund:
      de: 'Spezifisch dänische tarif-tragende Goldlinie, die in <b>zwei metrischen Phasen</b> verläuft. <b>Phase I — Frederik IV. (1714–1717):</b> Erstprägung als Kriegsfinanzierungsmaßnahme im Großen Nordischen Krieg, 81½ Stück / rauer Cölln. Marck, 21 Karat (.875), 2,511 g Feingold; Tarif 12 Mark Kurant = 2 Rigsdaler Courant. Forordning <b>9. Juli 1727</b> senkt Tarif auf 11 Mark («reducerede Kurant-Dukater»); Forordning <b>4. Juli 1757</b> ruft die alten Stücke zur Einschmelzung ein.<sup>[ref:ernst-axel-kurantdukat]</sup> <b>Phase II — Frederik V. Reform (1757–1796):</b> im Juni 1757 neuer Standard 75 Stück / Marck, 3,118 g rau, 2,72832 g fein; 12-Mark-Tarif zurück. Massenprägung 1757–1765 in Kopenhagen: <b>≈ 3 030 742 Stück</b> (Finanzkollegium 1791) — die größte Goldmünzproduktion in der dänischen Geschichte (≈ 8,3 t Feingold).<sup>[ref:ernst-axel-kurantdukat]</sup> Christian-VII.-Geburtstagsstrich 27. Januar 1771 (131 Stück Kopenhagen). <b>Plakat 2. Dezember 1782</b> erlaubt jedermann die freie Goldablieferung zur Kurantdukat-Prägung («<i>Gold aus der rauen Marck zu 75 Stück bei 21 Karat ausprägen</i>»)<sup>[ref:danskmoent-c7mord-plakat-1782]</sup> — Hauptphase 1781–1796 in Altona + Kopenhagen, ≈ 237 000 Stück. Plakat-Widerruf 1795; letzte Prägung 1796 in Altona (≈ 30 700 Stück mit 1785-Datum).<sup>[ref:ernst-axel-kurantdukat]</sup> Der Statsbankerot vom 5. Januar 1813 reformiert nur die Silber-Courantlinie<sup>[ref:forordning-pengevaesenet-1813]</sup>; der Kurantdukat behält rechtlich Zahlungsmittelstatus zum 12-Mark-Tarif biß zur Skandinavischen Münzunion 1873.

        '
      en: 'A specifically Danish tariff-bearing gold line in <b>two metric phases</b>. <b>Phase I — Frederik IV (1714–1717):</b> first issue as a war-finance measure in the Great Northern War; 81½ pieces per rough Cologne Mark, 21 carats (.875), 2.511 g fine gold; tariff 12 Mark Kurant = 2 Rigsdaler Courant. The Forordning of <b>9 July 1727</b> reduces the tariff to 11 Mark («reducerede Kurant-Dukater»); the Forordning of <b>4 July 1757</b> calls the old pieces in for melting.<sup>[ref:ernst-axel-kurantdukat]</sup> <b>Phase II — Frederik V reform (1757–1796):</b> in June 1757 a new standard of 75 pieces per Mark, 3.118 g rough, 2.72832 g fine; the 12-Mark tariff is restored. Mass coinage 1757–1765 at Copenhagen: <b>≈ 3,030,742 pieces</b> (Finanzkollegium 1791) — the largest gold-coin production in Danish history (≈ 8.3 t fine gold).<sup>[ref:ernst-axel-kurantdukat]</sup> Christian-VII-birthday strike on 27 January 1771 (131 pieces, Copenhagen). <b>Plakat of 2 December 1782</b> permits anyone to deliver gold freely for Kurantdukat coinage («<i>gold to be coined at 75 pieces per rough Mark of 21 carats</i>»)<sup>[ref:danskmoent-c7mord-plakat-1782]</sup> — the main phase 1781–1796 in Altona + Copenhagen, ≈ 237,000 pieces. The plakat is revoked in 1795; the final issue is 1796 in Altona (≈ 30,700 pieces with 1785 dies).<sup>[ref:ernst-axel-kurantdukat]</sup> The Statsbankerot of 5 January 1813 reforms only the silver Courant line<sup>[ref:forordning-pengevaesenet-1813]</sup>; the Kurantdukat retains legal-tender status at the 12-Mark tariff until the Scandinavian Monetary Union of 1873.'
      uk: 'Специфічно данська тариф-несуча золота лінія у <b>двох метричних фазах</b>. <b>Фаза I — Frederik IV (1714–1717):</b> перша емісія як засіб фінансування Великої Північної війни; 81½ штук з повної Кельнської марки, 21 карат (.875), 2,511 г чистого золота; тариф 12 Mark Kurant = 2 Rigsdaler Courant. Forordning <b>9 липня 1727</b> знижує тариф до 11 Mark («reducerede Kurant-Dukater»); Forordning <b>4 липня 1757</b> кличе старі монети на переплав.<sup>[ref:ernst-axel-kurantdukat]</sup> <b>Фаза II — реформа Frederik V (1757–1796):</b> у червні 1757 новий стандарт 75 штук з марки, 3,118 г повної, 2,72832 г чистого; тариф 12 Mark відновлено. Масове карбування 1757–1765 у Копенгагені: <b>≈ 3 030 742 шт.</b> (Finanzkollegium 1791) — найбільше виробництво золотих монет в історії Данії (≈ 8,3 т чистого золота).<sup>[ref:ernst-axel-kurantdukat]</sup> Меморіальний strike Christian VII 27 січня 1771 (131 шт. Копенгаген). <b>Plakat 2 грудня 1782</b> дозволяє будь-кому вільно здавати золото на карбування Kurantdukat («<i>золото карбувати по 75 штук з повної марки при 21 караті</i>»)<sup>[ref:danskmoent-c7mord-plakat-1782]</sup> — головна фаза 1781–1796 в Альтоні + Копенгагені, ≈ 237 000 шт. Plakat скасовано 1795; останнє карбування 1796 в Альтоні (≈ 30 700 шт. зі штемпелями 1785).<sup>[ref:ernst-axel-kurantdukat]</sup> Statsbankerot 5 січня 1813 реформує лише срібну Courant-лінію<sup>[ref:forordning-pengevaesenet-1813]</sup>; Kurantdukat юридично зберігає статус законного платіжного засобу за 12-Mark-тарифом до Скандинавської монетної унії 1873.'
    closing_label:
      de: Zusammenfassung · 82 Jahre Neuprägung · Umlauf biß ~1833, Tarif-Recht biß 1873
      en: Summary · 82 years of new coinage · circulation to ~1833, tariff legal-tender to 1873
      uk: Підсумок · 82 роки нового карбування · обіг до ~1833, тарифне право до 1873
      da: Sammenfatning · 82 års nyprægning · omløb til ~1833, tarifretlig gyldighed til 1873
    closing:
      de: 'Der Courantdukatenfuß ist die <b>spezifisch dänische Antwort</b> auf das Problem einer domestizierten Goldwährung neben dem Reichsdukat: ein tariffierter, niedriger probiger (.875) Dukat zum festen 12-Mark-Wert, gegenüber dem höheren-probigen (.986) freien Reichsdukat. Über die ganze Phase II (1757–1796) ist er die <b>«almindeligst gangbare Guldmønt»</b> in Dänemark<sup>[ref:ernst-axel-kurantdukat]</sup> — dominantes Goldgeld der Krone. In den Herzogtümern Schleswig-Holstein dient er ab 1771 als territoriale Goldversorgung der Altonaer Münze.<sup>[ref:danskmoent-1nobel]</sup> Keine formale Demonetisierungsverordnung — als amtlicher Fuß 1813 vom Rigsbankdaler abgelöst, um ~1833 aus dem inländischen Umlauf verschwunden<sup>[ref:ernst-axel-kurantdukat]</sup>, rechtlich aber erst 1873 durch die Krone der Skandinavischen Münzunion ersetzt.

        '
      en: 'The Courantdukatenfuß is the <b>specifically Danish answer</b> to the problem of a domesticated gold currency alongside the Reichsdukat: a tariffed, lower-fineness (.875) ducat at the fixed 12-Mark value, set against the higher-fineness (.986) free-floating Reichsdukat. Throughout Phase II (1757–1796) it is the <b>«almindeligst gangbare Guldmønt»</b> in Denmark<sup>[ref:ernst-axel-kurantdukat]</sup> — the Crown''s dominant gold currency. In the duchies of Schleswig-Holstein it serves from 1771 onward as the Altona mint''s territorial gold supply.<sup>[ref:danskmoent-1nobel]</sup> No formal demonetisation ordinance — superseded as the official foot by the Rigsbankdaler in 1813, gone from domestic circulation by ~1833<sup>[ref:ernst-axel-kurantdukat]</sup>, yet legally replaced only in 1873 by the Krone of the Scandinavian Monetary Union.'
      uk: 'Courantdukatenfuß — <b>специфічно данська відповідь</b> на проблему домашньої золотої валюти поруч з Reichsdukat: тарифний дукат із нижчою пробою (.875) за фіксованою вартістю 12 Mark проти вільноторгового вищопробного (.986) Reichsdukat. Протягом усієї фази II (1757–1796) він є <b>«almindeligst gangbare Guldmønt»</b> у Данії<sup>[ref:ernst-axel-kurantdukat]</sup> — домінантна золота валюта Корони. У герцогствах Шлезвіг-Гольштейн з 1771 р. слугує територіальним золотим забезпеченням Альтонського монетного двору.<sup>[ref:danskmoent-1nobel]</sup> Формальної демонетизаційної постанови нема — як офіційний фут витіснений Rigsbankdaler-ом 1813, з внутрішнього обігу зник близько ~1833<sup>[ref:ernst-axel-kurantdukat]</sup>, проте юридично замінений лише 1873 монетою Krone Скандинавської монетної унії.'
  pistolenfuss:
    pdate_label:
      de: 'Geltungsbereich: 1771 → 1870 · 99 Jahre'
      en: 'Period of validity: 1771 → 1870 · 99 years'
      uk: 'Період дії: 1771 → 1870 · 99 років'
      da: 'Gyldighedsområde: 1771 → 1870 · 99 år'
    hintergrund:
      de: 'Pistolen-Goldlinie nach norddt. <b>5-Thaler-Tarif</b>-Tradition (Vorbild Wilhelm d''or 1737, Friedrich d''or 1741<sup>[ref:denmark-ref32-no-url]</sup>). In Dänemark eingeführt 1771 unter Christian VII. an der neu eröffneten Altonaer Münze als <b>Christian d''or</b> nach französischem Louis-d''or-Vorbild<sup>[ref:danskmoent-w6b1]</sup> — derselbe Standard wie der reduzierte preußische Friedrich d''or (130/144 Probe ≈ 903 ‰, 6,03 g Feingold, 5-Speciedaler-Tarif = 12 Mark Dansk-Anteil). Die Linie wird kontinuierlich unter <b>fünf Regenten</b> fortgeführt: Christian VII. (1771–1808), Frederik VI. (1808–1839, von 1808 als Frederik d''or — fortgesetzt trotz Statsbankerot 1813), Christian VIII. (1839–1848), Frederik VII. (1848–1863), Christian IX. (1863–1870, letzte Prägung 1870). Verwendung «<i>mest til internationale betalinger</i>»<sup>[ref:danskmoent-w6b1]</sup> — Außenhandelsmünze, kein gesetzliches Zahlungsmittel im Inland. Ende: die dänische Møntloven af 23. maj 1873 (Skandinavische Münzunion) ersetzt Speciedaler / d''or durch die Krone.

        '
      en: 'Pistole gold line of the North-German <b>5-thaler tariff</b> tradition (modelled on the Wilhelm d''or of 1737 and Friedrich d''or of 1741<sup>[ref:denmark-ref32-no-url]</sup>). Introduced in Denmark in 1771 under Christian VII at the newly opened Altona mint as the <b>Christian d''or</b>, on the French Louis-d''or model<sup>[ref:danskmoent-w6b1]</sup> — at the same standard as the reduced Prussian Friedrich d''or (130/144 fineness ≈ 903 ‰, 6.03 g fine gold, 5-Speciedaler tariff = 12 Mark Dansk-share). The line continues without interruption under <b>five rulers</b>: Christian VII (1771–1808), Frederik VI (1808–1839, from 1808 as the Frederik d''or — kept on through the Statsbankerot of 1813), Christian VIII (1839–1848), Frederik VII (1848–1863), Christian IX (1863–1870, last issue 1870). Used «<i>mest til internationale betalinger</i>»<sup>[ref:danskmoent-w6b1]</sup> — a foreign-trade coin, not domestic legal tender. End: the Danish Møntloven af 23. maj 1873 (Scandinavian Monetary Union) replaces the Speciedaler / d''or with the Krone.'
      uk: 'Pistolen-золота лінія північно-німецької тарифної традиції <b>5 талерів</b> (зразки Wilhelm d''or 1737 і Friedrich d''or 1741<sup>[ref:denmark-ref32-no-url]</sup>). У Данії запроваджено 1771 р. за Christian VII у новому монетному дворі Альтони як <b>Christian d''or</b> за зразком французького Louis d''or<sup>[ref:danskmoent-w6b1]</sup> — за тим самим стандартом, що й редукований прусський Friedrich d''or (проба 130/144 ≈ 903 ‰, 6,03 г чистого золота, тариф 5 Speciedaler = частка 12 Mark Dansk). Лінія безперервно продовжується за <b>п''яти регентів</b>: Christian VII (1771–1808), Frederik VI (1808–1839, з 1808 як Frederik d''or — продовжено попри Statsbankerot 1813), Christian VIII (1839–1848), Frederik VII (1848–1863), Christian IX (1863–1870, остання емісія 1870). Вживалися «<i>mest til internationale betalinger</i>»<sup>[ref:danskmoent-w6b1]</sup> — як зовнішньоторговельна, не як внутрішній законний платіжний засіб. Кінець: данський Закон про монету 1873 (Скандинавська монетна унія) замінює Speciedaler / d''or на Krone.'
  9_thaler:
    pdate_label:
      de: 'Geltungsbereich: 1566 → 1625 · 59 Jahre'
      en: 'Period of validity: 1566 → 1625 · 59 years'
      uk: 'Період дії: 1566 → 1625 · 59 років'
      da: 'Gyldighedsområde: 1566 → 1625 · 59 år'
    hintergrund:
      de: 'Reichsstandard nach dem Augspurger Reichsmüntz-Abschied vom 30. Mai 1566 — verbindlich für sämtliche Reichsstände. In Holstein-Gottorp dominierte er unter Adolf I., Johann Adolf und Friedrich III.; Münzstätten Glückstadt und Tönning prägten nach diesem Fuß Thaler Species, Mark-lübisch-Theilstücke und Schillinge. Während der Kipper-Wipper-Krise (1620–1623) brach das einheitliche Reichsmünzwesen zusammen — bereits ab 1622 (Friedrich III. von Gottorp, Glückstadt) setzt sich der leichtere 9¼-Thaler-Fuß als Großsilberstandard durch, die letzte holsteinische 9-Fuß-Prägung erfolgt 1625 (Hans Jr. von Sonderburg, 2 Schilling Lübisch). <b>Über Holstein hinaus blieb der 9-Fuß als Banktauschmünze in Kraft:</b> Hamburg führte ihn als <i>Bank-Mark</i> der Hamburger Bank weiter, Lübeck als <i>Speciemark</i> — beide bis zur Reichsmünzreform 1875.

        '
      en: Imperial standard following the Augsburg Imperial Mint Decree of 30 May 1566 — binding on all imperial estates. In Holstein-Gottorp it dominated under Adolf I, Johann Adolf and Friedrich III; the Glückstadt and Tönning mints struck Thaler Species, Mark-lübisch sub-units and Schilling petty coins on this standard. The Kipper-Wipper crisis (1620–1623) collapsed the unified imperial coinage; from 1622 onward (Friedrich III of Gottorp, Glückstadt) the lighter 9¼-Thaler-Fuß took over as the large-silver standard, and the last Holstein 9-Fuß strike falls in 1625 (Hans Jr. of Sonderburg, 2 Schilling Lübisch). <b>Beyond Holstein the 9-Fuß remained in force as bank-exchange money:</b> Hamburg kept it as the <i>Bank-Mark</i> of the Hamburger Bank, Lübeck as the <i>Speciemark</i> — both until the imperial coinage reform of 1875.
      uk: Імперський стандарт за Авґсбурзьким імперським монетним ордонансом 30 травня 1566 р. — обов'язковий для всіх імперських станів. У Гольштейн-Ґотторпі домінував за Адольфа I, Йоганна Адольфа й Фредеріка III; монетні двори Glückstadt і Tönning карбували за цим стандартом Thaler Species, частки Mark lübisch і дрібні Schilling-монети. Криза Kipper-Wipper (1620–1623) зруйнувала єдину імперську монетну систему — вже з 1622 (Фредерік III Ґотторпський, Glückstadt) у Гольштейні утверджується легший 9¼-Thaler-Fuß як великосрібний стандарт, а останнє 9-Fuß-карбування припадає на 1625 р. (Hans Jr. Sonderburg, 2 Schilling Lübisch). <b>Поза Гольштейном 9-Fuß продовжував існувати як банковий рахунок:</b> Гамбург тримав його як <i>Bank-Mark</i> Гамбурзького банку, Любек — як <i>Speciemark</i>; обидва до імперської монетної реформи 1875 р.
    closing_label:
      de: Übergang zum 9¼-Fuß (Thaler Species) ab 1622, letzte Holstein-Prägung 1625
      en: Transition to the 9¼-Fuß (Thaler Species) from 1622; last Holstein strike 1625
      uk: Перехід до 9¼-Fuß (Thaler Species) з 1622; останнє карбування в Гольштейні — 1625
      da: Overgang til 9¼-Fuß (Thaler Species) fra 1622, sidste holstenske prægning 1625
    closing:
      de: 'Der 9-Thaler-Fuß war kurzlebig in Holstein selbst (Adolf I. → Hans Jr. Sonderburg, letzte Prägung 1625; ab 1622 vom 9¼-Fuß abgelöst), bleibt aber <b>außerhalb Holsteins als Hamburger Bank-Mark und Lübecker Speciemark Rechnungseinheit biß 1875</b>. Die holsteinischen Reichsthaler unter Johann Adolf gehören zu den frühesten dokumentierten Großsilbermünzen der Region und bilden die Grundlage für die spätere 9¼-Fuß-Tradition.

        '
      en: The 9-Thaler-Fuß was short-lived in Holstein itself (Adolf I → Hans Jr. of Sonderburg, last strike 1625; superseded by the 9¼-Fuß from 1622), but it survived <b>beyond Holstein as the Hamburg Bank Mark and the Lübeck Speciemark unit of account until 1875</b>. The Holstein Reichsthaler under Johann Adolf are among the earliest documented large-silver coins in the region and form the foundation for the later 9¼-Fuß tradition.
      uk: 9-Thaler-Fuß у самому Гольштейні був недовговічним (Адольф I → Hans Jr. Sonderburg, останнє карбування 1625; з 1622 витіснений 9¼-Fuß), однак <b>поза Гольштейном залишався розрахунковою одиницею як Гамбурзька Bank-Mark і Любецька Speciemark до 1875 р.</b> Гольштинські рейхсталери за Йоганна Адольфа належать до найдавніших задокументованих великосрібних монет регіону і становлять основу пізнішої традиції 9¼-Fuß.
  9_25_thaler:
    grundwerte:
      rows_patch:
        'Bank-Giral-Form: Altonaer Bankfuß (1777)':
          value:
            en: <b>27¾ Mark Banco</b> = <b>9¼ Reichsthaler</b> = 1 fine Cölln. Marck — the formal coinage
              standard of the royal-Danish <b>Altonaer Bank</b> per Altonaer Bankordnung §19; numerically
              identical with the 9¼-Thaler-Fuß Speciedaler standard, just denominated in Mark Banco rather
              than Reichsthaler (1 Mark Banco = ⅓ Reichsthaler Specie ≈ 8.427 g fine)<sup>[ref:bobzin-muenzfuesse]</sup>
            uk: <b>27¾ Mark Banco</b> = <b>9¼ Reichsthaler</b> = 1 чиста кельнська марка — формальна стопа
              королівсько-данської <b>Altonaer Bank</b> за Altonaer Bankordnung §19; числово тотожний 9¼-Thaler-Fuß-Speciedaler-стандарту,
              лише виражений у Mark Banco замість Reichsthaler (1 Mark Banco = ⅓ Reichsthaler Specie ≈ 8,427
              г чистого)<sup>[ref:bobzin-muenzfuesse]</sup>
    pdate_label:
      de: 'Geltungsbereich: 1622 → 1866 · 244 Jahre'
      en: 'Period of validity: 1622 → 1866 · 244 years'
      uk: 'Період дії: 1622 → 1866 · 244 роки'
      da: 'Gyldighedsområde: 1622 → 1866 · 244 år'
    closing_label:
      de: Zusammenfassung · 240 Jahre Geltung
      en: Summary · 240 years in force
      uk: Підсумок · 240 років чинності
      da: Sammenfatning · 240 års gyldighed
    closing:
      de: 'Der 9¼-Thaler-Fuß ist der <b>längstlebige und stabilste</b> Silberstandard in der holsteinischen Geldgeschichte. Über politische Umwälzungen hinweg (Gottorp-Vereinigung 1773, Staatsbankrott 1813, mehrere Herrscherwechsel, Kondominium 1864<sup>[ref:lex-dansk-m-ntv-sen]</sup>) blieb der Feingehalt von 25,28173 g konstant. Erst die preußische Annexion 1866 beendet seine Funktion als gesetzliches Zahlmittel. Numismatisch wirkt er biß 1907 nach, als der letzte Vereinsthaler (nachfolger-Fuß) ausser Kurs gesetzt wird.

        '
      en: The 9¼-Thaler-Fuß is the <b>longest-lived and most stable</b> silver standard in Holstein's monetary history. Through every political upheaval (the Gottorp union of 1773, the state bankruptcy of 1813, several royal successions, the condominium of 1864<sup>[ref:lex-dansk-m-ntv-sen]</sup>) the fine weight of 25.28173 g remained unchanged. Only the Prussian annexation of 1866 ended its function as legal tender. Numismatically it lived on until 1907, when the last Vereinsthaler (its successor standard) was withdrawn from circulation.
      uk: 9¼-Thaler-Fuß — <b>найдовговічніший і найстабільніший</b> срібний стандарт у грошовій історії Гольштейну. Через усі політичні переломи (обʼєднання з Готторпом 1773, державне банкрутство 1813, кілька зміни правителів, кондомініум 1864<sup>[ref:lex-dansk-m-ntv-sen]</sup>) чиста вага 25,28173 г залишалася незмінною. Лише прусська анексія 1866 поклала край його статусу законного платіжного засобу. Нумізматично він діяв до 1907 року, коли останній Vereinsthaler (стопа-наступник) було вилучено з обігу.
  kronemont:
    grundwerte:
      rows_patch:
        Tarifhistorie und Specie-Äquivalent (königliche Verordnung):
          value:
            en: '<b>1670</b> (Christian V, with «2 MARCK» = ⅔ Specie explicit on the coin): 1 Krone = <b>⅔
              Specie</b> → 15.628 × ⅔ ≈ <b>10.42 Specie nominals per Mark of fine silver</b> (bulk of the
              catalogue — stabilised final phase of the Krone-Mønt)<br>· The predecessor formula <i>Christian
              IV''s kroner</i> (1618–1652) had higher fineness and a higher tariff (1½ Specie/Krone), see
              above.<br><em>Specie nominals ≠ coins-per-Mark standard — the Specie scale measures nominal
              tariff value, not the coinage standard.</em>'
            uk: '<b>1670</b> (Кристіан V, на монеті явно «2 MARCK» = ⅔ Specie): 1 Krone = <b>⅔ Specie</b>
              → 15,628 × ⅔ ≈ <b>10,42 Specie-номіналів з марки чистого срібла</b> (основна частина каталогу
              — стабілізована фінальна фаза Krone-Mønt)<br>· Попередня формула <i>Christian IV''s kroner</i>
              (1618–1652) мала вищу пробу і вищий тариф (1½ Specie/Krone), див. вище.<br><em>Specie-номінали
              ≠ «монет з марки» — Specie-шкала вимірює номінальну вартість за тарифом, а не стопу.</em>'
    pdate_label:
      de: 'Geltungsbereich: 1644 → 1696 · ca. 52 Jahre'
      en: 'Period of validity: 1644 → 1696 · ca. 52 years'
      uk: 'Період дії: 1644 → 1696 · ca. 52 роки'
      da: 'Gyldighedsområde: 1644 → 1696 · ca. 52 år'
    hintergrund:
      de: 'Silberne Tarifmünze des dänisch-norwegischen Verbunds. Die Krone-Tarifprägung beginnt 1618 unter Christian IV. mit der <i>Corona Danica</i> (eigene Münzformel, höhere Lötigkeit und höherer Tarif pro Krone als der spätere 10½-Krone-Fuß). 1644 wird in Glückstadt während des Torstenson-Krieges (1643–1648) die <b>Hebræermønt</b> ausgegeben — eine Kriegsmünze mit deutlich unterwertigem Silbergehalt, deren Feingehalt absichtlich verschleiert wurde; eine formelle Münzfuß-Ordnung lag dieser Phase nicht zugrunde<sup>[ref:danskmoent-aag1]</sup>. Der reguläre <b>10½-Krone-Fuß</b> wird formell erst durch die Myndt-Ordning Christians V. af <b>22. marts 1671</b> festgelegt: «<i>Kronemønt eller sletdalere skal udmøntes til 10 rd. 2½ mark</i>» je Marck Feinsilber<sup>[ref:danskmoent-c5mord]</sup>. Dieselbe Ordnung verankert die Speciemønt mit 9¼ rd. je Marck als Hauptstandard; die Krone gilt ausdrücklich als untergeordnete, sekundäre Münzfuß-Stufe und erreicht zu keiner Zeit Parität mit dem Specie als Primärstandard<sup>[ref:danskmoent-c5mord]</sup>. Im Tagesumlauf verdrängte die übertarifierte Krone den Speciedaler nach Greshamschem Mechanismus: gute Specietaler wurden für Auslandszahlungen einbehalten und gelangten kaum in den inländischen Verkehr<sup>[ref:danskmoent-hedekron]</sup><sup>[ref:danskmoent-w2ref]</sup>.'
      en: 'Silver tariff coin of the Danish-Norwegian composite state. Krone tariff coinage begins in 1618 under Christian IV with the <i>Corona Danica</i> (a separate coin formula, with higher fineness and a higher per-Krone tariff than the later 10½-Krone-Fuß). In 1644, during the Torstenson War (1643–1648), the <b>Hebræermønt</b> is issued at Glückstadt — a war coinage substantially under-weight, with the fineness deliberately concealed; this phase rested on no formal coinage-standard ordinance<sup>[ref:danskmoent-aag1]</sup>. The regular <b>10½-Krone-Fuß</b> is formally established only by Christian V''s <b>Myndt-Ordning af 22. marts 1671</b>: «<i>Kronemønt eller sletdalere skal udmøntes til 10 rd. 2½ mark</i>» per mark of fine silver<sup>[ref:danskmoent-c5mord]</sup>. The same ordinance anchors Speciemønt at 9¼ rd. per mark as the principal standard; the Krone is explicitly a subordinate, secondary coinage-standard tier and never achieves parity with Specie as a primary standard<sup>[ref:danskmoent-c5mord]</sup>. In day-to-day circulation the over-tariffed Krone displaced the Speciedaler by Gresham''s mechanism: good Specie was held back for foreign payments and scarcely entered domestic exchange<sup>[ref:danskmoent-hedekron]</sup><sup>[ref:danskmoent-w2ref]</sup>.'
      uk: 'Срібна тарифна монета Королівства Данії і Норвегії. Тарифне карбування Krone розпочинається 1618 р. за Кристіана IV з <i>Corona Danica</i> (окрема монетна формула, вища проба і вищий тариф на одну Krone, ніж пізніший 10½-Krone-Fuß). У 1644 р. під час війни Торстенсона (1643–1648) у Glückstadt випускається <b>Hebræermønt</b> — воєнна монета з суттєво недоваженим вмістом срібла, пробу свідомо приховано; формальна постанова про монетну стопу в основу цієї фази не покладена<sup>[ref:danskmoent-aag1]</sup>. Регулярний <b>10½-Krone-Fuß</b> формально встановлюється лише Монетною постановою Кристіана V від <b>22 березня 1671 р.</b>: «<i>Kronemønt eller sletdalere skal udmøntes til 10 rd. 2½ mark</i>» з марки чистого срібла<sup>[ref:danskmoent-c5mord]</sup>. У тій самій постанові Speciemønt закріплено за 9¼ rd. з марки як головний стандарт; Krone виразно є підпорядкованим, вторинним рівнем монетної стопи і ніколи не досягає паритету зі Specie як первинним стандартом<sup>[ref:danskmoent-c5mord]</sup>. У повсякденному обігу надтарифікована Krone витіснила Speciedaler за механізмом Грешема: добротні Specie притримували для зовнішньоторговельних розрахунків і вони майже не потрапляли у внутрішній обіг<sup>[ref:danskmoent-hedekron]</sup><sup>[ref:danskmoent-w2ref]</sup>.'
    details:
      de: '<p>Der Anfangstarif (1 Krone = 1½ Speciedaler) bedeutete eine Aufschlag von ca. 11 % über dem Silberwert<sup>[ref:danskmoent-w2ref]</sup>; der königliche Wahlspruch <b>RFP</b> (regna firmat pietas — «Frömmigkeit stärkt die Reiche») wurde im Volksmund daraufhin als <b>R(iget) F(attes) P(enge)</b> — «Dem Reich fehlt Geld» — gelesen<sup>[ref:natmus-christian-4s-svindler-moent-fylder-400-aar]</sup>. 1625 sank der Tarif auf 1⅓ Specie; um 1670 stabilisierte ihn Christian V. auf <b>⅔ Specie</b> = 2 Marck Danske, eine Wertigkeit, die fortan auf den Münzen explizit als «<b>2 MARCK</b>» eingeprägt erscheint.</p>

        <p>Geprägt wurde an der Kopenhagener Hauptmünze und ab 1644 dominant in Glückstadt. Die Serie endet 1696. Mit der Forordning vom 15./31. Juli 1726 (Rigsdaler Courant nach Kurantmøntfod) verliert das Krone-Tarif-System seine Funktion als Hauptträger des Geldumlaufs zugunsten einer Metalläquivalenz-Logik<sup>[ref:danskmoent-hedekron]</sup>.</p>

        <p>Die Müntzfuß-Werte folgen aus der Myndt-Ordning af 22. marts 1671: 22,272 g Raugewicht × 10,5 = 233,856 g = 1 Cöllnische Marck. Der Feingehalt entspricht der kanonischen Loth-Grän-Stufe ⁴³⁄₆₄ = 10 Loth 12 Grän = .671875 (Numista führt .671 als gerundete Form). Belegexemplare: N#111284, N#111285, N#108760, N#108735.</p>

        <p>Spezialliteratur zur Glückstadter Phase: Sven Aagaard, <i>Christian V kronemønt — Glückstadt 1671–1696</i> (2022).</p>

        '
      en: '<p>The initial tariff (1 Krone = 1½ Speciedaler) implied a premium of ca. 11 % above the silver value<sup>[ref:danskmoent-w2ref]</sup>; the royal motto <b>RFP</b> (regna firmat pietas — «piety strengthens kingdoms») was therefore reread in folk parlance as <b>R(iget) F(attes) P(enge)</b> — «the realm lacks money»<sup>[ref:natmus-christian-4s-svindler-moent-fylder-400-aar]</sup>. In 1625 the tariff fell to 1⅓ Specie; around 1670 Christian V stabilised it at <b>⅔ Specie</b> = 2 Marck Danske, a parity which thereafter appears explicitly on the coins as «<b>2 MARCK</b>».</p>

        <p>Striking took place at the Copenhagen royal mint and, from 1644 onward, predominantly at Glückstadt. The series ends in 1696. With the Forordning of 15/31 July 1726 (Rigsdaler Courant on the Kurantmøntfod) the Krone tariff system loses its function as principal medium of circulation in favour of a metal-equivalence logic<sup>[ref:danskmoent-hedekron]</sup>.</p>

        <p>The coinage-standard values follow from the 1671 ordinance: 22.272 g rough × 10.5 = 233.856 g = 1 Cologne mark. The fineness matches the canonical Loth-Grän step ⁴³⁄₆₄ = 10 Loth 12 Grän = .671875 (Numista gives .671 as a rounded form). Reference specimens: N#111284, N#111285, N#108760, N#108735.</p>

        <p>Specialist literature on the Glückstadt phase: Sven Aagaard, <i>Christian V kronemønt — Glückstadt 1671–1696</i> (2022).</p>'
      uk: '<p>Початковий тариф (1 Krone = 1½ Speciedaler) означав надбавку бл. 11 % над срібною вартістю<sup>[ref:danskmoent-w2ref]</sup>; королівський девіз <b>RFP</b> (regna firmat pietas — «побожність зміцнює царства») у народі переосмислили як <b>R(iget) F(attes) P(enge)</b> — «Державі бракує грошей»<sup>[ref:natmus-christian-4s-svindler-moent-fylder-400-aar]</sup>. 1625 року тариф знижено до 1⅓ Specie; близько 1670 року Кристіан V стабілізував його на рівні <b>⅔ Specie</b> = 2 Marck Danske — паритет, який відтоді з''являється на монетах явно як «<b>2 MARCK</b>».</p>

        <p>Карбування здійснювалося на Копенгагенському королівському монетному дворі та з 1644 р. — переважно у Glückstadt. Серія завершується 1696 р. З Forordning 15/31 липня 1726 р. (Rigsdaler Courant за Kurantmøntfod) тарифна система Krone втрачає роль головного носія грошового обігу на користь логіки еквівалентності металу<sup>[ref:danskmoent-hedekron]</sup>.</p>

        <p>Значення стопи випливають з постанови 1671 р.: 22,272 г повної ваги × 10,5 = 233,856 г = 1 кельнська марка. Проба збігається з канонічною точкою Loth-Grän ⁴³⁄₆₄ = 10 Loth 12 Grän = .671875 (Numista наводить .671 як округлену форму). Зразки-приклади: N#111284, N#111285, N#108760, N#108735.</p>

        <p>Спеціальна література по ґлюкштадтській фазі: Sven Aagaard, <i>Christian V kronemønt — Glückstadt 1671–1696</i> (2022).</p>'
  kronemont_fine:
    pdate_label:
      de: 'Geltungsbereich: 1693 → 1771 · 78 Jahre'
      en: 'Period of validity: 1693 → 1771 · 78 years'
      uk: 'Період дії: 1693 → 1771 · 78 років'
      da: 'Gyldighedsområde: 1693 → 1771 · 78 år'
    hintergrund:
      de: '<b>13-Krone-Fuß («Feine Krone»)</b> — Kopenhagener Sonderstandard, etabliert durch das <b>Reskript vom 31. Dezember 1692</b> Christians V.: aus einer feinen Cöllnischen Marck (233,856 g) sollten <b>13 Specieskronen</b> ausgeprägt werden, was einem Feingewicht von ≈ 14,98 g je Krone entspricht. Geprägt ausschließlich an der Kopenhagener Hauptmünze 1693–1771; läuft chronologisch parallel zur holsteinischen Glückstadter 10½-Krone-Fuß-Phase (1644–1696) und löst diese als Hauptträger der Krone-Tarifprägung in Dänemark ab. Im Gegensatz zur Glückstadter «Groben Krone» trägt die «Feine Krone» einen leicht höheren Feingehalt (≈ 14,98 g vs. 14,964 g) und verzichtet auf die Glückstadter Tradition der Tarif-Reduktionen — der ⅔-Speciedaler-Tarif aus 1670+ wird übernommen.<br>

        <b>Hinweis:</b> derzeit liegen für diese Sektion noch keine katalogisierten Münzen im Datensatz vor; die Sektion ist als Platzhalter eingerichtet und wird bei künftiger Detail-Bearbeitung mit konkreten Belegtypen aus Hede / Bruun / IKMK København befüllt.

        '
      en: '<b>13-Krone-Fuß («Fine Crown»)</b> — a Copenhagen-specific standard established by Christian V''s <b>Reskript of 31 December 1692</b>: <b>13 Specieskronen</b> were to be struck from one fine Cologne mark (233.856 g), corresponding to a fine weight of ≈ 14.98 g per Krone. Struck exclusively at the Copenhagen royal mint 1693–1771; chronologically parallel to the Holstein-side Glückstadt 10½-Krone-Fuß phase (1644–1696), which it replaces as the principal vehicle of Krone tariff coinage in Denmark. Unlike the Glückstadt «Coarse Krone», the «Fine Crown» carries a slightly higher fine weight (≈ 14.98 g vs. 14.964 g) and dispenses with the Glückstadt tradition of tariff reductions — the ⅔-Speciedaler tariff from 1670 onward is carried forward.<br>

        <b>Note:</b> no catalogued coins for this section are present in the dataset yet; the section is set up as a placeholder and will be populated with concrete reference types from Hede / Bruun / IKMK København in future detailed work.

        '
      uk: '<b>13-Krone-Fuß («Тонка Крона»)</b> — копенгагенський особливий стандарт, встановлений <b>Рескриптом 31 грудня 1692 р.</b> Кристіана V: з однієї марки чистого срібла кельнської ваги (233,856 г) мали карбуватись <b>13 Specieskronen</b>, що дає чисту вагу ≈ 14,98 г на одну Krone. Карбувався виключно на Копенгагенському королівському монетному дворі 1693–1771; хронологічно паралельний гольштинській ґлюкштадтській фазі 10½-Krone-Fuß (1644–1696) і змінює її як головний носій тарифного карбування Krone в Данії. На відміну від ґлюкштадтської «Грубої Крони», «Тонка Крона» має дещо вищу чисту вагу (≈ 14,98 г проти 14,964 г) і відмовляється від ґлюкштадтської традиції тарифних знижень — тариф ⅔ Speciedaler з 1670+ зберігається.<br>

        <b>Примітка:</b> наразі в наборі даних немає каталогізованих монет для цієї секції; секція налаштована як заготовка і буде наповнена конкретними еталонними типами з Hede / Bruun / IKMK København у майбутній детальній роботі.

        '
  guldkrone:
    grundwerte:
      rows_patch:
        Verhältnis zu anderen Müntzfüßen:
          value:
            en: '<b>Standalone coinage-standard family:</b> the Guldkrone-Fuß does not sit under the Reichsdukatenfuß
              (.986/3.49 g, trade coin) nor under the 10½-Krone-Fuß (.672/22.272 g, silver tariff coin). Conceptually
              the Guldkrone is the <b>gold counterpart of the Krone-Mønt category</b>: same Krone name, same
              tariff logic (face value set by royal mandate above metal value), but in gold and with its own
              metric definition.<br>· <em>Not to be confused with the Goldgulden</em> (Holy Roman Empire gold
              coin under the Reichsmünzordnung of 1559, tariffed in Gulden, separate lineage).'
            uk: '<b>Самостійна родина стоп:</b> Guldkrone-Fuß не належить ані до Reichsdukatenfuß (.986/3,49
              г, торгова монета), ані до 10½-Krone-Fuß (.672/22,272 г, срібна тарифна монета). Концептуально
              Guldkrone — це <b>золотий аналог Krone-Mønt-категорії</b>: та сама назва Krone, та сама тарифна
              логіка (номінал встановлений королівським мандатом вище металевої вартості), але в золоті й
              зі своїм метричним означенням.<br>· <em>Не плутати з Goldgulden</em> (золота монета Священної
              Римської імперії за Reichsmünzordnung 1559, тариф у Gulden, окрема лінія).'
    pdate_label:
      de: 'Geltungsbereich: 1618 → 1671 · 53 Jahre'
      en: 'Period of validity: 1618 → 1671 · 53 years'
      uk: 'Період дії: 1618 → 1671 · 53 роки'
      da: 'Gyldighedsområde: 1618 → 1671 · 53 år'
    hintergrund:
      de: 'Die Guldkrone-Tarif-Logik beginnt schon 1618 parallel zur silbernen Christian-IV.-Corona-Danica: Christian IV. läßt 2-Guldkronen («dobbelt guldkrone») schlagen, die metrisch identisch zur späteren Frederik-III.-Form sind (.917 Feingehalt, 5,996 g rau / 5,496 g fein)<sup>[ref:danskmoent-c4h25]</sup>. Die Serie Hede 25 (Jahrgänge 1619, 1621, 1626, 1628, 1630, 1633, 1635, 1637, 1648) und Hede 28 (Doppelguldkrone 1628, im Esrum-Schatzfund Ingvardson & Märcher 2010 dokumentiert<sup>[ref:danskmoent-c4h25]</sup>) diente nicht der Massenkarbung sondern als Hofgeschenk und Soldzahlung. <b>Hede 1957 dokumentiert den nomenklatorischen Wechsel zwischen den beiden Regenten ausdrücklich in Fußnote (1)</b>: «<i>Betegnelsen guldkrone dækker under Frederik III den mønt, Christian IV kaldte 2 guldkrone</i>»<sup>[ref:danskmoent-f3guldkr]</sup> — was Frederik III. als «1 Guldkrone» führt, ist physisch dieselbe Münze, die Christian IV. «2 Guldkrone» nannte; Christian IVs eigene «1 Guldkrone» (Hede 26, ~3 g rau) entspricht physisch der ½ Guldkrone unter Frederik III.s Definition. Goldene <b>Tarifmünze</b> Frederik III., 1657 in Glückstadt eingeführt; goldenes Pendant der Krone-Mønt-Kategorie mit gleicher Tarif-Logik wie die silberne Krone, aber in 22-karätigem Gold und mit eigener metrischer Definition (≈ 39 Stück je Cöllnische Marck Raulegierung von 22 Karat = 5,996 g rau / 5,498 g fein je Stück). Tarif <b>1 Guldkrone = 3½ Speciedaler = 21 Mark Dansk</b>. Geprägt in Glückstadt 1657–1660 (Hede 145B, Mzm. Jacob Schwieger), Kopenhagen-Folgeprägung 1666 (Hede 44 «1 Guldkrone» und Hede 45 «2 Guldkrone», jüngere Müntzformel 5,590 g rau / 5,126 g fein)<sup>[ref:danskmoent-f3h44]</sup> und in Kopenhagen 1668 (KM# 303, bei reduziertem Tarif von 3 Speciedaler und kleinerem Raugewicht von 5,47 g — ein verwandter, aber physikalisch anderer Müntzfuß). Mit dem Tod Frederiks III. 1670 endet die Guldkrone-Tarifprägung; Christian V. setzt sie nicht fort und prägt in Glückstadt nur noch nach dem Reichsdukatenfuß. <b>Nicht zu verwechseln mit dem Goldgulden</b> (HRR-Goldmünze nach Reichsmünzordnung 1559, andere Lineage und andere Tarifeinheit).

        '
      en: 'The Guldkrone tariff logic already begins in 1618 in parallel with Christian IV''s silver Corona Danica: Christian IV strikes 2-Guldkroner («dobbelt guldkrone») that are metrically identical to the later Frederik III form (.917 fineness, 5.996 g rough / 5.496 g fine)<sup>[ref:danskmoent-c4h25]</sup>. The Hede 25 series (years 1619, 1621, 1626, 1628, 1630, 1633, 1635, 1637, 1648) and Hede 28 (double Guldkrone 1628, documented in the Esrum hoard, Ingvardson & Märcher 2010<sup>[ref:danskmoent-c4h25]</sup>) served as court gifts and mercenary pay rather than mass production. <b>Hede 1957 records the nomenclature shift between the two reigns explicitly in footnote (1)</b>: «<i>Betegnelsen guldkrone dækker under Frederik III den mønt, Christian IV kaldte 2 guldkrone</i>»<sup>[ref:danskmoent-f3guldkr]</sup> — what Frederik III calls «1 Guldkrone» is physically the same coin Christian IV called «2 Guldkrone»; Christian IV''s own «1 Guldkrone» (Hede 26, ~3 g rough) physically corresponds to ½ Guldkrone under Frederik III''s definition. A gold <b>tariff coin</b> of Frederik III, introduced at Glückstadt in 1657; the gold counterpart of the Krone-Mønt category, with the same tariff logic as the silver Krone but in 22-carat gold and with its own metric definition (≈ 39 pieces per Cologne mark of raw 22-carat alloy = 5.996 g rough / 5.498 g fine each). Tariff <b>1 Guldkrone = 3½ Speciedaler = 21 Mark Dansk</b>. Struck at Glückstadt 1657–1660 (Hede 145B, mintmaster Jacob Schwieger), Copenhagen follow-up 1666 (Hede 44 «1 Guldkrone» and Hede 45 «2 Guldkrone», younger Müntzformel 5.590 g rough / 5.126 g fine)<sup>[ref:danskmoent-f3h44]</sup> and at Copenhagen in 1668 (KM# 303, at a reduced tariff of 3 Speciedaler and a smaller rough weight of 5.47 g — a related but physically distinct standard). With the death of Frederik III in 1670 Guldkrone tariff coinage ends; Christian V does not continue it and strikes Glückstadt gold only on the Reichsdukatenfuß. <b>Not to be confused with the Goldgulden</b> (Holy Roman Empire gold coin under the Reichsmünzordnung of 1559, separate lineage and a different tariff unit).'
      uk: 'Тарифна логіка Guldkrone починається вже 1618 р. паралельно зі срібною Corona Danica Кристіана IV: Кристіан IV карбує 2-Guldkroner («dobbelt guldkrone»), метрично ідентичні пізнішій формі Frederik III (.917 проби, 5,996 г повної / 5,496 г чистого)<sup>[ref:danskmoent-c4h25]</sup>. Серія Hede 25 (роки 1619, 1621, 1626, 1628, 1630, 1633, 1635, 1637, 1648) і Hede 28 (подвійна Guldkrone 1628, задокументована у Esrum-скарбі Ingvardson & Märcher 2010<sup>[ref:danskmoent-c4h25]</sup>) слугувала придворним подарунком та платою найманцям, а не масовим карбуванням. <b>Hede 1957 явно фіксує номенклатурний зсув між двома правліннями у виносці (1)</b>: «<i>Betegnelsen guldkrone dækker under Frederik III den mønt, Christian IV kaldte 2 guldkrone</i>»<sup>[ref:danskmoent-f3guldkr]</sup> — те, що Фредерік III називає «1 Guldkrone», фізично та сама монета, яку Кристіан IV називав «2 Guldkrone»; власна «1 Guldkrone» Кристіана IV (Hede 26, ~3 г повної ваги) фізично відповідає ½ Guldkrone в означенні Фредеріка III. Золота <b>тарифна монета</b> Фредеріка III, запроваджена в Glückstadt 1657 р.; золотий аналог Krone-Mønt-категорії з тією ж тарифною логікою, що й срібна Krone, але в 22-каратному золоті й з власним метричним означенням (≈ 39 штук з кельнської марки сплаву 22 карат = 5,996 г повної ваги / 5,498 г чистого на штуку). Тариф <b>1 Guldkrone = 3½ Speciedaler = 21 Mark Dansk</b>. Карбувалася в Glückstadt 1657–1660 (Hede 145B, монетмайстер Jacob Schwieger), копенгагенський наступний випуск 1666 (Hede 44 «1 Guldkrone» і Hede 45 «2 Guldkrone», новіша монетна формула 5,590 г повної / 5,126 г чистого)<sup>[ref:danskmoent-f3h44]</sup> і в Копенгагені 1668 р. (KM# 303, зі зниженим тарифом 3 Speciedaler і меншою повною вагою 5,47 г — споріднена, але фізично окрема стопа). Зі смертю Фредеріка III 1670 р. тарифне карбування Guldkrone завершується; Кристіан V його не продовжує і в Glückstadt карбує золото лише за Reichsdukatenfuß. <b>Не плутати з Goldgulden</b> (золота монета Священної Римської імперії за Reichsmünzordnung 1559, окрема лінія й інша тарифна одиниця).'
    closing_label:
      de: Zusammenfassung · 53 Jahre Krone-Mønt-Goldparallele (Christian IV 1618-1648 + Frederik III 1655-1668)
      en: Summary · 53 years of the Krone-Mønt gold parallel (Christian IV 1618-1648 + Frederik III 1655-1668)
      uk: Підсумок · 53 роки золотої паралелі Krone-Mønt (Кристіан IV 1618-1648 + Фредерік III 1655-1668)
      da: Sammenfatning · 53 år med guldparallellen til kronemønten (Christian 4. 1618-1648 + Frederik 3. 1655-1668)
    closing:
      de: 'Der Guldkrone-Fuß ist die <b>goldene Parallele der Krone-Mønt-Lineage über zwei Regenten</b>: er beginnt 1618 unter Christian IV. als 2-Guldkrone-Vorgängerphase parallel zur silbernen Corona Danica — Hofgeschenk- und Soldzahlungs-Karbung, Hede 25/28-Serie biß 1648<sup>[ref:danskmoent-c4h25]</sup> — und mündet 1655 in Frederik III.s formale Massenkarbung der 1-Guldkrone (Hede 145B-Glückstadt-Hauptphase 1657–1660; Kopenhagener Folgeprägung 1666 Hede 44/45 und 1668 KM-303 mit reduziertem Tarif)<sup>[ref:danskmoent-f3h44]</sup><sup>[ref:danskmoent-f3guldkr]</sup>. Mit der Commerce-Collegium-Empfehlung vom 14. Februar 1671 endet die reguläre Karbung. Christian V. setzt die Linie nicht fort; die Goldprägung läuft danach nur noch im Reichsdukatenfuß.'
      en: 'The Guldkrone-Fuß is the <b>gold parallel of the Krone-Mønt lineage spanning two rulers</b>: it begins in 1618 under Christian IV as a 2-Guldkrone predecessor phase running alongside the silver Corona Danica — court-gift and mercenary-pay coinage, the Hede 25/28 series through 1648<sup>[ref:danskmoent-c4h25]</sup> — and flows in 1655 into Frederik III''s formal mass coinage of the 1-Guldkrone (Hede 145B Glückstadt main phase 1657–1660; Copenhagen follow-up issues 1666 Hede 44/45 and 1668 KM-303 at a reduced tariff)<sup>[ref:danskmoent-f3h44]</sup><sup>[ref:danskmoent-f3guldkr]</sup>. The Commerce Collegium recommendation of 14 February 1671 ends regular minting. Christian V does not continue the line; gold coinage thereafter runs only on the Reichsdukatenfuß.'
      uk: 'Guldkrone-Fuß — це <b>золота паралель лінії Krone-Mønt через двох правителів</b>: вона починається 1618 р. за Кристіана IV як передфаза 2-Guldkrone паралельно зі срібною Corona Danica — карбування придворного подарунку та плати найманцям, серія Hede 25/28 до 1648 р.<sup>[ref:danskmoent-c4h25]</sup> — і 1655 р. впадає у формальне масове карбування Frederik III 1-Guldkrone (головна фаза Hede 145B Glückstadt 1657–1660; копенгагенські наступні випуски 1666 Hede 44/45 та 1668 KM-303 зі зниженим тарифом)<sup>[ref:danskmoent-f3h44]</sup><sup>[ref:danskmoent-f3guldkr]</sup>. Рекомендація Commerce Collegium від 14 лютого 1671 завершує регулярне карбування. Кристіан V лінію не продовжує; золоте карбування далі ведеться лише за Reichsdukatenfuß.'
  11_333_thaler:
    pdate_label:
      de: 'Geltungsbereich: 1726 → 1813 · ca. 87 Jahre'
      en: 'Period of validity: 1726 → 1813 · ca. 87 years'
      uk: 'Період дії: 1726 → 1813 · ca. 87 років'
      da: 'Gyldighedsområde: 1726 → 1813 · ca. 87 år'
    hintergrund:
      de: '<b>11⅓-Thaler-Fuß · Rigsdaler Courant</b> — etabliert durch die <b>Forordning vom 15./31. Juli 1726</b> Friedrichs IV. als <i>Kurantmøntfod</i> des dänisch-norwegischen Verbundes. Aus einer feinen Cöllnischen Marck (233,856 g) wurden 11⅓ Rigsdaler Courant ausgeprägt — Feingewicht ≈ 20,63 g pro Daler. <b>Hauptalltagswährung des Gesamtstaats</b> während fast des gesamten 18. Jahrhunderts; läuft im Königreich Dänemark/Norwegen biß zum Staatsbankrott am 5. Januar 1813 (Forordning Friedrichs VI.), als der Rigsbankdaler im 18½-Thaler-Fuß den Kurantfuß ablöst. <b>In Holstein</b> tritt der Kurant ab der Schimmelmann-Reform 1788 (Speciesbank) hinter den Speciedaler zurück, bleibt aber in Kraft und wird in Altona weiter geprägt. Altbestände aus 1726–1813 blieben ab 1813 noch jahrzehntelang als Scheidemünzen im Umlauf, biß sie mit der Krone-Reform 1875 (Skandinavische Münzunion) endgültig eingezogen wurden.

        '
      en: '<b>11⅓-Thaler-Fuß · Rigsdaler Courant</b> — established by Friedrich IV''s <b>Forordning of 15/31 July 1726</b> as the <i>Kurantmøntfod</i> of the Danish-Norwegian composite state. From one fine Cologne mark (233.856 g) 11⅓ Rigsdaler Courant were struck — fine weight ≈ 20.63 g per daler. <b>Main everyday currency of the composite state</b> through most of the 18th century; in the Kingdom of Denmark/Norway it remained in force until the state bankruptcy of 5 January 1813 (Forordning of Friedrich VI), when the Rigsbankdaler on the 18½-Thaler-Fuß replaced the Kurantfuß. <b>In Holstein</b>, by contrast, the kurant recedes behind the Speciedaler from the Schimmelmann reform of 1788 (Speciesbank) onward, but it remains in force and is still struck at Altona. Old stocks from 1726–1813 remained in circulation as petty coinage for decades after 1813, until they were finally withdrawn by the Krone reform of 1875 (Scandinavian Monetary Union).

        '
      uk: '<b>11⅓-Thaler-Fuß · Rigsdaler Courant</b> — встановлений <b>Forordning 15/31 липня 1726</b> Фредеріка IV як <i>Kurantmøntfod</i> Королівства Данії і Норвегії. З однієї марки чистого срібла кельнської ваги (233,856 г) карбувалося 11⅓ Rigsdaler Courant — чиста вага ≈ 20,63 г на одного даллера. <b>Основна повсякденна валюта цілісної держави</b> впродовж майже всього XVIII ст.; у Королівстві Данії/Норвегії дія тривала до державного банкрутства 5 січня 1813 р. (Forordning Фредеріка VI), коли Rigsbankdaler у 18½-Thaler-Fuß замістив Kurantfuß. <b>У Гольштейні</b> ж kurant від реформи Шіммельмана 1788 р. (Speciesbank) відступає за Speciedaler, але лишається чинним і далі карбується в Альтоні. Старі запаси 1726–1813 ще десятиліттями залишалися в обігу як розмінна монета після 1813 — аж до Krone-реформи 1875 р. (Скандинавська монетна унія), коли їх остаточно вилучили з обігу.

        '
  18_5_thaler:
    pdate_label:
      de: 'Geltungsbereich: 1813 → 1875 · 62 Jahre'
      en: 'Period of validity: 1813 → 1875 · 62 years'
      uk: 'Період дії: 1813 → 1875 · 62 роки'
      da: 'Gyldighedsområde: 1813 → 1875 · 62 år'
    hintergrund:
      de: '<b>18½-Thaler-Fuß · Rigsbankdaler / Rigsdaler Rigsmønt</b> — Notreform Friedrichs VI. nach dem dänischen Staatsbankrott. Die <b>Forordning vom 5. Januar 1813</b> setzt den neuen Hauptstandard auf 18½ Rigsbankdaler aus einer feinen Cöllnischen Marck (233,856 g) — Feingewicht ≈ 12,64 g pro Daler. <b>§10 der Forordning</b> verankert ausdrücklich <b>1 Speciedaler = 2 Rigsbankdaler</b>, also eine glatte ½-Anteil-Anbindung an den 9¼-Thaler-Fuß. 1854 wird die Münze ohne Fußänderung in <b>Rigsdaler Rigsmønt</b> umbenannt; 1873–1875 ersetzt die <b>Krone</b> der Skandinavischen Münzunion (Schweden, Norwegen, Dänemark) den Rigsdaler. Hauptträger des dänischen Geldumlaufs in der zweiten Hälfte des 19. Jahrhunderts. In Schleswig-Holstein parallel zum 9¼-Thaler-Fuß als kleinerer Realsubstandard im Einsatz biß zur preußischen Annexion 24. August 1866.<br>

        <b>Hinweis:</b> derzeit liegen für diese Sektion noch keine katalogisierten Münzen im Datensatz vor; die Sektion ist als Platzhalter eingerichtet und wird bei künftiger Detail-Bearbeitung mit Belegtypen aus Hede / Sieg / IKMK København befüllt.

        '
      en: '<b>18½-Thaler-Fuß · Rigsbankdaler / Rigsdaler Rigsmønt</b> — Friedrich VI''s emergency reform after the Danish state bankruptcy. The <b>Forordning of 5 January 1813</b> sets the new principal standard at 18½ Rigsbankdaler per fine Cologne mark (233.856 g) — fine weight ≈ 12.64 g per daler. <b>§10 of the Forordning</b> explicitly anchors <b>1 Speciedaler = 2 Rigsbankdaler</b>, a clean ½-share link to the 9¼-Thaler-Fuß. In 1854 the coin is renamed <b>Rigsdaler Rigsmønt</b> without any change of standard; in 1873–1875 the <b>Krone</b> of the Scandinavian Monetary Union (Sweden, Norway, Denmark) supersedes the Rigsdaler. The main carrier of the Danish money supply in the second half of the 19th century. In Schleswig-Holstein it ran in parallel with the 9¼-Thaler-Fuß as a lesser actual sub-standard until the Prussian annexation of 24 August 1866.<br>

        <b>Note:</b> no catalogued coins for this section are present in the dataset yet; the section is set up as a placeholder and will be populated with reference types from Hede / Sieg / IKMK København in future detailed work.

        '
      uk: '<b>18½-Thaler-Fuß · Rigsbankdaler / Rigsdaler Rigsmønt</b> — надзвичайна реформа Фредеріка VI після данського державного банкрутства. <b>Forordning 5 січня 1813</b> встановлює новий головний стандарт на 18½ Rigsbankdaler з однієї марки чистого срібла кельнської ваги (233,856 г) — чиста вага ≈ 12,64 г на даллер. <b>§10 Forordning</b> явно закріплює <b>1 Speciedaler = 2 Rigsbankdaler</b>, тобто чисту привʼязку ½-частки до 9¼-Thaler-Fuß. 1854 р. монета перейменовується на <b>Rigsdaler Rigsmønt</b> без зміни стопи; 1873–1875 рр. <b>Krone</b> Скандинавської монетної унії (Швеція, Норвегія, Данія) витісняє Rigsdaler. Головний носій данського грошового обігу в другій половині XIX ст. У Шлезвіг-Гольштейні діяв паралельно з 9¼-Thaler-Fuß як менший фактичний підстандарт до прусської анексії 24 серпня 1866 р.<br>

        <b>Примітка:</b> наразі в наборі даних немає каталогізованих монет для цієї секції; секція налаштована як заготовка і буде наповнена еталонними типами з Hede / Sieg / IKMK København у майбутній детальній роботі.

        '
  kronefod:
    pdate_label:
      de: 'Geltungsbereich: 1873 → 1914 · 41 Jahre'
      en: 'Period of validity: 1873 → 1914 · 41 years'
      uk: 'Період дії: 1873 → 1914 · 41 рік'
      da: 'Gyldighedsområde: 1873 → 1914 · 41 år'
    closing_label:
      de: Zusammenfassung · 41 Jahre Krone-fod
      en: Summary · 41 years of the Krone-fod
      uk: Підсумок · 41 рік Krone-fod
      da: Sammenfatning · 41 år med Krone-fod
    closing:
      de: 'Der dänische Krone-fod ist <b>der kürzlebigste reguläre Hauptstandard</b> in der hier behandelten Geldgeschichte — knapp vier Jahrzehnte funktionierender Goldumlauf mit voll integrierter Silber- und Bronze-Subsidiarstruktur. Strukturmerkmal: die abgestufte Feingehalts-Leiter <b>.900 Au → .800 Ag → .600 / .400 Ag → Bronze</b> ist die langlebigste Innovation der Møntloven — nach der Krone-Goldsuspendierung 1914 prägt Dänemark die Subsidiarstückelungen kontinuierlich weiter (die 25 øre wechselt 1920–1922 von Silber auf Cupro-Nickel, die 10 øre folgt; die Bronze-øre werden 1973 außer Umlauf gesetzt).<sup>[ref:en-8493]</sup> Die Skandinavische Müntzunion blieb wirtschaftlich erfolgreich, biß der Kriegsausbruch 1914 die einheitliche Goldparität faktisch beendete; danach driften die drei nordischen Kroner auseinander, was 1924 zur formellen Auflösung der Münzunion führt.<sup>[ref:wikipedia-da-den-skandinaviske-m-ntunion]</sup> Dänemark kehrt 1927 mit demselben Goldgehalt wie 1913 zum Goldstandard zurück, gibt ihn 1931 endgültig auf.<sup>[ref:econstor-386525536]</sup>

        '
      en: 'The Danish Krone-fod is <b>the shortest-lived regular principal standard</b> in the monetary history covered here — barely four decades of working gold circulation with a fully integrated silver and bronze subsidiary structure. Structural feature: the graded fineness ladder <b>.900 Au → .800 Ag → .600 / .400 Ag → bronze</b> is the longest-lived innovation of the Møntloven — after the 1914 gold suspension, Denmark continues to mint the subsidiary denominations (the 25 øre transitions from silver to cupro-nickel in 1920–1922, the 10 øre follows; the bronze øre are withdrawn from circulation in 1973).<sup>[ref:en-8493]</sup> The Scandinavian Monetary Union remained economically successful until the outbreak of war in 1914 effectively ended the unified gold parity; thereafter the three Nordic kroner diverged, leading in 1924 to the formal dissolution of the monetary union.<sup>[ref:wikipedia-da-den-skandinaviske-m-ntunion]</sup> Denmark returned to the gold standard in 1927 at the same gold content as in 1913, and abandoned it permanently in 1931.<sup>[ref:econstor-386525536]</sup>'
      uk: 'Данський Krone-fod — <b>найкоротший регулярний основний стандарт</b> в усій розглянутій тут грошовій історії: ледь чотири десятиліття справжнього золотого обігу з повністю інтегрованою срібно-бронзовою субсидіарною структурою. Структурна риса: ступенева сходова шкала проб <b>.900 Au → .800 Ag → .600 / .400 Ag → бронза</b> — найдовговічніша інновація Møntloven; після призупинення золотого Krone 1914 р. Данія продовжує карбувати субсидіарні номінали (25 øre 1920–1922 рр. переходить зі срібла на купроникель, 10 øre йде вслід; бронзові øre виведено з обігу 1973 р.).<sup>[ref:en-8493]</sup> Скандинавська монетна унія залишалася економічно успішною до 1914, коли початок війни де-факто завершив єдину золоту паритетність; потім три північні крони розходяться, що 1924 р. призводить до формального розпуску монетної унії.<sup>[ref:wikipedia-da-den-skandinaviske-m-ntunion]</sup> Данія повертається до золотого стандарту 1927 р. з тим самим золотим вмістом, що й 1913, остаточно полишає його 1931.<sup>[ref:econstor-386525536]</sup>'
  seed_unsorted:
