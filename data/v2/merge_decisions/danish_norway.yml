  # records of the same nominal publish ONLY a Krause number. Their register
  # intersection is empty, so a confident verdict there rests on
  # metal + nominal + ruler + year alone — the over-merge signature. Measured
  # against HEAD: four of the seven pages land correctly on a shared register
  # (nc5h1 on Hede 1; nc5h2 on Hede 2 + Schou 1; nc5h6 and nc5h7 on their own
  # approved merges) and nc5h64 / nc5h66 stay single. The two fronts below are
