# §CU year-mute — UNDATED Bruun specimens (year_verified=False) whose broad
# attribution range «ND (1670-99)» = 1670-1699 would swallow the dated discrete
# years of the SAME type contributed by NumisMaster / Numista / ucoin / KMM.
# Demote so the dated attestations drive the displayed minting years; the Bruun
# specimen's range is kept only as last-resort (no dated peer). Surfaced by the
# 2026-06-17 coordinated re-flow curation-loss gate (ND-swallow class).
year_demote:
  - member_id: dk-galster-hg-gej
    reason: |
      Galster (danskmoent norge/hansGej) gives Hans's full reign 1481-1513 for the
      Norway Bergen Goldgulden (unified-dk-numista-444264), not the coin's strike
      years — Numista N#444264 dates it 1505-1510. Demote the reign-span so the
      1505-1510 dating drives the displayed year (year_verified stays false — a
      scholarly estimate, not an attested strike date).
  - member_id: dk-bruun-10497
    reason: |
      Bruun I lot 1230, 2 Ducats Christian V, ND (1670-99). Dated peers
      NumisMaster 1679 / Numista 1675 / Numista 1673 drive the years.
  - member_id: dk-bruun-10501
    reason: |
      Bruun III lot 12121, 1 Ducat Christian V, ND (1670-99). Dated peers
      NumisMaster 1673-1674 / Numista 1673 / ucoin 1673 / KMM 1673.
  - member_id: dk-bruun-10509
    reason: |
      Bruun I lot 1231, ½ Ducat Christian V, ND (1670-99). Dated peers
      Numista 1674 / ucoin 1674.
  - member_id: dk-hede-nc5h6
    reason: |
      Hede nc5h6 records the ½ Dukat as U.aar, so the seed carries Christian V's
      full Norwegian reign 1670-1699 (year_verified false), not strike years.
      Demote so the dated peers (Numista 1674 / ucoin 1674) keep driving the
      displayed year for the merged group.
  - member_id: denmark-numismaster-110793
    reason: |
      NumisMaster's KM# 103 record (MC_110793, folded 2026-09-10) carries year
      1668 (year_verified false) — but KM# 103 is a Christian V type and 1668
      falls in Frederik III's reign (Christian V acceded 1670), so the NumisMaster
      year is internally contradictory, not a strike date. Demote so the dated
      peers (Numista 1674 / ucoin 1674) keep driving the displayed year.
  - member_id: dk-hede-nc5h7
    reason: |
      Hede nc5h7 records the 1 Dukat as u.aar, so the seed carries the
      1670-1699 reign window (year_verified false). Demote so Numista's dated
      1674 drives the displayed year for the merged group.
