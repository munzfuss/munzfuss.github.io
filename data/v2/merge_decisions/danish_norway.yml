  # === Christiania 3-Dukat family — complete KM-to-Hede partition, 2026-08-04 ===
  #
  # This family is the zero-shared-register defect at full strength. NumisMaster
  # and ucoin publish a Krause number and NOTHING else; the danskmoent Hede
  # pages and the two KMM records publish hede/schou and NO Krause number. Every
  # one of these coins is "3 Dukat, Christian V, Christiania, 1673". So a KM-only
  # record and a no-KM record share no register at all, and the matcher decides
  # on metal + nominal + ruler + year — which is to say, at random within the
  # family. The result was a systematic off-by-one that put KM 124 / 125 / 126
  # each one class early.
  #
  # A first attempt (same day) blocked each KM-only record only from the class it
  # was WRONGLY in. That failed and had to be reverted: freed from nc5h10,
  # MC_110811 simply auto-matched nc5h12 instead, and force_union then merged the
  # two whole classes. Blocking the observed wrong edge is not enough — the
  # constraint has to be total, because the matcher has no signal to prefer any
  # particular wrong partner.
  #
  # Hence the exhaustive partition below: every KM-only record is forbidden from
  # every no-KM record that is not in its own class. The classes are
  #
  #   KM 111 = Hede Norge 1    (paired by Numista 117111)
  #   KM 124 = Hede Norge 5    (paired by Numista 117116)          bust + lion
  #   KM 125 = Hede Norge 10   (paired by Numista 422698)          rider left + lion
