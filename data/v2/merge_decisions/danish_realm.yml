      VISUALLY against the coin images. ONE coin: Frederik V's 1 Dukat 1747,
      Copenhagen, Hede 9 = KM 564.

      This SUPERSEDES three no_merges from 2026-05-31 (de3b86d) that held
      dk-hede-f5h9 apart from each of the KM-564 sources. Those three carried no
      evidence: the verdict that decision records is only "KM 564 i Hede 11AB
      tse rizni monety", and its own type list gives "(4) Hede 9 / Sieg 30" with
      no KM — the question of which KM Hede 9 carries was never put. The other
      nine no_merges of the cluster were right and stay in force.

      The section 9.4 graph shows NO shared base index: the Hede page publishes
      hede/schou/sieg and no KM, the three commercial sources publish KM and no
      Hede, so their register intersection is empty. This is therefore a CURATOR
      IDENTIFICATION under section 8a, not a mechanical base match, and it was
      settled by looking at the coins.

      What the identification rests on. danskmoent (Hede) and NumisMaster
      (Krause) described these coins independently, and the three 1747 types
      line up on BOTH faces with no cross-matching:

        Hede 9    "portraet" (bust)      / "vaabenskjold"
                  <-> KM 564 "Bust right" / "Crowned oval arms, date in exergue"
        Hede 11AB "portraet, hel figur"  / "vaabenskjold"
                  <-> KM 565 "Crowned, robed King standing" / "Crowned draped oval arms"
        Hede 13   "portraet, hel figur"  / "Christiansborg fort paa Guldkysten"
                  <-> KM 566 "Crowned, robed King standing" / "Fortress of Christiansborg in Guinea"

      Hede 9 is the only one of the three struck with a bust rather than the
      full standing figure, and Hede 13 the only one with the fortress reverse,
      so no two pairs can be swapped. One node of the trio is fixed by a source
      rather than by inference: Numista N#147904 (KM 566) cites "Hede 13" in its
      own references. Metrics agree throughout at 3.49 g and .979. Ordering is a
      weaker corroborating signal: Hede 9/11/13 <-> KM 564/565/566 <-> Sieg
      30/32/34 <-> Fr 266/271/273.

      The merge gives the class its KM 564 + Fr 266 alongside Hede 9 / Schou 10
      / Sieg 30, four weight and fineness readings instead of one (section 9a),
      and a verified mint — dk-hede-f5h9 is the only member with
      mint_verified: true, so Kopenhagen reaches the output under the section 4
      tiering while the three KM sources carry no mint at all. It also lifts the
      coin out of seed_unsorted. No index is lost.

      Per D48 all four members of the intended class are named explicitly — the
      Hede seed shares no register with the KM group, so a minimal pair would
      leave the auto no_merge in place and expel the rest.

