      (c4hede.htm) carries the whole reign window 1588-1648 as the seed's
      year, because the index page dates types by reign, not by strike year.
      The dated specimen members attest 1646-1648 (Bruun 5843 «1646-1648»,
      NumisMaster 65679 + KMM 137187 «1647»). Demote the reign-window loose
      span so it cannot swallow the attested 1646-1648 — otherwise year_first
      leaks to 1588 (reign floor), which both mis-sorts the row to the head of
      reichsdukatenfuss Phase II and contradicts the 1646-1648 label.
      Last-resort only. Curator (Serhii) 2026-08-14.
