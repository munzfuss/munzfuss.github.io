year_demote:
  - member_id: dk-numista-152728
    reason: |
      Curator 2026-11-03: Numista 152728 (Gurre gros, Galster 16) gives
      1424-1430 with no stated basis. Galster (danskmoent epomg16), Lindahl
      1955 p. 82 and Galster 1973 p. 23 date the gros to the 1430s; Hauberg
      1886 p. 178: Lund and Gurre gros are one type, start of minting not
      recorded, current in 1439; Jensen 2003 (danskmoent artikler/jsjgurre):
      struck at Gurre in the 1430s for under ten years; Denar til daler 2018
      p. 395: «formentlig i
      1430'erne – måske i midten». Numista's own Lund twin (287318) is
      1430-1439. Demoted so it does not widen the class; shown as (*) via
      year_mark.
  - member_id: kmk-274928
    reason: |
      Curator 2026-10-22: KMM FP 9667.10 (authority «Christian 3», Galster 42)
      gives 1515-1522; the Klipping coinage began in April 1518 (Eriksson 2017,
      s. 11, after Galster 1936; danskmoent 18pennin.htm «1518-1522»). Demoted
      so it does not widen the Galster 42 class; shown as (*) via year_mark.
  - member_id: kmk-497177
    reason: 'KMM FP 10697.10 (Galster 22, Rigsrådet hvid) dates it 1481; danskmoent rigsraad.htm lists the hvid as undated (U.år) under «Rigsrådet 1481-83», no single year. Curator 2026-10-20: the KMM year is suspect (year_mark), kept out of the year union so the class shows the Galster window.'
  - member_id: kmk-714448
    reason: 'KMM FP 12405.1 (Galster 29, Hans Skilling Malmø) dates it 1512-1515; Bruun lot (dk-bruun-3837) and Galster (danskmoent hg-29) give 1512, and Hans died Feb 1513. Curator 2026-10-15: the KMM range is erroneous (year_mark), kept out of the year union so the class shows 1512.'
  - member_id: dk-hede-c5h57
    reason: 'Hede 57 ducat (KM 455, pyramid and view of Copenhagen): danskmoent gives the coin only the Christian V reign window 1670-1699 and the seed already carries year_verified false, while all three other members of the class date it to 1699 — dk-bruun-7244 (lot IV/17108, p. 72), ngc-1050367 and denmark-numismaster-65804. The union was therefore widening a precisely dated coin back to a 30-year reign span. Demote so the class takes the attested 1699. Curator 2026-08-17.'
