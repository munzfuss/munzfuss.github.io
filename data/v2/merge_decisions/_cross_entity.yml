      - dk-hede-f3h39               # home: danish_realm   (2 Dukat, Hede 39, Sieg 139, Schou 4-6/6a)
      - ngc-1105140                   # home: danish_norway  (NGC, km A119, 1670-1670)
    excludes:
      - dk-tid-145589               # different coin — ucoin km-A119 (kept as sourced); split via danish_norway no_merges
      - dk-numista-421408           # 1 Portugaløser — shares only bare Hede 39; split via danish_norway no_merges
    reason: |
      One coin — Frederik III 2-Dukat, Hede 39, minted at Christiania (Norway),
