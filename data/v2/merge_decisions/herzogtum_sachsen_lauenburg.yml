    reason: 'Frederik VI, ⅔ Thaler 1830 for the Duchy of Lauenburg, struck at Altona (KM 25; Hede Lauenborg 1, Schou 3, Sieg 44). danskmoent «Frederik 6., 2/3 Thaler 1830, Lauenborg» (lauenbor.htm): «Mønterne er præget i Altona efter Leipziger møntfoden»; the Hede overview f6hede.htm lists it in its own «Lauenborg» section as L1. Numista 31393 (issuer «Duchy of Saxe-Lauenburg», «Hede# 1») joins Bruun Part II lot 13261 («DENMARK. Lauenburg. 2/3 Taler … KM-25; Hede-1») and ucoin; not on the Denmark page, the standard is not Danish. Curator (Serhii) 2026-11-07. Hede Lauenborg 1 itself (dk-hede-f6hl1, lauenbor.htm: 17,320 g, .750) joins 2026-11-10.'
