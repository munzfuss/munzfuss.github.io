# Removals that are deliberate, recorded, and otherwise indistinguishable from
# data falling on the floor.
#
# Read by scripts/maintenance/verify_reflow.py. Hand-written, unlike its two
# siblings — _retracted_refs.yml is rebuilt by heal_hede_retracted_refs.py and
# _source_sanity_retractions.yml by record_source_sanity_retractions.py, so an
# entry added to either would be wiped on the next run.
#
# WHY IT EXISTS. Same reasoning as those two, one shape further out. The gate
# blocks a coin that vanished and a scalar field that emptied, because both are
# what real loss looks like. Two legitimate operations produce exactly that
# signature and leave no other trace:
#
#   * §9a intra-sub-variant thinning drops a redundant museum specimen. When
#     the thinned seed was the only backing for a final, the final goes with
#     it — a COIN GONE the gate cannot tell from a coin that was lost.
#   * A parser fix stops emitting a value the finals had already ACCUMULATED.
#     `_collect_mints` unions the final's own stored value back in as a member,
#     so no re-flow can clear it; only a manual removal can, and a manual
#     removal reads as FIELD EMPTIED.
#
# An entry excuses ONE removal: one seed for a thinning, one field of one seed
# for a field removal. It excuses nothing else — another field on the same
# coin, another coin in the same operation, a citation, all still block.
