    _curation_holds:
      ruler: 'Curator (Serhii) 2026-10-31: danskmoent c3h24 prints «Henført til Christian 1. (Sømod), Frederik 1. (Schou) og Christian 3. (Hede)» - three attributions in the literature, all kept as alternatives
        with (?); the page itself and Sieg 42 follow Sømod (Christian I). The builder writes the page ruler, Christian III.'
      ruler_verified:
      uncertainty: 'Ruler alternatives as printed on the page (see ruler); year span covers all three reigns.'
      year_label: 'Curator (Serhii) 2026-10-31: undated (u.år); span from Christian I''s accession to Christian III''s death (lib.ruler_reigns 1448-1559) so that every attribution is covered.'
      year_first:
      year_last:
      year_verified:
      note: 'Curator (Serhii) 2026-10-31: «Всі позиції дослідників стосовно датування додай в Note» — Sømod, Schou, Hede (danskmoent c3h24) and Nöbbe 1938 (mint mark, Flensborg 1546), each cited.'
    note:
      de: 'Die Zuschreibung ist in der Literatur strittig: Sømod weist die Münze Christian I. zu, Schou Frederik I., Hede Christian III.<sup>[ref:danskmoent-c3h24-henfoert]</sup>. Sømods Argument: Der geteilte
        Schild verweist auf Holstein und Oldenburg, das mütterliche und väterliche Wappen Christians I.; Sieg 42.1–42.2 und danskmoent schließen sich dem an<sup>[ref:danskmoent-c3h24-soemod]</sup>. Nöbbe
        verbindet das Münzzeichen im Strahlenrand, den Schürhaken («Glødehage»), mit Reinold Junge in Flensborg und datiert die Blafferte mit diesem Zeichen auf 1546<sup>[ref:noebbe-flensborg-gloedehage-1546]</sup>;
        die Stücke ohne Zeichen stellt er zur selben Gruppe<sup>[ref:noebbe-flensborg-uden-maerke]</sup>. Nach Nöbbe wurde die Münzstätte unter Frederik I. in der Umschrift noch ausgeschrieben; das Zeichen
        des Münzmeisters an Stelle des Namens erscheint erst unter Christian III.<sup>[ref:noebbe-frederik-i-moentsted]</sup>.'
      en: 'The attribution is disputed in the literature: Sømod assigns the coin to Christian I, Schou to Frederik I, Hede to Christian III<sup>[ref:danskmoent-c3h24-henfoert]</sup>. Sømod’s argument: the
        divided shield refers to Holstein and Oldenburg, the maternal and paternal arms of Christian I; Sieg 42.1–42.2 and danskmoent follow this view<sup>[ref:danskmoent-c3h24-soemod]</sup>. Nöbbe connects
        the mint mark in the rayed border, a poker («Glødehage»), with Reinold Junge in Flensborg and dates the Blafferts bearing it to 1546<sup>[ref:noebbe-flensborg-gloedehage-1546]</sup>; he places the
        pieces without a mark in the same group<sup>[ref:noebbe-flensborg-uden-maerke]</sup>. According to Nöbbe, under Frederik I the mint was still named in full in the legend; the mint master’s mark
        in place of the name appears only under Christian III<sup>[ref:noebbe-frederik-i-moentsted]</sup>.'
      uk: 'Атрибуція в літературі розходиться: Sømod відносить монету до Christian I, Schou — до Frederik I, Hede — до Christian III<sup>[ref:danskmoent-c3h24-henfoert]</sup>. Аргумент Sømod: поділений
        щит указує на Гольштейн і Ольденбург, материнський і батьківський герби Christian I; Sieg 42.1–42.2 і danskmoent поділяють цю думку<sup>[ref:danskmoent-c3h24-soemod]</sup>. Nöbbe пов’язує монетний
        знак у променевому обідку, кочергу («Glødehage»), з Reinold Junge у Flensborg і датує блаферти з цим знаком 1546 р.<sup>[ref:noebbe-flensborg-gloedehage-1546]</sup>; екземпляри без знака він відносить
        до тієї самої групи<sup>[ref:noebbe-flensborg-uden-maerke]</sup>. За Nöbbe, за Frederik I монетний двір ще називали в легенді повністю, а знак монетного майстра замість назви з’являється лише за
        Christian III<sup>[ref:noebbe-frederik-i-moentsted]</sup>.'
      da: 'Tilskrivningen er omstridt i litteraturen: Sømod henfører mønten til Christian 1., Schou til Frederik 1., Hede til Christian 3.<sup>[ref:danskmoent-c3h24-henfoert]</sup>. Sømods argument: det
        delte skjold henviser til Holsten og Oldenburg, Christian 1.s mødrene og fædrene våben; Sieg 42.1–42.2 og danskmoent følger denne opfattelse<sup>[ref:danskmoent-c3h24-soemod]</sup>. Nöbbe forbinder
        møntmærket i stråleranden, en glødehage, med Reinold Junge i Flensborg og daterer blaffertene med dette mærke til 1546<sup>[ref:noebbe-flensborg-gloedehage-1546]</sup>; stykkerne uden mærke henfører
        han til samme gruppe<sup>[ref:noebbe-flensborg-uden-maerke]</sup>. Ifølge Nöbbe blev møntstedet under Frederik 1. endnu nævnt fuldt ud i omskriften; møntmesterens mærke i stedet for navnet kommer
        først under Christian 3.<sup>[ref:noebbe-frederik-i-moentsted]</sup>.'
