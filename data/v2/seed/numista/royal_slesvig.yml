        unified-dk-bruun-14770; leaving mint_verified true would keep the rejected Schleswig reading in the merged mint (→ joint [danish_realm, royal_slesvig] → wrong home). Value kept verbatim as Numista''s
        record; only the verified flag is demoted so _collect_mints Tier-1 (Bruun/Galster Roskilde) wins.'
