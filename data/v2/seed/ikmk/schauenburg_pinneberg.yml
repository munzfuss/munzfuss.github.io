      de: Weinmeister (1908) führt diese Münze als Fürstengroschen. Von dieser Münze im Wert von 12 meißnischen Pfennigen gingen 21 auf den Gulden, es handelt sich also um einen 1/21 Gulden. Auf der 
        vorliegenden Münze steht jedoch explizit, dass 21 auf den Taler gehen. Also handelt es sich hier um ein 1/21 Taler-Stück und nicht um einen Fürstengroschen, wie Weinmeister schreibt.- Trotz 
        fehlender Jahreszahl ist diese Münze Weinmeister zufolge [Weinmeister (1908) 462] 1621 geprägt worden. Aufgrund des fehlenden Münzmeisterzeichens ist eine eindeutige Zuordnung der Münzstätte 
