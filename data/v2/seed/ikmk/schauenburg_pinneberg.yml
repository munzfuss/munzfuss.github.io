    _source_note:
      de: Die Münzmeisterstelle für die beiden von den Grafen von Holstein-Schauenburg betriebenen Münzstätten wurde seit 1609 in Personalunion ausgeübt, da jene die Münzstätte in der Grafschaft 
        Schauenburg (zunächst Oldendorf, 1618 Rinteln, 1620 wieder Oldendorf) als der Altonaer Münze zugehörig erklärten, um rechtliche Probleme mit dem Kreis wegen des Betriebs von mehr als einer 
        Münzstätte in ihrem Territorium zu vermeiden. Der Münzmeister der Münzstätte Altona war theoretisch als Münzmeister für beide holsteinisch-schauenburgische Münzstätten verantwortlich und der 
        jeweilige Münzmeister vor Ort war…
