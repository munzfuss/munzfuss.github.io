      de: VD im Gegenstempel wird von H. Ertel, Sammlung Wilhelm Kraaz. Münzen der deutschen Kipperzeit (1924) 4 Nr. 63 als 'Verdener Domkapitel' aufgelöst. Nach Grote (1867) bedeutet es jedoch 
        'Verder Doppelschilling'. Die Gegenstempel wurden ab 1624 auf die Kupfermünzen des verstorbenen Bischofs geschlagen, um diese gegen grobes Reichsgeld eintauschen zu können [so Grote (1867) 72 
        und Fiala (1919) 31]
