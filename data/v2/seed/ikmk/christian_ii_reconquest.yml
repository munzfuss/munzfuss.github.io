    _source_note:
      de: Die Klippe war ehemals gehenkelt (Henkel entfernt). - Christian II. wurde 1523 nach einer Erhebung des Adels in Dänemark und Norwegen zur Flucht in die Niederlande gezwungen. Sein Onkel 
        Friedrich I. folgte ihm auf den Thron. 1531 versuchte er die Rückeroberung Norwegens, gelangte aber nicht über Oslo hinaus und musste sich 1532 nach Dänemark in Gefangenschaft begeben, in der 
        er 1549 starb. Die Klippe wurde aus Kirchensilber geprägt, das die norwegischen Bischöfe Christian II. zur Verfügung stellten
