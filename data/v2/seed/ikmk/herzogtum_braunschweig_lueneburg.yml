    _source_note:
      de: Die Goldgulden des Herzogs Georg August von Braunschweig-Lüneburg, als Georg II. König von England (1727–1760), stellen einen Münztyp dar, der zwischen bestehenden Goldmünzen vermittelte. So
        galt ein bayerischer Maxdor (5,009 g Feingold) beispielsweise zwei Goldgulden oder vier Silbertaler nach dem 12-Talerfuß, ein Karolin (7,504 g Feingold) dagegen 3 Goldgulden bzw. 6 
        Silbertaler. Extra für die Goldprägung ließ Georg II. die Münze in Hannover nach Jahren der Schließung wieder instand setzen. Die günstigen Goldpreise ließen einen ansehnlichen Gewinn erhoffen
