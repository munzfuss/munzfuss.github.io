        Münzen von vornherein den älteren, leicht abgenutzten Dukaten im Wert anzupassen. Bei der geringen Auflage von 530 Exemplaren spielte die Münze im Geldumlauf keine Rolle, es war mehr ein 
        Erinnerungsstück, das u. a. den Bergbaubeamten bei Gehaltszahlungen ausgehändigt wurde
    note:
      de: Harzgolddukat
      en: Harzgolddukat
      uk: Harzgolddukat
