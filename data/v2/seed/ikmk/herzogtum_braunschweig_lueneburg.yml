      de: Jefimok (Plural Jefimki) ist die russische Bezeichnung für Taler (Jefim, russ. für Joachim; Jefimok = Joachimstaler). Der Handel mit diesen Talern war ein russisches Staatsmonopol. Aus dem 
        für eigene Münzprägungen angesammelten Staatsschatz wurden im Jahre 1655 europäische Talermünzen mit einem Kopekenstempel (Zar zu Pferde) und einem länglichen Stempel mit der Jahreszahl „1655“
        überstempelt und galten jeweils 64 Kopeken. 1659 wurden die Jefimki offiziell verboten, blieben aber vor allem in der Ukraine noch länger im Umlauf. Weniger als 2.000 der ursprünglich etwa 
        800.000 Jefimki haben sich…
