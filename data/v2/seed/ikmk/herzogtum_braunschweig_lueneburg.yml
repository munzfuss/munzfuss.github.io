      de: Speciestaler (oder Speziestaler) war die übliche Bezeichnung für tatsächlich ausgeprägte Talermünzen im 9-Talerfuß, im Gegensatz zu ideeller Rechnungsmünze oder Papiergeld, also bares Geld. 
        Zuerst wurde diese Bezeichnung auf die nach der Reichsmünzordnung von 1566 ausgeprägten Taler aus der feinen Gewichtsmark angewandt. Dieser braunschweigische Taler ist nach der Konvention von 
        1753 geprägt, wobei 10 Taler aus der feinen Mark geprägt wurden
