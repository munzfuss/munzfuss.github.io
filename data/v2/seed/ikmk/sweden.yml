    _source_note:
      de: Ulrika Eleonora, geboren 1688 in Stockholm, war die Tochter von König Karl XI. und Ulrika Eleonora der Älteren. Sie heiratete 1715 den Erbprinzen von Hessen-Kassel und wurde 1719 vom 
        Reichstag zur Königin gewählt. 1720 trat Ulrika Eleonora zugunsten ihres Gatten die Krone ab. Sie übernahm die Regierungsgeschäfte allerdings zeitweise bei Krankheit und Abwesenheit. Sie starb
        1741 kinderlos. Ihr Gatte war in erster Ehe mit Sophie Luise Dorothea von Preußen (1680-1705) verheiratet gewesen, einer Tochter von König Friedrich I. von Preußen
