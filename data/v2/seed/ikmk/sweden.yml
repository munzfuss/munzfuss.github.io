      de: Die Gedenkmünze ist auf den 300 Jahre bestehenden Religionsfrieden geprägt worden, allerdings erst im Jahre 1825. Die Auflage betrug 7.339 Stück. Der König, Jean Baptiste Bernadotte, war 
        Marschall Frankreichs und von Napoleon I. Gnaden Fürst von Ponte Corvo. Er war 1810 zum Kronprinzen von Schweden gewählt und von König Karl XIII. adoptiert worden. Nachdem der neue Kronprinz 
        bei Napoleon vergeblich die Abtretung Norwegens betrieben hatte, trat er auf die Seite der Alliierten gegen seine Heimat und konnte 1814 Norwegen an Schweden angliedern
