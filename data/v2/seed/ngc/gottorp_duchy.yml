          de: Das Korn des Reichsdukatenfußes, vom Katalog auf eine Müntze übertragen, die kein eigenes führt. Für keines der fünf Stücke gibt eine Quelle ein Korn an; Jensen 1971 nennt eines allein 
            für die unterlöthige Nachprägung um 1633.
          en: The Reichsdukatenfuß fineness, carried over by the catalogue to a coin that has none of its own. No source gives a fineness for any of the five; Jensen 1971 names one only for the 
            debased re-striking of c. 1633.
          uk: Проба Reichsdukatenfuß, перенесена каталогом на монету, яка власної не має. Проби для жодної з цих п'яти монет джерела не подають; Jensen 1971 називає її лише для зниженого 
            перекарбування близько 1633 р.
    weight_rough_g:
      - value: 3.5
        source: ngc
        erroneous:
          de: Der Krause-Band für Schleswig-Holstein setzt diesen Wert für alle Goldmüntzen an, die kein eigenes Gewicht führen; eine Wägung dieses Typus ist er nicht. Jensen 1971 wiegt vier Stücke 
            dieser Prägung zu 3,08 biß 3,22 g.
          en: The Krause volume for Schleswig-Holstein gives this figure for every gold coin that carries no weight of its own; it is not a weighing of this type. Jensen 1971 weighs four specimens of 
            this coinage at 3.08 to 3.22 g.
          uk: Том Краузе по Шлезвіг-Гольштейну подає це число для всіх золотих монет, які не мають власної ваги; виміром саме цього типу воно не є. Jensen 1971 зважує чотири екземпляри цього 
            карбування — від 3,08 до 3,22 г.
