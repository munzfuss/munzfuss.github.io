          був ще герцогом Готторпським; данський королівський титул він отримав лише 1523 р.»).\n[b]danskmoent.dk (Galster 124)[/b]: [i]«2 Skilling, Gottorp»[/i] … [i]«1523-33 og uden år»[/i] (перекл.:
