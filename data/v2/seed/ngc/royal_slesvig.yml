        de: "Diese Jahre gehören nicht zu diesem Typ. [b]NGC 167733 (MB 10)[/b] gibt 1514, 1520, 1522 wie der Typ MB 10, der beide Galster-Typen umfasst. Galster trennt die herzogliche Prägung (Galster
