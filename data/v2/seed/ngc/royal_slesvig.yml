          «2 Skilling, Gottorp» … «1523–33 und ohne Jahr»)."
        en: "These years do not belong to this type. [b]NGC 167733 (MB 10)[/b] gives 1514, 1520, 1522, as does the type MB 10, which covers both Galster types. Galster separates the ducal coinage (Galster
