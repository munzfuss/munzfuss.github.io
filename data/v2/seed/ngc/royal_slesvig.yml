        da: "Disse år hører ikke til denne type. [b]NGC 167733 (MB 10)[/b] angiver 1514, 1520, 1522 ligesom typen MB 10, der omfatter begge Galster-typer. Galster adskiller den hertugelige udmøntning (Galster
