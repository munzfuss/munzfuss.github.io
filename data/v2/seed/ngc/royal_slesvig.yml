          «2 Skilling, Gottorp» … «1523–33 and undated»)."
        uk: "Ці роки не належать до цього типу. [b]NGC 167733 (MB 10)[/b] подає 1514, 1520, 1522, як і тип MB 10, що охоплює обидва типи Galster. Galster відокремлює герцогське карбування (Galster 119,
          Husum) від королівського (Galster 124, Gottorp).\n[b]danskmoent.dk (Galster 119)[/b]: [i]«Frederik 1., 2 Skilling, Husum»[/i] … [i]«1514, 1518, 1520, 1522 og uden år»[/i], [i]«Mønten er slået,
