    note:
      de: Rheinischer Goldgulden, kein Dukat. Gekarbt zu Reinfeld 1618-1620, Müntzmeister Tobias Reinhardt. Gewogenes Stück 3,15 g (Kgl. Müntzkabinett Kopenhagen, GP 888, ex Mayntzhusen); zwei 
        Exemplare bekannt.
      en: A Rhenish Goldgulden, not a ducat. Struck at Reinfeld 1618-1620, mintmaster Tobias Reinhardt. Weighed specimen 3.15 g (Royal Coin Cabinet, Copenhagen, GP 888, ex Mayntzhusen); two specimens 
        known.
      uk: Рейнський голдгульден, не дукат. Карбовано в Райнфельді 1618-1620, мінцмейстер Tobias Reinhardt. Зважений екземпляр — 3,15 г (Королівський монетний кабінет, Копенгаген, GP 888, ex 
        Mayntzhusen); відомі два примірники.
    _curation_holds:
      ruler: From Jensen 1971's catalogue; the NGC record leaves it blank.
      mint: "From Jensen 1971's catalogue; the NGC record gives «Mint: N/A»."
      weight_rough_g: "The weighings and their per-specimen cabinet citations come from Jørgen Steen Jensen, «Hertug Hans den Yngre» (København 1971), Katalog nr. 2 and nr. 28, read from the copy danskmoent.dk
        publishes at https://www.danskmoent.dk/pdf2/JSJ_HdY.pdf (also in sources[]); the 3,22 g is the Künker 176 lot. They replace NGC/NumisMaster's 3.5 g, which is the Krause Schleswig-Holstein volume's
        blanket gold default rather than a measurement of this type — evidence and diagnostic in docs/SOURCES.md §13.15. §4 verified-wins: a source-attested weighing beats a catalogue default. Restoring
        the 3.5 g as an explicitly suspect attestation is the follow-up task recorded in docs/handoff.md 2026-09-04 (3). Carries the catalogue's 3,5 g as a ERRONEOUS reading (see its `erroneous` reason)
        rather than deleting it: a source's value may not be dropped because we judge it wrong — it stays visible and is excluded from Δ and the fine weight. Any accepted weighings beside it come from Jensen
        1971 / Künker, cited in sources[]."
      weight_rough_verified: true — Jensen 1971 / Künker weighings, beside the suspect catalogue default.
      fineness: "The standard's own 18½ Karat as a canonical anchor (§4), fineness_verified false — no source publishes a fineness for these issues. Written as 0,770833 = 18½/24, not the rounded .77: the
        karat is the primary value and the decimal its conversion, so a two-decimal fineness would move the target by 2,7 mg. The instrument is now named: Ferdinand I's edict of 19 August 1559 fixed the
        gulden at 72 pieces to the 18½-carat mark, and these ducal issues are imperial and post-edict."
      fineness_verified: false — canonical anchor, not a source reading.
      sources: Added Jensen 1971 / Jensen 2002 / Künker citations; keep across regen.
      note: Written from Jensen 1971 nr. 2 / nr. 28; keep across regen.
      verification_note: Explains the anchor to the reader.
