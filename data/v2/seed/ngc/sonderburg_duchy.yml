        ref: Künker 176 (29.09.2010) lot 5749, Slg. Siegfried Schierhorn → Oslo Myntgalleri 42 (09.05.2026) lot 414 — «Goldgulden 1624, Sonderburg oder Reinfeld. 3,22 g. Münzmeister Johann 
          Lilienthal», Fr. 3100
    verification_note:
      de: Kein Korn ist für diese Prägung überliefert; angesetzt ist das Korn des Fußes selbst, 18½ Karat nach dem Wormser Reichsabschied 1495.
      en: No fineness is recorded for this coinage; the figure shown is the standard's own 18½ carats per the Worms Reichsabschied of 1495.
      uk: Проби для цього карбування джерела не подають; наведено власну пробу стопи — 18½ карата за Вормським імперським рішенням 1495 р.
    _ngc_scope: schleswig_holstein_sonderburg
    _ngc_cuid: '1206707'
    _obverse: Crowned shields in inner circle
    _ngc_note: Fr#3100.
    _ngc_date_line: '1624'
    note:
      de: 'Rheinischer Goldgulden, kein Dukat. Müntzmeister Johan Lilliendahl, in zwei Stempelvarianten. Vier gewogene Stücke: 3,19 g (Landesbibliothek Schleswig-Holstein, Slg. Chr. Lange), 3,16 g (København,
        doppelt gekarbt) und 3,08 g (Bode-Museum Berlin), 3,22 g (Künker 176/5749). Zwei weitere Stücke, je eines beider Varianten, lagen in einem um 1633 verborgenen Goldgulden-Funde in Mitteldeutschland
        und kamen 1912 bei Kube in Berlin zur Auction. Um 1633 karbte Lilliendahl den Typus heimlich und unterlöthig nach.'
      en: "A Rhenish Goldgulden, not a ducat. Mintmaster Johan Lilliendahl, in two die variants. Four weighed specimens: 3.19 g (Schleswig-Holstein Landesbibliothek, Chr. Lange's collection), 3.16 g (Copenhagen,
        double-struck) and 3.08 g (Bode-Museum Berlin), 3.22 g (Künker 176/5749). Two further pieces, one of each variant, lay in a Goldgulden hoard in central Germany deposited c. 1633 and were sold at
        Kube, Berlin, in 1912. Around 1633 Lilliendahl struck the type again clandestinely and below standard."
      uk: 'Рейнський голдгульден, не дукат. Мінцмейстер Johan Lilliendahl, у двох штемпельних варіантах. Чотири зважені екземпляри: 3,19 г (Ландесбібліотека Шлезвіг-Гольштейну, збірка Chr. Lange), 3,16
        г (Копенгаген, подвійне карбування) і 3,08 г (Bode-Museum, Берлін), 3,22 г (Künker 176/5749). Ще два примірники, по одному кожного варіанта, лежали в скарбі голдгульденів у центральній Німеччині,
        закладеному близько 1633 р., і пішли з аукціону Kube в Берліні 1912 р. Близько 1633 р. Lilliendahl потайки перекарбував цей тип у зниженій пробі.'
    _curation_holds:
      ruler: From Jensen 1971's catalogue; the NGC record leaves it blank.
      mint: "From Jensen 1971's catalogue; the NGC record gives «Mint: N/A»."
      weight_rough_g: "The weighings and their per-specimen cabinet citations come from Jørgen Steen Jensen, «Hertug Hans den Yngre» (København 1971), Katalog nr. 2 and nr. 28, read from the copy danskmoent.dk
        publishes at https://www.danskmoent.dk/pdf2/JSJ_HdY.pdf (also in sources[]); the 3,22 g is the Künker 176 lot. They replace NGC/NumisMaster's 3.5 g, which is the Krause Schleswig-Holstein volume's
        blanket gold default rather than a measurement of this type — evidence and diagnostic in docs/SOURCES.md §13.15. §4 verified-wins: a source-attested weighing beats a catalogue default. Restoring
        the 3.5 g as an explicitly suspect attestation is the follow-up task recorded in docs/handoff.md 2026-09-04 (3). Carries the catalogue's 3,5 g as a ERRONEOUS reading (see its `erroneous` reason)
        rather than deleting it: a source's value may not be dropped because we judge it wrong — it stays visible and is excluded from Δ and the fine weight. Any accepted weighings beside it come from Jensen
        1971 / Künker, cited in sources[]."
      weight_rough_verified: true — Jensen 1971 / Künker weighings, beside the suspect catalogue default.
      fineness: "The standard's own 18½ Karat as a canonical anchor (§4), fineness_verified false — no source publishes a fineness for these issues. Written as 0,770833 = 18½/24, not the rounded .77: the
        karat is the primary value and the decimal its conversion, so a two-decimal fineness would move the target by 2,7 mg. The instrument is now named: Ferdinand I's edict of 19 August 1559 fixed the
        gulden at 72 pieces to the 18½-carat mark, and these ducal issues are imperial and post-edict."
      fineness_verified: false — canonical anchor, not a source reading.
      sources: Added Jensen 1971 / Jensen 2002 / Künker citations; keep across regen.
      note: Written from Jensen 1971 nr. 2 / nr. 28; keep across regen.
      verification_note: Explains the anchor to the reader.
