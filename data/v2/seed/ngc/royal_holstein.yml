          uk: Зсунута кома. [b]Hede 16[/b] і [b]ucoin[/b] подають .375; 2,809 г × .375 = 1,0534 г, рівно 1/24 від 25,28 г чистого срібла Speciedaler за 9¼-Thaler-Fuß. [b]NumisMaster[/b] друкує .0375, 
            [b]NGC World Coin Price Guide[/b] бере це значення звідти.
          da: Et forskudt komma. [b]Hede 16[/b] og [b]ucoin[/b] angiver .375; 2,809 g × .375 = 1,0534 g, nøjagtig 1/24 af de 25,28 g finsølv i en speciedaler efter 9¼-Thaler-Fuß. [b]NumisMaster[/b] 
            trykker .0375, og [b]NGC World Coin Price Guide[/b] overtager tallet derfra.
