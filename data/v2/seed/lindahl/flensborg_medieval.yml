    note:
      de: 'Vs.: MONETA HOLSASCIE, zwei Leoparden; Rs.: CIVITAS FLENSBVRG, Kreuz mit Kleeblatt in der Mitte<sup>[ref:lindahl-1955-flensborg-viertelwitten-340]</sup>. In der Form des Kreuzes entspricht der
        Typ genau den lübischen Müntzen vor und nach dem Rezeß von 1379<sup>[ref:lindahl-1955-korsform-lybske]</sup>. Lindahl nennt das Nominal «Viertelwitten», Nöbbe «Penning eller 1/4 Witten» («Pfennig
        oder ¼ Witten»)<sup>[ref:noebbe-1930-penning-kvart-witten]</sup>, Hauberg beschreibt den Typ als «Topenning» («Zweipfennig»)<sup>[ref:hauberg-1886-topenning]</sup>. Flensborger Müntze ist im Handlungsbuch
        des Lübecker Kaufmanns Wittenborg unter 1359 verzeichnet; 1360 galten lübische und Flensborger «denarii argentei» («Silberpfennige», d. h. Witten) als gleichwertig<sup>[ref:noebbe-1930-flensborg-1359-1360]</sup>.
        Im Dezember 1367 befaßte sich der Hansetag in Lübeck mit dem minderwertigen Geld, und im März 1369 beschloß er, Geld aus Kiel, Flensborg und Itzehoe in den Städten nicht anzunehmen<sup>[ref:noebbe-1930-flensborg-1367-1369]</sup>.'
      en: 'Obv.: MONETA HOLSASCIE, two leopards; rev.: CIVITAS FLENSBVRG, cross with a clover leaf in the centre<sup>[ref:lindahl-1955-flensborg-viertelwitten-340]</sup>. In the form of the cross the type
        corresponds closely to the Lübeck coins before and after the recess of 1379<sup>[ref:lindahl-1955-korsform-lybske]</sup>. Lindahl calls the denomination «Viertelwitten» («quarter Witten»), Nöbbe
        «Penning eller 1/4 Witten» («penny or ¼ Witten»)<sup>[ref:noebbe-1930-penning-kvart-witten]</sup>, Hauberg describes the type as a «Topenning» («two-penny»)<sup>[ref:hauberg-1886-topenning]</sup>.
        Flensborg coin is entered in the account book of the Lübeck merchant Wittenborg under 1359; in 1360 Lübeck and Flensborg «denarii argentei» («silver pennies», i.e. Witten) were held to be of equal
        value<sup>[ref:noebbe-1930-flensborg-1359-1360]</sup>. In December 1367 the Hanseatic diet at Lübeck discussed the less valuable money, and in March 1369 it resolved that money from Kiel, Flensborg
        and Itzehoe should not be accepted in the towns<sup>[ref:noebbe-1930-flensborg-1367-1369]</sup>.'
      uk: "Аверс: MONETA HOLSASCIE, два леопарди; реверс: CIVITAS FLENSBVRG, хрест із листком конюшини в центрі<sup>[ref:lindahl-1955-flensborg-viertelwitten-340]</sup>. Формою хреста тип точно відповідає
        любецьким монетам до і після рецесу 1379 р.<sup>[ref:lindahl-1955-korsform-lybske]</sup> Lindahl називає номінал «Viertelwitten» («чверть віттена»), Nöbbe — «Penning eller 1/4 Witten» («пфеніг,
        або ¼ віттена»)<sup>[ref:noebbe-1930-penning-kvart-witten]</sup>, Hauberg описує цей тип як «Topenning» («двопфеніговик»)<sup>[ref:hauberg-1886-topenning]</sup>. Монету Flensborg записано в торговій
        книзі любецького купця Wittenborg під 1359 р.; 1360 р. любецькі й фленсборзькі «denarii argentei» («срібні пфеніги», тобто віттени) вважалися однаковими за вартістю<sup>[ref:noebbe-1930-flensborg-1359-1360]</sup>.
        У грудні 1367 р. ганзейський з'їзд у Lübeck розглядав менш вартісні гроші, а в березні 1369 р. ухвалив не приймати в містах гроші з Kiel, Flensborg та Itzehoe<sup>[ref:noebbe-1930-flensborg-1367-1369]</sup>."
      da: 'Forside: MONETA HOLSASCIE, to leoparder; bagside: CIVITAS FLENSBVRG, kors med kløverblad i midten<sup>[ref:lindahl-1955-flensborg-viertelwitten-340]</sup>. I korsets form svarer typen nøje til
        de lybske mønter før og efter recessen 1379<sup>[ref:lindahl-1955-korsform-lybske]</sup>. Lindahl kalder nominalen «Viertelwitten», Nöbbe «Penning eller 1/4 Witten»<sup>[ref:noebbe-1930-penning-kvart-witten]</sup>,
        Hauberg beskriver typen som «Topenning»<sup>[ref:hauberg-1886-topenning]</sup>. Flensborg mønt er opført i den lybske købmand Wittenborgs handelsbog under 1359; i 1360 regnedes lybske og flensborgske
        «denarii argentei» (witten) for lige meget værd<sup>[ref:noebbe-1930-flensborg-1359-1360]</sup>. I december 1367 behandlede hansedagen i Lübeck de mindre værdifulde penge, og i marts 1369 besluttede
        den, at penge fra Kiel, Flensborg og Itzehoe ikke skulle modtages i stæderne<sup>[ref:noebbe-1930-flensborg-1367-1369]</sup>.'
