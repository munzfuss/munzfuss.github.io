    note:
      de: 'Vs.: MONETA HOLTSACIE; Rs.: CIVITAS FLENSBVRGEN; auf beiden Seiten zwei Leoparden im Schild, darüber drei oder zwei Punkte oder Ringe<sup>[ref:lindahl-1955-flensborg-dreling-427]</sup>. Der Typ
        entspricht ganz den lübischen Dreilingen<sup>[ref:noebbe-1930-dreiling-lybaek]</sup>. Er ist die häufigste der mittelalterlichen Müntzen Flensborgs: allein der Fund von Aarhus enthielt 119 Stück,
        etwa 20 Stempel lassen sich nachweisen<sup>[ref:noebbe-1930-dreiling-almindeligste]</sup>. Mit ihm bricht die kurze Reihe der mittelalterlichen Müntzen Flensborgs ab<sup>[ref:noebbe-1930-raekke-afbrydes]</sup>.'
      en: 'Obv.: MONETA HOLTSACIE; rev.: CIVITAS FLENSBVRGEN; on both sides two leopards in a shield, above it three or two dots or rings<sup>[ref:lindahl-1955-flensborg-dreling-427]</sup>. The type corresponds
        entirely to the Lübeck Dreilinge<sup>[ref:noebbe-1930-dreiling-lybaek]</sup>. It is the commonest of Flensborg’s medieval coins: the Aarhus hoard alone contained 119 pieces, and about 20 dies can
        be identified<sup>[ref:noebbe-1930-dreiling-almindeligste]</sup>. With it the short series of Flensborg’s medieval coins breaks off<sup>[ref:noebbe-1930-raekke-afbrydes]</sup>.'
      uk: 'Аверс: MONETA HOLTSACIE; реверс: CIVITAS FLENSBVRGEN; на обох боках два леопарди в щиті, над ним три або дві крапки чи кільця<sup>[ref:lindahl-1955-flensborg-dreling-427]</sup>. Тип цілком подібний
        до любецьких дрейлінгів<sup>[ref:noebbe-1930-dreiling-lybaek]</sup>. Це найпоширеніша із середньовічних монет Flensborg: лише в скарбі з Aarhus виявлено 119 штук, відомо близько 20 штемпелів<sup>[ref:noebbe-1930-dreiling-almindeligste]</sup>.
        Нею уривається короткий ряд середньовічних монет Flensborg<sup>[ref:noebbe-1930-raekke-afbrydes]</sup>.'
      da: 'Forside: MONETA HOLTSACIE; bagside: CIVITAS FLENSBVRGEN; på begge sider to leoparder i skjold, hvorover tre eller to punkter eller ringe<sup>[ref:lindahl-1955-flensborg-dreling-427]</sup>. Typen
        svarer ganske til de lybske dreilinge<sup>[ref:noebbe-1930-dreiling-lybaek]</sup>. Den er den almindeligste af Flensborgs middelaldermønter: alene Aarhusfundet indeholdt 119 stykker, og omtrent
        20 stempler kan påvises<sup>[ref:noebbe-1930-dreiling-almindeligste]</sup>. Med den afbrydes den korte række af Flensborgs middelaldermønter<sup>[ref:noebbe-1930-raekke-afbrydes]</sup>.'
