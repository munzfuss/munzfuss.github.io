    note:
      de: 'Vs.: CIVITAS RENGNI, gekrönter Leopard nach links; Rs.: MONETA RIPENS, Kreuz mit einem Leoparden in jedem Winkel<sup>[ref:lindahl-1955-ribe-witten-692]</sup>. Die Vorderseitenumschrift ist in
        drei Varianten bekannt — CIVITAS RENGNI, CIVITAS REGNI, CIVITAS IN REGNO («Stadt im Königreich») —, die nach Märcher auf eine städtische Ausmüntzung weisen<sup>[ref:maercher-2018-ribe-byudmoentning]</sup>;
        die Form RENGNI zeigt, daß der Stempelschneider kaum Latein konnte<sup>[ref:maercher-2018-ribe-rengni]</sup>. Die Rückseite ahmt die norddeutschen Witten der 1370er Jahre nach, besonders die lüneburgischen<sup>[ref:maercher-2018-ribe-bagside-witten]</sup>.
        Es ist die erste dänische Müntze nach dem Ende der Pfennigprägung im 14. Jahrhundert<sup>[ref:maercher-2018-ribe-foerste-moent]</sup>.'
      en: 'Obv.: CIVITAS RENGNI, crowned leopard to the left; rev.: MONETA RIPENS, cross with a leopard in each angle<sup>[ref:lindahl-1955-ribe-witten-692]</sup>. The obverse legend is known in three variants
        — CIVITAS RENGNI, CIVITAS REGNI, CIVITAS IN REGNO («town in the kingdom») — which according to Märcher point to a town coinage<sup>[ref:maercher-2018-ribe-byudmoentning]</sup>; the form RENGNI shows
        that the die-cutter hardly knew Latin<sup>[ref:maercher-2018-ribe-rengni]</sup>. The reverse imitates the North German Witten of the 1370s, above all those of Lüneburg<sup>[ref:maercher-2018-ribe-bagside-witten]</sup>.
        It is the first Danish coin after the end of the penny coinage in the 14th century<sup>[ref:maercher-2018-ribe-foerste-moent]</sup>.'
      uk: 'Аверс: CIVITAS RENGNI, коронований леопард ліворуч; реверс: MONETA RIPENS, хрест із леопардом у кожному куті<sup>[ref:lindahl-1955-ribe-witten-692]</sup>. Легенда аверсу відома у трьох варіантах
        — CIVITAS RENGNI, CIVITAS REGNI, CIVITAS IN REGNO («місто в королівстві»), — що, за Märcher, указують на міське карбування<sup>[ref:maercher-2018-ribe-byudmoentning]</sup>; форма RENGNI свідчить,
        що різьбяр штемпеля навряд чи знав латину<sup>[ref:maercher-2018-ribe-rengni]</sup>. Реверс наслідує північнонімецькі віттени 1370-х рр., передусім люнебурзькі<sup>[ref:maercher-2018-ribe-bagside-witten]</sup>.
        Це перша данська монета після припинення карбування пфенігів у XIV ст.<sup>[ref:maercher-2018-ribe-foerste-moent]</sup>'
      da: 'Forside: CIVITAS RENGNI, kronet leopard til venstre; bagside: MONETA RIPENS, kors med leopard i hver vinkel<sup>[ref:lindahl-1955-ribe-witten-692]</sup>. Forsidens omskrift kendes i tre varianter
        — CIVITAS RENGNI, CIVITAS REGNI, CIVITAS IN REGNO («by i kongeriget») — der ifølge Märcher peger på en byudmøntning<sup>[ref:maercher-2018-ribe-byudmoentning]</sup>; formen RENGNI viser, at stempelskæreren
        næppe var latinkyndig<sup>[ref:maercher-2018-ribe-rengni]</sup>. Bagsiden efterligner de nordtyske witten fra 1370’erne, især de lüneburgske<sup>[ref:maercher-2018-ribe-bagside-witten]</sup>. Det
        er den første danske mønt efter ophøret af penningudmøntningen i 1300-tallet<sup>[ref:maercher-2018-ribe-foerste-moent]</sup>.'
