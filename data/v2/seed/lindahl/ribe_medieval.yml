    note:
      de: 'Vs.: CIVITAS RENGNI, gekrönter Leopard nach links; Rs.: MONETA RIPENS, Kreuz mit einem Leoparden in jedem Winkel<sup>[ref:lindahl-1955-ribe-witten-692]</sup>. Die Vorderseitenumschrift kommt
        in drei Varianten vor — CIVITAS RENGNI, CIVITAS REGNI, CIVITAS IN REGNO —, die «Stadt im Königreich» bedeuten und nach Märcher auf eine städtische Ausmüntzung weisen<sup>[ref:maercher-2018-ribe-byudmoentning]</sup>.
        Die Form RENGNI zeigt nach Märcher, daß der Stempelschneider kaum Latein konnte<sup>[ref:maercher-2018-ribe-rengni]</sup>. Lindahl versteht die Umschrift als Gegenstück zur «moneta holtzatiensis»
        («holsteinische Müntze») der holsteinischen Städte, zu denen auch Flensborg gehört<sup>[ref:lindahl-1955-civitas-regni-modstykke]</sup>. Die Rückseite ahmt die norddeutschen Witten der 1370er Jahre
        nach, besonders die lüneburgischen, teils die hamburgischen<sup>[ref:maercher-2018-ribe-bagside-witten]</sup>; den Anstoß gab nach Märcher wohl die nahe Prägung in Flensborg<sup>[ref:maercher-2018-ribe-flensburg-skub]</sup>.
        Es ist die erste dänische Müntze nach dem Ende der Pfennigprägung im 14. Jahrhundert<sup>[ref:maercher-2018-ribe-foerste-moent]</sup>. Ernst verbindet den Beginn der Ausmüntzung damit, daß der Rat
        von Ribe nach der Rückgabe Ribes an den König 1373 die Vogtei («advocatio») erwarb<sup>[ref:ernst-1948-ribe-witten-advocatio]</sup> und am wahrscheinlichsten zugleich das Müntzrecht<sup>[ref:ernst-1948-ribe-witten-moentret]</sup>;
        eine gewisse Stütze dieser Datierung sieht er im Siegel «Secretum burgensium de Ripen» («Sekretsiegel der Bürger von Ribe»), dessen Leopard auffallend an den des Witten erinnert und das zuerst 1377
        bezeugt ist<sup>[ref:ernst-1948-ribe-witten-secretum]</sup>. Nach Ernst war die Ausmüntzung von nicht geringem Umfang; die dänischen Funde mit dieser Müntze hat Galster beschrieben<sup>[ref:ernst-1948-ribe-witten-omfang]</sup>,
        bekannt ist sie auch aus einer Reihe deutscher Funde<sup>[ref:ernst-1948-ribe-witten-tyske-fund]</sup>.'
      en: 'Obv.: CIVITAS RENGNI, crowned leopard to the left; rev.: MONETA RIPENS, cross with a leopard in each angle<sup>[ref:lindahl-1955-ribe-witten-692]</sup>. The obverse legend occurs in three variants
        — CIVITAS RENGNI, CIVITAS REGNI, CIVITAS IN REGNO — meaning «town in the kingdom», which according to Märcher point to a town coinage<sup>[ref:maercher-2018-ribe-byudmoentning]</sup>. According
        to Märcher, the form RENGNI shows that the die-cutter hardly knew Latin<sup>[ref:maercher-2018-ribe-rengni]</sup>. Lindahl takes the legend as a counterpart to the «moneta holtzatiensis» («Holstein
        coin») of the Holstein towns, Flensborg among them<sup>[ref:lindahl-1955-civitas-regni-modstykke]</sup>. The reverse imitates the North German Witten of the 1370s, above all those of Lüneburg, partly
        those of Hamburg<sup>[ref:maercher-2018-ribe-bagside-witten]</sup>; according to Märcher, the impulse probably came from the nearby coinage at Flensborg<sup>[ref:maercher-2018-ribe-flensburg-skub]</sup>.
        It is the first Danish coin after the end of the penny coinage in the 14th century<sup>[ref:maercher-2018-ribe-foerste-moent]</sup>. Ernst links the start of the coinage to the council of Ribe acquiring
        the bailiwick («advocatio») after Ribe was returned to the King in 1373<sup>[ref:ernst-1948-ribe-witten-advocatio]</sup>, most probably together with the right of coinage<sup>[ref:ernst-1948-ribe-witten-moentret]</sup>;
        he finds some support for this dating in the seal «Secretum burgensium de Ripen» («secret seal of the burgesses of Ribe»), whose leopard strikingly recalls that of the Witten and which is first
        attested in 1377<sup>[ref:ernst-1948-ribe-witten-secretum]</sup>. According to Ernst, the coinage was of no small extent; the Danish hoards with this coin were described by Galster<sup>[ref:ernst-1948-ribe-witten-omfang]</sup>,
        and it is also known from a number of German hoards<sup>[ref:ernst-1948-ribe-witten-tyske-fund]</sup>.'
      uk: "Аверс: CIVITAS RENGNI, коронований леопард ліворуч; реверс: MONETA RIPENS, хрест із леопардом у кожному куті<sup>[ref:lindahl-1955-ribe-witten-692]</sup>. Легенда аверсу трапляється у трьох варіантах
        — CIVITAS RENGNI, CIVITAS REGNI, CIVITAS IN REGNO, — що означають «місто в королівстві» і, за Märcher, указують на міське карбування<sup>[ref:maercher-2018-ribe-byudmoentning]</sup>. Форма RENGNI,
        за Märcher, свідчить, що різьбяр штемпеля навряд чи знав латину<sup>[ref:maercher-2018-ribe-rengni]</sup>. Lindahl розглядає цю легенду як протиставлення до «moneta holtzatiensis» («гольштейнська
        монета») гольштейнських міст, серед яких і Flensborg<sup>[ref:lindahl-1955-civitas-regni-modstykke]</sup>. Реверс наслідує північнонімецькі віттени 1370-х рр., передусім люнебурзькі, почасти гамбурзькі<sup>[ref:maercher-2018-ribe-bagside-witten]</sup>;
        поштовх до карбування, за Märcher, імовірно, дало близьке карбування у Flensborg<sup>[ref:maercher-2018-ribe-flensburg-skub]</sup>. Це перша датська монета після припинення карбування пфенігів у
        XIV ст.<sup>[ref:maercher-2018-ribe-foerste-moent]</sup> Ernst пов'язує початок карбування з тим, що після повернення Ribe королю 1373 р. рада міста здобула фогтство («advocatio»)<sup>[ref:ernst-1948-ribe-witten-advocatio]</sup>,
        а з ним, найімовірніше, і монетне право<sup>[ref:ernst-1948-ribe-witten-moentret]</sup>; певну опору для цього датування він бачить у печатці «Secretum burgensium de Ripen» («таємна печатка городян
        Ribe»), леопард якої разюче нагадує леопарда віттена і яку вперше засвідчено 1377 р.<sup>[ref:ernst-1948-ribe-witten-secretum]</sup> За Ernst, карбування мало немалий обсяг; датські скарби з цією
        монетою описав Galster<sup>[ref:ernst-1948-ribe-witten-omfang]</sup>, відома вона й з низки німецьких скарбів<sup>[ref:ernst-1948-ribe-witten-tyske-fund]</sup>."
      da: 'Forside: CIVITAS RENGNI, kronet leopard til venstre; bagside: MONETA RIPENS, kors med leopard i hver vinkel<sup>[ref:lindahl-1955-ribe-witten-692]</sup>. Forsidens omskrift findes i tre varianter
        — CIVITAS RENGNI, CIVITAS REGNI, CIVITAS IN REGNO — der betyder «by i kongeriget» og ifølge Märcher peger på en byudmøntning<sup>[ref:maercher-2018-ribe-byudmoentning]</sup>. Formen RENGNI viser
        ifølge Märcher, at stempelskæreren næppe var latinkyndig<sup>[ref:maercher-2018-ribe-rengni]</sup>. Lindahl opfatter omskriften som modstykke til de holstenske stæders «moneta holtzatiensis», hvortil
        også Flensborg hører<sup>[ref:lindahl-1955-civitas-regni-modstykke]</sup>. Bagsiden efterligner de nordtyske witten fra 1370’erne, især de lüneburgske, til dels de hamborgske<sup>[ref:maercher-2018-ribe-bagside-witten]</sup>;
        skubbet kom ifølge Märcher nok fra den nærliggende udmøntning i Flensborg<sup>[ref:maercher-2018-ribe-flensburg-skub]</sup>. Det er den første danske mønt efter ophøret af penningudmøntningen i
        1300-tallet<sup>[ref:maercher-2018-ribe-foerste-moent]</sup>. Ernst forbinder udmøntningens begyndelse med, at rådet i Ribe efter byens tilbagegivelse til kongen i 1373 erhvervede fogderiet («advocatio»)<sup>[ref:ernst-1948-ribe-witten-advocatio]</sup>
        og mest sandsynligt samtidig møntretten<sup>[ref:ernst-1948-ribe-witten-moentret]</sup>; en vis støtte for dateringen ser han i seglet «Secretum burgensium de Ripen», hvis leopard slående minder
        om wittens, og som første gang kendes brugt i 1377<sup>[ref:ernst-1948-ribe-witten-secretum]</sup>. Ifølge Ernst var udmøntningen af et ikke ringe omfang; de danske fund med mønten er beskrevet
        af Galster<sup>[ref:ernst-1948-ribe-witten-omfang]</sup>, og den kendes også fra en række tyske fund<sup>[ref:ernst-1948-ribe-witten-tyske-fund]</sup>.'
