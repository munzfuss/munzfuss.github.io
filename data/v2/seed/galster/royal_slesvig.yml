  - id: dk-galster-f1g-122
    fuss: seed_unsorted
    phase: galster
    kind: kurant
    nominal: 1 Rhinsk gylden
    year_label: '1531'
    year_first: 1531
    year_last: 1531
    year_ranges:
      -   - 1531
          - 1531
    year_verified: true
    ruler: Frederik I
    mint: Gottorp
    catalog:
      galster: '122'
      schou: 1-4
      galster_volume: f1g
    metal: gold
    fineness: 0.75
    weight_rough_g:
      - value: 3.19
        source: galster
        template:
          de: 'Wahrscheinlich kein Wägebefund: dieselben 3,19 g stehen bei allen Goldgulden 1527–1536 und entsprechen der Sollgröße, die Galster aus Reynold Junges Rechnung errechnet (72 Stück aus einer
            Marck von rund 230 g; Galster 1934, S. XVI). Gewicht eines gewogenen Stücks ist es nach den vorliegenden Angaben nicht erwiesen.'
          en: "Probably not a weighing: the same 3.19 g is given for every gold gulden of 1527–1536 and equals the target weight Galster computes from Reynold Junge's account (72 pieces to a mark of about
            230 g; Galster 1934, p. XVI). That it is the weight of a weighed specimen is not shown by the available data."
          uk: 'Імовірно, не результат зважування: ті самі 3,19 г стоять при всіх гульденах 1527–1536 рр. і дорівнюють цільовій вазі, яку Galster обчислює з рахунку Reynold Junge (72 штуки з марки близько
            230 г; Galster 1934, с. XVI). Що це вага зваженого екземпляра, наявні дані не показують.'
          da: 'Formentlig ikke en vejning: de samme 3,19 g står ved alle guldgylden 1527–1536 og svarer til den målvægt, Galster beregner ud fra Reynold Junges regnskab (72 stykker af en mark på omkring
            230 g; Galster 1934, s. XVI). At det er vægten af et vejet eksemplar, viser de foreliggende data ikke.'
