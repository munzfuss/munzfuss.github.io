          значень хибне, з джерела невідомо.
        da: Appendikset hos Eriksson 2017 trykker møntstedet «Malmö» for nr. 28, 30, 32, 35, 36, 41, 45, 46, 47, mens Galster nummer 32 hører til møntstedet København (Eriksson, tab. 1, efter Galster 
          1972). Hvilken af de to angivelser der er forkert, vides ikke ud fra kilden.
