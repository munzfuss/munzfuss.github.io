      reason:
        de: Der Anhang bei Eriksson 2017 druckt für Nr. 49 die Münzstätte «Malmö», die Galster-Nummer 35 gehört aber zur Münzstätte Aalborg (Eriksson, Tab. 1, nach Galster 1972). Welche der beiden 
          Angaben falsch ist, ist aus der Quelle nicht bekannt.
        en: The appendix of Eriksson 2017 prints the mint «Malmö» for no. 49, while Galster number 35 belongs to the Aalborg mint (Eriksson, tab. 1, after Galster 1972). Which of the two is wrong is 
          not known from the source.
        uk: Додаток Eriksson 2017 друкує для № 49 двір «Malmö», тоді як номер Galster 35 належить двору Ålborg (Eriksson, табл. 1, за Galster 1972). Котре з двох значень хибне, з джерела невідомо.
        da: Appendikset hos Eriksson 2017 trykker møntstedet «Malmö» for nr. 49, mens Galster nummer 35 hører til møntstedet Ålborg (Eriksson, tab. 1, efter Galster 1972). Hvilken af de to angivelser 
          der er forkert, vides ikke ud fra kilden.
    _mint_uncertain: true
