        da: Appendikset hos Eriksson 2017 trykker møntstedet «Malmö» for nr. 49, mens Galster nummer 35 hører til møntstedet Ålborg (Eriksson, tab. 1, efter Galster 1972). Hvilken af de to angivelser 
          der er forkert, vides ikke ud fra kilden.
