    _source_errata:
      - field: ruler
        printed: Gaute Ivarsson
        correct: Hans
        curator: serg
        reason: "Curator (Serhii) 2026-10-20: Galster 159 / Schou 220 is a royal Nidaros striking per Ernst (NNÅ 1940) and danskmoent (Galster 159, «Hans, Hvid, Nidaros»); Bruun's Gaute Ivarsson kept as
          a suspect (*) alternative via ruler_mark."
    _errata_applied:
      - field: ruler
        printed: Gaute Ivarsson
        correct: Hans
    ruler_mark:
      kind: suspect
      value: Gaute Ivarsson
      reason:
        de: 'Umstrittene Zuweisung. Bruun (Part III, Los 12031) schreibt diesen Hvid Erzbischof Gaute Ivarsson von Nidaros zu, wie früher C. T. Jørgensen (Nr. 33). Ernst (NNÅ 1940) hält den Typ mit gekröntem
          O, der Umschrift «Sanctus Olavus» und der Axt im Schild (Schou 220) für eine königliche Prägung in Nidaros: Die erzbischöflichen Münzen tragen den Titel des Erzbischofs oder kirchliche Zeichen,
          dieser Typ trägt keines von beiden. Danskmoent (Galster 159) führt die Münze unter Hans. Welche Zuweisung zutrifft, ist aus den Quellen nicht abschließend geklärt.'
        en: "A disputed attribution. Bruun (Part III, lot 12031) gives this Hvid to Archbishop Gaute Ivarsson of Nidaros, as C. T. Jørgensen (no. 33) did earlier. Ernst (NNÅ 1940) takes the type with a
          crowned O, the legend «Sanctus Olavus» and the axe in a shield (Schou 220) for a royal striking at Nidaros: the archiepiscopal coins carry the archbishop's title or church insignia, and this type
          carries neither. Danskmoent (Galster 159) lists the coin under Hans. Which attribution is right is not settled by the sources."
        uk: 'Спірне віднесення. Bruun (Part III, лот 12031) приписує цей hvid архієпископу Nidaros Gaute Ivarsson, як раніше C. T. Jørgensen (№ 33). Ernst (NNÅ 1940) вважає тип із коронованим O, написом
          «Sanctus Olavus» і сокирою в щиті (Schou 220) королівським карбуванням у Nidaros: архієпископські монети мають титул архієпископа або церковні знаки, а на цьому типі немає ні того, ні іншого.
          Danskmoent (Galster 159) подає монету під Hans. Яке з віднесень правильне, у джерелах остаточно не встановлено.'
        da: 'En omstridt henførelse. Bruun (Part III, lot 12031) henfører denne hvid til ærkebiskop Gaute Ivarsson af Nidaros, som tidligere C. T. Jørgensen (nr. 33). Ernst (NNÅ 1940) anser typen med kronet
          O, omskriften «Sanctus Olavus» og øksen i skjold (Schou 220) for en kongelig udmøntning i Nidaros: de ærkebispelige mønter bærer ærkebispens titel eller kirkelige tegn, og denne type bærer ingen
          af delene. Danskmoent (Galster 159) fører mønten under Hans. Hvilken henførelse der er rigtig, er ikke endeligt afgjort ud fra kilderne.'
