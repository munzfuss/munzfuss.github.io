    fuss: seed_unsorted
    phase: kmk
    kind: kurant
    issuing_entity: gottorp_duchy
    entity_classified_via: mint
    nominal: 1 Rhinsk gylden
    metal: gold
    metal_verified: true
    mint_verified: false
    ruler: Christian 3
    weight_rough_verified: false
    _curation_holds:
      mint_verified: 'Curator call 2026-08-20 (Serhii), re-affirmed 2026-09-10 (Option Z): demoted to false so the Roskilde reading wins the merged mint. Found flipped back to true (regen violated this
        hold) and re-demoted. KMM prints place=Gottorp, and that is kept verbatim as the museum record — but it is Galster''s attribution, which danskmoent corrects on the Galster-131 page: «Roskilde, af
        Galster fejlagtigt henfoert til Gottorp». Galster and KMM are therefore one reading heard twice, not two witnesses. The only source that argues rather than labels is Stack''s Bowers lot 14258 (Bruun
        Part II, p. 296): despite the reverse legend MON NOVA AVREA SLESVICENSIS, «a payment of around 350 ounces of gold was received at Copenhagen Castle on November 30, 1536 and transported to Roskilde
        to be minted into Goldgulden as payment for the troops». Per §4 the verified-tier accumulator (_collect_mints) would otherwise union both, putting the corrected misattribution back into the render
        as mint: [Gottorp, Roskilde]. If regen flips this back to true the Gottorp reading returns to the Denmark page.'
    verified: false
    sources:
      - type: museum
        url: https://samlinger.natmus.dk/KMM/object/81473
        ref: KMM 81473 (Inv. GP 888.51)
    mint_mark:
      kind: erroneous
      reason:
        de: "Falsche Münzstätte. [b]KMM 81473[/b] gibt «Gottorp» an.\n[b]danskmoent.dk (Galster 131)[/b]: [i]«Christian 3., 1 Rhinsk gylden, 1536 Roskilde, af Galster fejlagtigt henført til Gottorp»[/i]
          (Übers.: «Christian III., 1 Rhinsk gylden, 1536 Roskilde, von Galster irrtümlich Gottorp zugewiesen»).\n[b]Bruun Part II, lot 14258[/b]: [i]«Although the legend on the reverse states “MON NOVA
          AVREIA SLESVICENSIS” this coin was probably minted in Roskilde»[/i] (Übers.: «Obwohl die Umschrift der Rückseite ‹MON NOVA AVREIA SLESVICENSIS› lautet, wurde diese Münze wahrscheinlich in Roskilde
          geprägt»)."
        en: "Wrong mint. [b]KMM 81473[/b] gives «Gottorp».\n[b]danskmoent.dk (Galster 131)[/b]: [i]«Christian 3., 1 Rhinsk gylden, 1536 Roskilde, af Galster fejlagtigt henført til Gottorp»[/i] (transl.:
          «Christian III, 1 Rhinsk gylden, 1536 Roskilde, wrongly assigned to Gottorp by Galster»).\n[b]Bruun Part II, lot 14258[/b]: [i]«Although the legend on the reverse states “MON NOVA AVREIA SLESVICENSIS”
          this coin was probably minted in Roskilde»[/i]."
        uk: "Помилкове місце карбування. [b]KMM 81473[/b] подає «Gottorp».\n[b]danskmoent.dk (Galster 131)[/b]: [i]«Christian 3., 1 Rhinsk gylden, 1536 Roskilde, af Galster fejlagtigt henført til Gottorp»[/i]
          (перекл.: «Крістіан III, 1 рейнський гульден, 1536 Roskilde, Galster помилково відніс до Gottorp»).\n[b]Bruun Part II, lot 14258[/b]: [i]«Although the legend on the reverse states “MON NOVA AVREIA
          SLESVICENSIS” this coin was probably minted in Roskilde»[/i] (перекл.: «Хоча легенда реверсу — ‹MON NOVA AVREIA SLESVICENSIS›, монету, імовірно, карбовано в Roskilde»)."
        da: "Forkert møntsted. [b]KMM 81473[/b] angiver «Gottorp».\n[b]danskmoent.dk (Galster 131)[/b]: [i]«Christian 3., 1 Rhinsk gylden, 1536 Roskilde, af Galster fejlagtigt henført til Gottorp»[/i].\n\
          [b]Bruun Part II, lot 14258[/b]: [i]«Although the legend on the reverse states “MON NOVA AVREIA SLESVICENSIS” this coin was probably minted in Roskilde»[/i] (overs.: «Selv om bagsidens omskrift
          lyder ‹MON NOVA AVREIA SLESVICENSIS›, er mønten sandsynligvis slået i Roskilde»)."
      value: Gottorp
