    mint_mark:
      kind: suspect
      reason:
        de: "Prägeort nach KMM.\n[b]danskmoent.dk (Hede 23)[/b] nach Sømod: [i]«C'et er kronet og at mønten derfor må være præget i kongeriget (Malmø)»[/i] (Übers.: «das C ist gekrönt, daher muss die Münze
          im Königreich (Malmø) geprägt sein»); in Schleswig und Holstein war der König nur Herzog, und Herzogskronen sind auf Münzen nicht bekannt.\n[b]Nöbbe (NNÅ 1938)[/b] zählt den Blaffert mit gekröntem
          C zu den Flensburger Prägungen, nach danskmoent.dk [i]«uden særlige argumenter»[/i] (Übers.: «ohne besondere Argumente»). Ein Fund, der die Zuweisung entscheidet, ist nicht bekannt."
        en: "Mint as given by KMM.\n[b]danskmoent.dk (Hede 23)[/b] after Sømod: [i]«C'et er kronet og at mønten derfor må være præget i kongeriget (Malmø)»[/i] (transl.: «the C is crowned, so the coin must
          have been struck in the kingdom (Malmø)»); in Schleswig and Holstein the king was only duke, and ducal crowns are not known on coins.\n[b]Nöbbe (NNÅ 1938)[/b] counts the blaffert with the crowned
          C among the Flensborg strikes, according to danskmoent.dk [i]«uden særlige argumenter»[/i] (transl.: «without particular arguments»). No find that settles the attribution is known."
        uk: "Місце карбування за KMM.\n[b]danskmoent.dk (Hede 23)[/b] за Sømod: [i]«C'et er kronet og at mønten derfor må være præget i kongeriget (Malmø)»[/i] (перекл.: «C коронований, тож монету мусили
          карбувати в королівстві (Malmø)»); у Шлезвігу й Гольштейні король був лише герцогом, а герцогських корон на монетах не знають.\n[b]Nöbbe (NNÅ 1938)[/b] зараховує блаферт із коронованим C до флензбурзьких
          карбувань, за danskmoent.dk [i]«uden særlige argumenter»[/i] (перекл.: «без особливих аргументів»). Знахідки, яка розв'язала б атрибуцію, не відомо."
        da: "Møntsted efter KMM.\n[b]danskmoent.dk (Hede 23)[/b] efter Sømod: [i]«C'et er kronet og at mønten derfor må være præget i kongeriget (Malmø)»[/i]; i Slesvig og Holsten var kongen kun hertug,
          og hertugkroner kendes ikke på mønter.\n[b]Nöbbe (NNÅ 1938)[/b] regner blafferten med det kronede C til de flensborgske prægninger, ifølge danskmoent.dk [i]«uden særlige argumenter»[/i]. Et fund,
          der afgør henførelsen, kendes ikke."
    _curation_holds:
      mint_mark: 'Curator 2026-11-08: KMM Flensborg marked suspect after Sømod (crowned C = kingdom, Malmø), danskmoent.dk c3h23.'
