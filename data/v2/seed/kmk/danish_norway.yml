            bagside: værdiangivelse»[/i] (Übers.: «1 Skilling, Kongsberg … Vorderseite: Monogramm, Rückseite: Wertangabe»)."
          en: "The Hede number does not belong to this coin.\n[b]KMM photo[/b]: portrait, crown, «8 S», «1700».\n[b]danskmoent.dk (Hede Norge 6)[/b]: [i]«8 Skilling, Kongsberg 1700-1715 … Forside: portræt,
