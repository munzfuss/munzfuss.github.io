  - id: kmk-122077
    fuss: seed_unsorted
    phase: kmk
    kind: kurant
    issuing_entity: danish_norway
    entity_classified_via: nation
    nominal: 4 Skilling
    metal_verified: false
    mint_verified: false
    ruler: Frederik 4
    ruler_mark:
      kind: erroneous
      value: Frederik 4
      reason:
        de: "Die Münze wurde unter Frederik VI geschlagen.\n[b]Foto KMM[/b]: Kupfer, «4 SKILLING COURANT 1810», Kongsberger Hämmer.\n[b]danskmoent.dk (Hede Norge 3, Frederik 6.)[/b]: [i]«4 Skilling, Kongsberg
          Kobber … C) 1810 (RRR); (Hede Norge 3, Schou 1, Sieg Norge 5)»[/i] (Übers.: «4 Skilling, Kongsberg, Kupfer … C) 1810 (RRR); (Hede Norge 3, Schou 1, Sieg Norge 5)»).\n[b]L. E. Bruuns Mønt- og Medaillesamling
          (1928), S. 330[/b], Abschnitt «1808 – Frederik VI – 1814», 1810: [i]«Fireskilling af Kobber»[/i] (Übers.: «Vierschilling aus Kupfer»), Schou 1."
        en: "The coin was struck under Frederik VI.\n[b]KMM photo[/b]: copper, «4 SKILLING COURANT 1810», Kongsberg hammers.\n[b]danskmoent.dk (Hede Norge 3, Frederik 6.)[/b]: [i]«4 Skilling, Kongsberg
          Kobber … C) 1810 (RRR); (Hede Norge 3, Schou 1, Sieg Norge 5)»[/i] (transl.: «4 Skilling, Kongsberg, copper … C) 1810 (RRR); (Hede Norge 3, Schou 1, Sieg Norge 5)»).\n[b]L. E. Bruuns Mønt- og
          Medaillesamling (1928), p. 330[/b], section «1808 – Frederik VI – 1814», 1810: [i]«Fireskilling af Kobber»[/i] (transl.: «four-skilling of copper»), Schou 1."
        uk: "Монету карбовано за Frederik VI.\n[b]Фото KMM[/b]: мідь, «4 SKILLING COURANT 1810», молотки Kongsberg.\n[b]danskmoent.dk (Hede Norge 3, Frederik 6.)[/b]: [i]«4 Skilling, Kongsberg Kobber …
          C) 1810 (RRR); (Hede Norge 3, Schou 1, Sieg Norge 5)»[/i] (перекл.: «4 скілінги, Kongsberg, мідь … C) 1810 (RRR); (Hede Norge 3, Schou 1, Sieg Norge 5)»).\n[b]L. E. Bruuns Mønt- og Medaillesamling
          (1928), с. 330[/b], розділ «1808 – Frederik VI – 1814», 1810: [i]«Fireskilling af Kobber»[/i] (перекл.: «чотирискілінговик із міді»), Schou 1."
        da: "Mønten er slået under Frederik 6.\n[b]Foto KMM[/b]: kobber, «4 SKILLING COURANT 1810», Kongsberg-hamre.\n[b]danskmoent.dk (Hede Norge 3, Frederik 6.)[/b]: [i]«4 Skilling, Kongsberg Kobber …
          C) 1810 (RRR); (Hede Norge 3, Schou 1, Sieg Norge 5)»[/i].\n[b]L. E. Bruuns Mønt- og Medaillesamling (1928), s. 330[/b], afsnittet «1808 – Frederik VI – 1814», 1810: [i]«Fireskilling af Kobber»[/i],
          Schou 1."
