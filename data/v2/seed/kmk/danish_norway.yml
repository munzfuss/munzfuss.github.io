            værdiangivelse»[/i] (transl.: «1 Skilling, Kongsberg … obverse: monogram, reverse: value»)."
          uk: "Номер Hede не належить цій монеті.\n[b]Фото KMM[/b]: портрет, корона, «8 S», «1700».\n[b]danskmoent.dk (Hede Norge 6)[/b]: [i]«8 Skilling, Kongsberg 1700-1715 … Forside: portræt, bagside:
            krone»[/i] (перекл.: «8 скілінгів, Kongsberg 1700-1715 … аверс: портрет, реверс: корона»).\n[b]danskmoent.dk (Hede Norge 8)[/b]: [i]«1 Skilling, Kongsberg … Forside: monogram, bagside: værdiangivelse»[/i]
            (перекл.: «1 скілінг, Kongsberg … аверс: монограма, реверс: позначення вартості»)."
          da: "Hede-nummeret hører ikke til denne mønt.\n[b]Foto KMM[/b]: portræt, krone, «8 S», «1700».\n[b]danskmoent.dk (Hede Norge 6)[/b]: [i]«8 Skilling, Kongsberg 1700-1715 … Forside: portræt, bagside:
            krone»[/i].\n[b]danskmoent.dk (Hede Norge 8)[/b]: [i]«1 Skilling, Kongsberg … Forside: monogram, bagside: værdiangivelse»[/i]."
