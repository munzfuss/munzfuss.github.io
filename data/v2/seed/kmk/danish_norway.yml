    weight_rough_g:
      - value: 0.501
        source: kmk
        suspect:
          de: "Deutlich unter dem Gewicht der beiden Schwesterstücke derselben Nummer (1.023 g und 1.412 g). Bei dünnem, niedrighaltigem Silber dieser Jahre ist ein solcher Verlust durch Beschneiden, Korrosion
            oder Bruch möglich, und das Verzeichnis nennt keinen Erhaltungszustand — als Wägewert dieses Stückes bleibt die Angabe stehen, als Typengewicht ist sie nicht brauchbar."
          en: "Well below what the two sister pieces of the same number weigh (1.023 g and 1.412 g). On thin, base silver of these years such a loss to clipping, corrosion or breakage is possible, and the
            record states no condition — so the figure stands as the weight of this piece, but it cannot serve as the weight of the type."
          uk: "Істотно нижче за вагу двох сестринських екземплярів того самого номера (1.023 г і 1.412 г). Для тонкого низькопробного срібла цих років така втрата через обрізання, корозію чи злам можлива,
            а запис не подає стану збереження — тож як вага цього екземпляра значення лишається, але за вагу типу служити не може."
    weight_rough_verified: false
    catalog:
      hede: 70E
    verified: false
    sources:
      - type: museum
        url: https://samlinger.natmus.dk/KMM/object/394045
        ref: KMM 394045 (Inv. FP 4227.1677)
    _curation_holds:
      weight_rough_g: "0.501 g flagged SUSPECT (curator 2026-09-12): well below the sister specimens of Hede 70E (1.023 / 1.412 g). Retained per CLAUDE.md §4 — a source value is never deleted — and suspect
        rather than erroneous because nothing demonstrates it wrong: KMM records no condition, and clipping or corrosion of thin base silver could account for it. Stays in the arithmetic and renders (*).
        It also keeps the group's own spread below the 2.5x hard gate, which had been splitting this type across unified entries."
      weight_rough_verified: "false — the reading is the museum's own, but it is not representative of the type."
